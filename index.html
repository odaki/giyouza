  ctx.fillStyle = 'rgba(2,4,8,0.7)';
  ctx.fillRect(0, 0, W, H);
  for (const g of o.items) drawOneItem(g);
  if (o.step >= 1) {
    /* 透明度は_updateBossDefeatOutroが確定させたo.msgAlphaを読むだけ。
       描画本体は達成側と共通（_drawOutroMsg参照） */
    _drawOutroMsg(o, '#e8e2d0', 'rgba(0,0,0,0.9)');
  }
  /* タップ待ちにせず時間経過で自動的に戻るため、CONTINUEバッジは出さない */
  ctx.restore();
}

/* ════════════════ サウンドテスト ════════════════
   市販ゲームでよくある「クリア後に解禁されるサウンドテスト」。真エンディングを一度見ると
   タイトルにボタンが出る（trueEndingSeen、エンディング再生ボタンの右隣）。
   曲・効果音・再生速度の演出を1画面で確かめられる。
   効果音の試聴は?cheatpanelではなくこの独立したモードに置く（デバッグ用パネルに20個以上の
   ボタンを並べると本来のチート操作が埋もれる）。
   このモード中はゲームの更新を止め（update参照）、全面を暗幕で覆う。
   トロフィー・ポーズは隠し、ミュートと全画面だけ残す（音を止めたい場面があるため） */
const ST_ROW_H = 24, ST_GAP = 3, ST_SECT_GAP = 14, ST_LABEL_H = 15;

/* 曲。bufを持つものはループ再生（バッファを差し替えて鳴らす）、onceは一回きり。
   ボス戦BGMの4段階は、鳴り比べができると調整に効く（段1が最も凶暴） */
const ST_MUSIC = [
  { label: '通常BGM',            buf: () => bgmBuffer },
  { label: 'ボスBGM 段1 凶暴',    buf: () => bossBgmBuffers && bossBgmBuffers[0] },
  { label: 'ボスBGM 段2',        buf: () => bossBgmBuffers && bossBgmBuffers[1] },
  { label: 'ボスBGM 段3',        buf: () => bossBgmBuffers && bossBgmBuffers[2] },
  { label: 'ボスBGM 段4 穏やか',  buf: () => bossBgmBuffers && bossBgmBuffers[3] },
  { label: '起動ジングル',        once: () => playStartJingle(null) },
  { label: 'エンディングテーマ',   once: () => _playTrueEndingTheme() },
];
/* 再生速度の演出。鳴っている曲に対して掛ける（曲を止めていると効かないものがある） */
const ST_CTRL = [
  { label: '停止',       act: () => _stStopAll() },
  { label: 'テープ再生',  act: () => startBGMTape(1400) },
  { label: 'テープ停止',  act: () => stopBGMTape(1300) },
  { label: 'スロー',     act: () => rampBGMRate(0.5, 1200, 'easeOut') },
  { label: '通常速度',    act: () => rampBGMRate(1.0, 800, 'easeIn') },
];

/* 効果音の表示名。内部名（SE_TABLEのキー）は呼び出し側の都合で付いた識別子で、
   camelCaseとsnake_case・英語と略語が混在している。内部名のままで困っていな
   かったのは人目に触れなかったからで、サウンドテストで並べる以上は読み物として
   揃える必要がある。表示は日本語の名詞句に統一し、文脈が要るものは
   「文脈 空白 内容」の形に揃える（予兆 地鳴り／勝利 飛び去る／4打目 発射）。
   内部名は各所の呼び出しに使われている識別子なのでそのままにし、
   「見えない側の識別子」と「見える側の表記」を分ける。 */
const SE_LABEL = {
  bet:               'BET変更',
  shoot:             '矢を放つ',
  reach:             'リーチ',
  medium:            '中当たり',
  jackpot:           '大当たり',
  reachJackpot:      'リーチ大当たり',
  miss:              'ハズレ',
  coin:              'コイン獲得',
  ach:               '実績解除',
  gameOver:          'ゲームオーバー',
  slowHand:          'スローハンド',
  bossRumble:        '予兆 地鳴り',
  bossFlash:         '予兆 雷鳴',
  kingAppear:        'キング登場',
  kingMark:          '的をマーク',
  kingFire:          '4打目 発射',
  kingBeam:          'ビーム着弾',
  kingBeamDud:       'ビーム不発',
  kingCrack:         '的にひび',
  kingSift:          '篩い落とし',
  kongariComplete:   'こんがり達成',
  kingVictoryInhale: '勝利 息を吸う',
  kingVictoryFly:    '勝利 飛び去る',
};
/* 並び順もゲームの進行順に揃える（内部名のアルファベット順や実装順ではなく、
   聴き比べたい順に並べる）。SE_TABLEに足したのにここへ入れ忘れたものは
   「未分類」として最後にまとめて出す＝一覧から消えることはない */
const ST_SE_GROUPS = [
  { label: '効果音（通常）', names: ['bet', 'shoot', 'reach', 'medium', 'jackpot', 'reachJackpot',
                                     'miss', 'coin', 'ach', 'gameOver', 'slowHand'] },
  { label: '効果音（キング戦）', names: ['bossRumble', 'bossFlash', 'kingAppear', 'kingMark',
                                         'kingFire', 'kingBeam', 'kingBeamDud', 'kingCrack',
                                         'kingSift', 'kongariComplete', 'kingVictoryInhale',
                                         'kingVictoryFly'] },
];
function _stSeSections() {
  const listed = new Set();
  const secs = ST_SE_GROUPS.map(g => {
    const names = g.names.filter(n => SE_TABLE[n]);
    for (const n of names) listed.add(n);
    return { label: g.label, names };
  });
  const rest = SE_NAMES.filter(n => !listed.has(n));
  if (rest.length) secs.push({ label: '効果音（未分類）', names: rest });
  return secs;
}
function _seLabel(name) { return SE_LABEL[name] ?? name; }
/* SE_DUCK_BGM側と同じ理由の整合チェック（表示名だけ古い名前で残っていないか）。
   逆向き（SE_TABLEにあるのに表示名が無い）はサウンドテストの「未分類」で見える */
for (const _n of Object.keys(SE_LABEL)) if (!SE_TABLE[_n]) console.warn('SE_LABEL: SE_TABLEに無い名前', _n);

let _soundTest = null;      // { items } 入場時に組んだ配置（毎フレーム作らない）
let _stNowPlaying = -1;     // 再生中の曲のindex（ST_MUSIC基準。-1=なし）

/* 解禁されているか。真エンディングを一度見ていれば解禁（市販ゲームの作法）。
   ?soundtest を付けた場合は未視聴でも出す（SOUND_TEST_FORCE参照） */
function _soundTestUnlocked() { return trueEndingSeen || SOUND_TEST_FORCE; }

/* 鳴っているものを全部止め、再生速度とグレースケールも通常へ戻す。
   ここはランプにしない: 直後にソースを破棄するのでランプが渡り切らず、
   _startTrueEnding(replay)と同じ「フェードを挟まず即座に無音化」の作法にする。
   最後にbgmGainを1へ戻すのが要点で、これを忘れると次に鳴らすものが無音になる。
   起動ジングルはbgmGain経由（scheduleJingle参照）で、停止のたびに0のままだと
   ジングルだけ聞こえない、という不具合を実際に出した。ゲーム本編へ戻ったあとの
   開始ジングルも同じ経路なので、モードを出るときにも1へ戻っている必要がある */
function _stStopAll() {
  _setBgmGainNow(0);
  _destroyBGMSource();      // フェード無しで即座に破棄（上のコメント参照）
  stopJingle();
  _stopTrueEndingTheme(0.2); // こちらは専用gain経由なので余韻を残して落とす
  _setBgmGainNow(1);        // 戻し忘れると次に鳴らすものが無音になる（_setBgmGainNow参照）
  _stNowPlaying = -1;
  grayRateTarget = 1.0; grayRateCur = 1.0;
}

/* ループものを鳴らす。startBGM()は「今のゲーム状況に応じたバッファ」を選ぶので使えず、
   指定バッファで作り直す（_createBGMSourceがloopEndと_bgmIsBossを面倒見る） */
function _stPlayLoop(i, buf) {
  if (!audioCtx) return;
  _stStopAll();
  const src = _createBGMSource(1.0, buf);
  if (!src) return;
  src.start();
  bgmPhaseRef = audioCtx.currentTime;
  _bgmAccumReset();
  _stNowPlaying = i;
}

function _stPlayMusic(i) {
  const m = ST_MUSIC[i];
  if (m.once) { _stStopAll(); m.once(); _stNowPlaying = i; return; }
  const buf = m.buf();
  if (!buf) return;              // まだ焼けていない（描画側で「準備中」と出す）
  _stPlayLoop(i, buf);
}

/* 配置。縦画面と横画面で列数を変え、全体を上下中央へ寄せる。
   ボタンは type/key/label を自分で持ち、描画と判定は同じ配列をなぞるだけにする */
function _stBuildLayout() {
  const wide = W >= 700;
  const secs = [
    { label: '音楽', kind: 'music', keys: ST_MUSIC.map((m, i) => i),
      labels: ST_MUSIC.map(m => m.label), cols: wide ? 4 : 2 },
    { label: '再生', kind: 'ctrl', keys: ST_CTRL.map((c, i) => i),
      labels: ST_CTRL.map(c => c.label), cols: wide ? 5 : 3 },
  ];
  for (const se of _stSeSections()) {
    secs.push({ label: se.label, kind: 'se', keys: se.names,
                labels: se.names.map(_seLabel), cols: wide ? 6 : 3 });
  }
  const rowsOf = sec => Math.ceil(sec.keys.length / sec.cols);
  let total = 30; // 見出し「サウンドテスト」
  for (const sec of secs) total += ST_LABEL_H + rowsOf(sec) * (ST_ROW_H + ST_GAP) + ST_SECT_GAP;
  total += ST_ROW_H + 6; // もどる
  const items = [];
  let y = Math.max(46, (H - total) / 2 + 30);
  for (const sec of secs) {
    items.push({ type: 'label', label: sec.label, x: 12, y, w: W - 24, h: ST_LABEL_H });
    y += ST_LABEL_H;
    const w = (W - 24 - ST_GAP * (sec.cols - 1)) / sec.cols;
    for (let i = 0; i < sec.keys.length; i++) {
      items.push({ type: sec.kind, key: sec.keys[i], label: sec.labels[i],
                   x: 12 + (i % sec.cols) * (w + ST_GAP),
                   y: y + ((i / sec.cols) | 0) * (ST_ROW_H + ST_GAP), w, h: ST_ROW_H });
    }
    y += rowsOf(sec) * (ST_ROW_H + ST_GAP) + ST_SECT_GAP;
  }
  items.push({ type: 'pads', label: 'ドラムパッド', x: W / 2 - 130, y, w: 120, h: ST_ROW_H });
  items.push({ type: 'back', label: 'もどる',      x: W / 2 + 10,  y, w: 120, h: ST_ROW_H });
  return items;
}

function _startSoundTest() {
  showAchievements = false;
  phase = 'soundTest';
  _soundTest = { items: _stBuildLayout() };
  _stNowPlaying = -1;
  if (!audioCtx) getAudioCtx();
  /* ボス戦BGMの4段階は通常なら時間をおいて順に焼かれる。ここでは聴きに来ている
     ので待たせずに焼き始める（既に焼けていれば何もしない） */
  _scheduleBossBgmRenders(true);
}

function _exitSoundTest() {
  _stStopAll();
  _soundTest = null;
  phase = 'startup';
  /* 「もどる」のタップはこのモードの分岐が消費し切るので、指を離す側で
     STARTを踏むことはない（touchendが見るのは入場・START用のフラグだけ）。
     _startupGuardUntil はページ読み込み直後の誤爆よけで、ここでは触らない */
}

function _soundTestClick(x, y) {
  if (hitTest(MUTE_BTN, x, y)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
  for (const it of _soundTest.items) {
    if (it.type === 'label' || !hitTest(it, x, y)) continue;
    if (it.type === 'back') { _exitSoundTest(); return; }
    if (it.type === 'pads') { _stStopAll(); _startDrumPad(); return; }
    if (it.type === 'ctrl') { ST_CTRL[it.key].act(); return; }
    if (it.type === 'se')   { playSE(it.key); return; }
    if (it.type === 'music') {
      if (it.key === _stNowPlaying) _stStopAll(); // もう一度押したら止める
      else _stPlayMusic(it.key);
      return;
    }
  }
}

function drawSoundTest() {
  if (phase !== 'soundTest' || !_soundTest) return;
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,10,0.92)';
  ctx.fillRect(0, 0, W, H);
  const top = _soundTest.items[0].y;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `bold ${IS_PORTRAIT ? 20 : 24}px ${FONT_MIN}`;
  ctx.fillStyle = Y;
  ctx.fillText('サウンドテスト', W / 2, top - 24);
  for (const it of _soundTest.items) {
    if (it.type === 'label') {
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = `bold 11px sans-serif`;
      ctx.fillStyle = 'rgba(245,208,32,0.75)';
      ctx.fillText(it.label, it.x, it.y + it.h / 2);
      continue;
    }
    let label = it.label, enabled = true, on = false;
    if (it.type === 'music') {
      const m = ST_MUSIC[it.key];
      enabled = m.once ? true : !!m.buf();
      if (!enabled) label += '（準備中）';
      on = (it.key === _stNowPlaying);
    }
    ctx.fillStyle = on ? 'rgba(180,140,0,0.85)' : enabled ? 'rgba(30,30,40,0.95)' : 'rgba(20,20,24,0.8)';
    ctx.fillRect(it.x, it.y, it.w, it.h);
    ctx.strokeStyle = on ? Y : enabled ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.strokeRect(it.x + 0.5, it.y + 0.5, it.w - 1, it.h - 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 11px sans-serif`;
    ctx.fillStyle = enabled ? '#fff' : 'rgba(255,255,255,0.35)';
    ctx.fillText(label, it.x + it.w / 2, it.y + it.h / 2);
    if (enabled) _drawPressFlash(it, 0); // 面が直角なので光も直角
  }
  ctx.restore();
}

/* ════════════════ ドラムパッド ════════════════
   サウンドテストから入る演奏モード。4x4のパッドを叩いて鳴らし、尺を固定した
   パターンシーケンサ（ルーパー）へレイヤーを重ねていける。
   音色は新規に作らず、キング戦で使っているTR/TB系の発音関数をそのまま叩く。
   GUIはAKAI MPC・Roland SPシリーズの佇まい（ベベルの効いた4x4パッド・機種名
   プレート・LCD窓・大きなジョグ）を借り、色はゲームの意匠（金と濃緑）で通す。
   ジョグと銘板には丸いギヨウザロゴをそのまま使う。

   叩いた音そのものは常に即時・無補正で鳴らす（タイミング精度がこの作品の手触りなので、
   入力は補正しない）。クオンタイズは演奏の道具として明示的に選ぶ機能で、記録は生の時刻の
   まま・再生時に丸めるだけの非破壊方式にする（_dpQuantBeat参照。OFFに戻せば叩いたままの
   演奏が戻る）。 */
const DP_PAD_GAP = 8;
/* 叩いた光の減衰。長さはボタンの押下フラッシュと同じ（60fps換算のフレーム数）。
   パッドだけフレームで数えるのは、光が「発音」に紐づいていて映像が進んでいない間は
   消えないほうが正しいため（_dpDrawPads は再生中の自動発光にも同じ光を使う） */
const DP_FLASH_FRAMES = Math.round(BTN_PRESS_FLASH_SEC * 60);
const DP_JOG_BEZEL = 7;        // ジョグ外周の縁の幅（当たり判定もここまで）
const DP_JOG_DAMP = 0.94;      // ジョグの回転減衰
const DP_JOG_KICK = 0.10;      // 1打ぶんの回し量の基準（左2列は逆回り。_dpHit参照）
const DP_JOG_REF_DUR = 0.22;   // 回し量の基準になる音長（普通の打点1発ぶん）
/* 回し量を音の長さに連動させる係数。短い音はちょっとだけ、長い音は長めに回す。
   音長をそのまま倍率にすると RIM(0.03秒) と DORA(2.85秒) で95倍も開いて
   どちらかが使い物にならないので、平方根で圧縮して 0.3〜3倍に収める。
   回し量は積算した速度に足すため、大きいほど「速く・長く」回る */
function _dpJogScale(dur) {
  return Math.max(0.3, Math.min(3, Math.sqrt(dur / DP_JOG_REF_DUR)));
}

/* 4x4。配列は画面の上段から並べる（上段=ベース、下段=キック/スネア）。
   gainはパッドごとの音量補正。各音はBGMの中での相対バランスで決めた値なので、単体で叩くと
   ピークが0.058〜1.83と32倍もばらつく（オフラインレンダで実測）。
   min(0.80/ピーク, 0.12/RMS) で「潰れない上限」と「聴感の大きさ」の両方を満たす倍率を出す。
   長い音（ACID・DORA・ベース）はピークではなくRMSが、短い打点（CLAP・BLAST）はピークが効く。
   実機のサンプリングレート（96kHz）でも測り直してあり、ノイズ系（CH/OH）はピークが上がる
   ぶん低め、CLAPは3連バーストでピークだけ立ってRMSが痩せるぶん高めにしてある。
   結果はピーク0.23〜0.90・RMS0.06〜0.12に収まっている。ここは耳で微調整してよい。
   durは可聴長（ピークから-60dBまで落ちる秒数）の実測値で、ジョグの回し量に使う
   （_dpJogScale参照）。音を差し替えたらここも測り直すこと */
const DRUM_PADS = [
  { name: 'BASS C', tag: 'TB', gain: 1.46, dur: 0.25, hit: (c, t, d) => _playBossBassMel(c, noteHz('C', 2), t, 0.26, 0.5, d) },
  { name: 'BASS E', tag: 'TB', gain: 1.46, dur: 0.25, hit: (c, t, d) => _playBossBassMel(c, noteHz('E', 2), t, 0.26, 0.5, d) },
  { name: 'BASS G', tag: 'TB', gain: 1.46, dur: 0.26, hit: (c, t, d) => _playBossBassMel(c, noteHz('G', 2), t, 0.26, 0.5, d) },
  { name: 'BASS A', tag: 'TB', gain: 1.45, dur: 0.26, hit: (c, t, d) => _playBossBassMel(c, noteHz('A', 2), t, 0.26, 0.5, d) },
  { name: 'KIN',    tag: 'FX', gain: 1.22, dur: 0.24, hit: (c, t, d) => _playKingCrackKin(c, t, d) },
  { name: 'BLAST',  tag: 'FX', gain: 0.63, dur: 0.73, hit: (c, t, d) => _playKingBlast(c, t, d) },
  { name: 'DORA',   tag: 'FX', gain: 0.56, dur: 2.85, hit: (c, t, d) => _playDoraHit(c, t, d) },
  { name: 'ACID',   tag: 'TB', gain: 4.10, dur: 1.18, hit: (c, t, d) => _playGroundRumble(c, t, d, 0) },
  { name: 'CH',     tag: 'TR', gain: 1.30, dur: 0.04, hit: (c, t, d) => _playKingHat(c, t, d, false) },
  { name: 'OH',     tag: 'TR', gain: 0.90, dur: 0.22, hit: (c, t, d) => _playKingHat(c, t, d, true) },
  { name: 'RIM',    tag: 'TR', gain: 3.37, dur: 0.03, hit: (c, t, d) => _playRimshot(c, t, d, 0.16) },
  { name: 'CONGA',  tag: 'TR', gain: 1.47, dur: 0.15, hit: (c, t, d) => _playConga(c, t, d, 0.40) },
  { name: 'KICK',   tag: 'TR', gain: 0.64, dur: 0.13, hit: (c, t, d) => _playKick(c, t, d, 1.0) },
  { name: 'TAIKO',  tag: 'TR', gain: 0.63, dur: 0.22, hit: (c, t, d) => _playTaikoHit(c, t, d, 'strong') },
  { name: 'SNARE',  tag: 'TR', gain: 0.79, dur: 0.34, hit: (c, t, d) => _playKingBeamHit(c, t, d) },
  { name: 'CLAP',   tag: 'TR', gain: 0.60, dur: 0.15, hit: (c, t, d) => _playKingCue(c, t, d) },

let _dp = null;            // { pads, back, size, flash, lastName, jogRot, jogSpin, hits }
let _dpPadSprites = null;  // パッド16枚の焼き込み（毎フレームのパス＋文字描画を避ける）

/* ロゴの左右に並ぶ操作ボタンの形。SP-404の面ボタンに倣う:
     ・左右の列は互いに鏡像
     ・片側の上下のボタンは互いに鏡像（上下対称）
     ・3つのうち中央は長方形
     ・角は丸い / 面の質感は16パッドと同じ
   丸いディスプレイを囲む配置なので、円が細くなる上下では内側へ食い込み、
   円が最も太くなる中央では退がる。その差が上下ボタンの傾きになる。
   **上下のボタンは平行四辺形**で、外側の辺はロゴ側の辺と並行に倒れる
   （外側だけ垂直の台形ではない）。中央だけが長方形。
   当たり判定は外接矩形のまま（指の当たりを狭めない） */
const DP_BTN_SKEW = 14;

/* 角を丸めた多角形のパス（凸多角形向け）。斜辺のある形にも同じ丸めが乗る */
function _dpRoundPoly(pts, r) {
  const n = pts.length;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const v1x = p0[0] - p1[0], v1y = p0[1] - p1[1];
    const v2x = p2[0] - p1[0], v2y = p2[1] - p1[1];
    const l1 = Math.hypot(v1x, v1y) || 1, l2 = Math.hypot(v2x, v2y) || 1;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = p1[0] + v1x / l1 * rr, ay = p1[1] + v1y / l1 * rr;
    const bx = p1[0] + v2x / l2 * rr, by = p1[1] + v2y / l2 * rr;
    if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
    ctx.quadraticCurveTo(p1[0], p1[1], bx, by);
  }
  ctx.closePath();
}

/* ボタンの外形。shape: 'rect' / 'topL' / 'botL' / 'topR' / 'botR'
   L列は左辺が、R列は右辺が外側（垂直）で、内側の辺が斜めになる */
function _dpBtnPoly(c, inset) {
  const k = DP_BTN_SKEW;
  const x = c.x + inset, y = c.y + inset;
  const w = c.w - inset * 2, h = c.h - inset * 2;
  /* 平行四辺形は2種類だけ。左上と右下、左下と右上がそれぞれ同じ形になる
     （平行四辺形は左右反転と上下反転が同じ形になるので、鏡像の条件を満たす） */
  switch (c.shape) {
    case 'topL': case 'botR':
      return [[x + k, y], [x + w, y], [x + w - k, y + h], [x, y + h]];
    case 'botL': case 'topR':
      return [[x, y], [x + w - k, y], [x + w, y + h], [x + k, y + h]];
    case 'midL': return [[x, y], [x + w - k, y], [x + w - k, y + h], [x, y + h]];
    case 'midR': return [[x + k, y], [x + w, y], [x + w, y + h], [x + k, y + h]];
    default:     return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  }
}

/* 任意のコンテキストへ角丸パスを引く（グローバルのroundRectはctx固定のため） */
function _dpRoundPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);            c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);        c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);            c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

/* パッド1枚を焼き込む。MPCのゴムパッドのように、上が明るく下が暗い縦グラデに
   内側の白ベベルと外側の影を重ねる */
function _dpBuildPadSprite(pad, size) {
  const oc = _mkCache(size * _dpr, size * _dpr);
  const c = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  /* 面の色と描き順は操作ボタンと共通（_dpDrawFace）。輪郭はパッド固有の寸法で引く */
  _dpDrawFace(c, 0, size, {
    fill:  () => _dpRoundPath(c, 1,   1,   size - 2, size - 2, 10),
    bevel: () => _dpRoundPath(c, 3,   3,   size - 6, size - 6, 8),
    edge:  () => _dpRoundPath(c, 0.5, 0.5, size - 1, size - 1, 10),
  });
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `bold ${Math.round(size * 0.155)}px sans-serif`;
  c.fillStyle = 'rgba(245,208,32,0.92)';
  c.fillText(pad.name, size / 2, size * 0.62);
  c.textAlign = 'left';
  c.font = `bold ${Math.round(size * 0.10)}px sans-serif`;
  c.fillStyle = 'rgba(245,208,32,0.40)';
  c.fillText(pad.tag, size * 0.11, size * 0.20);
  return oc;
}

function _dpBuildLayout() {
  const wide = W >= 700;
  const size = wide ? 104 : 92;
  const gridW = size * 4 + DP_PAD_GAP * 3, gridH = gridW;
  /* ジョグ（丸ロゴ）はこの画面の主役。SP-404の上部ディスプレイくらいの
     存在感が要るので、パネルの高さはロゴの直径で決まる大きさにする */
  const jr = wide ? 104 : 78;
  const jogD = (jr + DP_JOG_BEZEL) * 2;
  const lcdH = wide ? 60 : 58;
  const ctlH = 26, ctlGap = 6;   // ルーパー操作ボタンの行（LCDとジョグの間）
  const headH = 34;   // 銘板（機種名の2行）が入る最上段の高さ
  /* パネルの中身: 縦画面は「銘板 → LCDとジョグを横並び」、
     横画面はパッドの右に「銘板 → LCD → ジョグ」を縦に積む */
  /* 縦横とも「銘板 → LCD → ロゴ」の縦積み。ロゴは左右中央（SP-404の面構え） */
  const panelH = headH + lcdH + 8 + ctlH + 20 + jogD;
  const contentH = wide ? Math.max(gridH, panelH) : panelH + 16 + gridH;
  /* 縦画面はLCDを中央寄せの幅に抑えてあるので、右上のボタン列とぶつからない。
     上端はそのぶん高く取れる */
  const top = wide ? Math.round((H - contentH) / 2)
                   : Math.round(Math.max(50, (H - contentH - 28) / 2));
  const gx = wide ? 44 : Math.round((W - gridW) / 2);
  const gy = wide ? top + Math.round((contentH - gridH) / 2) : top + panelH + 16;
  const pads = [];
  for (let i = 0; i < DRUM_PADS.length; i++) {
    pads.push({ idx: i, w: size, h: size,
                x: gx + (i % 4) * (size + DP_PAD_GAP),
                y: gy + ((i / 4) | 0) * (size + DP_PAD_GAP) });
  }
  const panelX = wide ? gx + gridW + 36 : gx;
  const panelW = wide ? W - panelX - 44 : gridW;
  const panelY = wide ? top + Math.round((contentH - panelH) / 2) : top;
  /* 中身（LCD幅）を基準にパネル内で横中央へ寄せる。ロゴもこの中心に置く */
  const lcdW = Math.min(panelW, wide ? 320 : 260);
  const lcdX = Math.round(panelX + (panelW - lcdW) / 2);
  const plate = { x: lcdX, y: panelY + 20 };
  const lcd = { x: lcdX, y: panelY + headH, w: lcdW, h: lcdH };
  /* 操作の配置:
       LCD直下の横並び … UNDO / CLEAR（編集）
       ロゴの左右に3段 … 左=REC/PLAY/CLICK（演奏）、右=テンポ±/小節数（設定）
     SPシリーズのように大きなノブの左右へ縦に並べる。行を増やすとパネルが縦に
     伸びてロゴを小さくせざるを得ないが、ロゴの左右は元々空いているのでここへ置く */
  const ctlY = panelY + headH + lcdH + 8;
  const ctlW = (lcdW - ctlGap * 2) / 3;
  const ctls = ['quant', 'undo', 'clear'].map((id, i) => ({
    id, x: lcdX + i * (ctlW + ctlGap), y: ctlY, w: ctlW, h: ctlH }));
  const jog = { x: lcdX + lcdW / 2, y: ctlY + ctlH + 20 + jogD / 2, r: jr };
  /* 左右のピルボタン（3段） */
  const sideGap = (panelW - jogD) / 2;
  const sideW = Math.min(96, sideGap - 14);
  const sideH = 34, sideSp = 8;
  const sideX0 = panelX + (sideGap - sideW) / 2;
  const sideX1 = panelX + panelW - sideW - (sideGap - sideW) / 2;
  const sideY0 = jog.y - (sideH * 3 + sideSp * 2) / 2;
  const shapes = [['topL', 'midL', 'botL'], ['topR', 'midR', 'botR']];
  [['rec', 'play', 'click'], ['bpmUp', 'bpmDn', 'bars']].forEach((col, ci) => {
    col.forEach((id, ri) => ctls.push({
      id, shape: shapes[ci][ri], w: sideW, h: sideH,
      x: ci === 0 ? sideX0 : sideX1, y: sideY0 + ri * (sideH + sideSp) }));
  });
  /* 筐体は中身をちょうど包む大きさに */
  const bodyTop = Math.min(panelY, gy) - 14;
  const bodyBottom = Math.max(gy + gridH, panelY + panelH) + 14;
  const body = { x: 10, y: bodyTop, w: W - 20, h: bodyBottom - bodyTop };
  return { pads, panel: { x: panelX, y: panelY, w: panelW, h: panelH },
           plate, lcd, ctls, jog, body, size,
           flash: new Float32Array(DRUM_PADS.length),
           lastName: '', lastTag: '', jogRot: 0, jogSpin: 0, hits: 0,
           tap: { last: 0, iv: [] },   // タップテンポの系列（_dpTapTempo参照）
           loop: _dpLoopNew() };
}

function _startDrumPad() {
  phase = 'drumPad';
  _dp = _dpBuildLayout();
  if (!_dpPadSprites || _dpPadSprites.size !== _dp.size) {
    _dpPadSprites = DRUM_PADS.map(p => _dpBuildPadSprite(p, _dp.size));
    _dpPadSprites.size = _dp.size;
  }
  if (!audioCtx) getAudioCtx();
}

function _exitDrumPad() {
  _dpHoldEnd();
  _dpLoopStopSched(); // ループの予約を畳んでから抜ける（残すと戻った後も鳴り続ける）
  _dp = null;
  _startSoundTest(); // 入ってきたサウンドテストへ戻す
}

/* 1枚叩く。パッドごとの音量補正のためだけに専用gainを1つ挟む
   （発音関数側はdestを受け取る作りなので、音そのものには手を入れない） */
/* ── パターンシーケンサ（ドラムマシン式のループ録音） ──────────
   尺は固定（1/2/4小節）で、テンポも指定する。RECを押すとその場から録音アームが
   入り、パターンが回り続けるところへ重ねていく（実機のライブレコーディング）。
   通常時（REC消灯）は叩いても記録しない。

   **固定するのは尺だけで、打点は叩いたままの時刻で記録する**（クオンタイズしない）。
   タイミング精度そのものがこの作品の手触り、という方針をここでも守る。
   記録の単位は秒ではなく拍。こうしないとテンポを変えたときにパターンが
   伸び縮みしない。記録する時刻は発音を予約したaudioCtxの時刻を使う:
   performance.now()基準にすると聴こえた音と記録が出力遅延ぶんずれる。

   再生はrAFではなく音声クロックの先読みスケジューラ（ジングル・キング戦
   シーケンサと同じ作法）。再生位置は毎tick audioCtx.currentTime から計算する。
   カウンタを積む書き方だとバックグラウンド復帰で位置がずれる。 */
/* スケジューラの起動間隔。録音中は周の境目で予約を頭打ちにするため（_dpLoopTick参照）、
   境目の音はこの間隔ぶんだけ遅れて予約されうる。人の打鍵のゆらぎ（20〜30ms）より
   十分小さくしておく。1回の実測は現実的な打ち込みで0.006ms・上限近くでも0.113msなので、
   毎秒100回でも0.6〜11msにしかならない */
const DP_LOOP_TICK_MS  = 10;
/* 先読み時間。BGM用のSCHEDULE_AHEAD(0.25秒)をそのまま使っていたが、
   tickが遅れると「遅れたぶん」ではなく「先読み窓を外れたぶん」が丸ごと落ちる。
   16パッドとロゴを毎フレーム描く画面なので、重いフレームやタイマーの間引きで
   簡単に0.25秒を超える（このプロジェクトのプレビューはdocument.hiddenで
   setIntervalが1秒に間引かれ、実際にパターンが虫食いになった）。
   刻みを25msに詰めたうえで窓を0.45秒まで広げ、14倍以上の余裕を持たせる。
   窓を広げると打鍵が次の周に反映されるまでの猶予が減るが、
   1周は最短でも1.2秒（200BPM・1小節）なので実用上の問題にならない */
const DP_SCHED_AHEAD   = 0.45;
const DP_LOOP_MAX_EV   = 512;   // 総イベント数の上限（スケジューラとメモリの歯止め）
/* 予約の刻み。発音時刻は必ず「head + 整数スロット × スロット長」で求め、足し算で積まない。

   時刻をfloatで積むと、周の先頭を2通りの経路で求めることになる（掛け算で出した base と、
   前の周の終わりに長さを足した値）。この2つは1 ULPずれるので、0拍の音の時刻がわずかに
   「予約済み位置」より手前に落ちて捨てられる。テンポによっては周の1〜4割で頭が消える
   （60/bpm×4×bars が2進数で正確に表せる120や160BPMだけ無事、という形で出る）。
   カーソルを整数にすれば、この比較そのものが無くなる。

   480はMIDIのticks per beatと同じ発想。クオンタイズの刻み（1・1/2・1/4拍）を割り切り、
   クオンタイズOFFの生の打鍵も 1/480拍（120BPMで0.26ms）まで保てる */
const DP_SLOTS_PER_BEAT = 480;
/* tickが遅れたときに、その間に来るはずだった音をどこまで拾うか（秒）。
   描画が重いフレームなどでtickが1回飛ぶと、飛んだ区間の音が丸ごと捨てられる。周の頭は
   ちょうど予約の再開位置に当たるため真っ先に落ち、「たまに冒頭の一音が鳴らない」として出る。
   取りこぼすくらいなら数十ms遅れて鳴らすほうが良い。長い中断のあとに大量の音が一気に
   鳴らないよう上限を置く */
const DP_LATE_TOL_SEC  = 0.12;
const DP_BPM_MIN = 40, DP_BPM_MAX = 200, DP_BPM_STEP = 1;
/* タップテンポ（ジョグを叩いた間隔からBPMを決める）。
   間隔が空いたら別の系列として数え直す。区切りは最小BPMの1拍(40BPM=1500ms)より
   長く取らないと、ゆっくり叩いているだけで毎回1打目に戻ってしまう */
const DP_TAP_TIMEOUT_MS = 2000; // これ以上空いたら系列の切れ目
const DP_TAP_MIN_MS     = 150;  // これより短い間隔は捨てる（400BPM相当。同時押しの二重発火よけを兼ねる）
const DP_TAP_KEEP       = 8;    // 平均に使う間隔の本数（4/4で2小節ぶん）
const DP_TAP_OUTLIER    = 0.5;  // 平均から±50%外れた間隔は打ち直しとみなす
/* TEMPO±の長押し。1押し1BPMだと40→200に160回かかるので、押しっぱなしで
   連続変化させる。押した直後は動かさず（単押しと区別）、しばらくすると
   ゆっくり流れ、さらに押し続けると加速する */
const DP_HOLD_DELAY_MS = 380;   // 長押しと認めるまで
const DP_HOLD_SLOW_MS  = 90;    // 連続変化の間隔
const DP_HOLD_FAST_MS  = 28;    // 加速後の間隔
const DP_HOLD_ACCEL_MS = 1100;  // これだけ押し続けたら加速
let _dpHold = null;             // { delta, t0, next, timer }

function _dpHoldEnd() {
  if (_dpHold && _dpHold.timer) clearInterval(_dpHold.timer);
  _dpHold = null;
}
function _dpHoldTick() {
  const H = _dpHold;
  if (!H || !_dp || phase !== 'drumPad') { _dpHoldEnd(); return; }
  const now = performance.now();
  if (now < H.next) return;
  _dpLoopSetBpm(H.delta);
  /* 1段変わるたびに光らせる。押しっぱなしの間、値が動いていることが
     ボタン自身からも分かる（LCDの数字だけを見ていなくて済む） */
  if (H.btn) _markPressRect(H.btn);
  H.next = now + (now - H.t0 > DP_HOLD_ACCEL_MS ? DP_HOLD_FAST_MS : DP_HOLD_SLOW_MS);
}
function _dpHoldBegin(delta, btn) {
  _dpHoldEnd();
  const t0 = performance.now();
  _dpHold = { delta, btn, t0, next: t0 + DP_HOLD_DELAY_MS, timer: setInterval(_dpHoldTick, 16) };
}
/* 4→2→1→4 の順に巡回する。2小節から1小節へ下げるのが1押しで済むように
   （2で打ち込む→1で半分だけ鳴らす→4で2回鳴らす、という使い方を想定） */
const DP_BARS_CHOICES = [4, 2, 1];
/* クオンタイズの刻み（拍）。0=OFF。1=4分、0.5=8分、0.25=16分。
   ゲーム本編の判定では入力の補正を禁止しているが（タイミング精度そのものが
   遊びの核なので）、ここは演奏の道具として明示的に選ぶ機能なので話が別。
   **記録は生の時刻のまま**で、再生時に丸めるだけの非破壊方式にする。
   OFFに戻せば叩いたままの演奏が戻る */
/* 周の境目の猶予（拍）。ジャストを中心に前後この幅までは「境目の音」とみなす。
   幅はクオンタイズの半分（Qのグリッドに吸い込まれる範囲＝人が同じ音として
   意図している範囲）を基本にし、Q=OFFや細かいQでも狭くなりすぎないよう
   既定値（0.08秒、ただし拍長の1/4を上限）を下限に置く。

   この窓を設ける理由は2つある:
     ・人は拍の頭をわずかに早く叩く。そのままでは「前の周の最後尾」として
       記録され、次の切り替わりで打ち直し扱いになってパターンが消える
     ・逆に少し遅れて叩いた最後の一発が、次の周の先頭に落ちる。これも1発だけで
       打ち直しとみなされ、直前に打ち込んだパターン全体を置き換えてしまう
   どちらも「境目の音は0拍へ補正し、それ単体では打ち直しの合図とみなさない」
   ことで塞ぐ。打ち直しは窓の外に1発でも叩いたときに成立する */
const DP_PREROLL_SEC = 0.08;
function _dpBoundaryWinBeats(L) {
  const base = Math.min(DP_PREROLL_SEC, _dpBeatDur(L) * 0.25) / _dpBeatDur(L);
  return Math.max(base, L.quant ? L.quant / 2 : 0);
}

const DP_QUANT_CHOICES = [0, 0.25, 0.5, 1];
const DP_QUANT_LABEL = { 0: 'Q OFF', 0.25: 'Q 1/16', 0.5: 'Q 1/8', 1: 'Q 1/4' };
/* 操作ボタンの表示名。状態で変わるものがあるのでループ状態 L を受け取る関数で持つ。
   ボタンを足すときは _dpBuildLayout の配置とここの2箇所を対にすること
   （描画側で id を分岐させると、配置だけ足して表示名を忘れたときに黙って空文字になる） */
const DP_CTL_LABEL = {
  rec:   () => 'REC',
  play:  L => L.playing ? 'STOP' : 'PLAY',
  click: () => 'CLICK',
  bpmUp: () => 'TEMPO +',
  bpmDn: () => 'TEMPO −',
  bars:  L => `${L.bars} BAR${L.bars > 1 ? 'S' : ''}`,
  quant: L => DP_QUANT_LABEL[L.quant],
  undo:  () => 'UNDO',
  clear: () => 'CLEAR',
};
const DP_BEATS_PER_BAR = 4;
/* クリックの音量。パッドと同じ音源を使うが、伴走なので控えめにする */
const DP_CLICK_VOL = 0.30, DP_CLICK_ACCENT_VOL = 0.50;

function _dpLoopNew() {
  /* layers = 確定済みのレイヤー。録音中はそれに加えて
       take … いま採用されている「直前に入力があった周」のシーケンス（毎周鳴る）
       pass … この周に叩いたぶん。周が変わるとき、入力があればtakeを置き換える
     打ち込む→次の周で仮再生を聞く→駄目なら叩き直す（takeが差し替わる）→
     良ければRECを終える、という手順になる。RECを終えた時点のtakeが確定する */
  return { playing: false, rec: false, bpm: 120, bars: 2, quant: 0,
           layers: [], take: null, takeLen: 0, pass: null, pending: [], passDirty: false, lastK: null,
           head: 0, schedSlot: 0, sched: null, viz: [], click: false };
}
function _dpBeatDur(L) { return 60 / L.bpm; }
function _dpBeatsPerLoop(L) { return L.bars * DP_BEATS_PER_BAR; }
function _dpLoopDur(L) { return _dpBeatsPerLoop(L) * _dpBeatDur(L); }
/* 再生時の拍位置。クオンタイズONなら刻みへ丸める（記録側は触らない）。
   折り返しは**そのパターン自身の長さ(len)**で行う。再生中の小節数で折り返すと、
   同じパターンでも小節数を変えるたびに末尾の音の行き先が変わってしまう
   （2小節では頭へ回るのに4小節では回らない、という食い違いになる）。
   ループなので、末尾へ丸まった音は毎周の先頭で鳴る＝musicallyはこれが正しい */
function _dpQuantBeat(L, beat, len) {
  if (!L.quant) return beat;
  const q = Math.round(beat / L.quant) * L.quant;
  return q >= len ? 0 : q;
}

/* 拍位置 → スロット番号（整数）。発音時刻はこの整数からしか作らない */
function _dpSlotOf(beat) { return Math.round(beat * DP_SLOTS_PER_BEAT); }
function _dpSlotDur(L) { return _dpBeatDur(L) / DP_SLOTS_PER_BEAT; }

/* 現在の拍位置（0〜_dpBeatsPerLoop(L)）。停止中は0 */
function _dpLoopBeatPos(L) {
  if (!L.playing || !audioCtx) return 0;
  const bp = _dpBeatsPerLoop(L);
  const b = (audioCtx.currentTime - L.head) / _dpBeatDur(L);
  return ((b % bp) + bp) % bp;
}

/* 音だけ鳴らす（ライブの打鍵とパターン再生の共通部分）。tは絶対時刻 */
function _dpVoice(i, t) {
  if (!audioCtx || audioCtx.state !== 'running' || audioMuted) return;
  const pad = DRUM_PADS[i];
  let dest = _seDest(audioCtx);
  if (pad.gain !== 1) {
    const g = audioCtx.createGain();
    g.gain.value = pad.gain;
    g.connect(dest);
    _disconnectAfter(audioCtx, t + pad.dur + 1.0, g);
    dest = g;
  }
  pad.hit(audioCtx, t, dest);
}

/* クリック。小節の頭はリムショット、他の拍はクローズハット（TR音源のまま） */
function _dpClickVoice(t, accent) {
  if (!audioCtx || audioCtx.state !== 'running' || audioMuted) return;
  const d = _seDest(audioCtx);
  if (accent) _playRimshot(audioCtx, t, d, DP_CLICK_ACCENT_VOL);
  else        _playKingHat(audioCtx, t, d, false, DP_CLICK_VOL);
}

function _dpLoopEventCount(L) {
  let n = (L.take ? L.take.length : 0) + (L.pass ? L.pass.length : 0) + L.pending.length;
  for (const layer of L.layers) n += layer.ev.length;
  return n;
}
/* 何か入っているか（UNDO/CLEARを効かせてよいか） */
function _dpLoopHasPattern(L) {
  return L.layers.length > 0 || (L.take && L.take.length > 0) || (L.pass && L.pass.length > 0);
}
/* 再生に使う組を返す。各要素は [イベント配列, そのパターンの本来の長さ(拍)]。
   録音中のtakeは今の長さで録っているので現在の長さを本来の長さとする */
function _dpLoopSets(L, bpNow) {
  const sets = L.layers.map(l => [l.ev, l.len]);
  /* 録音中のtakeも、確定済みのレイヤーと同じく「打ち込んだときの長さ」で扱う。
     今の小節数で扱うと、録音中に小節数を変えた瞬間に鳴り方が変わってしまう */
  if (L.rec && L.take && !L.passDirty) sets.push([L.take, L.takeLen || bpNow]);
