  /* 2) 推定した b をBGMの16分グリッドへ載せ替える。倍率は「比が上限（KING_SEQ_GAP_MAX）に
        収まる範囲で最大」を選ぶ。ここで倍率を下げることで長さの上限も同時に満たすので、
        間隔を先にクランプする必要が無い（先に潰すと比を読む前に長い音が縮んで別の比に
        見える。実測: タ=200msで1:2を叩くと400msが上限329msへ落ちて1:1.64に見え、2:3と
        誤読される）。
        テンポと比が両立しないときは比の保存を優先する: 打ち込んだリズムとして伝わるのは
        長さの一致ではなく長短の比のため。

     この2段構えが要る理由: グリッド上で直接あてはめる（候補単位ごとに絶対誤差を最小化する）
     方式だと、プレイヤーのテンポが16分に乗っていないときに比が崩れる。例: タ=120msで
     120,240,120,240（1:2:1:2）と叩くと、120msは16分1つ(82ms)と2つ(165ms)のどちらからも遠く、
     240msは3つ(247ms)にほぼ一致するので、絶対誤差最小の解が 1,3,1,3 になる。先に比
     (1:2:1:2)を読んでからグリッドへ載せれば 1,2,1,2 が保たれる（テンポは120ms→82msへ詰まるが、
     リズムは意図どおり） */
  const rmax = Math.max(...best.r);
  const rsum = best.r.reduce((a, v) => a + v, 0);
  /* 倍率は3つの上限の最小を取る。いずれも倍率を下げるだけなので比は整数のまま保たれる:
     ・推定した拍 b をグリッドへ載せた値（テンポの再現）
     ・1つの隙間が KING_SEQ_GAP_MAX を超えない
     ・全長が KING_SEQ_SPAN_SLOTS を超えない（序盤の間延び対策） */
  const u = Math.max(1, Math.min(Math.round(best.b / KING_SEQ_QUANT),
                                 Math.floor(KING_SEQ_GAP_MAX / rmax),
                                 Math.floor(KING_SEQ_SPAN_SLOTS / rsum)));
  return best.r.map(v => v * u);
}


/* 予約済み再生イベントのうち、時刻が来たものを発火する（音は予約済みなので
   ここで進めるのは視覚と状態のみ）。_updateBossBattle から毎フレーム呼ぶ */
function _kingSeqStep() {
  if (!_king || _king.seqEvents.length === 0 || !audioCtx) return;
  const now = audioCtx.currentTime;
  while (_king.seqEvents.length > 0 && _king.seqEvents[0].at <= now) _kingSeqFire(_king.seqEvents.shift(), false);
}

function _kingSeqFire(e, flush) {
  /* その的のビームが飛んだ（or 音だけのタップが鳴った）時点で帯電スパークを止める */
  if (e.f && _king.reelBeamed) _king.reelBeamed[e.f.reelIdx] = true;
  if      (e.kind === 'cue')    return; // 切り替えの合図は音のみ（音は予約済み）
  else if (e.kind === 'shot')   _kingFireBeam(e.f);
  /* resolve を立てるだけにして実際の着地は _updateKingCharFlights に委ねる。
     直接 _stickKingChar を呼ぶと、まだ飛翔中（'fly'）の文字が瞬間移動する */
  else if (e.kind === 'impact') e.f.resolve = 'stick';
  else if (e.kind === 'accent') _kingSeqAccent(e, flush);
}

/* 残りの再生イベントを時刻を待たず全て確定させる（ポーズ時に呼ぶ）。
   音は audioCtx の時刻で予約済みで、ポーズ中は masterGain が0なので鳴らずに
   流れてしまう。予約を残したまま復帰すると全イベントの時刻が過去になり、
   1フレームで一斉に発火して「打ち込んだリズムと違うもの」が見える。
   ここで畳んでおけばポーズ中に状態が確定し、復帰後は次のトライから再開できる */
function _kingSeqFlush() {
  if (!_king) return;
  while (_king.seqEvents.length > 0) _kingSeqFire(_king.seqEvents.shift(), true);
}

/* 5音目のアクセント。帯電していた4箇所が一斉に焦げへ変わって発光し、キング全体が光って
   のけぞり、全身の焼き色が一段濃くなる（こんがり%の加算をここへ集約しているため、ゲージと
   焼き色と焦げが全て同じ瞬間に動く）。キングが被弾に反応するのはこの1回だけ */
function _kingSeqAccent(e, flush) {
  /* 鳴らす対象を持たない飛翔体（OK以下・強制発射の自動確定分）もここで吸い込む。
     画面に残し続ける理由が無いため。deferBurn も同時に降ろす: これ以降に着地する文字
     （このフレームより後に _stickKingChar が呼ばれる分）は焼き込みの瞬間を過ぎているので、
     帯電させずその場で焦げにしないと永久に焦げが出ない */
  for (const f of e.flights) {
    f.deferBurn = false;
    /* 帯電中は消えずに待っていた文字（_predKingCharAlive）のフェードをここから
       始めるため、経過フレームを0へ戻す。待っている間も f.frames は進んでいるので、
       戻さないと焦げが出た瞬間に文字がフェードなしで消える。
       resolve の確定とは独立した条件なので分けて書く（else if で繋ぐと、着弾済み＝
       resolve が入っている通常経路でしか効かない書き方に見えて誤りやすい） */
    if (f.state === 'stick' && f.markRef && f.markRef.charging) f.frames = 0;
    if (f.resolve === null) f.resolve = 'stick';
  }
  /* 焼き込み: 帯電したまま待っていた焦げ跡を、5拍目のアクセントで一斉に出現させる。
     ここで初めて revealedAt が入り、_renderKingBody のフェード表示が4つ同時に始まる */
  const burnAt = performance.now();
  for (const m of _kingChargedMarks) {
    if (m.revealedAt == null) m.revealedAt = burnAt;
    m.charging = false;
  }
  _kingChargedMarks = [];
  /* 記録が無く再生イベントを持たない的（強制発射の自動確定分）の帯電もここで止める */
  if (_king.reelBeamed) _king.reelBeamed = [true, true, true, true];
  if (!e.dud) { // 焦げ跡ゼロ＝ダメージ無しなら加点しない
    _kingApplyGain(e.gain);
    /* 全身リアクション（フラッシュ・のけぞり・焦げ跡の発光）は「叩いた」ご褒美なので、
       時間切れの自動発射では出さない。ゲージは伸びるが締めの一撃は起きない */
    if (!e.forced) {
      _kingAccentFlash  = KING_ACCENT_FLASH_FRAMES;
      _kingAccentRecoil = KING_ACCENT_RECOIL_FRAMES;
      _kingImpactShake  = KING_IMPACT_SHAKE_FRAMES;
      _kingAccentMarks  = e.flights.filter(f => f.markRef).map(f => f.markRef);
    }
  }
  /* アクセントのダウンビートは次のトライの開始と同じ瞬間にする
     （死に時間がゼロになり、アクセントがそのまま次の小節の「1」になる）。
     勝敗が決まった場合は次のトライへ進ませない。
     ポーズによる畳み込み（_kingSeqFlush）は時刻が過去なので、ここで起こすと
     バッテリーの起点が過去になって復帰直後に切れる。その場合は attemptFired を
     立てたままにして、復帰後の _kingTrialGate へ委ねる */
  if (flush || _king.pendingVictory || _king.pendingDefeat) return;
  _kingStartTrial(e.nextPos);
}

/* こんがり%の加算と勝利予約。勝利はここで確定させず予約だけする（この試技の
   ビームを見せきってから _updateBossBattle が確定させる） */
function _kingApplyGain(gain) {
  if (gain <= 0) return;
  _king.cookPct = Math.min(100, _king.cookPct + gain);
  if (_king.cookPct >= 100) _king.pendingVictory = true;
}

/* 打ち込みの持ち時間（バッテリー）の残りセル数。0で充電切れ。
   実時間で失効すべきガードなので audio-clock 基準にする（CLAUDE.mdの時間条件規約。
   フレームカウンタだと document.hidden で rAF が止まっている間に失効しない）。
   recStartPos が未確定の間（音声の時計が引けるようになるまで）は満充電扱い＝
   時間制限なしで動かす */
function _kingBatteryLeft() {
  if (!_king || _king.recStartPos === null) return KING_BATTERY_BEATS;
  const pos = _bgmJudgePos();
  if (pos === null) return KING_BATTERY_BEATS;
  const used = Math.floor((pos - _king.recStartPos) / BGM_BEAT);
  return Math.max(0, Math.min(KING_BATTERY_BEATS, KING_BATTERY_BEATS - used));
}

/* 充電切れの監視。切れたら残りの的をその瞬間の目で自動確定して強制発射する。
   ほぼ確実に不一致になり、既存のハズレ経路（篩い落とし→衝突→ひび→failCount）へ
   そのまま合流する＝時間切れ専用の敗北経路を作らない */
function _kingBatteryCheck() {
  if (_king.attemptFired) return; // 打ち込みが終わっていれば無関係
  if (_king.recStartPos === null) {
    /* 戦闘開始直後はテープ演出のレートランプ中で位置が引けない。使えるようになった
       最初のフレームで、直近の**小節境界**を起点として打つ。コール＆レスポンスの枠は
       すべて recStartPos からの小節数で決まるので、ここが拍境界だと枠が小節から外れる */
    const pos = _bgmJudgePos();
    if (pos !== null && !_bgmRateRamping()) {
      const bar = KING_BAR_DUR();
      _king.recStartPos = Math.floor(pos / bar) * bar;
    }
    return;
  }
  if (_kingBatteryLeft() > 0) return;
  /* 残りの的を自動確定する。4本目の _kingReelShoot がそのままコールを閉じる
     （_kingFireAttack を別途呼ぶ必要はない） */
  while (_king.reelIdx < 4) _kingReelShoot(null, true);
}

/* 次トライの解放。レスポンスが終わり（ハズレなら4体が的に衝突してひびが入り切り）、その後の
   最初の**小節境界**で的を回し直す。速く打ち終われば速くレスポンスが終わり、速く次へ進む。
   当たりの場合はアクセント（爆発）が次のコールの1拍目を兼ねるのでここは通らず、
   _kingSeqAccent から直接 _kingStartTrial が呼ばれる。ここを通るのはハズレ経路と、音声の
   時計が使えずシーケンスを組めなかった場合 */
function _kingTrialGate() {
  if (!_king.attemptFired || _king.pendingDefeat || _king.pendingVictory) return;
  if (_king.seqEvents.length > 0) return; // 再生中
  const missClear = _king.resultMatched || !_king.missAttemptToken || _king.missAttemptToken.remaining <= 0;
  if (!missClear) return;
  const pos = _bgmJudgePos();
  if (pos === null || _bgmRateRamping()) {
    /* 音声の時計が使えない場合は解放条件をフレーム数＋16分グリッドへ退避 */
    if (_king.resultTimer === null) return;
    _king.resultTimer++;
    const minWait = _king.resultMatched ? KING_RESULT_MIN_WAIT.hit : KING_RESULT_MIN_WAIT.miss;
    if (_king.resultTimer > minWait && onBeatGrid()) _kingStartTrial(null);
    return;
  }
  if (_king.nextTrialPos === null) {
    /* 小節境界へ揃える。コール＆レスポンスの枠は recStartPos からの小節数で決まるので、
       ここが拍境界だと以降の枠がすべて小節から外れる（バッテリーの目盛りも同様） */
    const sl = _kingSeqBarUp(Math.ceil((pos + KING_SEQ_MIN_LEAD * _bgmRateTo) / KING_SEQ_QUANT));
    _king.nextTrialPos = sl * KING_SEQ_QUANT;
  }
  if (pos >= _king.nextTrialPos) _kingStartTrial(_king.nextTrialPos);
}

function _kingStartTrial(startPos) {
  /* 実解像度の切り替えをここでも適用する（_rsApplyPending 参照）。
     戦闘は通常モードの init を通らないので、ここが無いと戦闘中はずっと
     「取りこぼしを測って下げると決めるが、適用されない」まま最高段階で走り続ける。
     キング戦は塗る量が最も多い場面なので、自動制御が最も要るのがここになる。
     的を回し直す直前＝まだ1本もタップしていない瞬間なので、1フレームの間は出ない */
  _rsApplyPending();
  _respinKingReels();
  _king.rec = [];
  _king.seqEvents = [];
  _king.resultTimer = null;
  _king.missAttemptToken = null;
  _king.nextTrialPos = null;
  _king.seqAccentAt = null;
  _king.reelBeamed = [false, false, false, false];
  _king.recStartPos = startPos; // バッテリーの起点（nullなら_kingBatteryCheckが後から打つ）
}

/* 4本とも即座に再スピン（ヒット・ミス問わず毎回呼ばれる） */
function _respinKingReels() {
  _releaseKingReelOCs(_king.reels); // 旧的のOCをプールへ返却（リーク防止）
  for (let i = 0; i < 4; i++) {
    const { x, y } = _king.reels[i];
    _king.reels[i] = _createKingReel(x, y, _king.charWeights[i]); // 的ごとの現在の配分を引き継ぐ
  }
  _king.reelIdx = 0;
  _king.attemptFired = false; // 次トライの帯電演出（drawKingReel参照）を解禁
}

/* 的posIdxで文字charが命中した際、その的（他の3的とは独立）の配分を少し偏らせる。
   命中文字をKING_WEIGHT_STEPぶん増やし（上限KING_WEIGHT_MAX）、増えた分は他の3文字から
   比例配分で差し引く（下限KING_WEIGHT_MINを維持。下限に達した文字が出た場合は残りを
   さらに他へ再配分するwhileループ）。
   結果の当たり外れに関わらず毎タップ呼ぶ＝基準は「その的で狙って当てた文字」 */
function _adjustKingCharWeight(posIdx, char) {
  const w = _king.charWeights[posIdx];
  const target = Math.min(KING_WEIGHT_MAX, w[char] + KING_WEIGHT_STEP);
  let gain = target - w[char];
  w[char] = target;
  if (gain <= 0) return;
  const others = KING_CHARS.filter(c => c !== char);
  while (gain > 1e-9) {
    const reducible = others.filter(c => w[c] > KING_WEIGHT_MIN + 1e-9);
    if (reducible.length === 0) break; // 他3文字すべて下限＝これ以上削れない
    const pool = reducible.reduce((a, c) => a + (w[c] - KING_WEIGHT_MIN), 0);
    const take = Math.min(gain, pool);
    for (const c of reducible) w[c] -= take * (w[c] - KING_WEIGHT_MIN) / pool;
    gain -= take;
  }
}

/* ビーム1本を撃つ（的の三角 → 対応するマーク）。ビームの色はマークの色と一致させる。
   マークが無い（OK以下）タップは対応するビームも無し＝的とマークが1:1で対応する見た目を
   保つ。5本目を足さないのも同じ原則で、5音目のアクセントはビームではなくキング本体の
   リアクションで表現する。
   飛翔時間は距離によらずKING_LASER_TRAVEL_FRAMESで一定。リズムシーケンサでは「撃つ時刻」
   だけが1本ずつずれる */
function _kingFireBeam(f) {
  if (!f.markRef) return false; // 焦げ跡が無いタップはビームも発射しない
  const p1 = _kingReelPointerPos(_king.reels[f.reelIdx]);
  const p2 = _kingFlightTargetPos(f);
  /* マークの色＝そのタップの飛翔文字の色（drawKingCharFlightsのf.score基準の
     色付けと同一。_syncBarColor(f.score)）にビーム色を一致させる */
  const [col, glow] = _syncBarColor(f.score);
  _kingLasers.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
    age: 0, life: 14, maxLife: 14, color: col, glow });
  return true;
}

function _kingSetSyncLabel(score) {
  let label = '';
  if      (score >= 0.667) label = 'JUST!';
  else if (score >= 0.333) label = 'GOOD';
  else                     label = 'OK'; // scoreは常に>0（calcSyncScoreの下限は約0.016）
  syncJustLabel = label; syncJustTimer = 50; syncJustScore = score;
}

/* 4本同時にビームを撃つ一撃（音声の時計が引けずシーケンサを組めなかった場合のフォール
   バック専用。通常は _kingBuildSequence が1本ずつ時刻を付けて撃つ）。
   こ・ん・が・りが揃っても4タップ全てがOK止まりだとmarkRefが無く、ビームが1本も出ず焦げ跡も
   こんがり%も増えない（JUST/GOODのみ加点というバランス仕様どおり）。この時に発射音を鳴らすと
   「音は撃ったと言っているのに画面は無反応」になるため、音の方を実際の見た目に合わせて弱い
   不発音にする。バランスは変えず演出の整合だけを取る＝タイミング精度が報酬の核という設計を
   薄めないよう、OKティアへの加点はしない */
function _kingApplyBeams(flights) {
  let fired = 0;
  for (const f of flights) if (_kingFireBeam(f)) fired++;
  playSE(fired > 0 ? 'kingBeam' : 'kingBeamDud');
}

/* 誕生演出の鎮座位置→戦闘位置、戦闘位置→勝利拡大、それぞれのジャンプをなくすための
   表示トランスフォーム収束。bx/by/scaleは各フェーズが確定させる「目標値」、
   dbx/dby/dscaleは毎フレーム目標へ指数収束する「現在の表示値」。 */
function _easeKingXform() {
  _king.dbx += (_king.bx - _king.dbx) * KING_XFORM_EASE;
  _king.dby += (_king.by - _king.dby) * KING_XFORM_EASE;
  _king.dscale += (_king.scale - _king.dscale) * KING_XFORM_EASE;
}

/* キング戦系フェーズを通して「決着に関係なく背景で自走し続ける」演出をまとめて1フレーム
   進める。boss / bossShatter / bossVictory / bossDefeat / bossDefeatShrink /
   bossDefeatOutro のすべてから呼ぶ。
   姿勢イージング・文字飛翔・レーザー寿命の3つは、フェーズごとに取捨選択せず必ずここへ
   集約すること。各update関数へ個別にコピーすると組み合わせに穴が空き、たとえばbossVictory
   だけレーザーの寿命処理が抜けて、勝利を決めた瞬間のビームが life を消費できず残り続ける
   といった不具合になる。集約しておけば、新しい常時演出を足したときの水平展開漏れも起きない。
   個々の中身は対象が空なら何もしない（_king が null、配列が空）ため、どのフェーズから
   呼んでも安全 */
/* 文字飛翔の生存判定。毎フレーム呼ばれるswapRemoveの引数なので、その場のアロー関数では
   なくモジュールスコープに置く（クロージャ生成ゼロ。通常モードの_pred*と同じ方針で、
   キング戦側にも水平展開する） */
const _predKingCharAlive = f => {
  /* 焼き込み待ち（帯電中）の文字は5音目まで消さない。焦げになるのはその瞬間なので、
     ここでフェードさせてしまうと「文字が消えて何も無い時間」が挟まる
     （KING_TETHER_*の定義部参照）。焼き込みでcharging=falseになり、同時に
     f.framesも0へ戻されるのでそこから通常のフェードが始まる */
  if (f.state === 'stick' && f.markRef && f.markRef.charging) return true;
  if (f.state === 'stick') return f.frames < KING_CHAR_STICK_FADE_FRAMES;
  if (f.state === 'fall')  return !_isKingCharOffscreen(f) && f.frames < KING_CHAR_FALL_MAX_FRAMES;
  return true; // fly/wait/bounce は常に残す（bounceは衝突で必ずfallへ遷移する）
};
function _updateKingCommonFx() {
  if (_king) _easeKingXform();
  /* 被弾した的の揺れを減衰させる（_kingReelShakeOffset参照）。衝突は破砕へ
     跨ぐ可能性があるため共通FX側で進める */
  if (_king && _king.reelShake) {
    for (let i = 0; i < _king.reelShake.length; i++) {
      if (_king.reelShake[i] > 0) _king.reelShake[i]--;
    }
  }
  /* 篩い落としの経過。文字の衝突→破砕（bossShatter）へ跨ぐ可能性があるため、
     boss限定ではなく共通FX側で進める */
  if (_king && _king.siftTimer !== null) {
    _king.siftTimer++;
    if (_king.siftTimer === KING_SIFT_RELEASE_FRAME) _king.gazeUp = 0; // 底で視線を戻す
    if (_king.siftTimer > KING_SIFT_RELEASE_FRAME + KING_SIFT_SETTLE_FRAMES) _king.siftTimer = null;
  }
  /* 5音目アクセントの全身リアクション残量（KING_ACCENT_*の定義部参照）。
     映像の進行に紐づく演出なのでフレームカウンタでよい */
  if (_kingFireFlash    > 0) _kingFireFlash--;
  if (_kingAccentFlash  > 0) _kingAccentFlash--;
  if (_kingAccentRecoil > 0) _kingAccentRecoil--;
  /* 1文字ごとの被弾リアクション（KING_HIT_*の定義部参照） */
  for (const h of _kingHits) h.life--;
  swapRemove(_kingHits, _predKingHitAlive);
  _updateKingCharFlights();
  for (const l of _kingLasers) { l.age++; l.life--; }
  swapRemove(_kingLasers, _predLife); // 既存の共通predを使う（毎フレームのクロージャ生成を避ける）
}

/* 篩い落としの縦変位（描画時オフセット。KING_SIFT_*の定義部参照）。
   タメで少し上へ→振り下ろしで底へ加速→底から減衰しながら上下に揺れる。
   区間の境目で値が連続するように、残振動の開始値を底の変位(+AMP)に合わせる */
function _kingSiftOffsetY() {
  if (!_king || _king.siftTimer === null) return 0;
  const t = _king.siftTimer;
  if (t < KING_SIFT_WINDUP_FRAMES) {
    return -KING_SIFT_AMP * 0.25 * _easeF(t / KING_SIFT_WINDUP_FRAMES, 'easeOut');
  }
  if (t < KING_SIFT_RELEASE_FRAME) {
    const p = (t - KING_SIFT_WINDUP_FRAMES) / KING_SIFT_DROP_FRAMES;
    return -KING_SIFT_AMP * 0.25 + KING_SIFT_AMP * 1.25 * _easeF(p, 'easeIn');
  }
  const p = Math.min(1, (t - KING_SIFT_RELEASE_FRAME) / KING_SIFT_SETTLE_FRAMES);
  return KING_SIFT_AMP * (1 - p) * Math.cos(p * Math.PI * 3);
}

/* 5音目アクセントののけぞり（描画時オフセット）。文字は的（下）からキングへ
   撃ち込まれるので、上へ弾かれてから戻る。篩い落としと同じ「描画時だけ掛ける」
   方式に揃える（dbyを触ると_easeKingXformとの綱引きになる） */
/* キング本体の表示変位。5音目アクセントののけぞりと、1文字ごとの被弾ノックバックを合成する。
   dbx/dby は触らず描画時にだけ掛ける（既存方針。座標計算へ波及させない）。
   毎フレーム呼ばれるので戻り値は使い回しのオブジェクトにする（クロージャ・アロケーション無し）。

   被弾ぶんだけを先に頭打ちにしてからアクセントを足す。まとめて頭打ちにすると、被弾が
   残っている間にアクセントが来たときに締めの一撃が薄まる */
const _kingBodyOfs = { dx: 0, dy: 0 };
function _kingBodyOffset() {
  let hx = 0, hy = 0;
  for (const h of _kingHits) {
    const p = 1 - h.life / KING_HIT_KNOCK_FRAMES; // 0→1
    const k = h.amp * Math.sin(p * Math.PI) * (1 - p * 0.4);
    hx += h.ux * k; hy += h.uy * k;
  }
  const len = Math.hypot(hx, hy);
  if (len > KING_HIT_KNOCK_MAX) { const s = KING_HIT_KNOCK_MAX / len; hx *= s; hy *= s; }
  if (_kingAccentRecoil > 0) {
    const p = 1 - _kingAccentRecoil / KING_ACCENT_RECOIL_FRAMES; // 0→1
    hy -= KING_ACCENT_RECOIL_PX * Math.sin(p * Math.PI) * (1 - p * 0.4);
  }
  _kingBodyOfs.dx = hx; _kingBodyOfs.dy = hy;
  return _kingBodyOfs;
}

/* 撃ち込まれた1文字ぶんの被弾リアクションを積む（KING_HIT_* の定義部参照）。
   押される向きは「その的の三角ポインタ → 着弾した焦げ跡」＝ビームが飛んだ向き。
   的が引けない場合だけ真上へ逃がす */
function _kingPushHit(f) {
  const reel = _king.reels[f.reelIdx];
  let ux = 0, uy = -1;
  if (reel) {
    const p0 = _kingReelPointerPos(reel), p1 = _kingFlightTargetPos(f);
    const dx = p1.x - p0.x, dy = p1.y - p0.y, d = Math.hypot(dx, dy);
    if (d > 1) { ux = dx / d; uy = dy / d; }
  }
  _kingHits.push({ ux, uy, amp: f.tier === 'just' ? KING_HIT_KNOCK_JUST : KING_HIT_KNOCK_GOOD,
                   life: KING_HIT_KNOCK_FRAMES });
}

/* 焦げ跡の発光用スプライト（アクセントで一斉に光らせる）。
   色停止以外は_buildSteamSpriteと同一なので_buildRadialSpriteに委ねる */
function _buildKingFlashSprite() {
  if (_kingFlashSprite || !_CACHE_OK) return;
  _kingFlashSprite = _buildRadialSprite([
    [0,    'rgba(255,226,150,0.95)'],
    [0.45, 'rgba(255,180,70,0.45)'],
    [1,    'rgba(255,150,40,0)'],
  ]);
}

/* 篩い落としのスカッシュ倍率（描画時のみ。底で最大、離脱後に戻る）。
   等倍のときはnullを返し、呼び出し側で余計なscaleを掛けないようにする */
function _kingSiftSquash() {
  if (!_king || _king.siftTimer === null) return null;
  const t = _king.siftTimer;
  let k = 0;
  if (t >= KING_SIFT_WINDUP_FRAMES && t < KING_SIFT_RELEASE_FRAME) {
    k = _easeF((t - KING_SIFT_WINDUP_FRAMES) / KING_SIFT_DROP_FRAMES, 'easeIn');
  } else if (t >= KING_SIFT_RELEASE_FRAME) {
    k = Math.max(0, 1 - (t - KING_SIFT_RELEASE_FRAME) / 10);
  }
  if (k <= 0) return null;
  return { sx: 1 + KING_SIFT_SQUASH * k, sy: 1 - KING_SIFT_SQUASH * k };
}

/* 被弾した的の揺れオフセット（描画時のみ。KING_REEL_SHAKE_*の定義部参照）。
   残量が無ければnullを返し、呼び出し側で余計なtranslateを掛けないようにする */
function _kingReelShakeOffset(idx) {
  if (!_king || !_king.reelShake || idx == null) return null;
  const r = _king.reelShake[idx];
  if (!r) return null;
  const t = KING_REEL_SHAKE_FRAMES - r;          // 経過フレーム（衝突フレームで0）
  /* 2乗で減衰させる。線形だと減衰後半にもう一度3px級の沈みが出て「2回叩かれた」
     ように見えたため、1発目を保ったまま以降を素早く収束させる */
  const lin   = r / KING_REEL_SHAKE_FRAMES;      // 1→0
  const decay = lin * lin;
  /* cosベースなので t=0（衝突した瞬間）に最大変位＝下向きへ沈む。
     BIASを足して下方向へ偏らせ、戻りの上向きは小さくする（KING_REEL_SHAKE_*参照） */
  const osc = KING_REEL_SHAKE_BIAS
            + (1 - KING_REEL_SHAKE_BIAS) * Math.cos(t * KING_REEL_SHAKE_FREQ);
  return {
    /* 横は衝突フレームで0から始めて後追いで揺れる（真上からの衝突なので、
       まず縦に沈み、横揺れは余韻として付いてくる方が自然） */
    x: Math.sin(t * 1.7) * KING_REEL_SHAKE_AMP * 0.22 * decay,
    y: osc * KING_REEL_SHAKE_AMP * decay,
  };
}

/* 文字を離してよいか（＝振り下ろしが底に達したか）。
   _kingがいない場合はtrueを返す: 待ち続けると文字が永久に降りてこず、
   破砕（attemptToken.remaining依存）まで進めなくなるため、進行不能を作らない側に倒す */
function _kingSiftReleased() {
  if (!_king) return true;
  return _king.siftTimer !== null && _king.siftTimer >= KING_SIFT_RELEASE_FRAME;
}

/* ハズレ確定の文字を、着地点（ボス側）から的の上部（三角ポインタ付近、f.rtx/rty＝
   ボス側を向いている面）へ戻す物理シミュレーションに切り替える。戻る先は的の下ではなく
   ボス側の上。
   ここではまだ「接近（bounce）」フェーズの初速度だけを設定する。等速直線運動で的へ向かい、
   KING_CHAR_RETURN_FRAMES後（＝ちょうど的に到達する頃）に_updateKingCharFlights側で
   衝突判定→反発（fallへ遷移）し、その瞬間に的へひびを追加する
   （_addKingReelCrackAtCollision参照）。
   この関数が呼ばれるのは篩い落としの振り下ろしが底に達した後（_kingSiftReleased） */
function _startKingCharBounce(f) {
  f.state = 'bounce'; f.frames = 0;
  const pos = _kingFlightTargetPos(f);
  f.bx = pos.x; f.by = pos.y;
  const dx = f.rtx - pos.x, dy = f.rty - pos.y;
  const dist = Math.hypot(dx, dy) || 1;
  const spd = dist / KING_CHAR_RETURN_FRAMES; // 復路は往路より短い（KING_CHAR_RETURN_FRAMES参照）
  f.bvx = dx / dist * spd;
  f.bvy = dy / dist * spd;
}

/* 文字が実際に的へ衝突した瞬間（bounce→fall遷移）にひびを1本追加する。
   ミス確定と同時に4的まとめて追加してはいけない: 衝突は個々の文字の飛翔完了タイミングで
   バラけるので、それぞれの衝突の瞬間に合わせて1本ずつ追加する。
   的は再スピンにより衝突時点では別オブジェクトへ差し替わっている場合があるため、f.reelIdx
   （スロット番号、_spawnKingCharFlight参照）で現在の的を引き直す。
   ワールド座標上の衝突角（常に真上＝-PI/2＋ボス位置に応じた傾き）から、その的の「現在の」
   w.rotを差し引いてローカル角度に変換する（_createKingCrackWedge参照）。これにより、
   衝突時点で的が既に次の的へ切り替わっていても、新しい的の現在の回転にひびが正しく追従する */
function _addKingReelCrackAtCollision(f) {
  if (!_king || f.reelIdx == null) return;
  const rw = _king.reels[f.reelIdx];
  if (!rw) return;
  const biasAngle = Math.max(-0.35, Math.min(0.35, (rw.x - _king.dbx) / 220));
  const worldAngle = -Math.PI / 2 + biasAngle;
  /* 保存する角度は「基準文字エリアの開始角から見た相対角」にする
     （KING_CRACK_ANCHOR_CHAR参照）。w.rotだけを引いた的ローカル角のままだと、
     再スピンで的が新しいrot・新しいセグメント配置に作り直された際に、
     蓄積済みのひびが絵柄に対して回転移動して見えてしまう。
     描画側（drawKingReel）が現在の的の基準角を足し戻すため、着弾直後は
     文字が当たったその場所に、以後も絵柄に対して同じ位置に出続ける */
  const localAngle = worldAngle - rw.rot - _kingReelAnchorAngle(rw);
  /* 角度も一緒に保存する。破砕（_startKingReelShatter）が「ひびの入った位置で
     割る」ために境界角として使うため、ポリゴンから復元せず素直に持たせる */
  _king.reelCracks[f.reelIdx].push({ poly: _createKingCrackWedge(localAngle), angle: localAngle });
  /* 当たった衝撃でその的だけを小さく揺らす（_kingReelShakeOffset参照） */
  if (_king.reelShake) _king.reelShake[f.reelIdx] = KING_REEL_SHAKE_FRAMES;
  /* 衝突の瞬間だけ画面も短く揺らす（KING_IMPACT_SHAKE_*参照）。4文字は同じ
     フレームに着弾するので、加算せず同じ値をセットして暴れないようにする */
  _kingImpactShake = KING_IMPACT_SHAKE_FRAMES;
  /* ひびが入る瞬間の金属音（_playKingCrackKin参照）。
     揺れと同じ理由で多重発音を避ける: この関数は文字1体ごとに呼ばれ、4体はほぼ同じ
     フレームに着弾するため、素直に鳴らすと同じ音が4重になって音量が跳ね上がり、
     「キン」ではなく潰れた濁音になる。直前の発音からの経過時間で間引いて1発にまとめる。
     フレームカウンタではなく wall-clock を使うこと: これは「実時間で失効すべきガード」で
     あり、rAFが止まる状況（タブ非表示など）でフレームが進まないと永久に失効せず、復帰後の
     最初のひびが無音になる（CLAUDE.mdの時間条件の実装規約）。
     間隔が空いて着弾がばらけた場合は個別に鳴る（そのほうが自然）ため、窓は「同一フレーム群を
     まとめる」のに足る最小限に留める */
  const nowMs = performance.now();
  if (nowMs - _kingCrackKinLastMs >= KING_CRACK_KIN_MIN_GAP_MS) {
    _kingCrackKinLastMs = nowMs;
    playSE('kingCrack');
  }
}

/* 反発落下中（fall）の文字が画面外まで出たか（余白付き）。出ていれば表示終了してよい */
function _isKingCharOffscreen(f) {
  return f.bx < -KING_CHAR_OFFSCREEN_MARGIN || f.bx > W + KING_CHAR_OFFSCREEN_MARGIN ||
         f.by < -KING_CHAR_OFFSCREEN_MARGIN || f.by > H + KING_CHAR_OFFSCREEN_MARGIN;
}

/* こんがり確定の文字がボスへ実際に到達した瞬間。予約だけされて revealedAt 未設定の焦げ跡は
   _renderKingBody 側では「まだ見えない」ため、これより前のフレームで焦げが先に見えることは
   ない。
   リズム再生を伴う通常経路（f.deferBurn）では、ここでは焦げにせず「帯電」させて5音目の
   焼き込みまで待たせる（KING_TETHER_* の定義部参照）。再生シーケンスを組めなかった退避経路
   （音声の時計が無い場合）だけが即座に焦げになる */
function _stickKingChar(f) {
  f.state = 'stick'; f.frames = 0;
  if (!f.markRef || f.markRef.revealedAt != null) return;
  /* 撃ち込まれた瞬間のキング本体の反応（KING_HIT_*の定義部参照）。OK以下は markRef を
     持たないので上のガードで弾かれる＝加点も焦げ跡も無い扱いと揃う */
  _kingPushHit(f);
  if (!f.deferBurn) { f.markRef.revealedAt = performance.now(); return; }
  if (!f.markRef.charging) {
    f.markRef.charging = true;
    f.markRef.chargeR = _kingCharFontSize(f) * 0.85; // スパークの基準半径＝文字の大きさ
    /* 充電開始の時刻は ctx 時刻で持つ（充電の進み具合を 5音目の予約時刻
       _king.seqAccentAt との比で出すため。どちらも audioCtx の時計。
       時計が引けなければ null＝満充電表示で描く） */
    f.markRef.chargedAt = audioCtx ? audioCtx.currentTime : null;
    _kingChargedMarks.push(f.markRef);
  }
}

/* 決定文字の飛翔演出を1フレーム進める。的のロック（_kingReelShoot）や
   resultTimer による再スピン待ちとは無関係に毎回呼ぶ＝背景処理として自走する。
   着地先（markRef）はスポーン時から確定済みで結果確定時に変わらないため、
   resolveが判明したらそのまま stick/bounce へ進めればよい（位置の作り直しは
   不要） */
function _updateKingCharFlights() {
  for (const f of _kingCharFlights) {
    if (f.state === 'fly') {
      f.frames++;
      if (f.frames >= KING_CHAR_FLY_FRAMES) {
        if (f.resolve === 'stick') _stickKingChar(f);
        /* ハズレ確定でもここで即bounceにはせず、いったん着地先で待機させる。
           篩い落とし（キングが振り下ろす）の底まで待ってから降り始めることで
           「到着→振り下ろす→落ちる」の因果が常に成立する（_kingSiftReleased参照）*/
        else { f.state = 'wait'; f.frames = 0; }
      }
    } else if (f.state === 'wait') {
      f.frames++;
      if (f.resolve === 'stick') _stickKingChar(f);
      else if (f.resolve === 'bounce' && _kingSiftReleased()) _startKingCharBounce(f);
    } else if (f.state === 'stick') {
      f.frames++;
    } else if (f.state === 'bounce') {
      /* 的への接近（等速直線運動）。KING_CHAR_RETURN_FRAMES＝ちょうど的に届く
         フレーム数に達したら衝突とみなし、反発速度を与えてfallへ遷移する */
      f.frames++;
      f.bx += f.bvx; f.by += f.bvy;
      if (f.frames >= KING_CHAR_RETURN_FRAMES) {
        f.state = 'fall'; f.frames = 0;
        /* 反発: 衝突点の法線（常に真上固定）方向＝bvy、接線（水平）方向＝bvxとして
           分解し、それぞれ反発係数・摩擦係数（ともに1未満）を掛けて減衰させる。
           bvyは常に正（ボスから的へ下向きに接近してくるため）なので、
           -RESTITUTION倍で符号反転（上向きに跳ね返る）しつつ確実に減速する。
           わずかな乱数は接線方向にだけ加え、自然さを出しつつ主成分は物理計算に従わせる */
        const jitter = (Math.random() - 0.5) * 0.5;
        f.bvx = f.bvx * KING_CHAR_BOUNCE_FRICTION + jitter;
        f.bvy = -f.bvy * KING_CHAR_BOUNCE_RESTITUTION;
        /* 弾き飛ばしインパルスをわずかに上乗せする（KING_CHAR_KNOCK_SPEED_X/Y 定義部参照。
           運動エネルギーの大半は的の破壊に使われる想定なので、上乗せもごく小さい値）。
           左右方向はボス中心から見たその的のオフセット方向（ひび演出のbiasAngleと同じ
           考え方、_addKingReelCrackAtCollision参照）に払う */
        const reel = _king.reels[f.reelIdx];
        const knockDir = reel ? (Math.sign(reel.x - _king.dbx) || 1) : 1;
        f.bvx += knockDir * KING_CHAR_KNOCK_SPEED_X;
        f.bvy -= KING_CHAR_KNOCK_SPEED_Y;
        f.rotSpd = knockDir * KING_CHAR_KNOCK_ROT_SPD * (0.7 + Math.random() * 0.6);
        /* 衝突の瞬間にひびを追加 */
        _addKingReelCrackAtCollision(f);
        /* 同じ失敗attemptの4体全てが衝突し終えた＝そのハズレのトライが閉じた瞬間。
           次のトライの解放条件（_kingTrialGate）がこのカウンタを見る。加えて6回目の失敗
           （pendingDefeat）の場合に限り的の破砕演出へ進む（_kingReelShoot参照）。
           phase==='boss'ガードは防御的措置: _updateKingCharFlightsは
           bossVictory/bossDefeat系の各updateからも呼ばれ続けるため、万一
           別phaseへ遷移済みの状態で衝突が完了してもシャッターで上書きしない
           （pendingDefeat中の再スピン停止で通常は起こり得ないが、二重保険） */
        if (f.attemptToken) {
          f.attemptToken.remaining--;
          if (f.attemptToken.remaining <= 0 && _king && _king.pendingDefeat && phase === 'boss') {
            _startKingReelShatter();
          }
        }
      }
    } else if (f.state === 'fall') {
      /* 弾き飛ばされた後の落下（重力）。水平方向はわずかに減速させ、垂直方向は
         重力加速度で下向きに増していく。画面外に出るまで表示し続ける。
         回転は衝突時に設定したrotSpd（knock方向に応じた符号）で等速回転させ、
         弾かれた勢いを視覚的に強調する（drawKingCharFlights参照） */
      f.frames++;
      f.bx += f.bvx; f.by += f.bvy;
      f.bvy += 0.32;
      f.bvx *= 0.99;
      f.rot += f.rotSpd;
    }
  }
  swapRemove(_kingCharFlights, _predKingCharAlive);
}

function _updateBossBattle() {
  for (const w of _king.reels) if (!w.locked) w.rot += w.speed;
  _updateKingCommonFx();
  _updateBossBgmTier(); // こんがり度に応じて地鳴りをマイルド化（_playGroundRumble参照）
  _kingSeqStep();       // 打ち込んだリズムの再生（音は予約済み・ここは視覚と状態）
  /* 篩い落としの発動判定: 予約済みかつ「降ろす対象の文字が全員キングへ到着済み」
     になったら振り始める。到着済みの判定は
     bounce予定の文字が1つも'fly'に残っていないこと。最速発射でも常に
     「到着→振り下ろす→落ちる」の順になり、見え方が一定になる */
  if (_king.siftPending) {
    const pend = _kingCharFlights.filter(f => f.resolve === 'bounce');
    if (pend.length > 0 && pend.every(f => f.state === 'wait')) {
      _king.siftPending = false;
      _king.siftTimer = 0;
      _king.gazeUp = KING_SIFT_GAZE; // 振り下ろす間だけ下を見る（底で0へ戻す）
      _kingSiftShake = KING_SIFT_SHAKE_FRAMES;
      playSE('kingSift');
    } else if (pend.length === 0) {
      _king.siftPending = false; // 降ろす文字が無い（通常起こらないが保険）
    }
  }
  /* こんがり100%到達（pendingVictory）は即座に勝利へ飛ばさず、この試技で撃ったビームが
     消えきるのを待ってから確定させる。_kingFireAttackは入力ハンドラから同期的に呼ばれるため、
     そこで直接_startBossVictory()するとビーム生成と同じフレームでphaseがbossVictoryに変わり、
     drawBossBattleが早期returnして「とどめの一撃のビームだけ一度も描画されない」状態になる。
     敗北側（pendingDefeat→文字の衝突完了を待って破砕へ）と同じ「予約してから演出の完了を
     待つ」形に揃える。ビームが1本も出なかった場合（全タップOK以下でmarkRefが無い）は
     _kingLasersが空なので即座に確定する */
  if (_king.pendingVictory) {
    /* 再生シーケンスを撃ち切り、ビームも消えきってから勝利を確定する */
    if (_kingLasers.length === 0 && _king.seqEvents.length === 0) { _startBossVictory(); }
    return;
  }
  /* 打ち込みの持ち時間（バッテリー）と、次トライの解放。
     6回目の失敗（pendingDefeat）後は再スピンしない。的は敗北結果を表示したままロックされ
     続け、文字の衝突（ひび）→破砕へそのまま進む。
     ここで再スピンを許すと重大な破綻になる: 文字の衝突（シャッター発動）は復路込みで
     32フレーム以上先なので、その間に的が回り直してタップ受付が再開され、pendingDefeat中に
     追加attemptを撃ててしまう。最悪ケースでは追加attemptでこんがり100%到達→
     _startBossVictoryの後に、先行attemptの衝突完了でシャッターが発動し、勝利フローと
     敗北フローが衝突する。
     再スピンを止めれば reelIdx=4 のまま_kingReelShootの既存ガードで入力も塞がれる
     （_kingTrialGate の先頭で pendingDefeat を弾いている） */
  _kingBatteryCheck();
  _kingTrialGate();
}

/* 決定文字の飛翔演出の描画。fly=弧を描いて接近、wait=着地して微妙に揺れながら待機、
   stick=こんがり成立で吸い込まれるようにフェード、bounce=ハズレで的へ直線的に接近、
   fall=的に衝突した反発後の重力落下（画面外に弾け飛ぶまでフェードしない）。
   位置計算は _kingCurrentFlightPos に集約。
   文字色はそのタップのスコア（f.score）で通常モードのSYNCメーターと同じ赤〜黄〜緑
   （_syncBarColor）を使う＝OK/GOOD/JUSTの評価表示を通常ゲームと同じ仕様に揃える。
   文字自体の大きさもJUSTでKING_CHAR_JUST_FONT_SCALE倍にする（焦げ跡側は常に一定サイズで、
   文字の大きさとは別物）。
   フォントサイズが1文字ごとに変わるため ctx.font はループ内で設定する */
/* キング本体を現在の表示姿勢（dbx/dby/dscale）で1枚描く。決着まわりの4つの描画関数は
   いずれもここを通す（姿勢の適用を1箇所に持つ）。alphaを渡すとその不透明度で描く
   （クロスフェード用。省略時は呼び出し側の状態のまま） */
function _drawKingBody(alpha) {
  if (!_king) return;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
  ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
  ctx.restore();
}

/* 決着画面の見出しのY。ボスの裾（拡大アニメ中は dscale に連動して動く）のすぐ下に置く。
   画面上部固定にすると所持ギヨウザ表示・上部アイコンと重なる。dscale基準なので拡大演出中も
   裾の位置と一緒に滑らかに動く。勝利・敗北で同じ式なので必ずここに集約する */
function _kingTitleY() {
  return _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
}

/* ── キングギヨウザ戦の決着画面（達成・失敗で共通） ──
   暗幕 → キング本体と飛翔文字 → 見出し → 副文 → CONTINUE の順で重ねる。
   達成側と失敗側は対になる見せ方でなければならないので、色と文言以外はここに集約する
   （個別に書くと配置やタイミングが片側だけずれる）。
   見出しはボスの裾のすぐ下（_kingTitleY）。副文は画面下端からの固定オフセットを基本にしつつ、
   ボスの拡大アニメで見出しが下りてきたら見出しの下側に間隔を保つ側を優先する。
   opts:
     veil    暗幕の色
     title / titleFill / titleStroke   見出し
     sub  / subFill  / subStroke       副文（null なら出さない）
     timer   このフェーズの経過フレーム数。副文は40、CONTINUEは90を過ぎてから出す
     extra   暗幕とキングの後・見出しの前に差し込む描画（達成側の湯気など） */
function _drawKingOutcomeScreen(opts) {
  ctx.save();
  ctx.fillStyle = opts.veil; ctx.fillRect(0, 0, W, H);
  if (_king) {
    _drawKingBody();
    drawKingCharFlights();
  }
  if (opts.extra) opts.extra();

  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const titleY = _kingTitleY();
  outText(opts.title, W / 2, titleY, opts.titleFill, opts.titleStroke, 8);

  if (opts.sub && opts.timer > 40) {
    ctx.font = `bold 15px ${FONT_MIN}`;
    outText(opts.sub, W / 2, Math.max(H - 80, titleY + 40), opts.subFill, opts.subStroke, 4);
  }
  if (opts.timer > 90) _drawBottomPillBadge('CONTINUE');
  ctx.restore();
}

function drawKingCharFlights() {
  if (_kingCharFlights.length === 0) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.88)';
  for (const f of _kingCharFlights) {
    const { x, y } = _kingCurrentFlightPos(f);
    /* 帯電中（焼き込み待ち）は薄めずそのまま出す。フェードが始まるのは5音目で
       焦げに変わる瞬間から（_predKingCharAlive参照） */
    const charging = f.markRef && f.markRef.charging;
    const alpha = (f.state === 'stick' && !charging) ? 1 - f.frames / KING_CHAR_STICK_FADE_FRAMES : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = _syncBarColor(f.score)[0];
    const fontSize = _kingCharFontSize(f);
    ctx.font = `bold ${fontSize}px ${FONT_MIN}`;
    /* fall中（弾き飛ばされた後）はrotで回転させ、勢いよく弾かれた様子を強調する
       （KING_CHAR_KNOCK_ROT_SPD、_updateKingCharFlights参照） */
    if (f.state === 'fall' && f.rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f.rot);
      ctx.strokeText(f.char, 0, 0);
      ctx.fillText(f.char, 0, 0);
      ctx.restore();
    } else {
      ctx.strokeText(f.char, x, y);
      ctx.fillText(f.char, x, y);
    }
  }
  ctx.restore();
}

function drawBossBattle() {
  /* bossShatter（6回目失敗の的破砕演出）中もボス本体・こんがりゲージは
     表示し続け、的の絵柄だけ_kingShatterの破片描画に差し替える
     （drawKingReelShatter参照） */
  if ((phase !== 'boss' && phase !== 'bossShatter') || !_king) return;
  /* レーザー（層状ストローク・shadowBlur不使用の描画規約に準拠）。
     距離に関わらずKING_LASER_TRAVEL_FRAMES（時間基準の進行度）で先端をx1,y1→x2,y2へ
     進めるため、的とマークの距離が違っても4本が同時に着弾する
     （KING_LASER_TRAVEL_FRAMES定義部参照） */
  for (const l of _kingLasers) {
    const t = Math.min(1, l.age / KING_LASER_TRAVEL_FRAMES);
    const tx = l.x1 + (l.x2 - l.x1) * t, ty = l.y1 + (l.y2 - l.y1) * t;
    const a = l.life / l.maxLife;
    ctx.save();
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = l.glow; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = l.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.restore();
  }
  /* ボス本体（焼き目蓄積済みライブOC・呼吸アニメ・戦闘用レイアウト縮小率を適用）。
     位置・スケールは dbx/dby/dscale（誕生演出からの収束中の表示値）を使う */
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  const ofs = _kingBodyOffset(); // アクセントののけぞり＋1文字ごとの被弾（_kingBodyOffset参照）
  ctx.save();
  /* 篩い落としの縦変位とスカッシュ、アクセントののけぞりは描画時にのみ掛ける
     （dby/dscaleは触らない。_kingSiftOffsetY / _kingSiftSquash /
     _kingBodyOffset の定義部参照）。文字の離脱位置にはこの変位を反映しない
     （ユーザー判断: 座標計算への波及を避ける） */
  ctx.translate(_king.dbx + ofs.dx, _king.dby + _kingSiftOffsetY() + ofs.dy);
  const sq = _kingSiftSquash();
  if (sq) ctx.scale(breath * sq.sx, breath * sq.sy);
  else    ctx.scale(breath, breath);
  const bodySrc = _renderKingBody();
  ctx.drawImage(bodySrc, -_king.half, -_king.half, _king.half * 2, _king.half * 2);
  /* 5音目アクセントの全身フラッシュ。同じ絵を 'lighter' で重ねて明度を持ち上げる
     （白い板を被せると輪郭やシルエットが潰れるため、本体の色を活かして光らせる） */
  if (_kingAccentFlash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (_kingAccentFlash / KING_ACCENT_FLASH_FRAMES) * 0.75;
    ctx.drawImage(bodySrc, -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  /* その試技で焼いた焦げ跡を一斉に発光させる（アクセントの視覚。焦げ跡は
     liveOCへ合成済みで個別に光らせられないため、ワールド座標へ重ねて描く。
     _kingFlightTargetPos と同じ座標変換） */
  if (_kingAccentFlash > 0 && _kingAccentMarks.length > 0 && _kingFlashSprite) {
    const fa = _kingAccentFlash / KING_ACCENT_FLASH_FRAMES;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fa;
    for (const m of _kingAccentMarks) {
      const rr = m.r * breath * 1.6;
      const mx = _king.dbx + ofs.dx + m.lx * breath, my = _king.dby + ofs.dy + m.ly * breath;
      ctx.drawImage(_kingFlashSprite, mx - rr, my - rr, rr * 2, rr * 2);
    }
    ctx.restore();
  }
  /* 撃ち込み済み・焼き込み待ちの帯電（文字より先に描く＝文字が消えていく間も
     その外側でスパークが回り続けて見える） */
  if (phase === 'boss') _drawKingMarkCharges(breath, ofs.dx, ofs.dy);
  /* 発射直後の稲妻: まだ撃ち込まれていない的の三角マークと、その結果文字を繋ぐ。
     接続の有無は的の帯電と同じ _king.reelBeamed を見るので、三角の帯電が消える
     瞬間＝線が切れる瞬間になる（KING_TETHER_*の定義部参照）。
     ハズレ経路と再生シーケンスを組めなかった経路では発射時に reelBeamed が
     一斉に true になるため、この線は1フレームも出ない */
  if (phase === 'boss' && _king.attemptFired) {
    for (const f of _kingCharFlights) {
      if (_king.reelBeamed[f.reelIdx] || f.resolve !== null) continue;
      const p0 = _kingReelPointerPos(_king.reels[f.reelIdx]);
      const p1 = _kingCurrentFlightPos(f);
      _drawKingChargeTether(p0.x, p0.y, p1.x, p1.y, f.reelIdx);
    }
  }
  /* 決定文字の飛翔（ボス本体の上に描く＝飛んで/跳ね返って見える） */
  drawKingCharFlights();
  /* こんがりミニリール4連。破砕演出中は的の絵柄の代わりに飛び散る破片を描く */
  if (phase === 'boss') {
    for (let i = 0; i < 4; i++) drawKingReel(_king.reels[i], i === _king.reelIdx, i);
  } else {
    drawKingReelShatter();
  }
  drawKingCookGauge();
  /* 4打目でコールが閉じる（もう一度タップして発射する方式ではない）ので、
     「あと1回必要」を伝えるバッジ表示は持たない（_kingReelShoot参照） */
}

/* こんがりゲージ: BETバーと同じ位置・寸法（戦闘中はBETバーを非表示にして差し替える） */
/* achieved=true でラベルを「こんがり 達成！」に差し替える（退場演出中に使う。
   drawBossVictoryOutro参照。戦闘中はパーセント表示） */
function drawKingCookGauge(achieved = false) {
  if (!_king) return;
  const pct = _king.cookPct / 100;
  const mx = IS_PORTRAIT ? 12 : 335, mw = IS_PORTRAIT ? W - 24 : 390;
  const my = IS_PORTRAIT ? P_BAR_Y : KING_GAUGE_Y, mh = IS_PORTRAIT ? P_BAR_H : KING_GAUGE_H;
  ctx.save();
  roundRect(mx, my, mw, mh, 10);
  ctx.fillStyle = 'rgba(40,20,5,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,140,40,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  const bh = 14, by = my + mh - bh - 10, bx = mx + 14, bw = mw - 28;
  roundRect(bx, by, bw, bh, 7);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  if (pct > 0) {
    roundRect(bx, by, bw * pct, bh, 7);
    ctx.fillStyle = pct >= 1 ? '#ffdd55' : '#c87830';
    ctx.fill();
  }
  /* 打ち込みの持ち時間（バッテリー）。1セル=1拍で、拍境界ごとに1つ落ちる
     （KING_SEQ_*の定義部参照）。32セルはラベル行の右側に入らないので、パネル
     上端に横幅いっぱいの細いストリップとして置く（こんがりバーと同じ左右位置
     に揃える）。KING_BATTERY_GROUP（4拍＝1小節）ごとに広めの隙間を空けて、
     数えなくても「あと何小節ぶん」が読めるようにする。
     achieved=true（退場演出中）は打ち込み自体が無いので出さない */
  if (!achieved && _king.recStartPos !== null && !_king.attemptFired) {
    const left = _kingBatteryLeft();
    const groups = Math.ceil(KING_BATTERY_BEATS / KING_BATTERY_GROUP);
    const ch = 4, cgap = 1.5, ggap = 5;
    const cw = (bw - (groups - 1) * ggap - (KING_BATTERY_BEATS - groups) * cgap) / KING_BATTERY_BEATS;
    const by0 = my + (IS_PORTRAIT ? 5 : 3); // ラベル文字の上端より上（パネル上端の細帯）
    /* 残量が少ないほど橙→赤へ。しきい値は小節単位で持つ（残り2小節で橙、残り1小節で赤）。
       総拍数に対する割合ではなく小節で区切ることで、色が変わる瞬間がセルの隙間と揃い、
       「あと2小節」が数えずに読める */
    const warm = left <= KING_BATTERY_GROUP * 2 ? '#ffb03a' : Y;
    const col  = left <= KING_BATTERY_GROUP ? '#ff6a3a' : warm;
    let x = bx;
    for (let i = 0; i < KING_BATTERY_BEATS; i++) {
      ctx.beginPath(); ctx.rect(x, by0, cw, ch);
      if (i < left) { ctx.fillStyle = col; ctx.fill(); }
      else          { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill(); }
      x += cw + ((i + 1) % KING_BATTERY_GROUP === 0 ? ggap : cgap);
    }
  }
  ctx.font = `bold ${IS_PORTRAIT ? 16 : 18}px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = Y;
  /* 表示は必ず切り捨て（Math.floor）にする。四捨五入だと99.5%が「100%」と表示されるのに
     勝利条件（_king.cookPct>=100、_kingReelShoot参照）は満たさず、表示100%なのにクリアに
     ならず追加で1本必要になる。切り捨てなら、表示が100%になった時点で必ず実際にも100%
     （勝利条件成立）であることが保証される */
  ctx.fillText(achieved ? 'こんがり 達成！' : `こんがり ${Math.floor(pct * 100)}%`,
    mx + mw / 2, my + (mh - bh - 10) / 2 + 4);
  ctx.restore();
}

/* 湯気スプライト（柔らかい放射状グラデーションの円）を1回だけ生成する。
   保持する形は_kingFlashSpriteと揃えて生キャンバス1枚 */
function _buildSteamSprite() {
  if (_steamSprite || !_CACHE_OK) return;
  _steamSprite = _buildRadialSprite([
    [0,    'rgba(255,250,240,0.55)'],
    [0.55, 'rgba(255,250,240,0.24)'],
    [1,    'rgba(255,250,240,0)'],
  ]);
}

/* 湯気を1本、キング本体の輪郭（上半分の弧）付近から立ち上らせる。
   本体楕円のジオメトリは_buildBossOC/_drawGyozaBodyと同じ比率
   （中心Y=+s*0.08、半径rx=s*0.58・ry=s*0.48、REF=42基準をkk=s/REFで
   拡大）を、キングの現在の表示位置・スケール（dbx/dby/dscale）で
   ワールド座標に変換して使う。輪郭よりわずかに内側（×0.85）から
   スポーンすることで「表面から立ち上る」質感にする。
   速度・半径も dscale に比例させ、キングの見た目のサイズに対して
   常に同じ相対的な大きさ・速さで立ち上るようにする */
function _spawnVictorySteamWisp() {
  if (!_king) return;
  const s = _BOSS_S * _king.dscale;
  const cx = _king.dbx, cy = _king.dby + s * 0.08;
  const rx = s * 0.58, ry = s * 0.48;
  const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * Math.PI * 0.75; // 真上を中心に上半分の弧
  _victorySteam.push({
    x: cx + Math.cos(ang) * rx * 0.85,
    y: cy + Math.sin(ang) * ry * 0.85,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -(0.35 + Math.random() * 0.25) * _king.dscale, // 上昇速度（下向き重力は加えない＝湯気は落ちてこない）
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleSpd: 0.03 + Math.random() * 0.02,
    wobbleAmp: 6 + Math.random() * 6,
    r0: (10 + Math.random() * 6) * _king.dscale,
    age: 0,
    maxAge: 90 + Math.random() * 40,
  });
}

function _updateVictorySteam() {
  for (const p of _victorySteam) {
    p.age++;
    p.wobblePhase += p.wobbleSpd;
    p.x += p.vx + Math.sin(p.wobblePhase) * (p.wobbleAmp * 0.03); // 左右にゆらめきながら上昇
    p.y += p.vy;
    p.vy -= 0.003; // ごくわずかに加速（浮力が強まっていくイメージ、暴走しない程度）
    /* 霧散中は寿命とは別の減衰係数で薄れていく（_disperseVictorySteam参照）。
       maxAgeを縮める方式にすると alpha=sin(age/maxAge*π) が跳ね上がって
       一瞬濃くなってしまうため、独立した係数を掛ける形にしている */
    if (p.disperse !== undefined) p.disperse = Math.max(0, p.disperse - _VICTORY_STEAM_DISPERSE_RATE);
  }
  _victorySteam = _victorySteam.filter(p => p.age < p.maxAge && p.disperse !== 0);
}

/* 溜めた湯気を一斉に霧散させる。キング中心から外向きに散らしつつ、独立した減衰係数で
   薄れさせる。飛び去り開始（bossVictoryOutro step1）で呼ぶ＝力を貯めたあと、飛び去る
   タイミングで湯気が霧散する */
const _VICTORY_STEAM_DISPERSE_RATE = 0.045; // 1フレームあたりの減衰量（約22フレームで消えきる）
function _disperseVictorySteam() {
  const cx = _king ? _king.dbx : W / 2, cy = _king ? _king.dby : H / 2;
  for (const p of _victorySteam) {
    const dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    p.vx += (dx / d) * 1.7;
    p.vy += (dy / d) * 1.1;
    p.wobbleAmp *= 1.6;   // ゆらめきも大きくして散り際を賑やかにする
    p.disperse = 1;
  }
}

function _drawVictorySteam() {
  if (!_steamSprite || _victorySteam.length === 0) return;
  ctx.save();
  for (const p of _victorySteam) {
    const t = p.age / p.maxAge;
    /* 0→1→0のなだらかな山型（現れて消えていく）。霧散中はさらに独立した
       減衰係数を掛ける（_disperseVictorySteam参照） */
    const alpha = Math.sin(Math.min(1, t) * Math.PI) * (p.disperse ?? 1);
    if (alpha <= 0.01) continue;
    const scale = 0.5 + t * 1.3; // 拡散して徐々に大きくなる
    const rr = p.r0 * scale;
    ctx.globalAlpha = alpha;
    ctx.drawImage(_steamSprite, p.x - rr, p.y - rr, rr * 2, rr * 2);
  }
  ctx.restore();
}

function _startBossVictory() {
  phase = 'bossVictory';
  _bossVictoryTimer = 0;
  if (_king) _king.scale = 1; // 戦闘スケールから等倍への収束目標に切り替える（_easeKingXform）
  /* こんがり達成の報酬: このキングの実体である蓄積メーター分（_kingMeterAtBattleStart＝
     1000+アルファ）と、過去の敗北で没収されてプールされていた分（kingLostPool）をまとめて
     所持ギヨウザへ返す。「キングに取り込まれていたギヨウザが、こんがり焼けて解放される」
     という筋立て。プールは返した時点で0に戻す。
     返却額は勝利画面の表示にも使うため_bossVictoryWonCoinsへ控える（_kingは復帰時にnullに
     なるので、そちらには持たせない＝真実の源を1つに保つ） */
  const won = _kingMeterAtBattleStart + kingLostPool;
  coins += won;
  kingLostPool = 0;
  _kingMeterAtBattleStart = 0; // 二重取得防止（次戦の_initBossBattleで再設定される）
  /* 蓄積メーターを1にする。_initBossBattleが戦闘開始時に0へリセットするので実害は無いが、
     敗北側が明示的に閾値の50%へ戻しているのと対称に、達成側もここで明示する
     （暗黙の依存を残さない）。
     0ではなく1にするのは、退場演出で舞い上がらずに1個だけ残るギヨウザ
     （_victoryOutro.seedItem）と数を合わせるため＝「また1個から集まりはじめる」 */
  kingGyozaMeter = 1;
  _bossVictoryWonCoins = won;
  lsSave();
  lsSaveStats();
  checkCoinsAch(); // 返却で所持数が跳ね上がるため実績判定を回す
  launchFireworks();
  /* BGMをここで止め、達成感のある専用ファンファーレを鳴らす。通常モードのjackpot
     （stopBGM+2秒後に自動再開）を流用してはいけない: 勝利演出の最中にボスBGMが復活する。
     専用のBGM停止＋専用ファンファーレを使う
     （_stopBossBGMForVictory・_playKongariCompleteFanfare参照） */
  _stopBossBGMForVictory();
  playSE('kongariComplete');
  /* 真エンディングへ入るかどうかは trueEndingSeen で判定する（「実績が今回初めて解除された
     か」で判定してはいけない）。
     こんがり実績は真エンディングとは独立に、より前から解除され得る。解除済みのプレイヤーでは
     初回解除判定が常にfalseになり、_kingBattleEnd()（通常復帰）へ流れて真エンディングへ
     一切到達できなくなる。
     判定すべきは「真エンディングをまだ見ていないか」であり、trueEndingSeenはまさにこの判定の
     ために用意したフラグ */
  _pendingTrueEnding = !trueEndingSeen;
  unlockAch(KONGARI_ACH_ID); // ギヨウザをこんがり焼いた（最後の実績）
  _buildSteamSprite();
  _victorySteam = [];
}

function _updateBossVictory() {
  _bossVictoryTimer++;
  /* 勝利確定の瞬間、直前の試技で飛ばした文字がまだ吸い込まれフェード中の場合が
     あるため、決着後も完了まで動かし続ける（背景処理なので中断させない） */
  _updateKingCommonFx();
  if (_bossVictoryTimer % 5 === 0 && _king) _spawnVictorySteamWisp();
  _updateVictorySteam();
}

function drawBossVictory() {
  if (phase !== 'bossVictory') return;
  _drawKingOutcomeScreen({
    veil: 'rgba(0,0,0,0.35)',
    extra: _drawVictorySteam,
    title: 'こんがり キングギヨウザ！',
    titleFill: '#ffdd55', titleStroke: 'rgba(60,20,0,0.9)',
    /* 返却されたギヨウザ数。所持数表示もcoinsDispのカウントアップで増えていくが、
       それだけだと「なぜ増えたのか」が分からないため理由を明示する */
    sub: _bossVictoryWonCoins > 0 ? `ギヨウザ ${fmt(_bossVictoryWonCoins)}個が 解放された！` : null,
    subFill: '#ffe9a8', subStroke: 'rgba(60,20,0,0.85)',
    timer: _bossVictoryTimer,
  });
}

/* ════════════════ こんがり達成の退場演出（bossVictoryOutro） ════════════════
   達成側と失敗側は必ず対になる段数を踏ませる。失敗側は
   bossDefeat →（縮小ブリッジ）→ bossDefeatOutro（拡散＋締め2行）→ 画面フェード
   → tapestart（的スピンアップ＋BGM同期）と進むので、達成側もCONTINUEタップから
   _kingBattleEnd()を直接呼ぶのではなく、同じ段数を踏む。直接呼ぶと次のフレームでキングが
   消えて的が現れ、キングギヨウザモードが唐突に終わったように見える。
   「こんがりしたキングギヨウザが少し上を見て、上に飛び去る」を軸にした4段構成:
     step0 見上げ＋沈み込み（飛び立つ前のタメ）
     step1 上へ加速して飛び去る（easeIn＝加速して抜ける）
     step2 解放されたギヨウザが下から舞い上がる（失敗側の「拡散して落ちる」の対）
     step3 締めメッセージ（失敗側と同じ呼吸・同じmsgAlpha方式）
   その後は失敗側と完全に同じ場面転換（_startScreenFade → tapestart）。
   初回（実績コンプリート）の真エンディングへ入る場合も、この飛び去りを見せてから暗転して
   入る */
const _VICTORY_OUTRO_LOOKUP_FRAMES = 40; // step0: 見上げ＋タメ
const _VICTORY_OUTRO_FLY_FRAMES    = 70; // step1: 飛び去り
const _VICTORY_OUTRO_ITEMS_FRAMES  = 60; // step2: 解放されたギヨウザの舞い上がり
/* 締め2行。周回（また集まりはじめる）を示唆して終える。文言を差し替えるときはここだけで
   済むよう配列で持つ */
const _VICTORY_OUTRO_LINES = ['キングは みちたりて さった……', 'ギヨウザは また あつまりはじめる……'];
/* メッセージのフェード式は失敗側と共有する（_advanceOutroMsg）。ただし尺は共有せず、
   こちら専用の目標秒数（_OUTRO_MSG_TARGET_SEC_VICTORY = 6秒）を渡す。
   締めの呼吸を揃えることと、同じフレーム数にすることは別。こちらは文字数1.7倍・縦画面では
   4行になるので、失敗側と同じ尺では読み終わらない */
/* bossVictory の CONTINUE タップから呼ぶ。キングはまだ生きている（_king != null） */
function _startBossVictoryOutro() {
  if (!_king) { _finishBossVictoryOutro(); return; } // 保険: キングが居なければ演出を挟まず終端へ
  phase = 'bossVictoryOutro';
  /* 締め2行は画面幅に収まるよう折り返しておく（_wrapOutroLines参照）。
     尺は目標秒数から逆算するので縦横で合計は変わらない（縦画面は折り返しで
     4行になるが、合計6秒は同じ。_makeOutroMsgTiming参照） */
  const msgLines = _wrapOutroLines(_VICTORY_OUTRO_LINES);
  _victoryOutro = {
    step: 0, timer: 0, items: [], seedItem: null,
    msgAlpha: 0, gaugeAlpha: 1,
    baseBy: _king.by, baseScale: _king.scale,
    msgLines, msgTiming: _makeOutroMsgTiming(msgLines, _OUTRO_MSG_TARGET_SEC_VICTORY),
  };
  _king.gazeUp = 0;
  playSE('kingVictoryInhale');
}

/* 演出の終端。初回のみ真エンディングへ、2回目以降は通常モードへ復帰する
   （_pendingTrueEnding参照） */
function _finishBossVictoryOutro() {
  if (_victoryOutro) {
    _victoryOutro.items = _releaseAll(_victoryOutro.items);
    if (_victoryOutro.seedItem) _deadify(_victoryOutro.seedItem);
    _victoryOutro = null;
  }
  if (_pendingTrueEnding) { _pendingTrueEnding = false; _startTrueEnding(false); }
  else _kingBattleEnd();
}

/* 解放されたギヨウザが舞い上がる群れを生成する。個数は解放数に応じて増やし、
   プールを溜めてから勝ったときの見返りが視覚的にも効くようにする
   （上限は描画負荷のため失敗側と同じ44個で打ち止め） */
function _makeVictoryOutroItems() {
  const n = Math.max(12, Math.min(44, 12 + Math.floor(_bossVictoryWonCoins / 100)));
  const items = [];
  for (let i = 0; i < n; i++) {
    const x = W * (0.08 + Math.random() * 0.84);
    const y = H + 40 + Math.random() * H * 0.5;      // 画面下の外から湧き上がる
    const g = makeItem(x, y, (Math.random() - 0.5) * 0.6, -(2.6 + Math.random() * 2.2));
    items.push(g);
  }
  return items;
}

function _updateBossVictoryOutro() {
  const o = _victoryOutro;
  if (!o) { _finishBossVictoryOutro(); return; }
  _updateKingCommonFx();
  /* 湯気の更新はここで明示的に呼ぶ。_updateKingCommonFx（姿勢・飛翔文字・レーザー）には
     含まれておらず、bossVictoryでは_updateBossVictoryが個別に呼んでいる。退場演出でこれを
     呼ばないと、湯気が描画だけされて位置も寿命も進まず画面に固定表示で残る */
  _updateVictorySteam();
  o.timer++;

  if (o.step === 0) {
    /* 見上げる: 瞳を上へ寄せつつ、わずかに沈み込んでから戻る（跳ぶ前の予備動作）。
       sin(p*π) なので step0 の終わりにはちょうど元の高さへ戻り、step1 の
       上昇へ滑らかに繋がる */
    const p = Math.min(1, o.timer / _VICTORY_OUTRO_LOOKUP_FRAMES);
    if (_king) {
      _king.gazeUp = Math.min(1, p / 0.6);           // 前半6割で見上げきる
      const sink = 10 * Math.sin(p * Math.PI);
      _king.by = o.baseBy + sink; _king.dby = _king.by; // イージングの遅れを挟まず直接置く
    }
    if (o.timer % 3 === 0 && _king) _spawnVictorySteamWisp(); // 力を溜めるイメージで湯気を増やす
    if (o.timer >= _VICTORY_OUTRO_LOOKUP_FRAMES) {
      o.step = 1; o.timer = 0;
      /* 溜めた湯気は飛び去りと同時に霧散させる。
         step1では新たな湯気を出さない＝「溜めた力を解き放って飛び立つ」という筋立てにする
         （軌跡として出し続けると霧散と矛盾する） */
      _disperseVictorySteam();
      playSE('kingVictoryFly');
    }
  } else if (o.step === 1) {
    /* 飛び去る: easeIn で加速しながら画面上方へ抜ける。同時に縮小して遠ざかる
       遠近感を出す。_easeKingXform の指数収束は「減速して着く」動きなので
       ここでは使わず、by/dby・scale/dscale を直接置いて加速感を保つ */
    const p = Math.min(1, o.timer / _VICTORY_OUTRO_FLY_FRAMES);
    const e = _easeF(p, 'easeIn');
    if (_king) {
      const targetY = -_BOSS_S * 1.3;                 // 画面上端の外
      _king.by = o.baseBy + (targetY - o.baseBy) * e; _king.dby = _king.by;
      _king.scale = o.baseScale * (1 - 0.4 * e);      _king.dscale = _king.scale;
    }
    o.gaugeAlpha = Math.max(0, 1 - p * 1.6);          // ゲージは飛び去りに合わせて消す
    if (o.timer >= _VICTORY_OUTRO_FLY_FRAMES) {
      o.step = 2; o.timer = 0;
      o.gaugeAlpha = 0;
      o.items = _makeVictoryOutroItems();
      /* 周回の示唆: 1個だけ舞い上がらずに残り、画面下でゆっくり漂う。
         「また集まりはじめる」という締め文（_VICTORY_OUTRO_LINES）と対応させる */
      o.seedItem = makeItem(W / 2, H * 0.82, 0, -0.18);
    }
  } else if (o.step === 2 || o.step === 3) {
    /* 解放されたギヨウザの舞い上がり。step3（メッセージ表示中）も動かし続けて
       背景で舞っている状態を保つ */
    for (const g of o.items) {
      g.x += g.vx; g.y += g.vy;
      g.vy -= 0.012;                 // ゆるやかに加速して昇っていく
      g.rot += g.rotSpd * 0.5;
    }
    if (o.seedItem) {
      const s = o.seedItem;
      s.y += s.vy;
      s.rot += 0.004;                // ほとんど止まって見えるゆるい回転
    }
    if (o.step === 2 && o.timer >= _VICTORY_OUTRO_ITEMS_FRAMES) { o.step = 3; o.timer = 0; }
    if (o.step === 3) {
      /* 締めメッセージ。失敗側（_updateBossDefeatOutro）と同じ実装を共有する
         （_advanceOutroMsg）。尺は _startBossVictoryOutro で目標6秒から逆算済み
         （失敗側は3秒。_makeOutroMsgTiming参照） */
      if (_advanceOutroMsg(o)) _startScreenFade(() => _finishBossVictoryOutro());
    }
  }
}

function drawBossVictoryOutro() {
  if (phase !== 'bossVictoryOutro' || !_victoryOutro) return;
  const o = _victoryOutro;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  /* 舞い上がるギヨウザはキングより先に描く（キングの手前に被らせない） */
  for (const g of o.items) drawOneItem(g);
  if (o.seedItem) drawOneItem(o.seedItem);
  if (_king) _drawKingBody();
  _drawVictorySteam();
  /* こんがりゲージの締め: 100%のまま「達成！」を出してから飛び去りに合わせて消す。
     決着した瞬間にゲージが消えると、終わり方が唐突に見える */
  if (o.gaugeAlpha > 0) {
    ctx.globalAlpha = o.gaugeAlpha;
    drawKingCookGauge(true);
    ctx.globalAlpha = 1;
  }
  if (o.step >= 3) {
    /* 描画本体は失敗側と共通で、色だけが違う（_drawOutroMsg参照） */
    _drawOutroMsg(o, '#ffe9a8', 'rgba(60,20,0,0.9)');
  }
  ctx.restore();
}

/* ════════════════ 真エンディング ════════════════
   「こんがり」実績は他の全実績を達成しないと解除できない設計（_allAchExceptKongariDone
   参照）のため、実質的に「実績コンプリートの祝賀」演出として位置づける。
   初回のこんがり達成時のみ自動再生し（_pendingTrueEnding、_startBossVictory・
   handleGameClickのbossVictory分岐参照）、2回目以降はタイトル画面のボタン
   （TRUE_ENDING_BTN、トロフィーの右隣）からいつでも見返せるようにする
   （replay=true）。エンディングはゲーム途中で見るものではなくスタートと
   並列の選択肢という位置づけのため、あえて実績パネルの中には置かない。
   3幕構成、いつでもタップでスキップ可（act3の締めくくりのみ
   最短表示後にCONTINUE待ち、既存のバッジ演出と同じ操作感）。 */
/* 真エンディングは開幕セリフを持たず、実績一覧の見出し1行から始める。
   直前に見せる退場演出（bossVictoryOutro: 見上げ→飛び去り→解放→締め2行）と、
   語りで始まる開幕セリフは噛み合わない。また、開幕セリフに紐づけてキングを再登場させると
   「飛び去ったキングがエンドロールでまた出てくる」という矛盾が生じる。
   見出しは上下を細い罫線で挟むだけの最小構成にする（締めで丸いギヨウザロゴを大きく見せる
   構成を弱めないよう、冒頭は文字だけに留める） */
const _TRUE_ENDING_HEADER_TEXT = 'たっせいのあかし';
/* まとめ（累計データ）の前に置く小見出し。空白だけで区切っていたときは
   実績一覧の続きなのか別のまとまりなのかが読み取りにくかったため、語を1つだけ置く。
   冒頭の見出しと同じ「罫線で挟む」様式にはせず、罫線なし・小さめの文字・字間を広げる
   だけに留める。エンドロール中に強い見出しが2回出ると、締めで
   丸いギヨウザロゴを大きく見せる構成が相対的に弱まるため、格を一段下げて
   「冒頭の見出し＞この小見出し」の関係を視覚的に保つ */
const _TRUE_ENDING_SUBHEADER_TEXT = 'そうけっさん';
/* 小見出しの字間（フォントサイズ×この値）。フォントを小さくすると見出しらしさも
   一緒に落ちるので、字間を広げることで「小さいが見出しである」ことを補う。
   ctx.letterSpacingは対応状況が環境依存なので使わず、1文字ずつ実測幅で送る */
const _TRUE_ENDING_SUBHEADER_TRACKING_RATIO = 0.3;
const _TRUE_ENDING_CLOSE_LINES = [
  'ギヨウザたちは',
  'あなたの手によって',
  'おいしく進化しました。',
  'ありがとう。',
];
const _TRUE_ENDING_ROLL_ROW_H = 40; // クレジットロール1行の高さ
/* 実績ロール1行内の「アイコン」「文字列」の位置・フォントをそれぞれ独立した定数として
   明示指定する。アイコンをtextAlign='right'で文字列のすぐ左に詰める作りにしてはいけない:
   絵文字グリフの実測送り幅はプラットフォーム依存でわずかに狂う（U+FE0F付きコードポイントで
   実際に起きる）ため、文字列側の開始位置がその影響をそのまま受けて隙間が潰れる。
   アイコンはtextAlign='center'の固定スロットに置き、文字列の開始位置もアイコンの実測幅から
   逆算せず完全に独立した固定値にする。これで個々のグリフの幅ゆれに左右されず隙間が確保でき、
   アイコン・文字列それぞれのサイズを個別に調整したい場合もこの4定数だけを触ればよい */
/* アイコンの見た目サイズは絵文字1文字ぶんで固定なので、textAlign='left'で常に同じ左端に
   描けば揃う。'center'/'right'は送り幅の半分/全部を左へシフトする計算が入るため、送り幅の
   実測がグリフと食い違う環境ではそのぶんズレる。'left'はシフト計算そのものが無いので
   このズレが原理的に起きない */
/* 左端の位置は「最長行の右余白が左余白と等しくなる」ように取る。実績名の直後に達成日が
   付くぶん行が右へ伸びるので、名前だけを想定した位置では縦画面(W=420)で左余白118px・
   最長行の右余白38pxと3:1に偏り、最長行が右端に迫って見える。40px左へ寄せると左右とも
   余白78pxで対称になる。
   ブロック幅は画面幅に依存しない（W/2基準の配置＋固定フォント）ので、横画面でも同じ40pxで
   揃う。行長は211〜382pxとばらつきがあり、中央値の行を基準にするならシフトは6pxで足りるが、
   短い行が左に残るのは左揃えのロールでは自然な一方、最長行が右端に迫るのは詰まって見えるため、
   最長行を基準にする */
const _TRUE_ENDING_ROLL_ICON_X    = W / 2 - 132; // アイコンの左端
const _TRUE_ENDING_ROLL_ICON_FONT = `18px serif`;
const _TRUE_ENDING_ROLL_TEXT_X    = W / 2 - 84;  // 文字列の開始位置（アイコンの実測幅とは無関係）
const _TRUE_ENDING_ROLL_TEXT_FONT = `bold 15px ${FONT_MIN}`;
/* テーマ曲の拍の長さ（秒）。_playTrueEndingThemeのstepDur算出にも使う
   （ここで先に定義することでスクロール速度の算出にも使えるようにした） */
const _TRUE_ENDING_BEAT = 0.6;
/* 演出全体を貫く唯一の速度。見出し・実績ロール・締めのセリフを1本の縦スクロール座標に
   乗せ、同じ速度で流し続ける（区間ごとに別の時間軸・別の見せ方を持たせると継ぎ目がばらつく）。
   速度は勘のpx/frame値ではなく、実績ロール1行(_TRUE_ENDING_ROLL_ROW_H)がテーマ曲ちょうど
   1拍分の時間で流れるように、行の高さと拍の長さから直接算出する＝スクロールがBGMのテンポと
   同期して感じられる。結果は1.111...px/frame */
const _TRUE_ENDING_SCROLL_SPEED = _TRUE_ENDING_ROLL_ROW_H / (_TRUE_ENDING_BEAT * 60);
const _TRUE_ENDING_HEADER_HOLD_FRAMES = 130; // 見出しを静止表示しておく時間（締めセリフの静止表示と対にする）
/* 各区間の空白（何も表示されない区間）はH比で定義する。縦画面と横画面でH
   （IS_PORTRAIT ? 820 : 560）が大きく異なり、同じpx値だと縦画面では相対的に間延びし、
   横画面では逆に窮屈に見える。必ずH比で持たせて画面比に依存しない見え方にすること。
   SPACER_BEFORE_CLOSEは特に広めに取る: 締めセリフが静止した瞬間に、まとめ（累計データ）の
   末尾がまだ画面に残っていると重なって見えるため、静止位置で重ならない値（縦横それぞれで
   計算済み・80px前後の余裕）にしてある */
/* 見出し〜実績ロールの間隔。他の空白と違い固定のH比では持たせない。
   見出しは静止表示（_TRUE_ENDING_HEADER_HOLD_FRAMES）してから流れ始めるので、
   その静止中に実績の先頭行が画面内に居ると「見出しを読ませてから一覧が始まる」
   という段取りが崩れる。かつ見出しの行高は画面比ではなくフォント基準の絶対値
   なので、H比を固定すると縦横で「静止中に何行見えるか」が変わってしまう
   （縦画面のほうが多く見えてしまう）。そこで「静止中は先頭行が画面下端の
   ちょうど外に居る」位置を逆算し、縦横で同じ見え方に揃える */
function _trueEndingSpacerAfterHeader(headerH) {
  return Math.max(H * 0.18, H * 0.5 - _TRUE_ENDING_ROLL_ROW_H / 2 - headerH);
}
const _TRUE_ENDING_SPACER_BEFORE_SUMMARY_RATIO = 0.14; // 実績本編〜まとめ（累計データ）の間隔
const _TRUE_ENDING_SPACER_BEFORE_CLOSE_RATIO = 0.55; // 実績まとめ〜締めセリフの間隔
const _TRUE_ENDING_CLOSE_LINE_DY_RATIO = 2.0; // 締めセリフの行間（フォントサイズ×この値。開幕より少し詰める）
const _TRUE_ENDING_CLOSE_REST_Y_RATIO = 0.5; // 締めセリフが止まった時、中央行を画面のどこに置くか(H比)
const _TRUE_ENDING_CLOSE_LINGER_FRAMES = 170; // 締めセリフが止まってからフェードアウトを始めるまでの余韻（表示時間が短いとの指摘で延長）
const _TRUE_ENDING_CLOSE_FADEOUT_FRAMES = 70;
const _TRUE_ENDING_TITLE_FADEIN_FRAMES = 150; // 締めくくりのタイトル表示。重要な瞬間なのでゆっくりフェードインさせる（旧50=0.83sは早すぎるとの指摘で2.5sに延長）
/* フェード中はグローを併用しない。macOS Safari では globalAlpha が shadow の描画に正しく
   効かず（shadowColor自体にalphaを埋め込んでも同じ）、フェードが一瞬で終わったように見える。
   alpha変化とshadowBlur変化を同時に行うこと自体がSafariの合成で正しく扱われないため、
   両者を時間的に分離する: フェード中はグロー無しの単純な文字フェードのみ（globalAlpha単体は
   正しく効く）、フェードが完了してアルファが1で固定された後にグローだけを別途育てる。
   結果として「輝きが増していく」印象も強くなる */
const _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES = 60; // フェード完了後、グローが0→フルに育つ時間
/* タイトル＋COPYRIGHTのブロック全体を一行分上にずらすオフセット。
   PAUSE中は"PAUSED"がH*0.5に表示されるため、そのままだとタイトルと
   重なってしまう。タイトルとCOPYRIGHTを一行分まとめて上にずらすことで、
   PAUSED表示がその間（隙間）に収まるようにする */
const _TRUE_ENDING_TITLE_Y_OFFSET = IS_PORTRAIT ? 34 : 46;
const _TRUE_ENDING_CREDIT_TEXT = 'COPYRIGHT © 2026 Michiyasu ODAKI';
const _TRUE_ENDING_CREDIT_FADEIN_FRAMES = 90; // グローが育ち切った後、クレジットが単独でフェードインする時間
const _TRUE_ENDING_FIN_LINGER_FRAMES = 150; // クレジットが出そろってからFIN.を出すまでの余韻（早すぎるとの指摘で延長）
/* FIN.受付までの最短フレーム数。グロー成長・クレジットのフェードインが
   終わり切ってから、さらに余韻を置いた後の時間として算出する
   （マジックナンバーで持たず、各段階の時間から機械的に求める） */
const _TRUE_ENDING_TITLE_MIN_HOLD_FRAMES =
  _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES + _TRUE_ENDING_CREDIT_FADEIN_FRAMES + _TRUE_ENDING_FIN_LINGER_FRAMES;

/* { stage, timer, scrollY, summaryScrollY, targetScrollY,
     content:{rows,rollStartIdx,summaryStartIdx,closeStartIdx},
     closeAlpha, titleAlpha, canExit }
   stage: 'scroll' → 'closeLinesRest' → 'closeLinesFadeOut' → 'titleFadeIn' → 'titleHold'
   タップ操作は4段階の"表示"（見出し＋実績一覧／そうけっさん／締めセリフ／
   タイトル）を順に1段ずつ進める。'scroll'ステージだけが2段ぶんを受け持ち、
   現在位置がsummaryScrollYの手前かどうかで飛び先を選ぶ
   （handleGameClickのphase==='trueEnding'分岐参照） */
let _trueEnding = null;
let _trueEndingIsReplay = false; // タイトル画面のボタンからの単体再生か（_finishTrueEndingでのキング戦state後片付けの要否に使う）
let _trueEndingGain = null; // テーマ曲専用のgainノード（スキップ時に即座にフェードして打ち切るため）

/* セリフ1文を指定フォント・幅に収まるよう折り返す。セリフの原文にはフレーズの区切りに
   半角/全角スペースが入っているため、それを語境界として貪欲法で行に詰める（決め打ちの改行
   位置を持たず、画面幅から動的に決める）。
   縦画面（W=420）は横画面（W=1060）よりずっと狭いので、必ずここを通すこと。1行固定だと
   セリフが画面外へはみ出す */
function _wrapTrueEndingLine(text, font, maxWidth) {
  ctx.font = font;
  const words = text.split(/[ 　]+/).filter(w => w.length > 0);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const trial = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(trial).width > maxWidth) {
      lines.push(cur);
      cur = w;
    } else {
      cur = trial;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* 開幕セリフ→実績ロール→まとめ（累計データ）→締めセリフを1本の縦スクロール
   座標に並べる。screenY = H*0.5 + row.y+row.h/2 - scrollY という共通の式で
   位置を出す（scrollY=0の時、先頭の開幕セリフがH*0.5に来る＝旧act1の見た目を継承） */
function _buildTrueEndingContent() {
  const fsHeader = IS_PORTRAIT ? 24 : 28;
  const headerH  = fsHeader * 2.6; // 上下の罫線ぶんの余白を含む行高
  const fsSub    = IS_PORTRAIT ? 18 : 20; // まとめの小見出し（実績行15pxより一回り大きく、冒頭見出しよりは小さい）
  const fsClose = IS_PORTRAIT ? 20 : 24;
  const closeDy = fsClose * _TRUE_ENDING_CLOSE_LINE_DY_RATIO;
  const spacerAfterHeader   = _trueEndingSpacerAfterHeader(headerH);
  const spacerBeforeSummary = H * _TRUE_ENDING_SPACER_BEFORE_SUMMARY_RATIO;
  const spacerBeforeClose   = H * _TRUE_ENDING_SPACER_BEFORE_CLOSE_RATIO;
  const maxTextWidth = W - 48; // 左右マージン24pxずつ

  const closeFont = `bold ${fsClose}px ${FONT_MIN}`;
  const closeDisplayLines = _TRUE_ENDING_CLOSE_LINES.flatMap(t => _wrapTrueEndingLine(t, closeFont, maxTextWidth));

  const rows = [];
  let y = 0;
  /* 実績一覧の見出し。上下を細い罫線で挟んだ1行（_TRUE_ENDING_HEADER_TEXT参照） */
  rows.push({ type: 'header', text: _TRUE_ENDING_HEADER_TEXT, y, h: headerH, fs: fsHeader });
  y += headerH;
  y += spacerAfterHeader;

  const rollStartIdx = rows.length;
  for (const a of ACHIEVEMENTS) {
    /* 達成日は実績名と同じ1つの文字列にする＝まとめ（そうけっさん）の「総プレイ回数 142」と
       完全に同じ書式（同じ大きさ・同じ色・説明の直後）。
       行の右端へ右寄せしてはいけない: 同じロールの中に「値が説明の直後に来る行」と「値が
       右端へ飛ぶ行」が混在して様式が揃わない。ロールは1行ずつ読み下すもので、日時を列で
       見比べる機会が無く右寄せの利点も活きない。
       日時が無い（未解除・または日時が記録されていないデータ）なら名前だけ。区切りはまとめの
       行と同じ半角スペース1つ */
    const _achDate = _achDateText(a.id);
    rows.push({ type: 'roll', icon: a.icon, text: _achDate ? `${a.name} ${_achDate}` : a.name,
                ix: _TRUE_ENDING_ROLL_ICON_X, tx: _TRUE_ENDING_ROLL_TEXT_X,
                y, h: _TRUE_ENDING_ROLL_ROW_H });
    y += _TRUE_ENDING_ROLL_ROW_H;
  }
  /* 実績本編とまとめ（累計データ）の間は数行分あけ、まとめとして独立して
     見えるようにする（実績の続きとして流れ込むと埋没してしまうため）。
     さらに空白の後へ小見出しを1行置き、別のまとまりであることを明示する
     （_TRUE_ENDING_SUBHEADER_TEXT参照）。行高はフォント基準で持ち、上下に
     ほぼ半行ぶんずつの余白を作って、直後の統計行と詰まって見えないようにする */
  y += spacerBeforeSummary;
  /* スキップ操作の中間ジャンプ先（handleGameClick参照）。小見出しの行を
     基準にすることで、まとめブロックの先頭からきちんと読ませられる */
  const summaryStartIdx = rows.length;
  rows.push({ type: 'subheader', text: _TRUE_ENDING_SUBHEADER_TEXT, y, h: fsSub * 3.0, fs: fsSub });
  y += fsSub * 3.0;
  const summaryStats = [
    { icon: '🎮', text: `総プレイ回数 ${fmt(playCount)}` },
    { icon: '🏹', text: `総矢数 ${fmt(shotCount)}` },
    { icon: '🎊', text: `大当たり回数 ${fmt(jackpotCount)}` },
    { icon: '👑', text: `ベストギヨウザ ${fmt(bestCoins)}` },
    /* MUSICボーナスの自己ベスト。画面上の表記（♪×N）に合わせる */
    { icon: '🎵', text: `最高連鎖 ♪×${fmt(bestSyncChain)}` },
  ];
  /* まとめは実績とは独立した開始位置にする。小見出し「そうけっさん」は中央揃えなので、
     まとめ行を実績と同じ左端に置くとブロックの中心が32px左へずれ、タイトルに対して左に
     寄って見える（実績側を最長行基準で40px左へ寄せたぶんがそのまま効く＝実績とまとめでは
     行の長さが違うので同じ左端では揃わない）。
     実績名は固定文字列なので定数で持てるが、**まとめの行は数字で幅が変わる**ため、ここだけは
     実測してブロックが中央へ来る左端を毎回求める（同じ理由で定数化しない） */
  const _sumGap = _TRUE_ENDING_ROLL_TEXT_X - _TRUE_ENDING_ROLL_ICON_X;
  ctx.save();
  ctx.font = _TRUE_ENDING_ROLL_TEXT_FONT;
  let _sumMaxW = 0;
  for (const item of summaryStats) _sumMaxW = Math.max(_sumMaxW, ctx.measureText(item.text).width);
  ctx.restore();
  const _sumIconX = Math.round(W / 2 - (_sumGap + _sumMaxW) / 2);
  const _sumTextX = _sumIconX + _sumGap;
  for (const item of summaryStats) {
    rows.push({ type: 'roll', icon: item.icon, text: item.text,
                ix: _sumIconX, tx: _sumTextX,
                y, h: _TRUE_ENDING_ROLL_ROW_H });
    y += _TRUE_ENDING_ROLL_ROW_H;
  }
  y += spacerBeforeClose;

  const closeStartIdx = rows.length;
  for (const text of closeDisplayLines) {
    rows.push({ type: 'close', text, y, h: closeDy, fs: fsClose });
    y += closeDy;
  }
  return { rows, rollStartIdx, summaryStartIdx, closeStartIdx, closeRowCount: closeDisplayLines.length };
}

/* こんがり達成直後（自動）・タイトル画面のボタン（手動リプレイ）どちらからもここから入る */
function _startTrueEnding(replay) {
  _trueEndingIsReplay = replay;
  /* 実績パネルが開いたままエンドロールに入れてしまう経路があるため必ず閉じる。
     タイトル画面のハンドラは TRUE_ENDING_BTN の判定を「パネルを閉じる」判定より
     先に行うので、パネルを開いたまま再生ボタンを押すとshowAchievements=trueが
     残り、drawAchOverlayがエンドロールの上に被って演出が読めなくなる。
     エンドロール中は実績ボタン自体も無効化している（_achBtnEnabled参照）ので、
     入口でも閉じておくことで「エンドロール中はパネルが出ない」を両側から保証する */
  showAchievements = false;
  if (replay) {
    /* 実績パネルからの手動リプレイでは、フェードを挟まず即座に無音化してから鳴らす
       （_destroyBGMSourceを直接呼ぶ）。
       _stopBossBGMForVictory（120msフェード+150ms後に破棄）はボス勝利演出の余韻を意図した
       緩やかな停止だが、_playTrueEndingThemeは50ms後には最初の音を鳴らし始めるため、
       フェード中盤（ゲームBGMがまだ46〜73%の音量で鳴っている区間）とテーマ曲の出だしが
       数十ms重なって「BGMが混ざる」ように聞こえる。
       手動リプレイはユーザーの能動的な操作であり緩やかな余韻を残す必然性がないので、
       ボス勝利側の演出上の余韻フェードとは意図的に区別する */
    /* ここはランプにしない。直後に _destroyBGMSource() でソースごと止めるので
       ランプが渡り切らず意味が無い（この経路は「フェードを挟まず即座に無音化」が
       意図。上のコメント参照）。鳴り続けるソースの音量を動かす経路とは別物 */
    _setBgmGainNow(0);
    _destroyBGMSource();
  }
  phase = 'trueEnding';
  const content = _buildTrueEndingContent();
  /* 締めセリフの中央行が静止時に画面のどこへ来るかを逆算し、そこをスクロールの
     終点にする。速度が一定なので終点さえ決めれば自然にそこで止まる
     （間隔・行間の調整で「止まる位置の見え方」を作り込む）。行数は縦画面の
     折り返しで画面幅ごとに変わるため、常に実際の行数から中央行を求める */
  const midClose = content.rows[content.closeStartIdx + Math.floor(content.closeRowCount / 2)];
  const targetScrollY = H * 0.5 + (midClose.y + midClose.h / 2) - H * _TRUE_ENDING_CLOSE_REST_Y_RATIO;
  /* スキップ1段目の着地点（2段目が上のtargetScrollY＝締めセリフ）。
     描画は screenY = H/2 + 行の中心 - scrollY なので、小見出し行のyを
     そのままscrollYにすると小見出しが画面中央のすぐ下（H/2 + 行高/2）に来る
     ＝スクロール開始時に「たっせいのあかし」が置かれるのと同じ相対位置になり、
     直後の統計5行も画面内に収まる。まとめの先頭から読ませたいので、
     ブロックを画面中央に載せるのではなく先頭行の位置で決める */
  const summaryScrollY = content.rows[content.summaryStartIdx].y;
  _trueEnding = {
    stage: 'scroll', timer: 0,
    scrollY: 0, summaryScrollY, targetScrollY, content,
    closeAlpha: 1, titleAlpha: 0, titleGlow: 0, creditAlpha: 0, canExit: false,
  };
  _playTrueEndingTheme();
}

function _trueEndingEnterStage(stage) {
  const o = _trueEnding;
  o.stage = stage;
  o.timer = 0;
  /* 締めセリフのフェードアウトと同時にテーマ曲も一緒にフェードさせ、
     映像と音を同じタイミングで消す（余韻を残しつつ、の実装） */
  if (stage === 'closeLinesFadeOut') _stopTrueEndingTheme(_TRUE_ENDING_CLOSE_FADEOUT_FRAMES / 60);
}

/* 実績コンプリートの祝賀テーマ曲。通常BGM(152bpm)より落ち着いた100bpm相当、
   Cメジャーペンタトニックを維持した穏やかなアルペジオ+ベース。ループ再生
   ではなく一回限りのライブスケジューリング（_playKongariCompleteFanfareと
   同じ方式）。専用gainノードに通すことで、演出がスキップされた場合も
   このノードのゲインを落とすだけで即座に打ち切れる（個々のオシレーターを
   逐一追跡・停止する必要がない）。_TRUE_ENDING_BEATは冒頭の定数群
   （_TRUE_ENDING_SCROLL_SPEED参照）で定義済み */
const _TRUE_ENDING_MEL = [
  ['E',5,0.20], null, ['G',5,0.20], null, ['A',5,0.22], null, ['G',5,0.18], null,
  ['E',5,0.18], null, ['D',5,0.18], null, ['C',5,0.24], null, null, null,
];
const _TRUE_ENDING_BASS = [
  ['C',3,0.16], null, null, null, ['G',3,0.14], null, null, null,
  ['A',3,0.14], null, null, null, ['F',3,0.14], null, null, null,
];
function _playTrueEndingTheme() {
  if (!audioCtx) return;
  _trueEndingGain = audioCtx.createGain();
  _trueEndingGain.gain.value = 1;
  _trueEndingGain.connect(masterGain);
  const dest = _trueEndingGain;
  const t0 = audioCtx.currentTime + 0.05;
  const stepDur = _TRUE_ENDING_BEAT * 0.5;
  const phraseLen = _TRUE_ENDING_MEL.length * stepDur;
  const REPEATS = 7; // 約7フレーズ(≈34秒)。スクロール減速・締めセリフ延長で演出時間が伸びたため、
                      // 締めセリフのフェードアウト開始（テーマ曲側のフェード起点）まで確実に鳴り続ける長さを確保
  for (let r = 0; r < REPEATS; r++) {
    for (let s = 0; s < _TRUE_ENDING_MEL.length; s++) {
      const t = t0 + r * phraseLen + s * stepDur;
      const mel = _TRUE_ENDING_MEL[s];
      if (mel) playOsc(audioCtx, 'triangle', noteHz(mel[0], mel[1]), t, stepDur * 1.6, mel[2], 0.25, null, null, dest);
      const bas = _TRUE_ENDING_BASS[s];
      if (bas) playOsc(audioCtx, 'sine', noteHz(bas[0], bas[1]), t, stepDur * 3, bas[2], 0.3, null, null, dest);
    }
  }
}
function _stopTrueEndingTheme(rampSec = 0.3) {
  const g = _trueEndingGain;
  if (!g || !audioCtx) return;
  const t = audioCtx.currentTime;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(g.gain.value, t);
  g.gain.linearRampToValueAtTime(0, t + rampSec);
  _disconnectAfter(audioCtx, t + rampSec, g); // フェード完了後にmasterGainから切断する
  _trueEndingGain = null;
}

function _updateTrueEnding() {
  const o = _trueEnding;
  if (!o) { phase = 'idle'; return; }
  /* ここだけ_updateKingCommonFx()を使わず姿勢イージングのみ行うのは意図的。
     真エンディングはキング戦の続きではなく独立した演出で、飛翔文字もレーザーも
     drawBossBattleごと描画対象外になる（bossVictoryを90フレーム以上経てから
     入るため、その時点で既に消え切っている）。引き継いだキングの呼吸だけを
     静かに続けたい */
  if (_king) _easeKingXform();
  o.timer++;
  if (o.stage === 'scroll') {
    /* 見出しは締めセリフと同じく「静止表示→一定時間後にスクロール開始」に揃える
       （いきなり流れ始めると実績一覧が唐突に始まる感じが残るため、まず見出しを
       読ませてから動かす） */
    if (o.timer > _TRUE_ENDING_HEADER_HOLD_FRAMES) {
      o.scrollY = Math.min(o.scrollY + _TRUE_ENDING_SCROLL_SPEED, o.targetScrollY);
    }
    if (o.scrollY >= o.targetScrollY) _trueEndingEnterStage('closeLinesRest');
  } else if (o.stage === 'closeLinesRest') {
    if (o.timer > _TRUE_ENDING_CLOSE_LINGER_FRAMES) _trueEndingEnterStage('closeLinesFadeOut');
  } else if (o.stage === 'closeLinesFadeOut') {
    o.closeAlpha = Math.max(0, 1 - o.timer / _TRUE_ENDING_CLOSE_FADEOUT_FRAMES);
    if (o.timer >= _TRUE_ENDING_CLOSE_FADEOUT_FRAMES) _trueEndingEnterStage('titleFadeIn');
  } else if (o.stage === 'titleFadeIn') {
    /* 二次イージング（t*t）で序盤の立ち上がりを抑える。
       単純な線形フェード（timer/FRAMES）だと、暗い背景に金色グロー付き文字という組み合わせ
       では中盤（alpha 0.3〜0.5あたり）で既に肉眼上「ほぼ表示済み」に見え（実測: alpha0.3でも
       RGB(95,87,20)と背景からはっきり浮いた色になる）、残り半分のフェードがほとんど知覚
       できず「フェードインしていない、ただ長く待たされるだけ」に見える。
       イージングを掛けると輝度の変化がフェード時間いっぱいに知覚できる */
    const t = Math.min(1, o.timer / _TRUE_ENDING_TITLE_FADEIN_FRAMES);
    o.titleAlpha = t * t;
    if (o.timer >= _TRUE_ENDING_TITLE_FADEIN_FRAMES) _trueEndingEnterStage('titleHold');
  } else if (o.stage === 'titleHold') {
    /* フェード完了（alpha=1固定）後、まずグローを0→フルへ育て、それが育ち切ってから
       クレジットを単独でフェードインさせる。タイトルが完全に出てからクレジットが出る、
       という順序と、タイトルの下に十分な間隔を空けることの2点が要件。
       グロー成長を分離した結果「輝きが増していく」演出にもなる。
       いずれも同じt*tの二次イージングで知覚できるフェードにする */
    const gt = Math.min(1, o.timer / _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES);
    o.titleGlow = gt * gt;
    const creditTimer = Math.max(0, o.timer - _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES);
    const ct = Math.min(1, creditTimer / _TRUE_ENDING_CREDIT_FADEIN_FRAMES);
    o.creditAlpha = ct * ct;
    if (!o.canExit && o.timer > _TRUE_ENDING_TITLE_MIN_HOLD_FRAMES) o.canExit = true;
  }
}

/* 開幕セリフ・実績ロール・締めセリフを同じスクロール座標・同じ縁フェードで
   描く統一関数（旧_drawTrueEndingLines・_drawTrueEndingRollを統合）。
   締めセリフだけはcloseAlphaを追加で掛けて、静止後のフェードアウトを表現する */
function _drawTrueEndingRows(o) {
  const rows = o.content.rows;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const screenY = H * 0.5 + (row.y + row.h / 2) - o.scrollY;
    if (screenY < -40 || screenY > H + 40) continue;
    let edgeFade = Math.min(1, Math.min(screenY, H - screenY) / 60);
    if (edgeFade <= 0) continue;
    if (row.type === 'close') edgeFade *= o.closeAlpha;
    if (edgeFade <= 0) continue;
    ctx.globalAlpha = edgeFade;
    if (row.type === 'roll') {
      /* アイコン・文字列は_TRUE_ENDING_ROLL_ICON_X/TEXT_X等で位置・フォントをそれぞれ
         独立指定する（定義箇所のコメント参照）。アイコンをleft寄せにするのは、文字列側の
         開始位置がアイコンの実測幅に一切影響されないようにするため。
         右寄せで詰めると、U+FE0F付きグリフ（「フィーバー初体験」🌡️・「常連客」🕹️）の
         実測送り幅がプラットフォームによって狂い、その2つだけ文字と隙間なく詰まって見える */
      ctx.textBaseline = 'middle';
      ctx.font = _TRUE_ENDING_ROLL_ICON_FONT;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      /* Xは行ごとに持つ（実績は固定の定数、まとめは実測で中央へ寄せた値。
         まとめ行の組み立て箇所のコメント参照） */
      ctx.fillText(row.icon, row.ix, screenY);
      ctx.font = _TRUE_ENDING_ROLL_TEXT_FONT;
      ctx.fillStyle = Y;
      ctx.textAlign = 'left';
      ctx.fillText(row.text, row.tx, screenY);
    } else if (row.type === 'header') {
      /* 実績一覧の見出し: 文字の上下に細い罫線を1本ずつ引くだけの最小構成
         （締めで丸いギヨウザロゴを大きく見せる構成を弱めないよう、冒頭は
         文字と罫線のみに留める）。罫線は文字幅より少し広い固定幅で、
         中央から左右対称に引く */
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px ${FONT_MIN}`;
      const ruleHalfW = Math.min(W * 0.34, ctx.measureText(row.text).width / 2 + row.fs * 1.6);
      const ruleDy = row.fs * 1.05;
      ctx.strokeStyle = 'rgba(245,208,32,0.55)';
      ctx.lineWidth = 1;
      for (const dy of [-ruleDy, ruleDy]) {
        ctx.beginPath();
        ctx.moveTo(W / 2 - ruleHalfW, screenY + dy);
        ctx.lineTo(W / 2 + ruleHalfW, screenY + dy);
        ctx.stroke();
      }
      outText(row.text, W / 2, screenY, Y, 'rgba(0,0,0,0.9)', 6);
    } else if (row.type === 'subheader') {
      /* まとめの小見出し: 罫線を引かず、字間を広げた文字だけで区切りを示す
         （冒頭の見出しより一段軽い格に保つ。_TRUE_ENDING_SUBHEADER_TEXT参照）。
         字間はctx.letterSpacingに頼らず、1文字ずつ実測幅＋トラッキング分だけ
         送って描く（letterSpacingは環境によって未対応で、その場合は字間が
         詰まったまま無言で描かれてしまうため）。全体幅を先に合計して中央から
         左右対称に配置する */
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px ${FONT_MIN}`;
      const chars = [...row.text];
      const tracking = row.fs * _TRUE_ENDING_SUBHEADER_TRACKING_RATIO;
      const widths = chars.map(c => ctx.measureText(c).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
      ctx.textAlign = 'left';
      let x = W / 2 - totalW / 2;
      for (let c = 0; c < chars.length; c++) {
        outText(chars[c], x, screenY, Y, 'rgba(0,0,0,0.9)', 5);
        x += widths[c] + tracking;
      }
    } else {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px ${FONT_MIN}`;
      outText(row.text, W / 2, screenY, '#e8e2d0', 'rgba(0,0,0,0.9)', 6);
    }
  }
  ctx.globalAlpha = 1;
}

/* エンドロール中にキングを描画してはいけない。こんがり達成の退場演出でキングは既に空へ
   飛び去っているため、ここで再登場させると矛盾する（_TRUE_ENDING_HEADER_TEXT付近の
   コメント参照）。エンドロールの構成は「見出し → 実績ロール → まとめ → 締めのセリフ →
   タイトル」で、ボス本体は登場しない */

/* 崎陽軒ギヨウザのパッケージにある丸いロゴマークを模した装飾。
   黄色い円を縦3分割し、中央（やや幅広）を緑地に白文字で大きく「ギヨウザ」、
   左右を黄地に緑文字で「餃　子」「横　濱」（各文字の間を少しあけて表示）。
   中央エリアだけ内側にわずかに小さい円でクリップして塗るため、
   中央の上下だけ外周の黄色いリングが弧状に残って見える */
function _drawGyozaCircleLogo(cx, cy, R, alpha, rot = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy);
  ctx.rotate(rot); // タイトル画面のホイール流用時、ホイールの回転と同期させるため

  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = Y;
  ctx.fillRect(-R, -R, R * 2, R * 2);
  /* 外径の枠線（黄色いリング）は細めに */
  ctx.beginPath();
  ctx.arc(0, 0, R * (1 - 0.08 / 3), 0, Math.PI * 2);
  ctx.clip();
  const centerHalfW = R * 0.40; // 中央エリアを少し狭く
  ctx.fillStyle = GN;
  ctx.fillRect(-centerHalfW, -R, centerHalfW * 2, R * 2);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const sideFont  = R * 0.28 * 0.85; // 少し小さく
  const sideLineH = sideFont * 1.15;
  const sideGap   = sideFont * 0.8; // 文字の間を少し広げる
  /* エリア中央（数学的な中点）よりわずかに内周（中央エリア）寄りにオフセットし、
     文字の周囲に均等な余白ができるようにする（崎陽軒の実物パッケージ参照） */
  const sideCX    = (centerHalfW + R) / 2 - R * 0.05;
  ctx.font = `bold ${sideFont}px ${FONT_MIN}`;
  ctx.fillStyle = GN;
  ctx.fillText('横', sideCX, -sideLineH / 2 - sideGap / 2);
  ctx.fillText('濱', sideCX, sideLineH / 2 + sideGap / 2);
  ctx.fillText('餃', -sideCX, -sideLineH / 2 - sideGap / 2);
  ctx.fillText('子', -sideCX, sideLineH / 2 + sideGap / 2);

  const centerFont  = R * 0.34 * 1.4 * 1.08; // 「ギヨウザ」を1.4倍、さらに全体を1.08倍に
  const centerLineH = centerFont * 0.88; // 文字間隔を少し詰める（中心揃えは対称な配置式のため自動的に維持される）
  ctx.font = `bold ${centerFont}px ${FONT_MIN}`;
  ctx.fillStyle = '#ffffff';
  const chars = ['ギ', 'ヨ', 'ウ', 'ザ'];
  const charScaleX = [1.08, 1.20, 1.00, 0.94]; // ヨを少し大きく、ウ・ザを少し小さく
  chars.forEach((c, i) => {
    const y = (i - (chars.length - 1) / 2) * centerLineH;
    ctx.save();
    ctx.translate(0, y);
    ctx.scale(charScaleX[i], 0.92); // 縦横比を変え、横幅を少し広げつつ縦をごくわずかに潰す
    ctx.fillText(c, 0, 0);
    ctx.restore();
  });

  ctx.restore();
}

function drawTrueEnding() {
  if (phase !== 'trueEnding' || !_trueEnding) return;
  const o = _trueEnding;
  ctx.save();

  if (o.stage === 'titleFadeIn' || o.stage === 'titleHold') {
    /* ロゴは画面の上下中央に配置し、タイトルと同じくo.titleAlphaで
       じんわりフェードインさせる。暗幕より先に描くことで、他の
       ステージと同じ暗幕の下に沈んだ見え方になる */
    _drawGyozaCircleLogo(W / 2, H / 2, (IS_PORTRAIT ? 62 : 82) * 3, o.titleAlpha);
  }

  /* 暗幕はエンドロールを通して常に同じ明るさ（元の仕様）にする。
     ステージによって暗幕の色を変えると明るさが唐突に変わって見えるため、
     ここで一箇所にまとめて描く */
  ctx.fillStyle = 'rgba(4,6,10,0.86)';
  ctx.fillRect(0, 0, W, H);

  if (o.stage === 'titleFadeIn' || o.stage === 'titleHold') {
    const creditFontSize = IS_PORTRAIT ? 12 : 14;
    /* タイトルをCOPYRIGHT行の文字列の縦幅（フォントサイズ）分下へ、
       COPYRIGHT行を同じ幅分さらに上へずらし、両者の間隔を詰める */
    const titleY = H * 0.5 - _TRUE_ENDING_TITLE_Y_OFFSET + creditFontSize;
    ctx.globalAlpha = o.titleAlpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${IS_PORTRAIT ? 34 : 46}px ${FONT_MIN}`;
    ctx.fillStyle = Y;
    /* フェード中はグローを併用しない。macOS Safari ではアルファのフェードとshadowBlurの
       グローを同時に変化させると、globalAlphaにもshadowColor自体へのalpha埋め込みにも
       関わらず、フェードが一瞬で終わったように見える（shadowBlur無しの描画では意図どおりに
       フェードする）。アルファ変化とグロー変化を同時に扱うこと自体がSafariの合成で正しく
       扱われないため、時間的に分離する: フェード中(titleFadeIn)はグロー無しの単純な文字
       フェードのみとし、フェードが完了してalphaが1に固定された後（titleHold）にグローだけを
       別途0→フルへ育てる（o.titleGlow、更新側参照）。輝きが増していく演出にもなる */
    const glow = o.stage === 'titleHold' ? o.titleGlow : 0;
    if (glow > 0) {
      ctx.shadowColor = `rgba(245,208,32,${0.7 * glow})`;
      ctx.shadowBlur = 16 * glow;
    }
    ctx.fillText('ギヨウザ ルーレット', W / 2, titleY);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    if (o.stage === 'titleHold' && o.creditAlpha > 0) {
      ctx.globalAlpha = o.creditAlpha;
      ctx.font = `${creditFontSize}px ${FONT_MIN}`;
      ctx.fillStyle = 'rgba(245,208,32,0.75)';
      ctx.fillText(_TRUE_ENDING_CREDIT_TEXT, W / 2, H * 0.5 + (IS_PORTRAIT ? 78 : 90) - _TRUE_ENDING_TITLE_Y_OFFSET - creditFontSize * 2);
      ctx.globalAlpha = 1;
    }
    /* 終了操作の案内バッジは出さない。canExit成立後はタップ/クリック/キー入力
       （handleGameClick、'trueEnding'分岐参照）でいつでも終了できるが、余韻を優先して
       静かに佇む演出のままにする */
  } else {
    /* キングはここでは描かない（旧_trueEndingKingAlphaの削除理由は同関数が
       あった位置のコメント参照）。ロール本文だけを流す */
    _drawTrueEndingRows(o);
  }
  ctx.restore();
}

/* 真エンディング終了処理。自動再生（本編勝利）・リプレイ（タイトル画面のボタン）の
   どちらでも、エンディングの後は常にゲームスタート前の初期画面（startup）へ戻す
   （エンドロールはゲームの続きではなく、スタートと並列の選択肢という位置づけ）。
   本編勝利からの初回再生の場合のみ、キング戦関連のstateを後片付けする必要がある
   （_trueEndingIsReplayがfalseの時。リプレイはそもそも戦闘を経ていないため不要）。
   startup画面はそもそもBGMが鳴らない設計のため、ここでstartBGM()等は呼ばない
   （無音のまま戻る）。
   ただし bgmGain は必ず 1 へ戻すこと。本編勝利経由（_stopBossBGMForVictoryが120msフェードで
   0にする）・タイトル画面からのリプレイ（_startTrueEndingのreplay分岐が二重再生防止で即座に
   0にする）のどちらも、放置すると0のまま残る。真エンディングのテーマ曲自体は専用の
   _trueEndingGain経由なので鳴るが、bgmGain=0のまま次回のSTART（playStartJingleがdest=bgmGain
   経由でジングルを鳴らす。scheduleJingle参照）を迎えると、オリエンタルリフとカウントインが
   無音のまま進行し、その後startBGM()がbgmGainを1に戻した瞬間に通常BGMだけ唐突に鳴り出す
   ＝画面（ゲームは即座に開始済み）と音のズレとして体感される */
function _finishTrueEnding() {
  trueEndingSeen = true;
  lsSaveStats();
  if (!_trueEndingIsReplay) _cleanupKingBattleState();
  _trueEnding = null;
  phase = 'startup';
  _setBgmGainNow(1);
}

/* 6回目の失敗で、4的それぞれに最後のひびが入り終えた瞬間に呼ばれる
   （_updateKingCharFlights参照）。的が砕けて破片が全て消えてから、キングギヨウザ失敗が
   確定するという順序を守るための段。
   4的それぞれの4セグメントをそのまま破片として使い（新規ジオメトリを起こさず既存のsegs/色を
   そのまま流用）、的の中心から外向きに飛び散らせる。
   phaseを'bossShatter'に切り替えて入力を止め、_updateKingReelShatterが全破片の消滅を監視して
   _startBossDefeatへ引き継ぐ */
/* 角度を 0〜2π へ正規化 */
function _norm2pi(a) { const t = a % (Math.PI * 2); return t < 0 ? t + Math.PI * 2 : t; }

/* 的1枚を「ひびの入った位置」で分割した破片の境界角（的ローカル＝OCの座標系、昇順）を返す。
   均等に4つへ割るのではなく、実際に入ったひびの位置で割ること（位置と無関係な等分割は
   違和感になる）。
   ひびの保存角は基準文字エリア起点の相対角なので、現在の的の基準角を足してOCの座標系へ戻す
   （drawKingReelの描画と同じ変換）。
   ひびが2本未満だと扇形に分割できないため、その場合だけ文字セグメントの境界で割る
   （KING_MAX_FAILS回失敗して破砕に至る時点では通常6本あるので、これは保険の経路） */
function _kingReelShatterBounds(w, idx) {
  const cracks = (_king.reelCracks && _king.reelCracks[idx]) || [];
  const anchor = _kingReelAnchorAngle(w);
  let bounds = cracks.map(c => _norm2pi(c.angle + anchor)).sort((a, b) => a - b);
  /* ほぼ同じ角度のひびが重なると極端に細い破片ができるのでまとめる */
  const MIN_GAP = 0.12;
  bounds = bounds.filter((a, i) => i === 0 || a - bounds[i - 1] > MIN_GAP);
  /* 先頭と末尾が2π跨ぎで近すぎる場合も末尾を落とす */
  if (bounds.length > 1 && (bounds[0] + Math.PI * 2 - bounds[bounds.length - 1]) <= MIN_GAP) bounds.pop();
  if (bounds.length >= 2) return bounds;
  return w.segs.map(s => _norm2pi(s.start)).sort((a, b) => a - b);
}

function _startKingReelShatter() {
  phase = 'bossShatter';
  const pieces = [];
  for (let idx = 0; idx < _king.reels.length; idx++) {
    const w = _king.reels[idx];
    const bounds = _kingReelShatterBounds(w, idx);
    for (let i = 0; i < bounds.length; i++) {
      const a0 = bounds[i];
      const a1 = (i + 1 < bounds.length) ? bounds[i + 1] : bounds[0] + Math.PI * 2;
      const span = a1 - a0;
      const mid  = a0 + span / 2;                 // 的ローカルでの破片の中心角
      const world = w.rot + mid;                  // 現在の的の向きを反映したワールド角
      /* 細い破片ほど軽い＝速く飛ぶようにして、割れ方の不均等さを動きにも出す */
      const spd = (2.5 + Math.random() * 3) * (1 + (Math.PI / 2 - Math.min(span, Math.PI / 2)) * 0.35);
      pieces.push({
        cx: w.x, cy: w.y, x: 0, y: 0,
        vx: Math.cos(world) * spd, vy: Math.sin(world) * spd - 2.5, // 少し上向きに弾ける
        rot: world, rotSpd: (Math.random() - 0.5) * 0.3,
        span, mid,
        /* 破片は的のOCを扇形にクリップして描く＝元の絵柄（文字・色）がそのまま
           乗るので「同じ的が割れた」ように見える。OCは破砕中は生きている
           （返却は_cleanupKingBattleState/_updateBossDefeatShrinkで、いずれも
           破砕完了後に実行される）。未対応環境向けにcharも保持してフラット塗り
           にフォールバックできるようにしておく */
        oc: w._oc, ocR: w._ocR,
        char: (w.segs.find(s => mid >= s.start && mid < s.start + s.span) || w.segs[0]).char,
      });
    }
  }
  _kingShatter = { pieces, timer: 0 };
  playSE('bossFlash'); // 破砕の衝撃（既存の演出用SEを流用、新規SEは追加しない）
}

function _updateKingReelShatter() {
  /* ボス本体の呼吸・位置イージング、直前attemptの文字飛翔（まだ落下中の
     ものが残っている場合）、レーザー演出は破砕中も止めない */
  _updateKingCommonFx();

  const s = _kingShatter;
  if (!s) { _startBossDefeat(); return; }
  s.timer++;
  for (const p of s.pieces) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.3; // 重力
    p.rot += p.rotSpd;
  }
  /* 全破片が画面外に出きった、または保険の上限フレームに達したら敗北確定へ
     （破片が全て消えてから敗北が確定する順序を守る） */
  const allGone = s.timer > KING_SHATTER_MAX_FRAMES || s.pieces.every(p => {
    const x = p.cx + p.x, y = p.cy + p.y;
    return x < -80 || x > W + 80 || y < -80 || y > H + 80;
  });
  if (allGone) {
    _kingShatter = null;
    _startBossDefeat();
  }
}

function drawKingReelShatter() {
  if (phase !== 'bossShatter' || !_kingShatter) return;
  for (const p of _kingShatter.pieces) {
    ctx.save();
    ctx.translate(p.cx + p.x, p.cy + p.y);
    ctx.rotate(p.rot);
    /* 破片の形は「ひびから隣のひびまで」の扇形。回転の基準を破片の中心角に
       置いているので、ローカルでは -span/2〜+span/2 の扇形になる */
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, KING_WR, -p.span / 2, p.span / 2);
    ctx.closePath();
    if (p.oc) {
      /* 元の絵柄を扇形で切り出して貼る。rotate(-p.mid)でOCの座標系へ戻すことで、
         OC上の角度θが この破片ローカルの (θ-mid) に来る＝割れる前と同じ位置の
         模様がそのまま乗る */
      ctx.save();
      ctx.clip();
      ctx.rotate(-p.mid);
      ctx.drawImage(p.oc, -p.ocR, -p.ocR, p.ocR * 2, p.ocR * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = SEG_L[p.char]; // OC未対応環境向けフォールバック
      ctx.fill();
    }
    /* 割れ口の縁を描いて破片の輪郭を立たせる */
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

/* こんがり攻撃失敗がKING_MAX_FAILS回に達し、ルーレットが完全破壊された＝敗北。
   所持ギヨウザの半分がキングギヨウザに吸収され、通常ゲームへ戻る。
   演出はdrawBossVictoryと対になる構成（暗幕・ボス・タイトル・CONTINUEバッジ）に揃え、
   勝利側との対称性を保つ */
function _startBossDefeat() {
  phase = 'bossDefeat';
  _bossDefeatTimer = 0;
  /* 敗北時のking値: 0（振り出しに戻す）ではなく、途中からやり直しにする。
     戦闘開始時点で_initBossBattleが0にリセット済みのため、ここで上書きする。
     戻す先は予兆の窓より下にする（KING_DEFEAT_RESTART_RATIOの定義部参照） */
  kingGyozaMeter = KING_GYOZA_THRESHOLD * KING_DEFEAT_RESTART_RATIO;
  lsSaveStats();
  if (_king) {
    _king.scale = 1;
    /* 没収額は端数を切り上げる（半分を残すのではなく半分を取る側を優先）。
       これにより所持1の場合はceil(1/2)=1で残数ゼロまで没収され、「1だったら全部没収されて
       ゲームオーバー」という直感的な期待に一致する（floorだと1所持時に没収0になり、何も
       没収されないまま復帰してしまう） */
    const lost = Math.ceil(coins / 2);
    coins -= lost;
    _king.lostCoins = lost; // 敗北画面での表示用（_kingBattleEndでのちに_kingがnullになるため先に記録）
    /* 没収分はキングに取り込まれたものとしてプールし、いつかこんがり達成した時に
       まとめて返す。敗北を重ねるほどプールが厚くなり、達成時の見返りが大きくなる。
       永続化はlsSaveStats側 */
    kingLostPool += lost;
    lsSave();
    lsSaveStats();
  }
  /* 敗北の瞬間、ボスBGMをテープが止まるように減速させる（stopBGMTape、予兆演出・
     通常ゲームオーバーと同じ手法）。ここで止めないとBGMが鳴りっぱなしになり、
     ゲームオーバーSEと被って聞こえづらい。
     _kingBattleEnd経由で通常モードへ戻る際のstartBGMTapeが現在のレートからイーズインする
     ため、ここで止めても復帰時に自然に繋がる */
  stopBGMTape(700);
  playSE('gameOver');
}

function _updateBossDefeat() {
  _bossDefeatTimer++;
  /* 勝利側と同様、直前に飛ばした文字の演出（跳ね返り等）を決着後も止めない */
  _updateKingCommonFx();
}

function drawBossDefeat() {
  if (phase !== 'bossDefeat') return;
  /* 没収で所持ギヨウザが尽きた場合も、この「こんがり しっぱい」＋キングが縮んで
     ギヨウザ群へ戻っていく演出を先に見せ、そのあとで通常モードのコイン枯渇ゲームオーバー
     画面へ進む。coins<=0をここで早期分岐させて通常ゲームオーバー画面を先に出してはいけない。
     出口の切り替えは_kingBattleEnd側で行う */
  _drawKingOutcomeScreen({
    veil: 'rgba(30,0,0,0.5)',
    title: 'こんがり しっぱい……',
    titleFill: '#ff6655', titleStroke: 'rgba(40,0,0,0.9)',
    /* 没収は個数の実数ではなく割合で表示する。_startBossDefeatの没収ロジック
       （Math.ceil(coins/2)）が常に「所持数の半分」である事実をそのまま文言にする */
    sub: '所持ギヨウザの半数が 吸収された……',
    subFill: '#d8d8ff', subStroke: 'rgba(0,0,0,0.85)',
    timer: _bossDefeatTimer,
  });
}

function drawBossDefeatOutro() {
  if (phase !== 'bossDefeatOutro' || !_defeatOutro) return;
  const o = _defeatOutro;
  ctx.save();
