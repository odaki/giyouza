const _TRUE_ENDING_HEADER_TEXT = 'たっせいのあかし';
/* まとめ（累計データ）の前に置く小見出し。空白だけで区切っていたときは
   実績一覧の続きなのか別のまとまりなのかが読み取りにくかったため、語を1つだけ置く。
   冒頭の見出しと同じ「罫線で挟む」様式にはせず、罫線なし・小さめの文字・字間を広げる
   だけに留める（ユーザー選択）。エンドロール中に強い見出しが2回出ると、締めで
   丸いギヨウザロゴを大きく見せる構成が相対的に弱まるため、格を一段下げて
   「冒頭の見出し＞この小見出し」の関係を視覚的に保つ */
const _TRUE_ENDING_SUBHEADER_TEXT = 'そうけっさん';
/* 小見出しの字間（フォントサイズ×この値）。フォントを小さくすると見出しらしさも
   一緒に落ちるので、字間を広げることで「小さいが見出しである」ことを補う。
   ctx.letterSpacingは対応状況が環境依存なので使わず、1文字ずつ実測幅で送る */
const _TRUE_ENDING_SUBHEADER_TRACKING_RATIO = 0.3;
const _TRUE_ENDING_CLOSE_LINES = [
  'ギヨウザたちは',
  'あなたの手によって',
  'おいしく進化しました。',
  'ありがとう。',
];
const _TRUE_ENDING_ROLL_ROW_H = 40; // クレジットロール1行の高さ
/* 実績ロール1行内の「アイコン」「文字列」の位置・フォントをそれぞれ独立した
   定数として明示指定する。以前はアイコンをtextAlign='right'で文字列の
   すぐ左に詰めて置いていたため、絵文字グリフの実測送り幅がプラットフォーム
   依存でわずかに狂う（U+FE0F付きコードポイントで実際に発生）と、文字列側の
   開始位置がその影響をそのまま受けて隙間が潰れていた。アイコンを
   textAlign='center'の固定スロットに変え、文字列の開始位置もアイコンの
   実測幅から逆算せず完全に独立した固定値にすることで、個々のグリフの
   幅ゆれに左右されず確実に隙間を確保する。将来アイコン・文字列それぞれの
   サイズだけを個別に調整したい場合もこの4定数だけを触ればよい */
/* アイコンの見た目サイズは絵文字1文字ぶんで固定なので、textAlign='left'で
   常に同じ左端に描けば揃う（'center'/'right'は送り幅の半分/全部を左へ
   シフトする計算が入るため、送り幅の実測がグリフと食い違う環境ではその
   ぶんズレる。'left'はシフト計算そのものが無いのでこのズレが原理的に
   起きない。ユーザー指摘により変更） */
const _TRUE_ENDING_ROLL_ICON_X    = W / 2 - 92; // アイコンの左端
const _TRUE_ENDING_ROLL_ICON_FONT = `18px serif`;
const _TRUE_ENDING_ROLL_TEXT_X    = W / 2 - 44; // 文字列の開始位置（アイコンの実測幅とは無関係）
const _TRUE_ENDING_ROLL_TEXT_FONT = `bold 15px 'Hiragino Mincho ProN',serif`;
/* テーマ曲の拍の長さ（秒）。_playTrueEndingThemeのstepDur算出にも使う
   （ここで先に定義することでスクロール速度の算出にも使えるようにした） */
const _TRUE_ENDING_BEAT = 0.6;
/* 演出全体を貫く唯一の速度。以前はセリフ(タイマーで1行ずつ表示)→
   ロール(rollYスクロール)→締め(固定表示)がそれぞれ別の時間軸・別の
   見せ方で継ぎ目がバラバラだったため、開幕セリフ・実績ロール・締めの
   セリフを1本の縦スクロール座標に乗せ、同じ速度で流し続ける方式に統一した。
   速度は勘のpx/frame値ではなく、実績ロール1行(_TRUE_ENDING_ROLL_ROW_H)が
   テーマ曲ちょうど1拍分の時間で流れるように、行の高さと拍の長さから
   直接算出する（ユーザー要望: スクロールがBGMのテンポと同期して感じられる
   ように）。結果は1.111...px/frameで、以前の指摘で落ち着かせた1.2に近い
   速度のまま、テーマ曲のリズムに正確に乗る */
const _TRUE_ENDING_SCROLL_SPEED = _TRUE_ENDING_ROLL_ROW_H / (_TRUE_ENDING_BEAT * 60);
const _TRUE_ENDING_HEADER_HOLD_FRAMES = 130; // 見出しを静止表示しておく時間（締めセリフの静止表示と対にする）
/* 各区間の空白（何も表示されない区間）はH比で定義する。縦画面と横画面で
   H（IS_PORTRAIT ? 820 : 560）が大きく異なり、同じpx値だと縦画面では
   相対的に間延びして見え・横画面では逆に窮屈に見えるため、必ずH比で
   持たせて画面比に依存しない見え方にする（実機指摘: 縦横で最適な間隔が違う）。
   SPACER_BEFORE_CLOSEは特に、締めセリフが静止した瞬間にまとめ（累計データ）
   の末尾がまだ画面に残って見えるという指摘を受け、静止位置での重なりが
   出ない値（縦横それぞれで計算済み・80px前後の余裕を持たせた）まで広げた */
/* 見出し〜実績ロールの間隔。他の空白と違い固定のH比では持たせない。
   見出しは静止表示（_TRUE_ENDING_HEADER_HOLD_FRAMES）してから流れ始めるので、
   その静止中に実績の先頭行が画面内に居ると「見出しを読ませてから一覧が始まる」
   という段取りが崩れる。かつ見出しの行高は画面比ではなくフォント基準の絶対値
   なので、H比を固定すると縦横で「静止中に何行見えるか」が変わってしまう
   （縦画面のほうが多く見えてしまう）。そこで「静止中は先頭行が画面下端の
   ちょうど外に居る」位置を逆算し、縦横で同じ見え方に揃える */
function _trueEndingSpacerAfterHeader(headerH) {
  return Math.max(H * 0.18, H * 0.5 - _TRUE_ENDING_ROLL_ROW_H / 2 - headerH);
}
const _TRUE_ENDING_SPACER_BEFORE_SUMMARY_RATIO = 0.14; // 実績本編〜まとめ（累計データ）の間隔
const _TRUE_ENDING_SPACER_BEFORE_CLOSE_RATIO = 0.55; // 実績まとめ〜締めセリフの間隔
const _TRUE_ENDING_CLOSE_LINE_DY_RATIO = 2.0; // 締めセリフの行間（フォントサイズ×この値。開幕より少し詰める）
const _TRUE_ENDING_CLOSE_REST_Y_RATIO = 0.5; // 締めセリフが止まった時、中央行を画面のどこに置くか(H比)
const _TRUE_ENDING_CLOSE_LINGER_FRAMES = 170; // 締めセリフが止まってからフェードアウトを始めるまでの余韻（表示時間が短いとの指摘で延長）
const _TRUE_ENDING_CLOSE_FADEOUT_FRAMES = 70;
const _TRUE_ENDING_TITLE_FADEIN_FRAMES = 150; // 締めくくりのタイトル表示。重要な瞬間なのでゆっくりフェードインさせる（旧50=0.83sは早すぎるとの指摘で2.5sに延長）
/* macOS Safari実機報告: フェード中にshadowBlurのグローを併用すると、
   globalAlphaがshadowの描画に正しく効かず（shadowColor自体にalphaを
   埋め込んでも改善せず）、フェードが一瞬で終わったように見えてしまう
   不具合があった。alpha変化とshadowBlur変化を同時に行うこと自体が
   Safari側の合成でうまく扱えていないと考えられるため、両者を時間的に
   分離する設計に変更（ユーザー提案）: フェード中はグロー無しの単純な
   文字フェードのみ（globalAlpha単体は既にクレジット表示で動作確認済み）、
   フェードが完了してアルファが1で固定された後にグローだけを別途
   育てる。「輝きが増していく」印象も強くなる */
const _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES = 60; // フェード完了後、グローが0→フルに育つ時間
/* タイトル＋COPYRIGHTのブロック全体を一行分上にずらすオフセット。
   PAUSE中は"PAUSED"がH*0.5に表示されるため、そのままだとタイトルと
   重なってしまう。タイトルとCOPYRIGHTを一行分まとめて上にずらすことで、
   PAUSED表示がその間（隙間）に収まるようにする */
const _TRUE_ENDING_TITLE_Y_OFFSET = IS_PORTRAIT ? 34 : 46;
const _TRUE_ENDING_CREDIT_TEXT = 'COPYRIGHT © 2026 Michiyasu ODAKI';
const _TRUE_ENDING_CREDIT_FADEIN_FRAMES = 90; // グローが育ち切った後、クレジットが単独でフェードインする時間
const _TRUE_ENDING_FIN_LINGER_FRAMES = 150; // クレジットが出そろってからFIN.を出すまでの余韻（早すぎるとの指摘で延長）
/* FIN.受付までの最短フレーム数。グロー成長・クレジットのフェードインが
   終わり切ってから、さらに余韻を置いた後の時間として算出する
   （マジックナンバーで持たず、各段階の時間から機械的に求める） */
const _TRUE_ENDING_TITLE_MIN_HOLD_FRAMES =
  _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES + _TRUE_ENDING_CREDIT_FADEIN_FRAMES + _TRUE_ENDING_FIN_LINGER_FRAMES;

/* { stage, timer, scrollY, targetScrollY,
     content:{rows,rollStartIdx,closeStartIdx},
     closeAlpha, titleAlpha, canExit }
   stage: 'scroll' → 'closeLinesRest' → 'closeLinesFadeOut' → 'titleFadeIn' → 'titleHold'
   タップ操作は3段階の"表示"（見出し＋実績一覧／締めセリフ／タイトル）を
   順に1段ずつ進める（handleGameClickのphase==='trueEnding'分岐参照） */
let _trueEnding = null;
let _trueEndingIsReplay = false; // タイトル画面のボタンからの単体再生か（_finishTrueEndingでのキング戦state後片付けの要否に使う）
let _trueEndingGain = null; // テーマ曲専用のgainノード（スキップ時に即座にフェードして打ち切るため）

/* セリフ1文を指定フォント・幅に収まるよう折り返す。セリフの原文には
   フレーズの区切りに半角/全角スペースが入っているため、それを語境界として
   貪欲法で行に詰める（決め打ちの改行位置を持たず、画面幅から動的に決める）。
   縦画面（W=420）は横画面（W=1060）よりずっと狭く、同じ1行表示だと
   セリフが画面外へはみ出していた（実機指摘）ため導入した */
function _wrapTrueEndingLine(text, font, maxWidth) {
  ctx.font = font;
  const words = text.split(/[ 　]+/).filter(w => w.length > 0);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const trial = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(trial).width > maxWidth) {
      lines.push(cur);
      cur = w;
    } else {
      cur = trial;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* 開幕セリフ→実績ロール→まとめ（累計データ）→締めセリフを1本の縦スクロール
   座標に並べる。screenY = H*0.5 + row.y+row.h/2 - scrollY という共通の式で
   位置を出す（scrollY=0の時、先頭の開幕セリフがH*0.5に来る＝旧act1の見た目を継承） */
function _buildTrueEndingContent() {
  const fsHeader = IS_PORTRAIT ? 24 : 28;
  const headerH  = fsHeader * 2.6; // 上下の罫線ぶんの余白を含む行高
  const fsSub    = IS_PORTRAIT ? 18 : 20; // まとめの小見出し（実績行15pxより一回り大きく、冒頭見出しよりは小さい）
  const fsClose = IS_PORTRAIT ? 20 : 24;
  const closeDy = fsClose * _TRUE_ENDING_CLOSE_LINE_DY_RATIO;
  const spacerAfterHeader   = _trueEndingSpacerAfterHeader(headerH);
  const spacerBeforeSummary = H * _TRUE_ENDING_SPACER_BEFORE_SUMMARY_RATIO;
  const spacerBeforeClose   = H * _TRUE_ENDING_SPACER_BEFORE_CLOSE_RATIO;
  const maxTextWidth = W - 48; // 左右マージン24pxずつ

  const closeFont = `bold ${fsClose}px 'Hiragino Mincho ProN',serif`;
  const closeDisplayLines = _TRUE_ENDING_CLOSE_LINES.flatMap(t => _wrapTrueEndingLine(t, closeFont, maxTextWidth));

  const rows = [];
  let y = 0;
  /* 実績一覧の見出し。上下を細い罫線で挟んだ1行（_TRUE_ENDING_HEADER_TEXT参照） */
  rows.push({ type: 'header', text: _TRUE_ENDING_HEADER_TEXT, y, h: headerH, fs: fsHeader });
  y += headerH;
  y += spacerAfterHeader;

  const rollStartIdx = rows.length;
  for (const a of ACHIEVEMENTS) {
    rows.push({ type: 'roll', icon: a.icon, text: a.name, y, h: _TRUE_ENDING_ROLL_ROW_H });
    y += _TRUE_ENDING_ROLL_ROW_H;
  }
  /* 実績本編とまとめ（累計データ）の間は数行分あけ、まとめとして独立して
     見えるようにする（実績の続きとして流れ込むと埋没してしまうため）。
     さらに空白の後へ小見出しを1行置き、別のまとまりであることを明示する
     （_TRUE_ENDING_SUBHEADER_TEXT参照）。行高はフォント基準で持ち、上下に
     ほぼ半行ぶんずつの余白を作って、直後の統計行と詰まって見えないようにする */
  y += spacerBeforeSummary;
  rows.push({ type: 'subheader', text: _TRUE_ENDING_SUBHEADER_TEXT, y, h: fsSub * 3.0, fs: fsSub });
  y += fsSub * 3.0;
  const summaryStats = [
    { icon: '🎮', text: `総プレイ回数 ${fmt(playCount)}` },
    { icon: '🏹', text: `総矢数 ${fmt(shotCount)}` },
    { icon: '🎊', text: `大当たり回数 ${fmt(jackpotCount)}` },
    { icon: '👑', text: `ベストギヨウザ ${fmt(bestCoins)}` },
  ];
  for (const item of summaryStats) {
    rows.push({ type: 'roll', icon: item.icon, text: item.text, y, h: _TRUE_ENDING_ROLL_ROW_H });
    y += _TRUE_ENDING_ROLL_ROW_H;
  }
  y += spacerBeforeClose;

  const closeStartIdx = rows.length;
  for (const text of closeDisplayLines) {
    rows.push({ type: 'close', text, y, h: closeDy, fs: fsClose });
    y += closeDy;
  }
  return { rows, rollStartIdx, closeStartIdx, closeRowCount: closeDisplayLines.length };
}

/* こんがり達成直後（自動）・タイトル画面のボタン（手動リプレイ）どちらからもここから入る */
function _startTrueEnding(replay) {
  _trueEndingIsReplay = replay;
  /* 実績パネルが開いたままエンドロールに入れてしまう経路があるため必ず閉じる。
     タイトル画面のハンドラは TRUE_ENDING_BTN の判定を「パネルを閉じる」判定より
     先に行うので、パネルを開いたまま再生ボタンを押すとshowAchievements=trueが
     残り、drawAchOverlayがエンドロールの上に被って演出が読めなくなる。
     エンドロール中は実績ボタン自体も無効化している（_achBtnEnabled参照）ので、
     入口でも閉じておくことで「エンドロール中はパネルが出ない」を両側から保証する */
  showAchievements = false;
  if (replay) {
    /* 実機報告で発覚: _stopBossBGMForVictory（120msフェード+150ms後に破棄）は
       ボス勝利演出の余韻を意図した緩やかな停止だが、_playTrueEndingThemeは
       50ms後には最初の音を鳴らし始めるため、フェード中盤（ゲームBGMがまだ
       46〜73%の音量で鳴っている区間）とテーマ曲の出だしが数十ms重なって
       「BGMが混ざる」ように聞こえていた。実績パネルからの手動リプレイは
       ユーザーの能動的な操作であり緩やかな余韻を残す必然性がないため、
       フェードを挟まず即座に無音化してから鳴らす（_destroyBGMSourceを直接
       呼ぶ。ボス勝利側の演出上の余韻フェードとは意図的に区別する） */
    /* ここはランプにしない。直後に _destroyBGMSource() でソースごと止めるので
       ランプが渡り切らず意味が無い（この経路は「フェードを挟まず即座に無音化」が
       意図。上のコメント参照）。鳴り続けるソースの音量を動かす経路とは別物 */
    if (bgmGain && audioCtx) {
      bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
    }
    _destroyBGMSource();
  }
  phase = 'trueEnding';
  const content = _buildTrueEndingContent();
  /* 締めセリフの中央行が静止時に画面のどこへ来るかを逆算し、そこをスクロールの
     終点にする。速度が一定なので終点さえ決めれば自然にそこで止まる
     （間隔・行間の調整で「止まる位置の見え方」を作り込む）。行数は縦画面の
     折り返しで画面幅ごとに変わるため、常に実際の行数から中央行を求める */
  const midClose = content.rows[content.closeStartIdx + Math.floor(content.closeRowCount / 2)];
  const targetScrollY = H * 0.5 + (midClose.y + midClose.h / 2) - H * _TRUE_ENDING_CLOSE_REST_Y_RATIO;
  /* 旧openSceneEndScrollY（タップで「開幕セリフ→実績一覧」へ飛ばす中間地点）は
     廃止した。開幕セリフが無くなり、見出しの直後がもう実績一覧なので、
     この中間ジャンプは移動量がほぼ無く意味を持たない。スキップは
     「1タップで締めセリフまで」の1段になる（handleGameClick参照） */
  _trueEnding = {
    stage: 'scroll', timer: 0,
    scrollY: 0, targetScrollY, content,
    closeAlpha: 1, titleAlpha: 0, titleGlow: 0, creditAlpha: 0, canExit: false,
  };
  _playTrueEndingTheme();
}

function _trueEndingEnterStage(stage) {
  const o = _trueEnding;
  o.stage = stage;
  o.timer = 0;
  /* 締めセリフのフェードアウトと同時にテーマ曲も一緒にフェードさせ、
     映像と音を同じタイミングで消す（余韻を残しつつ、の実装） */
  if (stage === 'closeLinesFadeOut') _stopTrueEndingTheme(_TRUE_ENDING_CLOSE_FADEOUT_FRAMES / 60);
}

/* 実績コンプリートの祝賀テーマ曲。通常BGM(152bpm)より落ち着いた100bpm相当、
   Cメジャーペンタトニックを維持した穏やかなアルペジオ+ベース。ループ再生
   ではなく一回限りのライブスケジューリング（_playKongariCompleteFanfareと
   同じ方式）。専用gainノードに通すことで、演出がスキップされた場合も
   このノードのゲインを落とすだけで即座に打ち切れる（個々のオシレーターを
   逐一追跡・停止する必要がない）。_TRUE_ENDING_BEATは冒頭の定数群
   （_TRUE_ENDING_SCROLL_SPEED参照）で定義済み */
const _TRUE_ENDING_MEL = [
  ['E',5,0.20], null, ['G',5,0.20], null, ['A',5,0.22], null, ['G',5,0.18], null,
  ['E',5,0.18], null, ['D',5,0.18], null, ['C',5,0.24], null, null, null,
];
const _TRUE_ENDING_BASS = [
  ['C',3,0.16], null, null, null, ['G',3,0.14], null, null, null,
  ['A',3,0.14], null, null, null, ['F',3,0.14], null, null, null,
];
function _playTrueEndingTheme() {
  if (!audioCtx) return;
  _trueEndingGain = audioCtx.createGain();
  _trueEndingGain.gain.value = 1;
  _trueEndingGain.connect(masterGain);
  const dest = _trueEndingGain;
  const t0 = audioCtx.currentTime + 0.05;
  const stepDur = _TRUE_ENDING_BEAT * 0.5;
  const phraseLen = _TRUE_ENDING_MEL.length * stepDur;
  const REPEATS = 7; // 約7フレーズ(≈34秒)。スクロール減速・締めセリフ延長で演出時間が伸びたため、
                      // 締めセリフのフェードアウト開始（テーマ曲側のフェード起点）まで確実に鳴り続ける長さを確保
  for (let r = 0; r < REPEATS; r++) {
    for (let s = 0; s < _TRUE_ENDING_MEL.length; s++) {
      const t = t0 + r * phraseLen + s * stepDur;
      const mel = _TRUE_ENDING_MEL[s];
      if (mel) playOsc(audioCtx, 'triangle', noteHz(mel[0], mel[1]), t, stepDur * 1.6, mel[2], 0.25, null, null, dest);
      const bas = _TRUE_ENDING_BASS[s];
      if (bas) playOsc(audioCtx, 'sine', noteHz(bas[0], bas[1]), t, stepDur * 3, bas[2], 0.3, null, null, dest);
    }
  }
}
function _stopTrueEndingTheme(rampSec = 0.3) {
  const g = _trueEndingGain;
  if (!g || !audioCtx) return;
  const t = audioCtx.currentTime;
  g.gain.cancelScheduledValues(t);
  g.gain.setValueAtTime(g.gain.value, t);
  g.gain.linearRampToValueAtTime(0, t + rampSec);
  _disconnectAfter(audioCtx, t + rampSec, g); // フェード完了後にmasterGainから切断する
  _trueEndingGain = null;
}

function _updateTrueEnding() {
  const o = _trueEnding;
  if (!o) { phase = 'idle'; return; }
  /* ここだけ_updateKingCommonFx()を使わず姿勢イージングのみ行うのは意図的。
     真エンディングはキング戦の続きではなく独立した演出で、飛翔文字もレーザーも
     drawBossBattleごと描画対象外になる（bossVictoryを90フレーム以上経てから
     入るため、その時点で既に消え切っている）。引き継いだキングの呼吸だけを
     静かに続けたい */
  if (_king) _easeKingXform();
  o.timer++;
  if (o.stage === 'scroll') {
    /* 見出しは締めセリフと同じく「静止表示→一定時間後にスクロール開始」に揃える
       （いきなり流れ始めると実績一覧が唐突に始まる感じが残るため、まず見出しを
       読ませてから動かす） */
    if (o.timer > _TRUE_ENDING_HEADER_HOLD_FRAMES) {
      o.scrollY = Math.min(o.scrollY + _TRUE_ENDING_SCROLL_SPEED, o.targetScrollY);
    }
    if (o.scrollY >= o.targetScrollY) _trueEndingEnterStage('closeLinesRest');
  } else if (o.stage === 'closeLinesRest') {
    if (o.timer > _TRUE_ENDING_CLOSE_LINGER_FRAMES) _trueEndingEnterStage('closeLinesFadeOut');
  } else if (o.stage === 'closeLinesFadeOut') {
    o.closeAlpha = Math.max(0, 1 - o.timer / _TRUE_ENDING_CLOSE_FADEOUT_FRAMES);
    if (o.timer >= _TRUE_ENDING_CLOSE_FADEOUT_FRAMES) _trueEndingEnterStage('titleFadeIn');
  } else if (o.stage === 'titleFadeIn') {
    /* 単純な線形フェード（timer/FRAMES）だと、暗い背景に金色グロー付き文字
       という組み合わせでは中盤（alpha 0.3〜0.5あたり）で既に肉眼上「ほぼ
       表示済み」に見えてしまい（実測: alpha0.3でもRGB(95,87,20)と背景から
       はっきり浮いた色になる）、残り半分のフェードがほとんど知覚できず
       「フェードインしていない、ただ長く待たされるだけ」に見えるという
       実機指摘があった。二次イージング（t*t）で序盤の立ち上がりを抑え、
       輝度の変化がフェード時間いっぱいに知覚できるようにする */
    const t = Math.min(1, o.timer / _TRUE_ENDING_TITLE_FADEIN_FRAMES);
    o.titleAlpha = t * t;
    if (o.timer >= _TRUE_ENDING_TITLE_FADEIN_FRAMES) _trueEndingEnterStage('titleHold');
  } else if (o.stage === 'titleHold') {
    /* フェード完了（alpha=1固定）後、まずグローを0→フルへ育て、
       それが育ち切ってからクレジットを単独でフェードインさせる
       （ユーザー要望: タイトルの下に適度な間隔をあけてフェード表示、
       タイトルが完全に出てからクレジットが出てくる、の2点。加えて
       グロー成長を分離したことで「輝きが増していく」演出にもなる）。
       いずれも同じt*tの二次イージングで知覚できるフェードにする */
    const gt = Math.min(1, o.timer / _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES);
    o.titleGlow = gt * gt;
    const creditTimer = Math.max(0, o.timer - _TRUE_ENDING_TITLE_GLOW_GROW_FRAMES);
    const ct = Math.min(1, creditTimer / _TRUE_ENDING_CREDIT_FADEIN_FRAMES);
    o.creditAlpha = ct * ct;
    if (!o.canExit && o.timer > _TRUE_ENDING_TITLE_MIN_HOLD_FRAMES) o.canExit = true;
  }
}

/* 開幕セリフ・実績ロール・締めセリフを同じスクロール座標・同じ縁フェードで
   描く統一関数（旧_drawTrueEndingLines・_drawTrueEndingRollを統合）。
   締めセリフだけはcloseAlphaを追加で掛けて、静止後のフェードアウトを表現する */
function _drawTrueEndingRows(o) {
  const rows = o.content.rows;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const screenY = H * 0.5 + (row.y + row.h / 2) - o.scrollY;
    if (screenY < -40 || screenY > H + 40) continue;
    let edgeFade = Math.min(1, Math.min(screenY, H - screenY) / 60);
    if (edgeFade <= 0) continue;
    if (row.type === 'close') edgeFade *= o.closeAlpha;
    if (edgeFade <= 0) continue;
    ctx.globalAlpha = edgeFade;
    if (row.type === 'roll') {
      /* アイコン・文字列は_TRUE_ENDING_ROLL_ICON_X/TEXT_X等で位置・フォントを
         それぞれ独立指定する（定義箇所のコメント参照）。アイコンをleft寄せに
         しているのは、「フィーバー初体験」🌡️・「常連客」🕹️の2つだけ文字と
         隙間なく詰まって見える（U+FE0F付きグリフの実測送り幅がプラット
         フォームによって狂う）という実機報告への対策で、文字列側の開始位置が
         アイコンの実測幅に一切影響されないようにするため */
      ctx.textBaseline = 'middle';
      ctx.font = _TRUE_ENDING_ROLL_ICON_FONT;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.fillText(row.icon, _TRUE_ENDING_ROLL_ICON_X, screenY);
      ctx.font = _TRUE_ENDING_ROLL_TEXT_FONT;
      ctx.fillStyle = Y;
      ctx.textAlign = 'left';
      ctx.fillText(row.text, _TRUE_ENDING_ROLL_TEXT_X, screenY);
    } else if (row.type === 'header') {
      /* 実績一覧の見出し: 文字の上下に細い罫線を1本ずつ引くだけの最小構成
         （締めで丸いギヨウザロゴを大きく見せる構成を弱めないよう、冒頭は
         文字と罫線のみに留める）。罫線は文字幅より少し広い固定幅で、
         中央から左右対称に引く */
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px 'Hiragino Mincho ProN',serif`;
      const ruleHalfW = Math.min(W * 0.34, ctx.measureText(row.text).width / 2 + row.fs * 1.6);
      const ruleDy = row.fs * 1.05;
      ctx.strokeStyle = 'rgba(245,208,32,0.55)';
      ctx.lineWidth = 1;
      for (const dy of [-ruleDy, ruleDy]) {
        ctx.beginPath();
        ctx.moveTo(W / 2 - ruleHalfW, screenY + dy);
        ctx.lineTo(W / 2 + ruleHalfW, screenY + dy);
        ctx.stroke();
      }
      outText(row.text, W / 2, screenY, Y, 'rgba(0,0,0,0.9)', 6);
    } else if (row.type === 'subheader') {
      /* まとめの小見出し: 罫線を引かず、字間を広げた文字だけで区切りを示す
         （冒頭の見出しより一段軽い格に保つ。_TRUE_ENDING_SUBHEADER_TEXT参照）。
         字間はctx.letterSpacingに頼らず、1文字ずつ実測幅＋トラッキング分だけ
         送って描く（letterSpacingは環境によって未対応で、その場合は字間が
         詰まったまま無言で描かれてしまうため）。全体幅を先に合計して中央から
         左右対称に配置する */
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px 'Hiragino Mincho ProN',serif`;
      const chars = [...row.text];
      const tracking = row.fs * _TRUE_ENDING_SUBHEADER_TRACKING_RATIO;
      const widths = chars.map(c => ctx.measureText(c).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
      ctx.textAlign = 'left';
      let x = W / 2 - totalW / 2;
      for (let c = 0; c < chars.length; c++) {
        outText(chars[c], x, screenY, Y, 'rgba(0,0,0,0.9)', 5);
        x += widths[c] + tracking;
      }
    } else {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${row.fs}px 'Hiragino Mincho ProN',serif`;
      outText(row.text, W / 2, screenY, '#e8e2d0', 'rgba(0,0,0,0.9)', 6);
    }
  }
  ctx.globalAlpha = 1;
}

/* 旧_trueEndingKingAlphaは削除した。開幕セリフの表示中だけキングを見せる演出
   だったが、開幕セリフ自体を廃止したうえ、こんがり達成の退場演出でキングは
   既に空へ飛び去っているため、エンドロールで再登場させると矛盾する
   （_TRUE_ENDING_HEADER_TEXT付近のコメント参照）。
   なおこの関数は先頭2行を「開幕セリフ」と決め打ちで参照していたため、
   残したままだと見出し行を誤って参照する不具合になっていた */

/* 崎陽軒ギヨウザのパッケージにある丸いロゴマークを模した装飾。
   黄色い円を縦3分割し、中央（やや幅広）を緑地に白文字で大きく「ギヨウザ」、
   左右を黄地に緑文字で「餃　子」「横　濱」（各文字の間を少しあけて表示）。
   中央エリアだけ内側にわずかに小さい円でクリップして塗るため、
   中央の上下だけ外周の黄色いリングが弧状に残って見える */
function _drawGyozaCircleLogo(cx, cy, R, alpha, rot = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy);
  ctx.rotate(rot); // タイトル画面のホイール流用時、ホイールの回転と同期させるため

  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = Y;
  ctx.fillRect(-R, -R, R * 2, R * 2);
  /* 外径の枠線（黄色いリング）の太さを従来の1/3に */
  ctx.beginPath();
  ctx.arc(0, 0, R * (1 - 0.08 / 3), 0, Math.PI * 2);
  ctx.clip();
  const centerHalfW = R * 0.40; // 中央エリアを少し狭く
  ctx.fillStyle = GN;
  ctx.fillRect(-centerHalfW, -R, centerHalfW * 2, R * 2);
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const sideFont  = R * 0.28 * 0.85; // 少し小さく
  const sideLineH = sideFont * 1.15;
  const sideGap   = sideFont * 0.8; // 文字の間を少し広げる
  /* エリア中央（数学的な中点）よりわずかに内周（中央エリア）寄りにオフセットし、
     文字の周囲に均等な余白ができるようにする（崎陽軒の実物パッケージ参照） */
  const sideCX    = (centerHalfW + R) / 2 - R * 0.05;
  ctx.font = `bold ${sideFont}px 'Hiragino Mincho ProN',serif`;
  ctx.fillStyle = GN;
  ctx.fillText('横', sideCX, -sideLineH / 2 - sideGap / 2);
  ctx.fillText('濱', sideCX, sideLineH / 2 + sideGap / 2);
  ctx.fillText('餃', -sideCX, -sideLineH / 2 - sideGap / 2);
  ctx.fillText('子', -sideCX, sideLineH / 2 + sideGap / 2);

  const centerFont  = R * 0.34 * 1.4 * 1.08; // 「ギヨウザ」を1.4倍、さらに全体を1.08倍に
  const centerLineH = centerFont * 0.88; // 文字間隔を少し詰める（中心揃えは対称な配置式のため自動的に維持される）
  ctx.font = `bold ${centerFont}px 'Hiragino Mincho ProN',serif`;
  ctx.fillStyle = '#ffffff';
  const chars = ['ギ', 'ヨ', 'ウ', 'ザ'];
  const charScaleX = [1.08, 1.20, 1.00, 0.94]; // ヨを少し大きく、ウ・ザを少し小さく
  chars.forEach((c, i) => {
    const y = (i - (chars.length - 1) / 2) * centerLineH;
    ctx.save();
    ctx.translate(0, y);
    ctx.scale(charScaleX[i], 0.92); // 縦横比を変え、横幅を少し広げつつ縦をごくわずかに潰す
    ctx.fillText(c, 0, 0);
    ctx.restore();
  });

  ctx.restore();
}

function drawTrueEnding() {
  if (phase !== 'trueEnding' || !_trueEnding) return;
  const o = _trueEnding;
  ctx.save();

  if (o.stage === 'titleFadeIn' || o.stage === 'titleHold') {
    /* ロゴは画面の上下中央に配置し、タイトルと同じくo.titleAlphaで
       じんわりフェードインさせる。暗幕より先に描くことで、他の
       ステージと同じ暗幕の下に沈んだ見え方になる */
    _drawGyozaCircleLogo(W / 2, H / 2, (IS_PORTRAIT ? 62 : 82) * 3, o.titleAlpha);
  }

  /* 暗幕はエンドロールを通して常に同じ明るさ（元の仕様）にする。
     ステージによって暗幕の色を変えると明るさが唐突に変わって見えるため、
     ここで一箇所にまとめて描く */
  ctx.fillStyle = 'rgba(4,6,10,0.86)';
  ctx.fillRect(0, 0, W, H);

  if (o.stage === 'titleFadeIn' || o.stage === 'titleHold') {
    const creditFontSize = IS_PORTRAIT ? 12 : 14;
    /* タイトルをCOPYRIGHT行の文字列の縦幅（フォントサイズ）分下へ、
       COPYRIGHT行を同じ幅分さらに上へずらし、両者の間隔を詰める */
    const titleY = H * 0.5 - _TRUE_ENDING_TITLE_Y_OFFSET + creditFontSize;
    ctx.globalAlpha = o.titleAlpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${IS_PORTRAIT ? 34 : 46}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = Y;
    /* macOS Safari実機報告: アルファのフェードとshadowBlurのグローを同時に
       変化させると、globalAlphaにもshadowColor自体へのalpha埋め込みにも
       関わらずフェードが一瞬で終わったように見える不具合があった
       （クレジット表示はshadowBlur無しで意図通りに見えている、との対比で
       判明）。アルファ変化とグロー変化を同時に扱うこと自体がSafari側の
       合成でうまく扱えないと考えられるため、時間的に分離する: フェード中
       (titleFadeIn)はグロー無しの単純な文字フェードのみとし、フェードが
       完了してalphaが1に固定された後（titleHold）にグローだけを別途
       0→フルへ育てる（o.titleGlow、更新側参照）。輝きが増していく演出にもなる */
    const glow = o.stage === 'titleHold' ? o.titleGlow : 0;
    if (glow > 0) {
      ctx.shadowColor = `rgba(245,208,32,${0.7 * glow})`;
      ctx.shadowBlur = 16 * glow;
    }
    ctx.fillText('ギヨウザ ルーレット', W / 2, titleY);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    if (o.stage === 'titleHold' && o.creditAlpha > 0) {
      ctx.globalAlpha = o.creditAlpha;
      ctx.font = `${creditFontSize}px 'Hiragino Mincho ProN',serif`;
      ctx.fillStyle = 'rgba(245,208,32,0.75)';
      ctx.fillText(_TRUE_ENDING_CREDIT_TEXT, W / 2, H * 0.5 + (IS_PORTRAIT ? 78 : 90) - _TRUE_ENDING_TITLE_Y_OFFSET - creditFontSize * 2);
      ctx.globalAlpha = 1;
    }
    /* あえてバッジは表示しない（ユーザー要望）。canExit成立後はタップ/
       クリック/キー入力（handleGameClick、'trueEnding'分岐参照）で
       いつでも終了できるが、余韻を楽しんでもらうため案内は出さず、
       静かに佇む演出のままにする */
  } else {
    /* キングはここでは描かない（旧_trueEndingKingAlphaの削除理由は同関数が
       あった位置のコメント参照）。ロール本文だけを流す */
    _drawTrueEndingRows(o);
  }
  ctx.restore();
}

/* 真エンディング終了処理。自動再生（本編勝利）・リプレイ（タイトル画面の
   ボタン）のどちらでも、エンディングの後は常にゲームスタート前の初期画面
   （startup）へ戻す（ユーザー要望: エンドロールはゲームの続きではなく、
   スタートと並列の選択肢という位置づけのため）。本編勝利からの初回再生の
   場合のみ、キング戦関連のstateを後片付けする必要がある（_trueEndingIsReplay
   がfalseの時。リプレイはそもそも戦闘を経ていないため不要）。
   startup画面はそもそもBGMが鳴らない設計のため、ここでstartBGM()等は
   呼ばない（無音のまま戻る）。
   ただし bgmGain 自体は 0 のまま残ることがある: 本編勝利経由
   （_stopBossBGMForVictoryが120msフェードで0にする）・タイトル画面から
   のリプレイ（_startTrueEndingのreplay分岐が二重再生防止で即座に0にする）
   のどちらも、そのままでは1に戻す処理を挟まない。真エンディングのテーマ曲
   自体は専用の_trueEndingGain経由なので鳴るが、bgmGain=0のまま次回の
   START（playStartJingleがdest=bgmGain経由でジングルを鳴らす。scheduleJingle
   参照）を迎えると、オリエンタルリフとカウントイン（カウントダウン）が
   無音のまま進行し、その後startBGM()がbgmGainを1に戻した瞬間に通常BGMだけ
   唐突に鳴り出す＝画面（ゲームは即座に開始済み）と音のズレとして体感される
   （実機報告で発覚）。startup帰還時に確実に1へ戻しておく */
function _finishTrueEnding() {
  trueEndingSeen = true;
  lsSaveStats();
  if (!_trueEndingIsReplay) _cleanupKingBattleState();
  _trueEnding = null;
  phase = 'startup';
  if (bgmGain && audioCtx) {
    bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmGain.gain.setValueAtTime(1, audioCtx.currentTime);
  }
}

/* 6回目の失敗で、4的それぞれに最後のひびが入り終えた瞬間に呼ばれる
   （_updateKingCharFlights参照）。ユーザー要望: 「6回目の失敗で的にクラックが
   入り、的が砕けて破片が全て消えてからキングギヨウザ失敗が確定するべき」。
   4的それぞれの4セグメントをそのまま破片として使い（新規ジオメトリを
   起こさず既存のsegs/色をそのまま流用）、的の中心から外向きに飛び散らせる。
   phaseを'bossShatter'に切り替えて入力を止め、_updateKingReelShatterが
   全破片の消滅を監視して_startBossDefeatへ引き継ぐ */
/* 角度を 0〜2π へ正規化 */
function _norm2pi(a) { const t = a % (Math.PI * 2); return t < 0 ? t + Math.PI * 2 : t; }

/* 的1枚を「ひびの入った位置」で分割した破片の境界角（的ローカル＝OCの座標系、昇順）
   を返す（ユーザー指摘: 均等に4つへ割れるのは、ひびの位置と無関係で違和感がある）。
   ひびの保存角は基準文字エリア起点の相対角なので、現在の的の基準角を足して
   OCの座標系へ戻す（drawKingReelの描画と同じ変換）。
   ひびが2本未満だと扇形に分割できないため、その場合は従来どおり文字セグメントの
   境界で割る（KING_MAX_FAILS回失敗して破砕に至る時点では通常6本あるので、
   これは保険の経路） */
function _kingReelShatterBounds(w, idx) {
  const cracks = (_king.reelCracks && _king.reelCracks[idx]) || [];
  const anchor = _kingReelAnchorAngle(w);
  let bounds = cracks.map(c => _norm2pi(c.angle + anchor)).sort((a, b) => a - b);
  /* ほぼ同じ角度のひびが重なると極端に細い破片ができるのでまとめる */
  const MIN_GAP = 0.12;
  bounds = bounds.filter((a, i) => i === 0 || a - bounds[i - 1] > MIN_GAP);
  /* 先頭と末尾が2π跨ぎで近すぎる場合も末尾を落とす */
  if (bounds.length > 1 && (bounds[0] + Math.PI * 2 - bounds[bounds.length - 1]) <= MIN_GAP) bounds.pop();
  if (bounds.length >= 2) return bounds;
  return w.segs.map(s => _norm2pi(s.start)).sort((a, b) => a - b);
}

function _startKingReelShatter() {
  phase = 'bossShatter';
  const pieces = [];
  for (let idx = 0; idx < _king.reels.length; idx++) {
    const w = _king.reels[idx];
    const bounds = _kingReelShatterBounds(w, idx);
    for (let i = 0; i < bounds.length; i++) {
      const a0 = bounds[i];
      const a1 = (i + 1 < bounds.length) ? bounds[i + 1] : bounds[0] + Math.PI * 2;
      const span = a1 - a0;
      const mid  = a0 + span / 2;                 // 的ローカルでの破片の中心角
      const world = w.rot + mid;                  // 現在の的の向きを反映したワールド角
      /* 細い破片ほど軽い＝速く飛ぶようにして、割れ方の不均等さを動きにも出す */
      const spd = (2.5 + Math.random() * 3) * (1 + (Math.PI / 2 - Math.min(span, Math.PI / 2)) * 0.35);
      pieces.push({
        cx: w.x, cy: w.y, x: 0, y: 0,
        vx: Math.cos(world) * spd, vy: Math.sin(world) * spd - 2.5, // 少し上向きに弾ける
        rot: world, rotSpd: (Math.random() - 0.5) * 0.3,
        span, mid,
        /* 破片は的のOCを扇形にクリップして描く＝元の絵柄（文字・色）がそのまま
           乗るので「同じ的が割れた」ように見える。OCは破砕中は生きている
           （返却は_cleanupKingBattleState/_updateBossDefeatShrinkで、いずれも
           破砕完了後に実行される）。未対応環境向けにcharも保持してフラット塗り
           にフォールバックできるようにしておく */
        oc: w._oc, ocR: w._ocR,
        char: (w.segs.find(s => mid >= s.start && mid < s.start + s.span) || w.segs[0]).char,
      });
    }
  }
  _kingShatter = { pieces, timer: 0 };
  playSE('boss_flash'); // 破砕の衝撃（既存の演出用SEを流用、新規SEは追加しない）
}

function _updateKingReelShatter() {
  /* ボス本体の呼吸・位置イージング、直前attemptの文字飛翔（まだ落下中の
     ものが残っている場合）、レーザー演出は破砕中も止めない */
  _updateKingCommonFx();

  const s = _kingShatter;
  if (!s) { _startBossDefeat(); return; }
  s.timer++;
  for (const p of s.pieces) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.3; // 重力
    p.rot += p.rotSpd;
  }
  /* 全破片が画面外に出きった、または保険の上限フレームに達したら敗北確定へ
     （ユーザー要望どおり、破片が全て消えてから敗北が確定する順序を守る） */
  const allGone = s.timer > KING_SHATTER_MAX_FRAMES || s.pieces.every(p => {
    const x = p.cx + p.x, y = p.cy + p.y;
    return x < -80 || x > W + 80 || y < -80 || y > H + 80;
  });
  if (allGone) {
    _kingShatter = null;
    _startBossDefeat();
  }
}

function drawKingReelShatter() {
  if (phase !== 'bossShatter' || !_kingShatter) return;
  for (const p of _kingShatter.pieces) {
    ctx.save();
    ctx.translate(p.cx + p.x, p.cy + p.y);
    ctx.rotate(p.rot);
    /* 破片の形は「ひびから隣のひびまで」の扇形。回転の基準を破片の中心角に
       置いているので、ローカルでは -span/2〜+span/2 の扇形になる */
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, KING_WR, -p.span / 2, p.span / 2);
    ctx.closePath();
    if (p.oc) {
      /* 元の絵柄を扇形で切り出して貼る。rotate(-p.mid)でOCの座標系へ戻すことで、
         OC上の角度θが この破片ローカルの (θ-mid) に来る＝割れる前と同じ位置の
         模様がそのまま乗る */
      ctx.save();
      ctx.clip();
      ctx.rotate(-p.mid);
      ctx.drawImage(p.oc, -p.ocR, -p.ocR, p.ocR * 2, p.ocR * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = SEG_L[p.char]; // OC未対応環境向けフォールバック
      ctx.fill();
    }
    /* 割れ口の縁を描いて破片の輪郭を立たせる */
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
}

/* こんがり攻撃失敗がKING_MAX_FAILS回に達し、ルーレットが完全破壊された＝敗北。
   所持ギヨウザの半分がキングギヨウザに吸収され、通常ゲームへ戻る（ユーザー要望）。
   演出はdrawBossVictoryと対になる構成（暗幕・ボス・タイトル・CONTINUEバッジ）に
   揃え、既存の「勝利」との対称性を保つ */
function _startBossDefeat() {
  phase = 'bossDefeat';
  _bossDefeatTimer = 0;
  /* 敗北時のking値: 0（振り出しに戻す）ではなく、出現閾値の50%からやり直し
     にする（ユーザー要望）。戦闘開始時点で_initBossBattleが0にリセット済み
     のため、ここで上書きする */
  kingGyozaMeter = KING_GYOZA_THRESHOLD * 0.5;
  lsSaveStats();
  if (_king) {
    _king.scale = 1;
    /* 没収額は端数を切り上げる（半分を残すのではなく半分を取る側を優先）。
       これにより所持1の場合はceil(1/2)=1で残数ゼロまで没収され、
       「1だったら全部没収されてゲームオーバー」という直感的な期待に一致する
       （floorだと1所持時に没収0で何も没収されないまま復帰してしまっていた） */
    const lost = Math.ceil(coins / 2);
    coins -= lost;
    _king.lostCoins = lost; // 敗北画面での表示用（_kingBattleEndでのちに_kingがnullになるため先に記録）
    /* 没収分はキングに取り込まれたものとしてプールし、いつかこんがり達成した
       時にまとめて返す（ユーザー要望）。敗北を重ねるほどプールが厚くなり、
       達成時の見返りが大きくなる。永続化はlsSaveStats側 */
    kingLostPool += lost;
    lsSave();
    lsSaveStats();
  }
  /* 敗北の瞬間、ボスBGMをテープが止まるように減速させる（stopBGMTape、
     予兆演出・通常ゲームオーバーと同じ手法の流用）。以前はBGMが鳴りっぱなしで
     ゲームオーバーSEと被って聞こえづらいという実機指摘があった。
     _kingBattleEnd経由で通常モードへ戻る際のstartBGMTapeが現在のレートから
     イーズインするため、ここで止めても復帰時に自然に繋がる */
  stopBGMTape(700);
  playSE('gameover');
}

function _updateBossDefeat() {
  _bossDefeatTimer++;
  /* 勝利側と同様、直前に飛ばした文字の演出（跳ね返り等）を決着後も止めない */
  _updateKingCommonFx();
}

function drawBossDefeat() {
  if (phase !== 'bossDefeat') return;
  ctx.save();
  ctx.fillStyle = 'rgba(30,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    ctx.save();
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    drawKingCharFlights();
  }

  /* 没収で所持ギヨウザが尽きた場合も、まずは通常の「こんがり しっぱい」＋
     キングが縮んでギヨウザ群へ戻っていく演出を優先し、そのあとで通常モードの
     コイン枯渇ゲームオーバー画面へ進む（ユーザー要望: 「所持ギヨウザが0に
     なる場合、キングギヨウザが戻って飛んでいく演出を優先してください。
     その後、所持ギヨウザ0のゲームオーバー演出に進んでください」）。
     coins<=0によるここでの早期分岐（通常ゲームオーバー画面を先に出す）は
     廃止し、_kingBattleEnd側で出口を分ける（コメント参照） */
  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const titleY = _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
  outText('こんがり しっぱい……', W / 2, titleY, '#ff6655', 'rgba(40,0,0,0.9)', 8);
  /* 没収個数メッセージは画面下端からの固定オフセットを基本にしつつ、ボスの拡大
     アニメ（dscale→1）でtitleYが下がってきた場合はtitleYの下側に一定間隔を
     保つ側を優先する（Math.max）。固定オフセットだけだとボスが十分に育った
     状態でtitleYがそのオフセットを超え、見出しと重なってしまうため
     （実機指摘: 「下に表示される文字列が重なっている」） */
  if (_bossDefeatTimer > 40) {
    ctx.font = `bold 15px 'Hiragino Mincho ProN',serif`;
    /* 没収個数の実数表示（ギヨウザN個が吸収された）から、割合表示に変更
       （ユーザー要望）。_startBossDefeatの没収ロジック（Math.ceil(coins/2)）
       が常に「所持数の半分」である事実そのままの文言にした */
    outText('所持ギヨウザの半数が 吸収された……', W / 2, Math.max(H - 80, titleY + 40),
      '#d8d8ff', 'rgba(0,0,0,0.85)', 4);
  }
  if (_bossDefeatTimer > 90) {
    _drawBottomPillBadge('CONTINUE');
  }
  ctx.restore();
}

function drawBossDefeatOutro() {
  if (phase !== 'bossDefeatOutro' || !_defeatOutro) return;
  const o = _defeatOutro;
  ctx.save();
  ctx.fillStyle = 'rgba(2,4,8,0.7)';
  ctx.fillRect(0, 0, W, H);
  for (const g of o.items) drawOneItem(g);
  if (o.step >= 1) {
    /* 透明度は_updateBossDefeatOutroが確定させたo.msgAlphaを読むだけ。
       描画本体は達成側と共通（_drawOutroMsg参照） */
    _drawOutroMsg(o, '#e8e2d0', 'rgba(0,0,0,0.9)');
  }
  /* タップ待ちにせず時間経過で自動的に戻るため、CONTINUEバッジは出さない
     （ユーザー要望） */
  ctx.restore();
}

/* ════════════════ 吉祥雲 ════════════════ */
/* _drawCloudTo: 任意のコンテキストに雲を描く（OffscreenCanvas 事前描画用）
   drawCloud: メインcanvasへの呼び出し（_staticLayerCanvas が利用可能なら使わない） */
function _drawCloudTo(c2, cx, cy, sc, alpha, rot) {
  c2.save();
  c2.translate(cx, cy);
  c2.rotate(rot||0);
  c2.scale(sc, sc);
  c2.globalAlpha = alpha;
  c2.fillStyle   = Y;
  c2.beginPath();
  c2.moveTo(-50, 5);
  c2.bezierCurveTo(-60,6,-65,-4,-57,-10);
  c2.bezierCurveTo(-49,-16,-40,-8,-45,3);
  c2.bezierCurveTo(-46,9,-40,13,-34,8);
  c2.bezierCurveTo(-34,1,-26,-14,-16,-12);
  c2.bezierCurveTo(-13,-11,-11,-9,-10,-8);
  c2.bezierCurveTo(-12,-24,12,-24,10,-8);
  c2.bezierCurveTo(11,-9,13,-11,16,-12);
  c2.bezierCurveTo(26,-14,34,1,34,8);
  c2.bezierCurveTo(40,13,46,9,45,3);
  c2.bezierCurveTo(40,-8,49,-16,57,-10);
  c2.bezierCurveTo(65,-4,60,6,50,5);
  c2.bezierCurveTo(42,15,-42,15,-50,5);
  c2.closePath();
  c2.fill();
  c2.restore();
}
function drawCloud(cx, cy, sc, alpha, rot) { _drawCloudTo(ctx, cx, cy, sc, alpha, rot); }

/* ════════════════ 獅子 ════════════════ */
/* _drawShishiTo: 任意のコンテキストに獅子を描く（OffscreenCanvas 事前描画用）
   drawShishi: メインcanvasへのラッパー */
function _drawShishiTo(c2, cx, cy, sc, mirX) {
  c2.save();
  c2.translate(cx, cy);
  c2.scale(mirX ? -sc : sc, sc);

  /* 胴体・脚（最背面に描画 → たてがみ・顔の下に隠れる） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.ellipse(-23,20,13,16,0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 23,20,13,16,-0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,12,29,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-32,44,11,18,0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 32,44,11,18,-0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,28,22,20,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.fillStyle=GN;
  for (const [x,y,r] of [[-10,8,5],[10,8,5],[0,18,5],[-22,20,4],[22,20,4]]) {
    c2.beginPath(); c2.arc(x,y,r,0,Math.PI*2); c2.fill();
  }
  /* 尻尾: 根元は体の側面、先端が横外側（+やや上）を向く
     rotate(-1.2)で先端がx負方向=外側へ。mirXで右獅子は右外側に自動反転 */
  c2.save();
  c2.translate(-44, 40);
  c2.rotate(-1.2);
  c2.beginPath();
  c2.moveTo(0,-24);
  c2.bezierCurveTo( 9,-14, 11, 3, 0, 15);
  c2.bezierCurveTo(-11,  3, -9,-14, 0,-24);
  c2.closePath();
  c2.fillStyle=Y; c2.fill();
  c2.restore();

  /* たてがみ: 全周に巻き貝・渦巻きカール（狛犬スタイル）
     上部3個(i=8,9,10)・下部3個(i=2,3,4)は顔より前面に描画 */
  const _hx = 0, _hy = -28, _ringR = 45, _cR = 17, _N = 12, _WR = 1.22;
  const _drawCurl = i => {
    const a = (i / _N) * Math.PI * 2;
    const cx = _hx + Math.cos(a) * _ringR, cy = _hy + Math.sin(a) * _ringR;
    c2.fillStyle = Y;
    c2.beginPath(); c2.ellipse(cx, cy, _cR*_WR, _cR, 0, 0, Math.PI*2); c2.fill();
    c2.save();
    c2.translate(cx, cy); c2.scale(_WR, 1);
    /* C字弧の開口を顔中心方向に向ける。
       現開口方向≈5.751rad、顔中心方向=a+π。差分を回転として加算。 */
    const _rot = (a + Math.PI) - 5.751;
    c2.globalAlpha = 0.6; // C字弧の濃さ
    c2.beginPath();
    c2.arc(-_cR*0.18, _cR*0.08, _cR*0.52, 0.35 + _rot, Math.PI*1.55 + _rot);
    c2.strokeStyle = GN; c2.lineWidth = _cR*0.3; c2.lineCap = 'round'; c2.stroke();
    c2.globalAlpha = 1;
    c2.restore();
  };
  /* 背面カール（顔の後ろ）: 左右の6個 */
  for (const i of [0,1,5,6,7,11]) _drawCurl(i);
  /* 顔の輪郭: 少し大きな緑の楕円を先に描いてボーダーを作る */
  c2.globalAlpha = 0.65;
  c2.fillStyle = GN;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR+4, 39, 0, 0, Math.PI*2); c2.fill();
  c2.globalAlpha = 1;
  /* 頭部楕円（横長）を上から描画 */
  c2.fillStyle = Y;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR, 35, 0, 0, Math.PI*2); c2.fill();
  /* 目: 緑塗りつぶし */
  c2.fillStyle=GN;
  c2.beginPath(); c2.arc(-17,-34,3.5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc(17,-34,3.5,0,Math.PI*2); c2.fill();
  /* 瞼: 顔色の大きな円で目の上部・外側寄りを覆う（左右対称） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.arc(-17-2,-34-7,5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc( 17+2,-34-7,5,0,Math.PI*2); c2.fill();
  /* 眉毛: 尻尾と同形状（ティアドロップ）、半透明で微妙な濃さ
     内側（鼻寄り）が高くなるよう傾ける（凛々しい表情） */
  c2.save();
  c2.globalAlpha = 0.30;
  for (const [ex, rot] of [[-17, 1.3], [17, -1.3]]) {
    c2.save();
    c2.translate(ex, -44);
    c2.rotate(rot);
    c2.beginPath();
    c2.moveTo(0,-10);
    c2.bezierCurveTo( 4,-5.5, 4.5, 1, 0, 6);
    c2.bezierCurveTo(-4.5, 1, -4,-5.5, 0,-10);
    c2.closePath();
    c2.fillStyle=GN; c2.fill();
    c2.restore();
  }
  c2.restore();
  /* 鼻（小さめ・少し上に） */
  c2.fillStyle=GN;
  c2.beginPath(); c2.ellipse(0,-21,5,3,0,0,Math.PI*2); c2.fill();
  /* 口: 人字型（犬っぽい口） */
  c2.strokeStyle=GN; c2.lineWidth=1.8; c2.lineCap='round'; c2.lineJoin='round';
  /* 人中（鼻下〜口中央）: 口にピッタリ接続 */
  c2.beginPath();
  c2.moveTo(0,-17); c2.lineTo(0,-13);
  c2.stroke();
  /* 口: Wの下二つのアーチを丸くした形（ω口）
     左右の口角(高め)→下方へアーチ→中央で合わさる */
  c2.beginPath();
  c2.moveTo(-7,-13);
  c2.quadraticCurveTo(-4,-10, 0,-13);
  c2.quadraticCurveTo(4,-10, 7,-13);
  c2.stroke();
  /* 前面カール: 下部中央(i=3)を最背面→左右(i=2,4)→上部(i=8,9,10) */
  _drawCurl(3);          // 下部中央: 最背面
  for (const i of [2,4,8,9,10]) _drawCurl(i);
  c2.restore();
}
function drawShishi(cx, cy, sc, mirX) { _drawShishiTo(ctx, cx, cy, sc, mirX); }

/* ════════════════ Draw helpers ════════════════ */

/* 縁取りテキスト: stroke を先に描いてから fill を重ねる */
function outText(text, x, y, fillStyle, strokeStyle, lw) {
  ctx.lineJoin    = 'round';
  ctx.lineWidth   = lw ?? 9;
  ctx.strokeStyle = strokeStyle ?? 'rgba(0,0,0,0.88)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(text, x, y);
}

function easeOutBack(t) {
  const c1=1.70158, c3=c1+1;
  return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* 右上/左上ボタン群共通の背景描画（roundRect + fill + gold border）
   active=true: トロフィーON時のゴールド強調背景 */
function _drawBtnBg(rect, active) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 6);
  ctx.fillStyle = active ? 'rgba(180,140,0,0.75)' : 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ピルバッジの外形パスを設定（beginPath〜closePath）。fill()/stroke()は呼び出し側で行う */
function _drawPillPath(bx, by, bw, bh) {
  const r = bh / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by,      bx + bw, by + bh, r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r,  by + bh);
  ctx.arcTo(bx,       by + bh, bx, by + bh - r, r);
  ctx.lineTo(bx,      by + r);
  ctx.arcTo(bx,       by,      bx + r, by, r);
  ctx.closePath();
}

/* ════════════════ Main draw ════════════════ */
/* 前景レイヤー一式（暗幕→当たり演出→テキスト→全画面演出→バッジ類）。
   draw()に425行そのまま並んでいたうちの前景部分を切り出したもの。順序がそのまま
   重なり順なので、並べ替えは見た目の変更になる。draw()側には
   「背景・盤面 → _drawForeground() → ポーズ/デバッグ表示」という骨格だけを残す。 */
function _drawForeground() {
  /* 1. オーバーレイ（ハズレは暗幕なし） */
  if (phase==='done'&&endTimer>45&&!isMissResult&&!isGameOver&&hitType!=='none') drawEndOverlay();
  if (phase==='reach')              drawReachOverlay();

  /* 2. エフェクト面 */
  const _tFx = PERF_ON ? performance.now() : 0;
  if (_activeEffect?.draw && endTimer >= (_activeEffect.drawDelay ?? 0)) _activeEffect.draw();
  /* 前トライの中当たりエフェクトの退場（_fxOutro参照）。現トライの演出と同じ
     レイヤーに重ねる。両者が同時に出るのは意図どおり（並行して進む） */
  _drawFxOutro();
  /* フィーバー堆積アイテム: _activeEffectがdrawItemsを担う場合を除いて常時描画 */
  if (items.length > 0 && _activeEffect?.draw !== drawItems) drawItems();
  drawUzaFlash(); // ウザウザフラッシュ（内部で hitType チェック済み）
  if (PERF_ON) _perfMark('fx', _tFx);

  /* 白フラッシュ (リーチ大当たり確定の瞬間) */
  if (reachFlash > 0) {
    ctx.save();
    ctx.globalAlpha = reachFlash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }


  /* 3. テキスト最前面 */
  const _tTxt = PERF_ON ? performance.now() : 0;
  if (phase==='done'&&endTimer>45&&(!isMissResult||isGameOver)&&!_jackpotAutoReset) drawEndScreen();
  /* ポップアップ: phaseを問わず常時描画（トライ横断フェードアウト） */
  if (missPopups.length > 0)   drawMissPopup();
  if (payoutPopups.length > 0) drawPayoutPopup();
  /* フィーバーバナー（開始/終了とも drawFeverBanner で統合） */
  if (feverStartBannerTimer > 0) drawFeverBanner(feverStartBannerTimer, null);
  if (feverEndBannerTimer > 0 && feverEndBannerReason) drawFeverBanner(feverEndBannerTimer, feverEndBannerReason);
  if (phase==='reach')              drawReachText();
  if (PERF_ON) _perfMark('txt', _tTxt);

  /* スタートアップ画面 */
  drawStartup();

  /* キングギヨウザ出現予告・戦闘・勝利演出（全画面演出・ボタン類より下、バッジ類より上）。
     ここは通常モードのfx/whl/txtプローブの範囲外なので、独立して計測する
     （戦闘中に全プローブが0.0なのにgapが50msという実機データの死角だった） */
  const _tKing = PERF_ON ? performance.now() : 0;
  drawBossOmen();
  drawBossBattle();
  drawBossVictory();
  drawBossVictoryOutro();
  drawTrueEnding();
  drawBossDefeat();
  drawBossDefeatShrink();
  drawBossDefeatOutro();
  if (PERF_ON) _perfMark('king', _tKing);

  /* ビートシンクメーター＋JUST演出（通常のシンク統計はボス戦では無関係のため非表示） */
  if (!_isBossBattlePhase()) drawSyncMeter();
  drawSyncJust();

  /* スローハンドバッジ・フィーバーバッジ（最前面・上部中央） */
  drawSlowHandBadge();
  drawFeverBadge();
  drawBeatBonusBadge();
  drawContinueBadge();
}

function draw() {
  /* 画面シェイク */
  let shakeX = 0, shakeY = 0;
  if (hitType === 'gizagiza' && endTimer > 45) {
    const k = Math.min(1, (endTimer-45)/20);
    shakeX = Math.sin(endTimer*4.7)*5*k;
    shakeY = Math.cos(endTimer*3.3)*4*k;
  }
  if (hitType === 'gigigigi' && endTimer > 45) { // ギギギギ: もっと激しい振動
    const k = Math.min(1, (endTimer-45)/15);
    shakeX += (Math.random()-0.5)*14*k;
    shakeY += (Math.random()-0.5)*10*k;
  }
  if (phase === 'reach' && reachTimer > REACH_DECEL_FRAMES) { // リーチ減速後: 微振動
    shakeX += (Math.random()-0.5)*2;
    shakeY += (Math.random()-0.5)*1.5;
  }
  if (_kingSiftShake > 0) { // 篩い落としの打撃感（KING_SIFT_SHAKE_FRAMES参照）
    const k = _kingSiftShake / KING_SIFT_SHAKE_FRAMES;
    shakeX += (Math.random()-0.5) * 3 * k;
    shakeY += (Math.random()-0.5) * 5 * k;
    _kingSiftShake--;
  }
  if (_kingImpactShake > 0) { // 文字が的に着弾した瞬間の衝撃（KING_IMPACT_SHAKE_*参照）
    const k = _kingImpactShake / KING_IMPACT_SHAKE_FRAMES;
    shakeX += (Math.random()-0.5) * KING_IMPACT_SHAKE_AMP * k;
    shakeY += (Math.random()-0.5) * KING_IMPACT_SHAKE_AMP * 1.6 * k;
    _kingImpactShake--;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* グレースケールフィルター（CSSをcanvas要素に適用）
     ctx.filterはiOS Safari<18未サポートのため、canvas.style.filterを使用
     AudioParam.value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため
     JS 側で管理した grayRateCur を使用 */
  {
    /* グレースケール適用。will-changeはフィルターが掛かっている間だけ付ける:
       常時付けておくとフィルター用の合成パスが維持され、掛かっていない間も
       GPUコストを払う（CSS側の宣言をやめてここで制御しているのはそのため） */
    const rate = Math.max(0.001, Math.min(1, grayRateCur));
    const f = rate >= 0.995 ? '' : `grayscale(${Math.round((1 - rate) * 90)}%)`;
    if (f !== _lastFilter) {
      canvas.style.filter = _lastFilter = f;
      canvas.style.willChange = f ? 'filter' : 'auto';
    }
  }

  /* 背景 + 吉祥雲 + 獅子 + 上下帯: すべて焼き込み済みの静的レイヤー1枚を drawImage
     キャッシュ未構築のフォールバックは通常描画（_mkCache により実質到達しない） */
  if (_staticLayerCanvas) {
    ctx.drawImage(_staticLayerCanvas, 0, 0, W, H);
  } else {
    ctx.fillStyle = bgGradient || '#0f5020'; ctx.fillRect(0,0,W,H);
    for (const c of CLOUDS) drawCloud(c.x,c.y,c.s,c.a,c.r);
    if (!IS_PORTRAIT) {
      ctx.globalAlpha = 0.6;
      drawShishi(78, 360, 0.82, false);
      drawShishi(983, 360, 0.82, true);
      ctx.globalAlpha = 1;
    }
    /* 上下帯 */
    ctx.fillStyle=Y; ctx.fillRect(0,0,W,6); ctx.fillRect(0,H-6,W,6);
    ctx.globalAlpha=0.4; ctx.fillRect(0,8,W,3); ctx.fillRect(0,H-11,W,3); ctx.globalAlpha=1;
  }

  /* 弓 (縦画面のみ) */
  if (IS_PORTRAIT && (phase==='idle'||phase==='reach')) drawBow();

  ctx.textBaseline='alphabetic'; // リセット

  /* ホイール（ボス戦闘中は非表示）。タイトル画面の背景演出だけ、丸い
     ギヨウザロゴに差し替える（ユーザー要望）。本来のホイール回転速度
     (w.speed)は速すぎて文字が読めなくなるため、startupTimerとw.speed
     （ホイールごとに元々ランダムな値）を元にした、読める範囲でゆっくり
     めの回転角を使う。w.speedを流用することでホイールごとに回転速度が
     バラバラになる */
  if (!_isBossBattlePhase()) {
    if (phase === 'startup') {
      for (const w of wheels) _drawGyozaCircleLogo(w.x, w.y, WR, 1, startupTimer * w.speed * 0.0375);
    } else {
      const _tW = PERF_ON ? performance.now() : 0;
      for (let i=0;i<4;i++) drawWheel(i);
      if (PERF_ON) _perfMark('whl', _tW);
    }
  }

  /* キングギヨウザ予兆の霊（半透明で画面を横切る） */
  if (_omenGhost) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.drawImage(_omenGhost.oc, _omenGhost.x - _omenGhost.sz / 2, _omenGhost.y - _omenGhost.cy);
    ctx.restore();
  }

  /* 飛ぶ矢 (3D遠近法) */
  if (phase==='shooting') drawArrow3D();

  /* particles: 色×アルファ4段階でバッチ化して1色1fill（GPUフラッシュ最大512→数十回に削減）
     アルファは4段階量子化（フェード25フレームで十分滑らか） */
  if (particles.length > 0) {
    ctx.save();
    for (const p of particles) {
      const a = Math.min(0.999, p.life / 25);
      p._ab = (a * 4) | 0; // 0-3
    }
    const nc = _partColorList.length;
    for (let ab = 3; ab >= 0; ab--) {
      ctx.globalAlpha = (ab + 1) / 4;
      for (let ci = 0; ci < nc; ci++) {
        let started = false;
        for (let k = 0; k < particles.length; k++) {
          const p = particles[k];
          if (p._ab !== ab || p.ci !== ci) continue;
          if (!started) { ctx.beginPath(); started = true; }
          const r = Math.max(0.1, p.r);
          ctx.moveTo(p.x + r, p.y);
          ctx.arc(p.x, p.y, r, 0, Math.PI*2);
        }
        if (started) { ctx.fillStyle = _partColorList[ci]; ctx.fill(); }
      }
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  /* BETバー: ボス戦闘中はこんがりゲージに差し替え（同じ位置・寸法を共有） */
  if (!_isBossBattlePhase()) {
    const _tBar = PERF_ON ? performance.now() : 0;
    if (IS_PORTRAIT) drawPortraitBottomBar(); else drawBottomBar();
    if (PERF_ON) _perfMark('bar', _tBar);
  }
  drawCoinHeader();

  /* ── レイヤー構成(全当たり共通) ──────────────────
     1. オーバーレイ (暗幕)
     2. エフェクト面  (各当たりの演出)
     3. テキスト最前面
     ─────────────────────────────────────────────── */

  _drawForeground();

  /* ── ポーズオーバーレイ ── */
  if (isPaused) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    /* 実績パネルが開いている間は "PAUSED" テキストを非表示（パネルが全面を覆うため） */
    if (!showAchievements) {
      ctx.fillStyle = 'rgba(245,208,32,0.95)';
      ctx.font = `bold 36px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PAUSED', W/2, H/2);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(245,208,32,0.4)';
      ctx.fillText('© 2026 Michiyasu ODAKI', W/2, H - 24);
    }
    ctx.restore();
  }

  /* 実績バナー・オーバーレイ（ポーズ暗幕の上に表示） */
  drawAchBanner();
  drawAchOverlay();

  /* ── 右上ボタン群（トロフィー・ミュート）常時最前面 ── */
  /* トロフィーボタン（エンドロール中は無効なので描かない。_achBtnEnabled参照） */
  if (_achBtnEnabled()) {
  ctx.save();
  _drawBtnBg(ACH_TROPHY, showAchievements);
  /* トロフィーアイコン: 完全再設計 - カップ→ネック→台座の正しいシルエット */
  ctx.translate(ACH_TROPHY.x + ACH_TROPHY.w / 2, ACH_TROPHY.y + ACH_TROPHY.h / 2);
  ctx.strokeStyle = '#f5d020';
  ctx.fillStyle   = '#f5d020';
  ctx.lineWidth   = 1.4;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  /* カップ本体 + ネック + 台座（一体の塗りつぶしパス）
     🏆絵文字シルエットをトレース:
     上辺 ±5.5, カップ壁がy=-5付近で最大幅x≈8, y=-2付近でx≈6, ネックy=0.5でx≈2.5
     台座 ±7, y=3〜7.5 */
  ctx.beginPath();
  ctx.moveTo(-5.5, -8.5);                                      // 上辺 左
  ctx.lineTo( 5.5, -8.5);                                      // 上辺 右
  ctx.bezierCurveTo( 8.25, -4.75,  7.25, -1.75,  2.5,  0.5); // 右壁（膨らみ→絞り込み）
  ctx.lineTo( 2,  0.5);  ctx.lineTo( 2,  3);                  // ネック右
  ctx.lineTo( 6,  3);    ctx.lineTo( 6,  7.5);                // 台座右
  ctx.lineTo(-6,  7.5);  ctx.lineTo(-6,  3);                  // 台座底・左
  ctx.lineTo(-2,  3);    ctx.lineTo(-2,  0.5);                // ネック左
  ctx.lineTo(-2.5, 0.5);                                       // カップ底 左
  ctx.bezierCurveTo(-7.25, -1.75, -8.25, -4.75, -5.5, -8.5); // 左壁（右の鏡）
  ctx.closePath();
  ctx.fill();

  /* 持ち手：カップ中段外側に付くD字アーク
     右壁: y=-5でx≈8, y=-2でx≈7 に合わせた外側カーブ */
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo( 7, -6.5);
  ctx.quadraticCurveTo(12.5, -5,  6, -3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, -6.5);
  ctx.quadraticCurveTo(-12.5, -5, -6, -3);
  ctx.stroke();
  ctx.restore();
  } // end _achBtnEnabled()

  /* ── 真エンディング再生ボタン（トロフィーの右隣・startup画面かつ視聴済みのみ） ──
     エンディング演出はゲーム途中で見るものではなく、スタートと並列の選択肢という
     位置づけにしたため、実績パネルの中ではなくタイトル画面のボタン列に置く */
  if (phase === 'startup' && trueEndingSeen) {
    ctx.save();
    _drawBtnBg(TRUE_ENDING_BTN, false);
    ctx.translate(TRUE_ENDING_BTN.x + TRUE_ENDING_BTN.w / 2, TRUE_ENDING_BTN.y + TRUE_ENDING_BTN.h / 2);
    /* 祝賀メダル（円形ロゼット＋燕尾リボン）アイコン。単色シルエット。
       ポーズ解除の再生三角と紛らわしいという指摘を受けて差し替えたが、
       初版は細く小さすぎて遠目にメダルと判別できなかったため、
       ボタン全体を使い切るサイズ・太いリボン幅・燕尾ノッチ付きで再設計した */
    ctx.fillStyle = '#f5d020';
    ctx.beginPath();
    ctx.moveTo(-4.5, -1); ctx.lineTo(-0.6, -1); ctx.lineTo(-0.6, 10);
    ctx.lineTo(-2.5, 7.2); ctx.lineTo(-4.5, 10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4.5, -1); ctx.lineTo(0.6, -1); ctx.lineTo(0.6, 10);
    ctx.lineTo(2.5, 7.2); ctx.lineTo(4.5, 10);
    ctx.closePath(); ctx.fill();
    /* メダル円の縁に沿って薄い暗色の隙間を挟み、リボン(奥)とメダル(手前)が
       重なっているように見せる（同色ベタ塗りだと繋ぎ目が消え一体化して見えるため） */
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.arc(0, -4, 8.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5d020';
    ctx.beginPath();
    ctx.arc(0, -4, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ── 全画面ボタン（Fullscreen API 対応環境のみ・常時最前面） ── */
  if (FS_SUPPORTED) {
    ctx.save();
    _drawBtnBg(FS_BTN_RECT, false);
    ctx.fillStyle = '#f5d020';
    ctx.translate(FS_BTN_RECT.x + FS_BTN_RECT.w / 2, FS_BTN_RECT.y + FS_BTN_RECT.h / 2);
    ctx.scale(_FS_ICON_SCALE, _FS_ICON_SCALE);
    ctx.translate(-12, -12); // 24×24 viewBox の中心揃え
    ctx.fill(_isFullscreen ? _FS_PATH_EXIT : _FS_PATH_ENTER);
    ctx.restore();
  }

  /* ── ミュートボタン（右上・常時最前面） ── */
  ctx.save();
  _drawBtnBg(MUTE_BTN, false);
  /* アイコンを中心座標基準で描く */
  ctx.translate(MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + MUTE_BTN.h / 2);
  const ic = '#f5d020'; // 全画面ボタンと同じ金色
  ctx.strokeStyle = ic; ctx.fillStyle = ic;
  ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* ミュート時: 右へ3px移動 + 1.2倍スケールで斜線の中央に揃える
     通常:   体 x=-9〜-4, コーン x=-4〜3（中心 x≈-3）
     ミュート: translate(3,0)+scale(1.2) → 体 x≈-7.8〜-2.2, コーン x≈-2.2〜6.6（中心 x≈-0.8） */
  const spkShift = audioMuted ? 2 : 0;
  ctx.save();
  ctx.translate(spkShift, 0);
  if (audioMuted) ctx.scale(0.95, 1.1); // ミュート時: 縦1.1倍・横0.95倍（横圧縮）
  /* スピーカー本体（台形＋四角） */
  ctx.fillRect(-9, -4, 5, 8);
  /* 台形コーン */
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.lineTo( 3, -8);
  ctx.lineTo( 3,  8);
  ctx.lineTo(-4,  4);
  ctx.closePath();
  ctx.fill();
  if (!audioMuted) {
    /* 音波 小 */
    ctx.beginPath();
    ctx.arc(3, 0, 5, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
    /* 音波 大 */
    ctx.beginPath();
    ctx.arc(3, 0, 9, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
  }
  ctx.restore();
  if (audioMuted) {
    /* ミュート: 左上→右下の斜線（macOS スタイル）
       完全不透明の黒ボーダーでスピーカーをシャープに切り、上からゴールドを重ねる */
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
    ctx.strokeStyle = ic;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
  }
  ctx.restore();

  /* ── ポーズボタン（左上・トロフィー下、startup以外・常時最前面） ── */
  if (phase !== 'startup') {
    ctx.save();
    _drawBtnBg(PAUSE_BTN, false);
    ctx.translate(PAUSE_BTN.x + PAUSE_BTN.w / 2, PAUSE_BTN.y + PAUSE_BTN.h / 2);
    ctx.fillStyle = '#f5d020';
    if (isPaused) {
      ctx.beginPath();
      ctx.moveTo(-5, -8); ctx.lineTo(-5, 8); ctx.lineTo(9, 0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(-6, -8, 4, 16);
      ctx.fillRect( 2, -8, 4, 16);
    }
    ctx.restore();
  }

  /* ── フィーバー内枠エフェクト: HSL色サイクル＋呼吸パルス ── */
  if (isFever && phase !== 'startup') {
    const t   = performance.now();
    const hue = (t / 20) % 360;                        // 色相サイクル（約7秒で一周）
    const pulse = 0.7 + 0.3 * Math.sin(t / 260);     // 呼吸（約1.6秒周期、min0.4〜max1.0）
    const lw  = IS_PORTRAIT ? 5 : 7;
    ctx.save();
    ctx.strokeStyle = `hsla(${hue}, 100%, 62%, ${pulse})`;
    ctx.lineWidth   = lw;
    ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
    ctx.restore();
  }

  /* ── ミュート時ビートパルス: 外枠の太さ変化 ──
     bgmSourceがある（＝拍位置が実際に進んでいる）ときだけ描く。
     getBeatPulseは_bgmAccumStepの積算に依存し、_bgmAccumStepはbgmSourceが
     無いと早期returnするため、ソースを破棄しているフェーズ
     （bossVictory / bossVictoryOutro / trueEnding、NO_BGM_SOURCE_PHASES参照）
     ではパルスが最後の値のまま凍結する。その値が0以外だと半透明の金枠が
     一定の太さで描かれ続け、外枠の色が変わったように見えていた
     （実機指摘「MUTE/アンミュートで外枠の色がおかしくなる」。ミュートを
     切り替えると出たり消えたりするのはこの枠の描画条件そのもの）。
     実測: ソース破棄の瞬間のpulseが0.9344なら5.6px幅で固定表示され続けた */
  if (audioMuted && phase !== 'startup' && bgmSource) {
    const pulse = getBeatPulse();
    if (pulse > 0) {
      const lw = pulse * 6; // 最大6px
      ctx.save();
      ctx.strokeStyle = _BEAT_BORDER_COLORS[Math.min(31,pulse*31|0)];
      ctx.lineWidth = lw;
      ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  /* 画面全体フェード: 最前面・シェイク変形の外で描く（余韻を大切にした暗転つなぎ） */
  _drawScreenFade();
  /* デバッグ用タップ式チートパネル（?cheatpanel時のみ、常に最前面） */
  drawCheatPanel();
  /* ?perf 計測オーバーレイ。canvasには描かずDOM要素を更新するだけ（drawPerf参照）。
     draw()の末尾から呼ぶのは、フレームごとに間隔を見て更新するため */
  drawPerf();
}

/* ════════════════ 描画関数群 ════════════════ */

/* ── BETボタン描画ヘルパー ── */
function _drawBetBtn(rect, label, canChange, fontSize) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fillStyle = canChange ? 'rgba(245,208,32,0.18)' : 'rgba(120,120,120,0.10)'; ctx.fill();
  ctx.strokeStyle = canChange ? 'rgba(245,208,32,0.55)' : 'rgba(120,120,120,0.25)';
  ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = canChange ? Y : 'rgba(180,180,180,0.35)';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
}

function drawWheel(i) {
  const w=wheels[i], active=i===curIdx&&(phase==='idle'||phase==='reach');
  /* ビート拍動: アクティブホイールの強調度をキックに合わせてパルス */
  const bp = active ? getBeatPulse() : 0; // 0-1、ビート直後=1
  ctx.save(); ctx.translate(w.x,w.y);
  /* グロー光輪: セグメント描画前に1回だけ shadowBlur を使用し GPUブラーパスを集約
     旧: 各セグメントのfill/stroke/strokeText/fillText すべてに shadowBlur が効いて
         8〜12セグ × 4操作 = 32〜48 GPU ブラーパス/フレーム → Input Delay 17〜27ms の原因
     新: 外周リングを1ストロークするだけ = 1 GPU ブラーパス/フレーム */
  if (active) {
    if (_wheelGlowSprites) {
      /* プリレンダ済みグロー（bp 8段階量子化）+ クリスプなリング本体 */
      const g = _wheelGlowSprites[Math.min(_GLOW_LEVELS - 1, (bp * _GLOW_LEVELS) | 0)];
      ctx.drawImage(g.oc, -g.half, -g.half);
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
    } else {
      /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.shadowColor=Y; ctx.shadowBlur=50+bp*40;
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
      ctx.shadowBlur=0; // セグメント描画前にリセット
    }
  }

  /* セグメント・文字・ハブ: 事前描画済み OffscreenCanvas を回転して貼る
     文字はホイール中心が下方になるよう _buildWheelOC で固定済み */
  if (w._oc) {
    ctx.save();
    ctx.rotate(w.rot);
    ctx.drawImage(w._oc, -_WHEEL_OC_R, -_WHEEL_OC_R, _WHEEL_OC_R*2, _WHEEL_OC_R*2);
    ctx.restore();
  } else {
    /* フォールバック: OffscreenCanvas 未対応時は従来描画（文字は回転なし） */
    for (const s of w.segs) {
      const a1=s.start+w.rot, a2=a1+s.span, mid=a1+s.span/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,WR,a1,a2); ctx.closePath();
      /* createWheelでは作らない場合があるので、この経路に入った時点で用意する */
      if (!s.gradient) s.gradient = _segFallbackGradient(s.char, s.start + s.span/2);
      ctx.fillStyle=s.gradient; ctx.fill();
      ctx.strokeStyle='rgba(245,208,32,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
      const tx=Math.cos(mid)*WR*0.62, ty=Math.sin(mid)*WR*0.62;
      ctx.save(); ctx.translate(tx,ty);
      ctx.font=s.font; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.88)'; ctx.strokeText(s.char,0,0);
      ctx.fillStyle='#fffde7'; ctx.fillText(s.char,0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle=w.hubGrd; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+4,0,Math.PI*2);
  ctx.strokeStyle=active?Y:YD; ctx.lineWidth=active?4.5+bp*2.5:2; ctx.stroke();
  /* ビート拍動: 外側に広がる拍動リング（テーブルで文字列生成ゼロ） */
  if (bp > 0.01) {
    ctx.beginPath(); ctx.arc(0,0,WR+12+bp*14,0,Math.PI*2);
    ctx.strokeStyle=_BEAT_RING_COLORS[Math.min(31,bp*31|0)]; ctx.lineWidth=2+bp*2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+8,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,0,0.35)'; ctx.lineWidth=1.5; ctx.stroke();


  /* ポインタ三角形: PC=▼(上), 縦=◀(右から左向き)
     プリレンダ済みスプライト（グロー込み）を状態別に選択して drawImage */
  if (_pointerSprites) {
    const sp = w.locked ? _pointerSprites.locked
             : active   ? _pointerSprites.active[Math.min(3, (bp * 4) | 0)]
             : _pointerSprites.inactive;
    ctx.drawImage(sp.oc, sp.ox, sp.oy, sp.w, sp.h);
  } else {
    /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
    if (active || w.locked) {
      ctx.shadowColor = w.locked ? '#ff4422' : Y;
      ctx.shadowBlur  = 18 + bp * 18;
    }
    if (IS_PORTRAIT) {
      ctx.beginPath(); ctx.moveTo(WR+5,0); ctx.lineTo(WR+26,-12); ctx.lineTo(WR+26,12); ctx.closePath();
    } else {
      ctx.beginPath(); ctx.moveTo(0,-WR-5); ctx.lineTo(-13,-WR-28); ctx.lineTo(13,-WR-28); ctx.closePath();
    }
    ctx.fillStyle = w.locked ? '#cc2200' : (active ? Y : YD);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (w.result) {
    /* 結果文字はロック時に一度だけ OC へ焼き込み（グロー＋グリフラスタライズは1回のみ）
       毎フレームは drawImage 1回。ポップ拡縮は drawImage のスケールで再現する */
    if (!w._resOC) _buildResultOC(w);
    const pop=Math.max(0.01,easeOutBack(Math.min(1,w.resultPop)));
    ctx.save();
    if (IS_PORTRAIT) ctx.translate(WR+58, 0); else ctx.translate(0, WR+58);
    ctx.scale(pop,pop);
    if (w._resOC) {
      ctx.drawImage(w._resOC, -_RESULT_OC_HALF, -_RESULT_OC_HALF, _RESULT_OC_HALF*2, _RESULT_OC_HALF*2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      const [fillC, glowC] = _syncBarColor(w.syncScore);
      ctx.font=`bold 44px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=glowC; ctx.shadowBlur=10 + w.syncScore * 20;
      ctx.fillStyle=fillC; ctx.fillText(w.result,0,0);
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ── 矢の3D飛翔エフェクト ──────────────────────────────────
   弓道の映像のように矢を横から見た形(矢先→矢柄→矢羽)で描き、
   手前(大)→的(小)へ遠近スケールで縮小して飛ばす。
   矢先は常に的を向く。                                      ── */
function drawArrow3D() {
  const p = arrowProgress;
  if (p <= 0 || p >= 1) return;

  /* 発射から着弾への角度(固定) */
  const angle = Math.atan2(arrowTY - arrowSY, arrowTX - arrowSX);

  /* 残像3枚 + 本体1枚 */
  for (let trail = 3; trail >= 0; trail--) {
    const tp = Math.max(0, p - trail * 0.05);
    if (tp <= 0) continue;

    /* 位置: わずかにeaseして自然な加速感 */
    const ep = Math.pow(tp, 0.88);
    const sx = arrowSX + (arrowTX - arrowSX) * ep;
    const sy = arrowSY + (arrowTY - arrowSY) * ep;

    /* 遠近スケール: 近=3倍大, 遠=等倍 (縦画面は横移動なので等倍固定) */
    const sc = IS_PORTRAIT ? 1.0 : Math.max(1, (1 - tp) * 2 + 1);

    const al = Math.min(1, tp * 8) * (trail === 0 ? 1.0 : 0.22 - trail * 0.06);
    if (al <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(sx, sy);
    ctx.rotate(angle); // 矢先が的方向(+x)を向くよう回転

    /* ── 矢のサイズ(スケール済み) ── */
    const half = 32 * sc;   // 矢の全長の半分
    const tipL = 13 * sc;   // 矢尻から矢先までの長さ
    const tipW =  5 * sc;   // 矢先の幅(半分)
    const fLen = 20 * sc;   // 矢羽の長さ
    const fW   =  9 * sc;   // 矢羽の最大幅
    const sw   = Math.max(1.5, 2.5 * Math.min(sc, 2)); // 矢柄の太さ

    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(half - tipL, 0);
    ctx.lineTo(-half + fLen, 0);
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth   = sw;
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* 矢先(三角形, +x方向が的) */
    ctx.beginPath();
    ctx.moveTo(half, 0);
    ctx.lineTo(half - tipL, -tipW);
    ctx.lineTo(half - tipL,  tipW);
    ctx.closePath();
    ctx.fillStyle = '#1f2937';
    ctx.fill();

    /* 上羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5, -fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#1e40af';
    ctx.fill();

    /* 下羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5,  fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#b91c1c';
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ── 縦画面専用: 弓の描画 ── */
function drawBow() {
  /* 弦が左(射手側)、弓本体が右(的方向)に膨らむ正しい向き
     弦の両端 = (bx, by±38)、弓の腹 = bx + bulge の位置 */
  const bx = 30, by = WYS[curIdx];
  const bulge = 28; // 的方向への膨らみ量
  ctx.save();

  /* ── 矢を番えて引き絞った状態 ──
     弓: bx を中心に右(的方向)へ膨らむ ")" 形
     弦: 上端(bx,by-span)→筈(nockX,by)→下端(bx,by+span) のくの字
     矢: 筈(nockX) から右へ伸び、矢羽は筈の直前(矢先側)に配置
         ※ 羽は絶対に nockX より左(弦より奥)には出ない             */
  const pull     = 17;   // 弦の引き量(px)
  const halfSpan = 42;   // 弓の半張り
  const nockX    = bx - pull;          // 筈X = 弦の最も引かれた点
  const tipX     = nockX + 74;         // 矢先X

  /* 弓本体 */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.quadraticCurveTo(bx + bulge, by, bx, by + halfSpan);
  ctx.strokeStyle = '#7a3a0a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  /* 弓ハイライト */
  ctx.beginPath();
  ctx.moveTo(bx + 1, by - halfSpan + 4);
  ctx.quadraticCurveTo(bx + bulge - 5, by, bx + 1, by + halfSpan - 4);
  ctx.strokeStyle = 'rgba(180,100,30,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  /* 弦 (くの字: 上端→筈→下端) */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.lineTo(nockX, by);
  ctx.lineTo(bx, by + halfSpan);
  ctx.strokeStyle = 'rgba(220,190,80,0.92)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();

  /* ── 矢 ── */
  if (phase === 'idle' || phase === 'reach') {
    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(nockX, by);
    ctx.lineTo(tipX - 12, by);
    ctx.strokeStyle = '#c08840'; ctx.lineWidth = 2.2; ctx.lineCap = 'butt'; ctx.stroke();

    /* 矢先 (鋭い三角形) */
    ctx.beginPath();
    ctx.moveTo(tipX,      by);
    ctx.lineTo(tipX - 13, by - 5);
    ctx.lineTo(tipX - 13, by + 5);
    ctx.closePath();
    ctx.fillStyle = '#2a3040'; ctx.fill();

    /* 矢羽: 平行四辺形
       下辺(軸側): vB → vF (矢柄上)
       上辺(外側): 下辺をそのまま筈方向へ shift ずらした辺
       → 横長の長方形を傾けたような不等辺平行四辺形             */
    const vB    = nockX + 3;  // 下辺・後端X
    const vF    = nockX + 13; // 下辺・前端X
    const vH    = 6;          // 羽の張り出し高さ
    const shift = 5;          // 上辺を筈側(左)へずらす量

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(vB,         by);          // 下辺・後端 (軸上)
      ctx.lineTo(vF,         by);          // 下辺・前端 (軸上)
      ctx.lineTo(vF - shift, by + s*vH);  // 上辺・前端 (外側)
      ctx.lineTo(vB - shift, by + s*vH);  // 上辺・後端 (外側)
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,160,160,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
    }

    /* 筈の印 (小さい暗色リング) */
    ctx.beginPath();
    ctx.arc(nockX + 1, by, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#5a3010'; ctx.fill();
  }
  ctx.restore();
}

/* タッチ座標をキャンバス座標に変換 */
function touchToCanvas(touch) {
  return {
    x: (touch.clientX - _canvasRect.left) * (W / _canvasRect.width),
    y: (touch.clientY - _canvasRect.top)  * (H / _canvasRect.height),
  };
}

/* ── エンド画面: オーバーレイのみ ── */
/* リーチ用フリッカーリングのスプライト（初回リーチ時に1回だけ生成、shadowBlur 排除） */
let _reachRingSprite = null;
function _getReachRingSprite() {
  if (_reachRingSprite || !_CACHE_OK) return _reachRingSprite;
  const r = WR + 8, blur = 20;
  const half = Math.ceil(r + blur * 1.6 + 4);
  const oc = _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr); c.translate(half, half);
  c.strokeStyle = 'rgba(245,208,32,0.7)'; c.lineWidth = 4;
  c.shadowColor = Y; c.shadowBlur = blur;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  _reachRingSprite = { oc, half };
  return _reachRingSprite;
}

/* ── リーチ演出: スポットライトオーバーレイ ── */
function drawReachOverlay() {
  const fadeIn = Math.min(1, reachTimer / 35);
  const wx = WXS[3], wy = WYS[3];

  ctx.save();

  /* 暗幕 */
  ctx.fillStyle = `rgba(0,0,0,${0.58 * fadeIn})`;
  ctx.fillRect(0, 0, W, H);

  /* スポットライト (第4ホイール中心に明るい円) */
  const pulse = 0.65 + 0.35 * Math.abs(Math.sin(reachTimer * 0.13));
  const spot  = ctx.createRadialGradient(wx, wy, 0, wx, wy, WR * 2.6);
  spot.addColorStop(0,   `rgba(245,208,32,${0.22 * pulse * fadeIn})`);
  spot.addColorStop(0.5, `rgba(245,208,32,${0.10 * pulse * fadeIn})`);
  spot.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, H);

  /* 減速が完了したらホイール枠をフリッカー
     グロー付きリングはスプライト転写（毎フレームの shadowBlur を排除） */
  if (reachTimer > REACH_DECEL_FRAMES) {
    const flicker = Math.floor(reachTimer / 8) % 2 === 0 ? 1 : 0.5;
    const rs = _getReachRingSprite();
    if (rs) {
      ctx.globalAlpha = flicker * fadeIn; // 基本アルファ0.7はスプライトに焼き込み済み
      ctx.drawImage(rs.oc, wx - rs.half, wy - rs.half, rs.half * 2, rs.half * 2);
      ctx.globalAlpha = 1;
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.beginPath();
      ctx.arc(wx, wy, WR + 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(245,208,32,${0.7 * flicker * fadeIn})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = Y;
      ctx.shadowBlur  = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();
}

/* ── ハズレポップアップ（複数同時表示対応） ── */
function drawMissPopup() {
  if (missPopups.length === 0) return;
  const TOTAL = 120;
  ctx.save();
  ctx.font = `bold 36px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* shadowBlur除去: 黒アウトライン(lw=6)で視認性は確保済み。GPU負荷削減。 */
  for (const p of missPopups) {
    const elapsed = TOTAL - p.timer;
    const t       = elapsed / TOTAL;            // 0→1
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = p.timer < 70 ? p.timer / 70 : 1; // 後半58%をかけてフェードアウト
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 + (0.5 - t) * 90;    // 移動範囲の中心がH/2になるよう配置
    ctx.globalAlpha = alpha * 0.92;
    outText(`－${fmt(p.amt)} ギヨウザ`, W / 2, popY, '#ff7755', 'rgba(0,0,0,0.85)', 6);
  }
  ctx.restore();
}

function drawPayoutPopup() {
  if (payoutPopups.length === 0) return;
  const TOTAL = 150;
  ctx.save();
  ctx.font = `bold 42px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 30;
  for (const p of payoutPopups) {
    const pt      = p.timer / TOTAL;
    const elapsed = TOTAL - p.timer;
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = pt < 0.2 ? pt / 0.2 : 1;
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 - 60 - (1 - pt) * 30;
    ctx.globalAlpha = alpha * 0.95;
    outText(`＋${fmt(p.amt)}ギヨウザ！`, W / 2, popY, '#ffee44', 'rgba(0,0,0,0.9)', 8);
    if (p.beatBonus) {
      outText('♪BONUS', W / 2, popY + 44, '#fffde7', 'rgba(0,0,0,0.8)', 4);
    }
  }
  ctx.restore();
}

function drawEndOverlay() {
  const alpha = Math.min(1,(endTimer-45)/35);
  /* 大当たりはギヨウザを見せるため薄め、ウザウザも半透明 */
  const overlayAlpha = hitType==='jackpot'  ? alpha*0.48
                     : hitType==='uzauza'   ? alpha*0.55
                     : hitType==='giugiu'   ? alpha*0.30
                     : hitType==='yoyoyoyo' ? alpha*0.65
                     : hitType==='uuuu'     ? alpha*0.72
                     : hitType==='zazazaza' ? alpha*0.60
                     : alpha*0.78;

/* ── 固定タイトル文字のプリレンダキャッシュ（shadowBlur 排除 第2弾） ──
   エンド画面・リーチ演出のタイトルは固定文字列 × 固定スタイルのため、
   初回使用時にグロー込みで OC へ焼き、毎フレームは drawImage 1回にする
   （shadowBlur は Canvas 2D 最重量級の GPU 操作。v3.72 と同じ手法の水平展開）。
   LRU 上限でメモリを制限。OffscreenCanvas 未対応時は従来描画へフォールバック。 */
const _titleOCCache = new Map(); // key → { oc, w, h }
const _TITLE_CACHE_MAX = 8;
function _titleCachePrune() {
  while (_titleOCCache.size > _TITLE_CACHE_MAX) {
    _titleOCCache.delete(_titleOCCache.keys().next().value); // 最古（先頭）を削除
  }
}
/* outText + shadowBlur 相当をキャッシュ付きで描く。(x,y) はテキスト中心。
   注意: 呼び出し時に ctx.shadowBlur が 0 であること（drawImage にも影が乗るため） */
function _outTextCached(key, text, font, fill, stroke, lw, glowC, glowB, x, y) {
  if (!_CACHE_OK) {
    ctx.font = font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = glowC; ctx.shadowBlur = glowB;
    outText(text, x, y, fill, stroke, lw);
    ctx.shadowBlur = 0;
    return;
  }
  let e = _titleOCCache.get(key);
  if (!e) {
    ctx.save(); ctx.font = font;
    const tw = Math.ceil(ctx.measureText(text).width);
    ctx.restore();
    const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
    const pad = Math.ceil(glowB * 1.6 + lw + 8);
    const w = tw + pad * 2, h = fs + pad * 2;
    const oc = _mkCache(w * _dpr, h * _dpr);
    const c  = oc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';

/* 超大当たり専用: フィル色がアニメーションするため「グロー+縁取り」だけ焼く。

function _bakeGlowStroke(key, text, font, stroke, lw, glowC, glowB) {
  ctx.save(); ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  ctx.restore();
  const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
  const pad = Math.ceil(glowB * 1.6 + lw + 8);
  const w = tw + pad * 2, h = fs + pad * 2;
  const OFF = 4096; // 本体を画面外へ追い出して影だけスプライト内に落とす
  const oc = _mkCache(w * _dpr, h * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.shadowColor = glowC; c.shadowBlur = glowB; c.shadowOffsetX = OFF;
  c.lineWidth = lw; c.strokeStyle = stroke;
  c.strokeText(text, w / 2 - OFF, h / 2);
  c.fillStyle = '#fff';
  c.fillText(text, w / 2 - OFF, h / 2);
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0;
  c.strokeText(text, w / 2, h / 2);
  const e = { oc, w, h };
  _titleOCCache.set(key, e);
  _titleCachePrune();
  return e;
}

  const py = IS_PORTRAIT ? P_BAR_Y - 20 : BAR_Y - 20;
  const fs = IS_PORTRAIT ? 20  : 22;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.scale(scale, scale);
  ctx.font = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glw; ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.fillText(syncJustLabel, 0, 0);
  ctx.restore();
}

/* ── スローハンド発動中バッジ（上部中央、BGMレートに連動してフェード） ── */
function drawSlowHandBadge() {
  if (phase === 'startup') return;
  if (phase === 'tapestart') return; // ゲームオーバー復帰アニメーション中は非表示
  /* ボス関連フェーズはいずれもスローハンドと無関係にgrayRateTargetを動かす
     （予告のテープストップ、こんがりしっぱい時のテープ停止など）ため、
     まとめて対象外にする（_isBossBattlePhase()で一元化、bossOmenは個別に足す）。
     これはisSlowSpinガード（下記）に対する保険としてそのまま残す */
  if (phase === 'bossOmen' || _isBossBattlePhase()) return;
  if (isGameOver) return;
  /* 実機報告で発覚: grayRateCurは複数の演出（ボス関連フェーズだけでなく、
     startBGMTapeのフォールバック分岐＝ボスBGMから通常BGMへ戻る際に
     grayRateCurを0.001へ明示的にリセットしてから1.4秒かけて1.0へ回復させる、
     等）でも下がりうる。キング戦は_bgmIsBoss=trueでBGM再生していたため、
     _kingBattleEnd→_restartToTapestart→startBGMTapeが必ずこのフォールバック
     分岐を通り、isSlowSpin=falseのままgrayRateCurが一瞬0付近まで落ちて
     idle移行後もまだ回復しきっていない状態が残る（tapestart→idleの遷移条件
     はBGM再生速度基準でありgrayRateCurの回復とは別の時定数のため）。
     過去にも同種の誤表示（「グレースケール≠スローハンド」、bossDefeat確定時
     のstopBGMTape由来）を一度修正しているが、その時はphase除外の追加という
     対症療法だったため、後から追加された今回の要因（startBGMTapeのフォール
     バック分岐）を見落とした。grayRateCurの下降要因を全て把握してその都度
     除外を追加するのは水平展開が漏れ続ける構造のため、判定の主軸を
     isSlowSpin自体に変える。ただし単純に「isSlowSpinがfalseなら常に非表示」
     にすると、大当たり/中当たりでスローハンドを早期解除する際の
     「isSlowSpin=falseにした後もgrayRateCurが1.0へ戻るまでバッジが滑らかに
     フェードアウトする」という既存の意図的な演出（_kingReelShoot付近の
     コメント「バッジも連動してフェードアウト」）まで壊してしまう（即座に
     消える退行になる）。そのため_slowHandBadgeArmed（発動の瞬間だけ立てて
     grayRateCurが1.0近くまで戻りきったら降ろすラッチ、update()側で管理）を
     判定に使う。これにより既存のフェードアウト演出は維持しつつ、
     isSlowSpinを一度も経由しないgrayRateCur変動（今回のバグの原因）では
     ラッチが立たずバッジは一切表示されない */
  if (!_slowHandBadgeArmed) return;
  /* grayRateCur: 1.0=通常→alpha0, 0.5=スロー→alpha1 に線形マッピング */
  const alpha = Math.max(0, Math.min(1, (1.0 - grayRateCur) * 2));
  if (alpha < 0.01) return;

  /* ポップスケール: 発動直後に大きく出てeaseOutで縮む (25f→1.0x) */
  const POP_FRAMES = 25;
  const popScale = slowHandPopTimer > 0
    ? 1 + 1.4 * Math.pow(slowHandPopTimer / POP_FRAMES, 2)
    : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  const text  = '🐌  ス ロ ー ハ ン ド  発 動 中';
  const fs    = IS_PORTRAIT ? 13 : 14;
  ctx.font    = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw    = ctx.measureText(text).width;
  const padX  = 18, padY = 7;
  const bw    = tw + padX * 2;
  const bh    = fs + padY * 2;
  const bx    = (W - bw) / 2;
  const by    = IS_PORTRAIT ? 10 : 8;

  /* スケール変形: バッジ中心を基準に拡縮 */
  if (popScale !== 1) {
    ctx.translate(W / 2, by + bh / 2);
    ctx.scale(popScale, popScale);
    ctx.translate(-W / 2, -(by + bh / 2));
  }

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(20,10,60,0.82)';
  ctx.fill();
  ctx.strokeStyle = `rgba(160,130,255,${0.7 * alpha})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* テキスト */
  ctx.fillStyle = '#e8d8ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2);

  ctx.restore();
}

function drawBeatBonusBadge() {
  if (phase === 'startup' || phase === 'tapestart' || isGameOver) return;
  /* キングギヨウザ中はミュージックボーナス自体が無いのでバナーも出さない
     （実機指摘: BONUS READYのまま戦闘に入ると出っ放しになる）。予兆から
     エンディングまでを対象にする。シンクメーターの非表示条件と同じ扱い */
  if (phase === 'bossOmen' || _isBossBattlePhase()) return;
  if (syncChain < BEAT_BONUS_CHAIN) return;

  /* BETバー直下・同期メーターと同じ高さに配置（B案: 下部エリア） */
  const by = IS_PORTRAIT ? P_BAR_Y + P_BAR_H + 2 : BAR_Y + BAR_H + 2;
  const text = '♪BONUS READY';
  const fs   = 9; // 2/3サイズ（キャンバス内に収める）
  ctx.save();
  ctx.font = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw = ctx.measureText(text).width;
  const padX = 12, padY = 4;
  const bw = tw + padX * 2;
  const bh = fs + padY * 2;
  const bx = (W - bw) / 2;

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(10,20,10,0.85)'; ctx.fill();
