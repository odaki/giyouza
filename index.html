/* セグメント塗りのグラジェント（OffscreenCanvas未対応環境のフォールバック描画用）。
   生成箇所を1つにまとめ、必要になった時点でだけ作れるようにする */
function _segFallbackGradient(char, mid) {
  const grd = ctx.createRadialGradient(
    Math.cos(mid)*WR*0.3, Math.sin(mid)*WR*0.3, 0, 0, 0, WR);
  grd.addColorStop(0, SEG_L[char]);
  grd.addColorStop(1, SEG_D[char]);
  return grd;
}

function createWheel(x, y, feverChar) {
  const chars   = [...CHARS].sort(() => Math.random() - 0.5);
  /* フィーバー中: 対象文字97%、他3文字各1%の極端な偏りを設定 */
  const weights = feverChar
    ? chars.map(c => c === feverChar ? 97 : 1)
    : chars.map(() => Math.random() * 0.65 + 0.25);
  const sum     = weights.reduce((a, b) => a + b, 0);
  let angle = 0;
  const segs = chars.map((c, i) => {
    const span = (weights[i] / sum) * Math.PI * 2;
    const mid  = angle + span / 2;
    /* gradient は OffscreenCanvas 未対応時のフォールバック描画専用。対応環境では
       _buildSegWheelOC が OC 座標で作り直すので、ここで作ると毎トライ16個
       （4的×4セグメント）の CanvasGradient をそのまま捨てることになる。
       トライの切り替わりは、稀な引っかかりが出るとしたらGCが疑わしい場所なので、
       作らずに済むものは作らない。未対応環境では描画側が必要になった時点で
       作る（_segFallbackGradient参照）。
       font は OC 描画でも使うので常に作る（fontOf: s => s.font） */
    const grd = !_CACHE_OK ? _segFallbackGradient(c, mid) : null;
    const fontSize = Math.max(12, Math.min(33, (span / (Math.PI * 2)) * 116));
    const font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
    const s = { char: c, start: angle, span, gradient: grd, font };
    angle += span;
    return s;
  });
  const w = {
    x, y, segs, hubGrd: _WHEEL_HUB_GRD, // フォールバック用（通常は _buildWheelOC で描画済み）
    rot:       Math.random() * Math.PI * 2,
    speed:     (Math.random() * 0.08 + 0.18) * (isSlowSpin ? _slowHandRate(bet) : 1),
    locked:    false,
    result:    null,
    resultPop: 0,
    hasArrow:  false,
    syncScore: 0.5,
    _oc:     null, // OffscreenCanvas（事前描画済みセグメント+文字+ハブ）
    _resOC:  null, // 結果文字OC（ロック時に _buildResultOC で生成）
  };
  _buildWheelOC(w);
  return w;
}

function hitResult(w, pointer = IS_PORTRAIT ? 0 : -Math.PI / 2) { // 縦画面は右(0)、PC は上(-π/2)。第2引数省略時のみこの既定値を使う
  let local = ((pointer - w.rot) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  for (const s of w.segs) {
    if (local >= s.start && local < s.start + s.span) return s.char;
  }
  return w.segs[w.segs.length - 1].char;
}

/* こんがりミニリール: キングギヨウザ戦の砲台代わり。createWheel/_buildWheelOC/hitResult と
   同じ位置判定（wheelの回転角に対する固定ポインタ）をそのまま再利用し、通常ゲームと
   同じ「1本ずつ順番にタップして止める」操作感にする（OffscreenCanvas必須環境限定のため
   フォールバック描画は持たない：ボス戦自体が非対応環境では発生しない） */
function _createKingReel(x, y, weights) {
  /* 文字の並びはKING_CHARSの順（こ→ん→が→り）で固定する。
     実機指摘: 以前はここで毎回シャッフルしていたため、的ごと・再スピンごとに
     並び順が変わって「こんがり」と読めなかった。角度は0から昇順に積むので、
     canvasの座標系（y下向き＝正の角度が時計回り）では時計回りに
     こ→ん→が→りと並ぶ。
     並びを固定してもゲーム性は落ちない: どの文字がポインタに来るかは的の初期
     回転（rot）と回転速度で決まるため、ランダム性は並び順ではなく回転が担う。
     文字ごとの当たりやすさの偏り（_adjustKingCharWeight）もspanで表現するので
     並び順とは独立に機能する */
  const chars = KING_CHARS;
  /* weights（%、KING_CHARS各文字→数値）が渡されればその配分で角度を割る
     （的ごとの命中履歴で偏らせる。_king.charWeights・_adjustKingCharWeight参照）。
     合計は理論上100だが、加減算の丸め誤差を吸収するため実際の合計で正規化する
     （createWheelの重み→角度変換と同じ考え方）。省略時は均等4等分 */
  const sum = weights ? KING_CHARS.reduce((a, c) => a + weights[c], 0) : 0;
  let angle = 0;
  const segs = chars.map(c => {
    const span = weights ? (weights[c] / sum) * Math.PI * 2 : Math.PI / 2;
    const seg = { char: c, start: angle, span };
    angle += span;
    return seg;
  });
  const w = {
    x, y, segs,
    rot:    Math.random() * Math.PI * 2,
    speed:  (Math.random() * 0.08 + 0.18) * 0.5, // 通常ホイールの半分の回転速度
    locked: false,
    result: null,
    _oc:    null,
  };
  _buildKingReelOC(w);
  return w;
}

/* ひびの位置を的の絵柄に固定するための基準となる文字。的の segs は再スピンの
   たびにシャッフルされ、開始角も w.rot も作り直されるため、ひびを「ワールド角
   −そのときのw.rot」で保存すると次のトライで別の場所へ移動してしまう
   （ユーザー指摘: 「トライごとにヒビが回転移動しているかのように見える」）。
   セグメント配置そのものを基準にすれば絵柄に対する相対位置が保たれるので、
   この文字のエリアの開始角を原点としてひびの角度を保存・復元する
   （ユーザー要望: 「『こ』のエリアの始まり部分を基準として、ヒビは同じ相対
   位置にあるようにしたい」）。どこにひびが入るかの仕様は従来どおり
   「文字が当たったところ」で変えていない */
const KING_CRACK_ANCHOR_CHAR = 'こ';

/* 的ローカル座標系（w.rotを含まない、segs.startと同じ系）における
   基準文字エリアの開始角。segsは必ず4文字すべてを含むが、防御的に0で代替する。
   文字の並びを固定した現在（_createKingReel参照）「こ」は常に先頭＝この関数は
   常に0を返すが、「ひびは基準文字エリアを原点とする」という不変条件を明示する
   ために残している（並び順を変えたくなった時にひびの位置が壊れない） */
function _kingReelAnchorAngle(w) {
  const seg = w && w.segs && w.segs.find(s => s.char === KING_CRACK_ANCHOR_CHAR);
  return seg ? seg.start : 0;
}

/* 的のひび割れ（破壊演出）用の先細りウェッジ（扇形の破片）ポリゴンを1個生成する。
   ユーザー要望: 「ヒビが入るのは、飛んできた文字が的に当たった場所を起点に
   したい。的の、文字が当たった縁部分から、的の中心方向に向かって割れる。
   中心まで全部割れるのもおかしいので、途中（中心から半径の多くても1/2くらい）
   まで。当たった向きを勘案して割れる方向が物理法則的に自然だとなお良い。
   クラックの幅も端が大きく隙間が開いて、中心方向に向かうに従って割れている
   幅が狭くなる」。さらに「的とクラック表示が独立してしまっている。回転する
   的の文字衝突部分にクラックが入るのだから、クラックごと的が回転するはず」
   という指摘を受け、ポリゴンは的の回転(w.rot)に追従するローカル座標系
   （drawKingReelのctx.rotate(w.rot)の内側）で組むように変更した。
   引数baseAngleは呼び出し側（_kingReelShoot）で「文字が実際に当たったワールド
   座標上の角度（常に真上=-PI/2＋ボス位置に応じた傾き）」からその時点の
   w.rotを差し引いて渡された、的自身から見たローカル角度。的が生きている
   （ロック中〜再スピン後の回転中）間はこの値を使い続けるため、着弾直後は
   実際の衝突位置と一致し、以後は的の回転にそのまま追従する（以前の
   _generateKingReelCracksと同じ「的のローカル座標に固定してctx.rotateで
   一緒に回す」方式に、着弾位置ベースの生成を組み合わせた形） */
function _createKingCrackWedge(baseAngle) {
  const outerR = KING_WR;                                    // 起点＝的の縁
  const innerR = KING_WR * (0.15 + Math.random() * 0.35);    // 終点＝中心からの距離（最大でも半径の約半分）
  const segCount = 3 + Math.floor(Math.random() * 2);        // 3〜4節の折れ線（先細りの芯線）
  const spine = [];
  for (let j = 0; j <= segCount; j++) {
    const t = j / segCount;
    const r = outerR + (innerR - outerR) * t;
    const a = baseAngle + (Math.random() - 0.5) * 0.5 * t; // 中心へ向かうにつれ左右にわずかに蛇行
    spine.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  /* 芯線の左右にオフセットして先細りの帯を作る（端が広く、先端でほぼ0幅） */
  const outerW = KING_WR * 0.11;
  const left = [], right = [];
  for (let j = 0; j < spine.length; j++) {
    const t = j / (spine.length - 1);
    const hw = outerW * (1 - t) / 2; // 半幅（先端に向けて先細り）
    const prev = spine[Math.max(0, j - 1)], next = spine[Math.min(spine.length - 1, j + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len; // 進行方向に対する法線
    left.push({ x: spine[j].x + nx * hw, y: spine[j].y + ny * hw });
    right.push({ x: spine[j].x - nx * hw, y: spine[j].y - ny * hw });
  }
  return [...left, ...right.reverse()]; // 閉じたポリゴン（先端は左右がほぼ同点で自然に尖る）
}

/* キング的のOCをプールへ返却する。通常ホイールの_releaseWheelOCsと対になる
   （欠陥クラスの水平展開: 通常ホイールはプール運用なのにキング的だけ毎respinで
   4枚ずつ新規生成・旧4枚は解放なしだった。長い戦闘では数十枚のOffscreenCanvasが
   GC待ちで滞留し、iOS Safariのcanvasメモリを圧迫して戦闘後の処理落ち・音途切れの
   原因になりうる） */
function _releaseKingReelOCs(reels) {
  if (!reels) return;
  for (const w of reels) {
    if (w?._oc) { _freeKingReelOCs.push(w._oc); w._oc = null; }
  }
}

/* キング的用フォント計算（spanに応じて9〜18px。通常ホイールと違い事前計算
   フィールドを持たないため都度計算する） */
function _kingReelFontOf(s) {
  const fontSize = Math.max(9, Math.min(18, (s.span/(Math.PI*2))*62));
  return `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
}

function _buildKingReelOC(w) {
  const ocR = KING_WR + 4;
  /* optを都度組むのはKING_WRが縦画面の_initBossBattleで確定するため
     （静的constにすると初期値のKING_WRで固まってしまう）。4個/respinの
     小オブジェクト生成でcanvas描画コストに比べ無視できる */
  _buildSegWheelOC(w, {
    r: KING_WR, ocR, pool: _freeKingReelOCs,
    segLW: 1, charOff: 0.6, charLW: 2.5, hubR: KING_WR*0.16,
    fontOf: _kingReelFontOf,
  });
  w._ocR = ocR;
}

/* 的の三角ポインタ先端のワールド座標。ポインタは画面の向きによらず常に的の
   真上固定（当たり位置は hitResult 呼び出し側で常に -PI/2 を渡して揃える）。
   drawKingReelの描画と_kingApplyHitのビーム発射元の両方から参照する共通式 */
function _kingReelPointerPos(w) {
  const pointer = -Math.PI / 2;
  return { x: w.x + Math.cos(pointer) * (KING_WR + 12), y: w.y + Math.sin(pointer) * (KING_WR + 12) };
}

/* 発射待ち（マーク済みだが未発射）の的の三角ポインタに帯電演出を描く
   （ユーザー要望: 「4つマークした状態で次のアクションが必要だとわかりにくい。
   的を射るとその的の三角がビリビリとエネルギーを帯びる感じにしたい」）。
   時間ベースのバケツ値を擬似乱数シードにして数十msごとにジグザグの向きを
   切り替えることで静電気のような点滅を表現する（パーティクル・プール化は
   的4本ぶんの極小描画のため不要、プロジェクト規約の描画最適化対象外） */
function _drawKingReelCharge(px, py, idx) {
  let seed = Math.floor(performance.now() / 45) + idx * 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  ctx.save();
  ctx.translate(px, py);
  ctx.strokeStyle = Y;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.5 + rnd() * 0.5;
  for (let b = 0; b < 3; b++) {
    const baseAng = (b / 3) * Math.PI * 2 + rnd() * 0.6;
    const len = 6 + rnd() * 6;
    const midAng = baseAng + (rnd() - 0.5) * 0.8;
    const midLen = len * 0.55;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(midAng) * midLen, Math.sin(midAng) * midLen);
    ctx.lineTo(Math.cos(baseAng) * len, Math.sin(baseAng) * len);
    ctx.stroke();
  }
  ctx.restore();
}

function drawKingReel(w, active, idx) {
  /* 被弾揺れは的まるごと（絵柄・リング・三角ポインタ・結果文字）に効かせたいので、
     関数全体を包む外側のsave/translateで掛ける（_kingReelShakeOffset参照） */
  const _shk = _kingReelShakeOffset(idx);
  ctx.save();
  if (_shk) ctx.translate(_shk.x, _shk.y);
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(w.rot);
  ctx.drawImage(w._oc, -w._ocR, -w._ocR, w._ocR*2, w._ocR*2);
  /* ひび割れ（破壊演出）: 飛んできた文字が実際に当たった場所を起点に、中心へ
     向けて先細りに割れる（_createKingCrackWedge参照）。この ctx.rotate(w.rot)
     の内側で描くことで、的が回転する（再スピン後の回転中も含む）とひびも
     一緒に回転する（ユーザー指摘: 「的とクラック表示が独立してしまっている。
     クラックごと的が回転するはず」に対応）。
     さらにここで基準文字エリアの開始角ぶんを回す。ポリゴンはその開始角を原点
     とした相対角で保存されているため（_addKingReelCrackAtCollision参照）、
     現在の的の開始角を足し戻すことで絵柄に対する位置が一定になる。
     的は再スピンのたびに新しいrot・新しいセグメント配置で作り直されるが、
     ひびは_king.reelCracks[idx]にスロット単位で蓄積して残るため、この
     足し戻しが無いとトライごとにひびが絵柄の上を回転移動してしまう */
  if (_king && _king.reelCracks && idx != null) {
    const cracks = _king.reelCracks[idx];
    if (cracks && cracks.length) {
      ctx.save();
      ctx.rotate(_kingReelAnchorAngle(w));
      ctx.fillStyle = 'rgba(12,9,7,0.82)';
      for (const c of cracks) {
        const poly = c.poly;
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let j = 1; j < poly.length; j++) ctx.lineTo(poly[j].x, poly[j].y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(w.x, w.y, KING_WR + 3, 0, Math.PI*2);
  ctx.strokeStyle = w.locked ? 'rgba(255,221,85,0.9)' : (active ? Y : 'rgba(255,255,255,0.4)');
  ctx.lineWidth = active ? 3 : (w.locked ? 2 : 1.5);
  ctx.stroke();
  /* ポインタ三角形は画面の向きによらず常に的の真上（当たり位置は hitResult 呼び出し側で
     常に -PI/2 を渡して揃える）。台座半径は「リング外縁（最大 KING_WR+4.5）に接するが
     重ならない」よう先端が KING_WR+5 に来る値に調整済み（+7 のままだと先端がリングの
     内側まで食い込んでいた。実機指摘で発覚） */
  const pointer = -Math.PI/2;
  const { x: px, y: py } = _kingReelPointerPos(w);
  ctx.save(); ctx.translate(px, py); ctx.rotate(pointer + Math.PI/2);
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.lineTo(0,7); ctx.closePath();
  ctx.fillStyle = Y; ctx.fill();
  ctx.restore();
  /* マーク済み（射った）が未発射の的は三角を帯電させ、次のアクション（発射）
     が必要なことを視覚的に伝える。発射（_kingFireAttack）でattemptFiredが
     立つと消える */
  if (w.locked && _king && !_king.attemptFired) _drawKingReelCharge(px, py, idx);
  /* 当たった文字は的の下に表示（ロック前は何も出さない） */
  if (w.result) {
    ctx.save();
    ctx.translate(w.x, w.y + KING_WR + 3 + KING_RESULT_GAP + KING_RESULT_FONT/2);
    ctx.font = `bold ${KING_RESULT_FONT}px 'Hiragino Mincho ProN',serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.88)'; ctx.strokeText(w.result, 0, 0);
    ctx.fillStyle = '#fffde7'; ctx.fillText(w.result, 0, 0);
    ctx.restore();
  }
  ctx.restore(); // 被弾揺れの外側save
}

/* ════════════════ Update ════════════════ */
/* 4本目が着弾した瞬間の確定処理（当たり型の判定・フィーバー・king値・配当・実績・ハズレ）。
   update()のshooting分岐に157行そのまま埋まっていたぶんを関数として切り出したもの。
   ここを読むだけで「1トライの結果がどう決まるか」が追えるようにするのが目的で、
   処理内容と順序は変えていない（順序には意味がある: フィーバー終了判定→アイテム投下→
   配当計算→ゲームオーバー判定→ハズレ判定→保存、の順に依存関係がある）。 */
function _resolveTrialResult() {
  phase = 'done'; endTimer = 0;
  /* チートキー予約を当たり判定タイミングで確定（次トライのinit()が消費する） */
  if (_cheatFeverQueued) { feverPending = true; _cheatFeverQueued = false; }
  if (_cheatSlowQueued !== null) { _slowSpinPending = _cheatSlowQueued; _cheatSlowQueued = null; }
  /* HIT_TABLE を先頭から順に照合して最初にマッチした型を採用 */
  const res = wheels.map(w => w.result);
  const _hitEntry = HIT_TABLE.find(h => h.pat.every((c, i) => c === res[i]));
  hitType       = _hitEntry ? _hitEntry.type : 'none';
  _activeEffect = _hitEntry ?? null;
  const _isJackpot = hitType === 'jackpot';
  const _isMedium  = hitType !== 'none' && !_isJackpot;
  /* フィーバー終了判定: 大当たり以外またはトライ上限到達で終了 */
  if (isFever) {
    if (hitType !== 'jackpot') {
      isFever = false; feverTriesLeft = 0;
      feverEndedReason = 'miss';
      feverEndBannerTimer = FEVER_BANNER_FRAMES; feverEndBannerReason = 'miss';
      feverStartBannerTimer = 0; // 開始バナー表示中なら即中断
    } else {
      feverTriesLeft--;
      if (feverTriesLeft <= 0) {
        isFever = false; feverTriesLeft = 0;
        feverEndedReason = 'complete';
        feverEndBannerTimer = FEVER_BANNER_FRAMES; feverEndBannerReason = 'complete';
        feverStartBannerTimer = 0; // 開始バナー表示中なら即中断
        unlockAch('fever_complete');
      }
    }
  }
  /* 残存アイテムがある場合: 当たりエフェクト発動前に地面スルーで退場させる
     フィーバー中の連続大当たりは積み重ねたいため除外 */
  if (items.length > 0 && hitType !== 'none' && !_jackpotAutoReset) flushItems();
  if (_isJackpot) {
    /* フィーバー中の大当たり: アイテム落下＋配当表示のみ・自動リセット */
    if (isFever || feverEndedReason === 'complete') _jackpotAutoReset = true;
    if (_jackpotAutoReset) {
      const _isComplete = feverEndedReason === 'complete';
      /* フル連チャン達成時: アイテム倍増（上限300）・配当は calcPayout で×2 */
      initItems(_itemBurst(PAYOUT_RATE.jackpot) * (_isComplete ? 2 : 1), true, _isComplete ? 300 : 200);
      playSE('jackpot');
    } else if (isReach) {
      isReachJackpot = true;
      reachFlash = 1;
      launchReachFireworks();
      initItems(_itemBurst(PAYOUT_RATE.reachJackpot), true);
      unlockAch('reach_jackpot');
      playSE('reach_jackpot');
      if (!feverPending && Math.random() < FEVER_PROB) feverPending = true;
    } else {
      launchFireworks();
      initItems(_itemBurst(PAYOUT_RATE.jackpot), true);
      playSE('jackpot');
      /* 通常大当たりからも低確率でフィーバー移行（フィーバー中は _jackpotAutoReset 分岐のため対象外） */
      if (!feverPending && Math.random() < FEVER_PROB_NORMAL) feverPending = true;
    }
    unlockAch('first_jackpot');
    jackpotCount++;
    if (bet >= 100) unlockAch('big_bet_win');
    lsSaveStats();
  }
  /* 当たり: 4本目飛行中の先打ちバッファを破棄（エフェクト後はユーザー操作で進む）
     フィーバー大当たりは自動リセット時に発射するため破棄しない */
  if ((_isJackpot || _isMedium) && !_jackpotAutoReset) pendingShoot = false;
  /* スローハンド中の当たり: BGMを通常速度に戻して当たりエフェクトを通常速度で見せる */
  if (isSlowSpin && (_isJackpot || _isMedium)) {
    rampBGMRate(1.0, 800, 'easeIn'); // 素早く通常テンポへ復帰
    isSlowSpin = false; // バッジも連動してフェードアウト
  }
  if (_isMedium) {
    playSE('medium');
    _hitEntry.onHit?.();
    checkMediumAch(_hitEntry.medId);
    unlockAch('first_medium');
  }
  /* king値（キングギヨウザ蓄積）を当たり種別ごとの固定値で加算する。
     基本値はHIT_TABLEのking列。大当たりだけは同じ'jackpot'型でも文脈で
     演出規模が変わる（超大当たり＝リーチ経由・フル連チャン完走）ため、
     ここで上書きする。ハズレは_hitEntryがnullなので0（加算なし） */
  let _kingGain = _hitEntry?.king ?? 0;
  if (_isJackpot) {
    if (feverEndedReason === 'complete') _kingGain = KING_GAIN_FEVER_COMPLETE;
    else if (isReachJackpot)             _kingGain = KING_GAIN_REACH_JACKPOT;
  }
  if (_kingGain > 0) {
    kingGyozaMeter += _kingGain;
    lsSaveStats(); // 中当たりはこの経路でしか統計を保存しないため、加算のたびに保存する
  }
  /* 前トライのエフェクトがまだ退場しきっていないうちに次の当たりが出た場合は、
     退場を加速して早く画面から抜けさせる（ユーザー要望: 新しい当たり演出と
     混ざり続けないように）。ハズレでは加速しない＝そのままの速度で流れていく */
  if (hitType !== 'none') _fxOutro.rush = true;
  /* 配当計算 */
  const payout = calcPayout();
  if (payout > 0) {
    coins += payout;
    payoutPopups.push({ amt: payout, timer: 150, beatBonus: syncChain >= BEAT_BONUS_CHAIN });
    if (!_isJackpot && !isReachJackpot) playSE('coin'); // 中当たりコイン音
  }
  /* ゲームオーバー判定（ペイアウト後にコインが0以下） */
  if (coins <= 0) {
    isGameOver = true;
    grayRateTarget = 0.001; // オーディオ有無に関わらずグレーアウト開始
    stopBGMTape(); // テープが止まるような演出でBGMをフェードアウト
  }
  /* ハズレ判定 */
  if (!_isJackpot && !_isMedium) {
    /* 通常モードのハズレでは効果音を鳴らさない（ユーザー要望「4的目を打った後、
       文字列が揃わずにハズレたときの効果音が耳障り」）。'miss'SE（ズコーという
       ノコギリ波の下降スライド）は通常プレイで最も頻繁に鳴るSEであり、
       ハズレのたびに毎回鳴ると耳につく。ハズレ自体はポップアップ（missPopups）
       と画面演出で十分伝わるため、音は落とす。
       ※'miss'SE自体はキングギヨウザ戦の失敗時（頻度が低く演出上の意味がある）
         で引き続き使うので、playSEのcaseは残す */
    isMissResult = true;
    missPopups.push({ amt: bet, timer: 120 }); // 配列に追加（複数同時OK）
  }
  lsSave();         // コイン状態を保存
  checkCoinsAch();  // コイン実績チェック
}

/* ── phaseをまたいで常時更新するもの ──
   ここに置いたものは、どのphase分岐が早期returnしても必ず毎tick実行される。
   関数として切り出しているのは、この不変条件をコメントではなく構造で守るため。
   過去2回、同じクラスの不具合を実機で踏んでいる:
     ・画面全体フェード（_screenFade）を後方に置いていたため、boss系phaseの
       早期returnで一度も進まず、フェードアウト後にCONTINUEが出たまま入力が
       効かなくなった
     ・花火パーティクルの寿命処理とフィーバー終了バナーのタイマーが同様に凍結し、
       キングギヨウザの画面に前のモードの表示が残り続けた
   新しく「phaseに関係なく進める必要があるもの」を足すときは、update()本体では
   なくこの関数に入れること。 */
function _updateAlways() {
  /* 画面全体フェード: 関数先頭で最優先に更新する。boss系の各phase分岐は末尾で
     早期returnするため（bossDefeatOutro等）、後方の「phaseをまたいで常時更新
     すべきもの」セクションに置くとその早期returnで一切実行されず、フェードが
     永久に止まってしまう不具合があった（実機指摘: フェードアウト後CONTINUEが
     表示されたまま入力が効かない＝_screenFade.timerが一度も進まずonMidが
     呼ばれずphaseが切り替わらなかったのが原因）。関数の最初に置くことで
     どのphase分岐が早期returnしても必ず1回だけ実行されるようにする。 */
  if (_screenFade) _updateScreenFade();
  /* BGMのハイシェルフ（こんがり度連動の音色変化）。ボス戦以外では0dBへ戻す役目も
     兼ねているため、boss系phase分岐の早期returnに巻き込まれない位置＝ここに置く
     必要がある（下記コメントと同じ理由。ボス戦を抜けた瞬間に呼ばれなくなると
     高域が持ち上がったまま通常プレイへ持ち越されてしまう） */
  _updateBgmToneShelf();
  /* ────────────────────────────────────────────────
     大ゲームスコープ: phaseをまたいで常時更新すべきもの
     （↑の_screenFadeと同じ理由でここに置く。以前は関数末尾寄りに置いていたが、
     bossOmen/boss/bossVictory/bossDefeat/bossDefeatOutro/tapestart/startupの
     各phase分岐がいずれも早期returnする構造のため、そこに置くと実際には
     「phaseをまたいで」更新されず、それらのphase中は完全に凍結していた
     （実機指摘: FEVER終了バナーの枠やlaunchFireworksの花火の破片が、
     キングギヨウザ演出の画面にそのまま残り続ける不具合。原因は花火パーティクル
     の物理更新(swapRemoveによる寿命切れ削除を含む)とフィーバー終了バナー
     タイマーの減算がどちらもここにあり、boss系phaseの早期returnで一度も
     実行されなくなっていたため、寿命が尽きて消えるはずの物が永久に描画され
     続けていた。_screenFadeで一度発覚した不具合と同一クラスのため、
     このセクション全体を関数先頭へ移動した＝水平展開） */
  /* particles: 花火・命中インパクト等の共通パーティクル物理 */
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.985;
    p.r  *= 0.97; p.life--;
  }
  swapRemove(particles, _predParticle, _deadify);
  /* 中当たりエフェクトの退場: 次のトライと並行して画面外へ抜けていくので、
     phaseをまたいで常時更新する必要がある（_fxOutro参照） */
  _updateFxOutro();
  /* localStorageの溜まり分は「矢を放った直後」に書き出す。プレイヤーは拍に乗せて
     打つので、発射直後は次のタップまで約1拍（395ms）の余裕がある＝ここで数ms
     止まっても入力は取りこぼさない。逆に固定遅延のタイマー任せにすると、
     その遅延が拍と一致したときに毎回タップの瞬間へ着地する（_LS_FLUSH_DELAY_MSの
     コメント参照）。curIdx>0＝このトライで既に射っていることの確認 */
  if (_lsPending.size > 0) {
    const safeMoment = phase === 'idle' && curIdx > 0 &&
                       performance.now() / 1000 - _arrowStartWallTime > _LS_FLUSH_SAFE_SEC;
    /* 保険が切れたぶんは、せめて発射アニメ中（shooting）だけは避けて書く */
    if (safeMoment || (_lsFlushDue && phase !== 'shooting')) _lsFlush();
  }
  /* ハズレ・獲得ポップアップ（トライ横断フェードアウト） */
  for (const p of missPopups)   { if (p.timer > 0) p.timer--; }
  for (const p of payoutPopups) { if (p.timer > 0) p.timer--; }
  swapRemove(missPopups,   _predTimer);
  swapRemove(payoutPopups, _predTimer);
  /* スローハンドバッジのラッチ更新（drawSlowHandBadge参照）。isSlowSpinが
     false→trueになった瞬間だけ武装し、grayRateCurが十分1.0に戻ったら
     武装解除する。phaseをまたいで常時更新する必要がある（早期returnの
     多い各phase分岐に置くと武装解除のタイミングを取りこぼすため） */
  if (isSlowSpin && !_prevIsSlowSpinForBadge) _slowHandBadgeArmed = true;
  _prevIsSlowSpinForBadge = isSlowSpin;
  if (_slowHandBadgeArmed && !isSlowSpin && grayRateCur > 0.995) _slowHandBadgeArmed = false;
  /* キングギヨウザ予兆: 蓄積80%超のアイドル中、まれに霊が画面を横切る。
     こんがり以外の実績が未達成のうちは、まだ出現できないため予兆も出さない
     （水平展開: _maybeStartBossOmenと同じ条件を予兆側にも適用） */
  if (!_omenGhost && (phase === 'idle' || phase === 'reach') && !isFever &&
      kingGyozaMeter >= KING_GYOZA_THRESHOLD * KING_OMEN_RATIO &&
      _allAchExceptKongariDone() &&
      Math.random() < 1 / 900) {
    _spawnOmenGhost();
  }
  if (_omenGhost) {
    const g = _omenGhost;
    g.x += g.vx;
    g.wobble += 0.04;
    g.y += Math.sin(g.wobble) * 0.5;
    if ((g.vx > 0 && g.x > W + 60) || (g.vx < 0 && g.x < -60)) {
      _freeGhostCanvases.push(g.oc);
      _omenGhost = null;
    }
  }
  /* フィーバー堆積アイテム: doneフェーズ以外でも物理を継続（done内では既に呼ばれる） */
  if (items.length > 0 && phase !== 'done') updateItems();
  /* フィーバー開始バナータイマー（reason は常に null のためタイマーのみ管理） */
  if (feverStartBannerTimer > 0) {
    if (isGameOver) feverStartBannerTimer = 0;
    else            feverStartBannerTimer--;
  }
  /* フィーバー終了バナータイマー（reason は期限切れ・ゲームオーバー時に null へ） */
  if (feverEndBannerTimer > 0) {
    if (isGameOver) {
      feverEndBannerTimer = 0; feverEndBannerReason = null;
    } else {
      feverEndBannerTimer--;
      if (feverEndBannerTimer === 0) feverEndBannerReason = null;
    }
  }
  /* 実績バナータイマー（phaseに関係なく常時更新） */
  if (achBannerTimer > 0) {
    achBannerTimer--;
    if (achBannerTimer === 0) achBannerCurrent = null;
  } else if (achBannerQueue.length > 0) {
    achBannerCurrent = achBannerQueue.shift();
    achBannerTimer   = 200;
  }
  /* スローランプ完了: タイムスタンプをリセット
     suspended 中は currentTime が止まるため、その場合も即リセットして永久ロックを防ぐ */
  if (slowRampEndTime > 0 && audioCtx &&
      (audioCtx.state === 'suspended' || audioCtx.currentTime >= slowRampEndTime)) {
    slowRampEndTime = 0;
  }
  /* BGM音声バッファ積算位置を毎フレーム更新（getBeatPulse呼び出し有無に依存しないよう
     update先頭で行う。jackpot SE中など phase='done'でも正確に追跡できる） */
  _bgmAccumStep();
  /* 実効出力遅延を約2秒ごとに再計測（AirPods 接続・切断などの経路変更に追従） */
  if (audioCtx && ++_latencyRefreshCnt >= 120) {
    _latencyRefreshCnt = 0;
    _updateBeatDisplayAdvance();
  }
  /* ── ビート自動減衰: idle/reach 中に3拍経過するたびにスコア0.25を追加 ──
     3拍単位にすることで6拍おきに射つプレイヤーまでdecayが発生しない。
     アイドル時のペナルティ(0.25)は悪いタイミングでの射撃(0〜0.3)より軽く設定し
     「何もしない」より「ヘタな射ち」のほうが痛くなるよう差別化する。
     done/shooting/tapestart/startup フェーズは対象外（プレイヤーの責任ではない）
     shootGuardUntil 未経過の初期保護期間も除外 */
  if ((phase === 'idle' || phase === 'reach') && performance.now() >= shootGuardUntil && BGM_BEAT > 0) {
    const _curBeat = Math.floor(_bgmAccumAudioTime / (BGM_BEAT * AUTO_DECAY_BEATS));
    if (_autoDecayBeatIdx >= 0 && _curBeat > _autoDecayBeatIdx) {
      /* フレーム落ち等で複数期間分まとめて来た場合は最大4件に制限 */
      const _missed = Math.min(_curBeat - _autoDecayBeatIdx, 4);
      for (let _bi = 0; _bi < _missed; _bi++) _pushSyncScore(0.25);
    }
    _autoDecayBeatIdx = _curBeat;
  }
  if (slowHandPopTimer  > 0) slowHandPopTimer--;
  if (syncJustTimer     > 0) syncJustTimer--;
  /* syncRateDisp: VUメーター式（上昇は速く・下降はゆっくり） */
  const _syncLerpK = syncRate > syncRateDisp ? 0.25 : 0.018;
  syncRateDisp += (syncRate - syncRateDisp) * _syncLerpK;
  /* coinsDisp: coins に向けてeaseOut追従（差分×8%、上限2000/frame）
     ホイール回転が w.speed * tapeRate で動くのと同様に、常に _getBgmRateJS() を速度係数とする。
     これにより tapestart加速・スローハンド・通常速度がすべて同じ「世界の時間の流れ」で統一される。
     bgmSource.playbackRate.value はiOS Safariで自動化中に誤値を返すため _getBgmRateJS() を使用。
     audioCtxなし（MUTE無音起動）は rate=1 でフォールバック。 */
  if (coinsDisp !== coins && phase !== 'startup') {
    const _cd   = coins - coinsDisp;
    const _rate = audioCtx ? _getBgmRateJS() : 1;
    /* 最低ステップ3/フレーム: 指数減衰の尻尾（1コイン刻みの長期化）を打ち切る。
       BET100 の減算が約60→24フレームに短縮され、終盤に毎フレーム続いていた
       カウント文字列生成＋テキストOC再描画の負荷期間が半減する */
    const _cs   = Math.max(Math.min(Math.abs(_cd) * 0.08, 2000), 3) * _rate;
    if (_cs >= Math.abs(_cd)) { coinsDisp = coins; }
    else { coinsDisp += _cd > 0 ? _cs : -_cs; }
  }
  /* グレースケール視覚レートをlerpで追従（係数0.04≈1300ms収束、easeOut近似） */
  grayRateCur += (grayRateTarget - grayRateCur) * 0.04;
}

function update() {
  _updateAlways();
  if (phase === 'startup') {
    /* タイトル画面の背景はホイールではなく丸いギヨウザロゴに差し替え済みで、
       その回転角は startupTimer と w.speed から直接求める（draw側参照）。
       w.rot は誰も読まないため加算しない（ゲーム開始時に init() がホイールを
       作り直すので、ここで進めておく必要も無い） */
    startupTimer++; // draw()ではなくupdate()でカウント（draw分離後も60fps固定）
    return;
  }
  if (phase === 'tapestart') {
    /* テープ速度をそのまま回転係数に使う → 音・色・回転が完全同期
       .value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため JS 側で計算。
       ソースがまだ無い場合は、生成待ち（startBGMTapeが非同期で走る）の間だけ0で
       止めて待ち、上限を過ぎたら従来どおり1で即座に回り出す
       （_tapestartSrcWaitUntil の定義部コメント参照） */
    const tapeRate = bgmSource ? Math.max(0, Math.min(1, _getBgmRateJS()))
      : (performance.now() < _tapestartSrcWaitUntil ? 0 : 1);
    for (const w of wheels) w.rot += w.speed * tapeRate;
    /* テープ加速完了（色が完全に戻った）ら射撃解放 */
    if (tapeRate >= 0.99) {
      phase = 'idle';
      /* ゲームオーバーリカバリー後にスローイベントなら、復帰完了後にテンポ半減 */
      if (isSlowSpin) rampBGMRate(_slowHandRate(bet), 1200, 'easeOut', true); // ゲームオーバーリカバリー後もBET対応速度へ
      /* ここは新しいトライの開始ではなくphase遷移なので、init()は呼ばず先打ちだけ消費する
         （ガード解除は_consumePendingShoot側の責任） */
      _consumePendingShoot();
    }
    return;
  }
  if (phase === 'bossOmen') {
    _updateBossOmen();
    return;
  }
  if (phase === 'boss') {
    _updateBossBattle();
    return;
  }
  if (phase === 'bossShatter') {
    _updateKingReelShatter();
    return;
  }
  if (phase === 'bossVictory') {
    _updateBossVictory();
    return;
  }
  if (phase === 'bossVictoryOutro') {
    _updateBossVictoryOutro();
    return;
  }
  if (phase === 'trueEnding') {
    _updateTrueEnding();
    return;
  }
  if (phase === 'bossDefeat') {
    _updateBossDefeat();
    return;
  }
  if (phase === 'bossDefeatShrink') {
    _updateBossDefeatShrink();
    return;
  }
  if (phase === 'bossDefeatOutro') {
    _updateBossDefeatOutro();
    return;
  }
  for (const w of wheels) {
    if (!w.locked) w.rot += w.speed;
    if (w.result && w.resultPop < 1) w.resultPop = Math.min(1, w.resultPop + 0.045);
  }

  /* 次トライ用ホイールを1個進める（矢の着弾後＝次のタップまでが最も遠い時点。
     _preBuildStepIfDue参照）。phase判定は関数側で行う */
  _preBuildStepIfDue();

  if (phase === 'shooting') {
    /* フレームレート非依存: performance.now() でアニメーション進行（audioCtx suspended中も動く） */
    arrowProgress = _arrowStartWallTime > 0
      ? Math.min(1, (performance.now() / 1000 - _arrowStartWallTime) / ARROW_FLIGHT_SEC)
      : Math.min(1, arrowProgress + 0.25); // 念のためフォールバック
    if (arrowProgress >= 1) {
      spawnImpact(arrowTX, arrowTY);
      wheels[curIdx].hasArrow = true;
      /* 着弾では音を鳴らさない。矢の到着は spawnImpact の映像だけが担い、音は
         プレイヤーが打った瞬間の発射音（'shoot'）だけになる。
         かつてここで鳴らしていた着弾音を廃止した経緯と実測値、および安易に
         復活させないための指針は _SHOOT_ARPEGIO の定義部コメントに集約してある */
      curIdx++;
      if (curIdx >= 4) {
        _resolveTrialResult();
      } else if (curIdx === 3) {
        /* 3本目が刺さった → リーチ判定
           ギ・ヨ・ウが揃ったらリーチ発動。
           第4ホイールは減速しながら回り続け、
           プレイヤーが自分のタイミングで矢を放つ。 */
        const r3 = [wheels[0].result, wheels[1].result, wheels[2].result];
        const reachRoll = !isFever && r3.every((r, i) => r === TARGET[i]) && Math.random() < 1/10;
        if (reachRoll) {
          phase = 'reach';
          isReach = true;
          reachTimer = 0;
          unlockAch('first_reach');
          playSE('reach'); // リーチSE（BGM一時停止 + ジャジャーン）
          /* 第4ホイールの初期スピードを記録（減衰に使う） */
          wheels[3]._reachSpeed0 = wheels[3].speed;
        } else {
          phase = 'idle';
        }
      } else {
        phase = 'idle';
      }
    }
  }

  /* ── リーチ演出アップデート ── */
  if (phase === 'reach') {
    reachTimer++;
    /* 第4ホイールをなめらかに減速させる（止まらない、プレイヤーが射る） */
    const w4 = wheels[3];
    const decayT = Math.min(1, reachTimer / REACH_DECEL_FRAMES);
    const ease   = 1 - Math.pow(1 - decayT, 2.5); // ease-out
    w4.speed = w4._reachSpeed0 * (1 - ease * (1 - REACH_MIN_SPEED_RATIO));

    /* 金色パーティクル (第4ホイール周辺) */
    if (reachTimer % 3 === 0) {
      const ang = Math.random() * Math.PI * 2;
      const rad = WR * (0.9 + Math.random() * 0.8);
      spawnParticle(
        WXS[3] + Math.cos(ang) * rad,
        WYS[3] + Math.sin(ang) * rad,
        Math.cos(ang) * (0.4 + Math.random() * 0.8),
        Math.sin(ang) * (0.4 + Math.random() * 0.8) - 0.8,
        Math.random() < 0.6 ? Y : '#fff8dc',
        35 + Math.random() * 25,
        1.2 + Math.random() * 2.2
      );
    }
  }

  if (phase === 'done') {
    endTimer++;
    /* BPM=152: 1拍≈24f / 2拍≈48f / 4拍≈95f / 8拍≈190f
       矢速4f(1/4拍) → 着弾後、BGM拍グリッドの境界点でidle解放
       ハズレ    : 最小2f後、次の1/4拍境界で解放 → 合計≈6f(1/4拍)サイクル
       通常当たり : 最小24f(1拍)後、次の1/4拍境界で解放
       大当たり系 : 最小96f(4拍)後、次の1/4拍境界で解放
       ゲームオーバー: クリック確認が必要なためcanRestart方式を維持 */
    const _isJackpot = hitType === 'jackpot';
    const _isMedium  = hitType !== 'none' && !_isJackpot;
    const minWait  = isMissResult ? 2 : (_isJackpot || _isMedium) ? 96 : 24;
    /* 4文字目の結果が完全に表示されてからリセット */
    const allShown = wheels.every(_predWheelShown);
    /* ハズレのみビートグリッド同期で自動リセット（当たりはユーザー入力待ち） */
    if (!isGameOver && isMissResult && !feverEndedReason && endTimer > minWait && allShown && onBeatGrid()) {
      if (_maybeStartBossOmen()) return;
      _beginNextTrial(); return;
    }
    /* フィーバー中大当たり: 30f後に自動リセット（アイテム落下のみ、入力待ちなし） */
    if (_jackpotAutoReset && !isGameOver && endTimer > 30) {
      if (_maybeStartBossOmen()) return;
      _beginNextTrial(); return;
    }
    /* エフェクト終了後: canRestartをセット
       ハズレ → クリック早送りも可、当たり → クリック確認必須（自動リセットなし） */
    if (!isGameOver && !_jackpotAutoReset && endTimer > minWait && allShown) {
      canRestart = true;
    }
    /* CONTINUEバッジ表示遅延カウント: draw()側だと120Hz端末で2倍速になるためここで進める */
    if (canRestart && !isGameOver) _continueShowDelay++;
    /* ゲームオーバー時のみクリック確認必須 */
    if (isGameOver && endTimer > 45) canRestart = true;
    if (reachFlash  > 0) reachFlash  = Math.max(0, reachFlash  - 0.045);

    if (isReachJackpot && endTimer % 70 === 35) launchReachFireworks();
    else if (_isJackpot && endTimer % 85 === 40) launchFireworks();
    if (items.length > 0)                    updateItems();
    if (hitType === 'gizagiza' && endTimer % 120 === 60) launchGizaFireworks();
    if (_activeEffect?.update) _activeEffect.update();
  }
}

function spawnImpact(x, y) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random()*Math.PI*2, spd = Math.random()*5+1;
    spawnParticle(x, y, Math.cos(a)*spd, Math.sin(a)*spd-1,
      [Y,'#fff',YD][i%3], 28+Math.random()*15, Math.random()*3+1);
  }
}

/* ════════════════ 勝利エフェクト ════════════════ */

function launchFireworks() {
  const pal = [Y,'#fff8dc','#fffacd',YD,'#a8e6cf'];
  for (let b = 0; b < 5; b++) {
    const bx = 100+Math.random()*(W-200), by = 80+Math.random()*(H*0.55);
    for (let i = 0; i < 32; i++) {
      const a=(i/32)*Math.PI*2+Math.random()*0.4, spd=Math.random()*5+2;
      spawnParticle(bx, by, Math.cos(a)*spd, Math.sin(a)*spd,
        pal[Math.floor(Math.random()*pal.length)], 70+Math.random()*50, Math.random()*4.5+1.5);
    }
  }
}

/* リーチ大当たり専用: 虹色10発一斉打ち上げ */
function launchReachFireworks() {
  const RAINBOW = ['#ff4444','#ff9900','#ffee00','#44ee44','#44aaff','#aa44ff','#ff44aa','#ffffff'];
  for (let b = 0; b < 10; b++) {
    /* 画面全体に広く分散 */
    const bx = 60 + (b / 9) * (W - 120) + (Math.random() - 0.5) * 80;
    const by = 50 + Math.random() * (H * 0.5);
    const col = RAINBOW[b % RAINBOW.length];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2 + Math.random() * 0.3;
      const spd = Math.random() * 7 + 3;
      spawnParticle(bx, by, Math.cos(a)*spd, Math.sin(a)*spd,
        Math.random() < 0.3 ? '#ffffff' : col, 90+Math.random()*60, Math.random()*5.5+2);
    }
  }
}

function launchGizaFireworks() {
  const pal = ['#c0d8f0','#e8f4ff','#fff','#a0c8e8',YD];
  for (let b = 0; b < 3; b++) {
    const bx = 150+Math.random()*(W-300), by = 100+Math.random()*(H*0.45);
    for (let i = 0; i < 22; i++) {
      const a=(i/22)*Math.PI*2+Math.random()*0.4, spd=Math.random()*4+1.5;
      spawnParticle(bx, by, Math.cos(a)*spd, Math.sin(a)*spd,
        pal[Math.floor(Math.random()*pal.length)], 45+Math.random()*30, Math.random()*3+1);
    }
  }
}

/* ════════════════ ウヨウヨ: うごめくアイテム ════════════════ */
function initWorms() {
  for (const g of worms) g._dead = true;
  worms = [];
  for (let i = 0; i < 10; i++) setTimeout(() => spawnWorm(), i * 300);
}

function spawnWorm() {
  /* initWorms の setTimeout がトライ切替後に遅れて発火した場合のガード
     （次トライの worms 配列に描画されない worm を push しプールスロットを占有するのを防ぐ） */
  if (phase !== 'done' || hitType !== 'uyouyo') return;
  const side = Math.floor(Math.random()*4);
  let x, y, angle;
  if      (side===0){ x=Math.random()*W; y=-40;   angle= Math.PI/2; }
  else if (side===1){ x=W+40;  y=Math.random()*H; angle= Math.PI;   }
  else if (side===2){ x=Math.random()*W; y=H+40;  angle=-Math.PI/2; }
  else              { x=-40;   y=Math.random()*H; angle= 0;          }
  angle += (Math.random()-0.5)*0.8;
  const g       = makeItem(x, y, 0, 0);
  g.angle       = angle;
  g.speed       = 1.2 + Math.random()*1.5;
  g.wiggle      = Math.random()*Math.PI*2;
  g.wiggleSpd   = 0.08 + Math.random()*0.06;
  g.wiggleAmp   = 0.04 + Math.random()*0.04;
  g.alive       = true;
  worms.push(g);
}

function updateWorms() {
  for (const w of worms) {
    w.wiggle += w.wiggleSpd;
    w.angle  += Math.sin(w.wiggle) * w.wiggleAmp;
    w.x      += Math.cos(w.angle) * w.speed;
    w.y      += Math.sin(w.angle) * w.speed;
    w.rot     = w.angle;  // 進行方向に向ける
    w.rotSpd  = 0;
    if (w.x < -80 || w.x > W+80 || w.y < -80 || w.y > H+80) {
      w.alive = false;
      w._dead = true;
    }
  }
  swapRemove(worms, _predAlive);
  if (endTimer % 18 === 0 && worms.length < 22) spawnWorm();
}

/* 中当たり演出の描画は (list, outroTimer) で統一する。
   引数なし＝現トライぶんの通常描画、list付き＝退場中のリスト（_drawFxOutro参照）。
   ウヨウヨは時間軸を持たないのでoutroTimerは受け取らない */
function drawWorms(list) {
  ctx.save();
  for (const w of (list ?? worms)) {
    drawOneItem(w);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ 落下アイテム ════════════════ */

/* ── ギヨウザ外観バリアントスプライト ──
   drawOneItem は1個あたり約10パス+グラデーションのベクタ描画で、
   大当たり/フィーバー時（最大240個）の描画が idle の約20倍のコストを占めていた。
   起動時に皮色×具配置のバリアントを OC へ焼き込み、毎フレームは
   回転付き drawImage 1回に置換する（実測 約2.5倍高速）。
   個体差は _ITEM_VARIANT_N 種に量子化されるが落下群では知覚できない。
   OffscreenCanvas 未対応時は null → 従来のパス描画へフォールバック。 */
const _ITEM_VARIANT_N   = 12;
const _ITEM_SPRITE_REF  = 42; // 焼き込み基準サイズ（makeItem の size 上限）
const _ITEM_SPRITE_HALF = 32; // 影・具を含む必要半径（≈0.75×REF + 余白）
const _itemVariantSprites = (() => {
  if (!_CACHE_OK) return null;
  const arr = [];
  const s = _ITEM_SPRITE_REF;
  for (let v = 0; v < _ITEM_VARIANT_N; v++) {
    const oc = _mkCache(_ITEM_SPRITE_HALF * 2 * _dpr, _ITEM_SPRITE_HALF * 2 * _dpr);
    const c  = oc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.translate(_ITEM_SPRITE_HALF, _ITEM_SPRITE_HALF);
    /* 影（drawOneItem のフォールバックパスと同一） */
    c.save();
    c.translate(s*0.06, s*0.12);
    c.scale(1, 0.55);
    c.beginPath(); c.arc(0, 0, s*0.58, 0, Math.PI*2);
    c.fillStyle = 'rgba(0,0,0,0.18)'; c.fill();
    c.restore();
    /* 本体（makeItem と同一のランダムパレット） */
    const skinL = `hsl(${42+Math.random()*12|0},${48+Math.random()*12|0}%,${78+Math.random()*8|0}%)`;
    const skinD = `hsl(${38+Math.random()*10|0},${50+Math.random()*14|0}%,${62+Math.random()*8|0}%)`;
    const grd = c.createRadialGradient(-s*0.18, -s*0.12, 0, 0, s*0.08, s*0.62);
    grd.addColorStop(0, skinL);
    grd.addColorStop(0.6, skinD);
    grd.addColorStop(1, 'hsl(35,45%,50%)');
    _drawGyozaBody(c, s, 0, 0, grd); // 関数宣言はホイスティングされるため前方参照可
    /* 具（makeItem と同一の乱数レンジ） */
    c.globalAlpha = 0.82;
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.ellipse((Math.random()-0.5)*0.55*s, (Math.random()-0.5)*0.35*s,
                (0.055+Math.random()*0.04)*s, (0.035+Math.random()*0.03)*s,
                (Math.random()-0.5)*1.2, 0, Math.PI*2);
      c.fillStyle = `hsl(${108+Math.random()*24|0},${60+Math.random()*20|0}%,${35+Math.random()*15|0}%)`;
      c.fill();
    }
    c.globalAlpha = 1;
    arr.push(oc);
  }
  return arr;
})();

function makeItem(x, y, vx, vy) {
  const g    = _itemAlloc();
  g._dead    = false;
  const size = 34 + Math.random() * 8;
  g.x = x; g.y = y; g.vx = vx; g.vy = vy; g.age = 0; g._flush = false;
  g.rot      = Math.random() * Math.PI * 2;
  g.rotSpd   = (Math.random() - 0.5) * 0.14;
  g._rotPhase = Math.random() * Math.PI * 2;
  g.size   = size;
  if (_itemVariantSprites) {
    /* スプライトモード: 外観は焼き込み済みバリアントを割り当て（皮・具の生成をスキップ） */
    g._spr = _itemVariantSprites[(Math.random() * _ITEM_VARIANT_N) | 0];
    return g;
  }
  g._spr   = null;
  g.skinL  = `hsl(${42+Math.random()*12|0},${48+Math.random()*12|0}%,${78+Math.random()*8|0}%)`;
  g.skinD  = `hsl(${38+Math.random()*10|0},${50+Math.random()*14|0}%,${62+Math.random()*8|0}%)`;
  /* ボディグラジェントをここで1回だけ生成してキャッシュ */
  const s = size;
  g.bodyGrd = ctx.createRadialGradient(-s*0.18, -s*0.12, 0, 0, s*0.08, s*0.62);
  g.bodyGrd.addColorStop(0, g.skinL);
  g.bodyGrd.addColorStop(0.6, g.skinD);
  g.bodyGrd.addColorStop(1, 'hsl(35,45%,50%)');
  /* greens: 事前確保済みの配列オブジェクトを再利用してGCゼロ */
  for (let i = 0; i < 5; i++) {
    const gr = g.greens[i];
    gr.dx    = (Math.random()-0.5)*0.55;
    gr.dy    = (Math.random()-0.5)*0.35;
    gr.rx    = 0.055+Math.random()*0.04;
    gr.ry    = 0.035+Math.random()*0.03;
    gr.a     = (Math.random()-0.5)*1.2;
    gr.color = `hsl(${108+Math.random()*24|0},${60+Math.random()*20|0}%,${35+Math.random()*15|0}%)`;
  }
  return g;
}

/* 残存アイテムを地面スルーで画面下へ落下させて退場させる */
function flushItems() {
  for (const g of items) {
    g._flush = true;
    g.vy = 6 + Math.random() * 5;   // 強めの下向き初速
    g.vx += (Math.random() - 0.5) * 2; // 少し左右にばらす
  }
}

/* addOnly=true のとき既存アイテムを保持して追加（フィーバー連続大当たり用）。
   上限200を超えないようキャップする。 */
function initItems(burst = 70, addOnly = false, max = 200) {
  if (!addOnly) {
    for (const g of items) g._dead = true; // 既存をプールに返却
    items = [];
  }
  /* 最初に中央からどさっとまとめて投下 */
  const FEVER_MAX = max;
  const toAdd = addOnly ? Math.min(burst, FEVER_MAX - items.length) : burst;
  for (let i = 0; i < toAdd; i++) {
    const cx   = W/2 + (Math.random()-0.5) * W*0.38;  // 中央寄り
    const y    = -40 - Math.random() * 180;            // 高さをずらして"固まり感"を出す
    const vx   = (Math.random()-0.5) * 5;
    const vy   = 1.5 + Math.random() * 4;
    items.push(makeItem(cx, y, vx, vy));
  }
}

function spawnItem() {
  /* 通常スポーン: 画面全体からランダムに */
  const x  = Math.random() * (W + 80) - 40;
  const vy = Math.random() * 1.5 + 0.5;
  const vx = (Math.random() - 0.5) * 4;
  items.push(makeItem(x, -50, vx, vy));
}

const GROUND_Y     = H - 14;   // キャンバス底面の地面ライン
/* アイテム衝突半径の上限: makeItem の size 上限(34+8=42) × 0.52
   yソート済みスイープの打ち切り判定（break）に使用 */
const RMAX_ITEM_R  = 42 * 0.52;


/* ────────────────────────────────────────────────────────────
   完全物理シミュレーション:
   ・全アイテムを常に重力・衝突の対象にする
   ・位置修正(Positional Correction) + 速度インパルスを
     複数イテレーション繰り返すことで安定した堆積を実現
   ・支えを失ったアイテムは再落下し横方向にも動く
   ──────────────────────────────────────────────────────────── */
function updateItems() {
  /* 追加スポーン: リーチ大当たりのみ継続投下、通常大当たりは初期バーストのみ。
     当たり演出はユーザー入力待ちで自動終了しないため、投下自体に時間上限を
     設けて放置し続けても際限なく湧かないようにする（KING_ITEM_SPAWN_MAX_FRAMES
     宣言部のコメント参照） */
  if (isReachJackpot) {
    const spawnRate = endTimer < 60 ? 8 : endTimer < 200 ? 5 : 3;
    if (endTimer < KING_ITEM_SPAWN_MAX_FRAMES && endTimer % spawnRate === 0 && items.length < 240) spawnItem();
  }

  const GRAVITY     = 0.38;
  const RESTITUTION = 0.06;   // 反発係数(低=ほぼ非弾性)
  const G_FRICTION  = 0.80;   // 地面摩擦
  const G_FRICTION2 = 0.92;   // アイテム間摩擦
  const ITERS       = 5;      // 衝突解決イテレーション数

  /* ① 積分: 重力適用・位置更新 */
  for (const g of items) {
    g.age++;
    g.vy        += GRAVITY;
    g.vx        *= 0.997;        // 空気抵抗
    g.x         += g.vx;
    g.y         += g.vy;
    g.rot       += g.rotSpd;
    g.rotSpd    *= 0.978;        // 空中での微弱な空気減衰
    g.inContact  = false;        // 接触フラグをリセット(衝突解決で立てる)
  }

  /* ② 衝突解決ループ */
  for (let iter = 0; iter < ITERS; iter++) {

    /* 地面 & 左右壁 */
    for (const g of items) {
      const r = g.size * 0.52;
      if (!g._flush && g.y + r > GROUND_Y) {
        g.y = GROUND_Y - r;
        g.inContact = true;
        if (g.vy > 0) {
          g.vx *= G_FRICTION;
          g.vy  = -g.vy * RESTITUTION;
          if (Math.abs(g.vy) < 0.4) g.vy = 0;
        }
        /* 地面摩擦で回転を減衰 */
        g.rotSpd *= 0.78;
        if (Math.abs(g.rotSpd) < 0.003) g.rotSpd = 0;
        /* 着地後: 近い方の壁へ流れる
           doneフェーズ: age依存で緩やか→強め（山積み→崩落）
           それ以外(idle等): age依存でゆっくり→速やかに画面外へ */
        if (g.vy === 0) {
          const t = Math.min(1, g.age / 300);   // 0→1 (約5秒)
          /* ハズレ done は山積み演出なしのため idle と同じ速度で退場 */
          const drift = (phase === 'done' && !isMissResult)
            ? 0.005 + t * 0.025               // done(当たり): 山積み → 崩落
            : 0.01  + t * 0.12;               // idle/ハズレ: 速やかに画面外へ
          g.vx += (g.x < W / 2 ? -1 : 1) * drift;
        }
      }
    }

    /* アイテム同士の円衝突（yソート済みスイープ: 遠いペアの判定を打ち切り）
       n=240時 約14万ペア/フレーム → 近傍ペアのみに削減 */
    _insertionSortY(items); // イテレーションごとに位置修正が入るため都度ソート（ほぼ整列済みで実質O(n)）
    for (let i = 0; i < items.length; i++) {
      const a = items[i];
      if (a._flush) continue; // 落下中は衝突スキップ
      const ra = a.size * 0.52;
      const yLimit = ra + RMAX_ITEM_R; // これ以上yが離れたら以降のjは全て非衝突
      for (let j = i + 1; j < items.length; j++) {
        const b  = items[j];
        const dy = b.y - a.y; // ソート済みなので dy >= 0
        if (dy >= yLimit) break; // スイープ打ち切り
        if (b._flush) continue;
        const rb = b.size * 0.52;
        const minD = ra + rb;
        const dx = b.x - a.x;
        if (Math.abs(dx) >= minD || dy >= minD) continue; // 安価な事前チェック
        const d2 = dx*dx + dy*dy;
        if (d2 >= minD*minD || d2 < 0.001) continue;

        const dist = Math.sqrt(d2);
        const nx = dx/dist, ny = dy/dist;

        /* 位置修正: 重なり量を均等に分配(=等質量) */
        const corr = (minD - dist) * 0.5;
        a.x -= nx * corr;  a.y -= ny * corr;
        b.x += nx * corr;  b.y += ny * corr;

        /* 速度インパルス */
        const dvx  = b.vx - a.vx, dvy = b.vy - a.vy;
        const vrel = dvx*nx + dvy*ny;   // 法線方向相対速度
        if (vrel >= 0) continue;        // 離れていれば無視

        const imp = -(1 + RESTITUTION) * vrel * 0.5;  // 等質量なので/2
        a.vx -= imp * nx;  a.vy -= imp * ny;
        b.vx += imp * nx;  b.vy += imp * ny;

        /* 接線摩擦: 横滑りを抑えて安定積み */
        const tx   = -ny, ty = nx;
        const tvel = dvx*tx + dvy*ty;
        const fric = tvel * (1 - G_FRICTION2) * 0.5;
        a.vx += fric * tx;  a.vy += fric * ty;
        b.vx -= fric * tx;  b.vy -= fric * ty;

        /* 接触摩擦で回転を減衰 */
        a.inContact = true;
        b.inContact = true;
        a.rotSpd *= 0.85;
        b.rotSpd *= 0.85;
        if (Math.abs(a.rotSpd) < 0.003) a.rotSpd = 0;
        if (Math.abs(b.rotSpd) < 0.003) b.rotSpd = 0;
      }
    }
  }

  /* 画面外に完全に出たものをプールに返却しつつ除去 */
  swapRemove(items, _predItem, _deadify);
  /* updateの末尾でソートしておくことでdrawItems側でのslice+sortを排除 */
  _insertionSortY(items);
}

/* ギヨウザ本体形状を任意のコンテキストへ描画する共通関数。
   drawOneItem()・_makeGhostCanvas() の両方から呼ばれる。
   c2: 描画先コンテキスト / s: サイズ / ox,oy: 中心座標 / bodyGrd: 本体グラジェント
   影・具（greens）・オーラ・ハロ・尾は呼び出し側で個別に描く。
   オブジェクト生成なし（c2の参照とプリミティブのみ）→ GC 影響ゼロ。 */
function _drawGyozaBody(c2, s, ox, oy, bodyGrd) {
  /* 本体楕円 */
  c2.beginPath();
  c2.ellipse(ox, oy + s*0.08, s*0.58, s*0.48, 0, 0, Math.PI*2);
  c2.fillStyle = bodyGrd;
  c2.fill();
  c2.strokeStyle = 'rgba(120,90,50,0.55)';
  c2.lineWidth = 1.2;
  c2.stroke();

  /* 蒸し焼き底面の焦げ色 */
  c2.save();
  c2.beginPath();
  c2.ellipse(ox, oy + s*0.32, s*0.46, s*0.18, 0, 0, Math.PI*2);
  c2.fillStyle = 'hsl(30,60%,52%)';
  c2.globalAlpha = 0.45; c2.fill();
  c2.restore();

  /* 頂部の薄皮 */
  c2.beginPath();
  c2.ellipse(ox, oy - s*0.12, s*0.40, s*0.14, 0, 0, Math.PI*2);
  c2.fillStyle = 'hsl(50,55%,88%)';
  c2.fill();
  c2.strokeStyle = 'rgba(120,90,50,0.4)';
  c2.lineWidth = 0.8;
  c2.stroke();

  /* ひだ（9本を1回のstrokeでGPUフラッシュ削減） */
  c2.strokeStyle = 'rgba(140,105,55,0.55)';
  c2.lineWidth = 0.9;
  c2.beginPath();
  for (let i = -4; i <= 4; i++) {
    const bx = ox + i * s * 0.095;
    c2.moveTo(bx, oy - s*0.04);
    c2.bezierCurveTo(bx - s*0.04, oy - s*0.22, bx + s*0.04, oy - s*0.22, bx + s*0.07, oy - s*0.04);
  }
  c2.stroke();

  /* ハイライト */
  c2.beginPath();
  c2.ellipse(ox - s*0.18, oy - s*0.08, s*0.16, s*0.09, -0.4, 0, Math.PI*2);
  c2.fillStyle = 'rgba(255,255,255,0.28)';
  c2.fill();
}

function drawOneItem(g) {
  const s = g.size;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.rot);

  if (g._spr) {
    /* スプライトモード: 影・本体・具を焼き込み済みのOCを基準サイズ比で1回転写 */
    const h = _ITEM_SPRITE_HALF * (s / _ITEM_SPRITE_REF);
    ctx.drawImage(g._spr, -h, -h, h * 2, h * 2);
    ctx.restore();
    return;
  }

  /* 影（drawOneItem固有） */
  ctx.save();
  ctx.translate(s*0.06, s*0.12);
  ctx.scale(1, 0.55);
  ctx.beginPath();
  ctx.arc(0, 0, s*0.58, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fill();
  ctx.restore();

  /* 本体形状（共通） */
  _drawGyozaBody(ctx, s, 0, 0, g.bodyGrd);

  /* 具（drawOneItem固有 / greens は per-item ランダムデータ） */
  ctx.globalAlpha = 0.82;
  for (const gr of g.greens) {
    ctx.beginPath();
    ctx.ellipse(gr.dx*s, gr.dy*s, gr.rx*s, gr.ry*s, gr.a, 0, Math.PI*2);
    ctx.fillStyle = gr.color; // 生成時にキャッシュ済み
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawItems() {
  if (!items.length) return;
  /* updateItems末尾でソート済みのため slice+sort 不要 */
  for (const g of items) drawOneItem(g);
}

/* ════════════════ ウザウザ: ウザいテキスト大量発生 ════════════════ */
const UZA_WORDS = ['ウザ','うざっ','ウザい','うざい','ウザっ！','うざ…','ウザすぎ','うわウザ'];

function initUzaTexts() { for (const o of uzaTexts) o._dead = true; uzaTexts = []; }

function updateUzaTexts() {
  /* 徐々に増える間隔: 最初は5フレームに1個、後は2フレームに1個 */
  const interval = Math.max(2, 10 - Math.floor(endTimer/40));
  if (endTimer > 40 && endTimer % interval === 0) {
    const t = _poolAlloc(_uzaPool);
    t._dead = false;
    t.x = Math.random()*W; t.y = Math.random()*H;
    t.text  = UZA_WORDS[Math.floor(Math.random()*UZA_WORDS.length)];
    t.rot   = (Math.random()-0.5)*0.9;
    t.size  = 14 + Math.random()*52;
    t.alpha = 0; t.age = 0;
    t.peak  = 0.5 + Math.random()*0.5;
    t.color = `hsl(${Math.random()*40+5|0},90%,${55+Math.random()*25|0}%)`;
    t.life  = 90 + Math.random()*150;
    uzaTexts.push(t);
  }
  for (const t of uzaTexts) {
    t.age++;
    if (t.age < 15)             t.alpha = Math.min(t.peak, t.alpha+t.peak/15);
    else if (t.age > t.life-20) t.alpha = Math.max(0, t.alpha-t.peak/20);
  }
  swapRemove(uzaTexts, _predUzaText, _deadify);
}

function drawUzaTexts() {
  ctx.save();
  for (const t of uzaTexts) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.globalAlpha = t.alpha;
    ctx.font = `bold ${t.size}px 'Hiragino Kaku Gothic Pro', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ギウギウ: ぎゅうぎゅう詰め ════════════════ */
function initGiugiu() {
  for (const g of items) g._dead = true;
  items = [];
  /* 外周リングから中央へ向かって一斉に投下 */
  const N = _itemBurst(PAYOUT_RATE.hitMed);
  const R = Math.hypot(W, H) * 0.55;
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    const sx  = W/2 + Math.cos(angle) * R;
    const sy  = H/2 + Math.sin(angle) * R;
    const spd = 32 + Math.random() * 10;
    const vx  = (W/2 - sx) / R * spd;
    const vy  = (H/2 - sy) / R * spd;
    items.push(makeItem(sx, sy, vx, vy));
  }
}

function updateGiugiu() {
  /* 外縁から追加投入（最大30個） */
  if (endTimer % 15 === 0 && items.length < 30) {
    const angle = Math.random() * Math.PI * 2;
    const R = Math.hypot(W, H) * 0.55;
    const sx = W/2 + Math.cos(angle) * R;
    const sy = H/2 + Math.sin(angle) * R;
    const spd = 32 + Math.random() * 10;
    items.push(makeItem(sx, sy,
      (W/2 - sx) / R * spd, (H/2 - sy) / R * spd));
  }

  const ATTRACT     = 1.20;  // 中心引力（強化: 高速集合後も押し付け維持）
  const ATTRACT_REF = 50;    // 距離反比例の参照距離: d=REF で引力2倍、d→∞ で引力1倍
  const DAMPING     = 0.93;  // 速度減衰
  const RESTITUTION = 0.50;  // 反発係数
  const FRICTION2   = 0.88;  // アイテム間摩擦
  const ITERS       = 4;
  /* 重力発生点をリサージュ軌道でゆっくりドリフト（異周波数で不規則に動く） */
  const driftR = Math.min(W, H) * 0.10;
  const CX = W/2 + Math.cos(endTimer * 0.022) * driftR;
  const CY = H/2 + Math.sin(endTimer * 0.037) * driftR * 0.6;
  /* ATTRACT脈動: ビート同期（拍頭に一瞬だけ弱反発→すぐ引き戻し）
     getBeatPulse()に+60ms先読みを追加してギウギウ拍動の体感遅延を補正 */
  const beatPulse = (function() {
    const loopDur = _curQuantizedLoopDur();
    if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || loopDur <= 0) return 0;
    const rate = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo;
    const pos  = _bgmAccumAudioTime + (_BEAT_DISPLAY_ADVANCE - _hwLatency + 0.06) * rate;
    const pip  = ((pos % loopDur) + loopDur) % loopDur;
    const ph   = (((pip % BGM_BEAT) + BGM_BEAT) % BGM_BEAT) / BGM_BEAT;
    return Math.pow(Math.max(0, 1 - ph * 2.5), 2);
  })();
  const attractMul   = 1.0 - beatPulse * 1.75;
  const ATTRACT_DYNA = ATTRACT * attractMul;

  /* ① 距離反比例引力 + 位置更新 */
  for (const g of items) {
    const dx = CX - g.x, dy = CY - g.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 0.001;
    const forceMag = ATTRACT_DYNA * (1 + ATTRACT_REF / (d + ATTRACT_REF));
    g.vx    += dx / d * forceMag;
    g.vy    += dy / d * forceMag;
    g.vx    *= DAMPING;
    g.vy    *= DAMPING;
    g.x     += g.vx;
    g.y     += g.vy;
    /* 回転振動: 衝突減衰に負けないよう強めのトルクで直接駆動 */
    const oscFreq = 0.10 + (g.size - 34) * 0.004;
    g.rotSpd += Math.sign(Math.sin(endTimer * oscFreq + g._rotPhase)) * (0.015 + beatPulse * 0.04);
    g.rotSpd *= 0.85;
    g.rot    += g.rotSpd;
  }

  /* ② 衝突解決（円衝突 + 位置修正 + 速度インパルス）
     updateItems と同じ yソート済みスイープで近傍ペアのみ判定 */
  for (let iter = 0; iter < ITERS; iter++) {
    _insertionSortY(items);
    for (let i = 0; i < items.length; i++) {
      const a = items[i], ra = a.size * 0.52;
      const yLimit = ra + RMAX_ITEM_R;
      for (let j = i + 1; j < items.length; j++) {
        const b  = items[j];
        const dy = b.y - a.y; // ソート済みなので dy >= 0
        if (dy >= yLimit) break;
        const rb = b.size * 0.52;
        const minD = ra + rb;
        const dx = b.x - a.x;
        if (Math.abs(dx) >= minD || dy >= minD) continue;
        const d2 = dx*dx + dy*dy;
        if (d2 >= minD*minD || d2 < 0.001) continue;
        const dist = Math.sqrt(d2);
        const nx = dx/dist, ny = dy/dist;
        const corr = (minD - dist) * 0.5;
        a.x -= nx*corr; a.y -= ny*corr;
        b.x += nx*corr; b.y += ny*corr;
        const dvx = b.vx-a.vx, dvy = b.vy-a.vy;
        const vrel = dvx*nx + dvy*ny;
        if (vrel >= 0) continue;
        const imp = -(1 + RESTITUTION) * vrel * 0.5;
        a.vx -= imp*nx; a.vy -= imp*ny;
        b.vx += imp*nx; b.vy += imp*ny;
        const tx = -ny, ty = nx;
        const tvel = dvx*tx + dvy*ty;
        const fric = tvel * (1 - FRICTION2) * 0.5;
        a.vx += fric*tx; a.vy += fric*ty;
        b.vx -= fric*tx; b.vy -= fric*ty;
        a.rotSpd *= 0.85; b.rotSpd *= 0.85;
        if (Math.abs(a.rotSpd) < 0.003) a.rotSpd = 0;
        if (Math.abs(b.rotSpd) < 0.003) b.rotSpd = 0;
      }
    }
  }

  _insertionSortY(items);
}

/* ════════════════ ギギギギ: 機械の軋み・火花 ════════════════ */
function updateGigigigi() {
  /* 火花をランダムに飛ばす（プール再利用） */
  const rate = Math.min(8, 2 + Math.floor(endTimer / 60));
  for (let i = 0; i < rate; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 3 + Math.random() * 9;
    const s = _poolAlloc(_gigiPool);
    s._dead = false;
    s.x = Math.random() * W; s.y = Math.random() * H;
    s.vx = Math.cos(a)*spd;  s.vy = Math.sin(a)*spd;
    s.life = 10 + Math.random() * 14;
    s.color = Math.random() < 0.6 ? '#fff' : (Math.random()<0.5 ? '#ffaa00' : '#ff4400');
    s.r = 0.8 + Math.random() * 1.8;
    gigiSparks.push(s);
  }
  for (const s of gigiSparks) {
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.4; s.vx *= 0.93;
    s.life--;
  }
  swapRemove(gigiSparks, _predLife, _deadify);
}

function drawGigigigi() {
  if (hitType !== 'gigigigi' || endTimer < 50) return;
  const intensity = Math.min(1, (endTimer - 50) / 40);
  ctx.save();

  /* ランダムなグリッチ水平線 */
  for (let i = 0; i < 20; i++) {
    if (Math.random() > 0.45 * intensity) continue;
    const y = Math.random() * H;
    const w = W * (0.2 + Math.random() * 0.8);
    const x = Math.random() * (W - w);
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.random()*0.25})`;
    ctx.fillRect(x, y, w, 1 + Math.random()*4);
  }

  /* 火花: プリレンダ済みグロースプライトを drawImage（shadowBlur・save/restore なし） */
  for (const s of gigiSparks) {
    ctx.globalAlpha = Math.min(1, (s.life / 24) * intensity);
    const sp = _gigiSparkSprites && _gigiSparkSprites[s.color];
    if (sp) {
      const half = _GIGI_SPRITE_HALF * (s.r / _GIGI_SPRITE_R);
      ctx.drawImage(sp, s.x - half, s.y - half, half * 2, half * 2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.save();
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  /* RGBずれ */
  ctx.globalAlpha = 0.05 * intensity;
  ctx.fillStyle = 'rgba(255,0,0,1)';   ctx.fillRect(5, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,255,1)';   ctx.fillRect(-5, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ヨヨヨヨ: ヨーヨー ════════════════ */
function initYoyoyoyo() {
  for (const g of yoyos) g._dead = true;
  yoyos = [];
  const count = MEDIUM_EFFECT_GYOZA_N;
  /* 横に等間隔で並べるため、1レーンの幅は画面幅÷個数。縦画面（W=420）では
     20個だと1レーン21pxとギヨウザの見た目幅（約44px）より狭くなるが、
     各個体は振幅・周波数・位相がばらばらの上下運動をしていて同じ高さに
     並ばないため、横に重なっても団子にはならない。ばらけ幅（±9px）は
     レーン幅より大きくしないよう、レーン幅の4割を上限にする */
  const jitter = Math.min(18, (W / count) * 0.4);
  for (let i = 0; i < count; i++) {
    const x = (i + 0.5) * (W / count) + (Math.random()-0.5)*jitter;
    const g   = makeItem(x, 0, 0, 0);
    g.phase   = Math.random() * Math.PI * 2;
    g.freq    = 0.055 + Math.random()*0.04;
    g.amp     = H * 0.30 + Math.random() * H * 0.25;
    g.topY    = 10 + Math.random()*20;
    g.delay   = i * 6;
    g.spinSpd = (Math.random() > 0.5 ? 1 : -1) * (0.03 + Math.random()*0.03);
    yoyos.push(g);
  }
}

function updateYoyoyoyo() {
  for (const y of yoyos) {
    y.y   = y.topY + y.amp * (0.5 + 0.5 * Math.sin(endTimer * y.freq + y.phase));
    y.rot += y.spinSpd;
  }
}

/* outroTimerを渡すと退場中のリストを描く（フェードインは済んでいるので不透明、
   画面上端より上に出た糸は描かない）。省略時は現トライのyoyos */
function drawYoyoyoyo(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'yoyoyoyo' || endTimer < 50)) return;
  for (const y of (list ?? yoyos)) {
    let a = 1;
    if (!outro) {
      const age = endTimer - 50 - y.delay;
      if (age <= 0) continue;
      a = Math.min(1, age / 22);
    }

    /* 糸 */
    if (y.y > 0) {
      ctx.save();
      ctx.globalAlpha = a * 0.7;
      ctx.beginPath(); ctx.moveTo(y.x, 0); ctx.lineTo(y.x, y.y);
      ctx.strokeStyle = 'rgba(220,220,200,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }

    /* ギヨウザ */
    ctx.save();
    ctx.globalAlpha = a;
    drawOneItem(y);
    ctx.restore();
  }
}

/* ════════════════ ウウウウ: 幽霊 ════════════════ */
/* ゴーストキャンバスプール: spawnGhost ごとの canvas 生成（GC・バッキングストア確保）を回避 */
const _freeGhostCanvases = [];
const _releaseGhost = g => { if (g._oc) { _freeGhostCanvases.push(g._oc); g._oc = null; } };

function initUuuu() {
  for (const g of ghosts) _releaseGhost(g);
  ghosts = [];
}

/* 幽霊ギヨウザをオフスクリーンに事前レンダリング（毎フレームのグラジェント生成を排除）
   ギヨウザ本体を青白グラデーション+半透明で描き、天使の輪と幽霊の尾を追加する */
function _makeGhostCanvas(r) {
  /* キャンバスサイズ: ギヨウザ本体 + 上の天使の輪 + 下の幽霊の尾 を収める */
  const bodyH  = r * 1.2;  // ギヨウザ縦半径
  const haloH  = r * 0.9;  // 輪の上端までの余白
  const tailH  = r * 1.0;  // 尾の長さ
  const sz     = Math.ceil((bodyH + haloH + tailH) * 2 + r * 2.4);
  /* プールから再利用（なければ新規生成）。サイズ一致時は clearRect のみで再利用 */
  const oc     = _freeGhostCanvases.pop() || document.createElement('canvas');
  const c2     = oc.getContext('2d');
  if (oc.width !== sz || oc.height !== sz) { oc.width = sz; oc.height = sz; }
  else { c2.clearRect(0, 0, sz, sz); }
  const cx     = sz / 2;
  /* ギヨウザ中心 y（天使の輪分だけ下げる） */
  const cy     = haloH + r * 0.6 + 4;

  /* ── 幽霊の尾（ギヨウザ下から伸びる波状しっぽ） ── */
  const tailTop = cy + bodyH * 0.55;
  const tailBot = tailTop + tailH;
  c2.beginPath();
  c2.moveTo(cx - r * 0.38, tailTop);
  /* 左右に波打つ3本の曲線で尾を形成 */
  c2.quadraticCurveTo(cx - r * 0.6,  tailTop + tailH*0.3, cx - r*0.15, tailTop + tailH*0.55);
  c2.quadraticCurveTo(cx + r * 0.15, tailTop + tailH*0.75, cx,          tailBot);
  c2.quadraticCurveTo(cx - r * 0.15, tailTop + tailH*0.75, cx + r*0.15, tailTop + tailH*0.55);
  c2.quadraticCurveTo(cx + r * 0.6,  tailTop + tailH*0.3, cx + r*0.38, tailTop);
  c2.closePath();
  const tailGrd = c2.createLinearGradient(cx, tailTop, cx, tailBot);
  tailGrd.addColorStop(0,   'rgba(160,210,255,0.55)');
  tailGrd.addColorStop(1,   'rgba(160,210,255,0.0)');
  c2.fillStyle = tailGrd; c2.fill();

  /* ── ギヨウザ本体（通常カラー + 青白オーラ） ── */
  /* オーラ: 本体楕円を青白 shadowBlur で先に描いてグロー層を作る */
  c2.save();
  c2.shadowColor = 'rgba(140,200,255,0.95)';
  c2.shadowBlur  = r * 0.7;
  c2.beginPath();
  c2.ellipse(cx, cy + r*0.08, r*0.58, r*0.48, 0, 0, Math.PI*2);
  c2.fillStyle = 'rgba(180,220,255,0.35)';
  c2.fill();
  c2.restore();

  /* 本体形状（共通関数で描画）*/
  const bodyGrd = c2.createRadialGradient(cx - r*0.15, cy - r*0.3, 0, cx, cy + r*0.1, r * 1.1);
  bodyGrd.addColorStop(0,   'hsl(42,70%,82%)');
  bodyGrd.addColorStop(0.6, 'hsl(38,62%,72%)');
  bodyGrd.addColorStop(1,   'hsl(34,55%,58%)');
  _drawGyozaBody(c2, r, cx, cy, bodyGrd);

  /* ── 天使の輪（ギヨウザ上方に浮かぶ金色の楕円リング） ── */
  const haloY  = cy - r * 0.72; // 頭上に浮かせる
  const haloRx = r * 0.42;      // 横半径
  const haloRy = r * 0.13;      // 縦半径（奥行き感）
  /* 輪の後ろ半分（ギヨウザに隠れる側）を薄く */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, Math.PI, Math.PI*2);
  c2.strokeStyle = 'rgba(255,220,80,0.35)'; c2.lineWidth = r * 0.13; c2.stroke();
  /* 輪の前半分（手前側）を明るく */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, 0, Math.PI);
  const haloGrd = c2.createLinearGradient(cx - haloRx, haloY, cx + haloRx, haloY);
  haloGrd.addColorStop(0,   'rgba(255,240,120,0.9)');
  haloGrd.addColorStop(0.5, 'rgba(255,200,50,1.0)');
  haloGrd.addColorStop(1,   'rgba(255,240,120,0.9)');
  c2.strokeStyle = haloGrd; c2.lineWidth = r * 0.13; c2.stroke();
  /* 輪のグロー */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, 0, Math.PI*2);
  c2.strokeStyle = 'rgba(255,240,100,0.18)'; c2.lineWidth = r * 0.30; c2.stroke();

  return { oc, sz, cy }; // cy: キャンバス内でのギヨウザ中心y（drawImage時の基準）
}

function spawnGhost() {
  const r = 28 + Math.random()*20;
  const { oc, sz, cy: ocCy } = _makeGhostCanvas(r);
  ghosts.push({
    x:        Math.random() * W,
    y:        H + r + 20,
    vy:       -(0.8 + Math.random()*1.4),
    wobble:   Math.random() * Math.PI * 2,
    wobbleSpd:0.025 + Math.random()*0.025,
    wobbleAmp:18 + Math.random()*22,
    r, alpha: 0, alive: true,
    _oc: oc, _ocSz: sz, _ocCy: ocCy, // 事前レンダリング済みキャンバス
  });
}

function updateUuuu() {
  if (endTimer % 18 === 0 && ghosts.length < MEDIUM_EFFECT_GYOZA_N) spawnGhost();
  for (const g of ghosts) {
    g.y += g.vy;
    g.wobble += g.wobbleSpd;
    g.x += Math.sin(g.wobble) * 0.9;
    const fadeZone = 80;
    if (g.y > H - fadeZone) g.alpha = Math.min(0.80, g.alpha + 0.04);
    else if (g.y < fadeZone) g.alpha = Math.max(0, g.alpha - 0.025);
    if (g.y < -g.r * 3) g.alive = false;
  }
  swapRemove(ghosts, _predAlive, _releaseGhost); // キャンバスをプールへ返却
}

/* outroTimerを渡すと退場中のリストを描く（_drawFxOutro参照）。省略時は現トライのghosts */
function drawUuuu(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'uuuu' || endTimer < 50)) return;
  ctx.save();
  for (const g of (list ?? ghosts)) {
    if (g.alpha <= 0.01) continue;
    ctx.globalAlpha = g.alpha;
    if (g._oc) {
      /* 事前レンダリング済みキャンバスをdrawImageで貼り付け（createRadialGradient不要） */
      ctx.drawImage(g._oc, g.x - g._ocSz / 2, g.y - g._ocCy);
    } else {
      /* フォールバック: 旧パス */
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.beginPath();
      ctx.arc(0, 0, g.r, Math.PI, 0);
      ctx.lineTo(g.r, g.r * 0.6);
      const segs = 5;
      for (let i = segs-1; i >= 0; i--) {
        const x1 = g.r - (2*g.r/segs)*(segs-i-0.5);
        const x2 = g.r - (2*g.r/segs)*(segs-i);
        ctx.quadraticCurveTo(x1, g.r*0.6 + (i%2===0?1:-1)*g.r*0.32, x2, g.r*0.6);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(180,215,255,0.8)'; ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ザザザザ: 雨 ════════════════ */
function initZazazaza() { for (const o of rainDrops) o._dead = true; rainDrops = []; }

function updateZazazaza() {
  const rate = endTimer < 80 ? 4 : endTimer < 180 ? 10 : 20;
  for (let i = 0; i < rate; i++) {
    const d = _poolAlloc(_rainPool);
    d._dead = false; d.ripple = false; d.splashed = false;
    d.x = Math.random() * (W + 80) - 40; d.y = -20;
    d.vx = -1.5 + Math.random()*0.5; d.vy = 9 + Math.random()*9;
    d.len = 12 + Math.random()*18; d.a = 0.35 + Math.random()*0.45;
    rainDrops.push(d);
  }

  const rLen = rainDrops.length;
  for (let ri = 0; ri < rLen; ri++) {
    const r = rainDrops[ri];
    if (r.ripple) { r.life--; continue; }
    r.x += r.vx; r.y += r.vy;
    if (r.y >= H - 16 && !r.splashed) {
      r.splashed = true;
      const rp = _poolAlloc(_rainPool);
      rp._dead = false; rp.ripple = true;
      rp.x = r.x; rp.y = H-16; rp.life = 12; rp.maxLife = 12;
      rainDrops.push(rp);
    }
  }
  swapRemove(rainDrops, _predRainDrop, _deadify);
}

function drawZazazaza() {
  if (hitType !== 'zazazaza' || endTimer < 50) return;
  const intensity = Math.min(1, (endTimer - 50) / 60);
  ctx.save();
  for (const r of rainDrops) {
    ctx.globalAlpha = (r.a ?? 0.5) * intensity;
    if (r.ripple) {
      const t = 1 - r.life / r.maxLife;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, t*14, t*5, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(140,200,255,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x + r.vx*(r.len/r.vy), r.y - r.len);
      ctx.strokeStyle = 'rgba(160,215,255,0.75)';
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ギョギョ: びっくり魚 ════════════════ */
function initGyogyo() {
  gyogyoFish = [];
  for (let i = 0; i < MEDIUM_EFFECT_GYOZA_N; i++) {
    const fromLeft = Math.random() < 0.5;
    const size = 28 + Math.random() * 28;
    /* bodyGrd: makeItem()と同様に生成時1回だけ作成（drawFish内での毎フレーム生成を排除）
       グラジェント座標はfillStyle適用時の座標系で評価されるため
       transform前に生成しても translate+rotate後の使用で正しく機能する */
    const bodyGrd = ctx.createRadialGradient(-size*0.15, -size*0.3, 0, 0, size*0.1, size*1.1);
    bodyGrd.addColorStop(0,   'hsl(42,70%,82%)');
    bodyGrd.addColorStop(0.6, 'hsl(38,62%,72%)');
    bodyGrd.addColorStop(1,   'hsl(34,55%,58%)');
    gyogyoFish.push({
      x:     fromLeft ? -70 : W + 70,
      y:     60 + Math.random() * (H - 140),
      vx:    (fromLeft ? 1 : -1) * (2.5 + Math.random() * 3.5),
      vy:    (Math.random() - 0.5) * 2.5,
      size,
      phase: Math.random() * Math.PI * 2,
      col:   ['#f0a030','#e06820','#ff8040','#ffcc44','#dd6644'][Math.floor(Math.random()*5)],
      bodyGrd,
      exclamTimer: 0,
      exclamDur:   0,
    });
  }
}

function drawFish(f, t) {
  const s = f.size;
  const angle = Math.atan2(f.vy, f.vx);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(angle);

  /* 尾ひれ（揺れる）— ギヨウザ後端に取り付け */
  const tailWag = Math.sin(t * 0.18 + f.phase) * 0.35;
  ctx.save();
  ctx.translate(-s * 0.72, s * 0.08); // ギヨウザ楕円の後端付近
  ctx.rotate(tailWag);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-s * 0.55,  s * 0.40);
  ctx.lineTo(-s * 0.55, -s * 0.40);
  ctx.closePath();
  ctx.fillStyle = f.col;
  ctx.globalAlpha = 0.85;
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,50,20,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  /* ── ギヨウザ本体（drawOneItem と同じパス構成） ── */
  /* 本体楕円（焼きギヨウザカラー） */
  ctx.beginPath();
  ctx.ellipse(0, s*0.08, s*0.58, s*0.48, 0, 0, Math.PI*2);
  ctx.fillStyle = f.bodyGrd; // initGyogyo()で事前生成済み
  ctx.globalAlpha = 0.97;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 蒸し焼き底面の焦げ色 */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, s*0.32, s*0.46, s*0.18, 0, 0, Math.PI*2);
  ctx.fillStyle = 'hsl(30,60%,52%)';
  ctx.globalAlpha = 0.45;
  ctx.fill();
  ctx.restore();

  /* 頂部の薄皮 */
  ctx.beginPath();
  ctx.ellipse(0, -s*0.12, s*0.40, s*0.14, 0, 0, Math.PI*2);
  ctx.fillStyle = 'hsl(50,55%,88%)';
  ctx.globalAlpha = 1;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  /* ひだ */
  ctx.strokeStyle = 'rgba(140,105,55,0.55)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  for (let i = -4; i <= 4; i++) {
    const bx = i * s * 0.095;
    ctx.moveTo(bx, -s*0.04);
    ctx.bezierCurveTo(bx - s*0.04, -s*0.22, bx + s*0.04, -s*0.22, bx + s*0.07, -s*0.04);
  }
  ctx.stroke();

  /* ハイライト */
  ctx.beginPath();
  ctx.ellipse(-s*0.18, -s*0.08, s*0.16, s*0.09, -0.4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fill();

  /* びっくり目（ひだの右寄りに配置） */
  const ex = s * 0.30, ey = -s * 0.04;
  ctx.beginPath();
  ctx.arc(ex, ey, s * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  /* 瞳 */
  ctx.beginPath();
  ctx.arc(ex + s * 0.05, ey, s * 0.11, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  /* ハイライト */
  ctx.beginPath();
  ctx.arc(ex + s * 0.08, ey - s * 0.07, s * 0.04, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  /* 驚き線 */
  for (let k = 0; k < 6; k++) {
    const a2 = (k / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(ex + Math.cos(a2) * s*0.27, ey + Math.sin(a2) * s*0.27);
    ctx.lineTo(ex + Math.cos(a2) * s*0.36, ey + Math.sin(a2) * s*0.36);
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* 口（O形、ひだの右端付近） */
  ctx.beginPath();
  ctx.arc(s * 0.60, s * 0.10, s * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = '#cc3300';
  ctx.fill();

  ctx.restore();
}

function updateGyogyo() {
  const t = endTimer;
  for (const f of gyogyoFish) {
    f.x += f.vx;
    f.y += f.vy + Math.sin(t * 0.09 + f.phase) * 0.6;
    f.vx *= 0.998;
    if (Math.abs(f.vx) < 1.2) f.vx = 1.2 * Math.sign(f.vx);
    const margin = f.size * 1.2;
    if (f.x < margin   && f.vx < 0) { f.vx *= -1; f.exclamTimer = 0; f.exclamDur = 25; }
    if (f.x > W-margin && f.vx > 0) { f.vx *= -1; f.exclamTimer = 0; f.exclamDur = 25; }
    if (f.y < margin   && f.vy < 0) f.vy *= -1;
    if (f.y > H-margin && f.vy > 0) f.vy *= -1;
    if (f.exclamTimer < f.exclamDur) f.exclamTimer++;
  }
}

/* outroTimerを渡すと退場中の魚だけを描く（_drawFxOutro参照）。
   時間軸に別のタイマーを使うのは、endTimerが次トライで0に戻るため。
   そのまま使うと尾ひれの揺れや「ギョギョ！」の明滅が止まってしまう。
   「ギョギョ！」テキストは当たり演出そのものなので退場中は出さない */
function drawGyogyo(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'gyogyo' || endTimer < 45)) return;
  const t = outro ? outroTimer : endTimer;
  const fadeIn = outro ? 1 : Math.min(1, (t - 45) / 40);

  ctx.save();
  ctx.globalAlpha = fadeIn;

  for (const f of (list ?? gyogyoFish)) {
    drawFish(f, t);

    /* ！エクスクラメーション（exclamTimer更新はupdateGyogyo()で実施） */
    if (f.exclamTimer < f.exclamDur) {
      const prog = f.exclamTimer / f.exclamDur;
      const alpha2 = prog < 0.5 ? prog * 2 : (1 - prog) * 2;
      ctx.save();
      ctx.globalAlpha = alpha2 * 0.9 * fadeIn;
      ctx.font = `bold ${f.size * 0.9}px sans-serif`;
      ctx.fillStyle = '#ff3300';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const angle2 = Math.atan2(f.vy, f.vx);
      const px = f.x + Math.cos(angle2 - Math.PI / 2) * f.size * 1.5;
      const py = f.y + Math.sin(angle2 - Math.PI / 2) * f.size * 1.5;
      ctx.strokeText('！', px, py);
      ctx.fillText('！', px, py);
      ctx.restore();
    }
  }

  /* 「ギョギョ！」テキストを散らす（退場中は出さない: 上のコメント参照） */
  const msgs = outro ? [] : ['ギョ！', 'ギョギョ！', 'ギョッ！', '！！！', 'ギョッ'];
  for (let k = 0; k < msgs.length; k++) {
    const beat = Math.sin(t * 0.13 + k * 1.3);
    const scale2 = 0.7 + Math.abs(beat) * 0.5;
    const alpha3 = (0.35 + Math.abs(beat) * 0.55) * fadeIn;
    const tx2 = 110 + (k * 213) % (W - 180);
    const ty2 = 70  + ((k * 97 + Math.floor(t / 80) * 50) % (H - 150));
    ctx.save();
    ctx.globalAlpha = alpha3;
    ctx.translate(tx2, ty2);
    ctx.scale(scale2, scale2);
    ctx.rotate(Math.sin(t * 0.07 + k) * 0.3);
    ctx.font = `bold 26px 'Hiragino Mincho ProN',serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 5;
    ctx.strokeText(msgs[k], 0, 0);
    ctx.fillStyle = '#ffee00';
    ctx.fillText(msgs[k], 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

/* ════════════════ 画面エフェクト ════════════════ */

/* ── ギザギザ ── */
function drawGizagizaEffect() {
  if (hitType !== 'gizagiza' || endTimer < 45) return;
  const intensity = Math.min(1, (endTimer-45)/25);
  const t = endTimer;

  /* ジグザグ線を複数層 */
  for (let l = 0; l < 7; l++) {
    const baseY = ((t*2.8 + l*H/7) % (H+60)) - 30;
    const amp   = 12 + l*4;
    const seg   = 20 + l*5;
    const alpha = (0.18 + l*0.03) * intensity;
    ctx.save();
    ctx.strokeStyle = l%2===0 ? `rgba(192,216,255,${alpha})` : `rgba(255,255,255,${alpha*0.7})`;
    ctx.lineWidth   = 1 + l*0.4;
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    let up = (l%2===0);
    for (let x = 0; x <= W; x += seg) {
      ctx.lineTo(x, baseY + (up ? -amp : amp));
      up = !up;
    }
    ctx.stroke();
    ctx.restore();
  }

  /* 鋭角フラッシュ (ランダムに現れる稲妻的ライン) */
  if (Math.random() < 0.12 * intensity) {
    const lx = Math.random()*W;
    ctx.save();
    ctx.strokeStyle = `rgba(220,240,255,${0.5*intensity})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    let cy2 = 0;
    while (cy2 < H) {
      const step = 20 + Math.random()*40;
      const dx   = (Math.random()-0.5)*60;
      ctx.lineTo(lx+dx, cy2+step);
      cy2 += step;
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ── ウザウザフラッシュ ── */
function drawUzaFlash() {
  if (hitType !== 'uzauza' || endTimer < 45) return;
  const intensity = Math.min(1, (endTimer-45)/30);
  /* イライラする点滅 */
  if (Math.floor(endTimer/4) % 3 === 0) {
    ctx.fillStyle = `rgba(255,80,0,${0.07*intensity})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ════════════════ キングギヨウザ 出現予告（M1） ════════════════
   蓄積メーター（画面外へ退場した落下ギヨウザ累計）が閾値に達すると、
   トライの区切りで出現予告演出（phase='bossOmen'）が発動する。
   演出構造（暗転→タメ台詞→収束→変身）は桃鉄キングボンビー誕生を参考にした
   オリジナル。M1では戦闘は未実装で、誕生後タップで見送って通常モードへ復帰する。 */

const _OMEN_LINES = ['……おや？', 'ギヨウザたちが……', 'ちからを あわせて……', '……くる。'];
const _OMEN_LINE_FRAMES = 80; // 台詞1行あたりの表示フレーム数（タメ）
let _omen = null;      // { step, timer, items, flash } 予告演出の状態（null=非表示）
let _omenGhost = null; // 予兆の霊 { x, y, vx, wobble, oc, sz, cy }
let _bossOC = null, _BOSS_S = 0; // キングギヨウザ本体スプライト（初回出現時に生成）

/* こんがりしっぱい（ルーレット破壊・全損には至らない敗北）後、通常モードへ
   戻る前のつなぎ演出（ユーザー要望）。誕生演出（バラバラのギヨウザが収束して
   キングギヨウザになる）を逆再生するイメージで、キングの姿がふつうのギヨウザ群へ
   弾け散り、そのあと誕生演出と同じ台詞スタイルでメッセージを出してから復帰する */
const _DEFEAT_OUTRO_LINES = ['ちからが とけて……', 'かえっていった……'];
/* 締めメッセージ（達成側・失敗側で共通の書式）のフォント。
   折り返しの計測（_wrapOutroLines）と実描画（_drawOutroMsg）で必ず同じ書式を
   使わないと、計測結果と実際の幅がずれてそのまま横はみ出しになる（実機で一度
   発生済み）。サイズだけでなくフォント文字列そのものを一本化しておく */
function _outroMsgFontSize() { return IS_PORTRAIT ? 26 : 30; }
function _outroMsgFont() { return `bold ${_outroMsgFontSize()}px 'Hiragino Mincho ProN',serif`; }
/* 締めメッセージを画面幅に収まるよう折り返す。
   実機指摘: 縦画面（W=420）で「ギヨウザは また あつまりはじめる……」が横から
   はみ出していた。文言は後から調整する前提なので、固定の行配列をそのまま
   描かず必ずここを通して、どんな文言でも収まるようにする。
   区切りは既存のエンドロールと同じく空白（半角・全角）位置。
   ctx.measureTextを使うので演出の開始時に1度だけ実行し、結果を状態に持たせる
   （毎フレーム計測しない） */
function _wrapOutroLines(lines) {
  return lines.flatMap(t => _wrapTrueEndingLine(t, _outroMsgFont(), W - 48)); // 左右24pxずつの余白
}
let _defeatOutro = null; // { step, timer, items } つなぎ演出の状態（null=非表示）
/* こんがり達成側の退場演出の状態（null=非表示、drawBossVictoryOutro参照）。
   宣言をここに置くのは_cleanupKingBattleStateが両方を後片付けするため
   （letはホイストされないので、使用箇所より後で宣言するとTDZ risk になる） */
let _victoryOutro = null; // { step, timer, items, seedItem, msgAlpha, gaugeAlpha, baseBy, baseScale }

/* 予兆: 蓄積80%超のアイドル中、まれに画面を霊が横切る */
function _spawnOmenGhost() {
  if (!_CACHE_OK && !document.createElement) return;
  const fromLeft = Math.random() < 0.5;
  const { oc, sz, cy } = _makeGhostCanvas(22 + Math.random() * 10);
  _omenGhost = {
    x: fromLeft ? -50 : W + 50,
    y: 60 + Math.random() * (H * 0.5),
    vx: (fromLeft ? 1 : -1) * (1.2 + Math.random() * 0.8),
    wobble: Math.random() * Math.PI * 2,
    oc, sz, cy,
  };
}

/* 口の形を決める比率（本体サイズsに対する比）。表情の知覚的な要はこの口の
   反転で、制御点Yが端点Yを下回れば「への字（怒り）」・上回れば「U字（笑顔）」。
   地鳴りのマイルド化もこの同じ値から導くため（_kingGentleness参照）、
   マジックナンバーで散らさず定数として一箇所に置く */
const KING_MOUTH_END_Y   = 0.26; // 口の両端のY
const KING_MOUTH_CTRL_Y0 = 0.19; // pct=0（怒り）の制御点Y
const KING_MOUTH_CTRL_Y1 = 0.33; // pct=1（満面の笑み）の制御点Y

/* キングの表情の「優しさ」0〜1。口の制御点が端点をどれだけ上回ったかで表す。
   上式より pct=0.5 でちょうど平ら（怒り→笑顔の反転点）＝0、pct=1 で 1。
   実機指摘「表情の変化と地鳴りがマッチしていない」への対応で、地鳴りの
   マイルド化（_bgmTierForCookPct）もこの値に従わせ、表情と音を同じ基準で
   動かす。口の定数から導いているので、口の形を変えれば地鳴りも自動で追従する
   （別々のしきい値を持たせるとまた食い違うため） */
function _kingGentleness(pct01) {
  const ctrl = KING_MOUTH_CTRL_Y0 + (KING_MOUTH_CTRL_Y1 - KING_MOUTH_CTRL_Y0) * pct01;
  return Math.max(0, Math.min(1, (ctrl - KING_MOUTH_END_Y) / (KING_MOUTH_CTRL_Y1 - KING_MOUTH_END_Y)));
}

/* キングギヨウザ本体を初回に1枚のOCへ焼き込み（怒り顔付き・毎フレームはdrawImageのみ） */
/* 表情（白目+黒瞳+眉+口）。呼び出し側で scale(_dpr)+translate(half,half)
   適用済みの論理座標系であること前提（_buildBossOC から分離。理由は _buildBossOC
   のコメント参照: こんがりトーンの対象から顔だけ除外するため独立レイヤーで作る）。
   pct（こんがり進行度 0〜1）で吊り眉+へ字口（怒り）から、やや下がった眉+U字口
   （穏やかな笑顔）へ徐々に変化する。pct省略時（初期表情の焼き込み用）は0扱い。
   gazeUp（0〜1）は瞳を白目の中で上へ寄せる量。こんがり達成後に空を見上げてから
   飛び去る演出（_updateBossVictoryOutro）で使う。瞳だけを動かし、白目・眉・口は
   動かさない（顔全体を傾けるのではなく「視線を上げた」に見せるため）。
   ※ この値を変えたら _renderKingBody のキャッシュ判定にも反映が必要
   （_gazeRenderedUp参照。忘れると顔が更新されない） */
function _drawKingFace(c, s, pct = 0, gazeUp = 0) {
  const ex = s*0.16, ey = s*0.06, er = s*0.055;
  /* 瞳の上寄せ量。白目の縦半径(er)からはみ出さないよう0.5erまでに留める */
  const pupilDy = -er * 0.5 * gazeUp;
  /* 眉: 元の眉ライン（眉頭=ex-1.2er,ey-1.2er 〜 眉尻=ex+1.2er,ey-2.4er）を、
     黒目とほぼ同じX座標（瞳=ex-0.25er、ユーザー指定）にあるピボットを中心に
     回転させる。ピボットYは元の眉ライン上（そのX位置での直線上の点）に置くため
     pct=0では回転量0＝元の見た目と完全一致する。pct→1でangle1（ほぼ水平・
     少し眉尻が下がる程度に緩和）まで回転し、眉頭・眉尻の両方が滑らかに動く
     （旧実装は眉頭を固定して眉尻だけ動かしていたが、ピボットを目寄りにしたことで
     線分全体が目から自然に離れ、上下移動に見えない自然な回転になる） */
  const innerX0 = ex - er*1.2, innerY0 = ey - er*1.2;
  const outerX0 = ex + er*1.2, outerY0 = ey - er*2.4;
  const pivotX = ex - er*0.25;
  const pivotT = (pivotX - innerX0) / (outerX0 - innerX0);
  const pivotY = innerY0 + pivotT * (outerY0 - innerY0);
  const angle0 = Math.atan2(outerY0 - innerY0, outerX0 - innerX0);
  const angle1 = 3 * Math.PI/180;
  const dTheta = (angle1 - angle0) * pct;
  const cosT = Math.cos(dTheta), sinT = Math.sin(dTheta);
  const rot = (px, py) => {
    const vx = px - pivotX, vy = py - pivotY;
    return [pivotX + vx*cosT - vy*sinT, pivotY + vx*sinT + vy*cosT];
  };
  const [innerX, innerY] = rot(innerX0, innerY0);
  const [outerX, outerY] = rot(outerX0, outerY0);
  for (const sx of [-1, 1]) {
    c.beginPath(); c.ellipse(sx*ex, ey, er*1.15, er, 0, 0, Math.PI*2);
    c.fillStyle = '#fff'; c.fill();
    c.strokeStyle = 'hsl(30,45%,25%)'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.arc(sx*ex - sx*er*0.25, ey + er*0.15 + pupilDy, er*0.45, 0, Math.PI*2);
    c.fillStyle = '#1a1a1a'; c.fill();
    c.beginPath();
    c.moveTo(sx*outerX, outerY);
    c.lineTo(sx*innerX, innerY);
    c.strokeStyle = 'hsl(30,50%,30%)'; c.lineWidth = s*0.02; c.lineCap = 'round'; c.stroke();
  }
  /* 口: 制御点Yが端点Y(KING_MOUTH_END_Y)を下回れば「への字」(不満げ)、
     上回れば「U字」(笑顔)。pct=0で0.19s(への字)→pct=1で0.33s(端点を0.07s
     上回るU字＝への字と対称の笑顔)。ちょうどpct=0.5で平ら＝怒りと笑顔の反転点 */
  const mouthCtrlY = s * (KING_MOUTH_CTRL_Y0
    + (KING_MOUTH_CTRL_Y1 - KING_MOUTH_CTRL_Y0) * pct);
  c.beginPath();
  c.moveTo(-s*0.09, s*KING_MOUTH_END_Y);
  c.quadraticCurveTo(0, mouthCtrlY, s*0.09, s*KING_MOUTH_END_Y);
  c.strokeStyle = 'hsl(30,45%,25%)'; c.lineWidth = s*0.018; c.lineCap = 'round'; c.stroke();
}

function _buildBossOC() {
  if (_bossOC || !_CACHE_OK) return;
  const s = _BOSS_S = IS_PORTRAIT ? 300 : 380;
  const half = Math.ceil(s * 0.75);
  const REF = 42, kk = s / REF;
  const mkOC = () => _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  /* 本体レイヤー（顔なし）: こんがりトーン合成はこのレイヤーにのみ適用する
     （目鼻口眉はトーンの影響を受けさせず、白目の白さで焦げ色とのコントラストを
     出したいというユーザー要望に基づく。_renderKingBody 参照）。
     本体は通常サイズ(42)で組んで scale 変換で拡大する。
     _drawGyozaBody の線幅は小サイズ用の絶対値のため、直接 s=300 で描くと
     ひだ・輪郭が細すぎて「白い卵」に見える（scale なら線幅も比例して太る） */
  const bodyOC = mkOC();
  const bc = bodyOC.getContext('2d');
  bc.scale(_dpr, _dpr);
  bc.translate(half, half);
  const grd = bc.createRadialGradient(-REF*0.18, -REF*0.12, 0, 0, REF*0.08, REF*0.62);
  grd.addColorStop(0, 'hsl(46,50%,80%)');
  grd.addColorStop(0.6, 'hsl(40,52%,64%)');
  grd.addColorStop(1, 'hsl(35,45%,48%)');
  bc.save();
  bc.scale(kk, kk);
  _drawGyozaBody(bc, REF, 0, 0, grd);
  bc.restore();
  /* 顔レイヤー（透明地に目鼻口眉のみ）: トーン合成の後に毎回このレイヤーだけ
     上描きし、常に元の色を保証する */
  const faceOC = mkOC();
  const fc = faceOC.getContext('2d');
  fc.scale(_dpr, _dpr);
  fc.translate(half, half);
  _drawKingFace(fc, s);
  /* 通常表示（予告演出など）用に body+face を1枚に合成したもの（従来どおり） */
  const oc = mkOC();
  const c = oc.getContext('2d');
  c.drawImage(bodyOC, 0, 0);
  c.drawImage(faceOC, 0, 0);
  /* 合成用のliveOCもここで確保しておく。以前は_initBossBattle（戦闘開始）で
     確保しており、1140x1140＝約130万画素の確保が、的が回り始めるフレームに
     ぶつかって回転の速度ムラになっていた（実機指摘）。予兆は演出だけの区間なので、
     ここで確保しておけば戦闘開始時の確保は0になる。戦闘をまたいで使い回す */
  const liveOC = _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  _bossOC = { oc, bodyOC, faceOC, half, liveOC };
}

/* 「こんがり」実績以外の全実績を達成済みか（キングギヨウザモード出現条件の一部。
   ユーザー要望: king値の蓄積だけでなく、他の実績を全て達成していることも
   条件に足す。これにより「こんがり」は必然的に最後に解除される実績になる） */
function _allAchExceptKongariDone() {
  return ACHIEVEMENTS.every(a => a.id === KONGARI_ACH_ID || unlockedAch[a.id]);
}

/* トライの区切りで呼ぶ。発動したら true（呼び出し側はリセット処理を中断する） */
function _maybeStartBossOmen() {
  if (kingGyozaMeter < KING_GYOZA_THRESHOLD) return false;
  if (!_allAchExceptKongariDone()) return false;
  if (isFever || feverPending || isGameOver) return false;
  _startBossOmen();
  return true;
}

function _startBossOmen() {
  pendingShoot = false;
  /* 事前構築の作り置きはプールへ返す（タイマー駆動をやめたので打ち切り処理は不要） */
  _releaseWheelOCs(_pendingWheels); _pendingWheels = null;
  if (_omenGhost) { _freeGhostCanvases.push(_omenGhost.oc); _omenGhost = null; }
  for (const g of items) g._dead = true; items = [];
  /* トライ横断で見せている表示物（ポップアップ・フィーバーバナー・JUST!ラベル）は
     phaseを見ずに描かれるため、暗転下に透けたりキング画面に重なったりする。
     寿命の分類は_clearCrossTrialOverlaysのコメント参照 */
  _clearCrossTrialOverlays();
  /* 直前の通常モードのエフェクト状態（ギヨギヨ等のhitType別演出、particles等）を
     init()と同じ後始末で完全にクリアする（_clearTrialFxState参照。実機指摘で発覚:
     ここが手薄だったため、当たり演出の途中でキングギヨウザが発動すると
     その演出がキングギヨウザ画面の下に透けて残っていた） */
  _clearTrialFxState();
  /* 退場中のエフェクトも同じ理由で消す（トライを越えて生き残る仕組みなので、
     クリアし忘れるとキングギヨウザ画面の上をギヨウザが飛んでいくことになる） */
  _clearFxOutro();
  /* isSlowSpin等はトライ限定の演出だが_clearTrialFxStateの対象外だったため、
     スローハンド中にキング戦へ突入すると発動状態・ランプ終了時刻が戦闘中
     ずっと残留していた（実機報告の調査で発覚した水平展開漏れ。他のトライ
     限定演出と同じ扱いにする） */
  isSlowSpin = false;
  slowRampEndTime = 0;
  slowHandLockUntil = 0;
  _buildBossOC();
  /* 暗黒BGMが未完のまま突入しうるので、ここで待たずに焼く（_scheduleBossBgmRenders参照） */
  _scheduleBossBgmRenders(true);
  _omen = { step: 0, timer: 0, items: [], flash: 0 };
  phase = 'bossOmen';
  stopBGMTape(1600);      // 世界が止まる（テープストップ+グレースケール）
  grayRateTarget = 0.001; // 無音起動（bgmSourceなし）でもグレースケールは進める
  playSE('boss_rumble');
}

function _updateBossOmen() {
  const o = _omen;
  if (!o) { phase = 'idle'; return; }
  o.timer++;
  if (o.flash > 0) o.flash -= 0.05;
  if (o.step === 0) {
    /* 暗転 */
    if (o.timer > 50) { o.step = 1; o.timer = 0; o.flash = 0.25; playSE('boss_rumble'); }
  } else if (o.step >= 1 && o.step <= 4) {
    /* 台詞1〜4を1行ずつ */
    if (o.timer > _OMEN_LINE_FRAMES) {
      o.step++; o.timer = 0;
      if (o.step <= 4) { o.flash = 0.25; playSE('boss_rumble'); }
