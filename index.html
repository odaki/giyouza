    alive: _predFxYoyo, release: _deadify, draw: drawYoyoyoyo,
    onStart: y => { y.outroV = _FX_OUTRO_YOYO_SPD0; }, // 糸に引き上げられる形で上へ抜けていく
    /* ヨヨヨヨ: 上向きに加速し続ける（上下運動で戻ってきた延長で飛んでいく見え方） */
    step: (y, rush) => {
      y.outroV -= _FX_OUTRO_YOYO_ACCEL * rush;
      y.y      += y.outroV;
      y.rot    += y.spinSpd;
    },
  },
  {
    key: 'ghosts', src: () => ghosts, clear: () => { ghosts = []; },
    alive: _predFxGhost, draw: drawUuuu,
    /* _releaseGhostはこの表より後方でconst宣言されるため、直接参照するとTDZで落ちる
       （テーブルはモジュール評価時に作られる）。呼び出し時に解決させる */
    release: g => _releaseGhost(g),
    /* ウウウウ: もともと上昇しているので、その速度をさらに上げる（vyは負） */
    step: (g, rush) => {
      g.vy -= _FX_OUTRO_GHOST_ACCEL * rush;
      g.y  += g.vy;
      g.wobble += g.wobbleSpd;
      g.x  += Math.sin(g.wobble) * 0.9;
      /* 濃度の増減はupdateUuuuと同じ規則（上端付近で消える） */
      const fadeZone = 80;
      if (g.y > H - fadeZone)   g.alpha = Math.min(0.80, g.alpha + 0.04);
      else if (g.y < fadeZone)  g.alpha = Math.max(0, g.alpha - 0.025);
    },
  },
  {
    key: 'fish', src: () => gyogyoFish, clear: () => { gyogyoFish = []; },
    alive: _predFxFish, release: null, draw: drawGyogyo, // 魚はプール管理外なので返却不要
    /* ギョギョ: updateGyogyoの壁反射を外し、泳いでいる向きへ加速して画面外へ */
    step: (f, rush) => {
      f.vx += Math.sign(f.vx) * _FX_OUTRO_FISH_ACCEL * rush;
      f.x  += f.vx;
      f.y  += f.vy;
    },
  },
];

/* トライ切り替えの直前に呼ぶ。生きているエフェクトを退場モードへ移す */
function _startFxOutro() {
  for (const kind of _FX_OUTRO_KINDS) {
    const list = _fxOutro[kind.key];
    for (const item of kind.src()) {
      if (kind.onStart) kind.onStart(item);
      list.push(item);
    }
    kind.clear();
  }
  _fxOutro.rush = false; // 加速指定は「次のトライで当たりが出たら」なので毎回リセット
}

/* 退場中のエフェクトを進める。phaseを問わず毎フレーム呼ぶ（update()冒頭の
   常時更新セクション。done以外でも動き続ける必要があるため） */
function _updateFxOutro() {
  const o = _fxOutro;
  let any = false;
  for (const kind of _FX_OUTRO_KINDS) if (o[kind.key].length) { any = true; break; }
  if (!any) { o.timer = 0; return; }
  o.timer++;
  const rush = o.rush ? _FX_OUTRO_RUSH_MULT : 1;
  for (const kind of _FX_OUTRO_KINDS) {
    const list = o[kind.key];
    if (!list.length) continue;
    for (const item of list) kind.step(item, rush);
    swapRemove(list, kind.alive, kind.release);
  }
}

/* 退場中のエフェクトを描く。通常の演出と同じレイヤーに重ねる */
function _drawFxOutro() {
  const o = _fxOutro;
  for (const kind of _FX_OUTRO_KINDS) {
    const list = o[kind.key];
    if (list.length) kind.draw(list, o.timer);
  }
}

/* キングギヨウザ突入時など、退場アニメごと消し去りたい場合に呼ぶ */
function _clearFxOutro() {
  const o = _fxOutro;
  for (const kind of _FX_OUTRO_KINDS) {
    const list = o[kind.key];
    if (kind.release) for (const item of list) kind.release(item);
    list.length = 0;
  }
  o.rush = false; o.timer = 0;
}

/* ── 表示状態の寿命は3種類ある。新しい表示物を足すときは必ずどれかに割り当てる ──
   1. トライ限定    : 毎トライの init() で消える。→ _clearTrialFxState()
   2. トライ横断    : 次のトライへ持ち越して見せる（ポップアップ・バナー・JUST!ラベル）。
                      自然減衰に任せるが、キングギヨウザ突入だけは消す。→ _clearCrossTrialOverlays()
   3. 永続          : コイン・実績・統計。トライやフェーズでは消さない。
   この区別を関数名として持たせておかないと、追加のたびに「_clearTrialFxStateに
   入れてよいか」を考え直すことになる（実際、フィーバー終了バナーとJUST!ラベルで
   2回考え直した。どちらも2に属し、1に入れると次トライへ持ち越す前に消えてしまう） */
function _clearCrossTrialOverlays() {
  missPopups = []; payoutPopups = [];
  feverEndBannerTimer = 0; feverEndBannerReason = null; feverStartBannerTimer = 0;
  syncJustTimer = 0; syncJustLabel = '';
}

/* トライ終了時のエフェクト系状態を一括で後始末する。
   通常のトライ切り替え(init)とキングギヨウザ突入(_startBossOmen)の両方から
   同じ後始末を呼ぶこと。draw()内のエフェクト描画（_activeEffect.draw()、
   particles、drawUzaFlash等）はいずれもphaseを問わず常時実行される設計
   （トライ横断のフェードアウトのため意図的）なので、状態を消さない限り
   キングギヨウザ画面の下に前の演出が透けて残る。
   片方だけで後始末すると、hitType別の演出（ギョギョの魚など）が消し漏れる */
function _clearTrialFxState() {
  particles = _releaseAll(particles);
  hitType       = 'none';
  _activeEffect = null;
  endTimer   = 0;
  isReach       = false;
  reachTimer    = 0;
  isReachJackpot = false;
  reachFlash    = 0;
  feverEndedReason = null; // フィーバー終了メッセージをトライごとにクリア
  _jackpotAutoReset  = false;
  canRestart  = false; _continueShowDelay = 0;
  betLocked   = false;
  _betUnlockAt = performance.now() + BGM_BEAT * 1000 * BET_UNLOCK_BEATS; // 解放は2拍強あと（_betControlsEnabled参照）
  isMissResult = false;
  worms      = _releaseAll(worms);
  uzaTexts   = _releaseAll(uzaTexts);
  gigiSparks = _releaseAll(gigiSparks);
  yoyos      = _releaseAll(yoyos);
  ghosts     = _releaseAll(ghosts, _releaseGhost); // キャンバスをプールへ返す
  rainDrops  = _releaseAll(rainDrops);
  gyogyoFish = []; // プール由来ではない（毎回リテラルで作る）ので返却は不要
}

function init(fromStartup, fromGameOver) {
  /* 実解像度の切り替えはここで適用する（_rsApplyPending 参照）。
     トライの区切りなら、切り替えに伴う1フレームぶんの間が体感に出ない */
  _rsApplyPending();
  if (fromStartup) {
    /* スタート時: initGame() は START ボタンの touchend から呼ばれる。
       iOS 内蔵スピーカーは物理2タップ必要（根本制約）。
       MUTE ボタン touchstart（tap1）で AudioContext 生成 + スピーカールート確立済み。
       START touchend（tap2）到達時点では AudioContext は running のため
       _resumeAudioCtx の Promise は即解決し、ジングルが確実に再生される。 */
    applyMuteGain();
    _resumeAudioCtx(() => { playStartJingle(() => startBGM()); });
  } else {
    /* リプレイ: BGM が止まっていれば再開（鳴っていれば継続）。
       ジングル再生中は開始しない（jingleのonEndコールバックがstartBGMを呼ぶ）。

       **fromGameOver（=_restartToTapestart経由の復帰）では開始しない。**
       そちらはBGMをテープ加速（startBGMTape）で入れるのが演出の本体で、ここで
       startBGM()を呼ぶと即時フルテンポで鳴り出してテープ加速が丸ごと飛ぶ
       （的も回転係数1で全速スピンになる）。
       条件（!bgmSource 等）ではなく引数で明示的に抑制する: こんがり達成の復帰は
       NO_BGM_SOURCE_PHASES でソースを破棄済み、失敗の復帰は stopBGMTape がソースを
       極低速で生かしたまま保持、と経路ごとに状態が違うため、状態を見る書き方では
       片方だけ通ってしまう */
    if (audioCtx && !bgmSource && !jingleScheduler && !fromGameOver) startBGM();
  }
  /* feverPending を isSlowSpin より先に処理（isFever=true になることでスローハンド抽選を正しく抑制） */
  if (feverPending) {
    isFever = true; feverTriesLeft = 10; feverPending = false;
    syncChain = 0;
    if (bet > 10) { bet = 10; lsSave(); }
    feverStartBannerTimer = FEVER_BANNER_FRAMES;
    unlockAch('first_fever');
  }
  const prevSlowSpin = isSlowSpin;
  /* 基本0.2%、高シンクロ時は最大2%まで上昇（syncRate=1.0時）
     バッファが16回分埋まるまでは syncRate が不安定なためデフォルト確率を使用 */
  const slowProb = (_syncHistCount >= SYNC_HIST_LEN && syncRate >= 0.5)
    ? (0.01 + syncRate * 0.01) : 0.002;
  if (_slowSpinPending !== null) {
    isSlowSpin = !isFever && _slowSpinPending; // チートパネルのSLOWによる次トライ強制
    _slowSpinPending = null;
  } else {
    isSlowSpin = !isFever && Math.random() < slowProb;
  }
  /* 旧ホイールのOCをプールへ返却してGCを防ぐ */
  _releaseWheelOCs(wheels);
  /* 事前構築済みホイールを再利用（GCスパイク回避）。
     フィーバー発動時・未構築時は通常通り同期生成にフォールバック。 */
  /* 事前構築の作りかけを使えるだけ使い、足りないぶんだけここで作る。
     フィーバー時は文字の偏りが変わるので作り置きは使わずプールへ返す */
  const _ready = (_pendingWheels && !isFever && !feverPending) ? _pendingWheels : null;
  if (!_ready) _releaseWheelOCs(_pendingWheels);
  _pendingWheels = null;
  wheels = WXS.map((x, i) => {
    if (_ready && _ready[i]) return _ready[i];
    /* 同期生成ぶんも計測に含める（「間に合わずここで4個作った」ときのコストが
       ?perfから見えるように） */
    const _t0 = PERF_ON ? performance.now() : 0;
    const w = createWheel(x, WYS[i], isFever ? TARGET[i] : null);
    if (PERF_ON) _perfMark('pre', _t0);
    return w;
  });
  /* isSlowSpin はここで初めて確定するため speed のみ更新 */
  for (const w of wheels) {
    w.speed = (Math.random() * 0.08 + 0.18) * (isSlowSpin ? _slowHandRate(bet) : 1);
  }
  /* 次トライぶんの収集を開始する。実際に作るのは矢が着弾するたび1個ずつで、4射する間に
     4個そろう（_preBuildStepIfDue参照）。間に合わない場合は次のinit()が同期生成するので、
     足りなくても壊れない */
  _pendingWheels = [];
  _preBuiltForShot = -1;
  curIdx     = 0;
  phase      = 'idle';
  arrowProgress = 0;
  if (IS_PORTRAIT) {
    arrowSX = -40;  arrowSY = WYS[0]; arrowTX = WXS[0] + WR + 5; arrowTY = WYS[0];
  } else {
    arrowSX = W/2;  arrowSY = H - 80; arrowTX = WXS[0]; arrowTY = WYS[0] - WR - 5;
  }
  _lastInitAt = performance.now(); // ?perfのスパイク記録で「トライ開始から何ms後か」を出すため
  /* 中当たりエフェクトは消さずに退場モードへ渡す（_startFxOutro参照）。
     _clearTrialFxStateより先に呼ぶこと: あちらは worms/yoyos/ghosts/gyogyoFish を
     プールへ返して空にするため、順序が逆だと退場させる中身が残らない */
  _startFxOutro();
  _clearTrialFxState();
  shootGuardUntil = performance.now() + 100; // 約100ms間 射撃ブロック（wall-clock基準）
  /* done フェーズ中に経過したビートをミスとして数えないようリセット */
  _autoDecayBeatIdx = BGM_BEAT > 0 ? Math.floor(_bgmAccumAudioTime / (BGM_BEAT * AUTO_DECAY_BEATS)) : -1;
  /* missPopups / payoutPopups はトライをまたいで自然フェードアウトするため init でクリアしない */
  /* スローイベント: 通常トライ切り替え時にBGMテンポをなめらかに変化させる
     ゲームオーバーリカバリー時は tapestart→idle 移行時に処理するため除外 */
  if (!fromStartup && !fromGameOver && bgmSource) {
    if (isSlowSpin && !prevSlowSpin) {
      rampBGMRate(_slowHandRate(bet), 1200, 'easeOut', true); // 通常→スロー: BET対応速度へ、ランプ中は射撃・BET変更ロック
      slowHandLockUntil = performance.now() + 1000; // 約1秒: バッジ・テンポ変化に気づくまで入力ロック（wall-clock基準）
      slowHandPopTimer   = 25; // バッジポップアニメーション開始
      playSE('slowHand');     // 発動SE
    } else if (!isSlowSpin && prevSlowSpin) {
      rampBGMRate(1.0, 1200, 'easeIn');  // スロー→通常: 1.2秒でテンポ復帰
    }
  }
  /* ベットが所持コインを超えていたら最大払える額に下げる */
  if (coins !== undefined) clampBet();
}

/* ════════════════ コイン・BET ════════════════ */
function clampBet() {
  /* 払えない額のベットを、払える最大の選択肢に下げる */
  while (bet > coins && BET_OPTIONS.indexOf(bet) > 0) {
    bet = BET_OPTIONS[BET_OPTIONS.indexOf(bet) - 1];
  }
  if (bet > coins) bet = BET_OPTIONS[0]; // 1ギヨウザ以上あれば必ず賭けられる
}

/* 数値整形: NumberFormat を1回だけ生成してキャッシュ。
   toLocaleString は呼ぶたびに内部で NumberFormat を生成するため遅く（実測41倍差）、
   コインカウントアニメ中は毎フレーム呼ばれるのでフレーム落ちの原因になる */
const _NUM_FMT = (typeof Intl !== 'undefined' && Intl.NumberFormat)
  ? new Intl.NumberFormat('ja-JP') : null;
function fmt(n) { return _NUM_FMT ? _NUM_FMT.format(n) : n.toLocaleString('ja-JP'); }

function changeBet(dir) {
  /* dir: +1=上げる, -1=下げる */
  if (isFever && dir > 0) return; // フィーバー中はBET引き上げ不可
  const idx  = BET_OPTIONS.indexOf(bet);
  const prev = bet;
  let next = idx + dir;
  /* 範囲クランプ */
  next = Math.max(0, Math.min(BET_OPTIONS.length - 1, next));
  /* 払えない選択肢はスキップ */
  while (next < BET_OPTIONS.length && BET_OPTIONS[next] > coins) next++;
  if (next < BET_OPTIONS.length) bet = BET_OPTIONS[next];
  if (bet !== prev) {
    playSE('bet'); lsSave();
    /* スローハンド中かつ第1矢未発射: 新BETに対応する速度へランプ（ランプ完了まで射撃・BET変更ロック） */
    if (isSlowSpin && !betLocked && bgmSource) {
      const oldRate = _slowHandRate(prev);
      const newRate = _slowHandRate(bet);
      rampBGMRate(newRate, 600, 'easeOut', true);
      /* ホイール視覚速度もBGMレートに合わせてリスケール */
      const scale = newRate / oldRate;
      for (const w of wheels) if (!w.locked) w.speed *= scale;
    }
  }
}

function calcPayout() {
  const beatMult = syncChain >= BEAT_BONUS_CHAIN ? BEAT_BONUS_MULT : 1; // BEAT BONUS: chain閾値以上で配当×BEAT_BONUS_MULT
  if (isReachJackpot) return bet * PAYOUT_RATE.reachJackpot * beatMult;
  const entry = HIT_TABLE.find(h => h.type === hitType);
  const base = entry ? bet * PAYOUT_RATE[entry.payout] : 0;
  const feverMult = feverEndedReason === 'complete' ? 2 : 1;
  return base * feverMult * beatMult;
}

/* ホイールOCのCSSピクセル半径（WR+余白・定数）。drawWheel でも参照 */
const _WHEEL_OC_R = WR + 4;

/* セグメント・文字・ハブを OffscreenCanvas に事前描画する共通ビルダー。
   文字は mid + π/2 回転させてホイール中心が文字の下方になるようにする。
   毎フレームの描画コストをなくし drawImage 1回に置き換える。
   通常ホイール（_buildWheelOC）とキング的（_buildKingReelOC）は同一の描画構造を持つ。
   共通部分をここに置き、差分はoptで注入する:
     r       : ホイール半径
     ocR     : OCの論理半径（r+余白）
     pool    : 返却済みOCの再利用プール
     segLW   : セグメント枠線幅
     charOff : 文字位置の半径比
     charLW  : 文字縁取り幅
     hubR    : 中心ハブ半径
     fontOf  : セグメント→フォント文字列（通常はcreateWheelで事前計算済みの
               s.font、キング的はspanから都度計算） */
function _buildSegWheelOC(w, opt) {
  const sz = Math.ceil(opt.ocR * 2 * _dpr);
  /* プールから再利用、なければ新規生成。サイズ不一致はwidth代入でリサイズ
     （キング的はKING_WRが縦画面初期化で確定するため、念のための保険） */
  const oc = opt.pool.pop() || _mkCache(sz, sz);
  if (oc.width !== sz || oc.height !== sz) { oc.width = sz; oc.height = sz; }
  const c = oc.getContext('2d');
  /* 再利用時に残っている transform と内容をクリア */
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, sz, sz);
  c.scale(_dpr, _dpr);
  c.translate(opt.ocR, opt.ocR); // ハブを中心に

  const r = opt.r;
  for (const s of w.segs) {
    const mid = s.start + s.span / 2;
    /* セグメントグラジェントを OffscreenCanvas 座標で再生成 */
    const grd = c.createRadialGradient(
      Math.cos(mid)*r*0.3, Math.sin(mid)*r*0.3, 0, 0, 0, r);
    grd.addColorStop(0, SEG_L[s.char]);
    grd.addColorStop(1, SEG_D[s.char]);
    /* セグメント塗り・枠 */
    c.beginPath(); c.moveTo(0,0); c.arc(0,0,r, s.start, s.start+s.span); c.closePath();
    c.fillStyle=grd; c.fill();
    c.strokeStyle='rgba(245,208,32,0.3)'; c.lineWidth=opt.segLW; c.stroke();
    /* 文字: mid + π/2 回転でハブ中心が文字下方になるよう向きを固定 */
    const tx=Math.cos(mid)*r*opt.charOff, ty=Math.sin(mid)*r*opt.charOff;
    c.save();
    c.translate(tx, ty);
    c.rotate(mid + Math.PI/2);
    c.font=opt.fontOf(s); c.textAlign='center'; c.textBaseline='middle';
    c.lineWidth=opt.charLW; c.strokeStyle='rgba(0,0,0,0.88)'; c.strokeText(s.char,0,0);
    c.fillStyle='#fffde7'; c.fillText(s.char,0,0);
    c.restore();
  }
  /* ハブ */
  const hubG = c.createRadialGradient(0,0,0,0,0,opt.hubR);
  hubG.addColorStop(0,'#fffde7'); hubG.addColorStop(1,YD);
  c.beginPath(); c.arc(0,0,opt.hubR,0,Math.PI*2); c.fillStyle=hubG; c.fill();

  w._oc = oc;
}

/* 通常ホイール用オプション（サイズ定数のみ参照のため静的に1個だけ確保） */
const _WHEEL_OC_OPT = {
  r: WR, ocR: _WHEEL_OC_R, pool: _freeWheelOCs,
  segLW: 1.5, charOff: 0.62, charLW: 4, hubR: 10,
  fontOf: s => s.font, // createWheelで事前計算済み
};

function _buildWheelOC(w) {
  if (!_CACHE_OK) return;
  _buildSegWheelOC(w, _WHEEL_OC_OPT);
}

/* セグメント塗りのグラジェント（OffscreenCanvas未対応環境のフォールバック描画用）。
   生成箇所を1つにまとめ、必要になった時点でだけ作れるようにする */
function _segFallbackGradient(char, mid) {
  const grd = ctx.createRadialGradient(
    Math.cos(mid)*WR*0.3, Math.sin(mid)*WR*0.3, 0, 0, 0, WR);
  grd.addColorStop(0, SEG_L[char]);
  grd.addColorStop(1, SEG_D[char]);
  return grd;
}

function createWheel(x, y, feverChar) {
  const chars   = [...CHARS].sort(() => Math.random() - 0.5);
  /* フィーバー中: 対象文字97%、他3文字各1%の極端な偏りを設定 */
  const weights = feverChar
    ? chars.map(c => c === feverChar ? 97 : 1)
    : chars.map(() => Math.random() * 0.65 + 0.25);
  const sum     = weights.reduce((a, b) => a + b, 0);
  let angle = 0;
  const segs = chars.map((c, i) => {
    const span = (weights[i] / sum) * Math.PI * 2;
    const mid  = angle + span / 2;
    /* gradient は OffscreenCanvas 未対応時のフォールバック描画専用。対応環境では
       _buildSegWheelOC が OC 座標で作り直すので、ここで作ると毎トライ16個
       （4的×4セグメント）の CanvasGradient をそのまま捨てることになる。
       トライの切り替わりは、稀な引っかかりが出るとしたらGCが疑わしい場所なので、
       作らずに済むものは作らない。未対応環境では描画側が必要になった時点で
       作る（_segFallbackGradient参照）。
       font は OC 描画でも使うので常に作る（fontOf: s => s.font） */
    const grd = !_CACHE_OK ? _segFallbackGradient(c, mid) : null;
    const fontSize = Math.max(12, Math.min(33, (span / (Math.PI * 2)) * 116));
    const font = `bold ${fontSize}px ${FONT_MIN}`;
    const s = { char: c, start: angle, span, gradient: grd, font };
    angle += span;
    return s;
  });
  const w = {
    x, y, segs, hubGrd: _WHEEL_HUB_GRD, // フォールバック用（通常は _buildWheelOC で描画済み）
    rot:       Math.random() * Math.PI * 2,
    speed:     (Math.random() * 0.08 + 0.18) * (isSlowSpin ? _slowHandRate(bet) : 1),
    locked:    false,
    result:    null,
    resultPop: 0,
    hasArrow:  false,
    syncScore: 0.5,
    _oc:     null, // OffscreenCanvas（事前描画済みセグメント+文字+ハブ）
    _resOC:  null, // 結果文字OC（ロック時に _buildResultOC で生成）
  };
  _buildWheelOC(w);
  return w;
}

function hitResult(w, pointer = IS_PORTRAIT ? 0 : -Math.PI / 2) { // 縦画面は右(0)、PC は上(-π/2)。第2引数省略時のみこの既定値を使う
  let local = ((pointer - w.rot) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  for (const s of w.segs) {
    if (local >= s.start && local < s.start + s.span) return s.char;
  }
  return w.segs[w.segs.length - 1].char;
}

/* こんがりミニリール: キングギヨウザ戦の砲台代わり。createWheel/_buildWheelOC/hitResult と
   同じ位置判定（wheelの回転角に対する固定ポインタ）をそのまま再利用し、通常ゲームと
   同じ「1本ずつ順番にタップして止める」操作感にする（OffscreenCanvas必須環境限定のため
   フォールバック描画は持たない：ボス戦自体が非対応環境では発生しない） */
function _createKingReel(x, y, weights) {
  /* 文字の並びはKING_CHARSの順（こ→ん→が→り）で固定する。シャッフルすると
     的ごと・再スピンごとに並びが変わって「こんがり」と読めない。角度は0から昇順に
     積むので、canvasの座標系（y下向き＝正の角度が時計回り）では時計回りに
     こ→ん→が→りと並ぶ。
     並びを固定してもゲーム性は落ちない: どの文字がポインタに来るかは的の初期回転(rot)と
     回転速度で決まるため、ランダム性は並び順ではなく回転が担う。文字ごとの当たりやすさの
     偏り（_adjustKingCharWeight）もspanで表現するので並び順とは独立に機能する */
  const chars = KING_CHARS;
  /* weights（%、KING_CHARS各文字→数値）が渡されればその配分で角度を割る
     （的ごとの命中履歴で偏らせる。_king.charWeights・_adjustKingCharWeight参照）。
     合計は理論上100だが、加減算の丸め誤差を吸収するため実際の合計で正規化する
     （createWheelの重み→角度変換と同じ考え方）。省略時は均等4等分 */
  const sum = weights ? KING_CHARS.reduce((a, c) => a + weights[c], 0) : 0;
  let angle = 0;
  const segs = chars.map(c => {
    const span = weights ? (weights[c] / sum) * Math.PI * 2 : Math.PI / 2;
    const seg = { char: c, start: angle, span };
    angle += span;
    return seg;
  });
  const w = {
    x, y, segs,
    rot:    Math.random() * Math.PI * 2,
    speed:  (Math.random() * 0.08 + 0.18) * 0.5, // 通常ホイールの半分の回転速度
    locked: false,
    result: null,
    _oc:    null,
  };
  _buildKingReelOC(w);
  return w;
}

/* ひびの位置を的の絵柄に固定するための基準となる文字。
   的の segs は再スピンのたびにシャッフルされ、開始角も w.rot も作り直されるため、
   ひびを「ワールド角 − そのときのw.rot」で保存すると次のトライで別の場所へ移動する。
   セグメント配置そのものを基準にすれば絵柄に対する相対位置が保たれるので、
   この文字のエリアの開始角を原点としてひびの角度を保存・復元する。
   どこにひびが入るかは「文字が当たったところ」 */
const KING_CRACK_ANCHOR_CHAR = 'こ';

/* 的ローカル座標系（w.rotを含まない、segs.startと同じ系）における
   基準文字エリアの開始角。segsは必ず4文字すべてを含むが、防御的に0で代替する。
   文字の並びを固定した現在（_createKingReel参照）「こ」は常に先頭＝この関数は
   常に0を返すが、「ひびは基準文字エリアを原点とする」という不変条件を明示する
   ために残している（並び順を変えたくなった時にひびの位置が壊れない） */
function _kingReelAnchorAngle(w) {
  const seg = w && w.segs && w.segs.find(s => s.char === KING_CRACK_ANCHOR_CHAR);
  return seg ? seg.start : 0;
}

/* 的のひび割れ（破壊演出）用の先細りウェッジ（扇形の破片）ポリゴンを1個生成する。
   ひびは「飛んできた文字が的に当たった場所」を起点に、的の縁から中心方向へ割れる。
   中心までは割らず、半径の1/2程度までに留める。幅は縁で広く、中心へ向かうほど狭い。
   割れる向きは当たった向きを勘案する。

   ポリゴンは**的の回転(w.rot)に追従するローカル座標系**（drawKingReelの
   ctx.rotate(w.rot)の内側）で組む。ワールド座標で固定すると、回転する的の上を
   ひびだけが滑って見える。
   引数baseAngleは呼び出し側（_kingReelShoot）で「文字が実際に当たったワールド座標上の
   角度」からその時点のw.rotを差し引いて渡された、的自身から見たローカル角度。
   的が生きている（ロック中〜再スピン後の回転中）間はこの値を使い続けるため、着弾直後は
   実際の衝突位置と一致し、以後は的の回転にそのまま追従する */
function _createKingCrackWedge(baseAngle) {
  const outerR = KING_WR;                                    // 起点＝的の縁
  const innerR = KING_WR * (0.15 + Math.random() * 0.35);    // 終点＝中心からの距離（最大でも半径の約半分）
  const segCount = 3 + Math.floor(Math.random() * 2);        // 3〜4節の折れ線（先細りの芯線）
  const spine = [];
  for (let j = 0; j <= segCount; j++) {
    const t = j / segCount;
    const r = outerR + (innerR - outerR) * t;
    const a = baseAngle + (Math.random() - 0.5) * 0.5 * t; // 中心へ向かうにつれ左右にわずかに蛇行
    spine.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  /* 芯線の左右にオフセットして先細りの帯を作る（端が広く、先端でほぼ0幅） */
  const outerW = KING_WR * 0.11;
  const left = [], right = [];
  for (let j = 0; j < spine.length; j++) {
    const t = j / (spine.length - 1);
    const hw = outerW * (1 - t) / 2; // 半幅（先端に向けて先細り）
    const prev = spine[Math.max(0, j - 1)], next = spine[Math.min(spine.length - 1, j + 1)];
    const dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len; // 進行方向に対する法線
    left.push({ x: spine[j].x + nx * hw, y: spine[j].y + ny * hw });
    right.push({ x: spine[j].x - nx * hw, y: spine[j].y - ny * hw });
  }
  return [...left, ...right.reverse()]; // 閉じたポリゴン（先端は左右がほぼ同点で自然に尖る）
}

/* キング的のOCをプールへ返却する。通常ホイールの_releaseWheelOCsと対になる。
   respinのたびに新規生成して解放しない作りにしてはいけない: 長い戦闘では数十枚の
   OffscreenCanvasがGC待ちで滞留し、iOS Safariのcanvasメモリを圧迫して戦闘後の処理落ち・
   音途切れの原因になる。OffscreenCanvasを作る場所は必ずプール運用にすること */
function _releaseKingReelOCs(reels) {
  if (!reels) return;
  for (const w of reels) {
    if (w?._oc) { _freeKingReelOCs.push(w._oc); w._oc = null; }
  }
}

/* キング的用フォント計算（spanに応じて9〜18px。通常ホイールと違い事前計算
   フィールドを持たないため都度計算する） */
function _kingReelFontOf(s) {
  const fontSize = Math.max(9, Math.min(18, (s.span/(Math.PI*2))*62));
  return `bold ${fontSize}px ${FONT_MIN}`;
}

function _buildKingReelOC(w) {
  const ocR = KING_WR + 4;
  /* optを都度組むのはKING_WRが縦画面の_initBossBattleで確定するため
     （静的constにすると初期値のKING_WRで固まってしまう）。4個/respinの
     小オブジェクト生成でcanvas描画コストに比べ無視できる */
  _buildSegWheelOC(w, {
    r: KING_WR, ocR, pool: _freeKingReelOCs,
    segLW: 1, charOff: 0.6, charLW: 2.5, hubR: KING_WR*0.16,
    fontOf: _kingReelFontOf,
  });
  w._ocR = ocR;
}

/* 的の三角ポインタ先端のワールド座標。ポインタは画面の向きによらず常に的の
   真上固定（当たり位置は hitResult 呼び出し側で常に -PI/2 を渡して揃える）。
   drawKingReelの描画と_kingFireBeamのビーム発射元の両方から参照する共通式 */
function _kingReelPointerPos(w) {
  const pointer = -Math.PI / 2;
  return { x: w.x + Math.cos(pointer) * (KING_WR + 12), y: w.y + Math.sin(pointer) * (KING_WR + 12) };
}

/* マーク済みの的の三角ポインタに帯電演出を描く。4つマークした状態で次のアクションが
   必要だと分かるようにするための表示。
   時間ベースのバケツ値を擬似乱数シードにして数十msごとにジグザグの向きを切り替え、
   静電気のような点滅を表現する（的4本ぶんの極小描画なので、パーティクル化・
   プール化の対象外） */
function _drawKingReelCharge(px, py, idx) {
  /* 帯電の勢いをバッテリー残量に連動させる（副表示）。プレイヤーの視線は的に
     釘付けなので、画面下端のセルを見に行かなくても「もう電気が無い」が手元で
     分かるようにする。満充電で最大、切れかけると弱々しくなる */
  const pw = KING_BATTERY_BEATS > 0 ? _kingBatteryLeft() / KING_BATTERY_BEATS : 1;
  const vigor = 0.35 + 0.65 * pw;
  let seed = Math.floor(performance.now() / 45) + idx * 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  /* 大きさは的の半径基準にする（縦横でKING_WRが変わるので比で持つ）。固定pxだと
     画面サイズによって見え方が変わり、小さすぎて気付かれない。
     広がりは0.39〜0.81倍。本数・線幅・グローはそのままなので、密度と輝きを保ったまま
     長さだけを抑えている */
  const R = KING_WR;
  const flick = 0.55 + rnd() * 0.45; // 明滅
  ctx.save();
  ctx.translate(px, py);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  /* 稲妻は本数を増やし（3→6）、折れも1回から3回にして荒れた放電に見せる。
     全部を1本のパスへ積んでから「太く暗いグロー → 細く明るい芯」の順で2回ストローク
     する。shadowBlurを使わずに光らせる既存のビーム描画（drawBossBattle）と同じ手法で、
     的あたりのストロークも2回に収まる */
  ctx.beginPath();
  const N = 7;
  for (let b = 0; b < N; b++) {
    const baseAng = (b / N) * Math.PI * 2 + rnd() * 0.9;
    const len = R * (0.39 + rnd() * 0.42) * vigor;
    ctx.moveTo(0, 0);
    for (let s = 1; s <= 3; s++) {
      const t = s / 3;
      /* 根元ほど大きく振れ、先端へ向かって収束させると稲妻らしくなる */
      const a = baseAng + (rnd() - 0.5) * 1.0 * (1 - t * 0.5);
      ctx.lineTo(Math.cos(a) * len * t, Math.sin(a) * len * t);
    }
  }
  /* 線幅はグロー 0.15R・芯 0.045R。細めに締めることで、長さ・本数（density）は
     そのままに、密度感を保ったまま線を締めて見せる */
  ctx.globalAlpha = 0.40 * flick * vigor;
  ctx.strokeStyle = '#ffd34d';
  ctx.lineWidth = Math.max(3.5, R * 0.15);
  ctx.stroke();
  ctx.globalAlpha = (0.72 + 0.28 * flick) * vigor;
  ctx.strokeStyle = '#fffde7';
  ctx.lineWidth = Math.max(1.2, R * 0.045);
  ctx.stroke();
  /* 根元の輝き。稲妻だけだと中心が空くので、帯びている芯を1枚置く */
  ctx.globalAlpha = 0.30 * flick * vigor;
  ctx.fillStyle = Y;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.18 * (0.85 + 0.3 * flick), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* 発射の瞬間の放電（KING_FIRE_FLASH_FRAMES 参照）。帯電のジグザグを外向きへ
   飛ばして消す＝溜めていた電気を撃ち出した、という見え方にする。
   帯電（_drawKingReelCharge）と同じ疑似乱数の作りで、こちらは経過フレームで
   長さを伸ばしながら薄くしていく */
function _drawKingReelDischarge(px, py, idx) {
  const k = _kingFireFlash / KING_FIRE_FLASH_FRAMES; // 1→0
  let seed = idx * 13 + 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  /* 帯電（_drawKingReelCharge）を的の半径基準へ拡大したので、こちらも同じ基準に
     揃える。片方だけ小さいと放電が弱く見える */
  const R = KING_WR;
  ctx.save();
  ctx.translate(px, py);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const spread = (1 - k) * R * 0.85; // 外へ広がっていく
  for (let b = 0; b < 8; b++) {
    const ang = (b / 8) * Math.PI * 2 + rnd() * 0.5;
    const r0 = R * 0.10 + spread, r1 = r0 + R * (0.18 + rnd() * 0.28);
    const mid = ang + (rnd() - 0.5) * 0.5;
    ctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
    ctx.lineTo(Math.cos(mid) * (r0 + r1) / 2, Math.sin(mid) * (r0 + r1) / 2);
    ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
  }
  /* 帯電と同じ「太く暗いグロー → 細く明るい芯」の2回ストローク */
  ctx.globalAlpha = k * 0.34;
  ctx.strokeStyle = '#ffd34d';
  ctx.lineWidth = Math.max(4, R * 0.17) * (0.6 + k * 0.4);
  ctx.stroke();
  ctx.globalAlpha = k * 0.95;
  ctx.strokeStyle = '#fffde7';
  ctx.lineWidth = Math.max(1.6, R * 0.06) * (0.5 + k * 0.5);
  ctx.stroke();
  ctx.restore();
}

/* 発射直後、まだ撃ち込まれていない的の三角マークと、その結果文字を稲妻で繋ぐ
   （KING_TETHER_* の定義部参照）。両端は必ずマーク／文字にピタリと付け、振れ幅を
   中央で最大にすることで「張られた線」に見せる。
   _drawKingReelCharge と同じく、時間バケツを疑似乱数シードにして数十msごとに
   形を切り替え、shadowBlur を使わず「太く暗いグロー → 細く明るい芯」の2回
   ストロークで光らせる（描画規約） */
function _drawKingChargeTether(x0, y0, x1, y1, idx) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 2) return;
  const nx = -dy / len, ny = dx / len; // 法線＝横揺れの方向
  let seed = Math.floor(performance.now() / 45) * 31 + idx * 7 + 1;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const flick = 0.55 + rnd() * 0.45;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  for (let s = 1; s < KING_TETHER_SEG; s++) {
    const t = s / KING_TETHER_SEG;
    const amp = Math.sin(t * Math.PI) * len * KING_TETHER_AMP;
    const o = (rnd() - 0.5) * 2 * amp;
    ctx.lineTo(x0 + dx * t + nx * o, y0 + dy * t + ny * o);
  }
  ctx.lineTo(x1, y1);
  ctx.globalAlpha = 0.26 * flick;
  ctx.strokeStyle = '#ffd34d';
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.globalAlpha = 0.5 + 0.4 * flick;
  ctx.strokeStyle = '#fffde7';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();
}

/* 撃ち込み済み・焼き込み待ちの焦げ跡の位置で、文字の「外」に走る帯電
   （KING_TETHER_* の定義部参照）。三角との接続が切れた分のエネルギーがそこに
   溜まっている、という見え方にする。座標変換は _kingFlightTargetPos および
   アクセントの発光と同じ（ボスの表示位置・呼吸・のけぞりに追従）。

   描き方は的の三角の帯電（_drawKingReelCharge）と揃える: 時間バケツを疑似乱数
   シードにして数十msごとに形を切り替え、根元ほど大きく振れて先端へ収束する
   3折れの稲妻を、shadowBlur を使わず「太く暗いグロー → 細く明るい芯」の2回
   ストロークで光らせる。うねる曲線（プラズマボール風）にはしない: 同じ画面にある
   的側の帯電と別物に見えて統一感が崩れる。違いは発生点だけ（的は中心から、
   こちらは文字の縁から外へ）。

   充電の進みは「その文字が撃ち込まれた時刻 → 5音目の予約時刻」の比で出し、
   的の帯電がバッテリー残量で勢いを変えるのと同じ vigor に掛ける＝焼き込み直前が
   いちばん長く明るい */
function _drawKingMarkCharges(breath, ofsX, ofsY) {
  if (_kingChargedMarks.length === 0) return;
  const ct = audioCtx ? audioCtx.currentTime : null;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const m of _kingChargedMarks) {
    let p = 1; // 時計が引けない場合は満充電で描く
    if (ct !== null && m.chargedAt !== null && _king.seqAccentAt !== null) {
      const span = _king.seqAccentAt - m.chargedAt;
      p = span > 0.05 ? Math.max(0, Math.min(1, (ct - m.chargedAt) / span)) : 1;
    }
    const mx = _king.dbx + ofsX + m.lx * breath, my = _king.dby + ofsY + m.ly * breath;
    /* 基準は焦げ跡の半径ではなく文字の大きさ（m.chargeR）。焦げ跡は文字の数倍の
       面積で描かれるため、そちらを基準にすると文字から離れた別物に見える */
    const R = m.chargeR;
    /* シードの作りも的側と同じ（45msバケツ）。位相だけマークごとにずらして、
       4箇所が同じ形で明滅しないようにする */
    let seed = Math.floor(performance.now() / 45) + Math.floor(m.rot * 97);
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const flick = 0.55 + rnd() * 0.45;
    const vigor = 0.55 + 0.45 * p;
    const rIn = R * 0.5; // 発生点＝グリフの縁。ここから外へ伸ばす＝「文字の外」
    ctx.beginPath();
    for (let b = 0; b < KING_CHARGE_BOLTS; b++) {
      const baseAng = (b / KING_CHARGE_BOLTS) * Math.PI * 2 + rnd() * 0.9;
      const len = R * (0.45 + rnd() * 0.5) * vigor;
      ctx.moveTo(mx + Math.cos(baseAng) * rIn, my + Math.sin(baseAng) * rIn);
      for (let s = 1; s <= 3; s++) {
        const u = s / 3;
        const a = baseAng + (rnd() - 0.5) * 1.0 * (1 - u * 0.5);
        const r = rIn + len * u;
        ctx.lineTo(mx + Math.cos(a) * r, my + Math.sin(a) * r);
      }
    }
    /* 線幅の比も的側と同じ（グロー 0.15R・芯 0.045R） */
    ctx.globalAlpha = 0.40 * flick * vigor;
    ctx.strokeStyle = '#ffd34d';
    ctx.lineWidth = Math.max(3, R * 0.15);
    ctx.stroke();
    ctx.globalAlpha = (0.72 + 0.28 * flick) * vigor;
    ctx.strokeStyle = '#fffde7';
    ctx.lineWidth = Math.max(1.2, R * 0.045);
    ctx.stroke();
    /* 的側にある「根元の輝き」に相当するものはここでは置かない（中心はグリフが
       占めていて空かないため。文字の上に光を乗せると読めなくなる） */
  }
  ctx.restore();
}

function drawKingReel(w, active, idx) {
  /* 被弾揺れは的まるごと（絵柄・リング・三角ポインタ・結果文字）に効かせたいので、
     関数全体を包む外側のsave/translateで掛ける（_kingReelShakeOffset参照） */
  const _shk = _kingReelShakeOffset(idx);
  ctx.save();
  if (_shk) ctx.translate(_shk.x, _shk.y);
  ctx.save();
  ctx.translate(w.x, w.y);
  ctx.rotate(w.rot);
  ctx.drawImage(w._oc, -w._ocR, -w._ocR, w._ocR*2, w._ocR*2);
  /* ひび割れ（破壊演出）: 飛んできた文字が実際に当たった場所を起点に、中心へ向けて先細りに
     割れる（_createKingCrackWedge参照）。この ctx.rotate(w.rot) の内側で描くことで、的が
     回転する（再スピン後の回転中も含む）とひびも一緒に回転する＝ひびごと的が回る。
     さらにここで基準文字エリアの開始角ぶんを回す。ポリゴンはその開始角を原点とした相対角で
     保存されているため（_addKingReelCrackAtCollision参照）、現在の的の開始角を足し戻すことで
     絵柄に対する位置が一定になる。
     的は再スピンのたびに新しいrot・新しいセグメント配置で作り直されるが、ひびは
     _king.reelCracks[idx]にスロット単位で蓄積して残るため、この足し戻しが無いとトライごとに
     ひびが絵柄の上を回転移動してしまう */
  if (_king && _king.reelCracks && idx != null) {
    const cracks = _king.reelCracks[idx];
    if (cracks && cracks.length) {
      ctx.save();
      ctx.rotate(_kingReelAnchorAngle(w));
      ctx.fillStyle = 'rgba(12,9,7,0.82)';
      for (const c of cracks) {
        const poly = c.poly;
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let j = 1; j < poly.length; j++) ctx.lineTo(poly[j].x, poly[j].y);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.restore();
  /* ビートリング: これから射つ的の外側に、拍ごとに広がって消える輪を出す。
     ボス戦は drawSyncMeter が除外され drawWheel のグロー光輪も使わないため、これが
     無いと拍の手掛かりが一つも無くなる（全タップが calcSyncScore で採点されるのに、
     バッテリーの減り方しか手掛かりが無い状態になる）。
     通常モードはプリレンダのグロースプライト（WR基準）を使うが、KING_WRは縦画面で
     動的に変わるので流用できない。shadowBlurも規約で使えないため、広がる輪＋減衰する
     線幅で表現する（ミュート時の画面枠と同じ考え方）。 */
  if (active && !w.locked) {
    const bp = getBeatPulse(); // 0-1、ビート直後=1
    if (bp > 0.01) {
      ctx.save();
      ctx.globalAlpha = bp * 0.8;
      ctx.strokeStyle = Y;
      ctx.lineWidth = 1 + bp * 3.5;
      ctx.beginPath();
      ctx.arc(w.x, w.y, KING_WR + 5 + (1 - bp) * KING_WR * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(w.x, w.y, KING_WR + 3, 0, Math.PI*2);
  ctx.strokeStyle = w.locked ? 'rgba(255,221,85,0.9)' : (active ? Y : 'rgba(255,255,255,0.4)');
  ctx.lineWidth = active ? 3 : (w.locked ? 2 : 1.5);
  ctx.stroke();
  /* ポインタ三角形は画面の向きによらず常に的の真上（当たり位置は hitResult 呼び出し側で
     常に -PI/2 を渡して揃える）。台座半径は「リング外縁（最大 KING_WR+4.5）に接するが
     重ならない」よう、先端が KING_WR+5 に来る値にしてある */
  const pointer = -Math.PI/2;
  const { x: px, y: py } = _kingReelPointerPos(w);
  ctx.save(); ctx.translate(px, py); ctx.rotate(pointer + Math.PI/2);
  ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.lineTo(0,7); ctx.closePath();
  ctx.fillStyle = Y; ctx.fill();
  ctx.restore();
  /* マーク済み（射った）が未発射の的は三角を帯電させ、次のアクション（発射）が必要なことを
     視覚的に伝える。消えるのは「その的のビームが実際にマークへ飛んだ瞬間」で、発射タイミングで
     一斉に消すのではない。再生では的ごとに撃つ時刻がずれるので、順に消えていく */
  if (w.locked && _king && !_king.reelBeamed[idx]) _drawKingReelCharge(px, py, idx);
  /* 発射タップの瞬間の放電はそのまま重ねて出す（帯電の有無とは独立） */
  if (w.locked && _kingFireFlash > 0) _drawKingReelDischarge(px, py, idx);
  /* 当たった文字は的の下に表示（ロック前は何も出さない） */
  if (w.result) {
    ctx.save();
    ctx.translate(w.x, w.y + KING_WR + 3 + KING_RESULT_GAP + KING_RESULT_FONT/2);
    ctx.font = `bold ${KING_RESULT_FONT}px ${FONT_MIN}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.88)'; ctx.strokeText(w.result, 0, 0);
    ctx.fillStyle = '#fffde7'; ctx.fillText(w.result, 0, 0);
    ctx.restore();
  }
  ctx.restore(); // 被弾揺れの外側save
}

/* ════════════════ Update ════════════════ */
/* 4本目が着弾した瞬間の確定処理（当たり型の判定・フィーバー・king値・配当・実績・ハズレ）。
   ここを読むだけで「1トライの結果がどう決まるか」が追える形にまとめてある。
   **順序には意味がある**: フィーバー終了判定→アイテム投下→配当計算→ゲームオーバー判定→
   ハズレ判定→保存、の順に依存関係があるので、並べ替えると結果が変わる。 */
/* フィーバーの終了判定。大当たり以外で即終了、大当たりならトライ数を1消費して
   0になったら完走。どちらの終わり方かは feverEndedReason に残し、配当（フル連チャンは×2）と
   バナー文言の両方がこれを見る。
   開始バナーが出ている最中に終わることがあるので、終了バナーを出すときは必ず開始側を止める */
function _resolveFeverEnd(isJackpot) {
  if (!isFever) return;
  const end = reason => {
    isFever = false; feverTriesLeft = 0;
    feverEndedReason = reason;
    feverEndBannerTimer = FEVER_BANNER_FRAMES; feverEndBannerReason = reason;
    feverStartBannerTimer = 0; // 開始バナー表示中なら即中断
  };
  if (!isJackpot) { end('miss'); return; }
  feverTriesLeft--;
  if (feverTriesLeft <= 0) { end('complete'); unlockAch('fever_complete'); }
}

/* 大当たりの演出・実績・次トライの予約。3通りある:
     フィーバー中／完走直後 … アイテム落下と配当だけ見せて自動で次へ（_jackpotAutoReset）
     リーチ経由             … 超大当たり（白フラッシュ・虹色花火・専用SE）
     通常                   … 花火とアイテム落下
   フィーバーへの移行抽選は後ろ2つだけが持つ（フィーバー中は上の分岐に入るため対象外）。
   _resolveFeverEnd より後に呼ぶこと: feverEndedReason==='complete' を見て倍増を決める */
function _resolveJackpot() {
  if (isFever || feverEndedReason === 'complete') _jackpotAutoReset = true;
  if (_jackpotAutoReset) {
    const isComplete = feverEndedReason === 'complete';
    /* フル連チャン達成時: アイテム倍増（上限300）・配当は calcPayout で×2 */
    initItems(_itemBurst(PAYOUT_RATE.jackpot) * (isComplete ? 2 : 1), true, isComplete ? 300 : 200);
    playSE('jackpot');
  } else if (isReach) {
    isReachJackpot = true;
    reachFlash = 1;
    launchReachFireworks();
    initItems(_itemBurst(PAYOUT_RATE.reachJackpot), true);
    unlockAch('reach_jackpot');
    playSE('reachJackpot');
    if (!feverPending && Math.random() < FEVER_PROB) feverPending = true;
  } else {
    launchFireworks();
    initItems(_itemBurst(PAYOUT_RATE.jackpot), true);
    playSE('jackpot');
    /* 通常大当たりからも低確率でフィーバー移行 */
    if (!feverPending && Math.random() < FEVER_PROB_NORMAL) feverPending = true;
  }
  unlockAch('first_jackpot');
  jackpotCount++;
  if (bet >= 100) unlockAch('big_bet_win');
  lsSaveStats();
}

/* king値（キングギヨウザ蓄積）を当たり種別ごとの固定値で加算する。
   基本値はHIT_TABLEのking列。大当たりだけは同じ'jackpot'型でも文脈で演出規模が変わる
   （超大当たり＝リーチ経由・フル連チャン完走）ため、ここで上書きする。
   ハズレは hitEntry が null なので0（加算なし）。
   isReachJackpot / feverEndedReason を見るので _resolveJackpot より後に呼ぶこと */
function _applyKingGain(hitEntry, isJackpot) {
  let gain = hitEntry?.king ?? 0;
  if (isJackpot) {
    if (feverEndedReason === 'complete') gain = KING_GAIN_FEVER_COMPLETE;
    else if (isReachJackpot)             gain = KING_GAIN_REACH_JACKPOT;
  }
  if (gain <= 0) return;
  kingGyozaMeter += gain;
  lsSaveStats(); // 中当たりはこの経路でしか統計を保存しないため、加算のたびに保存する
}

/* 配当の反映とゲームオーバー判定。コインが0以下になるのは配当を足した後なので、
   判定は必ず加算のあとに置く */
function _applyPayout(isJackpot) {
  const payout = calcPayout();
  if (payout > 0) {
    coins += payout;
    payoutPopups.push({ amt: payout, timer: 150, beatBonus: syncChain >= BEAT_BONUS_CHAIN });
    if (!isJackpot && !isReachJackpot) playSE('coin'); // 中当たりコイン音
  }
  if (coins <= 0) {
    isGameOver = true;
    grayRateTarget = 0.001; // オーディオ有無に関わらずグレーアウト開始
    stopBGMTape(); // テープが止まるような演出でBGMをフェードアウト
  }
}

/* 1トライの決着を確定させる。順序に依存があるので入れ替えないこと:
   当たり型の判定 → フィーバー終了判定 → 大当たり演出 → king値 → 配当 → ハズレ表示。
   フィーバー終了判定が feverEndedReason を、大当たり演出が isReachJackpot を立て、
   後段の king値と配当がそれを読む */
function _resolveTrialResult() {
  phase = 'done'; endTimer = 0;
  /* チートキー予約を当たり判定タイミングで確定（次トライのinit()が消費する） */
  if (_cheatFeverQueued) { feverPending = true; _cheatFeverQueued = false; }
  if (_cheatSlowQueued !== null) { _slowSpinPending = _cheatSlowQueued; _cheatSlowQueued = null; }
  /* HIT_TABLE を先頭から順に照合して最初にマッチした型を採用 */
  const res = wheels.map(w => w.result);
  const _hitEntry = HIT_TABLE.find(h => h.pat.every((c, i) => c === res[i]));
  hitType       = _hitEntry ? _hitEntry.type : 'none';
  _activeEffect = _hitEntry ?? null;
  const _isJackpot = hitType === 'jackpot';
  const _isMedium  = hitType !== 'none' && !_isJackpot;
  _resolveFeverEnd(_isJackpot);
  /* 残存アイテムがある場合: 当たりエフェクト発動前に地面スルーで退場させる
     フィーバー中の連続大当たりは積み重ねたいため除外 */
  if (items.length > 0 && hitType !== 'none' && !_jackpotAutoReset) flushItems();
  if (_isJackpot) _resolveJackpot();
  /* 当たり: 4本目飛行中の先打ちバッファを破棄（エフェクト後はユーザー操作で進む）
     フィーバー大当たりは自動リセット時に発射するため破棄しない */
  if ((_isJackpot || _isMedium) && !_jackpotAutoReset) pendingShoot = false;
  /* スローハンド中の当たり: BGMを通常速度に戻して当たりエフェクトを通常速度で見せる */
  if (isSlowSpin && (_isJackpot || _isMedium)) {
    rampBGMRate(1.0, 800, 'easeIn'); // 素早く通常テンポへ復帰
    isSlowSpin = false; // バッジも連動してフェードアウト
  }
  if (_isMedium) {
    playSE('medium');
    _hitEntry.onHit?.();
    checkMediumAch(_hitEntry.medId);
    unlockAch('first_medium');
  }
  _applyKingGain(_hitEntry, _isJackpot);
  /* 前トライのエフェクトがまだ退場しきっていないうちに次の当たりが出た場合は、
     退場を加速して早く画面から抜けさせる（新しい当たり演出と混ざり続けないように）。
     ハズレでは加速しない＝そのままの速度で流れていく */
  if (hitType !== 'none') _fxOutro.rush = true;
  _applyPayout(_isJackpot);
  /* ハズレ判定 */
  if (!_isJackpot && !_isMedium) {
    /* 通常モードのハズレでは効果音を鳴らさない。'miss'SE（ズコーというノコギリ波の
       下降スライド）は通常プレイで最も頻繁に鳴る位置にあり、ハズレのたびに鳴ると
       耳につく。ハズレ自体はポップアップ（missPopups）と画面演出で十分伝わる。
       ※'miss'SE自体はキングギヨウザ戦の失敗時（頻度が低く演出上の意味がある）で
         引き続き使うので、SE_TABLEのエントリは残す */
    isMissResult = true;
    missPopups.push({ amt: bet, timer: 120 }); // 配列に追加（複数同時OK）
  }
  lsSave();         // コイン状態を保存
  checkCoinsAch();  // コイン実績チェック
}

/* ── phaseをまたいで常時更新するもの ──
   ここに置いたものは、どのphase分岐が早期returnしても必ず毎tick実行される。
   関数として切り出しているのは、この不変条件をコメントではなく構造で守るため。
   過去2回、同じクラスの不具合を実機で踏んでいる:
     ・画面全体フェード（_screenFade）を後方に置いていたため、boss系phaseの
       早期returnで一度も進まず、フェードアウト後にCONTINUEが出たまま入力が
       効かなくなった
     ・花火パーティクルの寿命処理とフィーバー終了バナーのタイマーが同様に凍結し、
       キングギヨウザの画面に前のモードの表示が残り続けた
   新しく「phaseに関係なく進める必要があるもの」を足すときは、update()本体では
   なくこの関数に入れること。 */
function _updateAlways() {
  /* 画面全体フェードは関数先頭で最優先に更新する。
     boss系の各phase分岐は末尾で早期returnするため、後方の「phaseをまたいで常時更新
     すべきもの」セクションに置くと、その早期returnで一切実行されずフェードが永久に
     止まる（フェードアウト後に画面が固まり、onMidが呼ばれずphaseも切り替わらない）。
     関数の最初に置くことで、どのphase分岐が早期returnしても必ず1回だけ実行される。 */
  if (_screenFade) _updateScreenFade();
  /* BGMのハイシェルフ（こんがり度連動の音色変化）。ボス戦以外では0dBへ戻す役目も
     兼ねているため、boss系phase分岐の早期returnに巻き込まれない位置＝ここに置く
     必要がある（下記コメントと同じ理由。ボス戦を抜けた瞬間に呼ばれなくなると
     高域が持ち上がったまま通常プレイへ持ち越されてしまう） */
  _updateBgmToneShelf();
  /* ────────────────────────────────────────────────
     大ゲームスコープ: phaseをまたいで常時更新すべきもの
     （↑の_screenFadeと同じ理由でここに置く）

     **このセクションを関数の後方へ移動してはいけない。**
     bossOmen/boss/bossVictory/bossDefeat/bossDefeatOutro/tapestart/startupの各phase
     分岐はいずれも早期returnするので、後方に置くとそれらのphase中は完全に凍結する。
     ここには花火パーティクルの物理更新（swapRemoveによる寿命切れ削除を含む）や
     フィーバー終了バナーのタイマー減算が入っており、凍結すると寿命が尽きて消える
     はずのものがキングギヨウザ演出の画面に残り続ける。 */
  /* particles: 花火・命中インパクト等の共通パーティクル物理 */
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.985;
    p.r  *= 0.97; p.life--;
  }
  swapRemove(particles, _predParticle, _deadify);
  /* 中当たりエフェクトの退場: 次のトライと並行して画面外へ抜けていくので、
     phaseをまたいで常時更新する必要がある（_fxOutro参照） */
  _updateFxOutro();
  /* 画面シェイクの残量（_computeScreenShake が読む）。的ごとの揺れ（_kingReelShakeOffset）
     と同じくアニメーション進行に紐づくフレームカウンタなので、必ず update() で減らすこと。
     draw() で減らすと、draw の呼ばれ方がフレームレートと追いつき処理で変わるぶん揺れの
     長さが端末ごとにぶれる（120Hz端末では半分、追いつきが起きた時は数倍になる）。
     ボス系phaseは各分岐が早期returnするので、この常時更新セクションに置く必要がある */
  if (_kingSiftShake   > 0) _kingSiftShake--;
  if (_kingImpactShake > 0) _kingImpactShake--;
  /* localStorageの溜まり分は「矢を放った直後」に書き出す。プレイヤーは拍に乗せて
     打つので、発射直後は次のタップまで約1拍（395ms）の余裕がある＝ここで数ms
     止まっても入力は取りこぼさない。逆に固定遅延のタイマー任せにすると、
     その遅延が拍と一致したときに毎回タップの瞬間へ着地する（_LS_FLUSH_DELAY_MSの
     コメント参照）。curIdx>0＝このトライで既に射っていることの確認 */
  if (_lsPending.size > 0) {
    const safeMoment = phase === 'idle' && curIdx > 0 &&
                       performance.now() / 1000 - _arrowStartWallTime > _LS_FLUSH_SAFE_SEC;
    /* 保険が切れたぶんは、せめて発射アニメ中（shooting）だけは避けて書く */
    if (safeMoment || (_lsFlushDue && phase !== 'shooting')) _lsFlush();
  }
  /* ハズレ・獲得ポップアップ（トライ横断フェードアウト） */
  for (const p of missPopups)   { if (p.timer > 0) p.timer--; }
  for (const p of payoutPopups) { if (p.timer > 0) p.timer--; }
  swapRemove(missPopups,   _predTimer);
  swapRemove(payoutPopups, _predTimer);
  /* スローハンドバッジのラッチ更新（drawSlowHandBadge参照）。isSlowSpinが
     false→trueになった瞬間だけ武装し、grayRateCurが十分1.0に戻ったら
     武装解除する。phaseをまたいで常時更新する必要がある（早期returnの
     多い各phase分岐に置くと武装解除のタイミングを取りこぼすため） */
  if (isSlowSpin && !_prevIsSlowSpinForBadge) _slowHandBadgeArmed = true;
  _prevIsSlowSpinForBadge = isSlowSpin;
  if (_slowHandBadgeArmed && !isSlowSpin && grayRateCur > 0.995) _slowHandBadgeArmed = false;
  /* キングギヨウザ予兆（KING_OMEN_FX_*の定義部参照）。出現へ近づくほど、そのときの収束を
     予告する動きが強まる。
     蓄積と実績の条件は _kingOmenProgress が両方まとめて持つ（どちらかが足りなければ0を
     返す）ので、ここで実績を別に見ない。以前は「こんがり以外の全実績」を要求していたが、
     それだと初回は最後の実績が解除された瞬間にいきなり最終段から始まり、浅い段が一度も
     起きなかった。
     OffscreenCanvas非対応環境は戦闘自体が起きない（_initBossBattle）ので、こちらも出さない */
  if (_CACHE_OK && _omenFx.length === 0 && (phase === 'idle' || phase === 'reach') && !isFever) {
    const u = _kingOmenProgress();
    if (u > 0 && Math.random() < _kingOmenLerp(KING_OMEN_FX_RATE, u)) _spawnOmenFx();
  }
  _updateOmenFx();
  /* フィーバー堆積アイテム: doneフェーズ以外でも物理を継続（done内では既に呼ばれる） */
  if (items.length > 0 && phase !== 'done') updateItems();
  /* フィーバー開始バナータイマー（reason は常に null のためタイマーのみ管理） */
  if (feverStartBannerTimer > 0) {
    if (isGameOver) feverStartBannerTimer = 0;
    else            feverStartBannerTimer--;
  }
  /* フィーバー終了バナータイマー（reason は期限切れ・ゲームオーバー時に null へ） */
  if (feverEndBannerTimer > 0) {
    if (isGameOver) {
      feverEndBannerTimer = 0; feverEndBannerReason = null;
    } else {
      feverEndBannerTimer--;
      if (feverEndBannerTimer === 0) feverEndBannerReason = null;
    }
  }
  /* 実績バナータイマー（phaseに関係なく常時更新） */
  if (achBannerTimer > 0) {
    achBannerTimer--;
    if (achBannerTimer === 0) achBannerCurrent = null;
  } else if (achBannerQueue.length > 0) {
    achBannerCurrent = achBannerQueue.shift();
    achBannerTimer   = 200;
  }
  /* スローランプ完了: タイムスタンプをリセット
     suspended 中は currentTime が止まるため、その場合も即リセットして永久ロックを防ぐ */
  if (slowRampEndTime > 0 && audioCtx &&
      (audioCtx.state === 'suspended' || audioCtx.currentTime >= slowRampEndTime)) {
    slowRampEndTime = 0;
  }
  /* BGM音声バッファ積算位置を毎フレーム更新（getBeatPulse呼び出し有無に依存しないよう
     update先頭で行う。jackpot SE中など phase='done'でも正確に追跡できる） */
  _bgmAccumStep();
  /* 実効出力遅延を約2秒ごとに再計測（AirPods 接続・切断などの経路変更に追従） */
  if (audioCtx && ++_latencyRefreshCnt >= 120) {
    _latencyRefreshCnt = 0;
    _updateBeatDisplayAdvance();
  }
  /* ── ビート自動減衰: idle/reach 中に3拍経過するたびにスコア0.25を追加 ──
     3拍単位にすることで6拍おきに射つプレイヤーまでdecayが発生しない。
     アイドル時のペナルティ(0.25)は悪いタイミングでの射撃(0〜0.3)より軽く設定し
     「何もしない」より「ヘタな射ち」のほうが痛くなるよう差別化する。
     done/shooting/tapestart/startup フェーズは対象外（プレイヤーの責任ではない）
     shootGuardUntil 未経過の初期保護期間も除外 */
  if ((phase === 'idle' || phase === 'reach') && performance.now() >= shootGuardUntil && BGM_BEAT > 0) {
    const _curBeat = Math.floor(_bgmAccumAudioTime / (BGM_BEAT * AUTO_DECAY_BEATS));
    if (_autoDecayBeatIdx >= 0 && _curBeat > _autoDecayBeatIdx) {
      /* フレーム落ち等で複数期間分まとめて来た場合は最大4件に制限 */
      const _missed = Math.min(_curBeat - _autoDecayBeatIdx, 4);
      for (let _bi = 0; _bi < _missed; _bi++) _pushSyncScore(0.25);
    }
    _autoDecayBeatIdx = _curBeat;
  }
  if (slowHandPopTimer  > 0) slowHandPopTimer--;
  if (syncJustTimer     > 0) syncJustTimer--;
  /* syncRateDisp: VUメーター式（上昇は速く・下降はゆっくり） */
  const _syncLerpK = syncRate > syncRateDisp ? 0.25 : 0.018;
  syncRateDisp += (syncRate - syncRateDisp) * _syncLerpK;
  /* coinsDisp: coins に向けてeaseOut追従（差分×8%、上限2000/frame）
     ホイール回転が w.speed * tapeRate で動くのと同様に、常に _getBgmRateJS() を速度係数とする。
     これにより tapestart加速・スローハンド・通常速度がすべて同じ「世界の時間の流れ」で統一される。
     bgmSource.playbackRate.value はiOS Safariで自動化中に誤値を返すため _getBgmRateJS() を使用。
     audioCtxなし（MUTE無音起動）は rate=1 でフォールバック。 */
  if (coinsDisp !== coins && phase !== 'startup') {
    const _cd   = coins - coinsDisp;
    /* 決着後（ゲームオーバー／キング戦の敗北）はテープが止まってレートが0.001まで
       落ちるため、表示が実値へ追いつけずゆっくり減り続ける（没収の大部分は
       stopBGMTape の0.7秒のランプ中に消化されるが、残りが敗北シーケンスの間ずっと
       這うことになる）。
       レートに連動させるのはプレイ中のスロー演出（スローハンド等）を世界の時間の
       流れに合わせるためのものなので、決着後は下限を与えて必ず収束させる
       （下限0.5なら500枚でも約1.4秒）。プレイ中・tapestartの加速中は生のレートを
       使うので、「tapestart中はコイン表示が0で止まる」等の見え方は変わらない */
    const _rateRaw = audioCtx ? _getBgmRateJS() : 1;
    const _rate = (isGameOver || KING_DEFEAT_PHASES.has(phase))
      ? Math.max(_rateRaw, COIN_DISP_MIN_RATE) : _rateRaw;
    /* 最低ステップ3/フレーム: 指数減衰の尻尾（1コイン刻みの長期化）を打ち切る。
       BET100 の減算が約60→24フレームに短縮され、終盤に毎フレーム続いていた
       カウント文字列生成＋テキストOC再描画の負荷期間が半減する */
    const _cs   = Math.max(Math.min(Math.abs(_cd) * 0.08, 2000), 3) * _rate;
    if (_cs >= Math.abs(_cd)) { coinsDisp = coins; }
    else { coinsDisp += _cd > 0 ? _cs : -_cs; }
  }
  /* グレースケール視覚レートをlerpで追従（係数0.04≈1300ms収束、easeOut近似） */
  grayRateCur += (grayRateTarget - grayRateCur) * 0.04;
}

/* phase ごとの update。ここに載っているphaseは自前のupdateへ委譲してそのまま終わり、
   通常モードのトライ進行（ホイールの回転・矢の判定など）は走らない。
   phaseを追加したらここへ1行足すこと。if連鎖で書くと、足したときに書き忘れても
   何も起きない（通常モードの処理へ落ちる）ぶん気づきにくい。
   startup / tapestart は通常モードの状態を共有していて委譲では書けないので、
   update() 側の分岐に残してある。
   参照している関数はすべて function 宣言で巻き上げられるため、この位置で構わない */
/* phase ごとの全画面演出の描画。PHASE_UPDATERS と対で持つ:
   phaseを追加したら「update をどうするか」と「何を描くか」の両方がここに並ぶので、
   片方だけ足して気づかない状態になりにくい。
   bossShatter は的の破片だけが違って本体とゲージは戦闘中と同じなので、drawBossBattle が
   2つのphaseを受け持つ（関数側のガードも同じ2つを見ている）。
   各関数は自前でも phase を確認するので、表と関数のどちらか片方が欠けても
   誤って描かれることはない */
const PHASE_DRAWERS = {
  bossOmen:         drawBossOmen,
  boss:             drawBossBattle,
  bossShatter:      drawBossBattle,
  bossVictory:      drawBossVictory,
  bossVictoryOutro: drawBossVictoryOutro,
  trueEnding:       drawTrueEnding,
  bossDefeat:       drawBossDefeat,
  bossDefeatShrink: drawBossDefeatShrink,
  bossDefeatOutro:  drawBossDefeatOutro,
};

const PHASE_UPDATERS = {
  bossOmen:         _updateBossOmen,
  boss:             _updateBossBattle,
  bossShatter:      _updateKingReelShatter,
  bossVictory:      _updateBossVictory,
  bossVictoryOutro: _updateBossVictoryOutro,
  trueEnding:       _updateTrueEnding,
  bossDefeat:       _updateBossDefeat,
  bossDefeatShrink: _updateBossDefeatShrink,
  bossDefeatOutro:  _updateBossDefeatOutro,
};

function update() {
  _updateAlways();
  /* サウンドテスト・ドラムパッド中はゲームを進めない（音を鳴らすだけのモード）。
     ドラムパッドは叩いた光とジョグの回転だけ進める */
  if (phase === 'soundTest') return;
  if (phase === 'drumPad') { _updateDrumPad(); return; }
  if (phase === 'startup') {
    /* タイトル画面の背景はホイールではなく丸いギヨウザロゴに差し替え済みで、
       その回転角は startupTimer と w.speed から直接求める（draw側参照）。
       w.rot は誰も読まないため加算しない（ゲーム開始時に init() がホイールを
       作り直すので、ここで進めておく必要も無い） */
    startupTimer++; // draw()ではなくupdate()でカウント（draw分離後も60fps固定）
    return;
  }
  if (phase === 'tapestart') {
    /* テープ速度をそのまま回転係数に使う → 音・色・回転が完全同期
       .value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため JS 側で計算。
       ソースがまだ無い場合は、生成待ち（startBGMTapeが非同期で走る）の間だけ0で止めて待ち、
       上限を過ぎたら1で即座に回り出す（_tapestartSrcWaitUntil の定義部コメント参照） */
    const tapeRate = bgmSource ? Math.max(0, Math.min(1, _getBgmRateJS()))
      : (performance.now() < _tapestartSrcWaitUntil ? 0 : 1);
    for (const w of wheels) w.rot += w.speed * tapeRate;
    /* テープ加速完了（色が完全に戻った）ら射撃解放 */
    if (tapeRate >= 0.99) {
      phase = 'idle';
      /* ゲームオーバーリカバリー後にスローイベントなら、復帰完了後にテンポ半減 */
      if (isSlowSpin) rampBGMRate(_slowHandRate(bet), 1200, 'easeOut', true); // ゲームオーバーリカバリー後もBET対応速度へ
      /* ここは新しいトライの開始ではなくphase遷移なので、init()は呼ばず先打ちだけ消費する
         （ガード解除は_consumePendingShoot側の責任） */
      _consumePendingShoot();
    }
    return;
  }
  /* 自前のupdateを持つphaseはここで委譲して終わる（PHASE_UPDATERS参照）。
     以降は通常モードのトライ進行 */
  const _pu = PHASE_UPDATERS[phase];
  if (_pu) { _pu(); return; }
  for (const w of wheels) {
    if (!w.locked) w.rot += w.speed;
    if (w.result && w.resultPop < 1) w.resultPop = Math.min(1, w.resultPop + 0.045);
  }

  /* 次トライ用ホイールを1個進める（矢の着弾後＝次のタップまでが最も遠い時点。
     _preBuildStepIfDue参照）。phase判定は関数側で行う */
  _preBuildStepIfDue();

  if (phase === 'shooting') {
    /* フレームレート非依存: performance.now() でアニメーション進行（audioCtx suspended中も動く） */
    arrowProgress = _arrowStartWallTime > 0
      ? Math.min(1, (performance.now() / 1000 - _arrowStartWallTime) / ARROW_FLIGHT_SEC)
      : Math.min(1, arrowProgress + 0.25); // 念のためフォールバック
    if (arrowProgress >= 1) {
      spawnImpact(arrowTX, arrowTY);
      wheels[curIdx].hasArrow = true;
      /* 着弾では音を鳴らさない。矢の到着は spawnImpact の映像だけが担い、音は
         プレイヤーが打った瞬間の発射音（'shoot'）だけになる。
         着弾音を足したくなったときの指針は _SHOOT_ARPEGIO の定義部コメントを参照 */
      curIdx++;
      if (curIdx >= 4) {
        _resolveTrialResult();
      } else if (curIdx === 3) {
        /* 3本目が刺さった → リーチ判定
           ギ・ヨ・ウが揃ったらリーチ発動。
           第4ホイールは減速しながら回り続け、
           プレイヤーが自分のタイミングで矢を放つ。 */
        const r3 = [wheels[0].result, wheels[1].result, wheels[2].result];
        const reachRoll = !isFever && r3.every((r, i) => r === TARGET[i]) && Math.random() < 1/10;
        if (reachRoll) {
          phase = 'reach';
          isReach = true;
          reachTimer = 0;
          unlockAch('first_reach');
          playSE('reach'); // リーチSE（BGM一時停止 + ジャジャーン）
          /* 第4ホイールの初期スピードを記録（減衰に使う） */
          wheels[3]._reachSpeed0 = wheels[3].speed;
        } else {
          phase = 'idle';
        }
      } else {
        phase = 'idle';
      }
    }
  }

  /* ── リーチ演出アップデート ── */
  if (phase === 'reach') {
    reachTimer++;
    /* 第4ホイールをなめらかに減速させる（止まらない、プレイヤーが射る） */
    const w4 = wheels[3];
    const decayT = Math.min(1, reachTimer / REACH_DECEL_FRAMES);
    const ease   = 1 - Math.pow(1 - decayT, 2.5); // ease-out
    w4.speed = w4._reachSpeed0 * (1 - ease * (1 - REACH_MIN_SPEED_RATIO));

    /* 金色パーティクル (第4ホイール周辺) */
    if (reachTimer % 3 === 0) {
      const ang = Math.random() * Math.PI * 2;
      const rad = WR * (0.9 + Math.random() * 0.8);
      spawnParticle(
        WXS[3] + Math.cos(ang) * rad,
        WYS[3] + Math.sin(ang) * rad,
        Math.cos(ang) * (0.4 + Math.random() * 0.8),
        Math.sin(ang) * (0.4 + Math.random() * 0.8) - 0.8,
        Math.random() < 0.6 ? Y : '#fff8dc',
        35 + Math.random() * 25,
        1.2 + Math.random() * 2.2
      );
    }
  }

  if (phase === 'done') {
    endTimer++;
    /* BPM=152: 1拍≈24f / 2拍≈48f / 4拍≈95f / 8拍≈190f
       矢速4f(1/4拍) → 着弾後、BGM拍グリッドの境界点でidle解放
       ハズレ    : 最小2f後、次の1/4拍境界で解放 → 合計≈6f(1/4拍)サイクル
       通常当たり : 最小24f(1拍)後、次の1/4拍境界で解放
       大当たり系 : 最小96f(4拍)後、次の1/4拍境界で解放
       ゲームオーバー: クリック確認が必要なためcanRestart方式を維持 */
    const _isJackpot = hitType === 'jackpot';
    const _isMedium  = hitType !== 'none' && !_isJackpot;
    const minWait  = isMissResult ? 2 : (_isJackpot || _isMedium) ? 96 : 24;
    /* 4文字目の結果が完全に表示されてからリセット */
    const allShown = wheels.every(_predWheelShown);
    /* ハズレのみビートグリッド同期で自動リセット（当たりはユーザー入力待ち） */
    if (!isGameOver && isMissResult && !feverEndedReason && endTimer > minWait && allShown && onBeatGrid()) {
      if (_maybeStartBossOmen()) return;
      _beginNextTrial(); return;
    }
    /* フィーバー中大当たり: 30f後に自動リセット（アイテム落下のみ、入力待ちなし） */
    if (_jackpotAutoReset && !isGameOver && endTimer > 30) {
      if (_maybeStartBossOmen()) return;
      _beginNextTrial(); return;
    }
    /* エフェクト終了後: canRestartをセット
       ハズレ → クリック早送りも可、当たり → クリック確認必須（自動リセットなし） */
    if (!isGameOver && !_jackpotAutoReset && endTimer > minWait && allShown) {
      canRestart = true;
    }
    /* CONTINUEバッジ表示遅延カウント: draw()側だと120Hz端末で2倍速になるためここで進める */
    if (canRestart && !isGameOver) _continueShowDelay++;
    /* ゲームオーバー時のみクリック確認必須 */
    if (isGameOver && endTimer > 45) canRestart = true;
    if (reachFlash  > 0) reachFlash  = Math.max(0, reachFlash  - 0.045);

    if (isReachJackpot && endTimer % 70 === 35) launchReachFireworks();
    else if (_isJackpot && endTimer % 85 === 40) launchFireworks();
    if (items.length > 0)                    updateItems();
    if (hitType === 'gizagiza' && endTimer % 120 === 60) launchGizaFireworks();
    if (_activeEffect?.update) _activeEffect.update();
  }
}

function spawnImpact(x, y) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random()*Math.PI*2, spd = Math.random()*5+1;
    spawnParticle(x, y, Math.cos(a)*spd, Math.sin(a)*spd-1,
      [Y,'#fff',YD][i%3], 28+Math.random()*15, Math.random()*3+1);
  }
}

/* ════════════════ 勝利エフェクト ════════════════ */

/* 打ち上げ花火。bursts発の炸裂を画面上部に散らし、1発あたり rays 本の火の粉を全方位へ飛ばす。
   marginX/top/topRatio が炸裂位置の分布、spd/life/r が火の粉の初速・寿命・大きさで、
   いずれも [最小値, 乱数幅] で与える。
   共通particles配列へ積むので、物理と寿命は_updateAlwaysが面倒を見る */
function _launchFireworkBurst(o) {
  for (let b = 0; b < o.bursts; b++) {
    const bx = o.marginX + Math.random() * (W - o.marginX * 2);
    const by = o.top + Math.random() * (H * o.topRatio);
    for (let i = 0; i < o.rays; i++) {
      const a = (i / o.rays) * Math.PI * 2 + Math.random() * 0.4;
      const spd = Math.random() * o.spd[1] + o.spd[0];
      spawnParticle(bx, by, Math.cos(a) * spd, Math.sin(a) * spd,
        o.pal[Math.floor(Math.random() * o.pal.length)],
        o.life[0] + Math.random() * o.life[1], Math.random() * o.r[1] + o.r[0]);
    }
  }
}
function launchFireworks() {
  _launchFireworkBurst({
    pal: [Y,'#fff8dc','#fffacd',YD,'#a8e6cf'],
    bursts: 5, rays: 32, marginX: 100, top: 80, topRatio: 0.55,
    spd: [2, 5], life: [70, 50], r: [1.5, 4.5],
  });
}

/* リーチ大当たり専用: 虹色10発一斉打ち上げ */
function launchReachFireworks() {
  const RAINBOW = ['#ff4444','#ff9900','#ffee00','#44ee44','#44aaff','#aa44ff','#ff44aa','#ffffff'];
  for (let b = 0; b < 10; b++) {
    /* 画面全体に広く分散 */
    const bx = 60 + (b / 9) * (W - 120) + (Math.random() - 0.5) * 80;
    const by = 50 + Math.random() * (H * 0.5);
    const col = RAINBOW[b % RAINBOW.length];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2 + Math.random() * 0.3;
      const spd = Math.random() * 7 + 3;
      spawnParticle(bx, by, Math.cos(a)*spd, Math.sin(a)*spd,
        Math.random() < 0.3 ? '#ffffff' : col, 90+Math.random()*60, Math.random()*5.5+2);
    }
  }
}

/* ギザギザ用: 大当たりより控えめ（発数・本数・初速・寿命すべて小さめ、寒色系） */
function launchGizaFireworks() {
  _launchFireworkBurst({
    pal: ['#c0d8f0','#e8f4ff','#fff','#a0c8e8',YD],
    bursts: 3, rays: 22, marginX: 150, top: 100, topRatio: 0.45,
    spd: [1.5, 4], life: [45, 30], r: [1, 3],
  });
}

/* ════════════════ ウヨウヨ: うごめくアイテム ════════════════ */
function initWorms() {
  worms = _releaseAll(worms);
  for (let i = 0; i < 10; i++) setTimeout(() => spawnWorm(), i * 300);
}

function spawnWorm() {
  /* initWorms の setTimeout がトライ切替後に遅れて発火した場合のガード
     （次トライの worms 配列に描画されない worm を push しプールスロットを占有するのを防ぐ） */
  if (phase !== 'done' || hitType !== 'uyouyo') return;
  const side = Math.floor(Math.random()*4);
  let x, y, angle;
  if      (side===0){ x=Math.random()*W; y=-40;   angle= Math.PI/2; }
  else if (side===1){ x=W+40;  y=Math.random()*H; angle= Math.PI;   }
  else if (side===2){ x=Math.random()*W; y=H+40;  angle=-Math.PI/2; }
  else              { x=-40;   y=Math.random()*H; angle= 0;          }
  angle += (Math.random()-0.5)*0.8;
  const g       = makeItem(x, y, 0, 0);
  g.angle       = angle;
  g.speed       = 1.2 + Math.random()*1.5;
  g.wiggle      = Math.random()*Math.PI*2;
  g.wiggleSpd   = 0.08 + Math.random()*0.06;
  g.wiggleAmp   = 0.04 + Math.random()*0.04;
  g.alive       = true;
  worms.push(g);
}

function updateWorms() {
  for (const w of worms) {
    w.wiggle += w.wiggleSpd;
    w.angle  += Math.sin(w.wiggle) * w.wiggleAmp;
    w.x      += Math.cos(w.angle) * w.speed;
    w.y      += Math.sin(w.angle) * w.speed;
    w.rot     = w.angle;  // 進行方向に向ける
    w.rotSpd  = 0;
    if (w.x < -80 || w.x > W+80 || w.y < -80 || w.y > H+80) {
      w.alive = false;
      w._dead = true;
    }
  }
  swapRemove(worms, _predAlive);
  if (endTimer % 18 === 0 && worms.length < 22) spawnWorm();
}

/* 中当たり演出の描画は (list, outroTimer) で統一する。
   引数なし＝現トライぶんの通常描画、list付き＝退場中のリスト（_drawFxOutro参照）。
   ウヨウヨは時間軸を持たないのでoutroTimerは受け取らない */
function drawWorms(list) {
  ctx.save();
  for (const w of (list ?? worms)) {
    drawOneItem(w);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ 落下アイテム ════════════════ */

/* ── ギヨウザ外観バリアントスプライト ──
   drawOneItem は1個あたり約10パス+グラデーションのベクタ描画で、大当たり/フィーバー時
   （最大240個）の描画が idle の約20倍のコストを占める。
   起動時に皮色×具配置のバリアントを OC へ焼き込み、毎フレームは回転付き drawImage 1回に
   置換する（実測 約2.5倍高速）。
   個体差は _ITEM_VARIANT_N 種に量子化されるが落下群では知覚できない。
   OffscreenCanvas 未対応時は null → パス描画へフォールバック */
const _ITEM_VARIANT_N   = 12;
const _ITEM_SPRITE_REF  = 42; // 焼き込み基準サイズ（makeItem の size 上限）
const _ITEM_SPRITE_HALF = 32; // 影・具を含む必要半径（≈0.75×REF + 余白）
const _itemVariantSprites = (() => {
  if (!_CACHE_OK) return null;
  const arr = [];
  const s = _ITEM_SPRITE_REF;
  for (let v = 0; v < _ITEM_VARIANT_N; v++) {
    const oc = _mkCache(_ITEM_SPRITE_HALF * 2 * _dpr, _ITEM_SPRITE_HALF * 2 * _dpr);
    const c  = oc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.translate(_ITEM_SPRITE_HALF, _ITEM_SPRITE_HALF);
    _drawGyozaShadow(c, s); // 関数宣言はホイスティングされるため前方参照可
    const skin = _gyozaSkinPalette();
    _drawGyozaBody(c, s, 0, 0, _gyozaBodyGradient(c, s, skin.skinL, skin.skinD));
    c.globalAlpha = 0.82;
    const gs = {};
    for (let i = 0; i < 5; i++) {
      _gyozaGreenSpec(gs);
      c.beginPath();
      c.ellipse(gs.dx*s, gs.dy*s, gs.rx*s, gs.ry*s, gs.a, 0, Math.PI*2);
      c.fillStyle = gs.color;
      c.fill();
    }
    c.globalAlpha = 1;
    arr.push(oc);
  }
  return arr;
})();

function makeItem(x, y, vx, vy) {
  const g    = _itemAlloc();
  g._dead    = false;
  const size = 34 + Math.random() * 8;
  g.x = x; g.y = y; g.vx = vx; g.vy = vy; g.age = 0; g._flush = false;
  g.rot      = Math.random() * Math.PI * 2;
  g.rotSpd   = (Math.random() - 0.5) * 0.14;
  g._rotPhase = Math.random() * Math.PI * 2;
  g.size   = size;
  if (_itemVariantSprites) {
    /* スプライトモード: 外観は焼き込み済みバリアントを割り当て（皮・具の生成をスキップ） */
    g._spr = _itemVariantSprites[(Math.random() * _ITEM_VARIANT_N) | 0];
    return g;
  }
  g._spr   = null;
  const skin = _gyozaSkinPalette();
  g.skinL  = skin.skinL;
  g.skinD  = skin.skinD;
  /* ボディグラジェントをここで1回だけ生成してキャッシュ */
  g.bodyGrd = _gyozaBodyGradient(ctx, size, g.skinL, g.skinD);
  /* greens: 事前確保済みの配列オブジェクトを再利用してGCゼロ */
  for (let i = 0; i < 5; i++) _gyozaGreenSpec(g.greens[i]);
  return g;
}

/* 残存アイテムを地面スルーで画面下へ落下させて退場させる */
function flushItems() {
  for (const g of items) {
    g._flush = true;
    g.vy = 6 + Math.random() * 5;   // 強めの下向き初速
    g.vx += (Math.random() - 0.5) * 2; // 少し左右にばらす
  }
}

/* addOnly=true のとき既存アイテムを保持して追加（フィーバー連続大当たり用）。
   上限200を超えないようキャップする。 */
function initItems(burst = 70, addOnly = false, max = 200) {
  if (!addOnly) items = _releaseAll(items);
  /* 最初に中央からどさっとまとめて投下 */
  const FEVER_MAX = max;
  const toAdd = addOnly ? Math.min(burst, FEVER_MAX - items.length) : burst;
  for (let i = 0; i < toAdd; i++) {
    const cx   = W/2 + (Math.random()-0.5) * W*0.38;  // 中央寄り
    const y    = -40 - Math.random() * 180;            // 高さをずらして"固まり感"を出す
    const vx   = (Math.random()-0.5) * 5;
    const vy   = 1.5 + Math.random() * 4;
    items.push(makeItem(cx, y, vx, vy));
  }
}

function spawnItem() {
  /* 通常スポーン: 画面全体からランダムに */
  const x  = Math.random() * (W + 80) - 40;
  const vy = Math.random() * 1.5 + 0.5;
  const vx = (Math.random() - 0.5) * 4;
  items.push(makeItem(x, -50, vx, vy));
}

const GROUND_Y     = H - 14;   // キャンバス底面の地面ライン
/* アイテム衝突半径の上限: makeItem の size 上限(34+8=42) × 0.52
   yソート済みスイープの打ち切り判定（break）に使用 */
const RMAX_ITEM_R  = 42 * 0.52;


/* ────────────────────────────────────────────────────────────
   完全物理シミュレーション:
   ・全アイテムを常に重力・衝突の対象にする
   ・位置修正(Positional Correction) + 速度インパルスを
     複数イテレーション繰り返すことで安定した堆積を実現
   ・支えを失ったアイテムは再落下し横方向にも動く
   ──────────────────────────────────────────────────────────── */
/* 円衝突の解決1パス（yソート済みスイープ → 位置補正 → 法線インパルス → 接線摩擦）。
   落下アイテム（updateItems）とギウギウ（updateGiugiu）は同じソルバを使う。片方に写して
   持たせてはいけない: 同じ物理が2箇所にあると片方だけ直して他方が取り残され、同じ役割の
   定数が別名・別値で並存して grep での水平展開も効かなくなる。
   差分はオプションで注入する:
     restitution 反発係数（法線方向の速度保持率）
     friction2   アイテム間摩擦（接線方向の減衰）
     skipFlush   落下退場中（_flush）のアイテムを判定から外すか
     markContact 接触したアイテムに inContact を立てるか（積み上がり判定用）
   ソートは位置補正が入るたびに必要なのでこの関数の中で行う
   （ほぼ整列済みなので挿入ソートで実質O(n)）。
   n=240時は総当たりで約14万ペア/フレームになるため、yで打ち切るスイープは必須 */
function _resolveItemCollisions(restitution, friction2, skipFlush, markContact) {
  _insertionSortY(items);
  for (let i = 0; i < items.length; i++) {
    const a = items[i];
    if (skipFlush && a._flush) continue;
    const ra = a.size * 0.52;
    const yLimit = ra + RMAX_ITEM_R; // これ以上yが離れたら以降のjは全て非衝突
    for (let j = i + 1; j < items.length; j++) {
      const b  = items[j];
      const dy = b.y - a.y; // ソート済みなので dy >= 0
      if (dy >= yLimit) break; // スイープ打ち切り
      if (skipFlush && b._flush) continue;
      const rb = b.size * 0.52;
      const minD = ra + rb;
      const dx = b.x - a.x;
      if (Math.abs(dx) >= minD || dy >= minD) continue; // 安価な事前チェック
      const d2 = dx*dx + dy*dy;
      if (d2 >= minD*minD || d2 < 0.001) continue;

      const dist = Math.sqrt(d2);
      const nx = dx/dist, ny = dy/dist;

      /* 位置修正: 重なり量を均等に分配(=等質量) */
      const corr = (minD - dist) * 0.5;
      a.x -= nx * corr;  a.y -= ny * corr;
      b.x += nx * corr;  b.y += ny * corr;

      /* 速度インパルス */
      const dvx  = b.vx - a.vx, dvy = b.vy - a.vy;
      const vrel = dvx*nx + dvy*ny;   // 法線方向相対速度
      if (vrel >= 0) continue;        // 離れていれば無視

      const imp = -(1 + restitution) * vrel * 0.5;  // 等質量なので/2
      a.vx -= imp * nx;  a.vy -= imp * ny;
      b.vx += imp * nx;  b.vy += imp * ny;

      /* 接線摩擦: 横滑りを抑えて安定積み */
      const tx   = -ny, ty = nx;
      const tvel = dvx*tx + dvy*ty;
      const fric = tvel * (1 - friction2) * 0.5;
      a.vx += fric * tx;  a.vy += fric * ty;
      b.vx -= fric * tx;  b.vy -= fric * ty;

      /* 接触摩擦で回転を減衰 */
      if (markContact) { a.inContact = true; b.inContact = true; }
      a.rotSpd *= 0.85;
      b.rotSpd *= 0.85;
      if (Math.abs(a.rotSpd) < 0.003) a.rotSpd = 0;
      if (Math.abs(b.rotSpd) < 0.003) b.rotSpd = 0;
    }
  }
}

function updateItems() {
  /* 追加スポーン: リーチ大当たりのみ継続投下、通常大当たりは初期バーストのみ。
     当たり演出はユーザー入力待ちで自動終了しないため、投下自体に時間上限を
     設けて放置し続けても際限なく湧かないようにする（KING_ITEM_SPAWN_MAX_FRAMES
     宣言部のコメント参照） */
  if (isReachJackpot) {
    const spawnRate = endTimer < 60 ? 8 : endTimer < 200 ? 5 : 3;
    if (endTimer < KING_ITEM_SPAWN_MAX_FRAMES && endTimer % spawnRate === 0 && items.length < 240) spawnItem();
  }

  const GRAVITY     = 0.38;
  const RESTITUTION = 0.06;   // 反発係数(低=ほぼ非弾性)
  const G_FRICTION  = 0.80;   // 地面摩擦
  const FRICTION2   = 0.92;   // アイテム間摩擦（updateGiugiuの同名定数と役割は同じ・値だけ違う）
  const ITERS       = 5;      // 衝突解決イテレーション数

  /* ① 積分: 重力適用・位置更新 */
  for (const g of items) {
    g.age++;
    g.vy        += GRAVITY;
    g.vx        *= 0.997;        // 空気抵抗
    g.x         += g.vx;
    g.y         += g.vy;
    g.rot       += g.rotSpd;
    g.rotSpd    *= 0.978;        // 空中での微弱な空気減衰
    g.inContact  = false;        // 接触フラグをリセット(衝突解決で立てる)
  }

  /* ② 衝突解決ループ */
  for (let iter = 0; iter < ITERS; iter++) {

    /* 地面 & 左右壁 */
    for (const g of items) {
      const r = g.size * 0.52;
      if (!g._flush && g.y + r > GROUND_Y) {
        g.y = GROUND_Y - r;
        g.inContact = true;
        if (g.vy > 0) {
          g.vx *= G_FRICTION;
          g.vy  = -g.vy * RESTITUTION;
          if (Math.abs(g.vy) < 0.4) g.vy = 0;
        }
        /* 地面摩擦で回転を減衰 */
        g.rotSpd *= 0.78;
        if (Math.abs(g.rotSpd) < 0.003) g.rotSpd = 0;
        /* 着地後: 近い方の壁へ流れる
           doneフェーズ: age依存で緩やか→強め（山積み→崩落）
           それ以外(idle等): age依存でゆっくり→速やかに画面外へ */
        if (g.vy === 0) {
          const t = Math.min(1, g.age / 300);   // 0→1 (約5秒)
          /* ハズレ done は山積み演出なしのため idle と同じ速度で退場 */
          const drift = (phase === 'done' && !isMissResult)
            ? 0.005 + t * 0.025               // done(当たり): 山積み → 崩落
            : 0.01  + t * 0.12;               // idle/ハズレ: 速やかに画面外へ
          g.vx += (g.x < W / 2 ? -1 : 1) * drift;
        }
      }
    }

    _resolveItemCollisions(RESTITUTION, FRICTION2, true, true);
  }

  /* 画面外に完全に出たものをプールに返却しつつ除去 */
  swapRemove(items, _predItem, _deadify);
  /* updateの末尾でソートしておくことでdrawItems側でのslice+sortを排除 */
  _insertionSortY(items);
}

/* ギヨウザ本体形状を任意のコンテキストへ描画する共通関数。
   drawOneItem()・_makeGhostCanvas() の両方から呼ばれる。
   c2: 描画先コンテキスト / s: サイズ / ox,oy: 中心座標 / bodyGrd: 本体グラジェント
   影・具（greens）・オーラ・ハロ・尾は呼び出し側で個別に描く。
   オブジェクト生成なし（c2の参照とプリミティブのみ）→ GC 影響ゼロ。 */
/* ── ギヨウザの外観パラメータ ──────────────────────────
   アイテムは「起動時に焼き込んだスプライトを転写する」経路と「毎フレーム
   ベクタで描く」フォールバック経路の2つを持ち、同じ見た目を別々のコードで
   作っていた（片方を直してもう片方が古いまま、が起きる形）。
   両経路が同じ関数を呼ぶようにして、外観の定義を1箇所にまとめる。
   Math.randomを消費する順序は元のインライン版と同じ（皮→具、具は位置→大きさ→
   角度→色）。ここが変わると同じ乱数列から別の見た目が出るので動かさないこと。
   これらは起動時のスプライト生成（即時実行）からも呼ばれるが、関数宣言は
   ホイスティングされるため定義位置より前から参照できる */

/* 皮の焼き色（個体差用のランダムパレット） */
function _gyozaSkinPalette() {
  return {
    skinL: `hsl(${42+Math.random()*12|0},${48+Math.random()*12|0}%,${78+Math.random()*8|0}%)`,
    skinD: `hsl(${38+Math.random()*10|0},${50+Math.random()*14|0}%,${62+Math.random()*8|0}%)`,
  };
}

/* 本体の陰影グラデーション。中心を左上へずらして光の当たりを作る比率は
   _drawGyozaBodyの形（中心Y=+s*0.08、rx=s*0.58・ry=s*0.48）と対で決まっている
   ため、アイテム・スプライト・キング本体で同じ式を使う。キングだけは焼き色を
   固定色で持つのでouterまで指定する */
function _gyozaBodyGradient(c2, s, skinL, skinD, outer = 'hsl(35,45%,50%)') {
  const grd = c2.createRadialGradient(-s*0.18, -s*0.12, 0, 0, s*0.08, s*0.62);
  grd.addColorStop(0, skinL);
  grd.addColorStop(0.6, skinD);
  grd.addColorStop(1, outer);
  return grd;
}

/* 具（緑）1粒のランダムな配置・大きさ・角度・色。値はsizeに対する比率。
   結果は渡されたオブジェクトへ書き込む（アイテム側は事前確保した器を
   使い回してGCを出さない設計のため、戻り値で新しい器を作らない） */
function _gyozaGreenSpec(out) {
  out.dx = (Math.random()-0.5)*0.55;
  out.dy = (Math.random()-0.5)*0.35;
  out.rx = 0.055+Math.random()*0.04;
  out.ry = 0.035+Math.random()*0.03;
  out.a  = (Math.random()-0.5)*1.2;
  out.color = `hsl(${108+Math.random()*24|0},${60+Math.random()*20|0}%,${35+Math.random()*15|0}%)`;
  return out;
}

/* 接地影（真下に潰した楕円） */
function _drawGyozaShadow(c2, s) {
  c2.save();
  c2.translate(s*0.06, s*0.12);
  c2.scale(1, 0.55);
  c2.beginPath(); c2.arc(0, 0, s*0.58, 0, Math.PI*2);
  c2.fillStyle = 'rgba(0,0,0,0.18)'; c2.fill();
  c2.restore();
}

function _drawGyozaBody(c2, s, ox, oy, bodyGrd) {
  /* 本体楕円 */
  c2.beginPath();
  c2.ellipse(ox, oy + s*0.08, s*0.58, s*0.48, 0, 0, Math.PI*2);
  c2.fillStyle = bodyGrd;
  c2.fill();
  c2.strokeStyle = 'rgba(120,90,50,0.55)';
  c2.lineWidth = 1.2;
  c2.stroke();

  /* 蒸し焼き底面の焦げ色 */
  c2.save();
  c2.beginPath();
  c2.ellipse(ox, oy + s*0.32, s*0.46, s*0.18, 0, 0, Math.PI*2);
  c2.fillStyle = 'hsl(30,60%,52%)';
  c2.globalAlpha = 0.45; c2.fill();
  c2.restore();

  /* 頂部の薄皮 */
  c2.beginPath();
  c2.ellipse(ox, oy - s*0.12, s*0.40, s*0.14, 0, 0, Math.PI*2);
  c2.fillStyle = 'hsl(50,55%,88%)';
  c2.fill();
  c2.strokeStyle = 'rgba(120,90,50,0.4)';
  c2.lineWidth = 0.8;
  c2.stroke();

  /* ひだ（9本を1回のstrokeでGPUフラッシュ削減） */
  c2.strokeStyle = 'rgba(140,105,55,0.55)';
  c2.lineWidth = 0.9;
  c2.beginPath();
  for (let i = -4; i <= 4; i++) {
    const bx = ox + i * s * 0.095;
    c2.moveTo(bx, oy - s*0.04);
    c2.bezierCurveTo(bx - s*0.04, oy - s*0.22, bx + s*0.04, oy - s*0.22, bx + s*0.07, oy - s*0.04);
  }
  c2.stroke();

  /* ハイライト */
  c2.beginPath();
  c2.ellipse(ox - s*0.18, oy - s*0.08, s*0.16, s*0.09, -0.4, 0, Math.PI*2);
  c2.fillStyle = 'rgba(255,255,255,0.28)';
  c2.fill();
}

function drawOneItem(g) {
  const s = g.size;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.rot);

  if (g._spr) {
    /* スプライトモード: 影・本体・具を焼き込み済みのOCを基準サイズ比で1回転写 */
    const h = _ITEM_SPRITE_HALF * (s / _ITEM_SPRITE_REF);
    ctx.drawImage(g._spr, -h, -h, h * 2, h * 2);
    ctx.restore();
    return;
  }

  _drawGyozaShadow(ctx, s);

  /* 本体形状（共通） */
  _drawGyozaBody(ctx, s, 0, 0, g.bodyGrd);

  /* 具（drawOneItem固有 / greens は per-item ランダムデータ） */
  ctx.globalAlpha = 0.82;
  for (const gr of g.greens) {
    ctx.beginPath();
    ctx.ellipse(gr.dx*s, gr.dy*s, gr.rx*s, gr.ry*s, gr.a, 0, Math.PI*2);
    ctx.fillStyle = gr.color; // 生成時にキャッシュ済み
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawItems() {
  if (!items.length) return;
  /* updateItems末尾でソート済みのため slice+sort 不要 */
  for (const g of items) drawOneItem(g);
}

/* ════════════════ ウザウザ: ウザいテキスト大量発生 ════════════════ */
const UZA_WORDS = ['ウザ','うざっ','ウザい','うざい','ウザっ！','うざ…','ウザすぎ','うわウザ'];

function initUzaTexts() { uzaTexts = _releaseAll(uzaTexts); }

function updateUzaTexts() {
  /* 徐々に増える間隔: 最初は5フレームに1個、後は2フレームに1個 */
  const interval = Math.max(2, 10 - Math.floor(endTimer/40));
  if (endTimer > 40 && endTimer % interval === 0) {
    const t = _poolAlloc(_uzaPool);
    t._dead = false;
    t.x = Math.random()*W; t.y = Math.random()*H;
    t.text  = UZA_WORDS[Math.floor(Math.random()*UZA_WORDS.length)];
    t.rot   = (Math.random()-0.5)*0.9;
    t.size  = 14 + Math.random()*52;
    t.alpha = 0; t.age = 0;
    t.peak  = 0.5 + Math.random()*0.5;
    t.color = `hsl(${Math.random()*40+5|0},90%,${55+Math.random()*25|0}%)`;
    t.life  = 90 + Math.random()*150;
    uzaTexts.push(t);
  }
  for (const t of uzaTexts) {
    t.age++;
    if (t.age < 15)             t.alpha = Math.min(t.peak, t.alpha+t.peak/15);
    else if (t.age > t.life-20) t.alpha = Math.max(0, t.alpha-t.peak/20);
  }
  swapRemove(uzaTexts, _predUzaText, _deadify);
}

function drawUzaTexts() {
  ctx.save();
  for (const t of uzaTexts) {
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.rot);
    ctx.globalAlpha = t.alpha;
    ctx.font = `bold ${t.size}px 'Hiragino Kaku Gothic Pro', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ギウギウ: ぎゅうぎゅう詰め ════════════════ */
function initGiugiu() {
  items = _releaseAll(items);
  /* 外周リングから中央へ向かって一斉に投下 */
  const N = _itemBurst(PAYOUT_RATE.hitMed);
  const R = Math.hypot(W, H) * 0.55;
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
    const sx  = W/2 + Math.cos(angle) * R;
    const sy  = H/2 + Math.sin(angle) * R;
    const spd = 32 + Math.random() * 10;
    const vx  = (W/2 - sx) / R * spd;
    const vy  = (H/2 - sy) / R * spd;
    items.push(makeItem(sx, sy, vx, vy));
  }
}

function updateGiugiu() {
  /* 外縁から追加投入（最大30個） */
  if (endTimer % 15 === 0 && items.length < 30) {
    const angle = Math.random() * Math.PI * 2;
    const R = Math.hypot(W, H) * 0.55;
    const sx = W/2 + Math.cos(angle) * R;
    const sy = H/2 + Math.sin(angle) * R;
    const spd = 32 + Math.random() * 10;
    items.push(makeItem(sx, sy,
      (W/2 - sx) / R * spd, (H/2 - sy) / R * spd));
  }

  const ATTRACT     = 1.20;  // 中心引力（強化: 高速集合後も押し付け維持）
  const ATTRACT_REF = 50;    // 距離反比例の参照距離: d=REF で引力2倍、d→∞ で引力1倍
  const DAMPING     = 0.93;  // 速度減衰
  const RESTITUTION = 0.50;  // 反発係数
  const FRICTION2   = 0.88;  // アイテム間摩擦
  const ITERS       = 4;
  /* 重力発生点をリサージュ軌道でゆっくりドリフト（異周波数で不規則に動く） */
  const driftR = Math.min(W, H) * 0.10;
  const CX = W/2 + Math.cos(endTimer * 0.022) * driftR;
  const CY = H/2 + Math.sin(endTimer * 0.037) * driftR * 0.6;
  /* ATTRACT脈動: ビート同期（拍頭に一瞬だけ弱反発→すぐ引き戻し）
     getBeatPulse()に+60ms先読みを追加してギウギウ拍動の体感遅延を補正 */
  const beatPulse = (function() {
    const loopDur = _curQuantizedLoopDur();
    if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || loopDur <= 0) return 0;
    const rate = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo;
    const pos  = _bgmAccumAudioTime + (_BEAT_DISPLAY_ADVANCE - _hwLatency + 0.06) * rate;
    const pip  = ((pos % loopDur) + loopDur) % loopDur;
    const ph   = (((pip % BGM_BEAT) + BGM_BEAT) % BGM_BEAT) / BGM_BEAT;
    return Math.pow(Math.max(0, 1 - ph * 2.5), 2);
  })();
  const attractMul   = 1.0 - beatPulse * 1.75;
  const ATTRACT_DYNA = ATTRACT * attractMul;

  /* ① 距離反比例引力 + 位置更新 */
  for (const g of items) {
    const dx = CX - g.x, dy = CY - g.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 0.001;
    const forceMag = ATTRACT_DYNA * (1 + ATTRACT_REF / (d + ATTRACT_REF));
    g.vx    += dx / d * forceMag;
    g.vy    += dy / d * forceMag;
    g.vx    *= DAMPING;
    g.vy    *= DAMPING;
    g.x     += g.vx;
    g.y     += g.vy;
    /* 回転振動: 衝突減衰に負けないよう強めのトルクで直接駆動 */
    const oscFreq = 0.10 + (g.size - 34) * 0.004;
    g.rotSpd += Math.sign(Math.sin(endTimer * oscFreq + g._rotPhase)) * (0.015 + beatPulse * 0.04);
    g.rotSpd *= 0.85;
    g.rot    += g.rotSpd;
  }

  /* ② 衝突解決（updateItemsと同じソルバ。反発・摩擦の値と、落下退場・接触フラグの
     扱いだけが違う。_resolveItemCollisions参照） */
  for (let iter = 0; iter < ITERS; iter++) _resolveItemCollisions(RESTITUTION, FRICTION2, false, false);

  _insertionSortY(items);
}

/* ════════════════ ギギギギ: 機械の軋み・火花 ════════════════ */
function updateGigigigi() {
  /* 火花をランダムに飛ばす（プール再利用） */
  const rate = Math.min(8, 2 + Math.floor(endTimer / 60));
  for (let i = 0; i < rate; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 3 + Math.random() * 9;
    const s = _poolAlloc(_gigiPool);
    s._dead = false;
    s.x = Math.random() * W; s.y = Math.random() * H;
    s.vx = Math.cos(a)*spd;  s.vy = Math.sin(a)*spd;
    s.life = 10 + Math.random() * 14;
    s.color = Math.random() < 0.6 ? '#fff' : (Math.random()<0.5 ? '#ffaa00' : '#ff4400');
    s.r = 0.8 + Math.random() * 1.8;
    gigiSparks.push(s);
  }
  for (const s of gigiSparks) {
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.4; s.vx *= 0.93;
    s.life--;
  }
  swapRemove(gigiSparks, _predLife, _deadify);
}

function drawGigigigi() {
  if (hitType !== 'gigigigi' || endTimer < 50) return;
  const intensity = Math.min(1, (endTimer - 50) / 40);
  ctx.save();

  /* ランダムなグリッチ水平線 */
  for (let i = 0; i < 20; i++) {
    if (Math.random() > 0.45 * intensity) continue;
    const y = Math.random() * H;
    const w = W * (0.2 + Math.random() * 0.8);
    const x = Math.random() * (W - w);
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.random()*0.25})`;
    ctx.fillRect(x, y, w, 1 + Math.random()*4);
  }

  /* 火花: プリレンダ済みグロースプライトを drawImage（shadowBlur・save/restore なし） */
  for (const s of gigiSparks) {
    ctx.globalAlpha = Math.min(1, (s.life / 24) * intensity);
    const sp = _gigiSparkSprites && _gigiSparkSprites[s.color];
    if (sp) {
      const half = _GIGI_SPRITE_HALF * (s.r / _GIGI_SPRITE_R);
      ctx.drawImage(sp, s.x - half, s.y - half, half * 2, half * 2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.save();
      ctx.fillStyle = s.color;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  /* RGBずれ */
  ctx.globalAlpha = 0.05 * intensity;
  ctx.fillStyle = 'rgba(255,0,0,1)';   ctx.fillRect(5, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,255,1)';   ctx.fillRect(-5, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ヨヨヨヨ: ヨーヨー ════════════════ */
function initYoyoyoyo() {
  yoyos = _releaseAll(yoyos);
  const count = MEDIUM_EFFECT_GYOZA_N;
  /* 横に等間隔で並べるため、1レーンの幅は画面幅÷個数。縦画面（W=420）では
     20個だと1レーン21pxとギヨウザの見た目幅（約44px）より狭くなるが、
     各個体は振幅・周波数・位相がばらばらの上下運動をしていて同じ高さに
     並ばないため、横に重なっても団子にはならない。ばらけ幅（±9px）は
     レーン幅より大きくしないよう、レーン幅の4割を上限にする */
  const jitter = Math.min(18, (W / count) * 0.4);
  for (let i = 0; i < count; i++) {
    const x = (i + 0.5) * (W / count) + (Math.random()-0.5)*jitter;
    const g   = makeItem(x, 0, 0, 0);
    g.phase   = Math.random() * Math.PI * 2;
    g.freq    = 0.055 + Math.random()*0.04;
    g.amp     = H * 0.30 + Math.random() * H * 0.25;
    g.topY    = 10 + Math.random()*20;
    g.delay   = i * 6;
    g.spinSpd = (Math.random() > 0.5 ? 1 : -1) * (0.03 + Math.random()*0.03);
    yoyos.push(g);
  }
}

function updateYoyoyoyo() {
  for (const y of yoyos) {
    y.y   = y.topY + y.amp * (0.5 + 0.5 * Math.sin(endTimer * y.freq + y.phase));
    y.rot += y.spinSpd;
  }
}

/* outroTimerを渡すと退場中のリストを描く（フェードインは済んでいるので不透明、
   画面上端より上に出た糸は描かない）。省略時は現トライのyoyos */
function drawYoyoyoyo(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'yoyoyoyo' || endTimer < 50)) return;
  for (const y of (list ?? yoyos)) {
    let a = 1;
    if (!outro) {
      const age = endTimer - 50 - y.delay;
      if (age <= 0) continue;
      a = Math.min(1, age / 22);
    }

    /* 糸 */
    if (y.y > 0) {
      ctx.save();
      ctx.globalAlpha = a * 0.7;
      ctx.beginPath(); ctx.moveTo(y.x, 0); ctx.lineTo(y.x, y.y);
      ctx.strokeStyle = 'rgba(220,220,200,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    }

    /* ギヨウザ */
    ctx.save();
    ctx.globalAlpha = a;
    drawOneItem(y);
    ctx.restore();
  }
}

/* ════════════════ ウウウウ: 幽霊 ════════════════ */
/* ゴーストキャンバスプール: spawnGhost ごとの canvas 生成（GC・バッキングストア確保）を回避 */
const _freeGhostCanvases = [];
const _releaseGhost = g => { if (g._oc) { _freeGhostCanvases.push(g._oc); g._oc = null; } };

function initUuuu() {
  ghosts = _releaseAll(ghosts, _releaseGhost);
}

/* 幽霊ギヨウザをオフスクリーンに事前レンダリング（毎フレームのグラジェント生成を排除）
   ギヨウザ本体を青白グラデーション+半透明で描き、天使の輪と幽霊の尾を追加する */
function _makeGhostCanvas(r) {
  /* キャンバスサイズ: ギヨウザ本体 + 上の天使の輪 + 下の幽霊の尾 を収める */
  const bodyH  = r * 1.2;  // ギヨウザ縦半径
  const haloH  = r * 0.9;  // 輪の上端までの余白
  const tailH  = r * 1.0;  // 尾の長さ
  const sz     = Math.ceil((bodyH + haloH + tailH) * 2 + r * 2.4);
  /* プールから再利用（なければ新規生成）。サイズ一致時は clearRect のみで再利用 */
  const oc     = _freeGhostCanvases.pop() || document.createElement('canvas');
  const c2     = oc.getContext('2d');
  if (oc.width !== sz || oc.height !== sz) { oc.width = sz; oc.height = sz; }
  else { c2.clearRect(0, 0, sz, sz); }
  const cx     = sz / 2;
  /* ギヨウザ中心 y（天使の輪分だけ下げる） */
  const cy     = haloH + r * 0.6 + 4;

  /* ── 幽霊の尾（ギヨウザ下から伸びる波状しっぽ） ── */
  const tailTop = cy + bodyH * 0.55;
  const tailBot = tailTop + tailH;
  c2.beginPath();
  c2.moveTo(cx - r * 0.38, tailTop);
  /* 左右に波打つ3本の曲線で尾を形成 */
  c2.quadraticCurveTo(cx - r * 0.6,  tailTop + tailH*0.3, cx - r*0.15, tailTop + tailH*0.55);
  c2.quadraticCurveTo(cx + r * 0.15, tailTop + tailH*0.75, cx,          tailBot);
  c2.quadraticCurveTo(cx - r * 0.15, tailTop + tailH*0.75, cx + r*0.15, tailTop + tailH*0.55);
  c2.quadraticCurveTo(cx + r * 0.6,  tailTop + tailH*0.3, cx + r*0.38, tailTop);
  c2.closePath();
  const tailGrd = c2.createLinearGradient(cx, tailTop, cx, tailBot);
  tailGrd.addColorStop(0,   'rgba(160,210,255,0.55)');
  tailGrd.addColorStop(1,   'rgba(160,210,255,0.0)');
  c2.fillStyle = tailGrd; c2.fill();

  /* ── ギヨウザ本体（通常カラー + 青白オーラ） ── */
  /* オーラ: 本体楕円を青白 shadowBlur で先に描いてグロー層を作る */
  c2.save();
  c2.shadowColor = 'rgba(140,200,255,0.95)';
  c2.shadowBlur  = r * 0.7;
  c2.beginPath();
  c2.ellipse(cx, cy + r*0.08, r*0.58, r*0.48, 0, 0, Math.PI*2);
  c2.fillStyle = 'rgba(180,220,255,0.35)';
  c2.fill();
  c2.restore();

  /* 本体形状（共通関数で描画）*/
  const bodyGrd = c2.createRadialGradient(cx - r*0.15, cy - r*0.3, 0, cx, cy + r*0.1, r * 1.1);
  bodyGrd.addColorStop(0,   'hsl(42,70%,82%)');
  bodyGrd.addColorStop(0.6, 'hsl(38,62%,72%)');
  bodyGrd.addColorStop(1,   'hsl(34,55%,58%)');
  _drawGyozaBody(c2, r, cx, cy, bodyGrd);

  /* ── 天使の輪（ギヨウザ上方に浮かぶ金色の楕円リング） ── */
  const haloY  = cy - r * 0.72; // 頭上に浮かせる
  const haloRx = r * 0.42;      // 横半径
  const haloRy = r * 0.13;      // 縦半径（奥行き感）
  /* 輪の後ろ半分（ギヨウザに隠れる側）を薄く */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, Math.PI, Math.PI*2);
  c2.strokeStyle = 'rgba(255,220,80,0.35)'; c2.lineWidth = r * 0.13; c2.stroke();
  /* 輪の前半分（手前側）を明るく */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, 0, Math.PI);
  const haloGrd = c2.createLinearGradient(cx - haloRx, haloY, cx + haloRx, haloY);
  haloGrd.addColorStop(0,   'rgba(255,240,120,0.9)');
  haloGrd.addColorStop(0.5, 'rgba(255,200,50,1.0)');
  haloGrd.addColorStop(1,   'rgba(255,240,120,0.9)');
  c2.strokeStyle = haloGrd; c2.lineWidth = r * 0.13; c2.stroke();
  /* 輪のグロー */
  c2.beginPath();
  c2.ellipse(cx, haloY, haloRx, haloRy, 0, 0, Math.PI*2);
  c2.strokeStyle = 'rgba(255,240,100,0.18)'; c2.lineWidth = r * 0.30; c2.stroke();

  return { oc, sz, cy }; // cy: キャンバス内でのギヨウザ中心y（drawImage時の基準）
}

function spawnGhost() {
  const r = 28 + Math.random()*20;
  const { oc, sz, cy: ocCy } = _makeGhostCanvas(r);
  ghosts.push({
    x:        Math.random() * W,
    y:        H + r + 20,
    vy:       -(0.8 + Math.random()*1.4),
    wobble:   Math.random() * Math.PI * 2,
    wobbleSpd:0.025 + Math.random()*0.025,
    wobbleAmp:18 + Math.random()*22,
    r, alpha: 0, alive: true,
    _oc: oc, _ocSz: sz, _ocCy: ocCy, // 事前レンダリング済みキャンバス
  });
}

function updateUuuu() {
