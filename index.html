<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
<link rel="icon" type="image/png" href="android-touch-icon.png" sizes="192x192" />
<title>ギヨウザルーレット</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* セーフエリア: env()はJSから直接読めないためCSSカスタムプロパティ経由で公開 */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0f5c22;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
body {
  /* ノッチ・Dynamic Island・ホームインジケータ領域をパディングで除外 */
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}
h1 {
  display: none; /* スタートアップ画面はCanvasで描画するため常時非表示 */
}
canvas {
  display: block;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 3px #c8a800;
  touch-action: none; /* スクロール・ズームを完全に無効化してタッチ遅延を排除 */
  /* will-change: filter はJS側で必要な間だけ付ける（_setGrayFilter参照）。
     常時付けるとフィルターが掛かっていない間もフィルター用の合成パスが維持され、
     dpr2の全画面ぶんのコストが毎フレーム乗りうる。実機ではdpr=1にすると
     キング戦の引っかかりがほぼ消えたため、GPU側の負荷が効いていることは確定している */
}
/* ブラウザ標準のフォーカスリングを消す。
   実機指摘: 黄色い枠のさらに外側に、うっすら緑がかった枠（PC Safariでは
   テキスト入力欄のフォーカス枠のような見た目）が出て目障りだった。
   canvasはBluetoothキーボードのkeydownをページへ配送させるために
   tabIndex=-1でフォーカス可能にし_ensureCanvasFocus()で明示的にフォーカスを
   当てている（その経緯は同関数のコメント参照）。フォーカス自体は機能上
   必要なので外さず、輪郭の描画だけを止める。
   tabIndex=-1でキーボードのTab移動では到達しない要素なので、フォーカス表示を
   消してもキーボード操作の手がかりは失われない。
   focus-visibleも併記するのはブラウザによってどちらが効くかが異なるため */
canvas:focus,
canvas:focus-visible { outline: none; }
/* 横向き小型画面: タイトルを非表示にしてキャンバスを最大化 */
@media (max-height: 480px) and (orientation: landscape) {
  h1 { display: none; }
}
/* キャンバスラッパー */
#canvas-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
}
</style>
</head>
<body>
<h1>ギヨウザルーレット</h1>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════
   目次 (Table of Contents)
   ────────────────────────────────────────────────────────────────
   ■ 定数              canvas・DPR・カラー・サイズ・当たり判定テーブル
                        全画面ボタン定数（FS_SUPPORTED・Path2D等）
   ■ キャッシュ・プール  オブジェクトプール・文字列キャッシュ・LUT
   ■ ゲーム状態         フェーズ・矢・コイン・ビートシンク変数群
   ■ 実績システム        実績定義・localStorage キー
   ■ UI レイアウト定数   ボタン・BETバー座標定数
   ■ Audio System       AudioContext・BGM・レートランプ・ビートパルス
   ■ 効果音             playSE
   ■ 永続化             localStorage 読み書き・スキーマチェック
   ■ Startup Jingle     スタートジングルスケジューラ
   ■ Init               ゲーム初期化・リセット
   ■ コイン・BET        clampBet・changeBet・calcPayout
   ■ Update             毎フレーム状態更新
   ■ 勝利エフェクト      花火・ウヨウヨ・落下ギヨウザ・ウザウザ
                        ギウギウ・ギギギギ・ヨヨヨヨ・ウウウウ
                        ザザザザ・ギョギョ
   ■ 画面エフェクト      ギザギザ・ウザウザフラッシュ
   ■ 吉祥雲 / 獅子
   ■ Draw helpers       outText・easeOutBack・roundRect・_drawBtnBg
   ■ Main draw          draw() メインループ描画
   ■ 描画関数群          BETボタン・的・矢・コインヘッダ・BETバー等
   ■ Startup Screen     スタート画面
   ■ Loop / Input       ゲームループ・入力ハンドラ
   ■ キャンバス初期化    fitCanvas（セーフエリア対応）
   ■ 全画面切替         toggleFullscreen・onFsChange
   ════════════════════════════════════════════════════════════════ */

/* ════════════════ 定数 ════════════════ */

/* ── デバッグ用URLパラメータの一元パース ──
   ?portrait ?cheatpanel ?perf ?dpr ?king ?lat ?jlat の7種を、以前は
   使う場所ごとに new URLSearchParams(location.search) して個別に解釈していた。
   増えるたびに書き方が分かれる（has/get/parseInt/parseFloatの混在、既定値の扱い）ため、
   入口をここ1つにまとめる。本番プレイではどのフラグも立たない。
   _dbgFlag: 有無だけを見るもの / _dbgNum: 数値。無指定なら第2引数を返す */
const _DBG_QUERY = new URLSearchParams(location.search);
const _dbgFlag = name => _DBG_QUERY.has(name);
const _dbgNum  = (name, fallback = null) => {
  const v = parseFloat(_DBG_QUERY.get(name));
  return isNaN(v) ? fallback : v;
};

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false }); // 毎フレーム全面を塗るため不透明化（ページとの合成コスト削減）
/* 背景を別canvasへ分けて重ねる案（レイヤー分割）は実装して実機A/Bまでやったが、
   効果が無かったので削除した（2026-08-15。?layers として一時的に入れていた）。
   理由: 分離すると本体canvasを透明にする必要があり（不透明のままでは背後が見えない）、
   「全画面のテクスチャ転送1回」を「全画面のクリア＋合成時の全画面ブレンド」に
   置き換えるだけになる。しかもこのゲームは前景が毎フレーム全画面ぶん変化するので、
   レイヤー分割本来の利点（変化しない領域を再ラスタライズしない）がそもそも効かない。
   実機ではgapが有無どちらも30〜35msで差が出なかった。再挑戦しないこと。
   塗る量を減らしたいなら実解像度側で下げる（_RS_* の自動制御を参照） */
/* 外付けキーボード対策: hardware keydownがページのJSへ配送されるには、
   ページ内のどこかにフォーカス可能な要素が実際にフォーカスされている必要がある。
   このゲームはcanvas1枚だけのUIでtabindexも無いため、タップしてもどの要素にも
   フォーカスが当たらず、キーボード側の入力経路は生きているのにkeydownがページへ
   一切届かない状態になっていた（iOS実機で発覚。URL欄には直接入力できるのに
   ページのJSには届かない＝ページ内フォーカス先が無かったための取りこぼしと推測）。
   canvasをプログラム的にフォーカス可能にし、タップのたびに明示的にフォーカスを
   取り直す（_ensureCanvasFocus参照）。発覚のきっかけは当時のキーボードチートだが、
   チート削除後もスペース（発射・段送り）と左右矢印（BET変更）がキーボード操作
   として残るため、この対策自体は引き続き必要 */
canvas.tabIndex = -1;
function _ensureCanvasFocus() {
  /* 既にフォーカスが当たっているなら何もしない。focus()はフォーカス移動が無くても
     ブラウザ側でスタイル・レイアウトの再計算やイベント発行が走りうるため、毎タップ
     無条件に呼ばない（実機のスパイク記録で、タップしたフレームだけ30〜61ms止まる
     一方でこちらの計測値は0msという結果が出たため、ハンドラ内で計測外だった処理を
     順に潰している）。フォーカスが外れたときだけ取り直せば目的は達成できる */
  if (document.activeElement === canvas) return;
  const _t0 = PERF_ON ? performance.now() : 0;
  try { canvas.focus({ preventScroll: true }); } catch(_e) { try { canvas.focus(); } catch(_e2) {} }
  if (PERF_ON) _perfMark('focus', _t0);
}

/* タッチデバイス判定 & 向き */
const IS_TOUCH    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
/* ?portrait URL パラメータでデスクトップからでも縦画面テスト可能 */
const _forcePortrait = _dbgFlag('portrait');
const IS_PORTRAIT = _forcePortrait || (IS_TOUCH && window.innerWidth < window.innerHeight);

const W = IS_PORTRAIT ? 420  : 1060;
const H = IS_PORTRAIT ? 820  : 560;
/* ?cheatpanel URL パラメータで画面下端にタップ式チートパネルを表示する。
   もとは iOS Safari + 外付け（Bluetooth）キーボードでkeydown系のチートキー
   （Ctrl+F/T/C・矢文字G/Y/U/Z）が一切反応しない不具合（実機指摘、複数の
   JS側対策：予約ショートカット回避キー・KeyboardEvent.keyフォールバック・
   canvasフォーカス確保、を試したが解消せず）への代替経路として用意したもの。
   タップはこのゲームの主入力手段そのもので確実に届くため実機でも使える。
   現在はこれがチート操作の唯一の入口で、キーボード側のチートは削除済み
   （keydownハンドラのコメント参照）。本番プレイでは?cheatpanelを付けない限り
   一切描画・判定されない（既存の?king=等のデバッグ用URLパラメータと
   同じ位置づけ） */
const CHEAT_PANEL_ON = _dbgFlag('cheatpanel');
const CHEAT_PANEL_BTNS = [
  { id: 'fever',  label: 'FEVER' },
  { id: 'slow',   label: 'SLOW'  },
  { id: 'clr',    label: 'CLR'   },
  { id: 'allach', label: 'ACH'   },
  { id: 'gi',     label: 'ギ'    },
  { id: 'yo',     label: 'ヨ'    },
  { id: 'u',      label: 'ウ'    },
  { id: 'za',     label: 'ザ'    },
];
function _cheatPanelRect(i) {
  const h = 26, gap = 2;
  const w = (W - gap * (CHEAT_PANEL_BTNS.length - 1)) / CHEAT_PANEL_BTNS.length;
  return { x: i * (w + gap), y: H - h, w, h };
}
function _runCheatPanelAction(id) {
  if (id === 'fever') { _cheatFeverQueued = true; return; }
  if (id === 'slow') {
    _cheatSlowQueued = _cheatSlowQueued !== null ? null : !isSlowSpin;
    return;
  }
  if (id === 'clr') {
    try { localStorage.clear(); } catch(_e) {}
    location.reload();
    return;
  }
  if (id === 'allach') {
    /* こんがり以外の実績を全て達成状態にする（キングギヨウザ出現条件のテスト用。
       こんがり自体はキングギヨウザ討伐でのみ解除される最後の実績のため対象外にする
       ＝_allAchExceptKongariDoneと同じ判定基準）。
       最大18件が同一フレームで解除されるため、実績解除音が完全に重なって
       割れて聞こえるとの実機報告があった。90msずつずらして鳴らすことで、
       マスターリミッター任せにせず発音側でも重なりを減らす */
    let i = 0;
    for (const a of ACHIEVEMENTS) if (a.id !== KONGARI_ACH_ID) { unlockAch(a.id, i * 0.09); i++; }
    return;
  }
  const charMap = { gi: 'ギ', yo: 'ヨ', u: 'ウ', za: 'ザ' };
  if (charMap[id] && phase === 'idle' && curIdx < 4) cheatShoot(charMap[id]);
}
function drawCheatPanel() {
  if (!CHEAT_PANEL_ON) return;
  ctx.save();
  ctx.font = `bold 11px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
    const r = _cheatPanelRect(i);
    ctx.fillStyle = 'rgba(200,0,80,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(CHEAT_PANEL_BTNS[i].label, r.x + r.w / 2, r.y + r.h / 2);
  }
  ctx.restore();
}

/* ?perf URL パラメータで、実機の「どこで詰まっているか」を数値で見るオーバーレイ。
   引っかかりの原因を推測で潰していくのをやめ、実機の数字で判断するために置く
   （Web Inspectorを繋がなくても画面だけで読める。?cheatpanel等と同じ位置づけで、
   パラメータを付けない限り計測も描画も一切走らない）。
   見方: frame work が16.7msを超えたフレームがあれば、その回のどれかが犯人。
   tap はタップ処理そのもの、resOC はロック時の結果文字焼き込み（shadowBlur使用）、
   wheel は次トライ用ホイールの事前構築（的1個ぶん）、lsW はlocalStorage書き出し。 */
const PERF_ON = _dbgFlag('perf');
/* ?mark: Safari Web Inspector のタイムラインへ目印を打つ（console.timeStamp）。
   ?perf では原理的に見えないもの——ラスタライズと合成のコスト——を追うためのもの。
   canvasの描画は呼び出しとラスタライズが別で、後者はフレームの合成時に来るため
   performance.now では捕まらない（この落とし穴に2度はまっている）。
   Web Inspectorのタイムラインにはそれが出るので、そこに「いま射った」という
   目印を並べれば、スパイクのフレームで何のペイントが走っているかを対照できる。
   オーバーレイ（?perf）は自身が焼き込みを起こすので、収録時は付けずにこちらだけ使う */
const _MARK_ON = _dbgFlag('mark');
const _mark = (_MARK_ON && typeof console !== 'undefined' && console.timeStamp)
  ? name => { try { console.timeStamp(name); } catch (_e) {} }
  : () => {};
const _PERF_FONT = '11px monospace';
const _PERF_MAX_HOLD_MS = 5000; // 最大値の保持時間。古い記録は捨てて直近の状態を映す
/* 計測対象の定義。ここに1行足して呼び出し側で_perfMark(key, t0)すれば、表示も
   スパイクのタグ付けも自動で追従する（以前は「_perfに項目追加→タグ配列に追加→
   表示行を手書き」と3箇所を触る必要があり、増やすたびに漏れる形だった）。
   line: 表示のまとめ方（同じ番号は1行に並ぶ）。withLast: 直近値も併記するか */
const _PERF_PROBES = [
  { key: 'drawOnly', label: 'drawOnly', line: 0, withLast: true, note: '追加draw' },
  { key: 'tap',      label: 'tap',      line: 1 }, // handleGameClick（発射処理そのもの）
  { key: 'touch',    label: 'touch',    line: 1 }, // touchstartハンドラ全体（tapの外側も含む）
  { key: 'unlk',     label: 'unlk',     line: 1 }, // 音声アンロック（毎タップ呼ばれる）
  { key: 'focus',    label: 'foc',      line: 1 }, // canvas.focus()（フォーカスが外れている時だけ）
  { key: 'elev',     label: 'elev',     line: 1 }, // AVAudioSession昇格（成功するまで毎タップ）
  { key: 'resOC',    label: 'resOC',    line: 2, withLast: true, note: 'blur' },
  { key: 'pre',      label: 'wheel',    line: 3, withLast: true, note: '事前構築' },
  { key: 'ls',       label: 'lsW',      line: 4, withLast: true },
  { key: 'bar',      label: 'bar',      line: 4, withLast: true, note: 'BET' },
  { key: 'fx',       label: 'fx',       line: 5, withLast: true, note: '演出' },
  { key: 'whl',      label: 'whl',      line: 5, withLast: true, note: '的' },
  { key: 'txt',      label: 'txt',      line: 5, withLast: true, note: '文字' },
  { key: 'king',     label: 'king',     line: 5, withLast: true, note: 'ボス描画' },
];
const _perf = {};
for (const p of _PERF_PROBES) _perf[p.key] = { last: 0, max: 0, at: 0, ranAt: 0 };
/* 突出したフレーム間隔（スパイク）だけを、そのとき何が起きていたかと一緒に残す。
   「ごく稀に1的目の発射で引っかかる」のような低頻度の事象は、最大値だけ見ていても
   前後関係が分からないため。直近3件を新しい順に表示する。
   sinceInit＝トライ開始からの経過msなので、1的目付近で起きているかがそれで分かる。
   tags＝そのスパイクと同じ時間帯に走っていた計測対象（何も付かなければ、
   詰まっていたのはこちらのJSの外側＝GCやブラウザ側の処理） */
const _PERF_SPIKE_MS = 25;   // これを超えるフレーム間隔を記録する（通常は16.7）
const _PERF_SPIKE_KEEP = 3;
const _perfSpikes = [];
let _lastInitAt = 0;         // 直近のinit()時刻（トライ開始）
let _perfLastSpikeAt = 0; // 直近スパイクの時刻（間隔Δの算出用）
function _perfLogSpike(gapMs) {
  const now = performance.now();
  const tags = [];
  for (const pr of _PERF_PROBES) {
    const e = _perf[pr.key];
    if (e.ranAt > 0 && now - e.ranAt <= gapMs + 4) tags.push(pr.key);
  }
  /* 直前のスパイクからの間隔。周期性のある事象は、この値が既知の周期
     （拍=約395ms、ボスBGMの1ループ、1秒など）に一致するかどうかで発生源を絞れる。
     実機では「BGMの一周と同期して詰まる」という体感報告が出ており、
     BGMを止めても再現したため、周期の実測値そのものが必要になった */
  _perfSpikes.unshift({
    gap: gapMs,
    phase: phase,
    idx: curIdx,
    since: _lastInitAt > 0 ? Math.round(now - _lastInitAt) : -1,
    delta: _perfLastSpikeAt > 0 ? Math.round(now - _perfLastSpikeAt) : -1,
    tags: tags.join(','),
  });
  _perfLastSpikeAt = now;
  if (_perfSpikes.length > _PERF_SPIKE_KEEP) _perfSpikes.length = _PERF_SPIKE_KEEP;
}
/* rAFが実際に何回/秒呼ばれているかを数える。update()+draw()が5〜7msなのに
   フレーム間隔が31〜47msという実機報告の切り分け用: JSの合計とrAFの実測レートを
   突き合わせれば、残りがブラウザ側（塗り直し・GPU転送・合成）だと確定できる */
let _perfFps = 0, _perfFrameCount = 0, _perfFpsT = 0;
function _perfCountFrame(t) {
  _perfFrameCount++;
  if (_perfFpsT === 0) { _perfFpsT = t; return; }
  if (t - _perfFpsT >= 1000) {
    _perfFps = _perfFrameCount * 1000 / (t - _perfFpsT);
    _perfFrameCount = 0; _perfFpsT = t;
  }
}
function _perfMark(key, t0) {
  const e = _perf[key], now = performance.now(), ms = now - t0;
  e.last = ms; e.ranAt = now;
  if (ms >= e.max || now - e.at > _PERF_MAX_HOLD_MS) { e.max = ms; e.at = now; }
}
/* オーバーレイは canvas ではなく DOM 要素へ出す。

   経緯: 元は毎フレーム12行・約600グリフを fillText していて、オーバーレイ自身が
   キング戦の引っかかりの主因になっていた。次に「内容が変わったときだけ
   OffscreenCanvas へ焼いて貼る」に変えたが、今度は焼き込み1回ぶんのコストが残り、
   射った瞬間（tap/touch/lsW/bar の値が一斉に変わる＝焼き直しが発火する）に
   30msのスパイクとして出ていた。**計測器が計測対象を乱したのは3回目**。

   canvas に文字を描く限りこの問題からは逃げられない（呼び出しとラスタライズが
   別で、コストはフレームの合成時に来るため performance.now では捕まらない）。
   DOM 要素なら、ゲームの描画パスから完全に外れ、OS 側が別レイヤーとして合成する。
   textContent の書き換えだけなので canvas 側の負担はゼロになる。

   Web Inspector のタイムライン収録（2026-08-15、?markで4射ぶん）でも、
   ?perf を外した状態では paint がゲーム全体で11秒間に合計6.0ms、
   フレーム時間の88.5%は何も走っていない＝描画側に詰まりは無いことを確認済み。

   折り返しは CSS（white-space: pre-wrap）に任せる。以前は measureText で
   手動折り返し・タグの切り詰めをしていたが、それらは全部不要になった。 */
const _PERF_REDRAW_MS = _dbgNum('perfms', 200);
let _perfEl = null, _perfText = '', _perfAt = 0;
function _perfElement() {

function swapRemove(arr, pred, onRemove) {
  if (onRemove) {
    for (let i = arr.length - 1; i >= 0; i--) {
      if (!pred(arr[i])) { onRemove(arr[i]); arr[i] = arr[arr.length-1]; arr.length--; }

      if (!pred(arr[i])) { arr[i] = arr[arr.length-1]; arr.length--; }

/* 「手が空いた時に実行する」の共通ヘルパー。requestIdleCallbackが無い環境では

   タイマーはプレイヤーの入力周期と無関係に発火するため、実機の?perfで
   「1的目のタップと事前構築が同じフレームに乗って30ms」というスパイクを観測した
   （spike 30.0ms shooting#1 +146ms [tap,touch,unlk,elev,pre,bar…]）。

   8分打ちなら着弾は発射の67ms後、次のタップは約197ms後なので110ms以上の余裕がある。

  if (!_pendingWheels || _pendingWheels.length >= WXS.length) return;
  /* 回転中（idle/reach）に加えて結果表示中（done）も対象にする。4射目の着弾は
     そのままトライ終了なので、doneを含めないと4個目だけ毎回間に合わない。
     ただし結果が出た直後は演出の立ち上がりと重なるので、少し置いてから作る */
  const inSpin = phase === 'idle' || phase === 'reach';
  if (!inSpin && !(phase === 'done' && endTimer > 8)) return;
  if (curIdx === 0 || _preBuiltForShot === curIdx) return; // まだ1射もしていない／この矢のぶんは作成済み
  /* 着弾（＝飛行時間の経過）を待ってから。発射と同じフレームに置かないための間 */
  if (performance.now() / 1000 - _arrowStartWallTime < ARROW_FLIGHT_SEC + _PREBUILD_AFTER_LANDING_SEC) return;
  _preBuiltForShot = curIdx;
  const i = _pendingWheels.length;
  const _t0 = PERF_ON ? performance.now() : 0;

  _pendingWheels.push(createWheel(WXS[i], WYS[i], null));

   ほぼ一致するので補正なしでも合って聞こえる」と確認していた状態から外れた位置に
   動いていた。実機報告「遅延自体は前からある。長さが気持ち悪いタイミングに変わった」
   はこれで説明が付く。

   値は実機で較正した（AirPods Pro 3、hw=166ms）。31（グリッドぴったり）と
   68（人の先行タップ+37msも込み）も試したうえで、16が最良という評価。
   グリッド整列の理屈は「0では駄目」までは当てたが、最良点そのものは当てられて
   いない（16はグリッドの92%＝16ms手前）。理屈より実機の感覚を採る。

   内蔵スピーカーのように遅延が小さい出力では足さない。足してもグリッドには
   到底届かず（届かせるには約170ms必要）、ただ反応が鈍るだけになるため。
   ?sepad=ms を付けるとこの自動判定を上書きする（再較正・実験用） */
const _SE_PAD_OVERRIDE = _DBG_QUERY.has('sepad') ? _dbgNum('sepad', 0) / 1000 : null;
const _SE_PAD_BT_MIN = 0.08;   // これ以上の出力遅延をBluetooth級とみなす
const _SE_PAD_BT     = 0.016;  // Bluetooth時に足す幅（実機較正値）
function _shootSEPad() {
  if (_SE_PAD_OVERRIDE !== null) return _SE_PAD_OVERRIDE;
  return _hwLatency >= _SE_PAD_BT_MIN ? _SE_PAD_BT : 0;
}
function _updateBeatDisplayAdvance() {
  if (!audioCtx) return;
  let hw = (audioCtx.outputLatency ?? 0) + (audioCtx.baseLatency ?? 0);
  /* outputLatency 未実装環境（Safari）向け: getOutputTimestamp から実効出力遅延を推定。
     currentTime（スケジュール済み時刻）− contextTime（今スピーカーから出ている音の時刻）
     が Bluetooth を含む出力チェーン遅延。取得できて hw より大きければ採用する */
  _hwLatSrc = 'base';
  if (typeof audioCtx.getOutputTimestamp === 'function' && audioCtx.state === 'running') {
    const ts = audioCtx.getOutputTimestamp();
    if (ts && ts.contextTime > 0) {
      const eff = audioCtx.currentTime - ts.contextTime;
      _hwLatEff = eff;
      if (eff > hw && eff < 1.0) { hw = eff; _hwLatSrc = 'ts'; } // 異常値（停止直後等）は除外
    }
  }
  _hwLatency = hw + _LATENCY_TRIM;
  /* 表示先読みは「描画パイプライン遅延（rAF→合成→画面 ≈2〜4フレーム）」の補償であり、
     音声出力遅延とは独立した定数。旧実装の max(0, TARGET - hw) は Bluetooth
     （hw≈200ms）で先読みが0に潰れ、リングが描画パイプラインぶん音より遅れて見えた（v3.79修正） */
  _BEAT_DISPLAY_ADVANCE = _BEAT_ADVANCE_TARGET;
}

/* BGM ループ長をサンプル単位に量子化した実ループ長（秒）。
   AudioBuffer の loopEnd は内部で floor(loopEnd * sampleRate)/sampleRate に丸められるため、
   この値を使ってビート位相を計算しないとループを重ねるたびにズレが蓄積する。
   getAudioCtx() 内で sampleRate が確定してから更新される。
   ボス戦BGMは5拍子化（BGM_LOOP_DUR_BOSS定義部参照）でループ長が通常と異なる
   ため、_bgmIsBoss で切り替える別の量子化値を持つ（_curQuantizedLoopDur参照） */
let _bgmQuantizedLoopDur     = 0; // _updateBgmQuantizedLoopDur() で sampleRate確定後に設定
let _bgmQuantizedLoopDurBoss = 0;

function _updateBgmQuantizedLoopDur() {
  if (!audioCtx) return;
  const sr = audioCtx.sampleRate;
  _bgmQuantizedLoopDur     = Math.floor(BGM_LOOP_DUR * sr) / sr;
  _bgmQuantizedLoopDurBoss = Math.floor(BGM_LOOP_DUR_BOSS * sr) / sr;
}

/* 現在鳴っているBGM（通常/ボス）に対応する量子化ループ長を返す。
   getBeatPulse/calcSyncScore等、ビートシンク判定は通常・ボス両方の入力
   （_kingReelShoot含む）から共通で呼ばれるため、_bgmIsBossで動的に選ぶ */
function _curQuantizedLoopDur() {
  return _bgmIsBoss ? _bgmQuantizedLoopDurBoss : _bgmQuantizedLoopDur;
}

/* ── BGM 音声バッファ位置の積算追跡 ──────────────────────────────────────────
   playbackRate が変化する場合（スロースピン・テープ演出）、
   audioCtx.currentTime - bgmPhaseRef は壁時計で進むが実際の音声位置は rate 倍速で
   しか進まない。そのため rampBGMRate(0.5) が10秒続くと最大5秒のズレが蓄積する。
   対策: 毎フレーム playbackRate × Δt を積算し、実際の音声バッファ位置を追跡する。 */
let _bgmAccumAudioTime = 0;    // BGMバッファ内積算再生位置（秒）
let _bgmAccumLastWall  = null; // 最後に積算した audioCtx.currentTime
let _bgmAccumLastPerf  = 0;    // 最後に積算した performance.now()/1000（入力評価のサブフレーム補間用）

/* ── JS側レート追跡 ───────────────────────────────────────────────────────────
   AudioParam.value は setValueCurveAtTime 実行中に古い値を返すブラウザ実装差異があり
   (line 240-243 コメント参照)、bgmSource.playbackRate.value が信頼できない。
   レートのランプパラメータを JS 側で持ち、_getBgmRateJS() で解析的に求める。 */
let _bgmRateFrom  = 1.0;   // ランプ開始レート
let _bgmRateTo    = 1.0;   // ランプ目標レート
let _bgmRateStart = 0;     // ランプ開始 audioCtx.currentTime
let _bgmRateDur   = 0;     // ランプ時間（秒）。0=即時変化
let _bgmRateEase  = 'linear'; // 'easeIn' | 'easeOut' | 'linear'

/* ランプパラメータを記録する。setValueCurveAtTime と同時に呼ぶ */
function _setBgmRateJS(from, to, startT, durSec, easeType = 'linear') {
  _bgmRateFrom  = from;
  _bgmRateTo    = to;
  _bgmRateStart = startT;
  _bgmRateDur   = durSec;
  _bgmRateEase  = easeType;
}

/* ease補間ヘルパー: p∈[0,1] → easeOut/easeIn/linear の補間係数を返す
   _tapeRateCurve と _getBgmRateJS で同一式が重複していたため共通化 */
function _easeF(p, type) {
  if (type === 'easeOut') return Math.sin(p * Math.PI / 2);
  if (type === 'easeIn')  return 1 - Math.cos(p * Math.PI / 2);
  return p; // linear
}

/* 現在の audioCtx.currentTime におけるレートを解析的に返す */
function _getBgmRateJS() {
  if (_bgmRateDur <= 0) return _bgmRateTo; // 即時変化
  const p = Math.max(0, Math.min(1,
    (audioCtx.currentTime - _bgmRateStart) / _bgmRateDur));
  if (p >= 1) return _bgmRateTo;
  return _bgmRateFrom + (_bgmRateTo - _bgmRateFrom) * _easeF(p, _bgmRateEase);
}

function _bgmAccumReset() {
  _bgmAccumAudioTime = 0;
  _bgmAccumLastWall  = audioCtx ? audioCtx.currentTime : null;
  _bgmAccumLastPerf  = performance.now() / 1000;
}

function _bgmAccumStep() {
  if (!audioCtx || !bgmSource || _bgmAccumLastWall === null) return;
  const now = audioCtx.currentTime;
  const dt  = now - _bgmAccumLastWall;
  _bgmAccumLastWall = now;
  _bgmAccumLastPerf = performance.now() / 1000;
  if (dt <= 0) return;
  /* dt > 10s: タブ長時間非表示など AudioContext が止まっていたケース → スキップ
     jackpot/reach_jackpot SE（2〜2.5s）はここに含めず正常に積算する */
  if (dt > 10) return;
  /* bgmSource.playbackRate.value はランプ中に正しい値を返さないため JS 側で計算 */
  _bgmAccumAudioTime += dt * _getBgmRateJS();
}

/* getBeatPulse: 同一フレーム内で複数回呼ばれるためフレームキャッシュを使用 */
let _beatPulseCache = 0, _beatPulseCacheFrame = -1;
function getBeatPulse() {
  /* 同じフレーム内の2回目以降はキャッシュを返す
     _bgmAccumStep は update()先頭 または draw-only フレームの先頭で呼ばれ、
     _bgmAccumLastWall が更新されるとキャッシュが無効化される */
  if (_beatPulseCacheFrame === _bgmAccumLastWall) return _beatPulseCache;
  _beatPulseCacheFrame = _bgmAccumLastWall;
  const loopDur = _curQuantizedLoopDur();
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || loopDur <= 0) {
    return (_beatPulseCache = 0);
  }
  /* playbackRate変動を考慮した音声バッファ内位置を計算。
     _bgmAccumAudioTime は audioCtx.currentTime 基準なので outputLatency 分を引いて
     実際にスピーカーから出ている音に揃え、さらに描画パイプライン分だけ先読みする。
     rate を掛けるのは latency が壁時計秒だが offset は音声秒で評価するため。 */
  const rate      = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo; // ランプ中も正確に取得
  const rawPos    = _bgmAccumAudioTime + (_BEAT_DISPLAY_ADVANCE - _hwLatency) * rate;
  /* ループ量子化ドリフト対策: loopEnd はサンプル丸めされた実ループ長で割り切る。
     拍単位（BGM_BEAT）の判定自体はループ長（通常/ボスの5拍子）に依存しない */
  const loopN     = Math.floor(rawPos / loopDur);
  const posInLoop = rawPos - loopN * loopDur;
  const ph = (((posInLoop % BGM_BEAT) + BGM_BEAT) % BGM_BEAT) / BGM_BEAT;
  return (_beatPulseCache = Math.pow(Math.max(0, 1 - ph * 2.5), 2)); // ~160ms で減衰（0.4拍）
}

/* 現在の入力タイミングがビートにどれだけ近いかを 0-1 で返す
   atPerfMs: 入力イベントの timeStamp（performance.now() 基準 ms、省略時は現在時刻）
   1=ジャスト, 0=最も外れている（1/4拍グリッドから半周期ずれ） */
function calcSyncScore(atPerfMs) {
  const loopDur = _curQuantizedLoopDur();
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || loopDur <= 0) return 0.5;
  /* 判定は「聴こえている音」を基準にする（-_hwLatency のみ適用）。
     表示先読み _BEAT_DISPLAY_ADVANCE は描画パイプライン補償なので判定には含めない
     — リング自体が表示遅延を経て光るため、見た目のピークと判定グリッドは体感上一致する。
     最後の積算tickから入力までの経過は performance クロック同士で補間する
     （出力タイムラインとスケジュールタイムラインを混在させると Bluetooth 遅延環境で
      extra が常に0へクランプされ、tick量子化バイアス＋ジッターが判定に乗る）。
     _JUDGE_TRIM（?jlat）は判定グリッドのみを較正する（表示には影響しない） */
  const rate    = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo;
  const nowPerf = (atPerfMs ?? performance.now()) / 1000;
  const extra   = Math.max(0, Math.min(nowPerf - _bgmAccumLastPerf, 0.1)); // 最後のstepから入力までの差分
  const audioPos = _bgmAccumAudioTime + extra * rate;
  const rawPos   = audioPos + (_JUDGE_TRIM - _hwLatency) * rate; // 聴取基準 + 判定較正
  const loopN    = Math.floor(rawPos / loopDur);
  const posInLoop = rawPos - loopN * loopDur;
  /* 評価グリッドを8分音符（BGM_BEAT/2）に変更。
     メロディは4分・8分音符両方に音符があるため、4分音符グリッドでは
     8分音符タイミングが常に最悪スコアになっていた。
     ビートリング表示（getBeatPulse）は4分音符周期のまま維持。 */
  const halfBeat = BGM_BEAT / 2;
  const ph       = ((posInLoop % halfBeat) + halfBeat) % halfBeat; // 0〜halfBeat
  const distSec  = ph < halfBeat / 2 ? ph : halfBeat - ph;        // 最近傍8分音符までの距離
  const distMs   = distSec * 1000;
  return Math.max(0, 1 - distMs / 100); // 0ms→1.0, 100ms→0.0, 100ms超→0
}

/* masterGainの出力先に挟む常時有効のセーフティリミッター。
   実機報告: cheatpanelのACH一括解除（最大18件）で実績解除音('ach')が
   同時に18重に重なり、音が割れて（クリッピングして）聞こえた。
   通常のBGMレンダリング（renderBGMBuffer側のuseLimiter）と同じ問題を
   ライブ再生側でも起こしうる（同一SEの多重発火に限らず、複数のSEが
   偶然重なるケース全般が対象）ため、常時経由するリミッターを1つ挟む。
   普段の1〜2音同時程度ではほぼ無音に近い変化（透過的）で、多重発火時だけ
   ピークを叩き潰す設定にする（BGM事前レンダリング用の-10dB/ratio20は
   常時通すには効きすぎるため、ライブ用にやや緩めた値を使う） */
function _createMasterLimiter(ctx) {
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value = 6;
  limiter.ratio.value = 16;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.15;
  limiter.connect(ctx.destination);
  return limiter;
}

/* BGM系の接続を組む: bgmGain → bgmToneShelf → masterGain。
   getAudioCtx() と _recreateAudioGraph()（iOS interrupted からの復帰）の
   2箇所がそれぞれ独立にこの配線を持っていたため、ノードを1つ挟むだけでも
   片方を直し忘れると「復帰後だけ音色が違う」という再現しにくい不具合になる。
   _bgmIsBoss の残留バグ（project_king_battle_7_4_bgm メモ参照）と同じ構図
   なので、最初から配線を1箇所に集約する */
function _buildBgmGainChain(ctx, outNode) {
  bgmGain = ctx.createGain();
  bgmGain.gain.value = 1;
  bgmToneShelf = ctx.createBiquadFilter();
  bgmToneShelf.type = 'highshelf';
  bgmToneShelf.frequency.value = BGM_TONE_SHELF_HZ;
  bgmToneShelf.gain.value = 0; // 0dB = 完全に透過（下記コメント参照）
  /* JS側ミラーもここで0に戻す。ノードを作る唯一の箇所で両方を確定させることで、
     iOS interrupted からの復帰でノードが作り直されたときにミラーだけ古い値が
     残る（→ガードが成立して二度と設定されない）事故を構造的に防ぐ
     （_updateBgmToneShelf参照） */
  _bgmToneShelfTargetDb = 0;
  bgmGain.connect(bgmToneShelf);
  bgmToneShelf.connect(outNode);
}

/* ── ボス戦BGMの音色をこんがり度で連続的に開く（ライブ処理） ──
   ユーザー要望「こんがり度が進むにつれ音楽的にもっと変化させたい」に対する
   3つ目の要素。地鳴り（4段階）・和声（最終段のみ）が段階的な変化なのに対し、
   こちらはこんがり度に対して連続的に動くので、段の間も表情に合わせて
   じわじわ変化し続ける。
   ローパスを「閉じた状態から開く」方式にしなかった理由: それだとこんがり度0%
   （＝ユーザーが現状の音として了承済みの状態）が今より曇った音に変わって
   しまう。ハイシェルフはゲイン0dBのとき伝達関数が厳密に1（係数がそのまま
   打ち消し合う）なので、0%では現状の音に一切手を加えず、こんがるほど高域が
   持ち上がって「開けていく」方向にだけ働かせられる。
   実際に持ち上がるのは主にハイハット（シェイカー/ラトル役）なので、
   聞こえ方としては「踊りの鳴り物が前に出てくる」＝和太鼓の増加（推し②）と
   同じ方向を向く。 */
const BGM_TONE_SHELF_HZ    = 2600; // この周波数より上を持ち上げる
const BGM_TONE_SHELF_MAX_DB = 5;   // こんがり度100%での持ち上げ量
const BGM_TONE_SHELF_TAU   = 0.12; // setTargetAtTimeの時定数（段差を作らない）

/* こんがり度から目標シェイプ量(dB)を返す。口の制御点はこんがり度に対して
   線形に動く（_kingGentleness参照）ので、こちらも線形にしてスライダーの
   動きを表情と一致させる。0%で0dB＝透過、100%でBGM_TONE_SHELF_MAX_DB。
   ※_kingGentlenessを使わないのは意図的: あれは「50%で反転」を表す量で、
     50%未満が全て0になる。連続変化が売りのこの要素では battle 前半でも
     動いてほしいため、口の制御点そのものと同じ線形量を使う */
function _bgmToneShelfDbForCookPct(pct) {
  return BGM_TONE_SHELF_MAX_DB * Math.max(0, Math.min(1, pct / 100));
}

/* update()から毎フレーム無条件に呼ぶ。「ボス戦を抜けたら戻す」処理を別経路に
   持たせず、毎フレーム現在のphaseとこんがり度から目標値を導出するので、
   終了経路（勝利・敗北・真エンディング・ポーズ・中断）が増えても戻し忘れが
   構造的に起きない。_bgmIsBoss の残留バグと同じ轍を踏まないための形
   （project_king_battle_7_4_bgm メモの「状態を作る唯一の箇所で導出する」）。
   ボス戦以外では常に0dBへ戻るため、通常プレイの音色は変化しない */
function _updateBgmToneShelf() {
  if (!audioCtx || !bgmToneShelf) return;
  const target = (_king && _isBossBattlePhase())
    ? _bgmToneShelfDbForCookPct(_king.cookPct) : 0;
  /* 比較はノードの.valueではなくJS側ミラーと行う（上記コメント参照） */
  if (Math.abs(_bgmToneShelfTargetDb - target) < 0.01) return; // 目標が変わっていなければ何もしない
  _bgmToneShelfTargetDb = target;
  bgmToneShelf.gain.setTargetAtTime(target, audioCtx.currentTime, BGM_TONE_SHELF_TAU);
}

/* ボスBGMの事前レンダリングを、手が空いたときに1本ずつ行う。

   まとめて走らせてはいけない。実測（Mac）で5本同時だと完了まで308ms、
   ノードのスケジュールだけでメインスレッドを28ms塞ぐ。実機の?perfでも初回タップの
   unlk が47msになっており、これは音声経路が開く瞬間と重なる。オーディオスレッドの
   処理落ち（＝ざらついた雑音）とタップの引っかかりの両方の要因になる。

   ただし「後回し」にしただけでは、king値が閾値近くで保存されている状態でリロード
   されると、焼き上がる前に突入しうる（ユーザー指摘。未完なら通常BGMで代用される
   仕様なので無音にはならないが、暗黒BGMも段階切り替えも効かないまま戦うことになる）。
   そこで2つの保険を置く:
     ・保存されたking値が予兆割合を超えていれば、最初の1本の待ちを短くする
     ・予兆に入った時点で未完なら、待たずにその場で焼く（_startBossOmenから呼ぶ。
       予兆はテープストップ1.6秒＋演出が続くので、1本ぶんの時間は十分に取れる） */
const _BOSS_BGM_FIRST_DELAY_MS = 4000; // 最初の1本を焼くまで（音声経路が落ち着くのを待つ）
const _BOSS_BGM_NEAR_DELAY_MS  = 800;  // king値が予兆割合を超えている場合の短縮版
const _BOSS_BGM_GAP_MS         = 1500; // 2本目以降の間隔
let _bossBgmNextTier = 0;    // 次に焼く段階
let _bossBgmBusy     = false;// レンダ実行中
let _bossBgmTimer    = null; // 予約中のタイマー（緊急時に取り消して即実行するのでidを持つ）
function _scheduleBossBgmRenders(immediate = false) {
  if (_bossBgmBusy || _bossBgmNextTier >= BGM_TIER_COUNT) return;
  if (_bossBgmTimer !== null) {
    if (!immediate) return;                 // すでに予約済み
    clearTimeout(_bossBgmTimer); _bossBgmTimer = null; // 緊急: 待たずに走る
  }
  const start = () => {
    _bossBgmTimer = null;
    if (!audioCtx || !bossBgmBuffers) return;
    const tier = _bossBgmNextTier;
    _bossBgmBusy = true;
    const done = () => {
      _bossBgmNextTier = tier + 1;
      _bossBgmBusy = false;
      _scheduleBossBgmRenders(); // 続きは通常の間隔で（緊急でも一気に焼かない）
    };
    renderBGMBuffer(audioCtx.sampleRate, {
      bassArr: BGM_BASS_BOSS_7,
      /* 最終段だけメロディ層を長3度へ持ち上げてAメジャー化（BGM_MEL_BOSS_BRIGHT参照）。
         差し替えはループ先頭ぴったりで行うため、段階間で内容が違っても位相は
         連続しクリックは出ない（_swapBossBgmBuffer参照） */
      melArr: tier === BGM_BRIGHT_TIER ? BGM_MEL_BOSS_BRIGHT : BGM_MEL_BOSS,
      hatArr: BGM_HAT_BOSS, kickSet: BGM_KICK_BOSS,
      taikoStrongSet: BGM_TAIKO_STRONG_BOSS, taikoFlourishSet: BGM_TAIKO_FLOURISH_BOSS, // 7拍子化（ユーザー要望）
      /* こんがり度が上がるほど合いの手の食い込みを増やす（BGM_TAIKO_PICKUP_TIERS参照） */
      taikoPickupSet: _taikoPickupSetForTier(tier),
      bassDurMul: 0.85, bassDecay: 0.05,
      useTaiko: true, useRumble: true, melBossBass: true, kickVol: 1.28, // ユーザー要望で倍量（0.64→1.28）
      useLimiter: true, // ステップ0の同時発音でピークが2.7前後に達するためコンプレッサー必須
      rumbleMellow: tier / (BGM_TIER_COUNT - 1),
    }).then(buf => {
      bossBgmBuffers[tier] = buf;
      if (tier === 0) bossBgmBuffer = buf; // 既存コード（startBossBGMTape等）との互換
      done();
    }).catch(e => { console.warn(`Boss BGM render failed (tier${tier}):`, e); done(); });
  };

  const near = kingGyozaMeter >= KING_GYOZA_THRESHOLD * KING_OMEN_RATIO;
  _bossBgmTimer = setTimeout(start,
    _bossBgmNextTier === 0 ? (near ? _BOSS_BGM_NEAR_DELAY_MS : _BOSS_BGM_FIRST_DELAY_MS)

function getAudioCtx() {

    audioCtx   = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    masterGain = audioCtx.createGain();

       経由せず直接getAudioCtx()を呼ぶため、従来ここを無条件で1（ミュート
       未反映）にして「後でapplyMuteGain()が呼ばれる」ことに依存していた
       設計では、そのボタン経由の初回再生時にミュート設定が一切反映されず
       常に音が鳴ってしまっていた。lsLoad()はページ読み込み時点で必ず
       audioMutedより先に完了している（ユーザー操作でしかgetAudioCtx()は
       呼ばれない）ため、ここで直接audioMutedを反映すれば安全かつ確実 */

    masterGain.connect(_createMasterLimiter(audioCtx));

    _buildBgmGainChain(audioCtx, masterGain);
    /* BGMループを非同期でオフラインレンダリング（完了後 bgmBuffer にセット）
       startBGM() がバッファ未完状態で呼ばれていた場合は完了後に起動する */
    renderBGMBuffer(audioCtx.sampleRate).then(buf => {
      bgmBuffer = buf;
      /* startBGM() がバッファ未完状態で呼ばれていた場合、ここで改めて起動 */
      if (bgmPendingStart && !bgmSource) {
        bgmPendingStart = false;
        startBGM();
      }
    }).catch(e => { console.warn('BGM render failed:', e); });
    /* ボス戦用（暗黒版）バッファは、ここでは焼かずに後回しにする。
       起動タイミングは_initBossBattle側でbossBgmBufferの有無を確認しており、
       未完ならその時点の通常BGMで代用される（startBossBGMTape参照）ので、
       初回タップに間に合わせる必要はまったく無い。キング戦に入るには
       1000ギヨウザ必要で何トライもかかる。
       こんがり度の段階ぶん（BGM_TIER_COUNT個）を用意し、上昇に合わせてループの
       継ぎ目で差し替える（段階で変わる3要素はBGM_TIER_COUNTの定義部、
       切り替えの仕組みは_updateBossBgmTierを参照）。tier0は従来のbossBgmBufferと同一内容 */
    bossBgmBuffers = new Array(BGM_TIER_COUNT).fill(null);
    _scheduleBossBgmRenders();

       resume()後に値が確定するので少し待って再計測 */
    _updateBeatDisplayAdvance();
    setTimeout(_updateBeatDisplayAdvance, 500);
    /* ホワイトノイズバッファを事前生成（最長ノイズ使用: reach_jackpot dur=0.3+0.05=0.35s → 0.45s確保）
       playNoise() はこのバッファを参照するだけでフレームごとのランダム生成ループが不要になる */
    _buildNoiseBuffer();

/* AudioContext の masterGain/bgmGain グラフを再構築する。
   iOS Safari: interrupted 状態は resume() では復帰不可のため AudioContext ごと作り直す。
   ユーザーアクティベーション内で new AudioContext() すると iOS が即 running にする。
   AudioBuffer（bgmBuffer, _noiseBuffer）は Context 非依存なので再利用可能。 */
function _recreateAudioGraph() {
  /* 旧Contextに属する bgmSource 参照を破棄。残すと startBGM() が「再生中」と誤認して

  _destroyBGMSource();
  /* ジングル進行中なら次発音時刻をリセット（旧Context時刻のままだと
     新Contextの currentTime が追いつくまでジングルが停止する） */
  if (jingleScheduler) jingleNextTime = 0;
  try { audioCtx.close(); } catch(_e) {}
  audioCtx  = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  audioCtx.resume().catch(() => {}); // ジェスチャー外から呼ばれた場合の保険
  masterGain = audioCtx.createGain();
  masterGain.gain.value = audioMuted ? 0 : 1;
  masterGain.connect(_createMasterLimiter(audioCtx));
  _buildBgmGainChain(audioCtx, masterGain); // 配線はgetAudioCtxと共通（片方だけ直し忘れる事故を防ぐ）
  _speakerRouteEstablished = false; // 新しいContextではルート再確立が必要
  /* AVAudioSessionの昇格も作り直しで失われうるので再武装する（_elevateAudioSession参照）。
     消音モードではこの昇格が唯一の発音経路なので、取りこぼすと無音になる。
     無音要素がまだ鳴り続けていれば次のタップで即座に「昇格済み」と再判定され、
     割り込みで止められていれば play() から再開される */
  _iosSessionElevated = false;
}

/* iOS Safari: AudioContext を確実に running 状態にしてから callback を呼ぶ。
   - interrupted: _recreateAudioGraph() で再作成（ジェスチャー内なら即 running）
   - suspended: resume() で復帰。Promise 解決後に setTimeout(callback, 0)
   ※ ユーザーアクティベーション（touchstart/touchend/click）内から呼ぶこと。 */
function _resumeAudioCtx(callback) {
  if (audioCtx.state === 'interrupted') {
    _recreateAudioGraph();
    setTimeout(callback, 0);
  } else {
    audioCtx.resume().then(() => setTimeout(callback, 0)).catch(callback);
  }
}

/* iOS マナーモード対策: <audio>要素をユーザーアクティベーション内で再生すると
   AVAudioSession カテゴリが Ambient → Playback に昇格し、マナーモードをバイパスする。
   以前は44バイトの「dataチャンク長0」のWAVを使っていたが、これはサンプルを1つも
   持たない退化したファイルで、次の2つの実害があった（いずれも実機で発覚）:
     ・再生が一瞬で終わる（というより始まらない）ためセッションがすぐ元に戻り、
       毎タップ play() を呼び続けないと消音モードで音が出なかった。その play() が
       1回あたり最大57msかかっており、これがタップ時の引っかかりの正体だった。
     ・currentTimeが進まずendedにもならないので「昇格できたか」を判定できなかった。
       pausedはplay()を呼んだ瞬間にfalseになる仕様のため判定に使えない（これで
       1回だけ呼んで無音になる退行を出した）。
   そこで実時間を持つ無音WAV（8kHz・8bit・モノラル・0.5秒）を実行時に組み立て、
   loop再生で鳴らし続ける。再生が途切れないのでセッションはPlaybackのまま保たれ、
   play()は最初の1回で済む。8bit PCMの無音は0x80。 */
/* 形式は端末の出力に合わせる（48kHz・16bit・モノラル）。
   実機A/Bで「無音要素を鳴らしている時だけ、経路が変わる瞬間にノイズが出る」ことが
   確定した（?noelev では中断・復帰とも無音）。8kHz・8bitで鳴らしていたため、
   出力(48kHz)へのリサンプリングが常に挟まっており、経路の再構成時にその状態が
   ゴミを出している疑いが強い。同じ形式なら変換自体が不要になる。
   16bit PCMの無音は0なので、確保した時点でゼロ埋め済み＝fill不要。

   長さ: 短いとループ境界の処理が頻繁に来てフレーム間隔の乱れになる（0.5秒だと毎秒2回。
   v6.34ではこれを避けるために再生を止める＝待避を入れたが、それが上記のノイズを
   生んだので撤回済み）。10秒あればループ境界は実用上ほぼ無視できる */
const _SILENT_WAV_RATE = 48000;
const _SILENT_WAV_SEC  = 10;
const _SILENT_WAV_URI = (() => {
  const rate = _SILENT_WAV_RATE, n = rate * _SILENT_WAV_SEC * 2; // 16bit = 2バイト/サンプル
  const bytes = new Uint8Array(44 + n);
  const dv = new DataView(bytes.buffer);
  const ascii = (off, s) => { for (let i = 0; i < s.length; i++) bytes[off + i] = s.charCodeAt(i); };
  ascii(0, 'RIFF');  dv.setUint32(4, 36 + n, true);   ascii(8, 'WAVE');
  ascii(12, 'fmt '); dv.setUint32(16, 16, true);      dv.setUint16(20, 1, true); // PCM
  dv.setUint16(22, 1, true);                          dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * 2, true);                   dv.setUint16(32, 2, true); // byteRate / blockAlign
  dv.setUint16(34, 16, true);                         ascii(36, 'data');
  dv.setUint32(40, n, true);
  /* データ部は16bit PCMの無音＝0で、Uint8Arrayは確保時点でゼロ埋めされている */
  let str = '';
  for (let i = 0; i < bytes.length; i += 8192) {
    str += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return 'data:audio/wav;base64,' + btoa(str);
})();
const _iosAudioEl = document.createElement('audio');
_iosAudioEl.src = _SILENT_WAV_URI;
_iosAudioEl.setAttribute('playsinline', '');
_iosAudioEl.loop   = true; // 鳴り続けることでAVAudioSessionをPlaybackのまま保つ
_iosAudioEl.volume = 0;
let _iosSessionElevated = false;
let _iosSessionTries = 0;        // play()の試行回数（?perfでの状態確認用。挙動には影響しない）
/* ?noelev: 無音要素の再生（AVAudioSession昇格）を丸ごと止めて実機A/Bするための調査用フラグ。

   このフラグを付けると消音モード（🔕）では音が出なくなるので、常用してはいけない */
const _NO_ELEVATE = _dbgFlag('noelev');
/* **無音要素は止めない（鳴らし続ける）。**
   v6.34で「昇格を確認したら止める（待避）」を入れたが、これは失敗だった。
   実機報告「リロード後の初回ミュート解除で、BGMにざらざらした雑音が混ざることがある」
   の発生時期がv6.34付近と一致する。止めると出力ストリームが途切れ、そのあと
   Web Audioが鳴り出すときに経路が張り直されるため、Bluetooth側の古いバッファが
   吐き出される（ユーザーの見立て「リロード前のバッファ残存」と一致する）。

   待避を入れた元の理由は「0.5秒のWAVのループ境界が毎秒2回来る」ことだったので、
   そちらはWAVを20秒にして解消した（_SILENT_WAV_SEC参照。境界は40分の1になる）。
   止める方向で解こうとしないこと */

     この昇格はAVAudioSessionをAmbient→Playbackに上げて消音スイッチをバイパスする
     ためのもので、昇格できないまま試行をやめると消音モードで一切音が出なくなる。
     実際に2度やらかした（どちらも実機報告で発覚）:
       1. 失敗が続いたら8回で打ち切る → 打ち切り後は無音のまま
       2. 解決前の再入を防ぐフラグ → iOSのplay()は再生できないときPromiseが
          解決も拒否もしないことがあり、フラグが立ちっぱなしで二度と試行されなくなった
          （?perfのsess表示が 0/1try のまま固まって発覚）
       3. 一度立てたら降ろさないフラグ（`if (_iosSessionElevated) return;`）→ システム側の
          割り込みで無音要素が止められると、鳴っていないのに昇格済みのままになり再開できない
     Promiseの解決を前提にした制御を書かないこと。呼び出しコストの心配より、
     音が鳴らないほうが致命的。実機計測でもこの経路（unlk）は0.0msだった。
     フラグは「毎回その場で確かめた結果」を持つだけで、判断そのものには使わない */
  /* 昇格できたかの判定は「実際に再生位置が進んでいて、かつ止まっていない」ことで見る。
     判定材料の選定を2度間違えた記録（どちらも実機で無音の退行を出した）:
       ・Promiseの解決 → iOSでは解決も拒否もしないことがあり、永久に判定できない
       ・paused===false → play()を呼んだ瞬間にfalseになる仕様なので、実際には
         鳴っていなくても成功と誤認する（1回だけ呼んで無音になった）
     currentTime>0 は実時間を持つWAVに変えて初めて意味を持つようになった
     （_SILENT_WAV_URI参照）。pausedも併せて見るのは、システム側の割り込みで
     止められた場合に再開できるようにするため。
     判定が真にならないうちは毎タップ試み続けるので、諦めて無音になる経路は無い */
  if (!_iosAudioEl.paused && _iosAudioEl.currentTime > 0) { _iosSessionElevated = true; return; }
  /* ループの境目でcurrentTimeが0付近を返す一瞬だけのために鳴らし直さない。
     再生中（paused=false）かつ一度でも進行を確認できていれば、そのまま昇格済み扱い */
  if (!_iosAudioEl.paused && _iosSessionElevated) return;
  /* ここへ来た＝止められている。フラグを畳んでから鳴らし直す。
     成功をplay()のPromiseで確定させない（解決しても実際に鳴り続けているとは限らず、
     フラグが立ったまま止まると二度と再開しなくなる。判定は上の再生状態だけで行う） */
  _iosSessionElevated = false;
  _iosSessionTries++;
  _iosAudioEl.play().catch(() => {});
}

/* バックグラウンドでは無音要素を止める。
   無音を裏で鳴らし続ける意味は無く、AudioContext だけが中断されて要素は生きている、
   という半端な状態を作らないため（実機報告「バックグラウンドへ入る瞬間と、
   フロントへ戻した瞬間にノイズが鳴る」の対策。こちらのグラフ側は段差ゼロまで
   詰めてあり、復帰の瞬間にJSは何も実行していないので、残る変数がここだった）。

   これは v6.34 の「待避」とは別物。あれは通常のプレイ中に止めるもので、
   出力ストリームが途切れて経路が張り直され、リロード後の初回解除でノイズが出た。
   ここで止めるのはバックグラウンドの間だけで、復帰後は次のタップで
   _elevateAudioSession() が鳴らし直す（毎タップその場で確認する設計）。
   フラグは触らない＝再開を妨げる抑制を入れない（過去に2度これで無音にした） */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !_iosAudioEl.paused) { try { _iosAudioEl.pause(); } catch(_e) {} }
});

/* iOS Safari: あらゆるタッチで呼ぶ「機会があれば unlock する」関数。
   resume() + masterGain 経由サイレントバッファで AVAudioSession を開通させる。
   サイレントバッファは destination 直結では AVAudioSession が開かないため masterGain 経由必須。
   特定の音声操作前に確実に running にしたい場合は _resumeAudioCtx(callback) を使う。 */
let _speakerRouteEstablished = false; // masterGain経由バッファ再生でスピーカールートを開通済みか
/* ?perf 計測用の薄いラッパー（早期returnが多いので本体を分ける） */
function _unlockAudio() {
  if (!PERF_ON) return _unlockAudioImpl();
  const _t0 = performance.now();
  _unlockAudioImpl();
  _perfMark('unlk', _t0);
}
function _unlockAudioImpl() {
  /* AVAudioSessionの昇格（_elevateAudioSession）はここでは呼ばない。
     成功するまでの間は1回あたり最大55msかかることが実機計測で分かったため、
     入力処理より後ろ＝touchstartハンドラの最後（finally）へ移した。
     ジェスチャー内であることは変わらないので昇格の条件は満たす */
  if (!audioCtx) getAudioCtx();
  /* スピーカールート未確立、または suspended の場合にバッファを再生する。
     ジェスチャー内で生成した AudioContext は即 running になるが、
     最初のタッチでルートを開通させないと内蔵スピーカーへの音声出力が確立されない。
     _recreateAudioGraph() 後は false にリセットされ再開通が必要になる。 */
  if (_speakerRouteEstablished && audioCtx.state === 'running') return;
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});

    const b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);

/* 音程ヘルパー: note='C'~'B'（シャープ付き'C#'等も可）, octave=3~5
   シャープはボス戦BGMの不協和ベースオスティナート（A/A#半音連打）用に追加 */
function noteHz(note, octave) {
  const semi = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11}[note];
  return 261.63 * Math.pow(2, (semi + (octave - 4) * 12) / 12);
}

/* ホワイトノイズバッファを事前生成する
   AudioContext.sampleRate が変わった場合（デバイス切替）に再生成するため毎回チェック */
function _buildNoiseBuffer() {
  if (!audioCtx) return;
  if (_noiseBuffer && _noiseBuffer.sampleRate === audioCtx.sampleRate) return;
  const len  = Math.ceil(audioCtx.sampleRate * 0.45); // 最長ノイズ(0.35s)より余裕を持った長さ
  const buf  = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  _noiseBuffer = buf;
}

/* 基本オシレーター再生 */
/* dest未指定時の出力先解決: ライブコンテキストならmasterGain経由（ミュート制御）、

   playOsc/playNoise/_playAcidShootHit等でコピーされていた式を一元化 */
function _seDest(ctx, dest) {
  return dest ?? (ctx === audioCtx ? masterGain : ctx.destination) ?? ctx.destination;
}

/* ワンショット系ノードは.stop()後も明示的にdisconnect()しないとオーディオ
   グラフに残り続ける。実機報告（Safari縦画面）: 「キングギヨウザ戦の後半
   くらいからBGMがブツ切れになり、エンディングでも直らない」を調査した
   結果、playOsc/playNoise/_playSlideOsc/_acidChain等のワンショットSE
   ヘルパーが軒並みnew Node()→start()→stop()のみでdisconnect()を一切
   呼んでおらず、矢を射るたび・キング戦の命中音・ジングルの音符ごとに
   ノードが積み上がっていたことが原因と判明した（OfflineAudioContext側の
   BGM事前レンダリングは1回限りで対象外）。stop()予定時刻のsetTimeoutで
   まとめて切断する共通ヘルパーで一元的に解消する（onendedはOfflineAudio
   Context・一部WebKitで発火が不安定なため使わず、確実なタイマー方式にする） */
function _disconnectAfter(ctx, atTime, ...nodes) {
  const delayMs = Math.max(0, (atTime - ctx.currentTime) * 1000) + 50;
  setTimeout(() => { for (const n of nodes) { try { n.disconnect(); } catch(e) {} } }, delayMs);
}

function playOsc(ctx, type, freq, startT, dur, vol, decay, slurTarget, vibrato, dest) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(_seDest(ctx, dest));
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startT);
  /* ビブラート: LFO で周波数変調（薄くかけるため delay 後にフェードイン） */
  let lfo = null, lfoGain = null;
  if (vibrato) {
    lfo     = ctx.createOscillator();
    lfoGain = ctx.createGain();
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(vibrato.rate  ?? 5.5, startT);
    lfoGain.gain.setValueAtTime(0, startT);
    lfoGain.gain.linearRampToValueAtTime(vibrato.depth ?? 5, startT + (vibrato.delay ?? 0.5));
    lfo.start(startT);
    lfo.stop(startT + dur + (decay ?? 0.08) + 0.1);
  }
  gain.gain.setValueAtTime(vol, startT);
  let stopAt;
  if (slurTarget != null) {
    gain.gain.exponentialRampToValueAtTime(Math.max(slurTarget, 0.001), startT + dur);
    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.02));
    stopAt = startT + dur + (decay ?? 0.02) + 0.02;
    osc.start(startT);
    osc.stop(stopAt);
  } else {
    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.08));
    stopAt = startT + dur + (decay ?? 0.08) + 0.02;
    osc.start(startT);
    osc.stop(stopAt);
  }
  if (ctx === audioCtx) {
    _disconnectAfter(ctx, stopAt, osc, gain);
    if (lfo) _disconnectAfter(ctx, startT + dur + (decay ?? 0.08) + 0.1, lfo, lfoGain);
  }
}

/* ノイズバースト（ハイハット・打撃音用）
   _noiseBuffer を使い回すことでフレームごとのランダム生成ループを排除する。
   OfflineAudioContext（BGMレンダリング）への使用時は ctx が異なるため個別生成にフォールバック */
function playNoise(ctx, startT, dur, vol, hpFreq, dest) {
  let buf;
  if (ctx === audioCtx && _noiseBuffer && _noiseBuffer.sampleRate === ctx.sampleRate) {
    buf = _noiseBuffer; // 事前生成バッファを再利用（ランダムループなし）
  } else {
    /* フォールバック: OfflineAudioContext または未初期化時 */
    const len  = Math.ceil(ctx.sampleRate * (dur + 0.05));
    buf        = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  const src    = ctx.createBufferSource();
  src.buffer   = buf;
  const hp     = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = hpFreq ?? 4000;
  const gain   = ctx.createGain();
  gain.gain.setValueAtTime(vol, startT);
  gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur);
  src.connect(hp); hp.connect(gain);
  gain.connect(_seDest(ctx, dest));
  const stopAt = startT + dur + 0.05;
  src.start(startT); src.stop(stopAt);
  if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, src, hp, gain);
}
