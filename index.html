<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
<link rel="icon" type="image/png" href="android-touch-icon.png" sizes="192x192" />
<title>ギヨウザルーレット</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* セーフエリア: env()はJSから直接読めないためCSSカスタムプロパティ経由で公開 */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0f5c22;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
body {
  /* ノッチ・Dynamic Island・ホームインジケータ領域をパディングで除外 */
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}
h1 {
  display: none; /* スタートアップ画面はCanvasで描画するため常時非表示 */
}
canvas {
  display: block;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 3px #c8a800;
  touch-action: none; /* スクロール・ズームを完全に無効化してタッチ遅延を排除 */
  /* will-change: filter はJS側で必要な間だけ付ける（_setGrayFilter参照）。
     常時付けるとフィルターが掛かっていない間もフィルター用の合成パスが維持され、
     dpr2の全画面ぶんのコストが毎フレーム乗りうる。実機ではdpr=1にすると
     キング戦の引っかかりがほぼ消えたため、GPU側の負荷が効いていることは確定している */
}
/* ブラウザ標準のフォーカスリングを消す。canvasは外付けキーボードのkeydownを
   ページへ配送させるためtabIndex=-1でフォーカス可能にしてあり（_ensureCanvasFocus
   参照）、そのままだと画面の黄色い枠の外側にブラウザ既定のフォーカス枠が重なる。
   フォーカス自体は機能上必要なので外さず、輪郭の描画だけを止める。
   tabIndex=-1はTab移動の対象外なので、表示を消しても操作の手掛かりは失われない。
   outlineとfocus-visibleを併記するのは、どちらが効くかがブラウザで異なるため */
canvas:focus,
canvas:focus-visible { outline: none; }
/* 横向き小型画面: タイトルを非表示にしてキャンバスを最大化 */
@media (max-height: 480px) and (orientation: landscape) {
  h1 { display: none; }
}
/* キャンバスラッパー */
#canvas-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
}
</style>
</head>
<body>
<h1>ギヨウザルーレット</h1>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<script>
'use strict';
/*! ギヨウザルーレット | MIT License | Copyright (C) 2026 Michiyasu ODAKI | https://github.com/odaki/giyouza */

/* ════════════════════════════════════════════════════════════════
   目次 (Table of Contents)
   ────────────────────────────────────────────────────────────────
   ■ 定数              canvas・DPR・カラー・サイズ・当たり判定テーブル
                        全画面ボタン定数（FS_SUPPORTED・Path2D等）
   ■ キャッシュ・プール  オブジェクトプール・文字列キャッシュ・LUT
   ■ ゲーム状態         フェーズ・矢・コイン・ビートシンク変数群
   ■ 実績システム        実績定義・localStorage キー
   ■ UI レイアウト定数   ボタン・BETバー座標定数
   ■ Audio System       AudioContext・BGM・レートランプ・ビートパルス
   ■ 効果音             playSE
   ■ 永続化             localStorage 読み書き・スキーマチェック
   ■ Startup Jingle     スタートジングルスケジューラ
   ■ Init               ゲーム初期化・リセット
   ■ 中当たり退場        アウトロ（中当たりエフェクトの引き上げ）
   ■ コイン・BET        clampBet・changeBet・calcPayout
   ■ Update             毎フレーム状態更新
   ■ 勝利エフェクト      花火・ウヨウヨ・落下ギヨウザ・ウザウザ
                        ギウギウ・ギギギギ・ヨヨヨヨ・ウウウウ
                        ザザザザ・ギョギョ
   ■ 画面エフェクト      ギザギザ・ウザウザフラッシュ
   ■ キング 出現予告     こんがり蓄積からの登場演出
   ■ キング 戦闘        コール＆レスポンス・的（ミニリール）・勝敗
   ■ こんがり達成退場    bossVictoryOutro
   ■ 真エンディング      テーマ曲・エンドロール
   ■ サウンドテスト      SE/BGM の試聴一覧
   ■ ドラムパッド        4x4パッド・パターンシーケンサ（ルーパー）
   ■ 吉祥雲 / 獅子
   ■ Draw helpers       outText・easeOutBack・roundRect・_drawBtnBg
   ■ Main draw          draw() メインループ描画
   ■ 描画関数群          BETボタン・的・矢・コインヘッダ・BETバー等
   ■ Startup Screen     スタート画面
   ■ Loop / Input       ゲームループ・入力ハンドラ
   ■ キャンバス初期化    fitCanvas（セーフエリア対応）
   ■ 全画面切替         toggleFullscreen・onFsChange
   ════════════════════════════════════════════════════════════════ */

/* ════════════════ 定数 ════════════════ */

/* ── デバッグ用URLパラメータの一元パース ──
   デバッグ用URLパラメータはここだけで解釈する。使う場所ごとにURLSearchParamsを作ると、
   has/getの使い分けや既定値の扱いが散らばるので入口を1つにまとめる。
   本番プレイではどのフラグも立たない。
   _dbgFlag: 有無だけを見るもの / _dbgNum: 数値。無指定なら第2引数を返す

   有無フラグ: portrait（縦レイアウトを強制）/ cheatpanel（チートパネル）/ perf（性能オーバーレイ）
               soundtest（サウンドテストを常時解禁）/ mark（焦げ跡の当たり判定を可視化）
               nooc（OffscreenCanvas非対応の経路）/ noelev（無音<audio>の昇格を止める）
               noresblur（結果文字のグローを外す）
   数値:       dpr（実解像度倍率）/ king（キング蓄積の初期値）/ lat・jlat・sepad（音の遅延較正）
               perfms（性能オーバーレイのスパイク閾値ms） */
const _DBG_QUERY = new URLSearchParams(location.search);
const _dbgFlag = name => _DBG_QUERY.has(name);
const _dbgNum  = (name, fallback = null) => {
  const v = parseFloat(_DBG_QUERY.get(name));
  return isNaN(v) ? fallback : v;
};

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false }); // 毎フレーム全面を塗るため不透明化（ページとの合成コスト削減）
/* 背景を別canvasへ分けて重ねる案（レイヤー分割）は採らない。実装して実機A/Bまで確認した
   うえでの結論（2026-08-15）。
   理由: 分離すると本体canvasを透明にする必要があり（不透明のままでは背後が見えない）、
   「全画面のテクスチャ転送1回」を「全画面のクリア＋合成時の全画面ブレンド」に置き換える
   だけになる。しかもこのゲームは前景が毎フレーム全画面ぶん変化するので、レイヤー分割本来の
   利点（変化しない領域を再ラスタライズしない）がそもそも効かない。
   実機ではgapが有無どちらも30〜35msで差が出なかった。再挑戦しないこと。
   塗る量を減らしたいなら実解像度側で下げる（_RS_* の自動制御を参照） */
/* 外付けキーボードのkeydownをページのJSへ届けるための下準備。
   hardware keydownが配送されるには、ページ内のフォーカス可能な要素に実際に
   フォーカスが当たっている必要がある。このゲームはcanvas1枚だけのUIなので、
   何もしなければタップしてもどこにもフォーカスが当たらず、キーボードを繋いでも
   keydownが1つも届かない。canvasをtabIndex=-1でフォーカス可能にし、タップの
   たびに取り直す（_ensureCanvasFocus参照）。
   キーボード操作はスペース（発射・段送り）と左右矢印（BET変更）で使う */
canvas.tabIndex = -1;
function _ensureCanvasFocus() {
  /* 既にフォーカスが当たっているなら何もしない。focus()はフォーカス移動が無くても
     スタイル・レイアウトの再計算やイベント発行を誘発しうるので、毎タップ無条件には
     呼ばない（タップしたフレームだけ30〜60ms伸びる原因になる）。
     フォーカスが外れたときだけ取り直せば目的は達成できる */
  if (document.activeElement === canvas) return;
  const _t0 = PERF_ON ? performance.now() : 0;
  try { canvas.focus({ preventScroll: true }); } catch(_e) { try { canvas.focus(); } catch(_e2) {} }
  if (PERF_ON) _perfMark('focus', _t0);
}

/* タッチデバイス判定 & 向き */
const IS_TOUCH    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
/* ?portrait URL パラメータでデスクトップからでも縦画面テスト可能 */
const _forcePortrait = _dbgFlag('portrait');
const IS_PORTRAIT = _forcePortrait || (IS_TOUCH && window.innerWidth < window.innerHeight);

const W = IS_PORTRAIT ? 420  : 1060;
const H = IS_PORTRAIT ? 820  : 560;
/* ?cheatpanel で画面下端にタップ式のチートパネルを出す。チート操作の唯一の入口で、
   キーボードによるチートは持たない。iOS Safariに外付けキーボードを繋いだ場合、
   修飾キーを含むkeydownがページへ届かないことがあり、キーボードを前提にすると
   実機でチートが使えないため、主入力手段であるタップに揃えてある。
   本番プレイでは?cheatpanelを付けない限り描画も判定も走らない
   （?king= 等の他のデバッグ用URLパラメータと同じ位置づけ） */
const CHEAT_PANEL_ON = _dbgFlag('cheatpanel');
/* ?soundtest: 真エンディング未視聴でもサウンドテストのボタンを出す（調査・調整用）。
   本来は視聴後に解禁される隠し要素だが、セーブを消した直後などに音を確かめたい
   ことがあるため、既存の?cheatpanel等と同じURLフラグの作法で抜け道を用意する */
const SOUND_TEST_FORCE = _dbgFlag('soundtest');
const CHEAT_PANEL_BTNS = [
  { id: 'fever',  label: 'FEVER' },
  { id: 'slow',   label: 'SLOW'  },
  { id: 'clr',    label: 'CLR'   },
  { id: 'allach', label: 'ACH'   },
  { id: 'gi',     label: 'ギ'    },
  { id: 'yo',     label: 'ヨ'    },
  { id: 'u',      label: 'ウ'    },
  { id: 'za',     label: 'ザ'    },
];
function _cheatPanelRect(i) {
  const h = 26, gap = 2;
  const w = (W - gap * (CHEAT_PANEL_BTNS.length - 1)) / CHEAT_PANEL_BTNS.length;
  return { x: i * (w + gap), y: H - h, w, h };
}
function _runCheatPanelAction(id) {
  if (id === 'fever') { _cheatFeverQueued = true; return; }
  if (id === 'slow') {
    _cheatSlowQueued = _cheatSlowQueued !== null ? null : !isSlowSpin;
    return;
  }
  if (id === 'clr') {
    try { localStorage.clear(); } catch(_e) {}
    location.reload();
    return;
  }
  if (id === 'allach') {
    /* こんがり以外の実績を全て達成状態にする（キングギヨウザ出現条件のテスト用。
       こんがり自体はキングギヨウザ討伐でのみ解除される最後の実績なので対象外
       ＝_allAchExceptKongariDoneと同じ判定基準）。
       最大18件が同一フレームで解除されると実績解除音が完全に重なって割れるので、
       90msずつずらして鳴らし、マスターリミッター任せにしない */
    let i = 0;
    for (const a of ACHIEVEMENTS) if (a.id !== KONGARI_ACH_ID) { unlockAch(a.id, i * 0.09); i++; }
    return;
  }
  const charMap = { gi: 'ギ', yo: 'ヨ', u: 'ウ', za: 'ザ' };
  if (charMap[id] && phase === 'idle' && curIdx < 4) cheatShoot(charMap[id]);
}
function drawCheatPanel() {
  if (!CHEAT_PANEL_ON) return;
  ctx.save();
  ctx.font = `bold 11px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
    const r = _cheatPanelRect(i);
    ctx.fillStyle = 'rgba(200,0,80,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(CHEAT_PANEL_BTNS[i].label, r.x + r.w / 2, r.y + r.h / 2);
    _drawPressFlash(r, 0); // 面が直角なので光も直角
  }
  ctx.restore();
}

/* ?perf URL パラメータで、実機の「どこで詰まっているか」を数値で見るオーバーレイ。
   引っかかりの原因を推測で潰していくのをやめ、実機の数字で判断するために置く
   （Web Inspectorを繋がなくても画面だけで読める。?cheatpanel等と同じ位置づけで、
   パラメータを付けない限り計測も描画も一切走らない）。
   見方: frame work が16.7msを超えたフレームがあれば、その回のどれかが犯人。
   tap はタップ処理そのもの、resOC はロック時の結果文字焼き込み（shadowBlur使用）、
   wheel は次トライ用ホイールの事前構築（的1個ぶん）、lsW はlocalStorage書き出し。 */
const PERF_ON = _dbgFlag('perf');
/* ?mark: Safari Web Inspector のタイムラインへ目印を打つ（console.timeStamp）。
   ?perf では原理的に見えないもの——ラスタライズと合成のコスト——を追うためのもの。
   canvasの描画は呼び出しとラスタライズが別で、後者はフレームの合成時に来るため
   performance.now では捕まらない（この落とし穴に2度はまっている）。
   Web Inspectorのタイムラインにはそれが出るので、そこに「いま射った」という
   目印を並べれば、スパイクのフレームで何のペイントが走っているかを対照できる。
   オーバーレイ（?perf）は自身が焼き込みを起こすので、収録時は付けずにこちらだけ使う */
const _MARK_ON = _dbgFlag('mark');
const _mark = (_MARK_ON && typeof console !== 'undefined' && console.timeStamp)
  ? name => { try { console.timeStamp(name); } catch (_e) {} }
  : () => {};
const _PERF_FONT = '11px monospace';
const _PERF_MAX_HOLD_MS = 5000; // 最大値の保持時間。古い記録は捨てて直近の状態を映す
/* 計測対象の定義。ここに1行足して呼び出し側で_perfMark(key, t0)すれば、表示も
   スパイクのタグ付けも自動で追従する（定義を1箇所に集約し、項目を増やすときに
   複数箇所を触らなくて済むようにしてある）。
   line: 表示のまとめ方（同じ番号は1行に並ぶ）。withLast: 直近値も併記するか */
const _PERF_PROBES = [
  { key: 'drawOnly', label: 'drawOnly', line: 0, withLast: true, note: '追加draw' },
  { key: 'tap',      label: 'tap',      line: 1 }, // handleGameClick（発射処理そのもの）
  { key: 'touch',    label: 'touch',    line: 1 }, // touchstartハンドラ全体（tapの外側も含む）
  { key: 'unlk',     label: 'unlk',     line: 1 }, // 音声アンロック（毎タップ呼ばれる）
  { key: 'focus',    label: 'foc',      line: 1 }, // canvas.focus()（フォーカスが外れている時だけ）
  { key: 'elev',     label: 'elev',     line: 1 }, // AVAudioSession昇格（成功するまで毎タップ）
  { key: 'resOC',    label: 'resOC',    line: 2, withLast: true, note: 'blur' },
  { key: 'pre',      label: 'wheel',    line: 3, withLast: true, note: '事前構築' },
  { key: 'ls',       label: 'lsW',      line: 4, withLast: true },
  { key: 'bar',      label: 'bar',      line: 4, withLast: true, note: 'BET' },
  { key: 'fx',       label: 'fx',       line: 5, withLast: true, note: '演出' },
  { key: 'whl',      label: 'whl',      line: 5, withLast: true, note: '的' },
  { key: 'txt',      label: 'txt',      line: 5, withLast: true, note: '文字' },
  { key: 'king',     label: 'king',     line: 5, withLast: true, note: 'ボス描画' },
];
const _perf = {};
for (const p of _PERF_PROBES) _perf[p.key] = { last: 0, max: 0, at: 0, ranAt: 0 };
/* 突出したフレーム間隔（スパイク）だけを、そのとき何が起きていたかと一緒に残す。
   「ごく稀に1的目の発射で引っかかる」のような低頻度の事象は、最大値だけ見ていても
   前後関係が分からないため。直近3件を新しい順に表示する。
   sinceInit＝トライ開始からの経過msなので、1的目付近で起きているかがそれで分かる。
   tags＝そのスパイクと同じ時間帯に走っていた計測対象（何も付かなければ、
   詰まっていたのはこちらのJSの外側＝GCやブラウザ側の処理） */
const _PERF_SPIKE_MS = 25;   // これを超えるフレーム間隔を記録する（通常は16.7）
const _PERF_SPIKE_KEEP = 3;
const _perfSpikes = [];
let _lastInitAt = 0;         // 直近のinit()時刻（トライ開始）
let _perfLastSpikeAt = 0; // 直近スパイクの時刻（間隔Δの算出用）
function _perfLogSpike(gapMs) {
  const now = performance.now();
  const tags = [];
  for (const pr of _PERF_PROBES) {
    const e = _perf[pr.key];
    if (e.ranAt > 0 && now - e.ranAt <= gapMs + 4) tags.push(pr.key);
  }
  /* 直前のスパイクからの間隔。周期性のある事象は、この値が既知の周期
     （拍=約395ms、ボスBGMの1ループ、1秒など）に一致するかどうかで発生源を絞れる。
     「BGMの一周と同期して詰まる」ように感じられてもBGMを止めると再現する、といった
     切り分けには周期の実測値そのものが要る */
  _perfSpikes.unshift({
    gap: gapMs,
    phase: phase,
    idx: curIdx,
    since: _lastInitAt > 0 ? Math.round(now - _lastInitAt) : -1,
    delta: _perfLastSpikeAt > 0 ? Math.round(now - _perfLastSpikeAt) : -1,
    tags: tags.join(','),
  });
  _perfLastSpikeAt = now;
  if (_perfSpikes.length > _PERF_SPIKE_KEEP) _perfSpikes.length = _PERF_SPIKE_KEEP;
}
/* rAFが実際に何回/秒呼ばれているかを数える。「JSは予算内なのにフレーム間隔が
   伸びる」ときの切り分け用: JSの合計時間とrAFの実測レートを突き合わせれば、
   残りがブラウザ側（塗り直し・GPU転送・合成）だと確定できる */
let _perfFps = 0, _perfFrameCount = 0, _perfFpsT = 0;
function _perfCountFrame(t) {
  _perfFrameCount++;
  if (_perfFpsT === 0) { _perfFpsT = t; return; }
  if (t - _perfFpsT >= 1000) {
    _perfFps = _perfFrameCount * 1000 / (t - _perfFpsT);
    _perfFrameCount = 0; _perfFpsT = t;
  }
}
function _perfMark(key, t0) {
  const e = _perf[key], now = performance.now(), ms = now - t0;
  e.last = ms; e.ranAt = now;
  if (ms >= e.max || now - e.at > _PERF_MAX_HOLD_MS) { e.max = ms; e.at = now; }
}
/* オーバーレイは canvas ではなく DOM 要素へ出す。

   **計測器が計測対象を重くしてはいけない**、というのがこの設計の要点。
   canvasに文字を描く方式（毎フレームのfillTextでも、内容が変わったときだけ
   OffscreenCanvasへ焼く方式でも）は、呼び出しとラスタライズが別のタイミングで
   走り、コストがフレームの合成時に来るためperformance.nowでは捕まらない。

   このゲームの高速化は全て「一度描いて焼いておき、あとは drawImage で貼る」に
   依存している（背景・ホイール・グロー・文字・ボス・各種スプライト）。
   焼き先をOffscreenCanvasだけに頼ると、未対応環境（iOS 16.4未満）では最適化が
   まるごと無効になり、毎フレーム直描き＋shadowBlurという最も遅い経路へ落ちる
   （キング戦は起動すらできない）。
   通常の<canvas>要素は古くからdrawImageのソースとして使えるので、未対応環境では
   それを焼き先にする。DOMには挿さない（描画面としてのみ使う）。 */
/* ?nooc: OffscreenCanvas が無い環境（iOS 16.4未満）の経路を実機で試すためのフラグ。
   コピーしたHTMLでOffscreenCanvasを消して確かめる、といった手間を無くす */
const _HAS_OC = !_dbgFlag('nooc') && (typeof OffscreenCanvas !== 'undefined');
const _CACHE_OK = _HAS_OC || typeof document.createElement === 'function';
function _mkCache(w, h) {
  const cw = Math.max(1, Math.ceil(w)), ch = Math.max(1, Math.ceil(h));
  if (_HAS_OC) return new OffscreenCanvas(cw, ch);
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  return c;
}

/* ── 静的レイヤーキャッシュ ──
   雲・獅子は毎フレーム同じパスを描くことになる。OffscreenCanvas に事前描画しておき、
   drawImage() 1回で済ませる */
let _staticLayerCanvas = null; // 雲 + 獅子（PC のみ）を合成した透明オフスクリーン

function _prebuildStaticLayers() {
  /* OffscreenCanvas 未対応の古いブラウザではスキップ（通常描画にフォールバック） */
  if (!_CACHE_OK) return;
  const oc  = _mkCache(W * _dpr, H * _dpr);
  const oc2 = oc.getContext('2d');
  oc2.scale(_dpr, _dpr);

  /* 背景グラジェントも焼き込み（draw() 冒頭の全画面 fillRect を排除） */
  const bg = oc2.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#145c24');
  bg.addColorStop(0.5, '#0f5020');
  bg.addColorStop(1, '#0a3d18');
  oc2.fillStyle = bg;
  oc2.fillRect(0, 0, W, H);

  /* 雲を描く */
  for (const c of CLOUDS) _drawCloudTo(oc2, c.x, c.y, c.s, c.a, c.r);

  /* PC レイアウトのみ獅子を合成。
     獅子を一時 OffscreenCanvas に不透明で描いてから 0.6 alpha で貼り付け。
     oc2 に直接 globalAlpha=0.6 で描くと内部パーツもすべて半透明（X線状態）になるため
     この2段階方式で「内部は不透明・全体を 0.6 でブレンド」を実現する。 */
  if (!IS_PORTRAIT) {
    const lc  = _mkCache(W * _dpr, H * _dpr);
    const lc2 = lc.getContext('2d');
    lc2.scale(_dpr, _dpr);
    _drawShishiTo(lc2, 78,  360, 0.82, false);
    _drawShishiTo(lc2, 983, 360, 0.82, true);
    oc2.globalAlpha = 0.6;
    oc2.drawImage(lc, 0, 0, W, H); // CSSピクセルサイズを明示（省略するとDPR倍になり消える）
    oc2.globalAlpha = 1;
  }
  /* 上下の金帯も焼き込み（毎フレームの fillRect×4 を排除） */
  oc2.fillStyle = Y;
  oc2.fillRect(0, 0, W, 6); oc2.fillRect(0, H - 6, W, 6);
  oc2.globalAlpha = 0.4;
  oc2.fillRect(0, 8, W, 3); oc2.fillRect(0, H - 11, W, 3);
  oc2.globalAlpha = 1;
  _staticLayerCanvas = oc;
}

/* ── 文字列キャッシュ（coins/bet が変わった時だけ再計算） ──
   fmt() = toLocaleString('ja-JP') と measureText は毎フレーム呼ぶには重い。
   値が変わった時だけ更新する遅延キャッシュにする。              */
let _cachedCoinsStr  = '';     // fmt(Math.round(coinsDisp))
let _cachedBetStr    = '';     // fmt(bet)
let _cachedBestStr   = '';     // `BEST ${fmt(bestCoins)}`
let _cachedBetIdx    = -1;     // BET_OPTIONS.indexOf(bet)
let _cachedBetNumW   = 0;      // measureText(fmt(bet)) の width
let _cachedBetLabelW = 0;      // measureText('BET') の width — 起動後不変

let _lastBetCached   = -1;

let coinsDisp = 0; // 実値 coins に向けてeaseOut追従する表示用float

const COIN_DISP_MIN_RATE = 0.5;

/* BET ラベル幅（'BET' 文字列・フォント固定）を一度だけ計測して保存 */
function _initBetLabelWidth() {
  ctx.save();
  ctx.font = IS_PORTRAIT
    ? `bold 24px ${FONT_MIN}`
    : `bold 28px ${FONT_MIN}`;
  _cachedBetLabelW = ctx.measureText('BET').width;
  ctx.restore();
}

/* ── 大型テキストのプリレンダ（毎フレームのグリフラスタライズを排除） ──
   コイン数値(60px)・BET数値(42/46px)は文字列が変わった時だけ OC に描画し、
   毎フレームは drawImage 1回にする。カウントアップアニメ中は毎フレーム
   再描画になるが、静止時（大半の時間）のラスタライズコストがゼロになる。 */
const _COINS_FONT   = `bold 60px ${FONT_MIN}`;
const _COINS_TEXT_H = 72;
let _coinsTextOC = null, _coinsTextW = 0, _coinsTextColor = '', _coinsTextStr = '';
function _ensureCoinsTextOC(color) {
  if (!_CACHE_OK) return null;
  if (_coinsTextOC && _coinsTextStr === _cachedCoinsStr && _coinsTextColor === color) return _coinsTextOC;
  ctx.save(); ctx.font = _COINS_FONT;
  const tw = Math.ceil(ctx.measureText(_cachedCoinsStr).width) + 8;
  ctx.restore();
  /* 幅が足りない時のみ再確保（桁数増加時）。既存が大きければ clearRect で再利用 */
  if (!_coinsTextOC || _coinsTextOC.width < tw * _dpr) {
    _coinsTextOC = _mkCache(tw * _dpr, _COINS_TEXT_H * _dpr);
  }
  const c = _coinsTextOC.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, _coinsTextOC.width, _coinsTextOC.height);
  c.scale(_dpr, _dpr);
  c.font = _COINS_FONT;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = color;
  c.fillText(_cachedCoinsStr, tw / 2, _COINS_TEXT_H / 2);
  _coinsTextW = tw; _coinsTextColor = color; _coinsTextStr = _cachedCoinsStr;
  return _coinsTextOC;
}

const _BET_FONT   = IS_PORTRAIT
  ? `bold 42px ${FONT_MIN}`
  : `bold 46px ${FONT_MIN}`;
const _BET_TEXT_H = 56;
let _betTextOC = null, _betTextStr = '';
function _ensureBetTextOC() {
  if (!_CACHE_OK) return null;
  if (_betTextOC && _betTextStr === _cachedBetStr) return _betTextOC;
  const tw = Math.ceil(_cachedBetNumW) + 8; // _updateDisplayCaches で計測済み
  if (!_betTextOC || _betTextOC.width < tw * _dpr) {
    _betTextOC = _mkCache(tw * _dpr, _BET_TEXT_H * _dpr);
  }
  const c = _betTextOC.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, _betTextOC.width, _betTextOC.height);
  c.scale(_dpr, _dpr);
  c.font = _BET_FONT;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillStyle = Y;
  c.fillText(_cachedBetStr, 4, _BET_TEXT_H / 2);

  return _betTextOC;

/* drawBottomBar/drawCoinHeader の先頭で呼ぶ。変化がなければ即 return */
function _updateDisplayCaches() {
  /* coinsDisp の整数値が変化した時のみ文字列を再生成（毎フレーム fmt() を呼ばない） */
  const _coinsDispInt = Math.round(coinsDisp);
  if (_coinsDispInt !== _lastCoinsDispCached) {
    _lastCoinsDispCached = _coinsDispInt;
    _cachedCoinsStr      = fmt(_coinsDispInt);
  }
  if (bet !== _lastBetCached) {
    _lastBetCached  = bet;
    _cachedBetStr   = fmt(bet);
    _cachedBetIdx   = BET_OPTIONS.indexOf(bet);
    /* bet 数字幅を計測（フォントサイズはレイアウトに合わせる） */
    ctx.save();
    ctx.font = IS_PORTRAIT
      ? `bold 42px ${FONT_MIN}`
      : `bold 46px ${FONT_MIN}`;
    _cachedBetNumW = ctx.measureText(_cachedBetStr).width;
    ctx.restore();
  }
  if (bestCoins !== _lastBestCached) {
    _lastBestCached = bestCoins;
    _cachedBestStr  = `BEST ${fmt(bestCoins)}`;
  }
}

/* ── アイテムオブジェクトプール ──
   makeItem() が毎回 Array.from + 5個のオブジェクト生成＋HSL文字列を生成するのを防ぐ。
   greens配列も事前確保してフィールドをリセットするだけで再利用する。 */
const _ITEM_POOL_SIZE = 300;
function _makePoolItem() {
  return {
    x:0, y:0, vx:0, vy:0, rot:0, rotSpd:0, size:0, age:0, _flush:false,
    skinL:'', skinD:'', bodyGrd:null, _spr:null, _dead:true, _rotPhase:0,
    greens: [{dx:0,dy:0,rx:0,ry:0,a:0,color:''},{dx:0,dy:0,rx:0,ry:0,a:0,color:''},
             {dx:0,dy:0,rx:0,ry:0,a:0,color:''},{dx:0,dy:0,rx:0,ry:0,a:0,color:''},
             {dx:0,dy:0,rx:0,ry:0,a:0,color:''}],
  };
}
const _itemPool = [];
for (let _i = 0; _i < _ITEM_POOL_SIZE; _i++) _itemPool.push(_makePoolItem());
function _itemAlloc() {
  for (let i = 0; i < _itemPool.length; i++) {
    if (_itemPool[i]._dead) return _itemPool[i];
  }
  /* 満杯: 生きているエントリを乗っ取ると items 等の配列に同一オブジェクトが
     二重登録され物理・描画が破綻する。新規生成してプールに加える（レアな1回のみGC） */
  const g = _makePoolItem();
  _itemPool.push(g);
  return g;
}
/* _deadify: プールオブジェクトを返却するコールバック（swapRemove の onRemove に渡す）
   モジュールスコープ定数なので毎フレーム新しいクロージャが生成されない */
const _deadify      = o => { o._dead = true; };
/* プール由来のオブジェクトを持つ配列を空にする。**返却してから空にする**という
   不変条件をここに閉じ込める。
   片方だけ書くと、返さなかったスロットが生きたまま残って再利用されず、_itemAlloc等が
   新規生成を続けてプールが際限なく伸びる（iOS Safariのメモリを圧迫して処理落ち・音途切れに
   なる欠陥クラス）。配列を捨てる場所では必ずこれを通すこと。
   release は既定で _deadify。ghosts のようにキャンバスを別プールへ返す必要があるものは
   専用の返却手続きを渡す。
   `arr = _releaseAll(arr)` の形で使い、返却と空にするのを1文にする */
function _releaseAll(arr, release = _deadify) {
  if (arr) for (const o of arr) release(o);
  return [];
}
/* items の y昇順ソート: 毎フレームほぼ整列済みのため挿入ソートが実質O(n)。
   Array.sort のコンパレータ呼び出しオーバーヘッドも排除できる */
function _insertionSortY(a) {
  for (let i = 1; i < a.length; i++) {
    const v = a[i], vy = v.y;
    let j = i - 1;
    while (j >= 0 && a[j].y > vy) { a[j + 1] = a[j]; j--; }
    a[j + 1] = v;
  }
}
/* 毎フレーム呼ばれる swapRemove の pred を定数化してクロージャ生成ゼロに */
const _predParticle  = p => p.life > 0 && p.r > 0.3;
const _predTimer     = p => p.timer > 0;
const _predAlive     = o => o.alive;
const _predLife      = o => o.life > 0;
const _predUzaText   = t => t.age < t.life;
const _predRainDrop  = r => r.ripple ? r.life > 0 : r.y < H + 30;
/* H・W は起動後不変なので定数クロージャとして安全に使える */
const _predItem     = g => { const r = g.size * 0.52; return g.y < H+120 && g.x+r > 0 && g.x-r < W; };
/* done フェーズで毎フレーム呼ばれる allShown 判定用 pred */
const _predWheelShown = w => !w.result || w.resultPop >= 1;

/* 発射SE用: Cメジャーアルペジオ音程テーブル（4本の矢 = C→E→G→C'）
   モジュールスコープに置いて playSE 呼び出しごとの配列生成を排除 */
const _SHOOT_ARPEGIO = [noteHz('C',5), noteHz('E',5), noteHz('G',5), noteHz('C',6)];
/* 通常モードで鳴る音はこの発射アルペジオだけ（当たり時は配当SEが加わる）。
   矢の着弾音は持たない。到着の手応えは spawnImpact の映像が担う。
   着弾音を足したくなったときのために、避けるべき形を記録しておく:
   - 矩形波のコツン（E4→G3）を発射の67ms後に鳴らす形は採らない。発射音の軽快さを
     担う3〜5kHz帯で発射音自身の2.8〜10倍の倍音を出し、RMSでも1.67倍になるため、
     「上から雑音が被さる」聞こえ方になる。
   - 着弾音の音程を矢ごとに上昇させる形も採らない。固定音程の反復は耳が
     「打楽器」として処理して旋律の線から外れるが、変えると耳が8音すべてを
     1本の旋律として追い始め、着弾音は必ず直前の発射音より低いため
     「登るたびに引き戻されるジグザグ」に聞こえる。
   足すならごく短く高い微小なティック（三角波・低音量）から試す。 */
/* 超大当たり連続コイン音: Cメジャーペンタトニック上昇走句（BGMの調に整合） */
const _COIN_RUN = [noteHz('C',6), noteHz('D',6), noteHz('E',6), noteHz('G',6),
                   noteHz('A',6), noteHz('C',7), noteHz('D',7), noteHz('E',7)];

/* ── 毎フレーム生成を避けるための描画用ルックアップテーブル ──
   テンプレートリテラルによる毎フレーム文字列アロケーションを排除する。
   ① ビートリングの strokeStyle: bp(0〜1) を 32段階に量子化
   ② _syncBarColor の動的 rgb 文字列: r(0〜1) を 64段階に量子化        */
const _BEAT_RING_COLORS = /* 32段階 rgba(245,208,32, 0〜0.55) */
  Array.from({length:32}, (_,i) => `rgba(245,208,32,${((i/31)*0.55).toFixed(4)})`);
const _BEAT_BORDER_COLORS = /* ミュート時枠線: rgba(245,208,32, 0.3〜0.85) */
  Array.from({length:32}, (_,i) => `rgba(245,208,32,${(0.3 + (i/31)*0.55).toFixed(4)})`);
/* BEAT BONUS 虹色LUT: 120段階×3°=360° 起動時1回のみ生成、毎フレームはインデックス参照のみ（GCゼロ） */
const _RAINBOW_COLORS = Array.from({length:120}, (_,i) => `hsl(${Math.round(i*3)},100%,62%)`);

const FEVER_PROB_NORMAL = 0.10; // 通常大当たり後にフィーバーへ移行する確率（超大当たりより低い）

const KING_GYOZA_THRESHOLD = 1000; // 出現に必要な画面外退場ギヨウザ累計

   窓が狭いと段が当たり1回より細くなり、1回の当たりで段をまたいで飛ぶ。40%＝600点の窓なら
   いちばん狭い段でも大当たり1回ぶんが残る（KING_OMEN_EXPの定義部の帯を参照）。

   一致させてあり、蓄積＝取り込まれたギヨウザの数という筋の土台になっている */
const KING_OMEN_RATIO      = 0.4;
/* 予兆の強まり方の指数。進み具合 t をそのまま使わず u = t^EXP を全ダイヤルへ通す。

   つまみ。1.0（直線）だと段が等間隔になり、深い側が早く来すぎる。

     2個 764-899（135点＝中当たり6.7回・大当たり1.3回）
     3個 899-1000（101点＝中当たり5.0回・大当たり1.0回）

   実績が解除される時点で蓄積がとっくに閾値を超えている。蓄積だけを見ると進み具合が1に
   張り付き、いきなり最終段が出て次のトライでボスが始まる＝浅い段が一度も起きない。

const KING_OMEN_ACH_SPAN   = 4;
/* 敗北後に蓄積を戻す割合。**必ず KING_OMEN_RATIO より下にすること。**

   また気配が立ち上がるほうが、撃退できたという手応えが残る */

   t が小さいと軌道がほとんど曲がらず流れ星に見え、大きいと中心まで来て弾ける。
   1本の径の変化で両端が出るので、見え方ごとの分岐を持たない。

   使うギヨウザは本番の収束・退場と同じ makeItem。予兆だけ別のキャラクター（天使の輪と
   尾を持つウウウウの霊）にすると、直後に現れるキング戦の演出と繋がらない。

   結果任せになる。ここで効くのはまさに最接近距離なので、径を直接与える形にする */
const KING_OMEN_FX_LIFE  = [70, 130];     // 寿命（フレーム）

/* ── アクティブホイールのグロー光輪: bp(0-1) を 8段階に量子化 ──
   スプライトは「グローのみ」を含む（shadowOffset トリックで本体リングを画面外に置き、
   影＝グローだけをスプライト内に落とす）。クリスプな 3px リング本体は
   毎フレーム stroke で描く（ブラーなしの stroke は安価）。 */

  if (!_CACHE_OK) return null;
  const arr = [];
  const OFF = 4096; // 本体リングを画面外へ追い出すオフセット
  for (let i = 0; i < _GLOW_LEVELS; i++) {
    const blur = 50 + (i / (_GLOW_LEVELS - 1)) * 40;
    const half = Math.ceil(WR + 2 + blur * 0.9 + 8);
    const oc = _mkCache(half * 2, half * 2);
    const c  = oc.getContext('2d');
    c.translate(half - OFF, half);
    c.shadowColor = Y; c.shadowBlur = blur; c.shadowOffsetX = OFF;
    c.strokeStyle = Y; c.lineWidth = 3;
    c.beginPath(); c.arc(0, 0, WR + 2, 0, Math.PI * 2); c.stroke();
    arr.push({ oc, half });
  }
  return arr;
})();

/* ── ポインタ三角形スプライト: 状態別（inactive / locked / active×4段階） ──
   三角形はホイール中心基準のローカル座標で固定なので、
   バウンディングボックス＋グロー余白ぶんのスプライトに焼き込む。 */
const _PTR_PAD = 44; // グロー余白（最大blur36 + マージン）
function _buildPointerSprite(fill, glow, blur) {
  const bx0 = IS_PORTRAIT ? WR + 5 : -13;
  const by0 = IS_PORTRAIT ? -12    : -WR - 28;
  const bw  = IS_PORTRAIT ? 21 : 26;
  const bh  = IS_PORTRAIT ? 24 : 23;
  const cw = bw + _PTR_PAD * 2, ch = bh + _PTR_PAD * 2;
  const oc = _mkCache(Math.ceil(cw * _dpr), Math.ceil(ch * _dpr));
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.translate(_PTR_PAD - bx0, _PTR_PAD - by0); // ローカル座標 → スプライト座標
  if (blur > 0) { c.shadowColor = glow; c.shadowBlur = blur; }
  c.fillStyle = fill;
  c.beginPath();
  if (IS_PORTRAIT) { c.moveTo(WR+5,0); c.lineTo(WR+26,-12); c.lineTo(WR+26,12); }
  else             { c.moveTo(0,-WR-5); c.lineTo(-13,-WR-28); c.lineTo(13,-WR-28); }
  c.closePath(); c.fill();
  return { oc, ox: bx0 - _PTR_PAD, oy: by0 - _PTR_PAD, w: cw, h: ch };
}

/* ── 中当たりエフェクト用プール群 ──

   rainDrops:  最大レート20/frame×寿命30f ≈ 600 + 波紋20 → 800
   uzaTexts:   最大1/2f×寿命240f ≈ 120同時 → 160 */
function _makePool(size, factory) {
  const pool = [];
  for (let i = 0; i < size; i++) pool.push(factory());
  pool._factory = factory; // 満杯時の追加生成用
  return pool;
}
function _poolAlloc(pool) {
  for (let i = 0; i < pool.length; i++) if (pool[i]._dead) return pool[i];
  /* 満杯: 生存エントリの乗っ取りは配列二重登録を招くため新規生成（レアな1回のみGC） */
  const o = pool._factory();
  pool.push(o);
  return o;
}

/* ── パーティクル色レジストリ ──

const _partColorList = [];
const _partColorIdx  = Object.create(null);
function _partColorId(color) {
  let id = _partColorIdx[color];
  if (id === undefined) {
    id = _partColorList.length;
    _partColorList.push(color);
    _partColorIdx[color] = id;
  }
  return id;
}
/* プールから死んでいるエントリを確保して返す。満杯の場合は新規生成 */
function _partAlloc() {
  for (let i = 0; i < _partPool.length; i++) {
    if (_partPool[i]._dead) return _partPool[i];
  }
  /* 満杯: 生存エントリの乗っ取りは particles 配列二重登録を招くため新規生成（レアな1回のみGC） */
  const p = { x:0, y:0, vx:0, vy:0, color:'', life:0, r:0, _dead:true };

function spawnParticle(x, y, vx, vy, color, life, r) {

  p.x = x; p.y = y; p.vx = vx; p.vy = vy;

/* GC削減: filter()の代わりにswap-and-popでdeadな要素をインプレース除去
   pred がtrueの要素を保持する（filter同様の意味）
   onRemove（省略可）: 除去された要素に呼ぶコールバック。
     プールオブジェクトを返却する場合は _deadify を渡す。
   ホットループ内の条件分岐を排除するため onRemove の有無でパスを分岐する。 */
function swapRemove(arr, pred, onRemove) {
  if (onRemove) {
    for (let i = arr.length - 1; i >= 0; i--) {
      if (!pred(arr[i])) { onRemove(arr[i]); arr[i] = arr[arr.length-1]; arr.length--; }
    }
  } else {
    for (let i = arr.length - 1; i >= 0; i--) {
      if (!pred(arr[i])) { arr[i] = arr[arr.length-1]; arr.length--; }
    }
  }
}

/* 現在の audioCtx.currentTime におけるレートを解析的に返す */
function _getBgmRateJS() {
  if (_bgmRateDur <= 0) return _bgmRateTo; // 即時変化
  const p = Math.max(0, Math.min(1,
    (audioCtx.currentTime - _bgmRateStart) / _bgmRateDur));
  if (p >= 1) return _bgmRateTo;
  return _bgmRateFrom + (_bgmRateTo - _bgmRateFrom) * _easeF(p, _bgmRateEase);
}

function _bgmAccumReset() {
  _bgmAccumAudioTime = 0;
  _bgmAccumLastWall  = audioCtx ? audioCtx.currentTime : null;
  _bgmAccumLastPerf  = performance.now() / 1000;
}

function _bgmAccumStep() {
  if (!audioCtx || !bgmSource || _bgmAccumLastWall === null) return;
  const now = audioCtx.currentTime;
  const dt  = now - _bgmAccumLastWall;
  _bgmAccumLastWall = now;
  _bgmAccumLastPerf = performance.now() / 1000;
  if (dt <= 0) return;
  /* dt > 10s: タブ長時間非表示など AudioContext が止まっていたケース → スキップ
     jackpot/reach_jackpot SE（2〜2.5s）はここに含めず正常に積算する */
  if (dt > 10) return;
  /* bgmSource.playbackRate.value はランプ中に正しい値を返さないため JS 側で計算 */
  _bgmAccumAudioTime += dt * _getBgmRateJS();
}

/* getBeatPulse: 同一フレーム内で複数回呼ばれるためフレームキャッシュを使用 */
let _beatPulseCache = 0, _beatPulseCacheFrame = -1;
function getBeatPulse() {
  /* 同じフレーム内の2回目以降はキャッシュを返す
     _bgmAccumStep は update()先頭 または draw-only フレームの先頭で呼ばれ、
     _bgmAccumLastWall が更新されるとキャッシュが無効化される */
  if (_beatPulseCacheFrame === _bgmAccumLastWall) return _beatPulseCache;
  _beatPulseCacheFrame = _bgmAccumLastWall;
  const loopDur = _curQuantizedLoopDur();
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || loopDur <= 0) {
    return (_beatPulseCache = 0);
  }
  /* playbackRate変動を考慮した音声バッファ内位置を計算。
     _bgmAccumAudioTime は audioCtx.currentTime 基準なので outputLatency 分を引いて
     実際にスピーカーから出ている音に揃え、さらに描画パイプライン分だけ先読みする。
     rate を掛けるのは latency が壁時計秒だが offset は音声秒で評価するため。 */
  const rate      = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo; // ランプ中も正確に取得
  const rawPos    = _bgmAccumAudioTime + (_BEAT_DISPLAY_ADVANCE - _hwLatency) * rate;
  /* ループ量子化ドリフト対策: loopEnd はサンプル丸めされた実ループ長で割り切る。
     拍単位（BGM_BEAT）の判定自体はループ長（通常/ボスで異なる）に依存しない */
  const loopN     = Math.floor(rawPos / loopDur);
  const posInLoop = rawPos - loopN * loopDur;
  const ph = (((posInLoop % BGM_BEAT) + BGM_BEAT) % BGM_BEAT) / BGM_BEAT;
  return (_beatPulseCache = Math.pow(Math.max(0, 1 - ph * 2.5), 2)); // ~160ms で減衰（0.4拍）
}

/* 現在の入力タイミングがビートにどれだけ近いかを 0-1 で返す
   atPerfMs: 入力イベントの timeStamp（performance.now() 基準 ms、省略時は現在時刻）
   1=ジャスト, 0=最も外れている（1/4拍グリッドから半周期ずれ） */
/* 入力時刻を「聴こえている音」基準のバッファ内積算位置（秒・ループをまたいで単調増加）
   へ変換する。判定（calcSyncScore）とキング戦リズムシーケンサの量子化
   （_kingBuildSequence の間隔計算）が必ず同じ時計を使うための共通ヘルパー。
   別々に計算すると「JUSTを取ったタップが量子化スロットの境界に乗らない」という
   食い違いが起きる（採点はグリッドAに乗っているのに再生はグリッドBへ量子化される）。
   判定は「聴こえている音」を基準にする（-_hwLatency のみ適用）。
   表示先読み _BEAT_DISPLAY_ADVANCE は描画パイプライン補償なので判定には含めない
   — リング自体が表示遅延を経て光るため、見た目のピークと判定グリッドは体感上一致する。
   最後の積算tickから入力までの経過は performance クロック同士で補間する
   （出力タイムラインとスケジュールタイムラインを混在させると Bluetooth 遅延環境で
    extra が常に0へクランプされ、tick量子化バイアス＋ジッターが判定に乗る）。
   _JUDGE_TRIM（?jlat）は判定グリッドのみを較正する（表示には影響しない）。
   音声が使えない場合は null（呼び出し側が音声なしの動作へ退避する） */
function _bgmJudgePos(atPerfMs) {
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null) return null;
  const rate    = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo;
  const nowPerf = (atPerfMs ?? performance.now()) / 1000;
  const extra   = Math.max(0, Math.min(nowPerf - _bgmAccumLastPerf, 0.1)); // 最後のstepから入力までの差分
  return _bgmAccumAudioTime + extra * rate + (_JUDGE_TRIM - _hwLatency) * rate; // 聴取基準 + 判定較正
}

/* バッファ内位置 p（_bgmAccumAudioTime と同じ系）が出力へ送り出される
   audioCtx.currentTime を返す（キング戦シーケンサの先行スケジュール用）。
   _bgmAccumAudioTime は _bgmAccumLastWall 時点の値なので、currentTime ではなく
   そこを基準に外挿する（currentTime 基準にすると最大1フレーム分ずれる）。
   出力遅延の補正は入れない: 予約したSEもBGMと同じ出力経路を通って同じだけ遅れて
   聴こえるため、送り出しの時刻を揃えれば聴感上も揃う。
   レートランプ中（テープ演出）は将来の位置を線形外挿できないため null を返す。 */
function _bgmBufPosToCtxTime(p) {
  if (!audioCtx || _bgmAccumLastWall === null || _bgmRateRamping()) return null;
  const rate = _bgmRateTo;
  if (rate <= 0) return null;
  return _bgmAccumLastWall + (p - _bgmAccumAudioTime) / rate;
}

/* レートランプ（テープ演出）が「今まさに進行中」か。_bgmRateDur はランプ完了後も
   最後の値を保持したままなので、`_bgmRateDur > 0` だけでは一度でもランプを
   通した後は常に真になってしまう（_updateBossBgmTier と同じ判定式）。
   ランプ中は将来のバッファ位置を線形外挿できないため、シーケンサはこの間だけ
   組成を見送る */
function _bgmRateRamping() {
  return _bgmRateDur > 0 && audioCtx !== null &&
         (audioCtx.currentTime - _bgmRateStart) < _bgmRateDur;
}

function calcSyncScore(atPerfMs) {
  const loopDur = _curQuantizedLoopDur();
  const rawPos  = _bgmJudgePos(atPerfMs);
  if (rawPos === null || loopDur <= 0) return 0.5;
  const loopN    = Math.floor(rawPos / loopDur);
  const posInLoop = rawPos - loopN * loopDur;
  /* 評価グリッドは8分音符（BGM_BEAT/2）。
     メロディは4分・8分音符の両方に音符があるため、4分音符グリッドでは8分音符タイミングが
     常に最悪スコアになる。
     ビートリング表示（getBeatPulse）は4分音符周期のまま */
  const halfBeat = BGM_BEAT / 2;
  const ph       = ((posInLoop % halfBeat) + halfBeat) % halfBeat; // 0〜halfBeat
  const distSec  = ph < halfBeat / 2 ? ph : halfBeat - ph;        // 最近傍8分音符までの距離
  const distMs   = distSec * 1000;
  return Math.max(0, 1 - distMs / 100); // 0ms→1.0, 100ms→0.0, 100ms超→0
}

/* masterGainの出力先に挟む常時有効のセーフティリミッター。
   同じSEが多重に発火したり（実績の一括解除で'ach'が18重になる等）、複数のSEが
   偶然重なったりすると、ライブ再生側でも音が割れる（クリッピングする）。
   常時経由するリミッターを1つ挟んで防ぐ。
   普段の1〜2音同時程度ではほぼ透過的で、多重発火時だけピークを叩き潰す設定にする
   （BGM事前レンダリング用の-10dB/ratio20は常時通すには効きすぎるため、
   ライブ用にやや緩めた値を使う） */
function _createMasterLimiter(ctx) {
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value = 6;
  limiter.ratio.value = 16;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.15;
  limiter.connect(ctx.destination);
  return limiter;
}

/* BGM系の接続を組む: bgmGain → bgmToneShelf → masterGain。
   AudioContext を作る経路は getAudioCtx() と _recreateAudioGraph()（iOS interrupted
   からの復帰）の2つあるが、**配線はここ1箇所にしか書かない**。
   両方に配線を持たせると、ノードを1つ挟むだけでも片方を直し忘れて
   「復帰後だけ音色が違う」という再現しにくい不具合になる
   （「状態を作る箇所が2つある」ことが原因の欠陥クラス。_bgmIsBoss も同じ構図） */
function _buildBgmGainChain(ctx, outNode) {
  bgmGain = ctx.createGain();
  bgmGain.gain.value = 1;
  bgmToneShelf = ctx.createBiquadFilter();
  bgmToneShelf.type = 'highshelf';
  bgmToneShelf.frequency.value = BGM_TONE_SHELF_HZ;
  bgmToneShelf.gain.value = 0; // 0dB = 完全に透過（下記コメント参照）
  /* JS側ミラーもここで0に戻す。ノードを作る唯一の箇所で両方を確定させることで、
     iOS interrupted からの復帰でノードが作り直されたときにミラーだけ古い値が
     残る（→ガードが成立して二度と設定されない）事故を構造的に防ぐ
     （_updateBgmToneShelf参照） */
  _bgmToneShelfTargetDb = 0;
  bgmGain.connect(bgmToneShelf);
  bgmToneShelf.connect(outNode);
}

/* ── ボス戦BGMの音色をこんがり度で連続的に開く（ライブ処理） ──
   こんがり度でBGMを変化させる3要素のうちの1つ。地鳴り（4段階）・和声（最終段のみ）が
   段階的な変化なのに対し、こちらはこんがり度に対して連続的に動くので、段の間も
   じわじわ変化し続ける。
   ローパスを「閉じた状態から開く」方式は採らない。それだとこんがり度0%の音が
   今より曇ってしまう。ハイシェルフはゲイン0dBのとき伝達関数が厳密に1なので、
   0%では音に一切手を加えず、こんがるほど高域が持ち上がって「開けていく」方向にだけ
   働かせられる。
   実際に持ち上がるのは主にハイハット（シェイカー/ラトル役）なので、聞こえ方としては
   「踊りの鳴り物が前に出てくる」＝和太鼓の増加と同じ方向を向く。 */
const BGM_TONE_SHELF_HZ    = 2600; // この周波数より上を持ち上げる
const BGM_TONE_SHELF_MAX_DB = 5;   // こんがり度100%での持ち上げ量
const BGM_TONE_SHELF_TAU   = 0.12; // setTargetAtTimeの時定数（段差を作らない）

/* こんがり度から目標シェイプ量(dB)を返す。口の制御点はこんがり度に対して
   線形に動く（_kingGentleness参照）ので、こちらも線形にしてスライダーの
   動きを表情と一致させる。0%で0dB＝透過、100%でBGM_TONE_SHELF_MAX_DB。
   ※_kingGentlenessを使わないのは意図的: あれは「50%で反転」を表す量で、
     50%未満が全て0になる。連続変化が売りのこの要素では battle 前半でも
     動いてほしいため、口の制御点そのものと同じ線形量を使う */
function _bgmToneShelfDbForCookPct(pct) {
  return BGM_TONE_SHELF_MAX_DB * Math.max(0, Math.min(1, pct / 100));
}

/* update()から毎フレーム無条件に呼ぶ。「ボス戦を抜けたら戻す」処理を別経路に
   持たせず、毎フレーム現在のphaseとこんがり度から目標値を導出するので、
   終了経路（勝利・敗北・真エンディング・ポーズ・中断）が増えても戻し忘れが
   構造的に起きない。_bgmIsBoss の残留バグと同じ轍を踏まないための形
   （project_king_battle_7_4_bgm メモの「状態を作る唯一の箇所で導出する」）。
   ボス戦以外では常に0dBへ戻るため、通常プレイの音色は変化しない */
function _updateBgmToneShelf() {
  if (!audioCtx || !bgmToneShelf) return;
  const target = (_king && _isBossBattlePhase())
    ? _bgmToneShelfDbForCookPct(_king.cookPct) : 0;
  /* 比較はノードの.valueではなくJS側ミラーと行う（上記コメント参照） */
  if (Math.abs(_bgmToneShelfTargetDb - target) < 0.01) return; // 目標が変わっていなければ何もしない
  _bgmToneShelfTargetDb = target;
  bgmToneShelf.gain.setTargetAtTime(target, audioCtx.currentTime, BGM_TONE_SHELF_TAU);
}

/* ボスBGMの事前レンダリングを、手が空いたときに1本ずつ行う。

   まとめて走らせてはいけない。実測（Mac）で5本同時だと完了まで308ms、ノードのスケジュール
   だけでメインスレッドを28ms塞ぐ。実機の?perfでも初回タップの unlk が47msになり、これは
   音声経路が開く瞬間と重なる。オーディオスレッドの処理落ち（＝ざらついた雑音）とタップの
   引っかかりの両方の要因になる。

   ただし「後回し」だけでは、king値が閾値近くで保存されている状態でリロードされると、
   焼き上がる前に突入しうる（未完なら通常BGMで代用される仕様なので無音にはならないが、
   暗黒BGMも段階切り替えも効かないまま戦うことになる）。そこで2つの保険を置く:
     ・保存されたking値が予兆割合を超えていれば、最初の1本の待ちを短くする
     ・予兆に入った時点で未完なら、待たずにその場で焼く（_startBossOmenから呼ぶ。
       予兆はテープストップ1.6秒＋演出が続くので、1本ぶんの時間は十分に取れる） */
const _BOSS_BGM_FIRST_DELAY_MS = 4000; // 最初の1本を焼くまで（音声経路が落ち着くのを待つ）
const _BOSS_BGM_NEAR_DELAY_MS  = 800;  // king値が予兆割合を超えている場合の短縮版
const _BOSS_BGM_GAP_MS         = 1500; // 2本目以降の間隔
let _bossBgmNextTier = 0;    // 次に焼く段階
let _bossBgmBusy     = false;// レンダ実行中
let _bossBgmTimer    = null; // 予約中のタイマー（緊急時に取り消して即実行するのでidを持つ）
function _scheduleBossBgmRenders(immediate = false) {
  if (_bossBgmBusy || _bossBgmNextTier >= BGM_TIER_COUNT) return;
  if (_bossBgmTimer !== null) {
    if (!immediate) return;                 // すでに予約済み
    clearTimeout(_bossBgmTimer); _bossBgmTimer = null; // 緊急: 待たずに走る
  }
  const start = () => {
    _bossBgmTimer = null;
    if (!audioCtx || !bossBgmBuffers) return;
    const tier = _bossBgmNextTier;
    _bossBgmBusy = true;
    const done = () => {
      _bossBgmNextTier = tier + 1;
      _bossBgmBusy = false;
      _scheduleBossBgmRenders(); // 続きは通常の間隔で（緊急でも一気に焼かない）
    };
    renderBGMBuffer(audioCtx.sampleRate, {
      bassArr: BGM_BASS_BOSS,
      /* 最終段だけメロディ層を長3度へ持ち上げてAメジャー化（BGM_MEL_BOSS_BRIGHT参照）。
         差し替えはループ先頭ぴったりで行うため、段階間で内容が違っても位相は
         連続しクリックは出ない（_swapBossBgmBuffer参照） */
      melArr: tier === BGM_BRIGHT_TIER ? BGM_MEL_BOSS_BRIGHT : BGM_MEL_BOSS,
      hatArr: BGM_HAT_BOSS, kickSet: BGM_KICK_BOSS,
      taikoStrongSet: BGM_TAIKO_STRONG_BOSS, taikoFlourishSet: BGM_TAIKO_FLOURISH_BOSS,
      /* こんがり度が上がるほど合いの手の食い込みを増やす（BGM_TAIKO_PICKUP_TIERS参照） */
      taikoPickupSet: _taikoPickupSetForTier(tier),
      bassDurMul: 0.85, bassDecay: 0.05,
      useTaiko: true, useRumble: true, melBossBass: true, kickVol: 1.10, // 通常BGMより厚いキック（倍量よりわずかに控えめ）
      useLimiter: true, // ステップ0の同時発音でピークが2.7前後に達するためコンプレッサー必須
      rumbleMellow: tier / (BGM_TIER_COUNT - 1),
    }).then(buf => {
      bossBgmBuffers[tier] = buf;
      if (tier === 0) bossBgmBuffer = buf; // 既存コード（startBossBGMTape等）との互換
      done();
    }).catch(e => { console.warn(`Boss BGM render failed (tier${tier}):`, e); done(); });
  };
  if (immediate) { start(); return; }
  const near = kingGyozaMeter >= KING_GYOZA_THRESHOLD * KING_OMEN_RATIO;
  _bossBgmTimer = setTimeout(start,
    _bossBgmNextTier === 0 ? (near ? _BOSS_BGM_NEAR_DELAY_MS : _BOSS_BGM_FIRST_DELAY_MS)
                           : _BOSS_BGM_GAP_MS);
}

/* AudioContext は最初のユーザーアクティベーション（touchstart / mousedown / keydown）内で
   生成する。ジェスチャー内の new AudioContext() は iOS が即 running にするため、
   ページロード時生成（suspended → 2タップ必要）の問題を回避できる。
   renderBGMBuffer() はジングル（約5.7秒）より先に完了するため BGM 再生に間に合う。
   _unlockAudio() / _onFirstGesture() / 各ボタンハンドラが初回ジェスチャーで呼ぶ。 */

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    masterGain = audioCtx.createGain();
    /* ここで audioMuted を直接反映する。タイトル画面の真エンディング再生ボタンは
       initGame() を経由せず直接 getAudioCtx() を呼ぶため、ここを無条件で1にして
       「後で applyMuteGain() が呼ばれる」ことに依存すると、その経路の初回再生で
       ミュート設定が反映されず音が鳴ってしまう。lsLoad() はページ読み込み時点で
       必ず完了しており（getAudioCtx はユーザー操作でしか呼ばれない）、
       ここで audioMuted を見て差し支えない */
    masterGain.gain.value = audioMuted ? 0 : 1;
    _audioSampleRateAtFirst = audioCtx.sampleRate; // ?perf の sr 表示（再作成での変化を見る基準）
    masterGain.connect(_createMasterLimiter(audioCtx));
    /* BGM: bgmGain → bgmToneShelf → masterGain → destination（_buildBgmGainChain参照） */
    _buildBgmGainChain(audioCtx, masterGain);
    /* BGMループを非同期でオフラインレンダリング（完了後 bgmBuffer にセット）
       startBGM() がバッファ未完状態で呼ばれていた場合は完了後に起動する */
    renderBGMBuffer(audioCtx.sampleRate).then(buf => {
      bgmBuffer = buf;
      /* startBGM() がバッファ未完状態で呼ばれていた場合、ここで改めて起動 */
      if (bgmPendingStart && !bgmSource) {
        bgmPendingStart = false;
        startBGM();
      }
    }).catch(e => { console.warn('BGM render failed:', e); });
    /* ボス戦用（暗黒版）バッファは、ここでは焼かずに後回しにする。
       起動タイミングは_initBossBattle側でbossBgmBufferの有無を確認しており、
       未完ならその時点の通常BGMで代用される（startBossBGMTape参照）ので、
       初回タップに間に合わせる必要はまったく無い。キング戦に入るには
       1000ギヨウザ必要で何トライもかかる。
       こんがり度の段階ぶん（BGM_TIER_COUNT個）を用意し、上昇に合わせてループの
       切り替えの仕組みは_updateBossBgmTierを参照）。tier0は素のボスBGM（bossBgmBuffer）と
       同一内容 */
    bossBgmBuffers = new Array(BGM_TIER_COUNT).fill(null);
    _scheduleBossBgmRenders();
    /* AudioContext生成直後にデバイス遅延を実測してビート表示先読みを更新
       resume()後に値が確定するので少し待って再計測 */
    _updateBeatDisplayAdvance();
    setTimeout(_updateBeatDisplayAdvance, 500);
    /* ホワイトノイズバッファを事前生成（最長ノイズ使用: reach_jackpot dur=0.3+0.05=0.35s → 0.45s確保）
       playNoise() はこのバッファを参照するだけでフレームごとのランダム生成ループが不要になる */
    _buildNoiseBuffer();

   再生が始まらず、セッションがすぐ元に戻る。毎タップ play() を呼び直すはめになり

   ループ境界を避けるために再生を止める（待避する）方式は採らない — 上記のノイズを生む。
   10秒あればループ境界は実用上ほぼ無視できる */
const _SILENT_WAV_RATE = 48000;
const _SILENT_WAV_SEC  = 10;
const _SILENT_WAV_URI = (() => {

       ・Promiseの解決 → iOSでは解決も拒否もしないことがあり、永久に判定できない
       ・paused===false → play()を呼んだ瞬間にfalseになる仕様なので、実際には
         鳴っていなくても成功と誤認する（1回だけ呼んで無音になった）

     （_SILENT_WAV_URI参照）。pausedも併せて見るのは、システム側の割り込みで

  if (!_iosAudioEl.paused && _iosAudioEl.currentTime > 0) { _iosSessionElevated = true; return; }
  /* ループの境目でcurrentTimeが0付近を返す一瞬だけのために鳴らし直さない。

  if (!_iosAudioEl.paused && _iosSessionElevated) return;

  _iosSessionElevated = false;

/* バックグラウンドでは無音要素を止める。

   確認する設計）。フラグは触らない＝再開を妨げる抑制を入れない。なお要素を止めると

     呼ぶとタップのたびにその分の引っかかりが出る。呼ぶ場所は touchstart ハンドラの

  if (!audioCtx) getAudioCtx();

  if (_speakerRouteEstablished && audioCtx.state === 'running') return;

/* 音程ヘルパー: note='C'~'B'（シャープ付き'C#'等も可）, octave=3~5

/* ホワイトノイズバッファを事前生成する

  let lfo = null, lfoGain = null;

    lfo     = ctx.createOscillator();
    lfoGain = ctx.createGain();

    lfoGain.connect(osc.frequency);
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(vibrato.rate  ?? 5.5, startT);
    lfoGain.gain.setValueAtTime(0, startT);
    lfoGain.gain.linearRampToValueAtTime(vibrato.depth ?? 5, startT + (vibrato.delay ?? 0.5));
    lfo.start(startT);
    lfo.stop(startT + dur + (decay ?? 0.08) + 0.1);

  if (slurTarget != null) {
    gain.gain.exponentialRampToValueAtTime(Math.max(slurTarget, 0.001), startT + dur);
    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.02));
    stopAt = startT + dur + (decay ?? 0.02) + 0.02;

    osc.stop(stopAt);

    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.08));
    stopAt = startT + dur + (decay ?? 0.08) + 0.02;
    osc.start(startT);
    osc.stop(stopAt);

  if (ctx === audioCtx) {
    _disconnectAfter(ctx, stopAt, osc, gain);
    if (lfo) _disconnectAfter(ctx, startT + dur + (decay ?? 0.08) + 0.1, lfo, lfoGain);

/* ホワイトノイズのバッファを得る。実コンテキストでは事前生成の共有バッファ

  if (ctx === audioCtx && _noiseBuffer && _noiseBuffer.sampleRate === ctx.sampleRate) return _noiseBuffer;

/* ループ再生用のノイズソース。共有バッファは0.45秒ほどしか無いため、

/* ノイズバースト（ハイハット・打撃音用） */

/* 音符の並びを1本のフレーズとして鳴らす。効果音の多くは「音符を並べてplayOscに流す」だけ
   なので、フレーズをデータ（音符の配列）として書けるようにして、効果音を足すときにコードでは
   なく並びだけを書けばよいようにする。playOscの末尾3つ（長さ・音量・減衰）も位置引数ではなく
   名前付きで渡す。
     notes  周波数の配列（optsのstep間隔で等間隔に並べる）
     notes  周波数の配列（optsのstep間隔で等間隔に並べる）
            または [周波数, 開始オフセット秒, 長さ秒] の配列（並びを直接指定）
     opts   type   波形
            step   等間隔に並べるときの音符間隔（秒）
            dur    1音の長さ（[f,dt,d]形式ではそちらが優先）
            vol    音量 / decay 減衰
            delay  フレーズ全体の開始オフセット（秒）
            octave 1オクターブ上に重ねる層の音量（0なら重ねない）
            octaveType 重ねる層の波形（省略時はtypeと同じ） */
function _playPhrase(ctx, t, notes, opts) {
  const type = opts.type ?? 'sine';
  const step = opts.step ?? 0;
  const dur = opts.dur ?? 0.15, vol = opts.vol ?? 0.25, decay = opts.decay ?? 0.1;
  const delay = opts.delay ?? 0, octave = opts.octave ?? 0;
  const octaveType = opts.octaveType ?? type;
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const tuple = Array.isArray(n);
    const f  = tuple ? n[0] : n;
    const at = t + delay + (tuple ? n[1] : i * step);
    const d  = tuple ? n[2] : dur;
    playOsc(ctx, type, f, at, d, vol, decay);
    if (octave > 0) playOsc(ctx, octaveType, f * 2, at, d, octave, decay);
  }
}
