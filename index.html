    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    drawKingCharFlights();
  }

  /* 没収で所持ギヨウザが尽きた場合も、まずは通常の「こんがり しっぱい」＋
     キングが縮んでギヨウザ群へ戻っていく演出を優先し、そのあとで通常モードの
     コイン枯渇ゲームオーバー画面へ進む（ユーザー要望: 「所持ギヨウザが0に
     なる場合、キングギヨウザが戻って飛んでいく演出を優先してください。
     その後、所持ギヨウザ0のゲームオーバー演出に進んでください」）。
     coins<=0によるここでの早期分岐（通常ゲームオーバー画面を先に出す）は
     廃止し、_kingBattleEnd側で出口を分ける（コメント参照） */
  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const titleY = _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
  outText('こんがり しっぱい……', W / 2, titleY, '#ff6655', 'rgba(40,0,0,0.9)', 8);
  /* 没収個数メッセージは画面下端からの固定オフセットを基本にしつつ、ボスの拡大
     アニメ（dscale→1）でtitleYが下がってきた場合はtitleYの下側に一定間隔を
     保つ側を優先する（Math.max）。固定オフセットだけだとボスが十分に育った
     状態でtitleYがそのオフセットを超え、見出しと重なってしまうため
     （実機指摘: 「下に表示される文字列が重なっている」） */
  if (_bossDefeatTimer > 40) {
    ctx.font = `bold 15px 'Hiragino Mincho ProN',serif`;
    /* 没収個数の実数表示（ギヨウザN個が吸収された）から、割合表示に変更
       （ユーザー要望）。_startBossDefeatの没収ロジック（Math.ceil(coins/2)）
       が常に「所持数の半分」である事実そのままの文言にした */
    outText('所持ギヨウザの半数が 吸収された……', W / 2, Math.max(H - 80, titleY + 40),
      '#d8d8ff', 'rgba(0,0,0,0.85)', 4);
  }
  if (_bossDefeatTimer > 90) {
    _drawBottomPillBadge('CONTINUE');
  }
  ctx.restore();
}

function drawBossDefeatOutro() {
  if (phase !== 'bossDefeatOutro' || !_defeatOutro) return;
  const o = _defeatOutro;
  ctx.save();
  ctx.fillStyle = 'rgba(2,4,8,0.7)';
  ctx.fillRect(0, 0, W, H);
  for (const g of o.items) drawOneItem(g);
  if (o.step >= 1) {
    /* 台詞演出は誕生予告（drawBossOmen）と同じ見せ方（過去行は薄く残して積む）だが、
       位置・サイズは別建てにする。誕生予告は4行ぶんの表示領域を見込んで
       H*0.30始まりにしているが（4行目=キングの登場位置の少し上で終わる想定）、
       こちらは2行しかなく同じ開始位置だと画面上寄りに偏って見える
       （実機指摘）。ここでは画面に固定のボスが存在しないぶん表示领域に余裕が
       あるため、2行の中心が画面中央(H/2)に来るよう配置し、行数が少ない分
       フォントもひとまわり大きくする */
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fsL = IS_PORTRAIT ? 26 : 30;
    const lineDy = fsL * 2.2;
    const lineY0 = H / 2 - lineDy / 2; // 2行の中心を画面中央に揃える
    ctx.font = `bold ${fsL}px 'Hiragino Mincho ProN',serif`;
    for (let i = 0; i < o.step && i < _DEFEAT_OUTRO_LINES.length; i++) {
      const isCur = (i === o.step - 1);
      ctx.globalAlpha = isCur ? Math.min(1, o.timer / 20) : 0.5;
      outText(_DEFEAT_OUTRO_LINES[i], W/2, lineY0 + i*lineDy, '#e8e2d0', 'rgba(0,0,0,0.9)', 6);
    }
    ctx.globalAlpha = 1;
  }
  /* タップ待ちにせず時間経過で自動的に戻るため、CONTINUEバッジは出さない
     （ユーザー要望） */
  ctx.restore();
}

/* ════════════════ 吉祥雲 ════════════════ */
/* _drawCloudTo: 任意のコンテキストに雲を描く（OffscreenCanvas 事前描画用）
   drawCloud: メインcanvasへの呼び出し（_staticLayerCanvas が利用可能なら使わない） */
function _drawCloudTo(c2, cx, cy, sc, alpha, rot) {
  c2.save();
  c2.translate(cx, cy);
  c2.rotate(rot||0);
  c2.scale(sc, sc);
  c2.globalAlpha = alpha;
  c2.fillStyle   = Y;
  c2.beginPath();
  c2.moveTo(-50, 5);
  c2.bezierCurveTo(-60,6,-65,-4,-57,-10);
  c2.bezierCurveTo(-49,-16,-40,-8,-45,3);
  c2.bezierCurveTo(-46,9,-40,13,-34,8);
  c2.bezierCurveTo(-34,1,-26,-14,-16,-12);
  c2.bezierCurveTo(-13,-11,-11,-9,-10,-8);
  c2.bezierCurveTo(-12,-24,12,-24,10,-8);
  c2.bezierCurveTo(11,-9,13,-11,16,-12);
  c2.bezierCurveTo(26,-14,34,1,34,8);
  c2.bezierCurveTo(40,13,46,9,45,3);
  c2.bezierCurveTo(40,-8,49,-16,57,-10);
  c2.bezierCurveTo(65,-4,60,6,50,5);
  c2.bezierCurveTo(42,15,-42,15,-50,5);
  c2.closePath();
  c2.fill();
  c2.restore();
}
function drawCloud(cx, cy, sc, alpha, rot) { _drawCloudTo(ctx, cx, cy, sc, alpha, rot); }

/* ════════════════ 獅子 ════════════════ */
/* _drawShishiTo: 任意のコンテキストに獅子を描く（OffscreenCanvas 事前描画用）
   drawShishi: メインcanvasへのラッパー */
function _drawShishiTo(c2, cx, cy, sc, mirX) {
  c2.save();
  c2.translate(cx, cy);
  c2.scale(mirX ? -sc : sc, sc);

  /* 胴体・脚（最背面に描画 → たてがみ・顔の下に隠れる） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.ellipse(-23,20,13,16,0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 23,20,13,16,-0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,12,29,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-32,44,11,18,0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 32,44,11,18,-0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,28,22,20,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.fillStyle=GN;
  for (const [x,y,r] of [[-10,8,5],[10,8,5],[0,18,5],[-22,20,4],[22,20,4]]) {
    c2.beginPath(); c2.arc(x,y,r,0,Math.PI*2); c2.fill();
  }
  /* 尻尾: 根元は体の側面、先端が横外側（+やや上）を向く
     rotate(-1.2)で先端がx負方向=外側へ。mirXで右獅子は右外側に自動反転 */
  c2.save();
  c2.translate(-44, 40);
  c2.rotate(-1.2);
  c2.beginPath();
  c2.moveTo(0,-24);
  c2.bezierCurveTo( 9,-14, 11, 3, 0, 15);
  c2.bezierCurveTo(-11,  3, -9,-14, 0,-24);
  c2.closePath();
  c2.fillStyle=Y; c2.fill();
  c2.restore();

  /* たてがみ: 全周に巻き貝・渦巻きカール（狛犬スタイル）
     上部3個(i=8,9,10)・下部3個(i=2,3,4)は顔より前面に描画 */
  const _hx = 0, _hy = -28, _ringR = 45, _cR = 17, _N = 12, _WR = 1.22;
  const _drawCurl = i => {
    const a = (i / _N) * Math.PI * 2;
    const cx = _hx + Math.cos(a) * _ringR, cy = _hy + Math.sin(a) * _ringR;
    c2.fillStyle = Y;
    c2.beginPath(); c2.ellipse(cx, cy, _cR*_WR, _cR, 0, 0, Math.PI*2); c2.fill();
    c2.save();
    c2.translate(cx, cy); c2.scale(_WR, 1);
    /* C字弧の開口を顔中心方向に向ける。
       現開口方向≈5.751rad、顔中心方向=a+π。差分を回転として加算。 */
    const _rot = (a + Math.PI) - 5.751;
    c2.globalAlpha = 0.6; // C字弧の濃さ
    c2.beginPath();
    c2.arc(-_cR*0.18, _cR*0.08, _cR*0.52, 0.35 + _rot, Math.PI*1.55 + _rot);
    c2.strokeStyle = GN; c2.lineWidth = _cR*0.3; c2.lineCap = 'round'; c2.stroke();
    c2.globalAlpha = 1;
    c2.restore();
  };
  /* 背面カール（顔の後ろ）: 左右の6個 */
  for (const i of [0,1,5,6,7,11]) _drawCurl(i);
  /* 顔の輪郭: 少し大きな緑の楕円を先に描いてボーダーを作る */
  c2.globalAlpha = 0.65;
  c2.fillStyle = GN;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR+4, 39, 0, 0, Math.PI*2); c2.fill();
  c2.globalAlpha = 1;
  /* 頭部楕円（横長）を上から描画 */
  c2.fillStyle = Y;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR, 35, 0, 0, Math.PI*2); c2.fill();
  /* 目: 緑塗りつぶし */
  c2.fillStyle=GN;
  c2.beginPath(); c2.arc(-17,-34,3.5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc(17,-34,3.5,0,Math.PI*2); c2.fill();
  /* 瞼: 顔色の大きな円で目の上部・外側寄りを覆う（左右対称） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.arc(-17-2,-34-7,5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc( 17+2,-34-7,5,0,Math.PI*2); c2.fill();
  /* 眉毛: 尻尾と同形状（ティアドロップ）、半透明で微妙な濃さ
     内側（鼻寄り）が高くなるよう傾ける（凛々しい表情） */
  c2.save();
  c2.globalAlpha = 0.30;
  for (const [ex, rot] of [[-17, 1.3], [17, -1.3]]) {
    c2.save();
    c2.translate(ex, -44);
    c2.rotate(rot);
    c2.beginPath();
    c2.moveTo(0,-10);
    c2.bezierCurveTo( 4,-5.5, 4.5, 1, 0, 6);
    c2.bezierCurveTo(-4.5, 1, -4,-5.5, 0,-10);
    c2.closePath();
    c2.fillStyle=GN; c2.fill();
    c2.restore();
  }
  c2.restore();
  /* 鼻（小さめ・少し上に） */
  c2.fillStyle=GN;
  c2.beginPath(); c2.ellipse(0,-21,5,3,0,0,Math.PI*2); c2.fill();
  /* 口: 人字型（犬っぽい口） */
  c2.strokeStyle=GN; c2.lineWidth=1.8; c2.lineCap='round'; c2.lineJoin='round';
  /* 人中（鼻下〜口中央）: 口にピッタリ接続 */
  c2.beginPath();
  c2.moveTo(0,-17); c2.lineTo(0,-13);
  c2.stroke();
  /* 口: Wの下二つのアーチを丸くした形（ω口）
     左右の口角(高め)→下方へアーチ→中央で合わさる */
  c2.beginPath();
  c2.moveTo(-7,-13);
  c2.quadraticCurveTo(-4,-10, 0,-13);
  c2.quadraticCurveTo(4,-10, 7,-13);
  c2.stroke();
  /* 前面カール: 下部中央(i=3)を最背面→左右(i=2,4)→上部(i=8,9,10) */
  _drawCurl(3);          // 下部中央: 最背面
  for (const i of [2,4,8,9,10]) _drawCurl(i);
  c2.restore();
}
function drawShishi(cx, cy, sc, mirX) { _drawShishiTo(ctx, cx, cy, sc, mirX); }

/* ════════════════ Draw helpers ════════════════ */

/* 縁取りテキスト: stroke を先に描いてから fill を重ねる */
function outText(text, x, y, fillStyle, strokeStyle, lw) {
  ctx.lineJoin    = 'round';
  ctx.lineWidth   = lw ?? 9;
  ctx.strokeStyle = strokeStyle ?? 'rgba(0,0,0,0.88)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(text, x, y);
}

function easeOutBack(t) {
  const c1=1.70158, c3=c1+1;
  return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* 右上/左上ボタン群共通の背景描画（roundRect + fill + gold border）
   active=true: トロフィーON時のゴールド強調背景 */
function _drawBtnBg(rect, active) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 6);
  ctx.fillStyle = active ? 'rgba(180,140,0,0.75)' : 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ピルバッジの外形パスを設定（beginPath〜closePath）。fill()/stroke()は呼び出し側で行う */
function _drawPillPath(bx, by, bw, bh) {
  const r = bh / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by,      bx + bw, by + bh, r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r,  by + bh);
  ctx.arcTo(bx,       by + bh, bx, by + bh - r, r);
  ctx.lineTo(bx,      by + r);
  ctx.arcTo(bx,       by,      bx + r, by, r);
  ctx.closePath();
}

/* ════════════════ Main draw ════════════════ */
function draw() {
  /* 画面シェイク */
  let shakeX = 0, shakeY = 0;
  if (hitType === 'gizagiza' && endTimer > 45) {
    const k = Math.min(1, (endTimer-45)/20);
    shakeX = Math.sin(endTimer*4.7)*5*k;
    shakeY = Math.cos(endTimer*3.3)*4*k;
  }
  if (hitType === 'gigigigi' && endTimer > 45) { // ギギギギ: もっと激しい振動
    const k = Math.min(1, (endTimer-45)/15);
    shakeX += (Math.random()-0.5)*14*k;
    shakeY += (Math.random()-0.5)*10*k;
  }
  if (phase === 'reach' && reachTimer > REACH_DECEL_FRAMES) { // リーチ減速後: 微振動
    shakeX += (Math.random()-0.5)*2;
    shakeY += (Math.random()-0.5)*1.5;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* グレースケールフィルター（CSSをcanvas要素に適用）
     ctx.filterはiOS Safari<18未サポートのため、canvas.style.filterを使用
     AudioParam.value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため
     JS 側で管理した grayRateCur を使用 */
  {
    const rate = Math.max(0.001, Math.min(1, grayRateCur));
    const f = rate < 0.995 ? `grayscale(${Math.round((1 - rate) * 90)}%)` : '';
    if (f !== _lastFilter) { canvas.style.filter = _lastFilter = f; }
  }

  /* 背景 + 吉祥雲 + 獅子 + 上下帯: すべて焼き込み済みの静的レイヤー1枚を drawImage
     キャッシュ未構築（OffscreenCanvas 未対応の古いブラウザ）はフォールバックで通常描画 */
  if (_staticLayerCanvas) {
    ctx.drawImage(_staticLayerCanvas, 0, 0, W, H);
  } else {
    ctx.fillStyle = bgGradient || '#0f5020'; ctx.fillRect(0,0,W,H);
    for (const c of CLOUDS) drawCloud(c.x,c.y,c.s,c.a,c.r);
    if (!IS_PORTRAIT) {
      ctx.globalAlpha = 0.6;
      drawShishi(78, 360, 0.82, false);
      drawShishi(983, 360, 0.82, true);
      ctx.globalAlpha = 1;
    }
    /* 上下帯 */
    ctx.fillStyle=Y; ctx.fillRect(0,0,W,6); ctx.fillRect(0,H-6,W,6);
    ctx.globalAlpha=0.4; ctx.fillRect(0,8,W,3); ctx.fillRect(0,H-11,W,3); ctx.globalAlpha=1;
  }

  /* 弓 (縦画面のみ) */
  if (IS_PORTRAIT && (phase==='idle'||phase==='reach')) drawBow();

  ctx.textBaseline='alphabetic'; // リセット

  /* ホイール（ボス戦闘中は非表示） */
  if (!_isBossBattlePhase()) {
    for (let i=0;i<4;i++) drawWheel(i);
  }

  /* キングギヨウザ予兆の霊（半透明で画面を横切る） */
  if (_omenGhost) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.drawImage(_omenGhost.oc, _omenGhost.x - _omenGhost.sz / 2, _omenGhost.y - _omenGhost.cy);
    ctx.restore();
  }

  /* 飛ぶ矢 (3D遠近法) */
  if (phase==='shooting') drawArrow3D();

  /* particles: 色×アルファ4段階でバッチ化して1色1fill（GPUフラッシュ最大512→数十回に削減）
     アルファは4段階量子化（フェード25フレームで十分滑らか） */
  if (particles.length > 0) {
    ctx.save();
    for (const p of particles) {
      const a = Math.min(0.999, p.life / 25);
      p._ab = (a * 4) | 0; // 0-3
    }
    const nc = _partColorList.length;
    for (let ab = 3; ab >= 0; ab--) {
      ctx.globalAlpha = (ab + 1) / 4;
      for (let ci = 0; ci < nc; ci++) {
        let started = false;
        for (let k = 0; k < particles.length; k++) {
          const p = particles[k];
          if (p._ab !== ab || p.ci !== ci) continue;
          if (!started) { ctx.beginPath(); started = true; }
          const r = Math.max(0.1, p.r);
          ctx.moveTo(p.x + r, p.y);
          ctx.arc(p.x, p.y, r, 0, Math.PI*2);
        }
        if (started) { ctx.fillStyle = _partColorList[ci]; ctx.fill(); }
      }
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  /* BETバー: ボス戦闘中はこんがりゲージに差し替え（同じ位置・寸法を共有） */
  if (!_isBossBattlePhase()) {
    if (IS_PORTRAIT) drawPortraitBottomBar(); else drawBottomBar();
  }
  drawCoinHeader();

  /* ── レイヤー構成(全当たり共通) ──────────────────
     1. オーバーレイ (暗幕)
     2. エフェクト面  (各当たりの演出)
     3. テキスト最前面
     ─────────────────────────────────────────────── */

  /* 1. オーバーレイ（ハズレは暗幕なし） */
  if (phase==='done'&&endTimer>45&&!isMissResult&&!isGameOver&&hitType!=='none') drawEndOverlay();
  if (phase==='reach')              drawReachOverlay();

  /* 2. エフェクト面 */
  if (_activeEffect?.draw && endTimer >= (_activeEffect.drawDelay ?? 0)) _activeEffect.draw();
  /* フィーバー堆積アイテム: _activeEffectがdrawItemsを担う場合を除いて常時描画 */
  if (items.length > 0 && _activeEffect?.draw !== drawItems) drawItems();
  drawUzaFlash(); // ウザウザフラッシュ（内部で hitType チェック済み）

  /* 白フラッシュ (リーチ大当たり確定の瞬間) */
  if (reachFlash > 0) {
    ctx.save();
    ctx.globalAlpha = reachFlash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }


  /* 3. テキスト最前面 */
  if (phase==='done'&&endTimer>45&&(!isMissResult||isGameOver)&&!_jackpotAutoReset) drawEndScreen();
  /* ポップアップ: phaseを問わず常時描画（トライ横断フェードアウト） */
  if (missPopups.length > 0)   drawMissPopup();
  if (payoutPopups.length > 0) drawPayoutPopup();
  /* フィーバーバナー（開始/終了とも drawFeverBanner で統合） */
  if (feverStartBannerTimer > 0) drawFeverBanner(feverStartBannerTimer, null);
  if (feverEndBannerTimer > 0 && feverEndBannerReason) drawFeverBanner(feverEndBannerTimer, feverEndBannerReason);
  if (phase==='reach')              drawReachText();

  /* スタートアップ画面 */
  drawStartup();

  /* キングギヨウザ出現予告・戦闘・勝利演出（全画面演出・ボタン類より下、バッジ類より上） */
  drawBossOmen();
  drawBossBattle();
  drawBossVictory();
  drawTrueEnding();
  drawBossDefeat();
  drawBossDefeatShrink();
  drawBossDefeatOutro();

  /* ビートシンクメーター＋JUST演出（通常のシンク統計はボス戦では無関係のため非表示） */
  if (!_isBossBattlePhase()) drawSyncMeter();
  drawSyncJust();

  /* スローハンドバッジ・フィーバーバッジ（最前面・上部中央） */
  drawSlowHandBadge();
  drawFeverBadge();
  drawBeatBonusBadge();
  drawContinueBadge();

  /* ── ポーズオーバーレイ ── */
  if (isPaused) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    /* 実績パネルが開いている間は "PAUSED" テキストを非表示（パネルが全面を覆うため） */
    if (!showAchievements) {
      ctx.fillStyle = 'rgba(245,208,32,0.95)';
      ctx.font = `bold 36px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PAUSED', W/2, H/2);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(245,208,32,0.4)';
      ctx.fillText('© 2026 Michiyasu ODAKI', W/2, H - 24);
    }
    ctx.restore();
  }

  /* 実績バナー・オーバーレイ（ポーズ暗幕の上に表示） */
  drawAchBanner();
  drawAchOverlay();

  /* ── 右上ボタン群（トロフィー・ミュート）常時最前面 ── */
  /* トロフィーボタン */
  ctx.save();
  _drawBtnBg(ACH_TROPHY, showAchievements);
  /* トロフィーアイコン: 完全再設計 - カップ→ネック→台座の正しいシルエット */
  ctx.translate(ACH_TROPHY.x + ACH_TROPHY.w / 2, ACH_TROPHY.y + ACH_TROPHY.h / 2);
  ctx.strokeStyle = '#f5d020';
  ctx.fillStyle   = '#f5d020';
  ctx.lineWidth   = 1.4;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  /* カップ本体 + ネック + 台座（一体の塗りつぶしパス）
     🏆絵文字シルエットをトレース:
     上辺 ±5.5, カップ壁がy=-5付近で最大幅x≈8, y=-2付近でx≈6, ネックy=0.5でx≈2.5
     台座 ±7, y=3〜7.5 */
  ctx.beginPath();
  ctx.moveTo(-5.5, -8.5);                                      // 上辺 左
  ctx.lineTo( 5.5, -8.5);                                      // 上辺 右
  ctx.bezierCurveTo( 8.25, -4.75,  7.25, -1.75,  2.5,  0.5); // 右壁（膨らみ→絞り込み）
  ctx.lineTo( 2,  0.5);  ctx.lineTo( 2,  3);                  // ネック右
  ctx.lineTo( 6,  3);    ctx.lineTo( 6,  7.5);                // 台座右
  ctx.lineTo(-6,  7.5);  ctx.lineTo(-6,  3);                  // 台座底・左
  ctx.lineTo(-2,  3);    ctx.lineTo(-2,  0.5);                // ネック左
  ctx.lineTo(-2.5, 0.5);                                       // カップ底 左
  ctx.bezierCurveTo(-7.25, -1.75, -8.25, -4.75, -5.5, -8.5); // 左壁（右の鏡）
  ctx.closePath();
  ctx.fill();

  /* 持ち手：カップ中段外側に付くD字アーク
     右壁: y=-5でx≈8, y=-2でx≈7 に合わせた外側カーブ */
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo( 7, -6.5);
  ctx.quadraticCurveTo(12.5, -5,  6, -3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, -6.5);
  ctx.quadraticCurveTo(-12.5, -5, -6, -3);
  ctx.stroke();
  ctx.restore();

  /* ── 真エンディング再生ボタン（トロフィーの右隣・startup画面かつ視聴済みのみ） ──
     エンディング演出はゲーム途中で見るものではなく、スタートと並列の選択肢という
     位置づけにしたため、実績パネルの中ではなくタイトル画面のボタン列に置く */
  if (phase === 'startup' && trueEndingSeen) {
    ctx.save();
    _drawBtnBg(TRUE_ENDING_BTN, false);
    ctx.translate(TRUE_ENDING_BTN.x + TRUE_ENDING_BTN.w / 2, TRUE_ENDING_BTN.y + TRUE_ENDING_BTN.h / 2);
    /* 祝賀メダル（円形ロゼット＋燕尾リボン）アイコン。単色シルエット。
       ポーズ解除の再生三角と紛らわしいという指摘を受けて差し替えたが、
       初版は細く小さすぎて遠目にメダルと判別できなかったため、
       ボタン全体を使い切るサイズ・太いリボン幅・燕尾ノッチ付きで再設計した */
    ctx.fillStyle = '#f5d020';
    ctx.beginPath();
    ctx.moveTo(-4.5, -1); ctx.lineTo(-0.6, -1); ctx.lineTo(-0.6, 10);
    ctx.lineTo(-2.5, 7.2); ctx.lineTo(-4.5, 10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4.5, -1); ctx.lineTo(0.6, -1); ctx.lineTo(0.6, 10);
    ctx.lineTo(2.5, 7.2); ctx.lineTo(4.5, 10);
    ctx.closePath(); ctx.fill();
    /* メダル円の縁に沿って薄い暗色の隙間を挟み、リボン(奥)とメダル(手前)が
       重なっているように見せる（同色ベタ塗りだと繋ぎ目が消え一体化して見えるため） */
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.arc(0, -4, 8.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5d020';
    ctx.beginPath();
    ctx.arc(0, -4, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ── 全画面ボタン（Fullscreen API 対応環境のみ・常時最前面） ── */
  if (FS_SUPPORTED) {
    ctx.save();
    _drawBtnBg(FS_BTN_RECT, false);
    ctx.fillStyle = '#f5d020';
    ctx.translate(FS_BTN_RECT.x + FS_BTN_RECT.w / 2, FS_BTN_RECT.y + FS_BTN_RECT.h / 2);
    ctx.scale(_FS_ICON_SCALE, _FS_ICON_SCALE);
    ctx.translate(-12, -12); // 24×24 viewBox の中心揃え
    ctx.fill(_isFullscreen ? _FS_PATH_EXIT : _FS_PATH_ENTER);
    ctx.restore();
  }

  /* ── ミュートボタン（右上・常時最前面） ── */
  ctx.save();
  _drawBtnBg(MUTE_BTN, false);
  /* アイコンを中心座標基準で描く */
  ctx.translate(MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + MUTE_BTN.h / 2);
  const ic = '#f5d020'; // 全画面ボタンと同じ金色
  ctx.strokeStyle = ic; ctx.fillStyle = ic;
  ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* ミュート時: 右へ3px移動 + 1.2倍スケールで斜線の中央に揃える
     通常:   体 x=-9〜-4, コーン x=-4〜3（中心 x≈-3）
     ミュート: translate(3,0)+scale(1.2) → 体 x≈-7.8〜-2.2, コーン x≈-2.2〜6.6（中心 x≈-0.8） */
  const spkShift = audioMuted ? 2 : 0;
  ctx.save();
  ctx.translate(spkShift, 0);
  if (audioMuted) ctx.scale(0.95, 1.1); // ミュート時: 縦1.1倍・横0.95倍（横圧縮）
  /* スピーカー本体（台形＋四角） */
  ctx.fillRect(-9, -4, 5, 8);
  /* 台形コーン */
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.lineTo( 3, -8);
  ctx.lineTo( 3,  8);
  ctx.lineTo(-4,  4);
  ctx.closePath();
  ctx.fill();
  if (!audioMuted) {
    /* 音波 小 */
    ctx.beginPath();
    ctx.arc(3, 0, 5, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
    /* 音波 大 */
    ctx.beginPath();
    ctx.arc(3, 0, 9, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
  }
  ctx.restore();
  if (audioMuted) {
    /* ミュート: 左上→右下の斜線（macOS スタイル）
       完全不透明の黒ボーダーでスピーカーをシャープに切り、上からゴールドを重ねる */
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
    ctx.strokeStyle = ic;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
  }
  ctx.restore();

  /* ── ポーズボタン（左上・トロフィー下、startup以外・常時最前面） ── */
  if (phase !== 'startup') {
    ctx.save();
    _drawBtnBg(PAUSE_BTN, false);
    ctx.translate(PAUSE_BTN.x + PAUSE_BTN.w / 2, PAUSE_BTN.y + PAUSE_BTN.h / 2);
    ctx.fillStyle = '#f5d020';
    if (isPaused) {
      ctx.beginPath();
      ctx.moveTo(-5, -8); ctx.lineTo(-5, 8); ctx.lineTo(9, 0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(-6, -8, 4, 16);
      ctx.fillRect( 2, -8, 4, 16);
    }
    ctx.restore();
  }

  /* ── フィーバー内枠エフェクト: HSL色サイクル＋呼吸パルス ── */
  if (isFever && phase !== 'startup') {
    const t   = performance.now();
    const hue = (t / 20) % 360;                        // 色相サイクル（約7秒で一周）
    const pulse = 0.7 + 0.3 * Math.sin(t / 260);     // 呼吸（約1.6秒周期、min0.4〜max1.0）
    const lw  = IS_PORTRAIT ? 5 : 7;
    ctx.save();
    ctx.strokeStyle = `hsla(${hue}, 100%, 62%, ${pulse})`;
    ctx.lineWidth   = lw;
    ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
    ctx.restore();
  }

  /* ── ミュート時ビートパルス: 外枠の太さ変化 ── */
  if (audioMuted && phase !== 'startup') {
    const pulse = getBeatPulse();
    if (pulse > 0) {
      const lw = pulse * 6; // 最大6px
      ctx.save();
      ctx.strokeStyle = _BEAT_BORDER_COLORS[Math.min(31,pulse*31|0)];
      ctx.lineWidth = lw;
      ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  /* 画面全体フェード: 最前面・シェイク変形の外で描く（余韻を大切にした暗転つなぎ） */
  _drawScreenFade();
  /* デバッグ用タップ式チートパネル（?cheatpanel時のみ、常に最前面） */
  drawCheatPanel();
  /* デバッグ用keydown受信ログ（?keydebug時のみ、常に最前面） */
  drawKeyDebug();
}

/* ════════════════ 描画関数群 ════════════════ */

/* ── BETボタン描画ヘルパー ── */
function _drawBetBtn(rect, label, canChange, fontSize) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fillStyle = canChange ? 'rgba(245,208,32,0.18)' : 'rgba(120,120,120,0.10)'; ctx.fill();
  ctx.strokeStyle = canChange ? 'rgba(245,208,32,0.55)' : 'rgba(120,120,120,0.25)';
  ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = canChange ? Y : 'rgba(180,180,180,0.35)';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
}

function drawWheel(i) {
  const w=wheels[i], active=i===curIdx&&(phase==='idle'||phase==='reach');
  /* ビート拍動: アクティブホイールの強調度をキックに合わせてパルス */
  const bp = active ? getBeatPulse() : 0; // 0-1、ビート直後=1
  ctx.save(); ctx.translate(w.x,w.y);
  /* グロー光輪: セグメント描画前に1回だけ shadowBlur を使用し GPUブラーパスを集約
     旧: 各セグメントのfill/stroke/strokeText/fillText すべてに shadowBlur が効いて
         8〜12セグ × 4操作 = 32〜48 GPU ブラーパス/フレーム → Input Delay 17〜27ms の原因
     新: 外周リングを1ストロークするだけ = 1 GPU ブラーパス/フレーム */
  if (active) {
    if (_wheelGlowSprites) {
      /* プリレンダ済みグロー（bp 8段階量子化）+ クリスプなリング本体 */
      const g = _wheelGlowSprites[Math.min(_GLOW_LEVELS - 1, (bp * _GLOW_LEVELS) | 0)];
      ctx.drawImage(g.oc, -g.half, -g.half);
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
    } else {
      /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.shadowColor=Y; ctx.shadowBlur=50+bp*40;
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
      ctx.shadowBlur=0; // セグメント描画前にリセット
    }
  }

  /* セグメント・文字・ハブ: 事前描画済み OffscreenCanvas を回転して貼る
     文字はホイール中心が下方になるよう _buildWheelOC で固定済み */
  if (w._oc) {
    ctx.save();
    ctx.rotate(w.rot);
    ctx.drawImage(w._oc, -_WHEEL_OC_R, -_WHEEL_OC_R, _WHEEL_OC_R*2, _WHEEL_OC_R*2);
    ctx.restore();
  } else {
    /* フォールバック: OffscreenCanvas 未対応時は従来描画（文字は回転なし） */
    for (const s of w.segs) {
      const a1=s.start+w.rot, a2=a1+s.span, mid=a1+s.span/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,WR,a1,a2); ctx.closePath();
      ctx.fillStyle=s.gradient; ctx.fill();
      ctx.strokeStyle='rgba(245,208,32,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
      const tx=Math.cos(mid)*WR*0.62, ty=Math.sin(mid)*WR*0.62;
      ctx.save(); ctx.translate(tx,ty);
      ctx.font=s.font; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.88)'; ctx.strokeText(s.char,0,0);
      ctx.fillStyle='#fffde7'; ctx.fillText(s.char,0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle=w.hubGrd; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+4,0,Math.PI*2);
  ctx.strokeStyle=active?Y:YD; ctx.lineWidth=active?4.5+bp*2.5:2; ctx.stroke();
  /* ビート拍動: 外側に広がる拍動リング（テーブルで文字列生成ゼロ） */
  if (bp > 0.01) {
    ctx.beginPath(); ctx.arc(0,0,WR+12+bp*14,0,Math.PI*2);
    ctx.strokeStyle=_BEAT_RING_COLORS[Math.min(31,bp*31|0)]; ctx.lineWidth=2+bp*2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+8,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,0,0.35)'; ctx.lineWidth=1.5; ctx.stroke();


  /* ポインタ三角形: PC=▼(上), 縦=◀(右から左向き)
     プリレンダ済みスプライト（グロー込み）を状態別に選択して drawImage */
  if (_pointerSprites) {
    const sp = w.locked ? _pointerSprites.locked
             : active   ? _pointerSprites.active[Math.min(3, (bp * 4) | 0)]
             : _pointerSprites.inactive;
    ctx.drawImage(sp.oc, sp.ox, sp.oy, sp.w, sp.h);
  } else {
    /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
    if (active || w.locked) {
      ctx.shadowColor = w.locked ? '#ff4422' : Y;
      ctx.shadowBlur  = 18 + bp * 18;
    }
    if (IS_PORTRAIT) {
      ctx.beginPath(); ctx.moveTo(WR+5,0); ctx.lineTo(WR+26,-12); ctx.lineTo(WR+26,12); ctx.closePath();
    } else {
      ctx.beginPath(); ctx.moveTo(0,-WR-5); ctx.lineTo(-13,-WR-28); ctx.lineTo(13,-WR-28); ctx.closePath();
    }
    ctx.fillStyle = w.locked ? '#cc2200' : (active ? Y : YD);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (w.result) {
    /* 結果文字はロック時に一度だけ OC へ焼き込み（グロー＋グリフラスタライズは1回のみ）
       毎フレームは drawImage 1回。ポップ拡縮は drawImage のスケールで再現する */
    if (!w._resOC) _buildResultOC(w);
    const pop=Math.max(0.01,easeOutBack(Math.min(1,w.resultPop)));
    ctx.save();
    if (IS_PORTRAIT) ctx.translate(WR+58, 0); else ctx.translate(0, WR+58);
    ctx.scale(pop,pop);
    if (w._resOC) {
      ctx.drawImage(w._resOC, -_RESULT_OC_HALF, -_RESULT_OC_HALF, _RESULT_OC_HALF*2, _RESULT_OC_HALF*2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      const [fillC, glowC] = _syncBarColor(w.syncScore);
      ctx.font=`bold 44px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=glowC; ctx.shadowBlur=10 + w.syncScore * 20;
      ctx.fillStyle=fillC; ctx.fillText(w.result,0,0);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawArrow(x,y,embedded,angle=0) {

/* ── 矢の3D飛翔エフェクト ──────────────────────────────────
   弓道の映像のように矢を横から見た形(矢先→矢柄→矢羽)で描き、
   手前(大)→的(小)へ遠近スケールで縮小して飛ばす。
   矢先は常に的を向く。                                      ── */
function drawArrow3D() {
  const p = arrowProgress;
  if (p <= 0 || p >= 1) return;

  /* 発射から着弾への角度(固定) */
  const angle = Math.atan2(arrowTY - arrowSY, arrowTX - arrowSX);

  /* 残像3枚 + 本体1枚 */
  for (let trail = 3; trail >= 0; trail--) {
    const tp = Math.max(0, p - trail * 0.05);
    if (tp <= 0) continue;

    /* 位置: わずかにeaseして自然な加速感 */
    const ep = Math.pow(tp, 0.88);
    const sx = arrowSX + (arrowTX - arrowSX) * ep;
    const sy = arrowSY + (arrowTY - arrowSY) * ep;

    /* 遠近スケール: 近=3倍大, 遠=等倍 (縦画面は横移動なので等倍固定) */
    const sc = IS_PORTRAIT ? 1.0 : Math.max(1, (1 - tp) * 2 + 1);

    const al = Math.min(1, tp * 8) * (trail === 0 ? 1.0 : 0.22 - trail * 0.06);
    if (al <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(sx, sy);
    ctx.rotate(angle); // 矢先が的方向(+x)を向くよう回転

    /* ── 矢のサイズ(スケール済み) ── */
    const half = 32 * sc;   // 矢の全長の半分
    const tipL = 13 * sc;   // 矢尻から矢先までの長さ
    const tipW =  5 * sc;   // 矢先の幅(半分)
    const fLen = 20 * sc;   // 矢羽の長さ
    const fW   =  9 * sc;   // 矢羽の最大幅
    const sw   = Math.max(1.5, 2.5 * Math.min(sc, 2)); // 矢柄の太さ

    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(half - tipL, 0);
    ctx.lineTo(-half + fLen, 0);
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth   = sw;
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* 矢先(三角形, +x方向が的) */
    ctx.beginPath();
    ctx.moveTo(half, 0);
    ctx.lineTo(half - tipL, -tipW);
    ctx.lineTo(half - tipL,  tipW);
    ctx.closePath();
    ctx.fillStyle = '#1f2937';
    ctx.fill();

    /* 上羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5, -fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#1e40af';
    ctx.fill();

    /* 下羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5,  fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#b91c1c';
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ── 縦画面専用: 弓の描画 ── */
function drawBow() {
  /* 弦が左(射手側)、弓本体が右(的方向)に膨らむ正しい向き
     弦の両端 = (bx, by±38)、弓の腹 = bx + bulge の位置 */
  const bx = 30, by = WYS[curIdx];
  const bulge = 28; // 的方向への膨らみ量
  ctx.save();

  /* ── 矢を番えて引き絞った状態 ──
     弓: bx を中心に右(的方向)へ膨らむ ")" 形
     弦: 上端(bx,by-span)→筈(nockX,by)→下端(bx,by+span) のくの字
     矢: 筈(nockX) から右へ伸び、矢羽は筈の直前(矢先側)に配置
         ※ 羽は絶対に nockX より左(弦より奥)には出ない             */
  const pull     = 17;   // 弦の引き量(px)
  const halfSpan = 42;   // 弓の半張り
  const nockX    = bx - pull;          // 筈X = 弦の最も引かれた点
  const tipX     = nockX + 74;         // 矢先X

  /* 弓本体 */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.quadraticCurveTo(bx + bulge, by, bx, by + halfSpan);
  ctx.strokeStyle = '#7a3a0a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  /* 弓ハイライト */
  ctx.beginPath();
  ctx.moveTo(bx + 1, by - halfSpan + 4);
  ctx.quadraticCurveTo(bx + bulge - 5, by, bx + 1, by + halfSpan - 4);
  ctx.strokeStyle = 'rgba(180,100,30,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  /* 弦 (くの字: 上端→筈→下端) */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.lineTo(nockX, by);
  ctx.lineTo(bx, by + halfSpan);
  ctx.strokeStyle = 'rgba(220,190,80,0.92)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();

  /* ── 矢 ── */
  if (phase === 'idle' || phase === 'reach') {
    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(nockX, by);
    ctx.lineTo(tipX - 12, by);
    ctx.strokeStyle = '#c08840'; ctx.lineWidth = 2.2; ctx.lineCap = 'butt'; ctx.stroke();

    /* 矢先 (鋭い三角形) */
    ctx.beginPath();
    ctx.moveTo(tipX,      by);
    ctx.lineTo(tipX - 13, by - 5);
    ctx.lineTo(tipX - 13, by + 5);
    ctx.closePath();
    ctx.fillStyle = '#2a3040'; ctx.fill();

    /* 矢羽: 平行四辺形
       下辺(軸側): vB → vF (矢柄上)
       上辺(外側): 下辺をそのまま筈方向へ shift ずらした辺
       → 横長の長方形を傾けたような不等辺平行四辺形             */
    const vB    = nockX + 3;  // 下辺・後端X
    const vF    = nockX + 13; // 下辺・前端X
    const vH    = 6;          // 羽の張り出し高さ
    const shift = 5;          // 上辺を筈側(左)へずらす量

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(vB,         by);          // 下辺・後端 (軸上)
      ctx.lineTo(vF,         by);          // 下辺・前端 (軸上)
      ctx.lineTo(vF - shift, by + s*vH);  // 上辺・前端 (外側)
      ctx.lineTo(vB - shift, by + s*vH);  // 上辺・後端 (外側)
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,160,160,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
    }

    /* 筈の印 (小さい暗色リング) */
    ctx.beginPath();
    ctx.arc(nockX + 1, by, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#5a3010'; ctx.fill();
  }
  ctx.restore();
}

/* タッチ座標をキャンバス座標に変換 */
function touchToCanvas(touch) {
  return {
    x: (touch.clientX - _canvasRect.left) * (W / _canvasRect.width),
    y: (touch.clientY - _canvasRect.top)  * (H / _canvasRect.height),
  };
}

/* ── エンド画面: オーバーレイのみ ── */
/* リーチ用フリッカーリングのスプライト（初回リーチ時に1回だけ生成、shadowBlur 排除） */
let _reachRingSprite = null;
function _getReachRingSprite() {
  if (_reachRingSprite || typeof OffscreenCanvas === 'undefined') return _reachRingSprite;
  const r = WR + 8, blur = 20;
  const half = Math.ceil(r + blur * 1.6 + 4);
  const oc = new OffscreenCanvas(half * 2 * _dpr, half * 2 * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr); c.translate(half, half);
  c.strokeStyle = 'rgba(245,208,32,0.7)'; c.lineWidth = 4;
  c.shadowColor = Y; c.shadowBlur = blur;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  _reachRingSprite = { oc, half };
  return _reachRingSprite;
}

/* ── リーチ演出: スポットライトオーバーレイ ── */
function drawReachOverlay() {
  const fadeIn = Math.min(1, reachTimer / 35);
  const wx = WXS[3], wy = WYS[3];

  ctx.save();

  /* 暗幕 */
  ctx.fillStyle = `rgba(0,0,0,${0.58 * fadeIn})`;
  ctx.fillRect(0, 0, W, H);

  /* スポットライト (第4ホイール中心に明るい円) */
  const pulse = 0.65 + 0.35 * Math.abs(Math.sin(reachTimer * 0.13));
  const spot  = ctx.createRadialGradient(wx, wy, 0, wx, wy, WR * 2.6);
  spot.addColorStop(0,   `rgba(245,208,32,${0.22 * pulse * fadeIn})`);
  spot.addColorStop(0.5, `rgba(245,208,32,${0.10 * pulse * fadeIn})`);
  spot.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, H);

  /* 減速が完了したらホイール枠をフリッカー
     グロー付きリングはスプライト転写（毎フレームの shadowBlur を排除） */
  if (reachTimer > REACH_DECEL_FRAMES) {
    const flicker = Math.floor(reachTimer / 8) % 2 === 0 ? 1 : 0.5;
    const rs = _getReachRingSprite();
    if (rs) {
      ctx.globalAlpha = flicker * fadeIn; // 基本アルファ0.7はスプライトに焼き込み済み
      ctx.drawImage(rs.oc, wx - rs.half, wy - rs.half, rs.half * 2, rs.half * 2);
      ctx.globalAlpha = 1;
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.beginPath();
      ctx.arc(wx, wy, WR + 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(245,208,32,${0.7 * flicker * fadeIn})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = Y;
      ctx.shadowBlur  = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();
}

/* ── ハズレポップアップ（複数同時表示対応） ── */
function drawMissPopup() {
  if (missPopups.length === 0) return;
  const TOTAL = 120;
  ctx.save();
  ctx.font = `bold 36px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* shadowBlur除去: 黒アウトライン(lw=6)で視認性は確保済み。GPU負荷削減。 */
  for (const p of missPopups) {
    const elapsed = TOTAL - p.timer;
    const t       = elapsed / TOTAL;            // 0→1
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = p.timer < 70 ? p.timer / 70 : 1; // 後半58%をかけてフェードアウト
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 + (0.5 - t) * 90;    // 移動範囲の中心がH/2になるよう配置
    ctx.globalAlpha = alpha * 0.92;
    outText(`－${fmt(p.amt)} ギヨウザ`, W / 2, popY, '#ff7755', 'rgba(0,0,0,0.85)', 6);
  }
  ctx.restore();
}

function drawPayoutPopup() {
  if (payoutPopups.length === 0) return;
  const TOTAL = 150;
  ctx.save();
  ctx.font = `bold 42px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 30;
  for (const p of payoutPopups) {
    const pt      = p.timer / TOTAL;
    const elapsed = TOTAL - p.timer;
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = pt < 0.2 ? pt / 0.2 : 1;
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 - 60 - (1 - pt) * 30;
    ctx.globalAlpha = alpha * 0.95;
    outText(`＋${fmt(p.amt)}ギヨウザ！`, W / 2, popY, '#ffee44', 'rgba(0,0,0,0.9)', 8);
    if (p.beatBonus) {
      outText('♪BONUS', W / 2, popY + 44, '#fffde7', 'rgba(0,0,0,0.8)', 4);
    }
  }
  ctx.restore();
}

function drawEndOverlay() {
  const alpha = Math.min(1,(endTimer-45)/35);
  /* 大当たりはギヨウザを見せるため薄め、ウザウザも半透明 */
  const overlayAlpha = hitType==='jackpot'  ? alpha*0.48
                     : hitType==='uzauza'   ? alpha*0.55
                     : hitType==='giugiu'   ? alpha*0.30
                     : hitType==='yoyoyoyo' ? alpha*0.65
                     : hitType==='uuuu'     ? alpha*0.72
                     : hitType==='zazazaza' ? alpha*0.60
                     : alpha*0.78;
  ctx.fillStyle=`rgba(5,25,10,${overlayAlpha})`;
  ctx.fillRect(0,0,W,H);

/* ── 固定タイトル文字のプリレンダキャッシュ（shadowBlur 排除 第2弾） ──
   エンド画面・リーチ演出のタイトルは固定文字列 × 固定スタイルのため、
   初回使用時にグロー込みで OC へ焼き、毎フレームは drawImage 1回にする
   （shadowBlur は Canvas 2D 最重量級の GPU 操作。v3.72 と同じ手法の水平展開）。
   LRU 上限でメモリを制限。OffscreenCanvas 未対応時は従来描画へフォールバック。 */
const _titleOCCache = new Map(); // key → { oc, w, h }
const _TITLE_CACHE_MAX = 8;
function _titleCachePrune() {
  while (_titleOCCache.size > _TITLE_CACHE_MAX) {
    _titleOCCache.delete(_titleOCCache.keys().next().value); // 最古（先頭）を削除
  }
}
/* outText + shadowBlur 相当をキャッシュ付きで描く。(x,y) はテキスト中心。
   注意: 呼び出し時に ctx.shadowBlur が 0 であること（drawImage にも影が乗るため） */
function _outTextCached(key, text, font, fill, stroke, lw, glowC, glowB, x, y) {
  if (typeof OffscreenCanvas === 'undefined') {
    ctx.font = font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = glowC; ctx.shadowBlur = glowB;
    outText(text, x, y, fill, stroke, lw);
    ctx.shadowBlur = 0;
    return;
  }
  let e = _titleOCCache.get(key);
  if (!e) {
    ctx.save(); ctx.font = font;
    const tw = Math.ceil(ctx.measureText(text).width);
    ctx.restore();
    const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
    const pad = Math.ceil(glowB * 1.6 + lw + 8);
    const w = tw + pad * 2, h = fs + pad * 2;
    const oc = new OffscreenCanvas(w * _dpr, h * _dpr);
    const c  = oc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    /* outText と同じ順序: 影付き stroke → 影付き fill（グローの重なりを再現） */
    c.shadowColor = glowC; c.shadowBlur = glowB;
    c.lineWidth = lw; c.strokeStyle = stroke;
    c.strokeText(text, w / 2, h / 2);
    c.fillStyle = fill;
    c.fillText(text, w / 2, h / 2);
    e = { oc, w, h };
  } else {
    _titleOCCache.delete(key); // LRU: 再挿入で最新化
  }
  _titleOCCache.set(key, e);
  _titleCachePrune();
  ctx.drawImage(e.oc, x - e.w / 2, y - e.h / 2, e.w, e.h);
}
/* 超大当たり専用: フィル色がアニメーションするため「グロー+縁取り」だけ焼く。
   shadowOffset トリックで stroke/fill 両方の影のみ抽出し、フィルは毎フレーム上描きする */
function _bakeGlowStroke(key, text, font, stroke, lw, glowC, glowB) {
  ctx.save(); ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  ctx.restore();
  const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
  const pad = Math.ceil(glowB * 1.6 + lw + 8);
  const w = tw + pad * 2, h = fs + pad * 2;
  const OFF = 4096; // 本体を画面外へ追い出して影だけスプライト内に落とす
  const oc = new OffscreenCanvas(w * _dpr, h * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.shadowColor = glowC; c.shadowBlur = glowB; c.shadowOffsetX = OFF;
  c.lineWidth = lw; c.strokeStyle = stroke;
  c.strokeText(text, w / 2 - OFF, h / 2);
  c.fillStyle = '#fff';
  c.fillText(text, w / 2 - OFF, h / 2);
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0;
  c.strokeText(text, w / 2, h / 2);
  const e = { oc, w, h };
  _titleOCCache.set(key, e);
  _titleCachePrune();
  return e;
}

/* ゲームオーバー演出（暗幕＋タイトル＋点滅する再開案内）。通常モードのコイン枯渇時
   （drawEndScreen）とキングギヨウザ戦の没収で所持ギヨウザが尽きた場合
   （drawBossDefeat）の両方から同じメッセージ・同じ待ち方で呼べるよう共通化した
   （ユーザー要望: 敗北で0になった場合は通常のゲームオーバーと同じにしたい）。
   timerは呼び出し元の経過フレーム数（通常はendTimer、ボス戦は_bossDefeatTimer）、
   canProceedは再開案内を出してよいか（通常はcanRestart相当） */
function _drawGameOverTitle(alpha, timer, canProceed) {
  ctx.save();

  /* 赤い暗幕（フェードイン） */
  ctx.globalAlpha = alpha * 0.72;
  ctx.fillStyle = 'rgba(60,0,0,1)';
  ctx.fillRect(0, 0, W, H);

  /* タイトルテキスト（ゆらゆら揺れる） */
  const shake = timer > 10 ? 0 : (10 - timer) * 1.5;
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (IS_PORTRAIT) {
    /* 縦画面は幅420pxのため2行に分割
       行間0.3行分（行高44px × 1.3 = 57px間隔）
       描画順: 下行→上行で「ギヨウザが」を前面に */
    const goFs   = 44;
    const goLine = Math.round(goFs * 1.3); // 行中心間距離 ≈ 57px
    const goY1   = H / 2 - goLine / 2 - 30;    // 「ギヨウザが」中心（30px上げ）
    const goY2   = H / 2 + goLine / 2 - 30;    // 「なくなりました」中心（30px上げ）
    const goFont = `bold ${goFs}px 'Hiragino Mincho ProN',serif`;
    _outTextCached('go_t2', 'なくなりました', goFont,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, goY2); // 先に描画
    _outTextCached('go_t1', 'ギヨウザが', goFont,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, goY1); // 後に描画→前面
  } else {
    _outTextCached('go_t', 'ギヨウザがなくなりました', `bold 56px 'Hiragino Mincho ProN',serif`,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, H/2 - 30);
  }
  ctx.restore();

  /* 再スタート案内（点滅） */
  if (canProceed) {
    const blink = 0.45 + 0.45 * Math.sin(timer * 0.1);
    ctx.globalAlpha = blink * alpha;
    ctx.shadowBlur = 0;
    ctx.font = `bold 22px 'Hiragino Mincho ProN',serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outText(
      'ギヨウザを10パック買って出直す',
      W/2, H/2 + (IS_PORTRAIT ? Math.round(44 * 1.3 / 2 + 44 - 30 + 20) : 55),
      '#ffe0d0', 'rgba(0,0,0,0.85)', 5
    );
  }
  ctx.restore();
}

  if (r >= 0.7) { const i=Math.min(63,(r-0.7)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.green[i];  _syncColorBuf[1]='#40c840'; _syncColorBuf[2]=0.85; return _syncColorBuf; }
  if (r >= 0.5) { const i=Math.min(63,(r-0.5)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.yellow[i]; _syncColorBuf[1]='#ddc020'; _syncColorBuf[2]=0.75; return _syncColorBuf; }
  if (r >= 0.3) { const i=Math.min(63,(r-0.3)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.red[i];    _syncColorBuf[1]='#c83020'; _syncColorBuf[2]=0.65; return _syncColorBuf; }
  _syncColorBuf[0]='rgba(130,130,130,0.9)'; _syncColorBuf[1]='#888'; _syncColorBuf[2]=0.5; return _syncColorBuf;
}

function drawSyncMeter() {
  if (phase === 'startup') return;
  if (_syncHistCount < SYNC_HIST_LEN || syncRateAboveCount < SYNC_VISIBLE_THRESHOLD) return;

  const pct     = syncRateDisp;                      // 0-1（VUメーター式表示値）
  const [fillC, glowC, glowStr] = _syncBarColor(pct);
  /* テキストキャッシュ: 値が変化した時のみ再生成（毎フレームのテンプレートリテラルを排除） */
  const pctRounded = Math.round(pct * 100);
  if (pctRounded !== _cachedSyncPctVal) { _cachedSyncPctVal = pctRounded; _cachedSyncPctStr = `SYNC ${pctRounded}%`; }
  if (syncChain   !== _cachedSyncChainVal) { _cachedSyncChainVal = syncChain; _cachedSyncChainStr = syncChain >= 2 ? `♪×${syncChain}` : ''; }
  const pctText   = _cachedSyncPctStr;
  const chainText = _cachedSyncChainStr;

  ctx.save();

  /* ── 横画面・縦画面共通: BETバー直下の細いストリップ ── */
  const mx = IS_PORTRAIT ? 12    : 335;          // BETバー左端に合わせる
  const mw = IS_PORTRAIT ? W-24  : 390;          // BETバー幅に合わせる
  const my = IS_PORTRAIT ? P_BAR_Y + P_BAR_H + 2 : BAR_Y + BAR_H + 2;
  const mh = IS_PORTRAIT ? 16    : 14;

  /* ゲージバー */
  const bh = IS_PORTRAIT ? 6 : 5;
  const by = my + (mh - bh) / 2;
  roundRect(mx, by, mw, bh, bh / 2);
  ctx.fillStyle = 'rgba(40,40,40,0.7)'; ctx.fill();
  if (pct > 0) {
    roundRect(mx, by, mw * pct, bh, bh / 2);
    ctx.fillStyle = fillC;
    if (pct >= 0.9) { ctx.shadowColor = glowC; ctx.shadowBlur = 8; }
    ctx.fill(); ctx.shadowBlur = 0;
  }

  /* 目盛り線（25% / 50% / 75%） */
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let _ti = 0; _ti < 3; _ti++) {
    const lx = mx + mw * (_ti === 0 ? 0.25 : _ti === 1 ? 0.5 : 0.75);
    ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(lx, by + bh); ctx.stroke();
  }

  /* テキスト（ゲージ上に重ねる） */
  ctx.font = `bold 9px monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(220,220,220,0.7)';
  ctx.fillText(pctText, mx + 6, my + mh / 2);
  if (chainText) {
    ctx.textAlign = 'right';
    ctx.fillStyle = syncChain >= BEAT_BONUS_CHAIN
      ? _RAINBOW_COLORS[_rainbowIdx()]
      : '#f5d020';
    ctx.fillText(chainText, mx + mw - 6, my + mh / 2);
  }

  ctx.restore();
}

/* ── JUST/GOOD/OK ポップアップ ── */
function drawSyncJust() {
  if (syncJustTimer <= 0 || !syncJustLabel) return;
  const t = syncJustTimer / 50; // 1→0
  /* 最初の10fでフェードイン、残りでフェードアウト */
  const fadeIn  = Math.min(1, (1 - t) * 5);
  const fadeOut = t;
  const alpha   = fadeIn * fadeOut;
  if (alpha < 0.01) return;

  /* スケール: 発動直後に1.4倍→1.0に縮む */
  const scale = 1 + 0.4 * Math.pow(t, 0.5);

  /* 色: シンクメーターと同じ _syncBarColor を使用 */
  const [col, glw] = _syncBarColor(syncJustScore);

  /* 表示位置
     横: BETバー上端(H-106=414)の少し上 → y≈394、x=中央
     縦: 結果文字と同じx中心(WXS[0]=210)、第4的下・BETバー上 → y=712 */
  const px = IS_PORTRAIT ? WXS[0] : W / 2;
  const py = IS_PORTRAIT ? P_BAR_Y - 20 : BAR_Y - 20;
  const fs = IS_PORTRAIT ? 20  : 22;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.scale(scale, scale);
  ctx.font = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glw; ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.fillText(syncJustLabel, 0, 0);
  ctx.restore();
}

/* ── スローハンド発動中バッジ（上部中央、BGMレートに連動してフェード） ── */
function drawSlowHandBadge() {
  if (phase === 'startup') return;
  if (phase === 'tapestart') return; // ゲームオーバー復帰アニメーション中は非表示
  /* ボス関連フェーズはいずれもスローハンドと無関係にgrayRateTargetを動かす
     （予告のテープストップ、こんがりしっぱい時のテープ停止など）ため、
     まとめて対象外にする（_isBossBattlePhase()で一元化、bossOmenは個別に足す）。
     これはisSlowSpinガード（下記）に対する保険としてそのまま残す */
  if (phase === 'bossOmen' || _isBossBattlePhase()) return;
  if (isGameOver) return;
  /* 実機報告で発覚: grayRateCurは複数の演出（ボス関連フェーズだけでなく、
     startBGMTapeのフォールバック分岐＝ボスBGMから通常BGMへ戻る際に
     grayRateCurを0.001へ明示的にリセットしてから1.4秒かけて1.0へ回復させる、
     等）でも下がりうる。キング戦は_bgmIsBoss=trueでBGM再生していたため、
     _kingBattleEnd→_restartToTapestart→startBGMTapeが必ずこのフォールバック
     分岐を通り、isSlowSpin=falseのままgrayRateCurが一瞬0付近まで落ちて
     idle移行後もまだ回復しきっていない状態が残る（tapestart→idleの遷移条件
     はBGM再生速度基準でありgrayRateCurの回復とは別の時定数のため）。
     過去にも同種の誤表示（「グレースケール≠スローハンド」、bossDefeat確定時
     のstopBGMTape由来）を一度修正しているが、その時はphase除外の追加という
     対症療法だったため、後から追加された今回の要因（startBGMTapeのフォール
     バック分岐）を見落とした。grayRateCurの下降要因を全て把握してその都度
     除外を追加するのは水平展開が漏れ続ける構造のため、判定の主軸を
     isSlowSpin自体に変える。ただし単純に「isSlowSpinがfalseなら常に非表示」
     にすると、大当たり/中当たりでスローハンドを早期解除する際の
     「isSlowSpin=falseにした後もgrayRateCurが1.0へ戻るまでバッジが滑らかに
     フェードアウトする」という既存の意図的な演出（_kingReelShoot付近の
     コメント「バッジも連動してフェードアウト」）まで壊してしまう（即座に
     消える退行になる）。そのため_slowHandBadgeArmed（発動の瞬間だけ立てて
     grayRateCurが1.0近くまで戻りきったら降ろすラッチ、update()側で管理）を
     判定に使う。これにより既存のフェードアウト演出は維持しつつ、
     isSlowSpinを一度も経由しないgrayRateCur変動（今回のバグの原因）では
     ラッチが立たずバッジは一切表示されない */
  if (!_slowHandBadgeArmed) return;
  /* grayRateCur: 1.0=通常→alpha0, 0.5=スロー→alpha1 に線形マッピング */
  const alpha = Math.max(0, Math.min(1, (1.0 - grayRateCur) * 2));
  if (alpha < 0.01) return;

  /* ポップスケール: 発動直後に大きく出てeaseOutで縮む (25f→1.0x) */
  const POP_FRAMES = 25;
  const popScale = slowHandPopTimer > 0
    ? 1 + 1.4 * Math.pow(slowHandPopTimer / POP_FRAMES, 2)
    : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  const text  = '🐌  ス ロ ー ハ ン ド  発 動 中';
  const fs    = IS_PORTRAIT ? 13 : 14;
  ctx.font    = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw    = ctx.measureText(text).width;
  const padX  = 18, padY = 7;
  const bw    = tw + padX * 2;
  const bh    = fs + padY * 2;
  const bx    = (W - bw) / 2;
  const by    = IS_PORTRAIT ? 10 : 8;

  /* スケール変形: バッジ中心を基準に拡縮 */
  if (popScale !== 1) {
    ctx.translate(W / 2, by + bh / 2);
    ctx.scale(popScale, popScale);
    ctx.translate(-W / 2, -(by + bh / 2));
  }

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(20,10,60,0.82)';
  ctx.fill();
  ctx.strokeStyle = `rgba(160,130,255,${0.7 * alpha})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* テキスト */
  ctx.fillStyle = '#e8d8ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2);

  ctx.restore();
}

function drawBeatBonusBadge() {

/* ── フィーバーバナー共通描画
   reason: null='start'（開始）/ 'miss'（FEVER OVER）/ 'complete'（FEVER COMPLETE）
   フェードイン20f、フェードアウト最後30f（総時間 FEVER_BANNER_FRAMES 基準） */
function drawFeverBanner(timer, reason) {
  const elapsed = FEVER_BANNER_FRAMES - timer; // 0 → FEVER_BANNER_FRAMES
  const alpha = elapsed < 20 ? elapsed / 20
              : timer   < 30 ? timer   / 30
              : 1;
  if (alpha < 0.02) return;
  const scale   = 0.6 + 0.4 * Math.min(1, elapsed / 20);
  const isStart = reason === null;
  const isMiss  = reason === 'miss';

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2);
  ctx.scale(scale, scale);

  /* バナー寸法 */
  const fs1 = IS_PORTRAIT ? 32 : 42;
  const fs2 = IS_PORTRAIT ? 15 : 18;
  const bh  = fs1 + fs2 + (IS_PORTRAIT ? 40 : 52);
  const bw  = W * 0.88;
  const br  = bh / 2;

  /* バナー背景（角丸矩形） */
  ctx.beginPath();
  ctx.moveTo(-bw/2 + br, -bh/2);
  ctx.arcTo( bw/2, -bh/2,  bw/2,  bh/2, br);
  ctx.arcTo( bw/2,  bh/2, -bw/2 + br, bh/2, br);
  ctx.arcTo(-bw/2,  bh/2, -bw/2, -bh/2, br);
  ctx.arcTo(-bw/2, -bh/2,  bw/2, -bh/2, br);
  ctx.closePath();
  ctx.fillStyle   = isStart ? 'rgba(60,40,0,0.92)' : isMiss ? 'rgba(60,0,0,0.92)' : 'rgba(20,30,60,0.92)';
  ctx.fill();
  ctx.strokeStyle = isStart ? '#ffcc00' : isMiss ? '#ff6060' : '#ffe080';
  ctx.lineWidth   = IS_PORTRAIT ? 2 : 3;
  ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (isStart) {
    /* FEVER START: ドロップシャドウ＋ゴールド文字 */
    ctx.font = `bold ${fs1}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = '#000'; ctx.shadowColor = 'transparent';
    ctx.fillText('FEVER START!', 2, -fs2 / 2 - 4 + 2);
    ctx.fillStyle = '#ffdd00'; ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
    ctx.fillText('FEVER START!', 0, -fs2 / 2 - 4);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    ctx.font = `${fs2}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = '#fff8d0';
    ctx.fillText('連チャンスタート！！', 0, fs1 / 2 + 4);
  } else {
    /* FEVER OVER / FEVER COMPLETE: 4隅アウトライン＋カラー文字 */
    const line1  = isMiss ? 'FEVER OVER…'     : 'FEVER COMPLETE!';
    const col1   = isMiss ? '#ff7070'          : '#ffe870';
    const shade1 = isMiss ? 'rgba(120,0,0,0.8)' : 'rgba(0,0,80,0.8)';
    const line1y = -bh / 2 + fs1 / 2 + (IS_PORTRAIT ? 14 : 18);
    ctx.font = `bold ${fs1}px 'Hiragino Mincho ProN',serif`;
    ctx.shadowColor = 'transparent';
    for (const [ox, oy] of [[-2,-2],[2,-2],[-2,2],[2,2]]) {
      ctx.fillStyle = shade1;
      ctx.fillText(line1, ox, line1y + oy);
    }
    ctx.fillStyle = col1;
    ctx.fillText(line1, 0, line1y);

    const line2  = isMiss ? 'ミスでフィーバー終了' : 'フル連チャン達成！！';
    const line2y = bh / 2 - fs2 / 2 - (IS_PORTRAIT ? 12 : 16);
    ctx.font = `bold ${fs2}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = isMiss ? '#ffaaaa' : '#ffffc8';
    ctx.fillText(line2, 0, line2y);
  }

  ctx.restore();
}

/* ── フィーバーバッジ（スローハンドバッジの下） ── */
function drawFeverBadge() {
  if (phase === 'startup') return;

/* ── 下部中央の呼吸ピルバッジ（「次へ進める」系の入力待ちを共通デザインで示す）。
   「タップで」等の特定デバイス限定の文言を画面に出したくない（実機指摘・過去にも
   同様の指摘あり）ため、通常モードのCONTINUEバッジと同じ見た目・同じ「クリック/
   タップ/キーボードいずれでも反応する」操作系（handleGameClick）に統一する。
   表示条件・位置（下端からのオフセット）は呼び出し側が制御する */
function _drawBottomPillBadge(text, bottomOffset = IS_PORTRAIT ? 12 : 10) {
  /* 呼吸アニメーション（点滅ではなくゆっくり拡縮） */
  const breath = 1 + 0.04 * Math.sin(performance.now() / 500);

  const fs   = IS_PORTRAIT ? 13 : 14;
  ctx.font   = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw   = ctx.measureText(text).width;
  const padX = 18, padY = 7;
  const bw   = tw + padX * 2;
  const bh   = fs + padY * 2;
  const bx   = (W - bw) / 2;
  const by   = H - bh - bottomOffset;

  ctx.save();
  ctx.translate(W / 2, by + bh / 2);
  ctx.scale(breath, breath);
  ctx.translate(-W / 2, -(by + bh / 2));

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(20,20,40,0.82)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,180,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#d8d8ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2);

  ctx.restore();
}

/* ── CONTINUEバッジ（done phase・canRestart時に下部中央表示） ── */
function drawContinueBadge() {
  if (phase !== 'done' || !canRestart || isGameOver) return;

/* ── 実績一覧オーバーレイ ──
   縦画面: 1カラム・行高44px・クリップ表示（全18件収まる）
   PC版 : 2カラム                                              */

/* 実績パネルの位置・寸法。IS_PORTRAIT/W/Hのみに依存し実行中不変のため、
   関数化しておく（座標式の重複を防ぐ） */
function _achPanelRect() {
  /* 縦画面: アイコン右端(46) + 12px = 58 → パネル左端
             右ボタン左端(374) - 12px = 362 → パネル右端
             pw = 362 - 58 = 304                                */
  return {
    px: IS_PORTRAIT ? 58        : 60,
    py: IS_PORTRAIT ? 16        : 30,
    pw: IS_PORTRAIT ? 304       : W - 120,
    ph: IS_PORTRAIT ? H - 32    : H - 60,
  };
}

function drawAchOverlay() {
  if (!showAchievements) return;

  /* ── パネルサイズをレイアウトに合わせて決定 ── */
  const { px, py, pw, ph } = _achPanelRect();

  ctx.save();
  /* 暗幕 */
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);
  /* パネル */
  roundRect(px, py, pw, ph, 12);
  ctx.fillStyle = 'rgba(8,40,15,0.97)'; ctx.fill();
  ctx.strokeStyle = Y; ctx.lineWidth = 2; ctx.stroke();

  /* タイトル */
  const titleH = IS_PORTRAIT ? 38 : 48;
  ctx.font = `bold ${IS_PORTRAIT ? 18 : 24}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = Y;
  ctx.fillText('🏆 実績一覧', px + pw/2, py + titleH/2);
  /* 区切り線 */
  ctx.beginPath();
  ctx.moveTo(px+16, py+titleH); ctx.lineTo(px+pw-16, py+titleH);
  ctx.strokeStyle = 'rgba(245,208,32,0.3)'; ctx.lineWidth=1; ctx.stroke();

  /* ── レイアウト計算 ── */
  const listY  = py + titleH + 4;
  const footH  = 22;
  const listH  = ph - titleH - 4 - footH;
  const COL    = IS_PORTRAIT ? 1 : 2;
  const ROWS   = Math.ceil(ACHIEVEMENTS.length / COL);
  const rowH   = IS_PORTRAIT ? Math.floor(listH / ACHIEVEMENTS.length)
                              : Math.floor(listH / ROWS);
  const colW   = Math.floor((pw - 8) / COL);

  /* PC版: 中央縦区切り線 */
  if (!IS_PORTRAIT) {
    ctx.beginPath();
    ctx.moveTo(px + 4 + colW, listY); ctx.lineTo(px + 4 + colW, listY + rowH * ROWS);
    ctx.strokeStyle = 'rgba(245,208,32,0.15)'; ctx.lineWidth=1; ctx.stroke();
  }

  /* クリップ（リスト範囲内のみ描画） */
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, listY, pw, listH);
  ctx.clip();

  /* リスト */
  ACHIEVEMENTS.forEach((ach, i) => {
    const col = IS_PORTRAIT ? 0 : Math.floor(i / ROWS);
    const row = IS_PORTRAIT ? i : i % ROWS;
    const lx  = px + 4 + col * colW;
    const ry  = listY + row * rowH;
    const mid = ry + rowH / 2;
    const unlocked = !!unlockedAch[ach.id];

    /* 交互背景 */
    if (row % 2 === 0) {
      roundRect(lx+1, ry+1, colW-2, rowH-2, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
    }

    ctx.globalAlpha = unlocked ? 1 : 0.35;

    /* ステータス丸 */
    const circR = IS_PORTRAIT ? 8 : 9;
    const circX = lx + (IS_PORTRAIT ? 16 : 18);
    ctx.beginPath();
    ctx.arc(circX, mid, circR, 0, Math.PI*2);
    ctx.fillStyle   = unlocked ? '#2ecc40' : 'rgba(120,120,120,0.5)'; ctx.fill();
    ctx.strokeStyle = unlocked ? '#27ae35' : 'rgba(160,160,160,0.4)';
    ctx.lineWidth = 1.4; ctx.stroke();
    if (unlocked) {
      ctx.beginPath();
      ctx.moveTo(circX-4, mid); ctx.lineTo(circX-1, mid+4); ctx.lineTo(circX+5, mid-4);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(circX, mid-3); ctx.lineTo(circX, mid+3);
      ctx.strokeStyle='rgba(200,200,200,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
    }

    /* アイコン */
    const iconX  = lx + (IS_PORTRAIT ? 32 : 34);
    const textX  = lx + (IS_PORTRAIT ? 52 : 56);
    const nameFs = IS_PORTRAIT ? 13 : 13;
    const descFs = IS_PORTRAIT ? 11 : 11;
    const nameOY = IS_PORTRAIT ? -7 : -7;
    const descOY = IS_PORTRAIT ?  7 :  7;

    ctx.fillStyle='#ffffff';
    ctx.font=`${IS_PORTRAIT ? 15 : 16}px serif`;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(ach.icon, iconX, mid);

    /* 実績名 */
    ctx.font=`bold ${nameFs}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = unlocked ? Y : 'rgba(245,208,32,0.5)';
    ctx.fillText(ach.name, textX, mid + nameOY);

    /* 説明文 */
    ctx.font=`${descFs}px 'Hiragino Mincho ProN',serif`;
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.28)';
    ctx.fillText(ach.desc, textX, mid + descOY);

    ctx.globalAlpha = 1;
  });

  ctx.restore(); // クリップ解除

  /* 解除数 */
  const cnt = ACHIEVEMENTS.filter(a => !!unlockedAch[a.id]).length;
  ctx.font = `${IS_PORTRAIT ? 11 : 11}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(245,208,32,0.45)';
  ctx.fillText(`${cnt} / ${ACHIEVEMENTS.length} 解除済み`, px+pw-12, py+ph-6);

  ctx.restore();
}

   引き継いで発火させることがある。そのタッチが STARTUP_BTN に重なると意図せず
   initGame() が呼ばれるため、ページロード直後 500ms は START を受け付けない。 */
const _startupGuardUntil = Date.now() + 500;

/* startup フェーズ: lsLoad/lsLoadAch だけ行い、画面は startup のままにする */
lsCheckSchema(); // スキーマ不一致なら全データクリア（lsLoad/lsLoadAch の前に必ず実行）
lsLoad();        // bet もここで復元される
lsLoadAch();
lsLoadStats();

coinsDisp = coins; _lastCoinsDispCached = -1; // startup時はスナップ

const _FRAME_BUF_SIZE = 120;
const _frameTimes = new Float32Array(_FRAME_BUF_SIZE);     // update()間隔 ms
const _frameWorkTimes = new Float32Array(_FRAME_BUF_SIZE); // update()+draw()処理時間 ms
const _TARGET_FRAME_MS = 1000 / 60; // ≈16.667ms: update()の1tick
let _frameTimesIdx = 0, _rafLastT = 0, _updateLastT = 0, _updateAccum = 0;
function _gameLoop(t) {
  _rafId = requestAnimationFrame(_gameLoop);
  /* アキュムレーター方式: 任意のリフレッシュレートで update() を正確に60fps維持
     dtを50msに丸める（タブ非表示復帰後の異常な追いつきを防ぐ） */
  const dt = _rafLastT > 0 ? Math.min(t - _rafLastT, 50) : 0;
  _rafLastT = t;
  _updateAccum += dt;
  if (_updateAccum >= _TARGET_FRAME_MS) {
    _updateAccum -= _TARGET_FRAME_MS;
    if (_updateAccum > _TARGET_FRAME_MS) _updateAccum = 0; // 過剰蓄積防止
    /* 60fps tick: update() → draw() の順でA/V同期を保つ */
    if (_updateLastT > 0) {
      _frameTimes[_frameTimesIdx % _FRAME_BUF_SIZE] = t - _updateLastT;
      _frameTimesIdx++;
    }
    _updateLastT = t;
    const _tWork = performance.now();
    update();
    draw();
    _frameWorkTimes[(_frameTimesIdx > 0 ? _frameTimesIdx - 1 : 0) % _FRAME_BUF_SIZE] = performance.now() - _tWork;

    /* 追加フレーム（120Hz等・ジッター）: draw()のみ実行して入力を即反映
       _bgmAccumStep()を呼んで音声位置を更新しないとBGMリング表示が凍結し

    _bgmAccumStep();

_rafId = requestAnimationFrame(_gameLoop);

/* AudioContext は最初のユーザーアクティベーション（touchstart / mousedown / keydown）内で

   ページロード時生成（suspended → 2タップ必要）の問題を回避できる。
   renderBGMBuffer() はジングル（約5.7秒）より先に完了するため BGM 再生に間に合う。
   _unlockAudio() / _onFirstGesture() / 各ボタンハンドラが初回ジェスチャーで呼ぶ。 */

       逆算して再設定することで performance.now() の経過でarrowProgressが飛び過ぎるのを防ぐ */

    /* BGM・ジングル・restartタイマーを一括停止し再生位置を記録する。

       ジングル中(bgmSource=null)でもここで止めることで、サスペンド状態のコンテキストで
       ジングルが完了してstartBGM()が呼ばれる競合を防ぐ。 */

      if (bgmRestartTimer) { clearTimeout(bgmRestartTimer); bgmRestartTimer = null; }
      stopJingle(); // ジングル中ポーズ: バックグラウンドで走り続けてstartBGMを呼ぶのを防ぐ
      /* bgmSource があれば現在位置を保存、なければ先頭(0)から再開 */
      _pauseBgmPos  = bgmSource ? _bgmAccumAudioTime : 0;
      _pauseBgmRate = bgmSource ? _bgmRateTo : 1.0;
      _destroyBGMSource();
    }
    applyMuteGain();
    draw(); // オーバーレイを即座に描画
  } else {
    if (_arrowProgressAtPause >= 0 && phase === 'shooting') {
      _arrowStartWallTime = performance.now() / 1000 - _arrowProgressAtPause * ARROW_FLIGHT_SEC;
      _arrowProgressAtPause = -1;
    }
    _rafId = requestAnimationFrame(_gameLoop);
    if (audioCtx) {
      const _doResumeBGM = () => {
        /* masterGain 経由でサイレントバッファを再生して AVAudioSession をアクティブ化する */
        try {
          const _b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          const _s = audioCtx.createBufferSource();
          _s.buffer = _b; _s.connect(masterGain); _s.start(audioCtx.currentTime);
        } catch(_e) {}
        applyMuteGain();
        _beatPulseCacheFrame = -1;
        /* bossVictory（勝利ファンファーレでbgmSourceを破棄済み）・trueEnding
           （専用オシレーターテーマのみでbgmSource自体を使わない）は、
           ポーズ解除してもBGMループを再開してはいけないフェーズ。
           以前はここがphaseを見ずに常に_bgmIsBossの値だけでバッファを選んで
           再生していたため、これらのフェーズ中にポーズ→解除すると
           （直前の_bgmIsBossの値次第で）通常BGMまたはボスBGMが誤って
           鳴り出してしまっていた（NO_BGM_SOURCE_PHASES参照） */

           再開後もボス用バッファを使い回す（_bgmIsBoss参照）。
           これを省略すると _createBGMSource() のデフォルト引数（通常バッファ）が
           使われてしまい、ボス戦中にポーズ→再開すると音色が通常BGMに戻ってしまう。
           地鳴りの現在の段階（_bossRumbleTier）も維持し、ポーズ→再開で
           マイルド化が振り出しに戻らないようにする（水平展開） */
        const _resumeBgmBuf = _bgmIsBoss
          ? ((bossBgmBuffers && bossBgmBuffers[_bossRumbleTier]) || bossBgmBuffer)
          : bgmBuffer;
        if (!_resumeBgmBuf) { return; }
        /* BGM再起動を100ms遅らせてiOSのAudio Sessionが完全に安定してから音を出す */
        setTimeout(() => {
          if (isPaused || NO_BGM_SOURCE_PHASES.has(phase)) return;
          _destroyBGMSource();
          const loopDur = _bgmQuantizedLoopDur > 0 ? _bgmQuantizedLoopDur : BGM_LOOP_DUR;
          const offset  = _pauseBgmPos % loopDur;
          const src     = _createBGMSource(_pauseBgmRate, _resumeBgmBuf);
          if (src) {
            const t = audioCtx.currentTime;
            src.start(t, offset);
            bgmPhaseRef = t - _pauseBgmPos;
            _bgmAccumLastWall = t;
            _bgmAccumLastPerf = performance.now() / 1000;
            bgmGain.gain.cancelScheduledValues(t);
            bgmGain.gain.setValueAtTime(1, t);
          }
        }, 100);
      };
      _resumeAudioCtx(_doResumeBGM);
    }
  }
}

function onShoot(_inputPerfMs){
  /* idle と reach の両フェーズで矢を放てる */
  if (phase!=='idle' && phase!=='reach') return;
  /* リーチ発動直後はエフェクト・SEを見せるため入力ロック */
  if (phase === 'reach' && reachTimer < REACH_LOCK_FRAMES) return;
  /* スローハンド発動直後はバッジ・テンポ変化に気づくまで入力ロック */
  if (performance.now() < slowHandLockUntil) return;
  if (curIdx>=4) return;
  if (performance.now() < shootGuardUntil) return; // init直後の誤射ブロック
  /* ── ビートシンクスコアを最初にキャプチャ（以降の処理による時刻ズレを防ぐ） ── */
  const _syncScore = (audioCtx && bgmPhaseRef !== null) ? calcSyncScore(_inputPerfMs) : null;
  /* 最初の矢: ベット確定 & コイン消費 & 実績 */
  if (curIdx === 0) {
    if (coins < bet) return; // 念のため
    betLocked = true;
    coins -= bet;
    /* ベット直後（このトライで所持コインが最も低くなる時点）にも実績チェックを
       挟む。以前はcheckCoinsAch()が4本目着弾後の配当加算後にしか呼ばれず、
       「残りわずかでベット→そのトライ自体が配当加算で一気に200超まで届く」
       ケースでは coins<=9 の瞬間が一度も観測されず、不死鳥（comeback、
       wasPoorフラグ）が立たないまま実績を取りこぼす不具合があった（実機指摘:
       「残1から当たりを重ねて200を越えたにもかかわらず実績がつかなかった」）。
       ベット直後の最安値をここで確実に拾うことで解消する */
    checkCoinsAch();
    unlockAch('first_shot');
    if (bet >= 100) unlockAch('bet_max');
    /* プレイ回数カウント */
    playCount++;
    if (playCount >= 100) unlockAch('play_10');
    if (playCount >= 500) unlockAch('play_50');
    lsSaveStats();
  }
  /* 矢数カウント */
  shotCount++;
  if (shotCount >= 1000) unlockAch('shot_100');
  lsSaveStats();
  const w=wheels[curIdx];
  w.result=hitResult(w); w.locked=true;
  phase='shooting';
  /* 発射時刻を記録:
     _arrowStartWallTime: アニメーション進行用（performance.now: suspended中も止まらない）
     _arrowStartAudioTime: 着弾音スケジュール用（audioCtx.currentTime: 音声API基準） */
  _arrowStartWallTime  = performance.now() / 1000;
  /* 発射SEは常に即時再生。ビートグリッドへのスナップは v3.80 で試行したが
     「正確に打てた時だけ音が拍に揃って聞こえる」こと自体がゲーム性の核であり、
     ズレた入力を補正して気持ちよく鳴らすのは設計思想に反するため廃止
     （着弾音のビートスナップ廃止に続き2度目の同結論。以後再試行しない） */
  _arrowStartAudioTime = audioCtx ? audioCtx.currentTime + 0.01 : 0;
  playSE('shoot'); // currentTime + 0.01 で即再生
  /* ── ビートシンク評価（先頭でキャプチャした値を使用） ── */
  if (_syncScore !== null) {
    const score = _syncScore;
    w.syncScore = score; // 結果文字の色付けに使用
    /* リングバッファへ追記 + syncRate更新（_pushSyncScore共通ヘルパー） */
    _pushSyncScore(score);
    /* このビートは発射済みとしてマーク（auto-decayが二重にカウントしないよう） */
    _autoDecayBeatIdx = BGM_BEAT > 0 ? Math.floor(_bgmAccumAudioTime / (BGM_BEAT * AUTO_DECAY_BEATS)) : -1;
    /* JUST/GOOD/OK 演出: 16回分のバッファが埋まり連続してsyncRate≥0.5になってから表示 */
    if (_syncHistCount >= SYNC_HIST_LEN && syncRateAboveCount >= SYNC_VISIBLE_THRESHOLD) {
      if (score >= 0.667) {        // ±33ms以内 → JUST
        syncJustLabel = 'JUST!'; syncChain++;
      } else if (score >= 0.333) { // ±67ms以内 → GOOD
        syncJustLabel = 'GOOD';  syncChain++;
      } else if (score > 0) {      // ±100ms以内 → OK
        syncJustLabel = 'OK';    syncChain = 0;
      } else {                     // ±150ms超 → NG
        syncJustLabel = '';      syncChain = 0;

      if (syncJustLabel) { syncJustTimer = 50; syncJustScore = score; }

  }
}

   - done(当たり)     : エフェクト中は無視。canRestart後はリセットのみ（発射しない）
   - done(GO)         : canRestartなら gameOverReset
   - tapestart        : 先打ちバッファ登録（解放時に自動発射）

  if (phase === 'bossOmen') {

    if (_omen && _omen.step >= 7 && _omen.timer > 20) _initBossBattle();

         真エンディングは実績パネルからいつでも見返せる） */

       一気に進める。速度が一定なのでスキップしても自然に流れた場合と
       同じ着地位置になる）。締めセリフが静止した後は演出に任せ、
       タイトル表示中のみCONTINUE操作を受け付ける（他のバッジ演出と同じ操作感） */
    if (_trueEnding.stage === 'scroll') {
      _trueEnding.scrollY = _trueEnding.targetScrollY;
      _trueEndingEnterStage('closeLinesRest');
    } else if (_trueEnding.stage === 'titleHold' && _trueEnding.canExit) {
      _startScreenFade(() => _finishTrueEnding());
    }
    return;
  }
  if (phase === 'bossDefeat') {
    /* 所持ギヨウザが尽きる・尽きないに関わらず、通常モードへ戻る前に必ず
       キングが縮んでギヨウザ群へ弾け散るつなぎ演出(_startBossDefeatShrink、
       内部でクロスフェード後にbossDefeatOutroへ自動遷移)を優先する
       （ユーザー要望: 「所持ギヨウザが0になる場合、キングギヨウザが戻って
       飛んでいく演出を優先してください。その後、所持ギヨウザ0のゲーム
       オーバー演出に進んでください」）。全損時のゲームオーバー画面への
       分岐は_kingBattleEnd側で行う。CONTINUEバッジの表示に合わせて
       90フレーム待つ（drawBossDefeat参照） */
    if (_bossDefeatTimer > 90) _startBossDefeatShrink();
    return;
  }
  if (phase === 'bossDefeatShrink') {
    /* 縮小演出中は入力を無視（_updateBossDefeatShrinkが自動的に
       弾け散り演出へ進める） */
    return;
  }
  if (phase === 'bossDefeatOutro') {
    /* タップ待ちにせず時間経過で自動的に通常モードへ戻る（ユーザー要望:
       CONTINUE待ちは不要、時間で進んで良い）。復帰そのものは_updateBossDefeatOutro
       が_startScreenFade経由で行うため、このphase中の入力は無視する */
    return;
  }
  if (phase === 'done') {
    if (isGameOver) { if (canRestart) gameOverReset(); return; }
    if (isMissResult) {
      /* ハズレ: 結果文字を即座に完全表示してバッファ登録。canRestartなら即時リセット＋発射 */
      for (const w of wheels) { if (w.result) w.resultPop = 1; }
      pendingShoot = true;
      if (canRestart) {
        if (_maybeStartBossOmen()) return;
        init(); shootGuardUntil = 0; pendingShoot = false; onShoot(inputPerfMs);
      }
      return;
    }
    /* フィーバー大当たり: クリックで即時リセット＋pendingShoot引き継ぎ */
    if (_jackpotAutoReset) {
      if (_maybeStartBossOmen()) return;
      pendingShoot = true;
      _doAutoReset(inputPerfMs); return;
    }
    /* 当たり: エフェクト終了前は無視。終了後（canRestart）はリセットのみ、発射しない */
    if (canRestart) {
      if (_maybeStartBossOmen()) return;
      init(); shootGuardUntil = 0;
    }
    return;
  }
  if (phase === 'tapestart') { pendingShoot = true; return; }
  /* 4本目の矢が飛行中（curIdx===3）にクリックした場合、着弾→done直後にそのまま発射 */
  if (phase === 'shooting' && curIdx === 3) { pendingShoot = true; return; }
  /* スローランプ中（BGMテンポ加減速）はクリックを無視: せっかくの演出を邪魔しない
     ただし AudioContext が suspended の場合は currentTime が止まるためロックを免除する */
  if (slowRampEndTime > 0 && audioCtx && audioCtx.state !== 'suspended'
      && audioCtx.currentTime < slowRampEndTime) return;
  onShoot(inputPerfMs); // idle / reach
}

const CHEAT_MAP = { 'KeyG':'ギ', 'KeyY':'ヨ', 'KeyU':'ウ', 'KeyZ':'ザ' };
/* e.code のフォールバック用（e.key、大小文字問わず）。iOS Safari + 外付け
   （Bluetooth）キーボードの一部組み合わせでKeyboardEvent.codeが正しく
   取得できない既知の問題への対策（実機指摘: 「矢文字チートが効いていな
   かった」。Ctrl+F/T/CをiOS予約ショートカットと衝突しないキーへ変更した
   後もなお発火しなかったため、.codeそのものが信頼できない可能性を疑い、
   より安定して取得できる.keyでも判定できるようにした）。以下すべての
   キー判定に同じフォールバックを適用する */
const CHEAT_MAP_BY_KEY = { 'g':'ギ', 'y':'ヨ', 'u':'ウ', 'z':'ザ' };
function _keyMatches(e, codes, keys) {
  return codes.includes(e.code) || keys.includes((e.key || '').toLowerCase());
}

function cheatShoot(char) {
  if (phase!=='idle'||curIdx>=4) return;
  const w = wheels[curIdx];
  const s = w.segs.find(seg => seg.char === char);
  if (!s) return;
  /* ポインタ位置にセグメント中央が来るよう回転を強制 */
  w.rot = (IS_PORTRAIT ? 0 : -Math.PI/2) - s.start - s.span/2;
  onShoot();
}

document.addEventListener('keydown', e=>{
  if (KEY_DEBUG_ON) {
    _keyDebugLog.unshift(`code=${e.code||'(空)'} key=${e.key||'(空)'} ctrl=${e.ctrlKey} meta=${e.metaKey} alt=${e.altKey} shift=${e.shiftKey}`);
    if (_keyDebugLog.length > 6) _keyDebugLog.length = 6;
  }
  if (phase === 'startup') {
    if (e.code === 'Space') { e.preventDefault(); if (!audioCtx) getAudioCtx(); initGame(); }
    return;
  }
  if (isPaused) return;
  if (showAchievements) {
    e.preventDefault(); showAchievements = false; return;
  }
  if (e.code==='Space') {
    e.preventDefault();
    handleGameClick(e.timeStamp);
    return;
  }
  /* カーソル左右でBET変更 */
  if ((e.code==='ArrowLeft'||e.code==='ArrowRight') && !betLocked && (phase==='idle'||phase==='reach')) {
    e.preventDefault();
    /* スローハンドランプ中はBET変更ロック（suspended時は currentTime が止まるためロック免除） */
    if (slowRampEndTime > 0 && audioCtx && audioCtx.state !== 'suspended'
        && audioCtx.currentTime < slowRampEndTime) return;
    changeBet(e.code==='ArrowLeft' ? -1 : +1);
    return;
  }
  const _cheatChar = CHEAT_MAP[e.code] ?? CHEAT_MAP_BY_KEY[(e.key || '').toLowerCase()];
  if (_cheatChar && phase==='idle' && curIdx<4) {
    e.preventDefault();
    cheatShoot(_cheatChar);
  }
  /* チート: Ctrl+F（+ 代替Ctrl+J） → 当たり判定時にフィーバーを予約
     Ctrl+C/Ctrl+T/Ctrl+FがiOSで機能しない件（下記コメント参照）に伴い、
     代替キーを追加。デスクトップの既存キーは互換のため残す */
  if (_keyMatches(e, ['KeyF', 'KeyJ'], ['f', 'j']) && e.ctrlKey) {
    e.preventDefault();
    _cheatFeverQueued = true;
  }
  /* 隠しコマンド: Ctrl+C（+ 代替Ctrl+Q） → localStorage全消去してリロード */
  if (_keyMatches(e, ['KeyC', 'KeyQ'], ['c', 'q']) && e.ctrlKey) {
    e.preventDefault();
    try { localStorage.clear(); } catch(err) {}
    location.reload();
  }
  /* デバッグ: Ctrl+T（+ 代替Ctrl+L） → 当たり判定時にスローハンドを予約（2回押しでキャンセル）
     iOS Safari + 外付け（Bluetooth）キーボードでは、AppleがOS標準の
     ハードウェアキーボード編集ショートカットとして Control-A/B/D/E/F/H/K/N/P/T
     （Emacs風のカーソル移動・削除・文字入れ替え）をシステムレベルで予約しており、
     テキスト入力欄にフォーカスが無くても keydown がページのJSへ届く前に消費
     されてしまう（実機指摘: 「iPhone+Bluetoothキーボードでチートキーが使えない」）。
     このゲームのCtrl+F・Ctrl+T・Ctrl+Cは全てこの予約セットと衝突しているため、
     予約セットに含まれないキー（J/L/Q）を代替として割り当てた。
     さらに矢文字チート（G/Y/U/Z、無修飾）でも反応がないという実機指摘を受け、
     KeyboardEvent.code自体がこの環境で信頼できない可能性を疑い、全てのキー
     判定に.keyでのフォールバック（_keyMatches）を追加した */
  if (_keyMatches(e, ['KeyT', 'KeyL'], ['t', 'l']) && e.ctrlKey) {
    e.preventDefault();
    if (_cheatSlowQueued !== null) {
      _cheatSlowQueued = null; // 2回押しでキャンセル
    } else {
      _cheatSlowQueued = !isSlowSpin; // 現在の状態をトグル予約
    }
  }
});

canvas.addEventListener('mousedown', e=>{
  if (e.button !== 0) return;
  _ensureCanvasFocus();
  /* 入力物理発生時刻（performance.now() 基準 ms。ハンドラ到達前の遅延を補正） */
  const inputPerfMs = e.timeStamp;
  /* _canvasRect キャッシュを使用（getBoundingClientRect() 強制レイアウトを排除） */
  const cx = (e.clientX - _canvasRect.left) * (W / _canvasRect.width);
  const cy = (e.clientY - _canvasRect.top)  * (H / _canvasRect.height);
  if (CHEAT_PANEL_ON) {
    for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
      if (hitTest(_cheatPanelRect(i), cx, cy)) { _runCheatPanelAction(CHEAT_PANEL_BTNS[i].id); return; }
    }
  }
  if (FS_SUPPORTED && hitTest(FS_BTN_RECT, cx, cy)) { toggleFullscreen(); return; }
  if (phase === 'startup') {
    if (hitTest(ACH_TROPHY, cx, cy)) { showAchievements = !showAchievements; return; }
    if (trueEndingSeen && hitTest(TRUE_ENDING_BTN, cx, cy)) { if (!audioCtx) getAudioCtx(); _startTrueEnding(true); return; }
    if (hitTest(MUTE_BTN, cx, cy)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
    if (showAchievements) { showAchievements = false; return; }
    if (hitTest(STARTUP_BTN, cx, cy) && Date.now() >= _startupGuardUntil) { if (!audioCtx) getAudioCtx(); initGame(); return; }
    return;
  }
  if (hitTest(PAUSE_BTN, cx, cy)) { togglePause(); return; }
  if (isPaused) {
    /* PAUSE中はゲームループが止まっているため操作後に draw() を明示的に呼ぶ（mousedown）
       touchstart ハンドラはゲームループが動いているため draw() 不要（非対称だが意図的） */
    if (hitTest(ACH_TROPHY, cx, cy)) { showAchievements = !showAchievements; draw(); return; }
    if (showAchievements) { showAchievements = false; draw(); return; }
    if (hitTest(MUTE_BTN, cx, cy)) { if (!audioCtx) getAudioCtx(); toggleMute(); draw(); return; }
    return;
  }
  if (showAchievements) { showAchievements = false; return; }
  if (hitTest(ACH_TROPHY, cx, cy)) { showAchievements = true; return; }
  if (hitTest(MUTE_BTN, cx, cy)) {
    /* AudioContextがなければ初期化してからミュート切り替え */
    if (!audioCtx) getAudioCtx();
    toggleMute(); return;
  }
  /* ベット◀▶ボタン（縦画面 or PCボトムバー） */
  if (!betLocked && (phase==='idle'||phase==='reach')) {
    /* スローハンドランプ中はBET変更ロック */
    if (!(slowRampEndTime > 0 && audioCtx && audioCtx.state !== 'suspended'
          && audioCtx.currentTime < slowRampEndTime)) {
      const decBtn = IS_PORTRAIT ? P_BET_DEC_BTN : BET_DEC_BTN;
      const incBtn = IS_PORTRAIT ? P_BET_INC_BTN : BET_INC_BTN;
      if (decBtn && hitTest(decBtn, cx, cy)) { changeBet(-1); return; }
      if (incBtn && hitTest(incBtn, cx, cy)) { changeBet(+1); return; }
    }
  }
  handleGameClick(inputPerfMs);
});

/* タッチ操作対応（ページ内どこでもタップで反応） */
document.addEventListener('touchstart', e=>{
  e.preventDefault();
  /* 入力物理発生時刻（performance.now() 基準 ms） */
  const inputPerfMs = e.timeStamp;
  const pt = touchToCanvas(e.touches[0]);
  if (CHEAT_PANEL_ON) {
    for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
      if (hitTest(_cheatPanelRect(i), pt.x, pt.y)) { _runCheatPanelAction(CHEAT_PANEL_BTNS[i].id); return; }
    }
  }
  /* 全画面ボタン: 最初にチェック（全フェーズで有効） */
  if (FS_SUPPORTED && hitTest(FS_BTN_RECT, pt.x, pt.y)) { toggleFullscreen(); return; }
  /* すべてのタッチで AudioContext をアンロックする。
     iOS Safari: touchstart はユーザーアクティベーションとして認定される。
     resume() + masterGain 経由サイレントバッファで AVAudioSession を開通させる。
     START ボタンの音声スケジューリング（initGame）は touchend で行う（後述）。 */
  _unlockAudio();
  _ensureCanvasFocus(); // 外付けキーボードのkeydownをページへ配送させるためのフォーカス確保

  if (phase === 'startup') {
    if (hitTest(ACH_TROPHY, pt.x, pt.y)) { showAchievements = !showAchievements; return; }
    if (trueEndingSeen && hitTest(TRUE_ENDING_BTN, pt.x, pt.y)) {
      /* STARTボタンと同様、resume()完了を待ってからtouchendで再生開始する */
      _pendingTrueEndingReplay = true;
      return;
    }
    if (hitTest(MUTE_BTN, pt.x, pt.y)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
    if (showAchievements) { showAchievements = false; return; }
    if (hitTest(STARTUP_BTN, pt.x, pt.y) && Date.now() >= _startupGuardUntil) {
      /* touchstart では resume() + サイレントバッファ（ハンドラ冒頭）だけ行い、
         initGame() は touchend で呼ぶ。指を離す瞬間（touchend）も iOS のユーザー
         ジェスチャーとして認定されるため、resume() が確実に完了した状態で
         playStartJingle() を実行できる。 */
      _pendingInitGame = true;
      return;
    }
    return;
  }
  if (hitTest(PAUSE_BTN, pt.x, pt.y)) { togglePause(); return; }
  if (isPaused) {
    if (hitTest(ACH_TROPHY, pt.x, pt.y)) { showAchievements = !showAchievements; draw(); return; }
    if (showAchievements) { showAchievements = false; draw(); return; }
    if (hitTest(MUTE_BTN, pt.x, pt.y)) { if (!audioCtx) getAudioCtx(); toggleMute(); draw(); return; }
    return;
  }
  /* 実績オーバーレイ中 */
  if (showAchievements) { showAchievements = false; return; }
  /* トロフィーボタン */
  if (hitTest(ACH_TROPHY, pt.x, pt.y)) { showAchievements = true; return; }

  /* ミュートボタン */
  if (hitTest(MUTE_BTN, pt.x, pt.y)) {
    if (!audioCtx) getAudioCtx();
    toggleMute(); return;
  }

  /* スマホ: ベット◀▶ボタン */
  if (!betLocked && (phase==='idle'||phase==='reach')) {
    /* スローハンドランプ中はBET変更ロック */
    if (!(slowRampEndTime > 0 && audioCtx && audioCtx.state !== 'suspended'
          && audioCtx.currentTime < slowRampEndTime)) {
      const decBtn = IS_PORTRAIT ? P_BET_DEC_BTN : BET_DEC_BTN;
      const incBtn = IS_PORTRAIT ? P_BET_INC_BTN : BET_INC_BTN;
      if (decBtn && hitTest(decBtn, pt.x, pt.y)) { changeBet(-1); return; }
      if (incBtn && hitTest(incBtn, pt.x, pt.y)) { changeBet(+1); return; }
    }
  }

  handleGameClick(inputPerfMs);
}, { passive: false });

/* touchend ハンドラ: START ボタンのゲーム開始処理
   touchstart で resume() + サイレントバッファを発行し、
   指を離す touchend で initGame() を呼ぶことで、iOS Safari が
   AudioContext を確実に running にしてからジングルを開始できる。
   touchend も iOS ユーザーアクティベーションとして認定される。 */
document.addEventListener('touchend', e => {
  if (_pendingTrueEndingReplay) {
    _pendingTrueEndingReplay = false;
    e.preventDefault();
    if (!audioCtx) getAudioCtx();
    _startTrueEnding(true);
    return;
  }
  if (!_pendingInitGame) return;
  _pendingInitGame = false;
  e.preventDefault();
  initGame();
}, { passive: false });

/* ════════════════ キャンバス初期化 ════════════════ */

/* ── キャンバスをビューポートに合わせてスケール ── */
function fitCanvas() {
  /* visualViewport はブラウザUIを除いた実際の表示領域を返す
     iOS Safari のアドレスバー・タブバーがある場合も正確なサイズが得られる */
  const vv     = window.visualViewport;
  const vpW    = vv ? vv.width  : document.documentElement.clientWidth;
  const vpH    = vv ? vv.height : document.documentElement.clientHeight;

  /* セーフエリア量をCSSカスタムプロパティから取得してスケール計算に反映 */
  const _cs  = getComputedStyle(document.documentElement);
  const _saT = parseFloat(_cs.getPropertyValue('--sat')) || 0;
  const _saR = parseFloat(_cs.getPropertyValue('--sar')) || 0;
  const _saB = parseFloat(_cs.getPropertyValue('--sab')) || 0;
  const _saL = parseFloat(_cs.getPropertyValue('--sal')) || 0;

  const h1El   = document.querySelector('h1');
  const titleH = (h1El && getComputedStyle(h1El).display !== 'none')
    ? h1El.getBoundingClientRect().height + 6 : 0;
  const MARGIN = 8;
  const scale  = Math.min(
    (vpW - _saL - _saR - MARGIN * 2) / W,
    (vpH - _saT - _saB - MARGIN * 2 - titleH) / H
  );
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  /* 背景グラジェントを再生成（canvasサイズ変化時のみ） */
  bgGradient = ctx.createLinearGradient(0, 0, 0, H);
  bgGradient.addColorStop(0, '#145c24');
  bgGradient.addColorStop(0.5, '#0f5020');
  bgGradient.addColorStop(1, '#0a3d18');

  /* 静的レイヤー（雲・獅子）を OffscreenCanvas に事前描画
     毎フレームの Canvas パス命令群 → drawImage() 1回に圧縮 */
  _prebuildStaticLayers();
  /* BET ラベル幅を計測してキャッシュ（フォント・テキスト不変なので1回だけ） */
  _initBetLabelWidth();

  /* _canvasRect キャッシュを更新: 入力ハンドラ内での getBoundingClientRect() 強制レイアウトを排除 */
  requestAnimationFrame(() => { _canvasRect = canvas.getBoundingClientRect(); });
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', () => setTimeout(() => location.reload(), 300));
/* visualViewport のリサイズ（アドレスバー出現・消滅）にも追従 */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitCanvas);
}
fitCanvas();
_ensureCanvasFocus(); // 初回ロード時点でも試みる（iOSはジェスチャー無しでは定着しないためtouchstart側が本命）

/* ── 全画面切替（Fullscreen API 対応環境のみ有効） ── */
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document).catch(()=>{});
  }
}

if (FS_SUPPORTED) {
  function onFsChange() {
    _isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    setTimeout(fitCanvas, 150);
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
}
</script>
</body>
</html>
