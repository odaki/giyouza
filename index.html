<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
<link rel="icon" type="image/png" href="android-touch-icon.png" sizes="192x192" />
<title>ギヨウザルーレット</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
/* セーフエリア: env()はJSから直接読めないためCSSカスタムプロパティ経由で公開 */
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0f5c22;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
body {
  /* ノッチ・Dynamic Island・ホームインジケータ領域をパディングで除外 */
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}
h1 {
  display: none; /* スタートアップ画面はCanvasで描画するため常時非表示 */
}
canvas {
  display: block;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 3px #c8a800;
  touch-action: none; /* スクロール・ズームを完全に無効化してタッチ遅延を排除 */
  will-change: filter; /* filter変化をGPUレイヤーで処理してメインスレッドへの影響を軽減 */
}
/* 横向き小型画面: タイトルを非表示にしてキャンバスを最大化 */
@media (max-height: 480px) and (orientation: landscape) {
  h1 { display: none; }
}
/* キャンバスラッパー */
#canvas-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
}
</style>
</head>
<body>
<h1>ギヨウザルーレット</h1>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════
   目次 (Table of Contents)
   ────────────────────────────────────────────────────────────────
   ■ 定数              canvas・DPR・カラー・サイズ・当たり判定テーブル
                        全画面ボタン定数（FS_SUPPORTED・Path2D等）
   ■ キャッシュ・プール  オブジェクトプール・文字列キャッシュ・LUT
   ■ ゲーム状態         フェーズ・矢・コイン・ビートシンク変数群
   ■ 実績システム        実績定義・localStorage キー
   ■ UI レイアウト定数   ボタン・BETバー座標定数
   ■ Audio System       AudioContext・BGM・レートランプ・ビートパルス
   ■ 効果音             playSE
   ■ 永続化             localStorage 読み書き・スキーマチェック
   ■ Startup Jingle     スタートジングルスケジューラ
   ■ Init               ゲーム初期化・リセット
   ■ コイン・BET        clampBet・changeBet・calcPayout
   ■ Update             毎フレーム状態更新
   ■ 勝利エフェクト      花火・ウヨウヨ・落下ギヨウザ・ウザウザ
                        ギウギウ・ギギギギ・ヨヨヨヨ・ウウウウ
                        ザザザザ・ギョギョ
   ■ 画面エフェクト      ギザギザ・ウザウザフラッシュ
   ■ 吉祥雲 / 獅子
   ■ Draw helpers       outText・easeOutBack・roundRect・_drawBtnBg
   ■ Main draw          draw() メインループ描画
   ■ 描画関数群          BETボタン・的・矢・コインヘッダ・BETバー等
   ■ Startup Screen     スタート画面
   ■ Loop / Input       ゲームループ・入力ハンドラ
   ■ キャンバス初期化    fitCanvas（セーフエリア対応）
   ■ 全画面切替         toggleFullscreen・onFsChange
   ════════════════════════════════════════════════════════════════ */

/* ════════════════ 定数 ════════════════ */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false }); // 毎フレーム全面を塗るため不透明化（ページとの合成コスト削減）
/* iOS Safari + 外付け（Bluetooth）キーボード対策: hardware keydownがページの
   JSへ配送されるには、ページ内のどこかにフォーカス可能な要素が実際に
   フォーカスされている必要がある。このゲームはcanvas1枚だけのUIで
   tabindexも無いため、タップしてもどの要素にもフォーカスが当たらず、
   キーボード自体もSafari自体への配送も生きているのにkeydownがページへ
   一切届かない状態になっていた（実機指摘: 「URL欄には直接入力できるのに、
   矢文字チートに無反応」＝キーボード入力経路自体は生きているのに
   ページ内フォーカス先が無かったための取りこぼしと推測される）。
   canvasをプログラム的にフォーカス可能にし、タップのたびに明示的に
   フォーカスを取り直す（_ensureCanvasFocus参照） */
canvas.tabIndex = -1;
function _ensureCanvasFocus() {
  try { canvas.focus({ preventScroll: true }); } catch(_e) { try { canvas.focus(); } catch(_e2) {} }
}
/* タッチデバイス判定 & 向き */
const IS_TOUCH    = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
/* ?portrait URL パラメータでデスクトップからでも縦画面テスト可能 */
const _forcePortrait = new URLSearchParams(location.search).has('portrait');
const IS_PORTRAIT = _forcePortrait || (IS_TOUCH && window.innerWidth < window.innerHeight);

const W = IS_PORTRAIT ? 420  : 1060;
const H = IS_PORTRAIT ? 820  : 560;
/* ?cheatpanel URL パラメータで画面下端にタップ式チートパネルを表示する。
   iOS Safari + 外付け（Bluetooth）キーボードでkeydown系のチートキー
   （Ctrl+F/T/C・矢文字G/Y/U/Z）が一切反応しない不具合（実機指摘、複数の
   JS側対策：予約ショートカット回避キー・KeyboardEvent.keyフォールバック・
   canvasフォーカス確保、を試したが解消せず）への対処。タップはこのゲーム
   の主入力手段そのものであり確実に届くため、キーボードに依存しない
   代替経路として用意する。本番プレイでは?cheatpanelを付けない限り
   一切描画・判定されない（既存の?king=等のデバッグ用URLパラメータと
   同じ位置づけ） */
const CHEAT_PANEL_ON = new URLSearchParams(location.search).has('cheatpanel');
const CHEAT_PANEL_BTNS = [
  { id: 'fever',  label: 'FEVER' },
  { id: 'slow',   label: 'SLOW'  },
  { id: 'clr',    label: 'CLR'   },
  { id: 'allach', label: 'ACH'   },
  { id: 'gi',     label: 'ギ'    },
  { id: 'yo',     label: 'ヨ'    },
  { id: 'u',      label: 'ウ'    },
  { id: 'za',     label: 'ザ'    },
];
function _cheatPanelRect(i) {
  const h = 26, gap = 2;
  const w = (W - gap * (CHEAT_PANEL_BTNS.length - 1)) / CHEAT_PANEL_BTNS.length;
  return { x: i * (w + gap), y: H - h, w, h };
}
function _runCheatPanelAction(id) {
  if (id === 'fever') { _cheatFeverQueued = true; return; }
  if (id === 'slow') {
    _cheatSlowQueued = _cheatSlowQueued !== null ? null : !isSlowSpin;
    return;
  }
  if (id === 'clr') {
    try { localStorage.clear(); } catch(_e) {}
    location.reload();
    return;
  }
  if (id === 'allach') {
    /* こんがり以外の実績を全て達成状態にする（キングギヨウザ出現条件のテスト用。
       こんがり自体はキングギヨウザ討伐でのみ解除される最後の実績のため対象外にする
       ＝_allAchExceptKongariDoneと同じ判定基準）。
       最大18件が同一フレームで解除されるため、実績解除音が完全に重なって
       割れて聞こえるとの実機報告があった。90msずつずらして鳴らすことで、
       マスターリミッター任せにせず発音側でも重なりを減らす */
    let i = 0;
    for (const a of ACHIEVEMENTS) if (a.id !== KONGARI_ACH_ID) { unlockAch(a.id, i * 0.09); i++; }
    return;
  }
  const charMap = { gi: 'ギ', yo: 'ヨ', u: 'ウ', za: 'ザ' };
  if (charMap[id] && phase === 'idle' && curIdx < 4) cheatShoot(charMap[id]);
}
function drawCheatPanel() {
  if (!CHEAT_PANEL_ON) return;
  ctx.save();
  ctx.font = `bold 11px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
    const r = _cheatPanelRect(i);
    ctx.fillStyle = 'rgba(200,0,80,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    ctx.fillStyle = '#fff';
    ctx.fillText(CHEAT_PANEL_BTNS[i].label, r.x + r.w / 2, r.y + r.h / 2);
  }
  ctx.restore();
}

/* ?keydebug URL パラメータで、実機に届いたkeydownイベントの生の内容を
   画面上に表示する診断オーバーレイ。ユーザー指摘: 「過去に試した時は
   キーが効いた気がする、iPadだった可能性がある」。iPhone単体では
   Ctrl+F/T/C（予約ショートカット回避キー含む）・矢文字G/Y/U/Z・
   canvasフォーカス確保、いずれの対策後もキーボードチートが反応せず、
   一方でiPadでは過去に動いていた可能性があるという新情報が出たため、
   「そもそもkeydownが届いているか」を実機で直接確認できるようにする
   （Web Inspector接続なしでも実機の画面だけで判断できる）。keydown
   ハンドラの最も外側（他の早期returnより前）でログに追記するため、
   ゲームのphase等に関係なく全てのkeydownを捕捉する */
const KEY_DEBUG_ON = new URLSearchParams(location.search).has('keydebug');
let _keyDebugLog = [];
function drawKeyDebug() {
  if (!KEY_DEBUG_ON) return;
  ctx.save();
  ctx.font = '11px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  const lines = _keyDebugLog.length ? _keyDebugLog : ['(まだkeydownを受信していません)'];
  const lineH = 14;
  const boxH = lineH * lines.length + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(4, 4, W - 8, boxH);
  ctx.fillStyle = '#0f0';
  lines.forEach((line, i) => ctx.fillText(line, 8, 8 + i * lineH));
  ctx.restore();
}
/* devicePixelRatio対応: バッファを物理ピクセル解像度で確保して高DPI端末でも鮮明に描画 */
const _dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
canvas.width  = W * _dpr;
canvas.height = H * _dpr;
ctx.scale(_dpr, _dpr);


const VERSION = 'v5.18';

/* ── カラー ── */
const Y   = '#f5d020';
const YD  = '#c8a800';
const GN  = '#0f5c22';
const GN2 = '#1a7a30';

/* ホイールハブグラジェント: 全ホイール・全トライ共通（毎トライの生成＆GCを排除）
   ctx.scale(_dpr,_dpr)適用済み・カラー定数定義後に1回だけ生成。
   drawWheel()内でctx.translate後に使うためグラジェント座標(0,0)は
   常にホイール中心に正しくマッピングされる。 */
const _WHEEL_HUB_GRD = (() => {
  const g = ctx.createRadialGradient(0,0,0,0,0,10);
  g.addColorStop(0,'#fffde7'); g.addColorStop(1,YD);
  return g;
})();

const SEG_D = { 'ギ':'#7b1a1a', 'ヨ':'#164d28', 'ウ':'#7a4e00', 'ザ':'#1a2e5a',
  'こ':'#5c3a1e', 'ん':'#6e2f12', 'が':'#4a2408', 'り':'#7a4a10' };
const SEG_L = { 'ギ':'#c0392b', 'ヨ':'#27ae60', 'ウ':'#e8a000', 'ザ':'#2471a3',
  'こ':'#c98a42', 'ん':'#e08a3c', 'が':'#a8611f', 'り':'#f0a94a' };

const CHARS  = ['ギ', 'ヨ', 'ウ', 'ザ'];
const TARGET   = ['ギ', 'ヨ', 'ウ', 'ザ'];  // 大当たり
const KING_CHARS  = ['こ', 'ん', 'が', 'り'];
const KING_TARGET = ['こ', 'ん', 'が', 'り'];  // キングギヨウザへの焼き攻撃
const UYOUYO   = ['ウ', 'ヨ', 'ウ', 'ヨ'];  // 中当たり①
const GIUGIU   = ['ギ', 'ウ', 'ギ', 'ウ'];  // 中当たり②
const YOYOYOYO = ['ヨ', 'ヨ', 'ヨ', 'ヨ'];  // 中当たり③
const UUUU     = ['ウ', 'ウ', 'ウ', 'ウ'];  // 中当たり④
const GYOGYO   = ['ギ', 'ヨ', 'ギ', 'ヨ'];  // 中当たり⑤
const GIZAGIZA = ['ギ', 'ザ', 'ギ', 'ザ'];  // 小当たり①
const UZAUZA   = ['ウ', 'ザ', 'ウ', 'ザ'];  // 小当たり②
const GIGIGIGI = ['ギ', 'ギ', 'ギ', 'ギ'];  // 小当たり③
const ZAZAZAZA = ['ザ', 'ザ', 'ザ', 'ザ'];  // 小当たり④

const WR  = IS_PORTRAIT ? 66  : 95;
/* KING_WR: こんがりミニリール半径。let なのは縦画面で_initBossBattle実行時に
   横幅いっぱいへ動的に広げ直すため（実機要望: 「小さすぎる、左右上部の
   アイコン部を除いた横幅と同程度に」。BTN_RIGHT/BTN_SIZEがこの宣言より
   後で定義されるため、依存する再計算はここではなく_initBossBattle内で行う）。
   ここでの初期値は横画面（常にこのまま）およびBTN_*定義前の暫定値 */
let KING_WR = IS_PORTRAIT ? 24 : 34; // こんがりミニリール半径（通常ホイールより小さい）
const KING_REEL_GAP = 10; // 縦画面: 的同士の隙間(px)。BTN_M/BTN_GAPと同じ値で統一
/* こんがりリール結果文字（的の下に表示）: フォントサイズは的の大きさに比例させる。
   KING_RESULT_H はレイアウト側（_initBossBattle）で確保する縦スペースで、
   ここで使う値と同じ式にしないと表示がゲージ枠にはみ出す／余白が余る。
   KING_WR 同様、縦画面では_initBossBattle内で再計算される */
const KING_RESULT_GAP  = 6;
let KING_RESULT_FONT = Math.round(KING_WR * 0.55);
let KING_RESULT_H    = KING_RESULT_GAP + KING_RESULT_FONT + 4;
/* こんがりリールの文字配分（%）: 4本の的それぞれが独立に、狙って命中させた
   文字の比率を少しずつ増やしていく（ユーザー要望）。的ごとに履歴を分けて
   持つ必要があるため _king.charWeights（4的ぶんの配分オブジェクト配列）で
   管理する。当初はFEVER中の通常ホイール比率（97%/1%、createWheel参照）と
   揃えていたが、ユーザー要望でさらに極端な偏り（0.1%/99.7%）まで許容する
   よう変更した */
const KING_WEIGHT_MIN  = 0.1;
const KING_WEIGHT_MAX  = 99.7;
const KING_WEIGHT_STEP = 2; // 命中のたびに命中文字の比率へ加算する量（%）
const WXS = IS_PORTRAIT ? [210, 210, 210, 210] : [230, 430, 630, 830];
/* 縦画面: 全要素間隔を G=21px 均等（キャンバス上下マージン21pxと同一）
   コインヘッダ下端(y=99) +21 → W1中心(186) +132 +21 → W2(339) → W3(492) → W4(645) +132 +21 → BETバー上端(732) */
const WYS = IS_PORTRAIT ? [186, 339, 492, 645] : [235, 235, 235, 235];


/* ════════════════ キャッシュ・プール ════════════════ */

/* ── キャッシュ（canvas生成後に初期化） ── */
let bgGradient = null;   // 背景グラジェント（fitCanvas後に1回生成）
let _lastFilter = '';    // canvas.style.filter の前回値（変化時のみ書き込み）
/* getBoundingClientRect() キャッシュ: 入力ハンドラ内での強制レイアウトを排除
   fitCanvas（リサイズ時）にのみ更新する */
let _canvasRect = { left: 0, top: 0, width: 1, height: 1 };
let _noiseBuffer = null; // 事前生成ホワイトノイズバッファ（playNoise用、毎回生成しない）

/* ── 静的レイヤーキャッシュ ──
   雲・獅子は毎フレーム同じパスを繰り返し描画していた。
   OffscreenCanvas に事前描画しておき、drawImage() 1回で済ませる。 */
let _staticLayerCanvas = null; // 雲 + 獅子（PC のみ）を合成した透明オフスクリーン

function _prebuildStaticLayers() {
  /* OffscreenCanvas 未対応の古いブラウザではスキップ（通常描画にフォールバック） */
  if (typeof OffscreenCanvas === 'undefined') return;
  const oc  = new OffscreenCanvas(W * _dpr, H * _dpr);
  const oc2 = oc.getContext('2d');
  oc2.scale(_dpr, _dpr);

  /* 背景グラジェントも焼き込み（draw() 冒頭の全画面 fillRect を排除） */
  const bg = oc2.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#145c24');
  bg.addColorStop(0.5, '#0f5020');
  bg.addColorStop(1, '#0a3d18');
  oc2.fillStyle = bg;
  oc2.fillRect(0, 0, W, H);

  /* 雲を描く */
  for (const c of CLOUDS) _drawCloudTo(oc2, c.x, c.y, c.s, c.a, c.r);

  /* PC レイアウトのみ獅子を合成。
     獅子を一時 OffscreenCanvas に不透明で描いてから 0.6 alpha で貼り付け。
     oc2 に直接 globalAlpha=0.6 で描くと内部パーツもすべて半透明（X線状態）になるため
     この2段階方式で「内部は不透明・全体を 0.6 でブレンド」を実現する。 */
  if (!IS_PORTRAIT) {
    const lc  = new OffscreenCanvas(W * _dpr, H * _dpr);
    const lc2 = lc.getContext('2d');
    lc2.scale(_dpr, _dpr);
    _drawShishiTo(lc2, 78,  360, 0.82, false);
    _drawShishiTo(lc2, 983, 360, 0.82, true);
    oc2.globalAlpha = 0.6;
    oc2.drawImage(lc, 0, 0, W, H); // CSSピクセルサイズを明示（省略するとDPR倍になり消える）
    oc2.globalAlpha = 1;
  }
  /* 上下の金帯も焼き込み（毎フレームの fillRect×4 を排除） */
  oc2.fillStyle = Y;
  oc2.fillRect(0, 0, W, 6); oc2.fillRect(0, H - 6, W, 6);
  oc2.globalAlpha = 0.4;
  oc2.fillRect(0, 8, W, 3); oc2.fillRect(0, H - 11, W, 3);
  oc2.globalAlpha = 1;
  _staticLayerCanvas = oc;
}

/* ── 文字列キャッシュ（coins/bet が変わった時だけ再計算） ──
   fmt() = toLocaleString('ja-JP') と measureText は毎フレーム呼ぶには重い。
   値が変わった時だけ更新する遅延キャッシュにする。              */
let _cachedCoinsStr  = '';     // fmt(Math.round(coinsDisp))
let _cachedBetStr    = '';     // fmt(bet)
let _cachedBestStr   = '';     // `BEST ${fmt(bestCoins)}`
let _cachedBetIdx    = -1;     // BET_OPTIONS.indexOf(bet)
let _cachedBetNumW   = 0;      // measureText(fmt(bet)) の width
let _cachedBetLabelW = 0;      // measureText('BET') の width — 起動後不変
let _lastCoinsDispCached = -1; // coinsDisp の整数値キャッシュ判定用
let _lastBetCached   = -1;
let _lastBestCached  = -1;

/* コイン表示アニメーション用（アニメーション追従値・GC不要な数値のみ） */
let coinsDisp = 0; // 実値 coins に向けてeaseOut追従する表示用float

/* BET ラベル幅（'BET' 文字列・フォント固定）を一度だけ計測して保存 */
function _initBetLabelWidth() {
  ctx.save();
  ctx.font = IS_PORTRAIT
    ? `bold 24px 'Hiragino Mincho ProN',serif`
    : `bold 28px 'Hiragino Mincho ProN',serif`;
  _cachedBetLabelW = ctx.measureText('BET').width;
  ctx.restore();
}

/* ── 大型テキストのプリレンダ（毎フレームのグリフラスタライズを排除） ──
   コイン数値(60px)・BET数値(42/46px)は文字列が変わった時だけ OC に描画し、
   毎フレームは drawImage 1回にする。カウントアップアニメ中は毎フレーム
   再描画になるが、静止時（大半の時間）のラスタライズコストがゼロになる。 */
const _COINS_FONT   = `bold 60px 'Hiragino Mincho ProN',serif`;
const _COINS_TEXT_H = 72;
let _coinsTextOC = null, _coinsTextW = 0, _coinsTextColor = '', _coinsTextStr = '';
function _ensureCoinsTextOC(color) {
  if (typeof OffscreenCanvas === 'undefined') return null;
  if (_coinsTextOC && _coinsTextStr === _cachedCoinsStr && _coinsTextColor === color) return _coinsTextOC;
  ctx.save(); ctx.font = _COINS_FONT;
  const tw = Math.ceil(ctx.measureText(_cachedCoinsStr).width) + 8;
  ctx.restore();

/* syncRateリングバッファへスコアを1件追加し syncRate / 表示カウンタを更新する。
   onShoot() からも、ビート自動減衰からも呼ばれる。 */
function _pushSyncScore(score) {
  _syncHistBuf[_syncHistHead] = score;
  _syncHistHead = (_syncHistHead + 1) % SYNC_HIST_LEN;
  if (_syncHistCount < SYNC_HIST_LEN) _syncHistCount++;
  let _s = 0;
  for (let _i = 0; _i < _syncHistCount; _i++) _s += _syncHistBuf[_i];
  syncRate = _s / _syncHistCount;
  if (syncRate >= 0.5) {
    syncRateAboveCount++;
    syncRateBelowCount = 0;
  } else {
    syncRateBelowCount++;
    if (syncRateBelowCount >= SYNC_VISIBLE_THRESHOLD) syncRateAboveCount = 0;
  }
}

function _releaseWheelOCs(ws) {
  if (!ws) return;
  for (const w of ws) {
    if (w?._oc)    { _freeWheelOCs.push(w._oc);    w._oc    = null; }
    if (w?._resOC) { _freeResultOCs.push(w._resOC); w._resOC = null; }
  }
}

/* 結果文字（44px + グロー）を OC へ一度だけ描画する。
   色・グロー強度は syncScore 依存だが、ロック時に確定するため再描画不要。 */
const _RESULT_OC_HALF = 52; // 44px 文字 + 最大グロー30 を収める半径
function _buildResultOC(w) {
  if (typeof OffscreenCanvas === 'undefined') return;
  const sz = _RESULT_OC_HALF * 2 * _dpr;
  const oc = _freeResultOCs.pop() || new OffscreenCanvas(sz, sz);
  const c  = oc.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, sz, sz);
  c.scale(_dpr, _dpr);
  const [fillC, glowC] = _syncBarColor(w.syncScore);
  c.font = `bold 44px 'Hiragino Mincho ProN',serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = glowC; c.shadowBlur = 10 + w.syncScore * 20;
  c.fillStyle = fillC;
  c.fillText(w.result, _RESULT_OC_HALF, _RESULT_OC_HALF);
  w._resOC = oc;
}

function _scheduleWheelPreBuild() {
  if (_pendingWheelScheduled) return;
  _pendingWheelScheduled = true;
  const build = () => {
    /* フィーバー状態は init() で確定するため null（非フィーバー）で構築。
       feverPending/isFever が真の場合は init() 側で再構築（レアケース）。 */
    /* 二重スケジュール（コールバック発火前に init() が再スケジュール）で
       2回発火した場合、前回分のOCをプールへ返却してから上書きする */
    _releaseWheelOCs(_pendingWheels);
    _pendingWheels = WXS.map((x, i) => createWheel(x, WYS[i], null));
  };
  /* requestIdleCallback: iOS Safari未対応のためsetTimeoutでフォールバック */
  if (typeof requestIdleCallback !== 'undefined') {
    requestIdleCallback(build, { timeout: 200 });
  } else {
    setTimeout(build, 0);
  }
}

let _pendingTrueEndingReplay = false; // touchstart で真エンディング再生ボタンを検出し touchend で開始するためのフラグ
let bgmGain  = null; // BGM専用gainノード（SEとは独立して音量制御）
let bgmBuffer = null;       // レンダリング済みBGMループバッファ
let bossBgmBuffer = null;   // レンダリング済みボス戦BGM（暗黒版）ループバッファ（tier0、既存コード互換用）
/* ボス戦BGMの地鳴りマイルド化段階バッファ（ユーザー要望: 「こんがり度が上がる
   に従って、マイルドな音に変化していくようにしたい」）。地鳴りはループ先頭に
   1回だけ焼き込まれる仕様上、リアルタイムに音色を連続変化させることはできない
   ため、段階ごとに丸ごと事前レンダリングし、こんがり度がその段階へ達したら
   ループの継ぎ目（地鳴り以外は全段階で同一内容のため無音で切り替わる）で
   バッファを差し替える方式にした（_rumbleTierForCookPct・_updateBossRumbleTier・
   _scheduleBossRumbleTierSwap参照）。 */
const RUMBLE_TIER_COUNT = 4;
let bossBgmBuffers = null;  // [tier0(最も凶暴)..tierN-1(最もマイルド)]
let _bossRumbleTier = 0;        // 現在再生中バッファの段階
let _bossRumblePendingTier = null; // 次のループ境界間近になったら切り替える予約段階
let bgmSource = null;       // AudioBufferSourceNode（ループ再生中）
let _bgmIsBoss = false;     // 現在鳴っているのがboss用バッファかどうか（startBGMTape参照）
let bgmPendingStart = false;// バッファ未完時にstartBGMが呼ばれた場合のフラグ
let bgmRestartTimer = null; // SE後のBGM再開pending timer（stopBGMでキャンセル）
let masterGain = null;      // 全音声の親gainノード（ミュート制御）
let audioMuted = true; // デフォルトミュート
let bgmPhaseRef = null;     // BGM開始時のaudioCtx.currentTime（拍グリッド基準点）

function onBeatGrid() {
  if (!audioCtx || bgmPhaseRef === null) return true; // 音声未初期化時はフレーム基準に委ねる
  /* 1/4拍グリッドの境界点から前後25%（≈1.5f）の窓で true */
  const ph4 = ((audioCtx.currentTime - bgmPhaseRef) % BEAT_DIV4) / BEAT_DIV4;
  return ph4 < 0.25 || ph4 > 0.75;
}

/* 入力の時刻は event.timeStamp（performance.now() 基準 ms）のまま扱い、
   calcSyncScore 内で performance クロック同士で補間する。
   旧実装の inputEventToAudioTime（getOutputTimestamp 換算）は出力タイムラインと
   スケジュールタイムライン（currentTime）を混在させており、Bluetooth 遅延環境で
   サブフレーム補間が常に0へクランプされる判定バイアスを生んでいたため廃止（v3.78） */

/* ビジュアルビート表示用の「今聴いている音声時刻」を取得する。
   audioCtx.currentTime は outputLatency 分だけ未来の予約時刻であり、
   ビジュアルタイミング基準として使うと遅延する。
   getOutputTimestamp().contextTime は現在スピーカーから出ている音の時刻なので
   これを基準に描画パイプライン遅延（≈2フレーム）だけ先読みすれば視覚と音が一致する。 */
let _BEAT_DISPLAY_ADVANCE = 2 / 60; // 起動時フォールバック: AudioCtx初期化後に動的更新

/* 表示先読みの目標値（描画パイプライン補償）: リングは計算からrAF描画・合成を経て
   約2〜4フレーム後に発光するため、その分だけ位相を先読みして計算する */
const _BEAT_ADVANCE_TARGET = 4 / 60; // ≈66.7ms（4フレーム分）
let _hwLatency = 0; // 実効出力遅延のキャッシュ（毎フレーム読み取りを避ける）
let _latencyRefreshCnt = 0; // 定期再計測用フレームカウンタ（経路変更追従・演出系なのでフレーム基準で可）
/* 手動遅延補正（?lat=ms URLパラメータ、負値も可）:
   iOS Safari は outputLatency 未実装（WebKitにFIXMEあり）のため、AirPods 等
   Bluetooth の出力遅延（150〜250ms）を検出できない。ビートリングと音のズレを
   感じる場合に ?lat=180 のように指定して較正する（値はリングを遅らせる方向） */
const _LATENCY_TRIM = (parseFloat(new URLSearchParams(location.search).get('lat')) || 0) / 1000;
/* 判定の既定バイアス: 人間はビートに合わせてタップすると平均20〜40ms先行して
   叩く傾向（negative mean asynchrony）があるため、判定グリッドを既定で早める。
   値は iPad スピーカー実機の較正（2026-07）で +37ms が最適と確認されたもの */
const _JUDGE_BIAS = 0.037;
/* 入力判定専用の較正（?jlat=ms、既定バイアスへの加算。正の値で判定グリッドをさらに早める。
   表示には影響しない。再較正・実験用 */
const _JUDGE_TRIM = _JUDGE_BIAS +
  (parseFloat(new URLSearchParams(location.search).get('jlat')) || 0) / 1000;
function _updateBeatDisplayAdvance() {
  if (!audioCtx) return;
  let hw = (audioCtx.outputLatency ?? 0) + (audioCtx.baseLatency ?? 0);
  /* outputLatency 未実装環境（Safari）向け: getOutputTimestamp から実効出力遅延を推定。
     currentTime（スケジュール済み時刻）− contextTime（今スピーカーから出ている音の時刻）
     が Bluetooth を含む出力チェーン遅延。取得できて hw より大きければ採用する */
  if (typeof audioCtx.getOutputTimestamp === 'function' && audioCtx.state === 'running') {
    const ts = audioCtx.getOutputTimestamp();
    if (ts && ts.contextTime > 0) {
      const eff = audioCtx.currentTime - ts.contextTime;
      if (eff > hw && eff < 1.0) hw = eff; // 異常値（停止直後等）は除外
    }
  }
  _hwLatency = hw + _LATENCY_TRIM;
  /* 表示先読みは「描画パイプライン遅延（rAF→合成→画面 ≈2〜4フレーム）」の補償であり、
     音声出力遅延とは独立した定数。旧実装の max(0, TARGET - hw) は Bluetooth
     （hw≈200ms）で先読みが0に潰れ、リングが描画パイプラインぶん音より遅れて見えた（v3.79修正） */
  _BEAT_DISPLAY_ADVANCE = _BEAT_ADVANCE_TARGET;
}

/* BGM ループ長をサンプル単位に量子化した実ループ長（秒）。
   AudioBuffer の loopEnd は内部で floor(loopEnd * sampleRate)/sampleRate に丸められるため、
   この値を使ってビート位相を計算しないとループを重ねるたびにズレが蓄積する。
   getAudioCtx() 内で sampleRate が確定してから更新される。 */
let _bgmQuantizedLoopDur = 0; // _updateBgmQuantizedLoopDur() で sampleRate確定後に設定

function _updateBgmQuantizedLoopDur() {
  if (!audioCtx) return;
  const sr = audioCtx.sampleRate;
  _bgmQuantizedLoopDur = Math.floor(BGM_LOOP_DUR * sr) / sr;
}

/* ── BGM 音声バッファ位置の積算追跡 ──────────────────────────────────────────
   playbackRate が変化する場合（スロースピン・テープ演出）、
   audioCtx.currentTime - bgmPhaseRef は壁時計で進むが実際の音声位置は rate 倍速で
   しか進まない。そのため rampBGMRate(0.5) が10秒続くと最大5秒のズレが蓄積する。
   対策: 毎フレーム playbackRate × Δt を積算し、実際の音声バッファ位置を追跡する。 */
let _bgmAccumAudioTime = 0;    // BGMバッファ内積算再生位置（秒）
let _bgmAccumLastWall  = null; // 最後に積算した audioCtx.currentTime
let _bgmAccumLastPerf  = 0;    // 最後に積算した performance.now()/1000（入力評価のサブフレーム補間用）

/* ── JS側レート追跡 ───────────────────────────────────────────────────────────
   AudioParam.value は setValueCurveAtTime 実行中に古い値を返すブラウザ実装差異があり
   (line 240-243 コメント参照)、bgmSource.playbackRate.value が信頼できない。
   レートのランプパラメータを JS 側で持ち、_getBgmRateJS() で解析的に求める。 */
let _bgmRateFrom  = 1.0;   // ランプ開始レート
let _bgmRateTo    = 1.0;   // ランプ目標レート
let _bgmRateStart = 0;     // ランプ開始 audioCtx.currentTime
let _bgmRateDur   = 0;     // ランプ時間（秒）。0=即時変化
let _bgmRateEase  = 'linear'; // 'easeIn' | 'easeOut' | 'linear'

/* ランプパラメータを記録する。setValueCurveAtTime と同時に呼ぶ */
function _setBgmRateJS(from, to, startT, durSec, easeType = 'linear') {
  _bgmRateFrom  = from;
  _bgmRateTo    = to;
  _bgmRateStart = startT;
  _bgmRateDur   = durSec;
  _bgmRateEase  = easeType;
}

/* ease補間ヘルパー: p∈[0,1] → easeOut/easeIn/linear の補間係数を返す
   _tapeRateCurve と _getBgmRateJS で同一式が重複していたため共通化 */
function _easeF(p, type) {
  if (type === 'easeOut') return Math.sin(p * Math.PI / 2);
  if (type === 'easeIn')  return 1 - Math.cos(p * Math.PI / 2);
  return p; // linear
}

/* 現在の audioCtx.currentTime におけるレートを解析的に返す */
function _getBgmRateJS() {
  if (_bgmRateDur <= 0) return _bgmRateTo; // 即時変化
  const p = Math.max(0, Math.min(1,
    (audioCtx.currentTime - _bgmRateStart) / _bgmRateDur));
  if (p >= 1) return _bgmRateTo;
  return _bgmRateFrom + (_bgmRateTo - _bgmRateFrom) * _easeF(p, _bgmRateEase);
}

function _bgmAccumReset() {
  _bgmAccumAudioTime = 0;
  _bgmAccumLastWall  = audioCtx ? audioCtx.currentTime : null;
  _bgmAccumLastPerf  = performance.now() / 1000;
}

function _bgmAccumStep() {
  if (!audioCtx || !bgmSource || _bgmAccumLastWall === null) return;
  const now = audioCtx.currentTime;
  const dt  = now - _bgmAccumLastWall;
  _bgmAccumLastWall = now;
  _bgmAccumLastPerf = performance.now() / 1000;
  if (dt <= 0) return;
  /* dt > 10s: タブ長時間非表示など AudioContext が止まっていたケース → スキップ
     jackpot/reach_jackpot SE（2〜2.5s）はここに含めず正常に積算する */
  if (dt > 10) return;
  /* bgmSource.playbackRate.value はランプ中に正しい値を返さないため JS 側で計算 */
  _bgmAccumAudioTime += dt * _getBgmRateJS();
}

/* getBeatPulse: 同一フレーム内で複数回呼ばれるためフレームキャッシュを使用 */
let _beatPulseCache = 0, _beatPulseCacheFrame = -1;
function getBeatPulse() {
  /* 同じフレーム内の2回目以降はキャッシュを返す
     _bgmAccumStep は update()先頭 または draw-only フレームの先頭で呼ばれ、
     _bgmAccumLastWall が更新されるとキャッシュが無効化される */
  if (_beatPulseCacheFrame === _bgmAccumLastWall) return _beatPulseCache;
  _beatPulseCacheFrame = _bgmAccumLastWall;
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || _bgmQuantizedLoopDur <= 0) {
    return (_beatPulseCache = 0);
  }
  /* playbackRate変動を考慮した音声バッファ内位置を計算。
     _bgmAccumAudioTime は audioCtx.currentTime 基準なので outputLatency 分を引いて
     実際にスピーカーから出ている音に揃え、さらに描画パイプライン分だけ先読みする。
     rate を掛けるのは latency が壁時計秒だが offset は音声秒で評価するため。 */
  const rate      = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo; // ランプ中も正確に取得
  const rawPos    = _bgmAccumAudioTime + (_BEAT_DISPLAY_ADVANCE - _hwLatency) * rate;
  /* ループ量子化ドリフト対策: loopEnd はサンプル丸めされた実ループ長で割り切る */
  const loopN     = Math.floor(rawPos / _bgmQuantizedLoopDur);
  const posInLoop = rawPos - loopN * _bgmQuantizedLoopDur;
  const ph = (((posInLoop % BGM_BEAT) + BGM_BEAT) % BGM_BEAT) / BGM_BEAT;
  return (_beatPulseCache = Math.pow(Math.max(0, 1 - ph * 2.5), 2)); // ~160ms で減衰（0.4拍）
}

/* 現在の入力タイミングがビートにどれだけ近いかを 0-1 で返す
   atPerfMs: 入力イベントの timeStamp（performance.now() 基準 ms、省略時は現在時刻）
   1=ジャスト, 0=最も外れている（1/4拍グリッドから半周期ずれ） */
function calcSyncScore(atPerfMs) {
  if (!audioCtx || bgmPhaseRef === null || _bgmAccumLastWall === null || _bgmQuantizedLoopDur <= 0) return 0.5;
  /* 判定は「聴こえている音」を基準にする（-_hwLatency のみ適用）。
     表示先読み _BEAT_DISPLAY_ADVANCE は描画パイプライン補償なので判定には含めない
     — リング自体が表示遅延を経て光るため、見た目のピークと判定グリッドは体感上一致する。
     最後の積算tickから入力までの経過は performance クロック同士で補間する
     （出力タイムラインとスケジュールタイムラインを混在させると Bluetooth 遅延環境で
      extra が常に0へクランプされ、tick量子化バイアス＋ジッターが判定に乗る）。
     _JUDGE_TRIM（?jlat）は判定グリッドのみを較正する（表示には影響しない） */
  const rate    = _bgmRateDur > 0 ? _getBgmRateJS() : _bgmRateTo;
  const nowPerf = (atPerfMs ?? performance.now()) / 1000;
  const extra   = Math.max(0, Math.min(nowPerf - _bgmAccumLastPerf, 0.1)); // 最後のstepから入力までの差分
  const audioPos = _bgmAccumAudioTime + extra * rate;
  const rawPos   = audioPos + (_JUDGE_TRIM - _hwLatency) * rate; // 聴取基準 + 判定較正
  const loopN    = Math.floor(rawPos / _bgmQuantizedLoopDur);
  const posInLoop = rawPos - loopN * _bgmQuantizedLoopDur;
  /* 評価グリッドを8分音符（BGM_BEAT/2）に変更。
     メロディは4分・8分音符両方に音符があるため、4分音符グリッドでは
     8分音符タイミングが常に最悪スコアになっていた。
     ビートリング表示（getBeatPulse）は4分音符周期のまま維持。 */
  const halfBeat = BGM_BEAT / 2;
  const ph       = ((posInLoop % halfBeat) + halfBeat) % halfBeat; // 0〜halfBeat
  const distSec  = ph < halfBeat / 2 ? ph : halfBeat - ph;        // 最近傍8分音符までの距離
  const distMs   = distSec * 1000;
  return Math.max(0, 1 - distMs / 100); // 0ms→1.0, 100ms→0.0, 100ms超→0
}

/* 次の1/4拍グリッド境界点のaudioCtx時刻を返す（SE先読みスケジュール用） */
function nextBeatDivTime(divsPerBeat = 4) {
  if (!audioCtx || bgmPhaseRef === null) return audioCtx ? audioCtx.currentTime + 0.01 : 0;
  const divDur  = BGM_BEAT / divsPerBeat;
  const elapsed = audioCtx.currentTime - bgmPhaseRef;
  const nextDiv = Math.ceil(elapsed / divDur + 0.02); // 0.02=ほぼ同時でも次グリッドへ
  return bgmPhaseRef + nextDiv * divDur;
}

/* masterGainの出力先に挟む常時有効のセーフティリミッター。
   実機報告: cheatpanelのACH一括解除（最大18件）で実績解除音('ach')が
   同時に18重に重なり、音が割れて（クリッピングして）聞こえた。
   通常のBGMレンダリング（renderBGMBuffer側のuseLimiter）と同じ問題を
   ライブ再生側でも起こしうる（同一SEの多重発火に限らず、複数のSEが
   偶然重なるケース全般が対象）ため、常時経由するリミッターを1つ挟む。
   普段の1〜2音同時程度ではほぼ無音に近い変化（透過的）で、多重発火時だけ
   ピークを叩き潰す設定にする（BGM事前レンダリング用の-10dB/ratio20は
   常時通すには効きすぎるため、ライブ用にやや緩めた値を使う） */
function _createMasterLimiter(ctx) {
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -6;
  limiter.knee.value = 6;
  limiter.ratio.value = 16;
  limiter.attack.value = 0.003;
  limiter.release.value = 0.15;
  limiter.connect(ctx.destination);
  return limiter;
}

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx   = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    masterGain = audioCtx.createGain();
    /* 実機報告で発覚: タイトル画面の真エンディング再生ボタンはinitGame()を
       経由せず直接getAudioCtx()を呼ぶため、従来ここを無条件で1（ミュート
       未反映）にして「後でapplyMuteGain()が呼ばれる」ことに依存していた
       設計では、そのボタン経由の初回再生時にミュート設定が一切反映されず
       常に音が鳴ってしまっていた。lsLoad()はページ読み込み時点で必ず
       audioMutedより先に完了している（ユーザー操作でしかgetAudioCtx()は
       呼ばれない）ため、ここで直接audioMutedを反映すれば安全かつ確実 */
    masterGain.gain.value = audioMuted ? 0 : 1;
    masterGain.connect(_createMasterLimiter(audioCtx));
    bgmGain  = audioCtx.createGain();
    bgmGain.gain.value = 1;
    bgmGain.connect(masterGain); // BGM: bgmGain → masterGain → destination
    /* BGMループを非同期でオフラインレンダリング（完了後 bgmBuffer にセット）
       startBGM() がバッファ未完状態で呼ばれていた場合は完了後に起動する */
    renderBGMBuffer(audioCtx.sampleRate).then(buf => {
      bgmBuffer = buf;
      /* startBGM() がバッファ未完状態で呼ばれていた場合、ここで改めて起動 */
      if (bgmPendingStart && !bgmSource) {
        bgmPendingStart = false;
        startBGM();
      }
    }).catch(e => { console.warn('BGM render failed:', e); });
    /* ボス戦用（暗黒版）バッファも並行してレンダリング。通常BGMと独立に
       完了するため、起動タイミングは_initBossBattle側でbossBgmBufferの
       有無を確認する（未完なら通常BGMで代用。startBossBGMTape参照）。
       地鳴りのマイルド化段階ぶん（RUMBLE_TIER_COUNT個）を並行して事前レンダリング
       し、こんがり度の上昇に合わせてループの継ぎ目で差し替える
       （_updateBossRumbleTier参照）。tier0は従来のbossBgmBufferと同一内容 */
    bossBgmBuffers = new Array(RUMBLE_TIER_COUNT).fill(null);
    for (let tier = 0; tier < RUMBLE_TIER_COUNT; tier++) {
      const mellow = tier / (RUMBLE_TIER_COUNT - 1);
      renderBGMBuffer(audioCtx.sampleRate, {
        bassArr: BGM_BASS_BOSS,
        bassDurMul: 0.85, bassDecay: 0.05,
        useTaiko: true, useRumble: true, melAcid: true, kickVol: 1.28, // ユーザー要望で倍量（0.64→1.28）
        useLimiter: true, // ステップ0の同時発音でピーク1.6超のためコンプレッサー必須
        rumbleMellow: mellow,
      }).then(buf => {
        bossBgmBuffers[tier] = buf;
        if (tier === 0) bossBgmBuffer = buf; // 既存コード（startBossBGMTape等）との互換
      }).catch(e => { console.warn(`Boss BGM render failed (tier${tier}):`, e); });
    }
    /* AudioContext生成直後にデバイス遅延を実測してビート表示先読みを更新
       resume()後に値が確定するので少し待って再計測 */
    _updateBeatDisplayAdvance();
    setTimeout(_updateBeatDisplayAdvance, 500);
    /* ホワイトノイズバッファを事前生成（最長ノイズ使用: reach_jackpot dur=0.3+0.05=0.35s → 0.45s確保）
       playNoise() はこのバッファを参照するだけでフレームごとのランダム生成ループが不要になる */
    _buildNoiseBuffer();
    /* ループ量子化ドリフト補正用: sampleRate確定後に実ループ長を計算 */
    _updateBgmQuantizedLoopDur();
  }
  return audioCtx;
}

/* AudioContext の masterGain/bgmGain グラフを再構築する。
   iOS Safari: interrupted 状態は resume() では復帰不可のため AudioContext ごと作り直す。
   ユーザーアクティベーション内で new AudioContext() すると iOS が即 running にする。
   AudioBuffer（bgmBuffer, _noiseBuffer）は Context 非依存なので再利用可能。 */
function _recreateAudioGraph() {
  /* 旧Contextに属する bgmSource 参照を破棄。残すと startBGM() が「再生中」と誤認して
     早期リターンし、interrupted 復帰後に BGM が二度と戻らなくなる */
  _destroyBGMSource();
  /* ジングル進行中なら次発音時刻をリセット（旧Context時刻のままだと
     新Contextの currentTime が追いつくまでジングルが停止する） */
  if (jingleScheduler) jingleNextTime = 0;
  try { audioCtx.close(); } catch(_e) {}
  audioCtx  = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  audioCtx.resume().catch(() => {}); // ジェスチャー外から呼ばれた場合の保険
  masterGain = audioCtx.createGain();
  masterGain.gain.value = audioMuted ? 0 : 1;
  masterGain.connect(_createMasterLimiter(audioCtx));
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 1;
  bgmGain.connect(masterGain);
  _speakerRouteEstablished = false; // 新しいContextではルート再確立が必要
}

/* iOS Safari: AudioContext を確実に running 状態にしてから callback を呼ぶ。
   - interrupted: _recreateAudioGraph() で再作成（ジェスチャー内なら即 running）
   - suspended: resume() で復帰。Promise 解決後に setTimeout(callback, 0)
   ※ ユーザーアクティベーション（touchstart/touchend/click）内から呼ぶこと。 */
function _resumeAudioCtx(callback) {
  if (audioCtx.state === 'interrupted') {
    _recreateAudioGraph();
    setTimeout(callback, 0);
  } else {
    audioCtx.resume().then(() => setTimeout(callback, 0)).catch(callback);
  }
}

/* iOS マナーモード対策: <audio>要素をユーザーアクティベーション内で再生すると
   AVAudioSession カテゴリが Ambient → Playback に昇格し、マナーモードをバイパスする。
   無音の最小WAV(44バイト)をdata URIで埋め込み、ファイル不要でインライン実現。
   成功後は再呼び出しをスキップ（フラグで管理）。 */
const _iosAudioEl = document.createElement('audio');
_iosAudioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
_iosAudioEl.setAttribute('playsinline', '');
_iosAudioEl.volume = 0;
let _iosSessionElevated = false;
function _elevateAudioSession() {
  if (_iosSessionElevated) return;
  _iosAudioEl.play().then(() => { _iosSessionElevated = true; }).catch(() => {});
}

/* iOS Safari: あらゆるタッチで呼ぶ「機会があれば unlock する」関数。
   resume() + masterGain 経由サイレントバッファで AVAudioSession を開通させる。
   サイレントバッファは destination 直結では AVAudioSession が開かないため masterGain 経由必須。
   特定の音声操作前に確実に running にしたい場合は _resumeAudioCtx(callback) を使う。 */
let _speakerRouteEstablished = false; // masterGain経由バッファ再生でスピーカールートを開通済みか
function _unlockAudio() {
  _elevateAudioSession(); // iOS: AVAudioSessionをPlaybackカテゴリに昇格（マナーモード対策）
  if (!audioCtx) getAudioCtx();
  /* スピーカールート未確立、または suspended の場合にバッファを再生する。
     ジェスチャー内で生成した AudioContext は即 running になるが、
     最初のタッチでルートを開通させないと内蔵スピーカーへの音声出力が確立されない。
     _recreateAudioGraph() 後は false にリセットされ再開通が必要になる。 */
  if (_speakerRouteEstablished && audioCtx.state === 'running') return;
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  try {
    const b = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    const s = audioCtx.createBufferSource();
    s.buffer = b; s.connect(masterGain); s.start(audioCtx.currentTime);
    _speakerRouteEstablished = true;
  } catch(_e) {}
}

/* 音程ヘルパー: note='C'~'B'（シャープ付き'C#'等も可）, octave=3~5
   シャープはボス戦BGMの不協和ベースオスティナート（A/A#半音連打）用に追加 */
function noteHz(note, octave) {
  const semi = {'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11}[note];
  return 261.63 * Math.pow(2, (semi + (octave - 4) * 12) / 12);
}

/* ホワイトノイズバッファを事前生成する
   AudioContext.sampleRate が変わった場合（デバイス切替）に再生成するため毎回チェック */
function _buildNoiseBuffer() {
  if (!audioCtx) return;
  if (_noiseBuffer && _noiseBuffer.sampleRate === audioCtx.sampleRate) return;
  const len  = Math.ceil(audioCtx.sampleRate * 0.45); // 最長ノイズ(0.35s)より余裕を持った長さ
  const buf  = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  _noiseBuffer = buf;
}

/* 基本オシレーター再生 */
/* dest未指定時の出力先解決: ライブコンテキストならmasterGain経由（ミュート制御）、
   OfflineAudioContextならdestination直結（レンダリング用）。
   playOsc/playNoise/_playAcidShootHit等でコピーされていた式を一元化 */
function _seDest(ctx, dest) {
  return dest ?? (ctx === audioCtx ? masterGain : ctx.destination) ?? ctx.destination;
}

/* ワンショット系ノードは.stop()後も明示的にdisconnect()しないとオーディオ
   グラフに残り続ける。実機報告（Safari縦画面）: 「キングギヨウザ戦の後半
   くらいからBGMがブツ切れになり、エンディングでも直らない」を調査した
   結果、playOsc/playNoise/_playSlideOsc/_acidChain等のワンショットSE
   ヘルパーが軒並みnew Node()→start()→stop()のみでdisconnect()を一切
   呼んでおらず、矢を射るたび・キング戦の命中音・ジングルの音符ごとに
   ノードが積み上がっていたことが原因と判明した（OfflineAudioContext側の
   BGM事前レンダリングは1回限りで対象外）。stop()予定時刻のsetTimeoutで
   まとめて切断する共通ヘルパーで一元的に解消する（onendedはOfflineAudio
   Context・一部WebKitで発火が不安定なため使わず、確実なタイマー方式にする） */
function _disconnectAfter(ctx, atTime, ...nodes) {
  const delayMs = Math.max(0, (atTime - ctx.currentTime) * 1000) + 50;
  setTimeout(() => { for (const n of nodes) { try { n.disconnect(); } catch(e) {} } }, delayMs);
}

function playOsc(ctx, type, freq, startT, dur, vol, decay, slurTarget, vibrato, dest) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(_seDest(ctx, dest));
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startT);
  /* ビブラート: LFO で周波数変調（薄くかけるため delay 後にフェードイン） */
  let lfo = null, lfoGain = null;
  if (vibrato) {
    lfo     = ctx.createOscillator();
    lfoGain = ctx.createGain();
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(vibrato.rate  ?? 5.5, startT);
    lfoGain.gain.setValueAtTime(0, startT);
    lfoGain.gain.linearRampToValueAtTime(vibrato.depth ?? 5, startT + (vibrato.delay ?? 0.5));
    lfo.start(startT);
    lfo.stop(startT + dur + (decay ?? 0.08) + 0.1);
  }
  gain.gain.setValueAtTime(vol, startT);
  let stopAt;
  if (slurTarget != null) {
    gain.gain.exponentialRampToValueAtTime(Math.max(slurTarget, 0.001), startT + dur);
    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.02));
    stopAt = startT + dur + (decay ?? 0.02) + 0.02;
    osc.start(startT);
    osc.stop(stopAt);
  } else {
    gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur + (decay ?? 0.08));
    stopAt = startT + dur + (decay ?? 0.08) + 0.02;
    osc.start(startT);
    osc.stop(stopAt);
  }
  if (ctx === audioCtx) {
    _disconnectAfter(ctx, stopAt, osc, gain);
    if (lfo) _disconnectAfter(ctx, startT + dur + (decay ?? 0.08) + 0.1, lfo, lfoGain);
  }
}

/* ノイズバースト（ハイハット・打撃音用）
   _noiseBuffer を使い回すことでフレームごとのランダム生成ループを排除する。
   OfflineAudioContext（BGMレンダリング）への使用時は ctx が異なるため個別生成にフォールバック */
function playNoise(ctx, startT, dur, vol, hpFreq, dest) {
  let buf;
  if (ctx === audioCtx && _noiseBuffer && _noiseBuffer.sampleRate === ctx.sampleRate) {
    buf = _noiseBuffer; // 事前生成バッファを再利用（ランダムループなし）
  } else {
    /* フォールバック: OfflineAudioContext または未初期化時 */
    const len  = Math.ceil(ctx.sampleRate * (dur + 0.05));
    buf        = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  const src    = ctx.createBufferSource();
  src.buffer   = buf;
  const hp     = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = hpFreq ?? 4000;
  const gain   = ctx.createGain();
  gain.gain.setValueAtTime(vol, startT);
  gain.gain.exponentialRampToValueAtTime(0.0001, startT + dur);
  src.connect(hp); hp.connect(gain);
  gain.connect(_seDest(ctx, dest));
  const stopAt = startT + dur + 0.05;
  src.start(startT); src.stop(stopAt);
  if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, src, hp, gain);
}

/* ── BGM: 中華風ペンタトニック・パチンコループ ── */
/* ペンタトニック: C D E G A */
const BGM_BPM   = 152;
const BGM_BEAT  = 60 / BGM_BPM;
/* 16ステップ（各0.5拍 = 16分音符） */
/* [note, octave, vol] または null=休符 */
const BGM_MEL = [
  ['G',4,0.38], ['E',4,0.28], ['G',4,0.38], ['A',4,0.42],
  ['G',4,0.35], ['E',4,0.28], ['D',4,0.28], ['C',4,0.32],
  ['E',4,0.32], ['G',4,0.38], ['A',4,0.42], ['G',4,0.35],
  ['E',4,0.30], ['D',4,0.28], ['C',5,0.42], null,
];
const BGM_BASS = [
  ['C',3,0.28], null, ['G',3,0.22], null,
  ['A',3,0.22], null, ['G',3,0.22], null,
  ['C',3,0.28], null, ['E',3,0.22], null,
  ['G',3,0.22], null, ['C',3,0.30], null,
];
/* ボス戦BGM用ベースライン（v2・ゼロベース再設計）。
   初版（Cメジャーペンタ/Aマイナーペンタ共通音を使った「同じ曲の暗黒版」・
   再生レート0.9倍で重さを出す方針）はユーザー実機評価で「緊張感・緊迫感・
   焦燥感が足りない」と判定された。減速は「重厚」には効くが「切迫」には
   逆効果（追い立てられる感覚には加速の方が合う）と判断し、以下へ転換:
   - ペンタトニックの外側の音(A#)を使い、A2/A#2の半音を全ステップ交互連打
     する不協和オスティナートに変更（ジョーズ的な「迫り来る」緊張の定番技法）
   - 再生レートは0.9倍→1.2倍（減速ではなく加速）
   メロディ・ハイハット・キックの音符自体は流用するが、メロディの音色は
   ノコギリ波に差し替え、ループ頭に低音の地鳴りも追加する（当初はサイレン風
   の上昇スイープだったが、実機評価で「耳障り」との指摘があり地鳴りに変更）
   （renderBGMBuffer の melType/useRumble 引数、_playGroundRumble 参照） */
const BGM_BASS_BOSS = [
  ['A',2,0.30], ['A#',2,0.26], ['A',2,0.30], ['A#',2,0.26],
  ['A',2,0.30], ['A#',2,0.26], ['A',2,0.30], ['A#',2,0.26],
  ['A',2,0.32], ['A#',2,0.28], ['A',2,0.32], ['A#',2,0.28],
  ['A',2,0.34], ['A#',2,0.30], ['A',2,0.34], ['A#',2,0.30],
];
const BOSS_BGM_RATE = 1.2;
/* ボス戦BGM専用: 和太鼓の強打をループの頭・折り返し（ステップ0・8）に絞り、
   不協和ベースオスティナートの頭拍と重ねて一撃の重みを出す（合いの手の
   フレーズ感より、ベース連打と噛み合う「一発の衝撃」を優先した） */
const BGM_TAIKO_STRONG   = new Set([0, 8]);
const BGM_TAIKO_FLOURISH = new Set();
/* ハイハット: 偶数ステップ=強, 奇数=弱 */
const BGM_HAT = [0.16,0.06,0.16,0.06, 0.16,0.06,0.16,0.06,
                 0.16,0.06,0.16,0.06, 0.16,0.06,0.16,0.06];
/* バスドラム: 全拍打ち（4つ打ち）ステップ0,2,4,6,8,10,12,14 */
const BGM_KICK = new Set([0,2,4,6,8,10,12,14]);
/* 1ループの長さ（秒）*/
const BGM_LOOP_DUR = BGM_BEAT * 0.5 * BGM_MEL.length; // ≈3.158s
const BEAT_DIV4    = BGM_BEAT / 4;  // 16分音符 ≈ 0.099s
const BEAT_DIV3    = BGM_BEAT / 3;  // 8分3連   ≈ 0.132s

/* ピッチスライド系ワンショットの共通実装: type波形のオシレーターを
   f0→f1へ指数スライドさせつつ、ゲイン包絡線envで鳴らして止める。
   env: [経過秒, 値, 種別] の列。種別 'set'=setValueAtTime /
   'lin'=linearRamp / 省略=exponentialRamp。
   キック・和太鼓・SE（ズコー/スローハンド）が同一構造のosc+gain手組みを
   それぞれコピーして持っていたのを統合した（ボス戦の音色追加で同構造が
   5箇所に増えたため。パラメータはすべて既存値をそのまま移設） */
function _playSlideOsc(ctx, dest, t, type, f0, f1, slideDur, env, stopAt) {
  const osc  = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(dest);
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.exponentialRampToValueAtTime(f1, t + slideDur);
  for (const [dt, v, mode] of env) {
    if (mode === 'set')      gain.gain.setValueAtTime(v, t + dt);
    else if (mode === 'lin') gain.gain.linearRampToValueAtTime(v, t + dt);
    else                     gain.gain.exponentialRampToValueAtTime(v, t + dt);
  }
  osc.start(t); osc.stop(t + stopAt);
  if (ctx === audioCtx) _disconnectAfter(ctx, t + stopAt, osc, gain);
}

/* バスドラム（ピッチダウン式キック）。ボス版のバランス調整のため音量を
   引数化し、_playTaikoHitと同じ形で切り出した（renderBGMBufferのkickVol
   参照。実機評価でRMSエネルギーを実測した結果、地鳴りに対してキックが
   相対的に小さすぎたため、ボス側だけ音量を引き上げられるようにした） */
function _playKick(ctx, t, dest, vol) {
  _playSlideOsc(ctx, dest, t, 'sine', 110, 40, 0.12, [[0, vol, 'set'], [0.18, 0.0001]], 0.21);
}

/* 和太鼓風の合いの手（低音オシレーターのピッチダウンで模した打撃音。
   キック用のシンセ手法を流用しつつ、キックより低い開始ピッチ・長めの
   余韻にして「ドン」という締太鼓の響きに寄せている。strong=強打、
   flourish=ループ終端の素早い2連用に短め・やや高めに調整。
   音量はユーザー要望で倍量済み（強打0.5→1.0・弱打0.32→0.64） */
function _playTaikoHit(ctx, t, dest, strong) {
  if (strong) _playSlideOsc(ctx, dest, t, 'sine', 130, 50, 0.14, [[0, 1.0,  'set'], [0.30, 0.0001]], 0.34);
  else        _playSlideOsc(ctx, dest, t, 'sine', 170, 70, 0.07, [[0, 0.64, 'set'], [0.16, 0.0001]], 0.20);
}

/* ソフトクリップ歪みカーブ（TB-303風アシッドベースの「凶悪」な唸りに使う） */
function _acidDistortionCurve(amount) {
  const n = 256, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = Math.tanh(x * amount) / Math.tanh(amount); // tanhソフトクリップ、ピークで正規化
  }
  return curve;
}

/* TB-303系音色の共通オーディオグラフ: sawtooth osc → lowpass filter
   (→ ソフトクリップ歪み) → gain → dest を構築してノード束を返す。
   周波数・Q・包絡線の設定は呼び出し側が行う。地鳴り（_playGroundRumble）・
   アシッドメロディ（_playAcidMelNote）・リール射撃音（_playAcidShootHit）の
   3音色が同一のチェーン構築をコピーして持っていたのを統合した。
   distAmount=null で歪みなし（メロディ用: 音程の聞き取りやすさ優先） */
function _acidChain(ctx, dest, distAmount) {
  const osc    = ctx.createOscillator();
  const filter = ctx.createBiquadFilter();
  const gain   = ctx.createGain();
  let shaper   = null;
  osc.type    = 'sawtooth'; // 3音色とも倍音豊富な波形をフィルターで削って形作る
  filter.type = 'lowpass';
  if (distAmount != null) {
    shaper = ctx.createWaveShaper();
    shaper.curve = _acidDistortionCurve(distAmount);
    shaper.oversample = '4x';
    osc.connect(filter); filter.connect(shaper); shaper.connect(gain);
  } else {
    osc.connect(filter); filter.connect(gain);
  }
  gain.connect(dest);
  return { osc, filter, gain, shaper };
}

/* 地鳴り風の超低音（ボス戦BGM専用・ループ頭に1回）。
   変遷: サイレン風の上昇スイープ（耳障りとの指摘）→ サイン波2本のデチューン
   ビートによる地鳴り（低すぎる・尻下がりにしたい・音圧を上げたいとの指摘）
   → ここでは「ぶぶーぅ」という2本ビートの唸りのカクつきが指摘され、
   TB-303アシッドベースのような滑らかで凶悪な唸りが要望された。
   デチューンした2本を単音のオシレーターに一本化して唸り（カクつき）の原因を
   除去し、代わりにレゾナンス高めのローパスフィルターを掛けてフィルターの
   「ウォゥ」という掃引でアシッドらしい生々しさを出す。ピッチもフィルターも
   なめらかにexponentialRampで下降させ「ぶぅーーぅ」の滑らかなスライドにする。
   仕上げにソフトクリップ歪みを軽くかけて凶悪さを足す */
/* mellow: 0(通常・最も凶暴)〜1(最もマイルド)。ユーザー要望「こんがり度が
   上がるに従って、マイルドな音に変化していくようにしたい」に対応するため
   引数化した（_rumbleTierForCookPct・_updateBossRumbleTier参照）。
   歪み量・スライド幅・フィルターのレゾナンス/掃引幅を同時に弱めることで、
   単に音量を下げるのではなく質感そのものを柔らかくする。mellow=0では
   従来と完全に同一の値になる */
function _playGroundRumble(ctx, t, dest, mellow = 0) {
  const distAmount = 4 - mellow * 3.2; // 4→0.8: ソフトクリップの歪み量を弱める
  const { osc, filter, gain, shaper } = _acidChain(ctx, dest, distAmount);
  const topFreq = 130 - mellow * 35; // 130→95: 滑り出しの高さを抑える
  const botFreq = 36  + mellow * 34; // 36→70: 下限を持ち上げて「ズドン」感を弱める
  osc.frequency.setValueAtTime(topFreq, t);
  osc.frequency.exponentialRampToValueAtTime(botFreq, t + 1.0); // なめらかな尻下がりスライド（単音なのでカクつかない）
  filter.Q.setValueAtTime(20 - mellow * 14, t); // 20→6: 高レゾナンスの「ウォゥ」感を弱める
  filter.frequency.setValueAtTime(3600 - mellow * 1800, t); // 3600→1800
  filter.frequency.exponentialRampToValueAtTime(240 + mellow * 260, t + 0.4); // 240→500: カットオフの掃引幅を狭める

  /* 音量調整の経緯: ピーク包絡線の値だけを他パートに合わせても
     （0.62→0.46）実際には地鳴りだけ突出して聞こえるとの指摘が続いた。
     地鳴りは1秒以上持続する上にレゾナンスフィルター・歪みを通すため、
     ピーク値が同じでも総エネルギー（RMS）は他の一発打楽器よりずっと
     大きくなる。実際に各パートを単独レンダリングしRMSを実測したところ、
     地鳴り0.212 に対し和太鼓強打0.074・キック0.060 と3倍近い差があった。
     地鳴りの目標RMSを和太鼓強打よりやや大きい0.10程度に設定し、
     現状比0.212→0.10（倍率≈0.47）をゲイン包絡線に一律適用した */
  /* ユーザー要望でさらに半分に（0.22→0.11・0.14→0.07 → さらに0.11→0.055・0.07→0.035）。
     和太鼓・キックは倍量にしたため、地鳴りとの相対バランスは前回調整よりさらに開く
     （意図的な指示のため、RMS実測はしつつも目標値には合わせにいかない）。
     mellowによる音量のわずかな引き下げは質感の変化を補強する副次的なもの
     （主役はdistAmount/Q/掃引幅、音量だけでマイルド化を表現するわけではない） */
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.055 - mellow * 0.012, t + 0.05);
  gain.gain.linearRampToValueAtTime(0.035 - mellow * 0.008, t + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  osc.start(t); osc.stop(t + 1.15);
  if (ctx === audioCtx) _disconnectAfter(ctx, t + 1.15, osc, filter, gain, shaper);
}

/* メロディ用TB-303風アシッド音色（ボス戦BGM専用）。ユーザー要望:
   「メインのメロディの音色もTB-303ぽくしてください」。playOsc（三角波/
   ノコギリ波を単純に鳴らすだけの汎用関数、通常BGM・SE・ジングルで共用の
   ため変更不可）とは別に、303らしさの核である「音符ごとの高レゾナンス
   フィルター掃引（プラック/クワック感）」を持つ専用関数を用意する。
   音符が短い（16分音符=約0.16秒）ため、フィルターの掃引時間もそれに
   合わせて短く・高速にする。地鳴りより控えめなQ（10）で、旋律の音程が
   潰れて聞き取れなくならないようにしている */
function _playAcidMelNote(ctx, freq, t, dur, vol, dest) {
  const { osc, filter, gain } = _acidChain(ctx, dest, null); // 歪みなし（音程の聞き取り優先）
  osc.frequency.setValueAtTime(freq, t);
  filter.Q.setValueAtTime(10, t);
  /* カットオフは音程に応じて追従させる（低い音符でも高い音符でも同じ
     絶対Hzだと聞こえ方が偏るため、基音との相対関係で決める） */
  const cutHigh = Math.min(6000, freq * 8 + 1200);
  const cutLow  = Math.max(280, freq * 1.6);
  filter.frequency.setValueAtTime(cutHigh, t);
  filter.frequency.exponentialRampToValueAtTime(cutLow, t + Math.min(dur * 0.8, 0.11));

  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
  const stopAt = t + dur + 0.07;
  osc.start(t); osc.stop(stopAt);
  if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, osc, filter, gain);
}

/* キングギヨウザ戦のリール射撃音（TB-303アシッド版）。ユーザー要望:
   「射る音もTB-303に合うような音にしてください」。通常ゲームのコマ送り
   確定音（playSE('lock')、E4→G3の矩形波クリック）とはリズム・音程を保った
   まま音色だけノコギリ波+高レゾナンスフィルター掃引+ソフトクリップの
   アシッド質に差し替える。'lock'自体は通常ゲームの矢確定でも共用されている
   ため直接変更せず、ボス戦専用の新規SEケースとして切り出す
   （ボス戦BGMのkickVol/melAcid等、他の音周りの変更と同じ隔離方針）。 */
function _playAcidShootHit(ctx, t, dest) {
  const _pluck = (pt, freq, dur, vol) => {
    const { osc, filter, gain, shaper } = _acidChain(ctx, _seDest(ctx, dest), 3);
    osc.frequency.setValueAtTime(freq, pt);
    filter.Q.setValueAtTime(16, pt);
    filter.frequency.setValueAtTime(Math.min(6000, freq * 10 + 800), pt);
    filter.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 1.4), pt + dur);
    gain.gain.setValueAtTime(0.001, pt);
    gain.gain.exponentialRampToValueAtTime(vol, pt + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, pt + dur);
    const stopAt = pt + dur + 0.02;
    osc.start(pt); osc.stop(stopAt);
    if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, osc, filter, gain, shaper);
  };
  _pluck(t,         noteHz('E', 4), 0.05,  0.24);
  _pluck(t + 0.025, noteHz('G', 3), 0.045, 0.17);
}

/* キングギヨウザ登場（誕生）の瞬間専用、ドラ（銅鑼）風の派手な一撃音
   （ユーザー要望: 「バーン、とドラが鳴るような派手な感じにしたい」。
   従来はboss_flash（雷鳴: ノイズ+A2単音）を流用していたが、boss_flashは
   予兆収束開始・的破砕・こんがりしっぱい退場でも共用のSEのため、これを
   派手にすると他3箇所も変わってしまう。登場の瞬間だけを差し替えたいので
   新規ケースとして切り出す（_playAcidShootHit切り出し時と同じ隔離方針）。
   構成は2層:
   1. インパクト（バーン）: 低音の急減衰スライド（ドスンという衝撃）+
      広帯域ノイズバースト（アタックのクラック感）
   2. ドラの共鳴（金属的な唸り）: 基音（調内のA2、boss_flashと同じ音高で
      統一）に対し非整数次の倍音比を複数重ね、それぞれ独立した長い減衰で
      鳴らし続けて金属的な余韻を作る。整数次倍音列だと管楽器的な音になって
      しまうため、あえて整数比から外す（ベル/銅鑼の加算合成の定石）。
      高次倍音ほど音量を落とし・減衰を速くすることで自然な減衰特性にする */
function _playDoraHit(ctx, t, dest) {
  const d = _seDest(ctx, dest);
  _playSlideOsc(ctx, d, t, 'sine', 180, 45, 0.15, [[0, 0.9, 'set'], [0.35, 0.0001]], 0.4); // インパクト: 低音ドスン
  playNoise(ctx, t, 0.12, 0.5, 1500, d); // インパクト: アタックのノイズクラック
  const base = noteHz('A', 2); // boss_flashの雷鳴と同じ音高で統一
  const partials = [1, 2.0, 2.76, 3.3, 4.2, 5.4]; // ベル/銅鑼特有の非整数次倍音比
  partials.forEach((ratio, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(d);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * ratio, t);
    const vol = 0.22 / (i + 1);
    const decay = 1.8 - i * 0.15;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    const stopAt = t + decay + 0.05;
    osc.start(t); osc.stop(stopAt);
    if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, osc, gain);
  });
}

/* こんがり達成（キング撃破）専用の達成感あるファンファーレ
   （ユーザー要望: 「こんがりぎようざ達成時に、BGMはそこで止めて、達成感の
   ある効果音を鳴らしてください」）。従来は_startBossVictoryが通常モードの
   'jackpot'（stopBGM+scheduleBGMRestartで2秒後に自動再開する設計、
   トライが続く通常モード向け）を流用していたため、勝利演出の最中にボスBGM
   が復活してしまっていた。ボス戦の決着（もう戻らない）にはこの自動再開が
   そぐわないため、専用ケースとして切り出す（_playDoraHit切り出し時と
   同じ隔離方針）。BGM停止自体は_stopBossBGMForVictory側で行う。
   構成:
   1. 上昇アルペジオ+ベース（jackpotより1オクターブ広い、達成感の大きい音域）
   2. 「チーン」（オーブン/レンジの調理完了を示す定番SE。ユーザー指摘:
      「今も近いですが、もっとチーン音だとわかるようにしてほしい」）。
      さらに「ファンファーレとチーン音が重なってしまい、よく聞こえません。
      ファンファーレの後に、チーン音がタイミングよく、単独で鳴るように
      してください」との指摘を受け、鳴らすタイミングをファンファーレの
      主和音(C6, t+0.39)と同時打ちから、ファンファーレの全パート（メロディ
      最終音G6と、より遅く鳴り終わるベース最終音C4の減衰・リリースを含む）
      が鳴り止んだ後のt+1.6へ移動した。これによりチーン単独のアタックが
      確実に聞き取れる。
      当初は_playDoraHitと同じ5倍音の加算合成（銅鑼寄りの厚い響き）で
      「明るいベルの残響」を狙ったが、倍音が多く唸りが乗るとチーンより
      銅鑼・鐘の乱打に近く聞こえてしまう。実物のチーン音の特徴（単発・
      高く澄んだ・アタックが鋭い・倍音は最小限）に寄せて簡素化した:
      倍音を5層→2層（基音+明るい1オーバートーンのみ）に減らして単発の
      鐘の音として聞き取りやすくし、基音もアルペジオの頂点(C6)より
      1オクターブ上のC7へ上げて他パートに埋もれず明確に抜けて聞こえる
      ようにした。
      さらにユーザー指摘「物理的なベルを金属ソレノイドで1回叩いた時の音が
      チーン音だが、そうなっているか」を受けて打撃の物理を作り直した。
      正弦波を4msでゆっくり立ち上げるだけでは「フェードインする電子音」
      であって「叩かれた」音にはならない。実際の打撃音は
      (1)接触の瞬間に生じる短い広帯域クリック（ソレノイドの金属接触音）と
      (2)それによって励起される共鳴体（ベル）の減衰振動、の2要素で成り立つ
      （物理モデリング音源の「励起+共鳴」の定石）。
      (1)はplayNoiseの短時間・高域ハイパスで表現し、(2)は倍音ごとの
      アタックをほぼ瞬時(0.0015s)にして「打たれた瞬間から鳴り始める」
      立ち上がりにする。あわせて、打撃直後だけ光って速く消える高次倍音
      （金属打撃特有の「ピン」という煌めき）を1本追加し、基音・明るい
      オーバートーンは長く伸びる「チーン」の芯として残す（高次倍音ほど
      速く減衰するのは実際の金属共鳴体の物理特性と一致する）
   3. 仕上げのきらめき（実績解除'ach'と同じ動機を使い、「最後の実績」
      であることを音楽的にも結びつける） */
function _playKongariCompleteFanfare(ctx, t, dest) {
  const d = _seDest(ctx, dest);
  const fanfare = [
    [noteHz('C',5), 0.00, 0.16], [noteHz('E',5), 0.13, 0.16],
    [noteHz('G',5), 0.26, 0.16], [noteHz('C',6), 0.39, 0.45],
    [noteHz('E',6), 0.65, 0.16], [noteHz('G',6), 0.78, 0.55],
  ];
  fanfare.forEach(([f, dt, dur]) => playOsc(ctx, 'square', f, t+dt, dur, 0.30, 0.10, null, null, d));
  [noteHz('C',3), noteHz('G',3), noteHz('C',4)].forEach((f, i) =>
    playOsc(ctx, 'sine', f, t + i*0.28, 0.7, 0.34, 0.22, null, null, d));
  /* ファンファーレの最終音（メロディG6: t+0.78開始, dur0.55+decay0.10+
     release0.02→t+1.45で消音／ベースC4: t+0.56開始, dur0.7+decay0.22+
     release0.02→t+1.5で消音）が鳴り止んだ後、0.1秒の間を置いてから
     単独で打つ */
  const strikeT = t + 1.6;
  playNoise(ctx, strikeT, 0.008, 0.22, 6000, d); // ソレノイドがベルに接触する瞬間の金属クリック
  const base = noteHz('C', 7); // アルペジオの頂点(C6)より1オクターブ上、チーン特有の高く澄んだ音高
  const partials = [
    { ratio: 1,   vol: 0.28, decay: 1.5 },  // 基音: 長く伸びる「チーン」の芯
    { ratio: 2.4, vol: 0.11, decay: 0.9 },  // 明るいオーバートーン
    { ratio: 5.2, vol: 0.07, decay: 0.12 }, // 打撃直後だけ光る高次倍音（金属打撃特有の「ピン」）
  ];
  partials.forEach(({ ratio, vol, decay }) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(d);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(base * ratio, strikeT);
    gain.gain.setValueAtTime(0.0001, strikeT);
    gain.gain.linearRampToValueAtTime(vol, strikeT + 0.0015); // ほぼ瞬時（叩かれた瞬間から鳴り始める）
    gain.gain.exponentialRampToValueAtTime(0.0001, strikeT + decay);
    const stopAt = strikeT + decay + 0.05;
    osc.start(strikeT); osc.stop(stopAt);
    if (ctx === audioCtx) _disconnectAfter(ctx, stopAt, osc, gain);
  });
  /* 仕上げのきらめき: チーンの打撃が単独で聞こえるよう、アタックから
     0.6秒後（打撃直後の余韻の途中）に開始する（以前はファンファーレ基準の
     t+1.0だったが、チーンをt+1.6へ移動したため位置もチーン基準に合わせた） */
  [noteHz('E',5), noteHz('G',5), noteHz('A',5), noteHz('E',6)].forEach((f, i) =>
    playOsc(ctx, 'sine', f, strikeT + 0.6 + i*0.07, 0.16, 0.22, 0.10, null, null, d));
}

/* ── BGMループをオフラインレンダリングしてAudioBufferを返す ──
   optsでボス戦用の差し替え要素をまとめて指定できる（メロディ・ハイハット・
   キックの音符自体・鳴らすステップは通常BGMと共通のため、音色・音量・
   追加パートのみ引数化している）:
     bassArr    : ベースラインの音符配列（BGM_BASS / BGM_BASS_BOSS）
     melType    : メロディのオシレーター波形（通常='triangle'、ボスは
                  角のある鋭さを出すため'sawtooth'）
     bassDurMul/bassDecay: ベース音符の長さ・減衰（ボスは全ステップ連打の
                  不協和オスティナートのため、通常より短く切ってオーバー
                  ラップによる濁りを防ぐ）
     useTaiko   : 和太鼓の強打を追加するか（BGM_TAIKO_STRONG/FLOURISH参照）
     useRumble  : ループ頭に低音の地鳴りを追加するか（_playGroundRumble参照）
     melAcid    : メロディをTB-303風アシッド音色にするか（_playAcidMelNote
                  参照。trueの場合melTypeは無視される）
     kickVol    : キックの音量（_playKick参照）
     rumbleMellow: 地鳴りのマイルド化係数0〜1（_playGroundRumble参照。
                  こんがり度に応じた複数段階のボスBGMバッファを事前レンダ
                  リングするために引数化した。_rumbleTierForCookPct参照） */
async function renderBGMBuffer(sampleRate, {
  bassArr    = BGM_BASS,
  melType    = 'triangle',
  bassDurMul = 1.6,
  bassDecay  = 0.10,
  useTaiko   = false,
  useRumble  = false,
  melAcid    = false,
  kickVol    = 0.45,
  useLimiter = false, // ボスBGM専用（下記コメント参照）
  rumbleMellow = 0,
} = {}) {
  const totalSec  = BGM_LOOP_DUR + 0.4; // 末尾にリリース余白
  const offCtx    = new OfflineAudioContext(2, Math.ceil(sampleRate * totalSec), sampleRate);
  let dest;
  if (useLimiter) {
    /* ボス版はステップ0で地鳴り・和太鼓・キック・ベース・メロディが同時に鳴り、
       単純合算だとピーク振幅が1.6を超えてデジタルクリッピングしていた（実機指摘:
       「耳障りなキューという高音」「重低音になっていない」の直接原因。
       クリッピングの高調波歪みが地鳴りの低音を覆い隠し、耳障りな高音成分を
       生んでいた）。DynamicsCompressorNodeで疑似リミッターとして働かせる。 */
    const limiter = offCtx.createDynamicsCompressor();
    limiter.threshold.value = -10;
    limiter.knee.value = 3;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.001;
    limiter.release.value = 0.1;
    /* DynamicsCompressorNode単体だと最初期のアタック分をわずかに取りこぼし
       ピーク1.0をわずかに超えることがあったため、仕上げに固定ゲインで
       さらに9%引き下げて確実に1.0未満へ収める（安全マージン） */
    const safety = offCtx.createGain();
    safety.gain.value = 0.91;
    limiter.connect(safety);
    safety.connect(offCtx.destination);
    dest = limiter;
  } else {
    /* 通常BGMはDynamicsCompressorNodeを使わない。
       ピークは1.07程度の軽微超過（ボスの1.6超とは別次元）なので固定ゲインで足りる上、
       コンプレッサーには実装依存の内部ルックアヘッド（数ms）があり、ループ冒頭の
       同時発音（キック+メロディ+ハット）の立ち上がりが遅れて「わずかにフェードイン
       して聞こえる」不具合の原因になっていた（実測: RMSがms5→ms35にかけて
       0.10→0.18と一旦上昇してから減衰するいびつな包絡線を確認）。 */
    const safety = offCtx.createGain();
    safety.gain.value = 0.9;
    safety.connect(offCtx.destination);
    dest = safety;
  }
  for (let s = 0; s < BGM_MEL.length; s++) {
    const t   = s * BGM_BEAT * 0.5;
    const dur = BGM_BEAT * 0.5;
    const mel = BGM_MEL[s];
    if (mel) {
      if (melAcid) _playAcidMelNote(offCtx, noteHz(mel[0], mel[1]), t, dur * 0.85, mel[2], dest);
      else playOsc(offCtx, melType, noteHz(mel[0], mel[1]), t, dur * 0.85, mel[2], 0.06, null, null, dest);
    }
    const bas = bassArr[s];
    if (bas) playOsc(offCtx, 'sine', noteHz(bas[0], bas[1]), t, dur * bassDurMul, bas[2], bassDecay, null, null, dest);
    if (useRumble && s === 0) _playGroundRumble(offCtx, t, dest, rumbleMellow);
    playNoise(offCtx, t, 0.04, BGM_HAT[s], 8000, dest);
    if (BGM_KICK.has(s)) _playKick(offCtx, t, dest, kickVol);
    if (useTaiko) {
      if (BGM_TAIKO_STRONG.has(s))   _playTaikoHit(offCtx, t, dest, true);
      else if (BGM_TAIKO_FLOURISH.has(s)) _playTaikoHit(offCtx, t, dest, false);
    }
  }
  return offCtx.startRendering();
}

/* ── BGMソース管理ユーティリティ ── */
/* 差し替え直後、まだ止まっていない旧地鳴りソースへの参照
   （_swapBossRumbleBuffer参照）。差し替え完了前にバトルが終わって
   _destroyBGMSourceが呼ばれた場合、こちらも一緒に止めて後始末する */
let _pendingRumbleOldSrc = null;

function _destroyBGMSource() {
  if (_pendingRumbleOldSrc) {
    _pendingRumbleOldSrc.onended = null;
    try { _pendingRumbleOldSrc.stop(); } catch(e) {}
    try { _pendingRumbleOldSrc.disconnect(); } catch(e) {}
    _pendingRumbleOldSrc = null;
  }
  if (bgmSource) {
    bgmSource.onended = null;
    try { bgmSource.stop(); } catch(e) {}
    bgmSource.disconnect();
    bgmSource = null;
  }
}

function _createBGMSource(startRate = 1.0, buffer = bgmBuffer) {
  if (!audioCtx || !buffer) return null;
  _destroyBGMSource();
  const src      = audioCtx.createBufferSource();
  src.buffer     = buffer;
  src.loop       = true;
  src.loopEnd    = BGM_LOOP_DUR;
  src.playbackRate.value = startRate;
  _setBgmRateJS(startRate, startRate, 0, 0); // 即時セット（ランプなし）
  src.connect(bgmGain);
  bgmSource = src;
  return src;
}

/* ── ボス戦BGMの地鳴りマイルド化（こんがり度連動） ──
   ユーザー要望: 「こんがり度が上がるに従って、マイルドな音に変化していく
   ようにしたい」。地鳴りはループ先頭に1回だけ焼き込まれる仕様上、鳴って
   いる最中に音色を連続変化させることはできない。段階ごとに丸ごと事前
   レンダリングしたbossBgmBuffers（tier0=最も凶暴〜tierN-1=最もマイルド、
   getAudioCtx参照）を、こんがり度が対応する段階に達したらループの継ぎ目で
   AudioBufferSourceNodeごと差し替える。地鳴り以外の内容は全段階で同一の
   ため、継ぎ目での差し替えはクロスフェード無しで聞こえない。 */

/* cookPct(0-100)から対応する段階（0〜RUMBLE_TIER_COUNT-1）を返す */
function _rumbleTierForCookPct(pct) {
  return Math.min(RUMBLE_TIER_COUNT - 1, Math.floor(pct / (100 / RUMBLE_TIER_COUNT)));
}

/* 次にループが先頭（=地鳴りが鳴る瞬間）に戻るaudioCtx.currentTimeを返す。
   _bgmAccumAudioTime（レート変動を考慮したバッファ内積算位置）と
   _bgmQuantizedLoopDurから算出する（ボスBGM再生中のみ意味を持つ） */
function _nextBossLoopBoundaryTime() {
  if (!audioCtx || !bgmSource || _bgmQuantizedLoopDur <= 0) return null;
  const rate = _getBgmRateJS();
  if (rate <= 0) return null;
  const posInLoop = ((_bgmAccumAudioTime % _bgmQuantizedLoopDur) + _bgmQuantizedLoopDur) % _bgmQuantizedLoopDur;
  return audioCtx.currentTime + (_bgmQuantizedLoopDur - posInLoop) / rate;
}

/* tierのバッファへ、直近のループ境界（boundaryT、audioCtx.currentTime基準）で
   差し替える */
function _swapBossRumbleBuffer(tier, boundaryT) {
  const buf = bossBgmBuffers && bossBgmBuffers[tier];
  if (!buf || !audioCtx || !bgmSource) return;
  const rate = _getBgmRateJS();
  const oldSrc = bgmSource;
  const newSrc = audioCtx.createBufferSource();
  newSrc.buffer = buf;
  newSrc.loop = true;
  newSrc.loopEnd = BGM_LOOP_DUR;
  newSrc.playbackRate.value = rate;
  newSrc.connect(bgmGain);
  newSrc.start(boundaryT, 0);
  oldSrc.onended = null;
  try { oldSrc.stop(boundaryT); } catch(e) {}
  _pendingRumbleOldSrc = oldSrc;
  oldSrc.onended = () => {
    try { oldSrc.disconnect(); } catch(e) {}
    if (_pendingRumbleOldSrc === oldSrc) _pendingRumbleOldSrc = null;
  };
  bgmSource = newSrc;
  _bossRumbleTier = tier;
}

/* _updateBossBattleから毎フレーム呼ぶ。こんがり度が新しい段階に入ったら
   予約し、次のループ境界が近づいた（0.2秒以内）タイミングで実際に差し替える。
   境界時刻をずっと先（最大1ループ分≈2.6秒）まで予約したまま保持しないのは、
   その間にバトルが終わってbgmSourceが差し替わると旧ソースの後始末が複雑に
   なるため（_destroyBGMSourceは「今のbgmSource」しか止めない）。0.2秒まで
   待ってから確定させることでその隙間を短く抑える。
   レートランプ中（テープ演出）は新ソース側にランプが引き継がれないため、
   ランプ完了まで保留する */
function _updateBossRumbleTier() {
  if (!_king || !audioCtx || !bgmSource || !_bgmIsBoss || !bossBgmBuffers) return;
  const desired = _rumbleTierForCookPct(_king.cookPct);
  if (desired !== _bossRumbleTier && _bossRumblePendingTier !== desired && bossBgmBuffers[desired]) {
    _bossRumblePendingTier = desired;
  }
  if (_bossRumblePendingTier === null) return;
  if (_bgmRateDur > 0 && (audioCtx.currentTime - _bgmRateStart) < _bgmRateDur) return; // ランプ中は保留
  const boundaryT = _nextBossLoopBoundaryTime();
  if (boundaryT == null) return;
  if (boundaryT - audioCtx.currentTime > 0.2) return; // 境界がまだ遠い→次フレームで再確認
  _swapBossRumbleBuffer(_bossRumblePendingTier, boundaryT);
  _bossRumblePendingTier = null;
}

/* ── BGM制御API ── */

/* ── ミュート制御（masterGain のみ制御。bgmGain/ソースは触らない） ── */
function applyMuteGain() {
  if (!masterGain || !audioCtx) return;
  masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
  /* ポーズ中は MUTE 状態に関わらず無音を維持する */
  masterGain.gain.setValueAtTime((audioMuted || isPaused) ? 0 : 1, audioCtx.currentTime);
}

/* BGMソース起動（ミュート状態を問わず起動。gain が音量を制御する） */
function startBGM() {
  if (!audioCtx) return;
  if (!bgmBuffer) {
    /* バッファがまだレンダリング中 → 完了後に自動起動するフラグを立てる */
    bgmPendingStart = true;
    return;
  }
  bgmPendingStart = false;
  if (bgmSource) return; // すでに再生中
  /* bgmGain は常に1（ミュートは masterGain が担う） */
  bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
  bgmGain.gain.setValueAtTime(1, audioCtx.currentTime);
  const src = _createBGMSource(1.0);
  if (src) { src.start(); bgmPhaseRef = audioCtx.currentTime; _bgmAccumReset(); }
  grayRateTarget = 1.0; grayRateCur = 1.0; // 通常BGM開始時はグレースケール即時解除
}

/* reach/jackpot SE中のBGM一時消音（ソースは動かし続ける） */
function stopBGM() {
  if (bgmRestartTimer) { clearTimeout(bgmRestartTimer); bgmRestartTimer = null; }
  stopJingle();
  /* ソースは停止せず gain だけ 0 にする（SE中もBGMはループし続ける） */
  if (bgmGain && audioCtx) {
    bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmGain.gain.setValueAtTime(0, audioCtx.currentTime);
  }
}

/* SE終了後に bgmGain を 1 に戻す（ミュート制御は masterGain が担うので無条件で 1） */
function scheduleBGMRestart(delayMs) {
  if (bgmRestartTimer) { clearTimeout(bgmRestartTimer); bgmRestartTimer = null; }
  bgmRestartTimer = setTimeout(() => {
    bgmRestartTimer = null;
    if (bgmGain && audioCtx) {
      bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
      bgmGain.gain.setValueAtTime(1, audioCtx.currentTime);
    }
  }, delayMs);
}

/* テープ速度カーブ生成
   easeOut: 最初に素早く落ちてじわり停止（テープが止まる感じ）
            sin(p*π/2) → p=0で傾き大、p=1で傾き0
   easeIn:  じわりと動き出して加速（世界が動き始める感じ）
            1-cos(p*π/2) → p=0で傾き0、p=1で傾き大 */
function _tapeRateCurve(from, to, easeType, N = 64) {
  const curve = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    curve[i] = from + (to - from) * _easeF(i / (N - 1), easeType);
  }
  return curve;
}

/* テープが止まるように減速停止（ゲームオーバー専用） */
function stopBGMTape(durationMs = 1300) {
  if (bgmRestartTimer) { clearTimeout(bgmRestartTimer); bgmRestartTimer = null; }
  stopJingle();
  if (!bgmSource || !audioCtx) { _destroyBGMSource(); return; }
  /* ソースを止めずに極低速（0.001x）まで落とす。
     再生位置がほぼ止まったまま保持されるので、リセット時に同じ場所から加速できる。 */
  const t       = audioCtx.currentTime;
  const curRate = _getBgmRateJS(); // .value は自動化中に正しい値を返さないため JS 側で取得
  bgmSource.playbackRate.cancelScheduledValues(t);
  /* easeOut: 最初に素早くテンポが落ち、最後にじわり停止 */
  bgmSource.playbackRate.setValueCurveAtTime(
    _tapeRateCurve(curRate, 0.001, 'easeOut'), t, durationMs / 1000);
  _setBgmRateJS(curRate, 0.001, t, durationMs / 1000, 'easeOut');
  grayRateTarget = 0.001; // グレースケールを最大に向かってアニメーション
}

/* こんがり達成（キング撃破）専用のBGM停止（ユーザー要望: 「BGMはそこで
   止めて」）。stopBGMTapeを使わない理由: あちらは減速演出とグレースケール
   演出（grayRateTarget）がセットになっており、「敗北・停滞」の質感になる。
   勝利の高揚感（花火が上がる）とグレースケールは噛み合わないため、
   bgmGainを短時間でフェードしてからソースを止めるだけの軽い処理にする。
   fadeMs経過後に停止するが、その時点のbgmSourceが差し替え前のものと
   同じ場合のみ止める（capturedSrcガード）: _bossVictoryTimer>90経過後の
   CONTINUEタップで_kingBattleEndが新しいBGMソースを既に作っていた場合に、
   誤って新ソースを止めてしまう事故を防ぐ */
function _stopBossBGMForVictory(fadeMs = 120) {
  if (!audioCtx || !bgmGain) return;
  const t = audioCtx.currentTime;
  bgmGain.gain.cancelScheduledValues(t);
  bgmGain.gain.setValueAtTime(bgmGain.gain.value, t);
  bgmGain.gain.linearRampToValueAtTime(0, t + fadeMs / 1000);
  const capturedSrc = bgmSource;
  setTimeout(() => { if (bgmSource === capturedSrc) _destroyBGMSource(); }, fadeMs + 30);
}

/* テープが回り始めるように加速（ゲームオーバーリセット専用）
   既存ソースがあればその位置から加速、なければ新規作成 */
function startBGMTape(durationMs = 1400) {
  if (!audioCtx) return;
  bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
  bgmGain.gain.setValueAtTime(1, audioCtx.currentTime);
  const t = audioCtx.currentTime;
  /* ボスBGM（暗黒版バッファ）で鳴っている場合は既存ソースを使い回せない
     （AudioBufferSourceNodeのbufferはstart()前しか差し替えられないため）。
     その場合は既存ソースの現在レートを引き継ぎつつ、通常バッファで
     必ず新規に作り直す（_bgmIsBoss、startBossBGMTape参照） */
  if (bgmSource && !_bgmIsBoss) {
    /* 極低速で回り続けているソースを現在位置からeaseInで加速 */
    const curRate = _getBgmRateJS(); // .value は自動化中に正しい値を返さないため JS 側で取得
    bgmSource.playbackRate.cancelScheduledValues(t);
    /* easeIn: じわりと動き出し、後半で加速して通常速度へ */
    bgmSource.playbackRate.setValueCurveAtTime(
      _tapeRateCurve(curRate, 1.0, 'easeIn'), t, durationMs / 1000);
    _setBgmRateJS(curRate, 1.0, t, durationMs / 1000, 'easeIn');
  } else {
    /* フォールバック: ソースが消えていた場合、またはボスBGM再生中の場合は
       通常バッファで新規作成してeaseIn加速（ボスBGMの場合は現在レートから
       引き継ぐことでテープの繋がりを自然にする） */
    if (!bgmBuffer) return;
    const startRate = bgmSource ? _getBgmRateJS() : 0.001;
    const src = _createBGMSource(startRate, bgmBuffer);
    if (!src) return;
    src.playbackRate.setValueCurveAtTime(
      _tapeRateCurve(startRate, 1.0, 'easeIn'), t, durationMs / 1000);
    _setBgmRateJS(startRate, 1.0, t, durationMs / 1000, 'easeIn');
    src.start();
    bgmPhaseRef = t + durationMs / 1000; // 加速完了時点を拍グリッド基準にする
    _bgmAccumReset(); // 新規ソースなので積算位置もリセット
    grayRateCur = 0.001; // フォールバック時はグレースケール現在値もリセット
    _bgmIsBoss = false;
  }
  grayRateTarget = 1.0; // グレースケールを解除方向へアニメーション
}

/* ボス戦BGM（暗黒版バッファ）へ切り替え、レートをeaseInでBOSS_BGM_RATEまで
   持っていく。バッファの差し替えを伴うため既存ソースは使い回さず必ず
   作り直す（レンダリング未完でbossBgmBufferがまだ無い場合は通常BGMで代用） */
function startBossBGMTape(durationMs = 1400) {
  if (!audioCtx || !bossBgmBuffer) { startBGMTape(durationMs); return; }
  bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
  bgmGain.gain.setValueAtTime(1, audioCtx.currentTime);
  const t = audioCtx.currentTime;
  const startRate = bgmSource ? _getBgmRateJS() : 0.001;
  const src = _createBGMSource(startRate, bossBgmBuffer);
  if (!src) return;
  src.playbackRate.setValueCurveAtTime(
    _tapeRateCurve(startRate, BOSS_BGM_RATE, 'easeIn'), t, durationMs / 1000);
  _setBgmRateJS(startRate, BOSS_BGM_RATE, t, durationMs / 1000, 'easeIn');
  src.start();
  bgmPhaseRef = t + durationMs / 1000;
  _bgmAccumReset();
  grayRateCur = 0.001;
  grayRateTarget = 1.0;
  _bgmIsBoss = true;
}

/* BET額に対応するスローハンドBGM速度比率を返す
   BET=1→30%, BET=100000→90%, 対数補間 */
function _slowHandRate(betVal) {
  return 0.50 + 0.48 * Math.log10(Math.max(1, betVal)) / 6;
}

/* BGMのplaybackRateを現在値から targetRate へテープカーブでなめらかに変化させる
   スローイベント開始・終了時のテンポ演出に使用 */
/* blockInput=true のときだけランプ中のクリックを無視する
   自動ランプ（init切替・当たり復帰・tapestart）は false、
   Ctrl+T のインタラクティブ切り替えは true */
function rampBGMRate(targetRate, durationMs = 1200, easeType = 'easeOut', blockInput = false) {
  if (!bgmSource || !audioCtx) return;
  const t       = audioCtx.currentTime;
  const curRate = _getBgmRateJS(); // .value は自動化中に正しい値を返さないため JS 側で取得
  if (Math.abs(curRate - targetRate) < 0.005) return; // すでに目標値
  bgmSource.playbackRate.cancelScheduledValues(t);
  bgmSource.playbackRate.setValueCurveAtTime(
    _tapeRateCurve(curRate, targetRate, easeType), t, durationMs / 1000);
  _setBgmRateJS(curRate, targetRate, t, durationMs / 1000, easeType);
  grayRateTarget = targetRate; // グレースケールも同じ目標へ追従
  /* 入力ブロックが必要な場合のみランプ終了時刻を記録 */
  if (blockInput) slowRampEndTime = t + durationMs / 1000;
}


/* デスクトップ向け: キーボード・マウス操作で AudioContext を unlock する。
   iOS タッチは touchstart/touchend ハンドラ内の _unlockAudio() / _resumeAudioCtx() で処理する。 */
function _onFirstGesture() {
  document.removeEventListener('keydown',   _onFirstGesture, true);
  document.removeEventListener('mousedown', _onFirstGesture, true);
  const ctx = getAudioCtx();
  ctx.resume().then(() => {
    /* masterGain 経由でサイレントバッファを再生して AVAudioSession をアクティブ化する。
       destination 直結では BGM パスが開通しないことがある（iOS Safari）。 */
    const buf = ctx.createBuffer(1, 1, ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(masterGain); src.start(ctx.currentTime);
  }).catch(() => {});
}
document.addEventListener('keydown',   _onFirstGesture, true);
document.addEventListener('mousedown', _onFirstGesture, true);

/* iOS Safariはバックグラウンド→フォアグラウンド復帰時にaudioCtxをsuspendする。
   visibilitychange でフォアグラウンド復帰を検知し、ミュートでなければ resume する。 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (!isPaused && phase !== 'startup') togglePause();
  }
  /* フォアグラウンド復帰時の resume() は削除。
     interrupted 状態を suspended に変えてしまい、PAUSEボタンの
     interrupted 検知ブランチ（AudioContext 再作成）が動かなくなるため。
     PAUSEボタンのタッチイベント内で resume()/再作成を確実に行う。 */
});

function toggleMute() {
  audioMuted = !audioMuted;
  /* audioMuted は毎セッション MUTED スタートのため localStorage に保存しない */
  /* ミュートは gain だけを制御する。BGMソースの起動・停止はしない。 */
  applyMuteGain();
  /* ミュート解除時: interrupted/suspended 状態を _resumeAudioCtx で確実に解消する。
     interrupted は再作成、suspended は resume() で対応。 */
  if (!audioMuted && audioCtx && audioCtx.state !== 'running') {
    _resumeAudioCtx(applyMuteGain);
  }
  /* ゲーム中にミュート解除した際、BGMソースが未起動なら起動する
     （MUTEのままゲームを始めた場合に audioCtx 生成が遅延した場合の補償）。
     実機報告で発覚: bossVictory・trueEndingはbgmSourceを持たない前提の
     フェーズ（NO_BGM_SOURCE_PHASES参照、togglePause側の同種の不具合を
     修正した際に導入した集合）だが、ここではphase!=='startup'/'bossOmen'
     しか除外していなかったため、タイトル画面から真エンディングを再生中に
     MUTE/解除すると「bgmSourceが無い」がそのまま真になり通常BGMが新規に
     鳴り出し、テーマ曲と二重に聞こえていた */
  if (!audioMuted && phase !== 'startup' && phase !== 'bossOmen' && !NO_BGM_SOURCE_PHASES.has(phase) &&
      audioCtx && !bgmSource && !jingleScheduler) {
    startBGM(); // 予告中は除外（startBGMはグレースケールを即時解除するため）
  }
}

/* ════════════════ 効果音 ════════════════ */
function playSE(name, atTime) {
  if (audioMuted || !audioCtx || audioCtx.state !== 'running') return;
  const ctx = audioCtx;
  const t   = atTime ?? (ctx.currentTime + 0.01);
  switch (name) {
    case 'shoot': {
      /* 弓を放つ音: noise（弦の放つ音）+ Cメジャーアルペジオ
         4本の矢ごとに C5→E5→G5→C6 と音程が上がり、コードが積み上がる演出
         curIdx は発射時の矢番号（0〜3）をグローバル変数から参照 */
      playNoise(ctx, t, 0.05, 0.20, 3000);
      playOsc(ctx, 'triangle', _SHOOT_ARPEGIO[Math.min(curIdx, 3)], t, 0.03, 0.15, 0.06);
      break;
    }
    case 'lock': {
      /* コツン（E4→G3: 打撃感を保ちつつ音程だけ調内に調律） */
      playOsc(ctx, 'square', noteHz('E',4), t, 0.04, 0.22, 0.04);
      playOsc(ctx, 'square', noteHz('G',3), t+0.025, 0.03, 0.15, 0.04);
      break;
    }
    case 'kingShoot': {
      /* キングギヨウザ戦のリール射撃音（TB-303アシッド版、_playAcidShootHit参照） */
      _playAcidShootHit(ctx, t);
      break;
    }
    case 'bet': {
      /* カチッ */
      playNoise(ctx, t, 0.03, 0.18, 6000);
      playOsc(ctx, 'square', 880, t, 0.02, 0.10, 0.02);
      break;
    }
    case 'reach': {
      /* ジャジャーン: 緊張感あるコード
         G7（ドミナントセブンス）: 緊張を作りつつ、約0.9秒後に再開する
         Cメジャーペンタの BGM へ教科書通りに解決する */
      stopBGM(); // BGM一時停止してSEを際立たせる
      const chord = [noteHz('G',3), noteHz('B',3), noteHz('D',4), noteHz('F',4)]; // G7
      chord.forEach((f, i) => {
        playOsc(ctx, 'sawtooth', f, t + i*0.04, 1.2, 0.18, 0.6);
      });
      playNoise(ctx, t, 0.2, 0.3, 200);
      /* 0.8秒後にBGM再開 */
      scheduleBGMRestart(900);
      break;
    }
    case 'medium': {
      /* 中当たり: 上昇フレーズ */
      const mscale = [noteHz('C',5), noteHz('E',5), noteHz('G',5), noteHz('C',6)];
      mscale.forEach((f, i) => playOsc(ctx, 'triangle', f, t + i*0.08, 0.25, 0.30, 0.12));
      break;
    }
    case 'jackpot': {
      /* 大当たりファンファーレ */
      stopBGM();
      const fanfare = [
        [noteHz('C',5), 0.00, 0.15],
        [noteHz('E',5), 0.12, 0.15],
        [noteHz('G',5), 0.24, 0.15],
        [noteHz('C',6), 0.36, 0.40],
        [noteHz('G',5), 0.60, 0.12],
        [noteHz('C',6), 0.72, 0.50],
      ];
      fanfare.forEach(([f, dt, d]) => playOsc(ctx, 'square', f, t+dt, d, 0.28, 0.08));
      /* ベース */
      [noteHz('C',3), noteHz('G',3)].forEach((f, i) =>
        playOsc(ctx, 'sine', f, t + i*0.36, 0.6, 0.32, 0.2));
      scheduleBGMRestart(2000);
      break;
    }
    case 'reach_jackpot': {
      /* 超大当たり: より派手なファンファーレ */
      stopBGM();
      const big = [
        [noteHz('C',5), 0.00, 0.12], [noteHz('E',5), 0.10, 0.12],
        [noteHz('G',5), 0.20, 0.12], [noteHz('C',6), 0.30, 0.30],
        [noteHz('E',6), 0.55, 0.12], [noteHz('G',6), 0.65, 0.12],
        [noteHz('C',7), 0.75, 0.60],
      ];
      big.forEach(([f, dt, d]) => {
        playOsc(ctx, 'square',    f,   t+dt, d, 0.24, 0.08);
        playOsc(ctx, 'sawtooth',  f*2, t+dt, d, 0.10, 0.08);
      });
      /* 連続コイン音: ペンタトニック上昇走句（旧: 等比5%刻みの半音階的スメアで調外を通過していた） */
      _COIN_RUN.forEach((f, i) =>
        playOsc(ctx, 'sine', f, t + 0.9 + i*0.07, 0.08, 0.22, 0.05));
      playNoise(ctx, t, 0.3, 0.35, 100);
      scheduleBGMRestart(2500);
      break;
    }
    case 'miss': {
      /* ズコー: D4→E2 スライド（元のキャラを保ちつつCメジャーのノートに調律） */
      _playSlideOsc(ctx, _seDest(ctx), t, 'sawtooth', noteHz('D', 4), noteHz('E', 2), 0.45,
        [[0, 0.22, 'set'], [0.50, 0.0001]], 0.52);
      break;
    }
    case 'coin': {
      /* コインじゃらじゃら */
      for (let i = 0; i < 5; i++) {
        const f = noteHz('C', 6) * (0.95 + Math.random() * 0.15);
        playOsc(ctx, 'sine', f, t + i*0.055, 0.12, 0.20, 0.08);
      }
      break;
    }
    case 'gameover': {
      /* ゲームオーバー: 悲しい下降 */
      const goSeq = [
        [noteHz('G',4), 0.00, 0.3],
        [noteHz('E',4), 0.25, 0.3],
        [noteHz('C',4), 0.50, 0.3],
        [noteHz('A',3), 0.75, 0.6],
      ];
      goSeq.forEach(([f, dt, d]) => playOsc(ctx, 'triangle', f, t+dt, d, 0.28, 0.15));
      break;
    }
    case 'ach': {
      /* 実績解除: キラン */
      const achSeq = [noteHz('E',5), noteHz('G',5), noteHz('A',5), noteHz('E',6)];
      achSeq.forEach((f, i) => playOsc(ctx, 'sine', f, t + i*0.06, 0.15, 0.25, 0.10));
      break;
    }
    case 'boss_rumble': {
      /* 地鳴り: 低いA1+低域ノイズ（ボスBGM（Aマイナー予定）の予兆として調内） */
      playOsc(ctx, 'sine', noteHz('A',1), t, 0.5, 0.4, 0.3);
      playNoise(ctx, t, 0.35, 0.25, 150);
      break;
    }
    case 'boss_flash': {
      /* 雷鳴: ノイズバースト+A2 */
      playNoise(ctx, t, 0.5, 0.4, 400);
      playOsc(ctx, 'sawtooth', noteHz('A',2), t, 0.3, 0.2, 0.2);
      break;
    }
    case 'king_appear': {
      /* キングギヨウザ登場の瞬間専用（_playDoraHit参照）:
         バーンという衝撃＋ドラのような金属的な余韻 */
      _playDoraHit(ctx, t);
      break;
    }
    case 'kongari_complete': {
      /* こんがり達成（キング撃破）の瞬間専用（_playKongariCompleteFanfare参照）:
         上昇アルペジオ＋明るいベルの残響＋実績解除のきらめき */
      _playKongariCompleteFanfare(ctx, t);
      break;
    }
    case 'sync_just': break; // 廃止: 視覚表示（JUST!/GOOD）のみ、SE なし
    case 'slow_hand': {
      /* スローハンド発動: テープが引っかかって遅くなるような"ウォ〜ン"音
         C5→E3 スライド（テープ感を保ちつつ両端を調内に調律） */
      _playSlideOsc(ctx, _seDest(ctx), t, 'sine', noteHz('C',5), noteHz('E',3), 0.65,
        [[0, 0.0001, 'set'], [0.05, 0.32, 'lin'], [0.20, 0.32, 'set'], [0.75, 0.0001]], 0.77);
      /* 低音の重さを加える（E2: 調内に調律） */
      playOsc(ctx, 'triangle', noteHz('E',2), t + 0.05, 0.4, 0.18, 0.25);
      /* 短いノイズバースト（テープのこすれ感） */
      playNoise(ctx, t, 0.06, 0.12, 400);
      break;
    }
  }
}
