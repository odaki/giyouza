function drawEndScreen() {
  ctx.save();
  const alpha=Math.min(1,(endTimer-45)/35);
  if (alpha<0.6){ctx.restore();return;}

  const cy=H/2-25;
  /* 縦画面(W=420)は横画面(W=1060)基準のフォントサイズをスケールダウン
     「超大当たり」は7文字のため幅制約が厳しく個別に小さめのスケールを使用 */
  const _fsc  = IS_PORTRAIT ? 0.90 : 1.0; // 通常テキスト用
  const _fscR = IS_PORTRAIT ? 0.68 : 1.0; // 超大当たりタイトル用（7文字）
  const _fs   = s => Math.round(s * _fsc);
  const _fsR  = s => Math.round(s * _fscR);
  const _fy   = y => Math.round(y * _fsc);

  /* ━━ 大当たり ━━ */
  if (hitType === 'jackpot') {
    for (const c of CLOUDS) drawCloud(c.x,c.y,c.s*1.2,Math.min(0.9,c.a+0.2),c.r);

    if (isReachJackpot) {
      /* ── リーチ経由: 虹色・大型・激しいパルス ── */
      const pulse = 1 + 0.12 * Math.sin(endTimer * 0.18);
      ctx.save(); ctx.translate(W/2, cy); ctx.scale(pulse, pulse);

      /* 虹色の大光輪 */
      const haloR = ctx.createRadialGradient(0,0,_fsR(30),0,0,_fsR(280));
      const hue = (endTimer * 2) % 360;
      haloR.addColorStop(0,   `hsla(${hue},100%,70%,0.45)`);
      haloR.addColorStop(0.5, `hsla(${(hue+120)%360},100%,60%,0.2)`);
      haloR.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = haloR;
      ctx.beginPath(); ctx.arc(0,0,_fsR(280),0,Math.PI*2); ctx.fill();

      /* 虹色グラデーションテキスト:
         フィル色はアニメーションするためグロー+縁取りだけ焼き、フィルのみ毎フレーム描く */
      const _rjFont = `bold ${_fsR(96)}px ${FONT_MIN}`;
      ctx.font = _rjFont;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const grad = ctx.createLinearGradient(-_fsR(200),0,_fsR(200),0);
      grad.addColorStop(0,   `hsl(${hue},100%,65%)`);
      grad.addColorStop(0.25,`hsl(${(hue+60)%360},100%,65%)`);
      grad.addColorStop(0.5, `hsl(${(hue+120)%360},100%,65%)`);
      grad.addColorStop(0.75,`hsl(${(hue+200)%360},100%,65%)`);
      grad.addColorStop(1,   `hsl(${(hue+300)%360},100%,65%)`);
      if (_CACHE_OK) {
        const e = _titleOCCache.get('rjp_t') ||
          _bakeGlowStroke('rjp_t', '超大当たり', _rjFont, 'rgba(0,0,0,0.92)', _fsR(13), '#fff', 60);
        ctx.drawImage(e.oc, -e.w/2, -e.h/2, e.w, e.h);
        ctx.fillStyle = grad;
        ctx.fillText('超大当たり', 0, 0);
      } else {
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 60;
        outText('超大当たり',0,0, grad, 'rgba(0,0,0,0.92)', _fsR(13));
        ctx.shadowBlur = 0;
      }
      _outTextCached('rjp_s', 'リーチ達成！ ギ ヨ ウ ザ', `bold ${_fs(36)}px ${FONT_MIN}`,
        '#ffffff', 'rgba(0,0,0,0.88)', _fs(8), '#fff', 22, 0, _fy(92));
      ctx.restore();

    } else {
      /* ── 通常大当たり ── */
      const pulse=1+0.06*Math.sin(endTimer*0.12);
      ctx.save(); ctx.translate(W/2,cy); ctx.scale(pulse,pulse);
      const halo=ctx.createRadialGradient(0,0,_fs(20),0,0,_fs(230));
      halo.addColorStop(0,'rgba(245,208,32,0.4)'); halo.addColorStop(1,'rgba(245,208,32,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,_fs(230),0,Math.PI*2); ctx.fill();
      _outTextCached('jp_t', '大当たり', `bold ${_fs(88)}px ${FONT_MIN}`,
        Y, 'rgba(0,0,0,0.9)', _fs(11), Y, 55, 0, 0);
      _outTextCached('jp_s', 'ギ ヨ ウ ザ 達成！', `bold ${_fs(32)}px ${FONT_MIN}`,
        '#fffde7', 'rgba(0,0,0,0.85)', _fs(7), Y, 20, 0, _fy(80));
      ctx.restore();
    }

  /* ━━ 中当たり・小当たり9種（END_HIT_STYLES の表で描く） ━━ */
  } else if (END_HIT_STYLES[hitType]) {
    const st = END_HIT_STYLES[hitType];
    const m  = st.motion ? st.motion(endTimer) : null;
    ctx.save();
    ctx.translate(W / 2 + (m?.dx ?? 0), cy + (m?.dy ?? 0));
    if (m && (m.sx !== undefined || m.sy !== undefined)) ctx.scale(m.sx ?? 1, m.sy ?? 1);
    _outTextCached(`${st.key}_t`, st.tier, `bold ${_fs(78)}px ${FONT_MIN}`,
      st.tierFill, st.stroke, _fs(10), st.glow, st.tierGlowB, 0, 0);
    _outTextCached(`${st.key}_s`, st.kana, `bold ${_fs(38)}px ${FONT_MIN}`,
      st.kanaFill, st.kanaStroke, _fs(7), st.glow, st.kanaGlowB, 0, _fy(78));
    ctx.restore();

  /* ━━ ハズレ: drawMissPopup() で描画 ━━ */
  } else { /* miss */ }

  /* 獲得ポップアップは常時描画ブロック（drawPayoutPopup）で描画 */

  /* ゲームオーバー */
  if (isGameOver) _drawGameOverTitle(alpha, endTimer, canRestart);
  ctx.restore();
}

/* ── ビートシンクメーター ── */
/* _syncBarColor: 固定バッファを再利用 + テンプレートリテラルを事前テーブルに置換 */
const _syncColorBuf = ['', '', 0];
function _syncBarColor(r) {
  /* 0=グレー → 0.4=赤 → 0.6=黄 → 0.8=緑 → 1.0=ゴールド
     テンプレートリテラル文字列の動的生成を排除するため _SYNC_RGB_TABLE を参照 */
  if (r >= 0.9) { _syncColorBuf[0]=Y; _syncColorBuf[1]='#f5a623'; _syncColorBuf[2]=1.0; return _syncColorBuf; }
  if (r >= 0.7) { const i=Math.min(63,(r-0.7)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.green[i];  _syncColorBuf[1]='#40c840'; _syncColorBuf[2]=0.85; return _syncColorBuf; }
  if (r >= 0.5) { const i=Math.min(63,(r-0.5)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.yellow[i]; _syncColorBuf[1]='#ddc020'; _syncColorBuf[2]=0.75; return _syncColorBuf; }
  if (r >= 0.3) { const i=Math.min(63,(r-0.3)/0.2*63)|0; _syncColorBuf[0]=_SYNC_RGB_TABLE.red[i];    _syncColorBuf[1]='#c83020'; _syncColorBuf[2]=0.65; return _syncColorBuf; }
  _syncColorBuf[0]='rgba(130,130,130,0.9)'; _syncColorBuf[1]='#888'; _syncColorBuf[2]=0.5; return _syncColorBuf;
}

function drawSyncMeter() {
  if (phase === 'startup') return;
  if (_syncHistCount < SYNC_HIST_LEN || syncRateAboveCount < SYNC_VISIBLE_THRESHOLD) return;

  const pct     = syncRateDisp;                      // 0-1（VUメーター式表示値）
  const [fillC, glowC] = _syncBarColor(pct);
  /* テキストキャッシュ: 値が変化した時のみ再生成（毎フレームのテンプレートリテラルを排除） */
  const pctRounded = Math.round(pct * 100);
  if (pctRounded !== _cachedSyncPctVal) { _cachedSyncPctVal = pctRounded; _cachedSyncPctStr = `SYNC ${pctRounded}%`; }
  if (syncChain   !== _cachedSyncChainVal) { _cachedSyncChainVal = syncChain; _cachedSyncChainStr = syncChain >= 2 ? `♪×${syncChain}` : ''; }
  const pctText   = _cachedSyncPctStr;
  const chainText = _cachedSyncChainStr;

  ctx.save();

  /* ── 横画面・縦画面共通: BETバー直下の細いストリップ ── */
  const mx = IS_PORTRAIT ? 12    : 335;          // BETバー左端に合わせる
  const mw = IS_PORTRAIT ? W-24  : 390;          // BETバー幅に合わせる
  const my = IS_PORTRAIT ? P_BAR_Y + P_BAR_H + 2 : BAR_Y + BAR_H + 2;
  const mh = IS_PORTRAIT ? 16    : 14;

  /* ゲージバー */
  const bh = IS_PORTRAIT ? 6 : 5;
  const by = my + (mh - bh) / 2;
  roundRect(mx, by, mw, bh, bh / 2);
  ctx.fillStyle = 'rgba(40,40,40,0.7)'; ctx.fill();
  if (pct > 0) {
    roundRect(mx, by, mw * pct, bh, bh / 2);
    ctx.fillStyle = fillC;
    if (pct >= 0.9) { ctx.shadowColor = glowC; ctx.shadowBlur = 8; }
    ctx.fill(); ctx.shadowBlur = 0;
  }

  /* 目盛り線（25% / 50% / 75%） */
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let _ti = 0; _ti < 3; _ti++) {
    const lx = mx + mw * (_ti === 0 ? 0.25 : _ti === 1 ? 0.5 : 0.75);
    ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(lx, by + bh); ctx.stroke();
  }

  /* テキスト（ゲージ上に重ねる） */
  ctx.font = `bold 9px monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(220,220,220,0.7)';
  ctx.fillText(pctText, mx + 6, my + mh / 2);
  if (chainText) {
    ctx.textAlign = 'right';
    ctx.fillStyle = syncChain >= BEAT_BONUS_CHAIN
      ? _RAINBOW_COLORS[_rainbowIdx()]
      : Y;
    ctx.fillText(chainText, mx + mw - 6, my + mh / 2);
  }

  ctx.restore();
}

/* ── JUST/GOOD/OK ポップアップ ── */
function drawSyncJust() {
  if (syncJustTimer <= 0 || !syncJustLabel) return;
  const t = syncJustTimer / 50; // 1→0
  /* 最初の10fでフェードイン、残りでフェードアウト */
  const fadeIn  = Math.min(1, (1 - t) * 5);
  const fadeOut = t;
  const alpha   = fadeIn * fadeOut;
  if (alpha < 0.01) return;

  /* スケール: 発動直後に1.4倍→1.0に縮む */
  const scale = 1 + 0.4 * Math.pow(t, 0.5);

  /* 色: シンクメーターと同じ _syncBarColor を使用 */
  const [col, glw] = _syncBarColor(syncJustScore);

  /* 表示位置
     横: BETバー上端(H-106=414)の少し上 → y≈394、x=中央
     縦: 結果文字と同じx中心(WXS[0]=210)、第4的下・BETバー上 → y=712 */
  const px = IS_PORTRAIT ? WXS[0] : W / 2;
  const py = IS_PORTRAIT ? P_BAR_Y - 20 : BAR_Y - 20;
  const fs = IS_PORTRAIT ? 20  : 22;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.scale(scale, scale);
  ctx.font = `bold ${fs}px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glw; ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.fillText(syncJustLabel, 0, 0);
  ctx.restore();
}

/* ── スローハンド発動中バッジ（上部中央、BGMレートに連動してフェード） ── */
function drawSlowHandBadge() {
  if (phase === 'startup') return;
  if (phase === 'tapestart') return; // ゲームオーバー復帰アニメーション中は非表示
  /* ボス関連フェーズはいずれもスローハンドと無関係にgrayRateTargetを動かす
     （予告のテープストップ、こんがりしっぱい時のテープ停止など）ため、
     まとめて対象外にする（_isBossBattlePhase()で一元化、bossOmenは個別に足す）。
     これはisSlowSpinガード（下記）に対する保険としてそのまま残す */
  if (phase === 'bossOmen' || _isBossBattlePhase()) return;
  if (isGameOver) return;
  /* バッジ表示の判定にはgrayRateCurそのものではなく_slowHandBadgeArmed（発動の瞬間だけ
     立てて、grayRateCurが1.0近くまで戻りきったら降ろすラッチ。update()側で管理）を使う。

     grayRateCurはスローハンド以外の複数の演出でも下がる。たとえばstartBGMTapeの
     フォールバック分岐（ボスBGMから通常BGMへ戻る際にgrayRateCurを0.001へリセットしてから
     1.4秒かけて1.0へ回復させる）がそれで、キング戦は_bgmIsBoss=trueでBGM再生しているため
     _kingBattleEnd→_restartToTapestart→startBGMTapeが必ずこの分岐を通る。結果、
     isSlowSpin=falseのままgrayRateCurが一瞬0付近まで落ち、idle移行後もまだ回復しきっていない
     状態が残る（tapestart→idleの遷移条件はBGM再生速度基準で、grayRateCurの回復とは別の時定数）。
     grayRateCurの下降要因を全て把握してphase除外を足していく方式は、要因が増えるたびに
     水平展開が漏れるので採らない。

     一方で「isSlowSpinがfalseなら常に非表示」にもできない。大当たり/中当たりでスローハンドを
     早期解除する際、isSlowSpin=falseにした後もgrayRateCurが1.0へ戻るまでバッジが滑らかに
     フェードアウトする、という意図的な演出（_kingReelShoot付近のコメント参照）が即座に消える
     退行になる。
     ラッチを使えば、このフェードアウト演出は維持しつつ、isSlowSpinを一度も経由しない
     grayRateCur変動ではラッチが立たずバッジは一切表示されない */
  if (!_slowHandBadgeArmed) return;
  /* grayRateCur: 1.0=通常→alpha0, 0.5=スロー→alpha1 に線形マッピング */
  const alpha = Math.max(0, Math.min(1, (1.0 - grayRateCur) * 2));
  if (alpha < 0.01) return;

  /* ポップスケール: 発動直後に大きく出てeaseOutで縮む (25f→1.0x) */
  const POP_FRAMES = 25;
  const popScale = slowHandPopTimer > 0
    ? 1 + 1.4 * Math.pow(slowHandPopTimer / POP_FRAMES, 2)
    : 1;

  _drawPillBadge('🐌  ス ロ ー ハ ン ド  発 動 中', {
    y: IS_PORTRAIT ? 10 : 8,
    alpha, scale: popScale,
    fill: 'rgba(20,10,60,0.82)',
    /* 枠だけ alpha を二重に掛ける: 全体の globalAlpha に加えて枠を先に薄くすることで、
       消え際に文字より枠が先に引くようにする */
    stroke: `rgba(160,130,255,${0.7 * alpha})`, lw: 1.2,
    color: '#e8d8ff',
  });
}

function drawBeatBonusBadge() {
  if (phase === 'startup' || phase === 'tapestart' || isGameOver) return;
  /* キングギヨウザ中はミュージックボーナス自体が無いのでバナーも出さない
     （BONUS READYのまま戦闘に入ると出っ放しになる）。予兆からエンディングまでを対象にする。
     シンクメーターの非表示条件と同じ扱い */
  if (phase === 'bossOmen' || _isBossBattlePhase()) return;
  if (syncChain < BEAT_BONUS_CHAIN) return;

  _drawPillBadge('♪BONUS READY', {
    /* BETバー直下・同期メーターと同じ高さ */
    y: IS_PORTRAIT ? P_BAR_Y + P_BAR_H + 2 : BAR_Y + BAR_H + 2,
    fs: 9, padX: 12, padY: 4, // 上部バッジの2/3サイズ（キャンバス内に収める）
    fill: 'rgba(10,20,10,0.85)',
    stroke: _RAINBOW_COLORS[_rainbowIdx()],
    color: '#fffde7',
    textDY: 1, // 9pxフォントのem中央と視覚的中央のずれを補正
  });
}

/* ── フィーバーバナー共通描画
   reason: null='start'（開始）/ 'miss'（FEVER OVER）/ 'complete'（FEVER COMPLETE）
   フェードイン20f、フェードアウト最後30f（総時間 FEVER_BANNER_FRAMES 基準） */
function drawFeverBanner(timer, reason) {
  const elapsed = FEVER_BANNER_FRAMES - timer; // 0 → FEVER_BANNER_FRAMES
  const alpha = elapsed < 20 ? elapsed / 20
              : timer   < 30 ? timer   / 30
              : 1;
  if (alpha < 0.02) return;
  const scale   = 0.6 + 0.4 * Math.min(1, elapsed / 20);
  const isStart = reason === null;
  const isMiss  = reason === 'miss';

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2);
  ctx.scale(scale, scale);

  /* バナー寸法 */
  const fs1 = IS_PORTRAIT ? 32 : 42;
  const fs2 = IS_PORTRAIT ? 15 : 18;
  const bh  = fs1 + fs2 + (IS_PORTRAIT ? 40 : 52);
  const bw  = W * 0.88;
  const br  = bh / 2;

  /* バナー背景（角丸矩形） */
  ctx.beginPath();
  ctx.moveTo(-bw/2 + br, -bh/2);
  ctx.arcTo( bw/2, -bh/2,  bw/2,  bh/2, br);
  ctx.arcTo( bw/2,  bh/2, -bw/2 + br, bh/2, br);
  ctx.arcTo(-bw/2,  bh/2, -bw/2, -bh/2, br);
  ctx.arcTo(-bw/2, -bh/2,  bw/2, -bh/2, br);
  ctx.closePath();
  ctx.fillStyle   = isStart ? 'rgba(60,40,0,0.92)' : isMiss ? 'rgba(60,0,0,0.92)' : 'rgba(20,30,60,0.92)';
  ctx.fill();
  ctx.strokeStyle = isStart ? '#ffcc00' : isMiss ? '#ff6060' : '#ffe080';
  ctx.lineWidth   = IS_PORTRAIT ? 2 : 3;
  ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (isStart) {
    /* FEVER START: ドロップシャドウ＋ゴールド文字 */
    ctx.font = `bold ${fs1}px ${FONT_MIN}`;
    ctx.fillStyle = '#000'; ctx.shadowColor = 'transparent';
    ctx.fillText('FEVER START!', 2, -fs2 / 2 - 4 + 2);
    ctx.fillStyle = '#ffdd00'; ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
    ctx.fillText('FEVER START!', 0, -fs2 / 2 - 4);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    ctx.font = `${fs2}px ${FONT_MIN}`;
    ctx.fillStyle = '#fff8d0';
    ctx.fillText('連チャンスタート！！', 0, fs1 / 2 + 4);
  } else {
    /* FEVER OVER / FEVER COMPLETE: 4隅アウトライン＋カラー文字 */
    const line1  = isMiss ? 'FEVER OVER…'     : 'FEVER COMPLETE!';
    const col1   = isMiss ? '#ff7070'          : '#ffe870';
    const shade1 = isMiss ? 'rgba(120,0,0,0.8)' : 'rgba(0,0,80,0.8)';
    const line1y = -bh / 2 + fs1 / 2 + (IS_PORTRAIT ? 14 : 18);
    ctx.font = `bold ${fs1}px ${FONT_MIN}`;
    ctx.shadowColor = 'transparent';
    for (const [ox, oy] of [[-2,-2],[2,-2],[-2,2],[2,2]]) {
      ctx.fillStyle = shade1;
      ctx.fillText(line1, ox, line1y + oy);
    }
    ctx.fillStyle = col1;
    ctx.fillText(line1, 0, line1y);

    const line2  = isMiss ? 'ミスでフィーバー終了' : 'フル連チャン達成！！';
    const line2y = bh / 2 - fs2 / 2 - (IS_PORTRAIT ? 12 : 16);
    ctx.font = `bold ${fs2}px ${FONT_MIN}`;
    ctx.fillStyle = isMiss ? '#ffaaaa' : '#ffffc8';
    ctx.fillText(line2, 0, line2y);
  }

  ctx.restore();
}

/* ── フィーバーバッジ（スローハンドバッジの下） ── */
function drawFeverBadge() {
  if (phase === 'startup') return;
  if (phase === 'tapestart') return;
  if (isGameOver) return;
  if (!isFever) return;

  _drawPillBadge('🔥  F E V E R  残り ' + feverTriesLeft + ' 回', {
    /* スローハンドバッジと同じ上端位置（フィーバー中はスローハンド非発動） */
    y: IS_PORTRAIT ? 10 : 8,
    alpha: 0.85 + 0.15 * Math.sin(performance.now() / 120),
    fill: 'rgba(80,20,0,0.88)',
    stroke: 'rgba(255,160,0,0.85)',
    color: '#ffe0a0',
  });
}

/* ── 下部中央の呼吸ピルバッジ（「次へ進める」系の入力待ちを共通デザインで示す）。
   「タップで」等の特定デバイス限定の文言は画面に出さないこと。通常モードのCONTINUEバッジと
   同じ見た目・同じ「クリック/タップ/キーボードいずれでも反応する」操作系（handleGameClick）
   に統一する。
   表示条件・位置（下端からのオフセット）は呼び出し側が制御する */
/* pulse: 0〜1を渡すとゆっくりした呼吸の代わりにビートで脈打つ（キング戦の「発射」用）。
   省略時は呼吸アニメーション */
function _drawBottomPillBadge(text, bottomOffset = IS_PORTRAIT ? 12 : 10, pulse = null) {
  _drawPillBadge(text, {
    /* 下端基準なので、高さが決まってから上端を求める */
    y: bh => H - bh - bottomOffset,
    scale: pulse !== null ? 1 + 0.13 * pulse
                          : 1 + 0.04 * Math.sin(performance.now() / 500),
    fill: 'rgba(20,20,40,0.82)',
    stroke: 'rgba(180,180,255,0.7)',
    color: '#d8d8ff',
  });
}

/* ── CONTINUEバッジ（done phase・canRestart時に下部中央表示） ── */
function drawContinueBadge() {
  if (phase !== 'done' || !canRestart || isGameOver) return;
  if (_continueShowDelay < 40) return; // カウントは update() 側（60fps固定）で行う
  _drawBottomPillBadge('CONTINUE');
}

/* ── 実績バナー（右下にフェードイン/アウト） ── */
function drawAchBanner() {
  if (!achBannerCurrent || achBannerTimer <= 0) return;
  const ach = ACHIEVEMENTS.find(a => a.id === achBannerCurrent);
  if (!ach) return;
  const t = achBannerTimer / 200; // 1→0
  const alpha = t < 0.12 ? t/0.12 : t > 0.85 ? (1-t)/0.15 : 1;
  /* 縦画面: BAR_Y は横画面用定数のため P_BAR_Y 基準・中央寄せに切り替える

}

/* ── 実績一覧オーバーレイ ──
   縦画面: 1カラム・行高44px・クリップ表示（全18件収まる）
   PC版 : 2カラム                                              */

/* 実績パネルの位置・寸法。IS_PORTRAIT/W/Hのみに依存し実行中不変のため、
   関数化しておく（座標式の重複を防ぐ） */
function _achPanelRect() {
  /* 縦画面: アイコン右端(46) + 12px = 58 → パネル左端
             右ボタン左端(374) - 12px = 362 → パネル右端
             pw = 362 - 58 = 304                                */
  return {
    px: IS_PORTRAIT ? 58        : 60,
    py: IS_PORTRAIT ? 16        : 30,
    pw: IS_PORTRAIT ? 304       : W - 120,
    ph: IS_PORTRAIT ? H - 32    : H - 60,
  };
}

function drawAchOverlay() {
  if (!showAchievements) return;

  /* ── パネルサイズをレイアウトに合わせて決定 ── */
  const { px, py, pw, ph } = _achPanelRect();

  ctx.save();
  /* 暗幕 */
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);
  /* パネル */
  roundRect(px, py, pw, ph, 12);
  ctx.fillStyle = 'rgba(8,40,15,0.97)'; ctx.fill();
  ctx.strokeStyle = Y; ctx.lineWidth = 2; ctx.stroke();

  /* タイトル */
  const titleH = IS_PORTRAIT ? 38 : 48;
  ctx.font = `bold ${IS_PORTRAIT ? 18 : 24}px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = Y;
  ctx.fillText('🏆 実績一覧', px + pw/2, py + titleH/2);
  /* 区切り線 */
  ctx.beginPath();
  ctx.moveTo(px+16, py+titleH); ctx.lineTo(px+pw-16, py+titleH);
  ctx.strokeStyle = 'rgba(245,208,32,0.3)'; ctx.lineWidth=1; ctx.stroke();

  /* ── レイアウト計算 ── */
  const listY  = py + titleH + 4;
  const footH  = 22;
  const listH  = ph - titleH - 4 - footH;
  const COL    = IS_PORTRAIT ? 1 : 2;
  const ROWS   = Math.ceil(ACHIEVEMENTS.length / COL);
  const rowH   = IS_PORTRAIT ? Math.floor(listH / ACHIEVEMENTS.length)
                              : Math.floor(listH / ROWS);
  const colW   = Math.floor((pw - 8) / COL);

  /* PC版: 中央縦区切り線 */
  if (!IS_PORTRAIT) {
    ctx.beginPath();
    ctx.moveTo(px + 4 + colW, listY); ctx.lineTo(px + 4 + colW, listY + rowH * ROWS);
    ctx.strokeStyle = 'rgba(245,208,32,0.15)'; ctx.lineWidth=1; ctx.stroke();
  }

  /* クリップ（リスト範囲内のみ描画） */
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, listY, pw, listH);
  ctx.clip();

  /* リスト */
  ACHIEVEMENTS.forEach((ach, i) => {
    const col = IS_PORTRAIT ? 0 : Math.floor(i / ROWS);
    const row = IS_PORTRAIT ? i : i % ROWS;
    const lx  = px + 4 + col * colW;
    const ry  = listY + row * rowH;
    const mid = ry + rowH / 2;
    const unlocked = !!unlockedAch[ach.id];

    /* 交互背景 */
    if (row % 2 === 0) {
      roundRect(lx+1, ry+1, colW-2, rowH-2, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
    }

    ctx.globalAlpha = unlocked ? 1 : 0.35;

    /* ステータス丸 */
    const circR = IS_PORTRAIT ? 8 : 9;
    const circX = lx + (IS_PORTRAIT ? 16 : 18);
    ctx.beginPath();
    ctx.arc(circX, mid, circR, 0, Math.PI*2);
    ctx.fillStyle   = unlocked ? '#2ecc40' : 'rgba(120,120,120,0.5)'; ctx.fill();
    ctx.strokeStyle = unlocked ? '#27ae35' : 'rgba(160,160,160,0.4)';
    ctx.lineWidth = 1.4; ctx.stroke();
    if (unlocked) {
      ctx.beginPath();
      ctx.moveTo(circX-4, mid); ctx.lineTo(circX-1, mid+4); ctx.lineTo(circX+5, mid-4);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(circX, mid-3); ctx.lineTo(circX, mid+3);
      ctx.strokeStyle='rgba(200,200,200,0.7)'; ctx.lineWidth=1.8; ctx.stroke();
    }

    /* アイコン */
    const iconX  = lx + (IS_PORTRAIT ? 32 : 34);
    const textX  = lx + (IS_PORTRAIT ? 52 : 56);
    const nameFs = IS_PORTRAIT ? 13 : 13;
    const descFs = IS_PORTRAIT ? 11 : 11;
    const nameOY = IS_PORTRAIT ? -7 : -7;
    const descOY = IS_PORTRAIT ?  7 :  7;

    ctx.fillStyle='#ffffff';
    ctx.font=`${IS_PORTRAIT ? 15 : 16}px serif`;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(ach.icon, iconX, mid);

    /* 実績名 */
    ctx.font=`bold ${nameFs}px ${FONT_MIN}`;
    ctx.fillStyle = unlocked ? Y : 'rgba(245,208,32,0.5)';
    ctx.fillText(ach.name, textX, mid + nameOY);

    /* 説明文 */
    ctx.font=`${descFs}px ${FONT_MIN}`;
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.28)';
    ctx.fillText(ach.desc, textX, mid + descOY);

    ctx.globalAlpha = 1;
  });

  ctx.restore(); // クリップ解除

  /* 解除数 */
  const cnt = ACHIEVEMENTS.filter(a => !!unlockedAch[a.id]).length;
  ctx.font = `${IS_PORTRAIT ? 11 : 11}px ${FONT_MIN}`;
  ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(245,208,32,0.45)';
  ctx.fillText(`${cnt} / ${ACHIEVEMENTS.length} 解除済み`, px+pw-12, py+ph-6);

  ctx.restore();
}

/* ════════════════ Startup Screen ════════════════ */

  const { x:bx, y:by, w:bw, h:bh } = STARTUP_BTN;

/* ════════════════ Loop / Input ════════════════ */
/* ページロード直後 500ms は START を受け付けない。
   ロード直後の取りこぼしタッチ（前のページで始まったタッチが新しいページへ引き継がれて
   発火し、STARTUP_BTN に重なる等）で意図せず initGame() が呼ばれるのを防ぐガード */
const _startupGuardUntil = Date.now() + 500;

/* startup フェーズ: lsLoad/lsLoadAch だけ行い、画面は startup のままにする */
lsCheckSchema(); // スキーマ不一致なら全データクリア（lsLoad/lsLoadAch の前に必ず実行）
lsLoad();        // bet もここで復元される
lsLoadAch();
lsLoadStats();
if (!BET_OPTIONS.includes(bet)) bet = 1; // 未保存時のみデフォルト1
coinsDisp = coins; _lastCoinsDispCached = -1; // startup時はスナップ
isGameOver = false;
phase = 'startup';
wheels = WXS.map((x, i) => createWheel(x, WYS[i])); // ホイールだけ初期化（背景描画用）
particles = _releaseAll(particles); // 起動時は空だが、配列を捨てる場所は例外なくここを通す

let _rafId;
/* フレーム時間計測（ポーズ画面診断用） */
const _FRAME_BUF_SIZE = 120;
const _frameTimes = new Float32Array(_FRAME_BUF_SIZE);     // update()間隔 ms
const _frameWorkTimes = new Float32Array(_FRAME_BUF_SIZE); // update()+draw()処理時間 ms
const _TARGET_FRAME_MS = 1000 / 60; // ≈16.667ms: update()の1tick
/* tickを起こす閾値は目標frame時間より少しだけ低くする。
   60Hz端末のrAFは毎回きっちり16.667msでは来ず、16.6msのように僅かに下回る回が混ざる。
   閾値が16.667msちょうどだと、その回は積算が届かずtickが飛び、次のフレームでまとめて1tickに
   なる＝ゲームの状態が33ms凍結してから動く（?perfでこちらの処理が何も走っていない＝tagsが[-]
   のにgapが33msという記録が並ぶのはこれ）。
   1.5msの余裕を持たせると、9%まで短いフレームでも取りこぼさずtickできる。
   長期的なズレは積算に残るので、実際に60Hzより遅い端末では間引かれる */
const _TICK_THRESHOLD_MS = _TARGET_FRAME_MS - 1.5;
/* 1フレームで走らせる最大tick数（遅延フレームの取り返し上限）。dtを50msに
   丸めているので3で足りる（50/16.7≒3）。詳細は_gameLoop内のコメント参照 */
const _MAX_CATCHUP_TICKS = 3;
let _frameTimesIdx = 0, _rafLastT = 0, _updateLastT = 0, _updateAccum = 0;
/* rAFが実際に何Hzで呼ばれているかの推定（1秒ごとに更新）。追加フレームで描くかどうかの
   判断に使う。?perfのfps表示とは別に、常時この推定を持つ */
let _rafHz = 0, _rafHzCount = 0, _rafHzT = 0;
const _RAF_HZ_HIGH = 70; // これを超えていれば高リフレッシュレート端末とみなす
/* 直前のtickのフェーズ。phase はここより後で宣言されるので null 始まりにする */
let _prevPhase = null;
/* フェーズをまたぐ横断的な処理の置き場。フェーズが変わった最初のtickで1度だけ呼ばれる。

   **全フェーズで起きてほしいことは、フェーズ側へ書かずに必ずここへ足すこと。**
   フェーズごとの都合に結び付けると「そのフェーズだけ黙って死ぬ」形で壊れる。実際に2つ
   踏んでいる:
   ・実解像度の自動制御が通常モードのトライ開始（init）からしか適用されず、init を通らない
     キング戦・真エンディングのロール・サウンドテスト・ドラムパッドでは、取りこぼしを測って
     「下げる」と決めたまま最高段階のまま走り続けていた
   ・音声の時計が死んだときの立て直しが visibilitychange からしか武装されず、可視性の変化を
     伴わない中断（着信・Siri・他アプリの発音・Bluetoothの経路切り替え）を1つも拾えなかった
   どちらも「検出はできているのに、それを起こす経路が1つのフェーズの都合に結び付いていた」
   という同じ形。個々のフェーズ開始関数へ書き足す形にすると、フェーズを足すたびに同じ抜けが
   再発する。

   フェーズの切り替わりは画面が丸ごと変わる瞬間なので、1フレームぶんの間が出る処理
   （実解像度の切り替え＝canvasバッキングストアの張り直し）を置いても体感に出ない。
   直前のフェーズが要る処理を足すときは、引数で _prevPhase を渡す形にすること */
function _onPhaseChanged() {
  _rsApplyPending(); // 実解像度の段階切り替え（_rsApplyPending参照）
}

function _gameLoop(t) {
  _rafId = requestAnimationFrame(_gameLoop);
  _rafHzCount++;
  if (_rafHzT === 0) _rafHzT = t;
  else if (t - _rafHzT >= 1000) { _rafHz = _rafHzCount * 1000 / (t - _rafHzT); _rafHzCount = 0; _rafHzT = t; }
  if (PERF_ON) _perfCountFrame(t);
  _updateCtxStall(); // AudioContextが実際に動いているかの実測（_updateCtxStall参照）
  /* 時計が死んだ（または割り込まれた）と分かった時点で「次の操作で立て直す」印を付ける。

     ここで resume() や再作成を直接呼んではいけない。iOSでは立て直しがユーザージェスチャーの
     中でしか効かないうえ、ジェスチャー外の resume() は interrupted を suspended に変えて
     しまい、_resumeAudioCtx の再作成分岐が動かなくなる。印だけ付け、実際の立て直しは
     次のタップで _recoverAudioIfNeeded が行う。

     visibilitychange 側だけでは足りない。あちらが印を付けるのは「自動PAUSEしない
     フェーズで背面に回ったとき」だけで、着信・Siri・アラーム・他アプリの発音・Bluetoothの
     経路切り替えのように**画面の可視性が変わらないまま音声が死ぬ**経路を1つも拾わない。
     その場合ゲームは画面上は正常に動き続け、音だけが消え、タップしても
     _recoverAudioIfNeeded が先頭で戻るため、PAUSE往復・MUTE往復・リロード以外に
     戻る手段が無くなる。
     毎タップ走る _unlockAudio() は resume() を呼ぶだけなので、state が running のまま
     時計が死んでいる Context を作り直さない＝この経路の代わりにはならない */
  if (_ctxLooksStalled() || (audioCtx && audioCtx.state === 'interrupted')) _audioNeedsRecover = true;
  /* アキュムレーター方式: 任意のリフレッシュレートで update() を正確に60fps維持
     dtを50msに丸める（タブ非表示復帰後の異常な追いつきを防ぐ） */
  const dt = _rafLastT > 0 ? Math.min(t - _rafLastT, 50) : 0;
  _rafLastT = t;
  _updateAccum += dt;
  if (_updateAccum >= _TICK_THRESHOLD_MS) {
    /* 60fps tick: update() → draw() の順でA/V同期を保つ */
    if (_updateLastT > 0) {
      const _gap = t - _updateLastT;
      _frameTimes[_frameTimesIdx % _FRAME_BUF_SIZE] = _gap;
      _frameTimesIdx++;
      /* 実解像度の自動制御（_RS_* 参照）。判定材料はこのtick間隔そのもの */
      if (_RS_AUTO) {
        _rsWin++;
        if (_gap > _RS_LATE_MS) _rsLate++;
        if (_rsWin >= _RS_WINDOW) _rsEvaluate();
      }
      if (PERF_ON && _gap > _PERF_SPIKE_MS) _perfLogSpike(_gap);
    }
    _updateLastT = t;

  onShoot(inputPerfMs); // idle / reach
}

/* チート操作の入口は?cheatpanelのタップ式パネル1つだけ（CHEAT_PANEL_BTNS参照）。
   キーボードのチートキーは持たない: iPhone+外付けキーボードでは keydown がそもそも届かず
   実機で使えないうえ、同じ機能に2つの入口があると片方だけ直す事故が起きる。
   キーボードで受けるのはスペース（発射・段送り）と左右矢印（BET変更）＝ゲーム本来の操作のみ */
function cheatShoot(char) {
  if (phase!=='idle'||curIdx>=4) return;
  const w = wheels[curIdx];
  const s = w.segs.find(seg => seg.char === char);
  if (!s) return;
  /* ポインタ位置にセグメント中央が来るよう回転を強制 */
  w.rot = (IS_PORTRAIT ? 0 : -Math.PI/2) - s.start - s.span/2;
  onShoot();
}

document.addEventListener('keydown', e=>{
  if (phase === 'startup') {
    if (e.code === 'Space') { e.preventDefault(); if (!audioCtx) getAudioCtx(); initGame(); }
    return;
  }
  if (isPaused) return;
  if (showAchievements) {
    e.preventDefault(); showAchievements = false; return;
  }
  if (e.code==='Space') {
    e.preventDefault();
    handleGameClick(e.timeStamp);
    return;
  }
  /* カーソル左右でBET変更 */
  if ((e.code==='ArrowLeft'||e.code==='ArrowRight') && _betControlsEnabled()) {
    e.preventDefault();
    changeBet(e.code==='ArrowLeft' ? -1 : +1);
    return;
  }
  /* チートキーはここに足さない（入口は?cheatpanelのみ。理由はcheatShoot手前のコメント参照） */
});

/* ── ポインタ入力のボタン当たり判定（touchstart / mousedown 共通） ──
   はしごを2つに割っているのは、タッチだけが途中で音声アンロックを挟むため。
   **判定の順序には意味がある**（先に見たボタンが勝つ）ので、並べ替えないこと。
   プラットフォーム固有の入口（_unlockAudio・_ensureCanvasFocus・STARTをtouchendへ
   回す扱い）は共通化の対象外にしている。iOSのオーディオ有効化仕様に合わせた
   意図的な設計であり、揃えてはいけない（README.md「iOS Safari Web Audio 実装ノート」参照） */

/* 全フェーズで最初に見るボタン（チートパネル・全画面）。処理したらtrueを返す */
function _handleTopButtons(x, y) {
  if (CHEAT_PANEL_ON) {
    for (let i = 0; i < CHEAT_PANEL_BTNS.length; i++) {
      if (hitTest(_cheatPanelRect(i), x, y)) { _runCheatPanelAction(CHEAT_PANEL_BTNS[i].id); return true; }
    }
  }
  if (FS_SUPPORTED && hitTest(FS_BTN_RECT, x, y)) { toggleFullscreen(); return true; }
  return false;
}

/* 実績・ミュート・ポーズ・BETのボタン群と、どれにも当たらなければゲーム入力へ。
   isTouch: STARTと真エンディング再生をtouchendへ回すか（iOS都合。_onTouchStart参照） */
function _handleGameButtons(x, y, inputPerfMs, isTouch) {
  if (phase === 'soundTest') { _soundTestClick(x, y); return; }
  if (phase === 'drumPad')   { _drumPadTouch(x, y, inputPerfMs); return; }
  if (phase === 'startup') {
    if (hitTest(ACH_TROPHY, x, y)) { showAchievements = !showAchievements; return; }
    if (trueEndingSeen && hitTest(TRUE_ENDING_BTN, x, y)) {
      /* タッチはresume()完了を待ってtouchendで再生開始する */
      if (isTouch) _pendingTrueEndingReplay = true;
      else { if (!audioCtx) getAudioCtx(); _startTrueEnding(true); }
      return;
    }
    /* サウンドテストも同じ理由でtouchendへ回す。入場時にgetAudioCtx()まで済ませて
       おけば、モード内の最初の再生タップで確実に音が出る */
    if (_soundTestUnlocked() && hitTest(SOUND_TEST_BTN, x, y)) {
      if (isTouch) _pendingSoundTest = true;
      else _startSoundTest();
      return;
    }
    if (hitTest(MUTE_BTN, x, y)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
    if (showAchievements) { showAchievements = false; return; }
    if (hitTest(STARTUP_BTN, x, y) && Date.now() >= _startupGuardUntil) {
      /* タッチは touchstart で resume()+サイレントバッファだけ行い、initGame() は
         touchend で呼ぶ（指を離す瞬間も iOS のユーザージェスチャーとして認定される
         ため、resume() が確実に完了した状態で playStartJingle() を実行できる） */
      if (isTouch) _pendingInitGame = true;
      else { if (!audioCtx) getAudioCtx(); initGame(); }
      return;
    }
    return;
  }
  if (hitTest(PAUSE_BTN, x, y)) { togglePause(); return; }
  if (isPaused) {
    /* PAUSE中はゲームループが止まっているため、操作後に draw() を明示的に呼ぶ */
    if (_achBtnEnabled() && hitTest(ACH_TROPHY, x, y)) { showAchievements = !showAchievements; draw(); return; }
    if (showAchievements) { showAchievements = false; draw(); return; }
    if (hitTest(MUTE_BTN, x, y)) { if (!audioCtx) getAudioCtx(); toggleMute(); draw(); return; }
    return;
  }
  /* 実績オーバーレイ中はどこを触っても閉じる */
  if (showAchievements) { showAchievements = false; return; }
  if (_achBtnEnabled() && hitTest(ACH_TROPHY, x, y)) { showAchievements = true; return; }
  if (hitTest(MUTE_BTN, x, y)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
  /* ベット◀▶（縦画面 or PCボトムバー。有効判定は_betControlsEnabledに集約済み） */
  if (_betControlsEnabled()) {
    const decBtn = IS_PORTRAIT ? P_BET_DEC_BTN : BET_DEC_BTN;
    const incBtn = IS_PORTRAIT ? P_BET_INC_BTN : BET_INC_BTN;
    if (decBtn && hitTest(decBtn, x, y)) { changeBet(-1); return; }
    if (incBtn && hitTest(incBtn, x, y)) { changeBet(+1); return; }
  }
  handleGameClick(inputPerfMs);
}

canvas.addEventListener('mousedown', e=>{
  if (e.button !== 0) return;
  _ensureCanvasFocus();
  /* 入力物理発生時刻（performance.now() 基準 ms。ハンドラ到達前の遅延を補正） */
  const inputPerfMs = e.timeStamp;
  /* _canvasRect キャッシュを使用（getBoundingClientRect() 強制レイアウトを排除） */
  const cx = (e.clientX - _canvasRect.left) * (W / _canvasRect.width);
  const cy = (e.clientY - _canvasRect.top)  * (H / _canvasRect.height);
  _markPress(cx, cy); // 押した点を控える（_drawPressFlash が各ボタンで拾う）
  _recoverAudioIfNeeded(); // 背面から戻った直後なら、ここで音声を立て直す
  if (_handleTopButtons(cx, cy)) return;
  _handleGameButtons(cx, cy, inputPerfMs, false);
});

/* タッチ操作対応（ページ内どこでもタップで反応） */
/* ?perf 計測用の薄いラッパー（handleGameClickと同じ形）。実機のスパイク記録で
   「tapは0msなのにタップしたフレームだけ30〜61ms止まる」という結果が出たため、
   handleGameClickより手前で走る処理（音声アンロック・フォーカス確保・当たり判定）も
   計測範囲に入れる */
document.addEventListener('touchstart', e => {
  const _t0 = PERF_ON ? performance.now() : 0;
  try {
    _onTouchStart(e);
  } finally {
    if (PERF_ON) _perfMark('touch', _t0);
    /* AVAudioSessionの昇格は入力処理を終えてから行う（_elevateAudioSession参照）。
       finallyに置くのは、ボタン類の早期returnも含めて「どのタップでも必ず試みる」を
       保証するため。昇格できないまま諦めると消音モードで無音になる */
    const _t1 = PERF_ON ? performance.now() : 0;
    _elevateAudioSession();
    if (PERF_ON) _perfMark('elev', _t1);
  }
}, { passive: false });
function _onTouchStart(e) {
  e.preventDefault();
  /* 入力物理発生時刻（performance.now() 基準 ms） */
  const inputPerfMs = e.timeStamp;
  const pt = touchToCanvas(e.touches[0]);
  _markPressTouches(e); // 押した点を控える（_drawPressFlash が各ボタンで拾う）
  _recoverAudioIfNeeded(); // 背面から戻った直後なら、ここで音声を立て直す
  if (_handleTopButtons(pt.x, pt.y)) return;
  /* すべてのタッチで AudioContext をアンロックする。
     iOS Safari: touchstart はユーザーアクティベーションとして認定される。
     resume() + masterGain 経由サイレントバッファで AVAudioSession を開通させる。
     START ボタンの音声スケジューリング（initGame）は touchend で行う。
     マウス側にこの呼び出しが無いのは意図的（iOSのオーディオ有効化仕様への対応） */
  _unlockAudio();
  _ensureCanvasFocus(); // 外付けキーボードのkeydownをページへ配送させるためのフォーカス確保
  /* ドラムパッドだけは指の数だけ処理する。ゲーム本編は1点しか見ない作りで
     （touches[0]）、そこへ手を入れると入力の意味が変わってしまうため、
     このモード専用の分岐にする。2本指・3本指の同時打ちができないと
     ドラムパッドとして成立しない */
  if (phase === 'drumPad') {
    for (const tc of e.changedTouches) {
      const q = touchToCanvas(tc);
      _drumPadTouch(q.x, q.y, inputPerfMs);
    }
    return;
  }
  _handleGameButtons(pt.x, pt.y, inputPerfMs, true);
}

/* touchend ハンドラ: START ボタンのゲーム開始処理
   touchstart で resume() + サイレントバッファを発行し、
   指を離す touchend で initGame() を呼ぶことで、iOS Safari が
   AudioContext を確実に running にしてからジングルを開始できる。
   touchend も iOS ユーザーアクティベーションとして認定される。 */
/* 指やボタンを離したらTEMPOの長押しを止める。ドラムパッド専用の仕組みなので、
   ここでは_dpHoldEnd（中でnullチェック）を呼ぶだけにして他の経路に触らない */
document.addEventListener('touchend',    _dpHoldEnd, { passive: true });
document.addEventListener('touchcancel', _dpHoldEnd, { passive: true });
window.addEventListener('mouseup',       _dpHoldEnd, { passive: true });
window.addEventListener('blur',          _dpHoldEnd);

document.addEventListener('touchend', e => {
  if (_pendingTrueEndingReplay) {
    _pendingTrueEndingReplay = false;
    e.preventDefault();
    if (!audioCtx) getAudioCtx();
    _startTrueEnding(true);
    return;
  }
  if (_pendingSoundTest) {
    _pendingSoundTest = false;
    e.preventDefault();
    _startSoundTest();
    return;
  }
  if (!_pendingInitGame) return;
  _pendingInitGame = false;
  e.preventDefault();
  initGame();
}, { passive: false });

/* ════════════════ キャンバス初期化 ════════════════ */

/* ── キャンバスをビューポートに合わせてスケール ── */
function fitCanvas() {
  /* visualViewport はブラウザUIを除いた実際の表示領域を返す
     iOS Safari のアドレスバー・タブバーがある場合も正確なサイズが得られる */
  const vv     = window.visualViewport;
  const vpW    = vv ? vv.width  : document.documentElement.clientWidth;
  const vpH    = vv ? vv.height : document.documentElement.clientHeight;

  /* セーフエリア量をCSSカスタムプロパティから取得してスケール計算に反映 */
  const _cs  = getComputedStyle(document.documentElement);
  const _saT = parseFloat(_cs.getPropertyValue('--sat')) || 0;
  const _saR = parseFloat(_cs.getPropertyValue('--sar')) || 0;
  const _saB = parseFloat(_cs.getPropertyValue('--sab')) || 0;
  const _saL = parseFloat(_cs.getPropertyValue('--sal')) || 0;

  const h1El   = document.querySelector('h1');
  const titleH = (h1El && getComputedStyle(h1El).display !== 'none')
    ? h1El.getBoundingClientRect().height + 6 : 0;
  const MARGIN = 8;
  const scale  = Math.min(
    (vpW - _saL - _saR - MARGIN * 2) / W,
    (vpH - _saT - _saB - MARGIN * 2 - titleH) / H
  );
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  /* 背景グラジェントを再生成（canvasサイズ変化時のみ） */
  bgGradient = ctx.createLinearGradient(0, 0, 0, H);
  bgGradient.addColorStop(0, '#145c24');
  bgGradient.addColorStop(0.5, '#0f5020');
  bgGradient.addColorStop(1, '#0a3d18');

  /* 静的レイヤー（雲・獅子）を OffscreenCanvas に事前描画
     毎フレームの Canvas パス命令群 → drawImage() 1回に圧縮 */
  _prebuildStaticLayers();
  /* BET ラベル幅を計測してキャッシュ（フォント・テキスト不変なので1回だけ） */
  _initBetLabelWidth();

  /* _canvasRect キャッシュを更新: 入力ハンドラ内での getBoundingClientRect() 強制レイアウトを排除 */
  requestAnimationFrame(() => { _canvasRect = canvas.getBoundingClientRect(); });
}
window.addEventListener('resize', fitCanvas);

/* ── 画面回転 ──
   回転時はリロードせず、PAUSEにして続きから再開できるようにする。
   レイアウトは回転前の論理サイズ（W×H）のまま維持し、fitCanvas()がCSSで新しいビューポートに
   収まるよう縮小する（＝向きに合わせた再レイアウトは行わない）。レイアウト定数
   （IS_PORTRAIT・W・H とそこから導かれる約20個のconst）は起動時に焼き込まれる設計であり、
   縦横でレイアウトを組み替えるには進行中オブジェクトの絶対座標の変換が必要になるため、
   ここでは行わない。
   通常モード・キングギヨウザモードのどちらでも同じ扱いになる（togglePauseはボス系フェーズに
   対応済み）。
   タイトル画面は進行中の状態が無く、togglePauseもstartupでは早期returnするため、PAUSEには
   せず表示の再フィットだけ行う */
let _orientationFitTimer = null;
function _onOrientationChange() {
  /* 既にPAUSE中なら二重にトグルして解除してしまわないよう条件付きで呼ぶ
     （visibilitychangeハンドラと同じ書き方）。解除手段の無いフェーズは対象外 */
  if (!_autoPauseExempt() && !isPaused) togglePause();
  /* iOSはorientationchangeの時点でvisualViewportがまだ旧値を返すことがあり、
     続けてresizeが複数回発火する。まとめて1回に束ねてから再フィットする */
  if (_orientationFitTimer) clearTimeout(_orientationFitTimer);
  _orientationFitTimer = setTimeout(() => {
    _orientationFitTimer = null;
    fitCanvas();
    /* PAUSE中はゲームループ(rAF)が止まっているため、明示的に描き直さないと
       回転後の画面（PAUSEオーバーレイ含む）が更新されない */
    draw();
  }, 300);
}
window.addEventListener('orientationchange', _onOrientationChange);
/* visualViewport のリサイズ（アドレスバー出現・消滅）にも追従 */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitCanvas);
}
fitCanvas();
_ensureCanvasFocus(); // 初回ロード時点でも試みる（iOSはジェスチャー無しでは定着しないためtouchstart側が本命）

/* ── 全画面切替（Fullscreen API 対応環境のみ有効） ── */
function toggleFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document).catch(()=>{});
  }
}

if (FS_SUPPORTED) {
  function onFsChange() {
    _isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    setTimeout(fitCanvas, 150);
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
}
</script>
</body>
