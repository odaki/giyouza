}
/* 録音中の周の切り替わりで、入力があった周を採用する */
function _dpLoopPromote(L) {
  if (L.passDirty && L.pass && L.pass.length) { L.take = L.pass; L.takeLen = _dpBeatsPerLoop(L); }
  /* 打ち直しにならなかった周に境目の音だけが入っていた場合、それは
     いま作っているパターンの一部（頭を先取り／少し遅れて叩いたぶん）なので
     takeへ足す。捨てると「4発打ったのに3発しか残らない」ことになる */
  else if (L.take && L.pass && L.pass.length) L.take = L.take.concat(L.pass);
  /* 周の頭を先取りして叩いたぶんを、新しい周の先頭として引き継ぐ。
     takeがある間は境目の音だけで打ち直しとみなさない（窓の外を叩いて初めて
     成立する）。takeがまだ無いなら、その1発も打ち込みとして扱う */
  L.pass = L.pending.length ? L.pending : [];
  L.passDirty = !L.take && L.pass.length > 0;
  L.pending = [];
}

/* この周ぶんの発音を「スロット番号 → 鳴らすパッド」の形に組む。スロット昇順。
   ここで小節数ぶんの繰り返しとクオンタイズを済ませ、スケジューラ側は整数だけを扱う。

   小節数を変えても打ち込みには触れない。本来の長さ(len)より短くしたときははみ出したぶんを
   鳴らさず、長くしたときは本来の長さぶんを繰り返して埋める（2小節のパターンを4小節にすると
   2回鳴る）。クオンタイズは繰り返しを足す**前**に、パターン自身の長さで掛ける
   （_dpQuantBeat参照。後から掛けると小節数によって末尾の音の行き先が変わる） */
function _dpLoopSteps(L, bpNow) {
  const steps = [];
  for (const [evs, len] of _dpLoopSets(L, bpNow)) {
    if (!(len > 0)) continue;
    for (const ev of evs) {
      const q = _dpQuantBeat(L, ev.beat, len);
      for (let off = 0; ev.beat + off < bpNow; off += len) {
        if (q + off >= bpNow) continue; // 丸めで後ろへ出たぶんはこの周には無い
        steps.push({ slot: _dpSlotOf(q + off), i: ev.i, click: 0 });
      }
    }
  }
  if (L.click) {
    for (let b = 0; b < bpNow; b++) {
      steps.push({ slot: _dpSlotOf(b), i: -1, click: b % DP_BEATS_PER_BAR === 0 ? 2 : 1 });
    }
  }
  steps.sort((a, b) => a.slot - b.slot);
  return steps;
}

/* パターン再生。**予約済み位置は整数スロットで持つ**（L.schedSlot）。
   先読み窓に入ったスロットを順に予約し、窓の外へ出た最初のスロットをそのまま次の起点にする。
   時刻の比較で境目を判定しないので、周の頭が1 ULPの差で落ちることが起きない
   （DP_SLOTS_PER_BEAT の定義部にこの欠陥の説明がある）。 */
function _dpLoopTick() {
  const L = _dp && _dp.loop;
  if (!L || !audioCtx || !L.playing) return;
  const bpNow = _dpBeatsPerLoop(L);
  const slotDur = _dpSlotDur(L);
  const slotsPerLoop = bpNow * DP_SLOTS_PER_BEAT;
  const now = audioCtx.currentTime;
  let until = now + DP_SCHED_AHEAD;
  /* 周の切り替わりの判定は「いま鳴っている位置」で行う。予約位置は先読みぶん先を指している
     ので、そちらで判定すると周の変わり目が先読み時間だけ早まり、周の終わり際に叩いたぶんが
     次の周の記録に落ちる。その1〜2発が次の切り替わりでtakeを置き換えてしまい、
     「打ち込んだのに1音しか入らない」状態になる */
  if (L.rec) {
    /* 周の境目はスロット割りで決まるのでテンポには依らないが、ここでは秒に直して
       数えている。テンポを変えると head を置き直すぶん境目の時刻がずれ、
       **既に跨いだ境目がもう一度未来に現れる**ことがある(最大でも先読みの長さぶん)。
       周回番号を戻さない（増えたときだけ進める）ことで、ひとつの境目で
       録りかけ(take)が二度確定するのを防ぐ。番号を数え直して控え直す方法では、
       跨ぎ直しそのものは止められない */
    const kNow = Math.floor((now - L.head) / _dpLoopDur(L));
    if (L.lastK === null) L.lastK = kNow;
    else if (kNow > L.lastK) { _dpLoopPromote(L); L.lastK = kNow; }
    /* **録音中は次の周へ踏み込まない。**
       録りかけ(take)の中身が決まるのは周の境目（_dpLoopPromote）なので、境目より先を
       予約すると「まだ決まっていないもの」を予約することになる。しかもカーソルは
       そのとき手元にあったステップ表の上を進むので、あとから増えた音は
       カーソルより後ろに現れて二度と鳴らない。
       重ね録りで土台のレイヤーがまばらな場合、カーソルは次の音まで一気に飛ぶため、
       打ち込んだシーケンスの冒頭が数拍ぶん丸ごと落ちる（次の周からは正しく鳴る）。
       境目で頭打ちにすれば、次の周の予約は必ず promote のあとになる */
    until = Math.min(until, L.head + (L.lastK + 1) * _dpLoopDur(L));
  }
  /* 遅れたぶんは DP_LATE_TOL_SEC までさかのぼって拾う（それ以上は捨てる） */
  const minSlot = Math.ceil((now - DP_LATE_TOL_SEC - L.head) / slotDur);
  if (L.schedSlot < minSlot) L.schedSlot = minSlot;

  const steps = _dpLoopSteps(L, bpNow);
  if (steps.length === 0) return;

  let k = Math.floor(L.schedSlot / slotsPerLoop);
  let guard = 0;
  while (guard++ < 64) {
    const baseSlot = k * slotsPerLoop;
    if (L.head + baseSlot * slotDur >= until) break; // この周は丸ごと窓の外
    let done = false, emitted = -1;
    for (const st of steps) {
      const g = baseSlot + st.slot;
      if (g < L.schedSlot) continue;             // 予約済み
      const t = L.head + g * slotDur;            // 時刻は必ず原点から1回の掛け算で作る
      if (t >= until) { L.schedSlot = g; done = true; break; } // 次はここから
      const at = Math.max(t, now);               // 少し遅れていても捨てずに即座に鳴らす
      if (st.click) _dpClickVoice(at, st.click === 2);
      else {
        _dpVoice(st.i, at);
        L.viz.push({ i: st.i, t: at }); // 鳴る時刻にパッドを光らせる（_updateDrumPad）
      }
      emitted = g;
    }
    /* カーソルの前進はこの周を出し切ってから。1つ出すたびに g+1 へ進めると、
       同じスロットに複数の音がある場合（末尾の音がクオンタイズで頭へ回って
       元からある頭の音と重なる、など）に2つ目以降が予約済み扱いで落ちる */
    if (emitted >= 0) L.schedSlot = emitted + 1;
    if (done) break;
    k++;
  }
}

function _dpLoopStartSched() {
  const L = _dp.loop;
  if (L.sched) return;
  L.sched = setInterval(_dpLoopTick, DP_LOOP_TICK_MS);
  _dpLoopTick();
}
function _dpLoopStopSched() {
  const L = _dp && _dp.loop;
  if (!L || !L.sched) return;
  clearInterval(L.sched); L.sched = null;
  L.viz.length = 0;
}

/* 再生開始（基準時刻を今に置き直す）。停止中の操作から共通で呼ぶ */
function _dpLoopStart() {
  const L = _dp.loop;
  if (!audioCtx) getAudioCtx();
  L.head = audioCtx ? audioCtx.currentTime : 0;
  L.schedSlot = 0;
  L.playing = true;
  _dpLoopStartSched();
}

/* AudioContextを作り直すと時計が0へ戻る。ループの起点(head)は旧Contextの時刻なので、
   そのままでは予約位置が遥か未来と判定され、以後1音も鳴らない。
   新しい時計の現在時刻を起点に置き直し、パターンの先頭から鳴らし直す。
   録りかけ(pass/pending)と発光の予約(viz)は、失われた時間軸の上で採ったものなので捨てる。
   確定済みのレイヤーは拍で持っているので影響を受けない */
function _dpLoopRebaseClock() {
  const L = _dp && _dp.loop;
  if (!L || !audioCtx) return;
  L.head = audioCtx.currentTime;
  L.schedSlot = 0;
  L.lastK = L.rec ? 0 : null;
  if (L.rec) { L.pass = []; L.passDirty = false; }
  L.pending = [];
  L.viz = [];
}

/* 録音を終える。この時点で採用されているtakeを1レイヤーとして確定する */
function _dpLoopCommit(L) {
  /* 先取りぶんも取りこぼさない（周の頭で確定した場合） */
  if (L.pending.length) { L.pass = (L.pass || []).concat(L.pending); if (!L.take) L.passDirty = true; }
  if (L.passDirty && L.pass && L.pass.length) { L.take = L.pass; L.takeLen = _dpBeatsPerLoop(L); }
  else if (L.take && L.pass && L.pass.length) L.take = L.take.concat(L.pass); // 同上
  /* 長さは**打ち込んだときの小節数**。確定した瞬間の小節数で決めると、
     録音のあとに小節数を変えてからRECを切っただけで長さが変わってしまう */
  if (L.take && L.take.length) L.layers.push({ ev: L.take, len: L.takeLen || _dpBeatsPerLoop(L) });
  L.take = null; L.takeLen = 0; L.pass = null; L.pending = []; L.passDirty = false;
  L.lastK = null; L.rec = false;
}

function _dpLoopPlayStop() {
  const L = _dp.loop;
  if (L.playing) {
    if (L.rec) _dpLoopCommit(L);
    L.playing = false;
    _dpLoopStopSched();
  } else {
    _dpLoopStart();
  }
}

/* RECは録音アームのON/OFF。停止中に押したら再生ごと始める */
function _dpLoopRec() {
  const L = _dp.loop;
  if (L.rec) { _dpLoopCommit(L); return; }       // 最後に採用されたtakeを確定
  if (!L.playing) _dpLoopStart();
  L.take = null; L.takeLen = _dpBeatsPerLoop(L); L.pass = []; L.pending = []; L.passDirty = false;
  L.lastK = audioCtx ? Math.floor((audioCtx.currentTime - L.head) / _dpLoopDur(L)) : 0;
  L.rec = true;
}

/* 直前のレイヤーを取り消す。録音中なら、まずその録りかけを捨てる */
/* 録音中は「この録りかけ（take・pass）を捨てる」＝打ち直しのやり直し。
   録音していなければ直前に確定したレイヤーを取り消す */
function _dpLoopUndo() {
  const L = _dp.loop;
  if (L.rec && ((L.take && L.take.length) || (L.pass && L.pass.length) || L.pending.length)) {
    L.take = null; L.pass = []; L.pending = []; L.passDirty = false;
    /* 予約位置は巻き戻さない。既にWeb Audioへ渡した先読みぶんは取り消せないので、
       巻き戻すと同じ音が二度鳴るだけになる（_dpLoopApplyBpm のコメントと同じ理由）。
       捨てた録りかけは先読みの残り（最大 DP_SCHED_AHEAD）ぶんで鳴り止む */
    return;
  }
  if (L.layers.length === 0) return;
  L.layers.pop();
}

function _dpLoopClear() {
  const L = _dp.loop;
  L.layers = []; L.take = null; L.takeLen = _dpBeatsPerLoop(L);
  L.pass = L.rec ? [] : null; L.pending = []; L.passDirty = false;
}

/* テンポ変更。今の拍位置を保ったまま基準時刻を引き直すので演奏が途切れない
   （拍で記録しているのでパターンはそのまま伸び縮みする） */
/* BPMを決める唯一の入口（TEMPO±もタップテンポもここを通す）。
   再生中の置き換えは繊細で、別経路で書き直すと下に書いた欠陥が再発する */
function _dpLoopApplyBpm(bpm) {
  const L = _dp.loop;
  const next = Math.max(DP_BPM_MIN, Math.min(DP_BPM_MAX, Math.round(bpm)));
  if (next === L.bpm) return;
  if (L.playing && audioCtx) {
    /* **カーソル(schedSlot)は動かさない。** スロットは head からの拍数であって秒ではないので、
       テンポが変わっても「次に出すのはどの音か」は変わらない。
       動かしてよいのは head だけで、いま予約済みの境目（＝新テンポが効き始める時刻）が
       ずれないように置き直す。こうすると
         ・境目より手前（既にWeb Audioへ渡したぶん）は旧テンポのまま鳴り切る
         ・境目からは新テンポで、拍の並びは途切れずに続く
       が同時に成り立つ。

       カーソルを絶対時刻へ変換してスロットへ戻す（往復させる）ことはしない。
       切り上げで元のスロットより先に着地するため、まだ出していない音を1つ飛び越す。
       長押しで毎秒何十回も呼ばれる経路なので、1回ごとに1音ずつ先へずれて
       数秒ぶんの無音になる。 */
    const schedUntil = L.head + L.schedSlot * _dpSlotDur(L);
    L.bpm = next;
    L.head = schedUntil - L.schedSlot * _dpSlotDur(L);
    /* head が動くと、既に跨いだ周の境目が未来へ移ることがある（_dpLoopTick の
       周回番号の扱いを参照）。境目の位置そのものが変わるのは避けられないので、
       二度跨いでも二度確定しない側で受ける */
  } else {
    L.bpm = next;
  }
}
function _dpLoopSetBpm(delta) { _dpLoopApplyBpm(_dp.loop.bpm + delta); }

/* タップテンポ。ジョグを叩いた間隔の平均からBPMを決める。
   2打目から反映し、以降は叩くたびに平均を取り直して寄せていく。

   時刻は**実時間**で測る。測っているのは指の間隔であって音の時刻ではないので
   audio clock は使わない。フレームカウンタも使えない（rAFが止まる場面がある）。
   入力イベントの発生時刻をそのまま受け取るのは、ハンドラへ届くまでの遅延の
   **ばらつき**がそのままBPMの誤差になるため（一定ぶんの遅れは間隔で相殺される）。

   倍・半分への折り返しはしない。系列の切れ目が2秒なので30BPM未満は元々入らず、
   意図してゆっくり叩いたときに勝手に倍テンポへ飛ぶほうが害が大きい */
function _dpTapTempo(atMs) {
  const T = _dp.tap;
  const gap = atMs - T.last;
  T.last = atMs;
  if (gap < DP_TAP_MIN_MS) return;                     // 同時押し・二度打ちは1打に潰す
  if (gap > DP_TAP_TIMEOUT_MS) { T.iv = []; return; }  // 系列の切れ目。1打目は起点にするだけ
  if (T.iv.length) {
    const mean = T.iv.reduce((a, b) => a + b, 0) / T.iv.length;
    if (Math.abs(gap - mean) > mean * DP_TAP_OUTLIER) T.iv = []; // 別のテンポで叩き直した
  }
  T.iv.push(gap);
  if (T.iv.length > DP_TAP_KEEP) T.iv.shift();
  _dpLoopApplyBpm(60000 / (T.iv.reduce((a, b) => a + b, 0) / T.iv.length));
}
/* タップの系列が生きているか（LCDの表示を切り替える条件） */
function _dpTapLive() {
  const T = _dp && _dp.tap;
  return !!(T && T.iv.length && performance.now() - T.last < DP_TAP_TIMEOUT_MS);
}

/* 小節数の切り替え。**打ち込みには一切触れない**。
   再生・記録の長さが変わるだけで、短くすればはみ出したぶんが鳴らなくなり、
   長くすれば本来の長さぶんが繰り返される（_dpLoopTick参照）。
   2小節で録る→1小節で前半だけ鳴らす→4小節で2回鳴らす、が行き来できる */
function _dpLoopCycleBars() {
  const L = _dp.loop;
  const i = DP_BARS_CHOICES.indexOf(L.bars);
  L.bars = DP_BARS_CHOICES[(i + 1) % DP_BARS_CHOICES.length];
  /* 予約位置は巻き戻さない（UNDO・テンポ変更と同じ理由）。スロット番号は
     headからの拍数で決まり小節数に依存しないので、そのまま使える。
     新しい小節数は先読みの残りが尽きた時点から効く */
}

/* クオンタイズの刻みを巡回する（OFF → 1/16 → 1/8 → 1/4 → OFF）。
   記録は生のままで、再生時に丸めるだけ（_dpQuantBeat参照） */
function _dpLoopCycleQuant() {
  const L = _dp.loop;
  const i = DP_QUANT_CHOICES.indexOf(L.quant);
  L.quant = DP_QUANT_CHOICES[(i + 1) % DP_QUANT_CHOICES.length];
}

function _dpLoopToggleClick() {
  const L = _dp.loop;
  L.click = !L.click;
  /* 予約位置は巻き戻さない（上と同じ理由）。次の先読み窓からクリックが乗る */
}

function _dpHit(i) {
  const pad = DRUM_PADS[i];
  _dp.flash[i] = DP_FLASH_FRAMES;
  _dp.lastName = pad.name; _dp.lastTag = pad.tag;
  _dp.hits++;
  /* ジョグを回す。向きは叩いた列で決まり（左2列は逆時計回り、右2列は時計回り）、
     量は音の長さに比例させる（_dpJogScale参照）。左右を交互に叩くと回転が
     打ち消し合ってスクラッチのような動きになる */
  _dp.jogSpin += ((i % 4) < 2 ? -1 : 1) * DP_JOG_KICK * _dpJogScale(pad.dur);
  if (!audioCtx || audioCtx.state !== 'running' || audioMuted) return;
  const t = audioCtx.currentTime + 0.01; // クオンタイズしない（叩いた瞬間に鳴らす）
  _dpVoice(i, t);
  /* 録音中なら、いま予約した時刻を拍位置に直して記録する。丸めない
     （クオンタイズは再生時に掛ける非破壊方式。_dpQuantBeat参照）。
     この周に入力が入った時点で旧takeは引っ込み、周の終わりで置き換わる */
  const L = _dp.loop;
  if (L.rec && L.playing && L.pass && _dpLoopEventCount(L) < DP_LOOP_MAX_EV) {
    const bp = _dpBeatsPerLoop(L);
    const b = (t - L.head) / _dpBeatDur(L);
    const beat = ((b % bp) + bp) % bp;
    const win = _dpBoundaryWinBeats(L);
    if (beat > bp - win) {
      /* 周の頭の先取り。次の周の0拍として持ち越す */
      L.pending.push({ i, beat: 0 });
    } else if (beat < win) {
      /* 少し遅れて境目に落ちた音。0拍へ補正して入れる。
         直前のパターン(take)がある間は、これ単体では打ち直しとみなさない
         （1発で潰さないため）。まだtakeが無いなら普通の打ち込みとして扱う
         ——そうしないと「RECを押してすぐ頭だけ叩く」打ち込みが取れない */
      L.pass.push({ i, beat: 0 });
      if (!L.take) L.passDirty = true;
    } else {
      L.pass.push({ i, beat });
      L.passDirty = true;
    }
  }
}

function _drumPadTouch(x, y, inputPerfMs) {
  if (!_dp) return;
  if (hitTest(DP_BACK_BTN, x, y)) { _exitDrumPad(); return; }
  if (hitTest(MUTE_BTN, x, y)) { if (!audioCtx) getAudioCtx(); toggleMute(); return; }
  for (const c of _dp.ctls) if (hitTest(c, x, y)) {
    if (c.id === 'rec')   _dpLoopRec();
    if (c.id === 'play')  _dpLoopPlayStop();
    if (c.id === 'undo')  _dpLoopUndo();
    if (c.id === 'clear') _dpLoopClear();
    if (c.id === 'click') _dpLoopToggleClick();
    if (c.id === 'bpmUp') { _dpLoopSetBpm(+DP_BPM_STEP); _dpHoldBegin(+DP_BPM_STEP, c); }
    if (c.id === 'bpmDn') { _dpLoopSetBpm(-DP_BPM_STEP); _dpHoldBegin(-DP_BPM_STEP, c); }
    if (c.id === 'bars')  _dpLoopCycleBars();
    if (c.id === 'quant') _dpLoopCycleQuant();
    return;
  }
  /* ジョグ（丸ロゴ）はタップテンポの入力。円で判定するのは、外接矩形で取ると
     円の外の四隅を叩いても効いてしまうため */
  const J = _dp.jog;
  if (Math.hypot(x - J.x, y - J.y) <= J.r + DP_JOG_BEZEL) {
    _dpTapTempo(inputPerfMs !== undefined ? inputPerfMs : performance.now());
    /* 押した側へ回す（実物のプラッタを手で押したときの動き）。
       量は位置によらず1打ぶんで固定にする。中心からの距離に比例させると
       中心付近を狙う人には手応えがほとんど返らない。タップは音を鳴らさないので、
       返す反応の強さは叩いた場所によらず一定であるべき */
    _dp.jogSpin += (x < J.x ? -1 : 1) * DP_JOG_KICK;
    return;
  }
  for (const p of _dp.pads) if (hitTest(p, x, y)) { _dpHit(p.idx); return; }
}

/* 叩いた光とジョグの回転だけを進める（ゲーム本体は止めたまま。update参照） */
function _updateDrumPad() {
  if (!_dp) return;
  for (let i = 0; i < _dp.flash.length; i++) if (_dp.flash[i] > 0) _dp.flash[i]--;
  /* ループが鳴らした音のぶんもパッドを光らせる。予約済みの時刻と音声クロックを
     突き合わせるので、光と音がずれない（何を重ねたかが目で分かる） */
  const L = _dp.loop;
  if (L.viz.length && audioCtx) {
    const now = audioCtx.currentTime;
    let k = 0;
    for (const v of L.viz) {
      if (v.t <= now) { _dp.flash[v.i] = DP_FLASH_FRAMES; continue; }
      L.viz[k++] = v;
    }
    L.viz.length = k;
  }
  _dp.jogRot += _dp.jogSpin;
  _dp.jogSpin *= DP_JOG_DAMP;
  if (Math.abs(_dp.jogSpin) < 0.0005) _dp.jogSpin = 0;
}

/* パッド・操作ボタンに共通の「面」の作り: 上が明るく下が暗い縦グラデ＋内側の白ベベル＋
   外側の影。16パッドと6つの操作ボタンで同じ族に見せるため、色と描き順をここに集約する
   （別々に書くとどちらかを触ったときに揃わなくなる）。
   path は3層ぶんの輪郭を引く関数の組 {fill, bevel, edge}。パッドと操作ボタンでは
   面の形も各層のオフセットも違う（パッドは角丸長方形、操作ボタンはロゴの左右で形が変わる
   多角形＝_dpBtnPoly参照）ので、幾何は呼び出し側が持ち、共通なのは色と描き順だけにする。
   tone: 'off'=消灯 / 'on'=点灯（金）/ 'rec'=録音中（赤） */
const DP_FACE_TONES = {
  off: ['#2b3f34', '#1d2c24', '#131e18'],
  on:  ['#d9b23a', '#b08c14', '#7d6205'],
  rec: ['#d8564a', '#b32e22', '#7d1d15'],
};
function _dpDrawFace(c, y, h, path, tone = 'off') {
  const col = DP_FACE_TONES[tone];
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, col[0]); g.addColorStop(0.55, col[1]); g.addColorStop(1, col[2]);
  c.lineJoin = 'round';
  c.fillStyle = g;
  path.fill(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 1.5;
  path.bevel(); c.stroke();
  c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = 1;
  path.edge(); c.stroke();
}

/* 筐体（背景＋パネルの外枠） */
function _dpDrawBody(o) {
  ctx.fillStyle = '#0b120e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#101b15';
  roundRect(o.body.x, o.body.y, o.body.w, o.body.h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.30)'; ctx.lineWidth = 1;
  roundRect(o.body.x, o.body.y, o.body.w, o.body.h, 12); ctx.stroke();
}

/* 銘板（機種名のみ。ロゴはジョグで大きく見せるので重ねて出さない） */
function _dpDrawPlate(o) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = `bold 13px sans-serif`;
  ctx.fillStyle = Y;
  ctx.fillText('GIYOUZA SP-16', o.plate.x, o.plate.y - 7);
  ctx.font = `9px sans-serif`;
  ctx.fillStyle = 'rgba(245,208,32,0.45)';
  ctx.fillText('TR / TB DRUM PADS', o.plate.x, o.plate.y + 7);
}

/* LCD窓。左に最後に叩いた音色、右にループの状態（状態名／テンポ・レイヤー数） */
function _dpDrawLcd(o) {
  const L = o.lcd, LP = o.loop;
  ctx.fillStyle = '#0a2413';
  roundRect(L.x, L.y, L.w, L.h, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 2;
  roundRect(L.x, L.y, L.w, L.h, 5); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `9px sans-serif`;
  ctx.fillStyle = 'rgba(159,242,168,0.55)';
  /* タップ中は大きい行をBPMに明け渡す。停止中のタップは音が鳴らないので、
     指を置いているジョグの傍で数字が追えないと、テンポが動いたか分からない。
     直前に鳴らしたパッド名を見ている場面ではないので、隠しても困らない */
  const tapping = _dpTapLive();
  ctx.fillText(tapping ? 'TAP TEMPO' : o.lastTag ? `VOICE / ${o.lastTag}` : 'VOICE', L.x + 10, L.y + 17);
  ctx.font = `bold ${L.h >= 60 ? 26 : 22}px sans-serif`;
  ctx.fillStyle = '#9ff2a8';
  ctx.fillText(tapping ? `${LP.bpm} BPM` : (o.lastName || '- - -'), L.x + 10, L.y + L.h - 12);
  ctx.textAlign = 'right';
  ctx.font = `9px sans-serif`;
  ctx.fillStyle = LP.rec ? '#ff8a7a' : 'rgba(159,242,168,0.55)';
  ctx.fillText(LP.rec ? 'REC' : LP.playing ? 'PLAY' : 'STOP', L.x + L.w - 10, L.y + 17);
  ctx.fillStyle = 'rgba(159,242,168,0.55)';
  ctx.fillText(`${LP.bpm}BPM  x${LP.layers.length}`, L.x + L.w - 10, L.y + L.h - 12);
}

/* 操作ボタン。REC（録音中）・CLICK（ON）・Q（ON）は点いた状態を持ち、
   UNDO/CLEAR は打ち込みが無いとき暗くする（押しても効かないことを見せる） */
function _dpDrawCtls(o) {
  const LP = o.loop;
  const hasPat = _dpLoopHasPattern(LP);
  for (const c of o.ctls) {
    const on   = (c.id === 'rec' && LP.rec) || (c.id === 'click' && LP.click) ||
                 (c.id === 'quant' && LP.quant > 0);
    const red  = (c.id === 'rec' && LP.rec);
    const live = (c.id === 'undo' || c.id === 'clear') ? hasPat : true;
    /* 形だけがロゴの左右で変わる（_dpBtnPoly参照）。面の作りはパッドと同じ */
    const at = inset => c.shape
      ? _dpRoundPoly(_dpBtnPoly(c, inset), 6)
      : roundRect(c.x + inset, c.y + inset, c.w - inset * 2, c.h - inset * 2, 5);
    const face = { fill: () => at(0), bevel: () => at(2), edge: () => at(0.5) };
    _dpDrawFace(ctx, c.y, c.h, face, red ? 'rec' : on ? 'on' : 'off');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 10px sans-serif`;
    ctx.fillStyle = (red || on) ? '#fff8e0' : live ? 'rgba(245,208,32,0.9)' : 'rgba(245,208,32,0.3)';
    /* 平行四辺形は左右の辺が傾いているので、文字の中心を面の重心へ寄せる */
    const lx = c.shape === 'midL' ? c.x + (c.w - DP_BTN_SKEW) / 2
             : c.shape === 'midR' ? c.x + DP_BTN_SKEW + (c.w - DP_BTN_SKEW) / 2
             : c.x + c.w / 2;
    ctx.fillText(DP_CTL_LABEL[c.id](LP), lx, c.y + c.h / 2 + 0.5);
    if (live) _drawPressFlashPath(c, face.fill); // 押下の光は面と同じ輪郭で被せる
  }
}

/* ジョグ（丸いギヨウザロゴ）。叩くたびに回り、減衰して止まる。
   外周のリングはループの再生位置（真上から時計回りに1周＝ループ1周）。
   ロゴ自体の回転（打鍵に反応）とは別の層なので衝突しない */
function _dpDrawJog(o) {
  const J = o.jog, LP = o.loop;
  ctx.fillStyle = '#0a1109';
  ctx.beginPath(); ctx.arc(J.x, J.y, J.r + DP_JOG_BEZEL, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(J.x, J.y, J.r + DP_JOG_BEZEL, 0, Math.PI * 2); ctx.stroke();
  if (LP.playing && audioCtx) {
    const bp = _dpBeatsPerLoop(LP), pos = _dpLoopBeatPos(LP);
    /* 小節の区切りを目盛りで出す（何小節のパターンかが一目で分かる） */
    ctx.strokeStyle = 'rgba(245,208,32,0.30)'; ctx.lineWidth = 1;
    for (let b = 0; b < LP.bars; b++) {
      const a = -Math.PI / 2 + Math.PI * 2 * (b / LP.bars);
      ctx.beginPath();
      ctx.moveTo(J.x + Math.cos(a) * (J.r + 2), J.y + Math.sin(a) * (J.r + 2));
      ctx.lineTo(J.x + Math.cos(a) * (J.r + 12), J.y + Math.sin(a) * (J.r + 12));
      ctx.stroke();
    }
    ctx.strokeStyle = LP.rec ? '#e0483c' : Y;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(J.x, J.y, J.r + DP_JOG_BEZEL, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (pos / bp));
    ctx.stroke();
  }
  _drawGyozaCircleLogo(J.x, J.y, J.r, 1, o.jogRot);
  _drawPressFlashCircle(J.x, J.y, J.r + DP_JOG_BEZEL);
  /* 叩けることを示す銀板の印字。ジョグ上の空きに置く */
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `9px sans-serif`;
  ctx.fillStyle = 'rgba(245,208,32,0.45)';
  ctx.fillText('TAP TEMPO', J.x, J.y - (J.r + DP_JOG_BEZEL) - 7);
}

/* パッド（焼き込み済みを転写し、叩いた光だけ上に重ねる） */
function _dpDrawPads(o) {
  for (const p of o.pads) {
    ctx.drawImage(_dpPadSprites[p.idx], p.x, p.y, p.w, p.h);
    const f = o.flash[p.idx];
    if (f > 0) _drawFlashRect(f / DP_FLASH_FRAMES, p.x + 1, p.y + 1, p.w - 2, p.h - 2, 10);
  }
}

/* 描く順は筐体 → 銘板 → LCD → 操作ボタン → ジョグ → パッド。
   区画の分け方は _dpBuildLayout が組み立てる構造と同じにしてある */
function drawDrumPad() {
  if (phase !== 'drumPad' || !_dp) return;
  const o = _dp;
  ctx.save();
  _dpDrawBody(o);
  _dpDrawPlate(o);
  _dpDrawLcd(o);
  _dpDrawCtls(o);
  _dpDrawJog(o);
  _dpDrawPads(o);
  ctx.restore();
}

/* ════════════════ 吉祥雲 ════════════════ */
/* _drawCloudTo: 任意のコンテキストに雲を描く（OffscreenCanvas 事前描画用）
   drawCloud: メインcanvasへの呼び出し（_staticLayerCanvas が利用可能なら使わない） */
function _drawCloudTo(c2, cx, cy, sc, alpha, rot) {
  c2.save();
  c2.translate(cx, cy);
  c2.rotate(rot||0);
  c2.scale(sc, sc);
  c2.globalAlpha = alpha;
  c2.fillStyle   = Y;
  c2.beginPath();
  c2.moveTo(-50, 5);
  c2.bezierCurveTo(-60,6,-65,-4,-57,-10);
  c2.bezierCurveTo(-49,-16,-40,-8,-45,3);
  c2.bezierCurveTo(-46,9,-40,13,-34,8);
  c2.bezierCurveTo(-34,1,-26,-14,-16,-12);
  c2.bezierCurveTo(-13,-11,-11,-9,-10,-8);
  c2.bezierCurveTo(-12,-24,12,-24,10,-8);
  c2.bezierCurveTo(11,-9,13,-11,16,-12);
  c2.bezierCurveTo(26,-14,34,1,34,8);
  c2.bezierCurveTo(40,13,46,9,45,3);
  c2.bezierCurveTo(40,-8,49,-16,57,-10);
  c2.bezierCurveTo(65,-4,60,6,50,5);
  c2.bezierCurveTo(42,15,-42,15,-50,5);
  c2.closePath();
  c2.fill();
  c2.restore();
}
function drawCloud(cx, cy, sc, alpha, rot) { _drawCloudTo(ctx, cx, cy, sc, alpha, rot); }

/* ════════════════ 獅子 ════════════════ */
/* _drawShishiTo: 任意のコンテキストに獅子を描く（OffscreenCanvas 事前描画用）
   drawShishi: メインcanvasへのラッパー */
function _drawShishiTo(c2, cx, cy, sc, mirX) {
  c2.save();
  c2.translate(cx, cy);
  c2.scale(mirX ? -sc : sc, sc);

  /* 胴体・脚（最背面に描画 → たてがみ・顔の下に隠れる） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.ellipse(-23,20,13,16,0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 23,20,13,16,-0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,12,29,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-32,44,11,18,0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 32,44,11,18,-0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,28,22,20,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.fillStyle=GN;
  for (const [x,y,r] of [[-10,8,5],[10,8,5],[0,18,5],[-22,20,4],[22,20,4]]) {
    c2.beginPath(); c2.arc(x,y,r,0,Math.PI*2); c2.fill();
  }
  /* 尻尾: 根元は体の側面、先端が横外側（+やや上）を向く
     rotate(-1.2)で先端がx負方向=外側へ。mirXで右獅子は右外側に自動反転 */
  c2.save();
  c2.translate(-44, 40);
  c2.rotate(-1.2);
  c2.beginPath();
  c2.moveTo(0,-24);
  c2.bezierCurveTo( 9,-14, 11, 3, 0, 15);
  c2.bezierCurveTo(-11,  3, -9,-14, 0,-24);
  c2.closePath();
  c2.fillStyle=Y; c2.fill();
  c2.restore();

  /* たてがみ: 全周に巻き貝・渦巻きカール（狛犬スタイル）
     上部3個(i=8,9,10)・下部3個(i=2,3,4)は顔より前面に描画 */
  const _hx = 0, _hy = -28, _ringR = 45, _cR = 17, _N = 12, _WR = 1.22;
  const _drawCurl = i => {
    const a = (i / _N) * Math.PI * 2;
    const cx = _hx + Math.cos(a) * _ringR, cy = _hy + Math.sin(a) * _ringR;
    c2.fillStyle = Y;
    c2.beginPath(); c2.ellipse(cx, cy, _cR*_WR, _cR, 0, 0, Math.PI*2); c2.fill();
    c2.save();
    c2.translate(cx, cy); c2.scale(_WR, 1);
    /* C字弧の開口を顔中心方向に向ける。
       現開口方向≈5.751rad、顔中心方向=a+π。差分を回転として加算。 */
    const _rot = (a + Math.PI) - 5.751;
    c2.globalAlpha = 0.6; // C字弧の濃さ
    c2.beginPath();
    c2.arc(-_cR*0.18, _cR*0.08, _cR*0.52, 0.35 + _rot, Math.PI*1.55 + _rot);
    c2.strokeStyle = GN; c2.lineWidth = _cR*0.3; c2.lineCap = 'round'; c2.stroke();
    c2.globalAlpha = 1;
    c2.restore();
  };
  /* 背面カール（顔の後ろ）: 左右の6個 */
  for (const i of [0,1,5,6,7,11]) _drawCurl(i);
  /* 顔の輪郭: 少し大きな緑の楕円を先に描いてボーダーを作る */
  c2.globalAlpha = 0.65;
  c2.fillStyle = GN;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR+4, 39, 0, 0, Math.PI*2); c2.fill();
  c2.globalAlpha = 1;
  /* 頭部楕円（横長）を上から描画 */
  c2.fillStyle = Y;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR, 35, 0, 0, Math.PI*2); c2.fill();
  /* 目: 緑塗りつぶし */
  c2.fillStyle=GN;
  c2.beginPath(); c2.arc(-17,-34,3.5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc(17,-34,3.5,0,Math.PI*2); c2.fill();
  /* 瞼: 顔色の大きな円で目の上部・外側寄りを覆う（左右対称） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.arc(-17-2,-34-7,5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc( 17+2,-34-7,5,0,Math.PI*2); c2.fill();
  /* 眉毛: 尻尾と同形状（ティアドロップ）、半透明で微妙な濃さ
     内側（鼻寄り）が高くなるよう傾ける（凛々しい表情） */
  c2.save();
  c2.globalAlpha = 0.30;
  for (const [ex, rot] of [[-17, 1.3], [17, -1.3]]) {
    c2.save();
    c2.translate(ex, -44);
    c2.rotate(rot);
    c2.beginPath();
    c2.moveTo(0,-10);
    c2.bezierCurveTo( 4,-5.5, 4.5, 1, 0, 6);
    c2.bezierCurveTo(-4.5, 1, -4,-5.5, 0,-10);
    c2.closePath();
    c2.fillStyle=GN; c2.fill();
    c2.restore();
  }
  c2.restore();
  /* 鼻（小さめ・少し上に） */
  c2.fillStyle=GN;
  c2.beginPath(); c2.ellipse(0,-21,5,3,0,0,Math.PI*2); c2.fill();
  /* 口: 人字型（犬っぽい口） */
  c2.strokeStyle=GN; c2.lineWidth=1.8; c2.lineCap='round'; c2.lineJoin='round';
  /* 人中（鼻下〜口中央）: 口にピッタリ接続 */
  c2.beginPath();
  c2.moveTo(0,-17); c2.lineTo(0,-13);
  c2.stroke();
  /* 口: Wの下二つのアーチを丸くした形（ω口）
     左右の口角(高め)→下方へアーチ→中央で合わさる */
  c2.beginPath();
  c2.moveTo(-7,-13);
  c2.quadraticCurveTo(-4,-10, 0,-13);
  c2.quadraticCurveTo(4,-10, 7,-13);
  c2.stroke();
  /* 前面カール: 下部中央(i=3)を最背面→左右(i=2,4)→上部(i=8,9,10) */
  _drawCurl(3);          // 下部中央: 最背面
  for (const i of [2,4,8,9,10]) _drawCurl(i);
  c2.restore();
}
function drawShishi(cx, cy, sc, mirX) { _drawShishiTo(ctx, cx, cy, sc, mirX); }

/* ════════════════ Draw helpers ════════════════ */

/* 放射状グラデーションで縁をぼかした円スプライトを1枚作る。shadowBlurは使わず
   （プロジェクト規約: GPUブラーパス削減のため全廃済み）グラデーション自体で
   ぼかす、という同じ手順を持つ生成関数が複数あったのを一本化した。
   stopsは[位置, 色]の配列。半径はスプライトの論理半径（_dprは内部で掛ける） */
function _buildRadialSprite(stops, r = 32) {
  const oc = _mkCache(r * 2 * _dpr, r * 2 * _dpr);
  const c = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.translate(r, r);
  const grd = c.createRadialGradient(0, 0, 0, 0, 0, r);
  for (const [at, color] of stops) grd.addColorStop(at, color);
  c.fillStyle = grd;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  return oc;
}

/* 縁取りテキスト: stroke を先に描いてから fill を重ねる */
function outText(text, x, y, fillStyle, strokeStyle, lw) {
  ctx.lineJoin    = 'round';
  ctx.lineWidth   = lw ?? 9;
  ctx.strokeStyle = strokeStyle ?? 'rgba(0,0,0,0.88)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(text, x, y);
}

function easeOutBack(t) {
  const c1=1.70158, c3=c1+1;
  return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* 右上/左上ボタン群共通の背景描画（roundRect + fill + gold border）
   active=true: トロフィーON時のゴールド強調背景 */
function _drawBtnBg(rect, active) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 6);
  ctx.fillStyle = active ? 'rgba(180,140,0,0.75)' : 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ── 画面最前面のボタン群 ──────────────────────────────
   トロフィー・真エンディング再生・全画面・ミュート・ポーズの5つ。いずれも
   「背景(_drawBtnBg) → 中心へ移動 → アイコンのベクタ描画」という同じ骨格なので、
   骨格を_drawTopBtnに、造形だけを各アイコン関数に分ける（draw()には骨格だけを置く、
   という_drawForegroundと同じ分け方）。アイコンは毎フレームその場で無名関数を
   作らずに済むよう名前付き関数で渡す（描画ループでの割り当てを増やさない） */
function _drawTopBtn(rect, active, drawIcon) {
  ctx.save();
  _drawBtnBg(rect, active);
  ctx.translate(rect.x + rect.w / 2, rect.y + rect.h / 2); // アイコンは中心が原点
  drawIcon();
  ctx.restore();
  _drawPressFlash(rect); // 上部ボタンはここを必ず通るので、押下の光もここで面倒を見る
}

/* トロフィーアイコン: カップ→ネック→台座の正しいシルエット */
function _drawTrophyIcon() {
  ctx.strokeStyle = Y;
  ctx.fillStyle   = Y;
  ctx.lineWidth   = 1.4;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  /* カップ本体 + ネック + 台座（一体の塗りつぶしパス）
     🏆絵文字シルエットをトレース:
     上辺 ±5.5, カップ壁がy=-5付近で最大幅x≈8, y=-2付近でx≈6, ネックy=0.5でx≈2.5
     台座 ±7, y=3〜7.5 */
  ctx.beginPath();
  ctx.moveTo(-5.5, -8.5);                                      // 上辺 左
  ctx.lineTo( 5.5, -8.5);                                      // 上辺 右
  ctx.bezierCurveTo( 8.25, -4.75,  7.25, -1.75,  2.5,  0.5); // 右壁（膨らみ→絞り込み）
  ctx.lineTo( 2,  0.5);  ctx.lineTo( 2,  3);                  // ネック右
  ctx.lineTo( 6,  3);    ctx.lineTo( 6,  7.5);                // 台座右
  ctx.lineTo(-6,  7.5);  ctx.lineTo(-6,  3);                  // 台座底・左
  ctx.lineTo(-2,  3);    ctx.lineTo(-2,  0.5);                // ネック左
  ctx.lineTo(-2.5, 0.5);                                       // カップ底 左
  ctx.bezierCurveTo(-7.25, -1.75, -8.25, -4.75, -5.5, -8.5); // 左壁（右の鏡）
  ctx.closePath();
  ctx.fill();

  /* 持ち手：カップ中段外側に付くD字アーク
     右壁: y=-5でx≈8, y=-2でx≈7 に合わせた外側カーブ */
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo( 7, -6.5);
  ctx.quadraticCurveTo(12.5, -5,  6, -3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, -6.5);
  ctx.quadraticCurveTo(-12.5, -5, -6, -3);
  ctx.stroke();
}

/* 祝賀メダル（円形ロゼット＋燕尾リボン）アイコン。単色シルエット。
   ボタン全体を使い切るサイズ・太いリボン幅・燕尾ノッチ付きにする。細く小さいと遠目に
   メダルと判別できず、ポーズ解除の再生三角とも紛らわしくなる */
function _drawEndingMedalIcon() {
  ctx.fillStyle = Y;
  ctx.beginPath();
  ctx.moveTo(-4.5, -1); ctx.lineTo(-0.6, -1); ctx.lineTo(-0.6, 10);
  ctx.lineTo(-2.5, 7.2); ctx.lineTo(-4.5, 10);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4.5, -1); ctx.lineTo(0.6, -1); ctx.lineTo(0.6, 10);
  ctx.lineTo(2.5, 7.2); ctx.lineTo(4.5, 10);
  ctx.closePath(); ctx.fill();
  /* メダル円の縁に沿って薄い暗色の隙間を挟み、リボン(奥)とメダル(手前)が
     重なっているように見せる（同色ベタ塗りだと繋ぎ目が消え一体化して見えるため） */
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(0, -4, 8.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = Y;
  ctx.beginPath();
  ctx.arc(0, -4, 7, 0, Math.PI * 2);
  ctx.fill();
}

/* 音符アイコン（サウンドテスト）。符頭＋符幹＋旗の単色シルエット */
function _drawSoundTestIcon() {
  ctx.fillStyle = Y; ctx.strokeStyle = Y;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save();
  ctx.translate(-3.2, 5.4); ctx.rotate(-0.32);
  ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 3.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(0.9, 4.6); ctx.lineTo(0.9, -8.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0.9, -8.4); ctx.quadraticCurveTo(8.2, -6.2, 5.8, -1.4);
  ctx.stroke();
}

function _drawFullscreenIcon() {
  ctx.fillStyle = Y;
  ctx.scale(_FS_ICON_SCALE, _FS_ICON_SCALE);
  ctx.translate(-12, -12); // 24×24 viewBox の中心揃え
  ctx.fill(_isFullscreen ? _FS_PATH_EXIT : _FS_PATH_ENTER);
}

function _drawMuteIcon() {
  const ic = Y; // 全画面ボタンと同じ金色
  ctx.strokeStyle = ic; ctx.fillStyle = ic;
  ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* ミュート時: 右へ3px移動 + 1.2倍スケールで斜線の中央に揃える
     通常:   体 x=-9〜-4, コーン x=-4〜3（中心 x≈-3）
     ミュート: translate(3,0)+scale(1.2) → 体 x≈-7.8〜-2.2, コーン x≈-2.2〜6.6（中心 x≈-0.8） */
  const spkShift = audioMuted ? 2 : 0;
  ctx.save();
  ctx.translate(spkShift, 0);
  if (audioMuted) ctx.scale(0.95, 1.1); // ミュート時: 縦1.1倍・横0.95倍（横圧縮）
  /* スピーカー本体（台形＋四角） */
  ctx.fillRect(-9, -4, 5, 8);
  /* 台形コーン */
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.lineTo( 3, -8);
  ctx.lineTo( 3,  8);
  ctx.lineTo(-4,  4);
  ctx.closePath();
  ctx.fill();
  if (!audioMuted) {
    /* 音波 小 */
    ctx.beginPath();
    ctx.arc(3, 0, 5, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
    /* 音波 大 */
    ctx.beginPath();
    ctx.arc(3, 0, 9, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
  }
  ctx.restore();
  if (audioMuted) {
    /* ミュート: 左上→右下の斜線（macOS スタイル）
       完全不透明の黒ボーダーでスピーカーをシャープに切り、上からゴールドを重ねる */
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
    ctx.strokeStyle = ic;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
  }
}

/* リターン矢印（右上から下りて左へ回り込み、左を向く）。ミュート・全画面と
   同じ列に並ぶので、線の太さと大きさもそれらに揃える */
function _drawReturnIcon() {
  ctx.strokeStyle = Y;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(6, -7);
  ctx.lineTo(6, 1);
  ctx.quadraticCurveTo(6, 6, 1, 6);
  ctx.lineTo(-5, 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-1, 1.5);
  ctx.lineTo(-6, 6);
  ctx.lineTo(-1, 10.5);
  ctx.stroke();
}

function _drawPauseIcon() {
  ctx.fillStyle = Y;
  if (isPaused) {
    ctx.beginPath();
    ctx.moveTo(-5, -8); ctx.lineTo(-5, 8); ctx.lineTo(9, 0);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(-6, -8, 4, 16);
    ctx.fillRect( 2, -8, 4, 16);
  }
}

/* 描画順＝重なり順。表示条件はボタンごとに違う:
   トロフィー   エンドロール中は無効なので描かない（_achBtnEnabled参照）
   エンディング タイトル画面かつ視聴済みのみ。ゲーム途中で見るものではなく
                スタートと並列の選択肢という位置づけのため実績パネル内には置かない
   全画面       Fullscreen API 対応環境のみ
   ポーズ       タイトル画面以外 */
function _drawTopButtons() {
  if (_achBtnEnabled())                      _drawTopBtn(ACH_TROPHY,      showAchievements, _drawTrophyIcon);
  if (phase === 'startup' && trueEndingSeen) _drawTopBtn(TRUE_ENDING_BTN, false,            _drawEndingMedalIcon);
  if (phase === 'startup' && _soundTestUnlocked()) _drawTopBtn(SOUND_TEST_BTN, false,        _drawSoundTestIcon);
  if (FS_SUPPORTED)                          _drawTopBtn(FS_BTN_RECT,     false,            _drawFullscreenIcon);
                                             _drawTopBtn(MUTE_BTN,        false,            _drawMuteIcon);
  if (phase !== 'startup' && phase !== 'soundTest' && phase !== 'drumPad') _drawTopBtn(PAUSE_BTN, false, _drawPauseIcon);
  if (phase === 'drumPad')                   _drawTopBtn(DP_BACK_BTN,     false,            _drawReturnIcon);
}

/* ピルバッジの外形パスを設定（beginPath〜closePath）。fill()/stroke()は呼び出し側で行う */
function _drawPillPath(bx, by, bw, bh) {
  const r = bh / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by,      bx + bw, by + bh, r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r,  by + bh);
  ctx.arcTo(bx,       by + bh, bx, by + bh - r, r);
  ctx.lineTo(bx,      by + r);
  ctx.arcTo(bx,       by,      bx + r, by, r);
  ctx.closePath();
}

/* ── ピルバッジの共通描画 ──
   画面上部・下部に出る通知バッジ（スローハンド／ミュージックボーナス／フィーバー／
   CONTINUE等）は、寸法の決め方と描き順をここに集約する。
   幅はテキストの実測に左右のパディングを足して決め、常に画面中央へ置く。
   個別に書くと padX/padY や中央揃えの基準が少しずつずれ、上下に並んだときに揃わない。

   opts:
     fs        フォントサイズ（既定は上部バッジの標準サイズ）
     padX/padY テキスト周囲の余白
     y         バッジ上端のY。関数 `bh => Y` を渡すと高さから決められる（下端基準に使う）
     fill      背景色 / stroke 枠色 / lw 枠の太さ / color 文字色
     alpha     全体の不透明度
     scale     バッジ中心を基準にした拡縮（ポップ・呼吸）
     textDY    文字のベースライン微調整（小さいフォントでem中央と視覚中央がずれる分）
   戻り値は実際に使った矩形（呼び出し側が続けて描き足せるように）*/
function _drawPillBadge(text, opts) {
  const fs   = opts.fs ?? (IS_PORTRAIT ? 13 : 14);
  const padX = opts.padX ?? 18, padY = opts.padY ?? 7;
  ctx.save();
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  ctx.font = `bold ${fs}px ${FONT_MIN}`;
  const bw = ctx.measureText(text).width + padX * 2;
  const bh = fs + padY * 2;
  const bx = (W - bw) / 2;
  const by = typeof opts.y === 'function' ? opts.y(bh) : opts.y;

  const sc = opts.scale ?? 1;
  if (sc !== 1) {
    ctx.translate(W / 2, by + bh / 2);
    ctx.scale(sc, sc);
    ctx.translate(-W / 2, -(by + bh / 2));
  }

  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = opts.fill;
  ctx.fill();
  ctx.strokeStyle = opts.stroke;
  ctx.lineWidth = opts.lw ?? 1.5;
  ctx.stroke();

  ctx.fillStyle = opts.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2 + (opts.textDY ?? 0));
  ctx.restore();
  return { bx, by, bw, bh };
}

/* ════════════════ Main draw ════════════════ */
/* 前景レイヤー一式（暗幕→当たり演出→テキスト→全画面演出→バッジ類）。
   **並び順がそのまま重なり順**なので、並べ替えは見た目の変更になる。
   draw()側には「背景・盤面 → _drawForeground() → ポーズ/デバッグ表示」という
   骨格だけを置く。 */
function _drawForeground() {
  /* 1. オーバーレイ（ハズレは暗幕なし） */
  if (phase==='done'&&endTimer>45&&!isMissResult&&!isGameOver&&hitType!=='none') drawEndOverlay();
  if (phase==='reach')              drawReachOverlay();

  /* 2. エフェクト面 */
  const _tFx = PERF_ON ? performance.now() : 0;
  if (_activeEffect?.draw && endTimer >= (_activeEffect.drawDelay ?? 0)) _activeEffect.draw();
  /* 前トライの中当たりエフェクトの退場（_fxOutro参照）。現トライの演出と同じ
     レイヤーに重ねる。両者が同時に出るのは意図どおり（並行して進む） */
  _drawFxOutro();
  /* フィーバー堆積アイテム: _activeEffectがdrawItemsを担う場合を除いて常時描画 */
  if (items.length > 0 && _activeEffect?.draw !== drawItems) drawItems();
  drawUzaFlash(); // ウザウザフラッシュ（内部で hitType チェック済み）
  if (PERF_ON) _perfMark('fx', _tFx);

  /* 白フラッシュ (リーチ大当たり確定の瞬間) */
  if (reachFlash > 0) {
    ctx.save();
    ctx.globalAlpha = reachFlash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }


  /* 3. テキスト最前面 */
  const _tTxt = PERF_ON ? performance.now() : 0;
  if (phase==='done'&&endTimer>45&&(!isMissResult||isGameOver)&&!_jackpotAutoReset) drawEndScreen();
  /* ポップアップ: phaseを問わず常時描画（トライ横断フェードアウト） */
  if (missPopups.length > 0)   drawMissPopup();
  if (payoutPopups.length > 0) drawPayoutPopup();
  /* フィーバーバナー（開始/終了とも drawFeverBanner で統合） */
  if (feverStartBannerTimer > 0) drawFeverBanner(feverStartBannerTimer, null);
  if (feverEndBannerTimer > 0 && feverEndBannerReason) drawFeverBanner(feverEndBannerTimer, feverEndBannerReason);
  if (phase==='reach')              drawReachText();
  if (PERF_ON) _perfMark('txt', _tTxt);

  /* スタートアップ画面 */
  drawStartup();

  /* キングギヨウザ出現予告・戦闘・勝利演出（全画面演出・ボタン類より下、バッジ類より上）。
     ここは通常モードのfx/whl/txtプローブの範囲外なので、独立して計測する
     （戦闘中に全プローブが0.0なのにgapが50msという実機データの死角だった） */
  const _tKing = PERF_ON ? performance.now() : 0;
  const _pd = PHASE_DRAWERS[phase];
  if (_pd) _pd();
  if (PERF_ON) _perfMark('king', _tKing);

  /* ビートシンクメーター＋JUST演出（通常のシンク統計はボス戦では無関係のため非表示） */
  if (!_isBossBattlePhase()) drawSyncMeter();
  drawSyncJust();

  /* スローハンドバッジ・フィーバーバッジ（最前面・上部中央） */
  drawSlowHandBadge();
  drawFeverBadge();
  drawBeatBonusBadge();
  drawContinueBadge();
}

/* 画面シェイクの合成結果。毎フレーム呼ばれるのでオブジェクトは使い回す
   （_syncColorBuf と同じ流儀。ここで {x,y} を新造するとGCを毎フレーム誘発する） */
const _shakeBuf = { x: 0, y: 0 };
/* このフレームの画面シェイク量を合成して返す。各演出のシェイクは加算で重なる。
   残量（_kingSiftShake / _kingImpactShake）の減衰は update() 側の担当で、ここでは読むだけ
   （draw() の呼ばれ方はフレームレートと追いつき処理で変わるため） */
function _computeScreenShake() {
  let shakeX = 0, shakeY = 0;
  if (hitType === 'gizagiza' && endTimer > 45) {
    const k = Math.min(1, (endTimer-45)/20);
    shakeX = Math.sin(endTimer*4.7)*5*k;
    shakeY = Math.cos(endTimer*3.3)*4*k;
  }
  if (hitType === 'gigigigi' && endTimer > 45) { // ギギギギ: もっと激しい振動
    const k = Math.min(1, (endTimer-45)/15);
    shakeX += (Math.random()-0.5)*14*k;
    shakeY += (Math.random()-0.5)*10*k;
  }
  if (phase === 'reach' && reachTimer > REACH_DECEL_FRAMES) { // リーチ減速後: 微振動
    shakeX += (Math.random()-0.5)*2;
    shakeY += (Math.random()-0.5)*1.5;
  }
  if (_kingSiftShake > 0) { // 篩い落としの打撃感（KING_SIFT_SHAKE_FRAMES参照）
    const k = _kingSiftShake / KING_SIFT_SHAKE_FRAMES;
    shakeX += (Math.random()-0.5) * 3 * k;
    shakeY += (Math.random()-0.5) * 5 * k;
  }
  if (_kingImpactShake > 0) { // 文字が的に着弾した瞬間の衝撃（KING_IMPACT_SHAKE_*参照）
    const k = _kingImpactShake / KING_IMPACT_SHAKE_FRAMES;
    shakeX += (Math.random()-0.5) * KING_IMPACT_SHAKE_AMP * k;
    shakeY += (Math.random()-0.5) * KING_IMPACT_SHAKE_AMP * 1.6 * k;
  }
  _shakeBuf.x = shakeX; _shakeBuf.y = shakeY;
  return _shakeBuf;
}

/* particles: 色×アルファ4段階でバッチ化して1色1fill（GPUフラッシュ最大512→数十回に削減）
   アルファは4段階量子化（フェード25フレームで十分滑らか） */
function _drawParticles() {
  if (particles.length === 0) return;
  ctx.save();
  for (const p of particles) {
    const a = Math.min(0.999, p.life / 25);
    p._ab = (a * 4) | 0; // 0-3
  }
  const nc = _partColorList.length;
  for (let ab = 3; ab >= 0; ab--) {
    ctx.globalAlpha = (ab + 1) / 4;
    for (let ci = 0; ci < nc; ci++) {
      let started = false;
      for (let k = 0; k < particles.length; k++) {
        const p = particles[k];
        if (p._ab !== ab || p.ci !== ci) continue;
        if (!started) { ctx.beginPath(); started = true; }
        const r = Math.max(0.1, p.r);
        ctx.moveTo(p.x + r, p.y);
        ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      }
      if (started) { ctx.fillStyle = _partColorList[ci]; ctx.fill(); }
    }
  }
  ctx.globalAlpha=1; ctx.restore();
}

/* ポーズオーバーレイ（暗幕＋PAUSED＋著作権表示） */
function _drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  /* 実績パネルが開いている間は "PAUSED" テキストを非表示（パネルが全面を覆うため） */
  if (!showAchievements) {
    ctx.fillStyle = 'rgba(245,208,32,0.95)';
    ctx.font = `bold 36px ${FONT_MIN}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(245,208,32,0.4)';
    ctx.fillText('© 2026 Michiyasu ODAKI', W/2, H - 24);
  }
  ctx.restore();
}

/* 画面の内枠に出る2種の演出。どちらも枠を1本描くだけなので同じ場所にまとめる */
function _drawFrameEffects() {
  /* フィーバー内枠: HSL色サイクル＋呼吸パルス */
  if (isFever && phase !== 'startup') {
    const t   = performance.now();
    const hue = (t / 20) % 360;                      // 色相サイクル（約7秒で一周）
    const pulse = 0.7 + 0.3 * Math.sin(t / 260);     // 呼吸（約1.6秒周期、min0.4〜max1.0）
    const lw  = IS_PORTRAIT ? 5 : 7;
    ctx.save();
    ctx.strokeStyle = `hsla(${hue}, 100%, 62%, ${pulse})`;
    ctx.lineWidth   = lw;
    ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
    ctx.restore();
  }

  /* ミュート時ビートパルス: 外枠の太さ変化。
     bgmSourceがある（＝拍位置が実際に進んでいる）ときだけ描くこと。
     getBeatPulseは_bgmAccumStepの積算に依存し、_bgmAccumStepはbgmSourceが無いと早期return
     するため、ソースを破棄しているフェーズ（bossVictory / bossVictoryOutro / trueEnding、
     NO_BGM_SOURCE_PHASES参照）ではパルスが最後の値のまま凍結する。その値が0以外だと
     半透明の金枠が一定の太さで描かれ続け、外枠の色が変わったように見える
     （ミュートを切り替えると出たり消えたりするのはこの枠の描画条件そのもの）。
     実測: ソース破棄の瞬間のpulseが0.9344なら5.6px幅で固定表示され続ける */
  if (audioMuted && phase !== 'startup' && bgmSource) {
    const pulse = getBeatPulse();
    if (pulse > 0) {
      const lw = pulse * 6; // 最大6px
      ctx.save();
      ctx.strokeStyle = _BEAT_BORDER_COLORS[Math.min(31,pulse*31|0)];
      ctx.lineWidth = lw;
      ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
      ctx.restore();
    }
  }
}

function draw() {
  _expirePresses(); // 押下の光の期限切れを1フレーム1回まとめて捨てる
  const shake = _computeScreenShake();

  ctx.save();
  ctx.translate(shake.x, shake.y);

  /* グレースケールフィルター（CSSをcanvas要素に適用）
     ctx.filterはiOS Safari<18未サポートのため、canvas.style.filterを使用
     AudioParam.value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため
     JS 側で管理した grayRateCur を使用 */
  {
    /* グレースケール適用。will-changeはフィルターが掛かっている間だけ付ける:
       常時付けておくとフィルター用の合成パスが維持され、掛かっていない間も
       GPUコストを払う（CSS側の宣言をやめてここで制御しているのはそのため） */
    const rate = Math.max(0.001, Math.min(1, grayRateCur));
    const f = rate >= 0.995 ? '' : `grayscale(${Math.round((1 - rate) * 90)}%)`;
    if (f !== _lastFilter) {
      canvas.style.filter = _lastFilter = f;
      canvas.style.willChange = f ? 'filter' : 'auto';
    }
  }

  /* 背景 + 吉祥雲 + 獅子 + 上下帯: すべて焼き込み済みの静的レイヤー1枚を drawImage
     キャッシュ未構築のフォールバックは通常描画（_mkCache により実質到達しない） */
  if (_staticLayerCanvas) {
    ctx.drawImage(_staticLayerCanvas, 0, 0, W, H);
  } else {
    ctx.fillStyle = bgGradient || '#0f5020'; ctx.fillRect(0,0,W,H);
    for (const c of CLOUDS) drawCloud(c.x,c.y,c.s,c.a,c.r);
    if (!IS_PORTRAIT) {
      ctx.globalAlpha = 0.6;
      drawShishi(78, 360, 0.82, false);
      drawShishi(983, 360, 0.82, true);
      ctx.globalAlpha = 1;
    }
    /* 上下帯 */
    ctx.fillStyle=Y; ctx.fillRect(0,0,W,6); ctx.fillRect(0,H-6,W,6);
    ctx.globalAlpha=0.4; ctx.fillRect(0,8,W,3); ctx.fillRect(0,H-11,W,3); ctx.globalAlpha=1;
  }

  /* 弓 (縦画面のみ) */
  if (IS_PORTRAIT && (phase==='idle'||phase==='reach')) drawBow();

  ctx.textBaseline='alphabetic'; // リセット

  /* ホイール（ボス戦闘中は非表示）。タイトル画面の背景演出だけ、丸いギヨウザロゴに
     差し替える。本来のホイール回転速度(w.speed)は速すぎて文字が読めなくなるため、
     startupTimerとw.speed（ホイールごとに元々ランダムな値）を元にした、読める範囲で
     ゆっくりめの回転角を使う。w.speedを流用することでホイールごとに回転速度がバラバラになる */
  if (!_isBossBattlePhase()) {
    if (phase === 'startup') {
      for (const w of wheels) _drawGyozaCircleLogo(w.x, w.y, WR, 1, startupTimer * w.speed * 0.0375);
    } else {
      const _tW = PERF_ON ? performance.now() : 0;
      for (let i=0;i<4;i++) drawWheel(i);
      if (PERF_ON) _perfMark('whl', _tW);
    }
  }

  /* キングギヨウザ予兆（KING_OMEN_FX_*の定義部参照）。
     ホイールより後に描く＝手前を通す。背景として後ろに回すと縦画面では成立しない:
     縦画面はホイール4枚が画面中央の列を上から下まで占めるので、収束の山場（中心へ寄る
     ところ）がまるごとホイールに隠れる。手前に出すぶん、濃さ（KING_OMEN_FX_ALPHA）を
     背景として読める範囲に抑える */
  if (_omenFx.length > 0) {
    ctx.save();
    for (const o of _omenFx) { ctx.globalAlpha = o.a; drawOneItem(o.g); }
    ctx.restore();
  }

  /* 飛ぶ矢 (3D遠近法) */
  if (phase==='shooting') drawArrow3D();

  _drawParticles();

  /* BETバー: ボス戦闘中はこんがりゲージに差し替え（同じ位置・寸法を共有） */
  if (!_isBossBattlePhase()) {
    const _tBar = PERF_ON ? performance.now() : 0;
    if (IS_PORTRAIT) drawPortraitBottomBar(); else drawBottomBar();
    if (PERF_ON) _perfMark('bar', _tBar);
  }
  drawCoinHeader();

  /* ── レイヤー構成(全当たり共通) ──────────────────
     1. オーバーレイ (暗幕)
     2. エフェクト面  (各当たりの演出)
     3. テキスト最前面
     ─────────────────────────────────────────────── */

  _drawForeground();

  /* ── サウンドテスト／ドラムパッド（全面。ミュート・全画面ボタンだけは上に残す） ── */
  drawSoundTest();
  drawDrumPad();

  if (isPaused) _drawPauseOverlay();

  /* 実績バナー・オーバーレイ（ポーズ暗幕の上に表示） */
  drawAchBanner();
  drawAchOverlay();

  /* ── 最前面のボタン群（トロフィー・真エンディング再生・全画面・ミュート・ポーズ） ── */
  _drawTopButtons();

  _drawFrameEffects();

  ctx.restore(); // end shake

  /* 画面全体フェード: 最前面・シェイク変形の外で描く（余韻を大切にした暗転つなぎ） */
  _drawScreenFade();
  /* デバッグ用タップ式チートパネル（?cheatpanel時のみ、常に最前面） */
  drawCheatPanel();
  /* ?perf 計測オーバーレイ。canvasには描かずDOM要素を更新するだけ（drawPerf参照）。
     draw()の末尾から呼ぶのは、フレームごとに間隔を見て更新するため */
  drawPerf();
  _pumpPressFlash();
}

/* ════════════════ 描画関数群 ════════════════ */

/* ── BETの中央ラベル（"BET" ＋ 数字の横並び）──
   縦横で gap とラベルのフォントサイズだけが違う。合計幅から左端を求めて中央へ置く。
   数字側はプリレンダ済みOC（_ensureBetTextOC）を貼る。
   ラベル幅 _cachedBetLabelW は起動時に画面向きのフォントで一度だけ計測してある
   （_initBetLabelWidth）ので、labelFs を変えるときはそちらも合わせること。
   -4 は数字OCの左に入る余白ぶんの詰め */
function _drawBetCenterLabel(cx, cy, gap, labelFs) {
  ctx.textBaseline = 'middle';
  const wBet = _cachedBetLabelW;  // 起動時に計測済み
  const wNum = _cachedBetNumW;    // bet変化時のみ再計測済み
  const startX = cx - (wBet + gap + wNum) / 2;
  ctx.fillStyle = Y;
  ctx.textAlign = 'left';
  ctx.font = `bold ${labelFs}px ${FONT_MIN}`;
  ctx.fillText('BET', startX, cy);
  const oc = _ensureBetTextOC();
  if (oc) {
    ctx.drawImage(oc, 0, 0, oc.width, _BET_TEXT_H * _dpr,
      startX + wBet + gap - 4, cy - _BET_TEXT_H / 2, oc.width / _dpr, _BET_TEXT_H);
  } else {
    ctx.font = _BET_FONT;
    ctx.fillText(_cachedBetStr, startX + wBet + gap, cy);
  }
}

/* ── BETボタン描画ヘルパー ── */
function _drawBetBtn(rect, label, canChange, fontSize) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fillStyle = canChange ? 'rgba(245,208,32,0.18)' : 'rgba(120,120,120,0.10)'; ctx.fill();
  ctx.strokeStyle = canChange ? 'rgba(245,208,32,0.55)' : 'rgba(120,120,120,0.25)';
  ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = `bold ${fontSize}px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = canChange ? Y : 'rgba(180,180,180,0.35)';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
  if (canChange) _drawPressFlash(rect, 8); // 変えられない状態で光ると「効いた」と誤解させる
}

function drawWheel(i) {
  const w=wheels[i], active=i===curIdx&&(phase==='idle'||phase==='reach');
  /* ビート拍動: アクティブホイールの強調度をキックに合わせてパルス */
  const bp = active ? getBeatPulse() : 0; // 0-1、ビート直後=1
  ctx.save(); ctx.translate(w.x,w.y);
  /* グロー光輪は外周リングを1ストロークするだけにして、GPUブラーパスを1回に抑える。
     **セグメントごとの描画に shadowBlur を効かせてはいけない。**
     fill/stroke/strokeText/fillText すべてに乗るので 8〜12セグ × 4操作 =
     32〜48パス/フレームになり、Input Delay が 17〜27ms 悪化する */
  if (active) {
    if (_wheelGlowSprites) {
      /* プリレンダ済みグロー（bp 8段階量子化）+ クリスプなリング本体 */
      const g = _wheelGlowSprites[Math.min(_GLOW_LEVELS - 1, (bp * _GLOW_LEVELS) | 0)];
      ctx.drawImage(g.oc, -g.half, -g.half);
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
    } else {
      /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.shadowColor=Y; ctx.shadowBlur=50+bp*40;
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
      ctx.shadowBlur=0; // セグメント描画前にリセット
    }
  }

  /* セグメント・文字・ハブ: 事前描画済み OffscreenCanvas を回転して貼る
     文字はホイール中心が下方になるよう _buildWheelOC で固定済み */
  if (w._oc) {
    ctx.save();
    ctx.rotate(w.rot);
    ctx.drawImage(w._oc, -_WHEEL_OC_R, -_WHEEL_OC_R, _WHEEL_OC_R*2, _WHEEL_OC_R*2);
    ctx.restore();
  } else {
    /* フォールバック: OffscreenCanvas 未対応時はパス描画（文字は回転なし） */
    for (const s of w.segs) {
      const a1=s.start+w.rot, a2=a1+s.span, mid=a1+s.span/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,WR,a1,a2); ctx.closePath();
      /* createWheelでは作らない場合があるので、この経路に入った時点で用意する */
      if (!s.gradient) s.gradient = _segFallbackGradient(s.char, s.start + s.span/2);
      ctx.fillStyle=s.gradient; ctx.fill();
      ctx.strokeStyle='rgba(245,208,32,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
      const tx=Math.cos(mid)*WR*0.62, ty=Math.sin(mid)*WR*0.62;
      ctx.save(); ctx.translate(tx,ty);
      ctx.font=s.font; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.88)'; ctx.strokeText(s.char,0,0);
      ctx.fillStyle='#fffde7'; ctx.fillText(s.char,0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle=w.hubGrd; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+4,0,Math.PI*2);
  ctx.strokeStyle=active?Y:YD; ctx.lineWidth=active?4.5+bp*2.5:2; ctx.stroke();
  /* ビート拍動: 外側に広がる拍動リング（テーブルで文字列生成ゼロ） */
  if (bp > 0.01) {
    ctx.beginPath(); ctx.arc(0,0,WR+12+bp*14,0,Math.PI*2);
    ctx.strokeStyle=_BEAT_RING_COLORS[Math.min(31,bp*31|0)]; ctx.lineWidth=2+bp*2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+8,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,0,0.35)'; ctx.lineWidth=1.5; ctx.stroke();


  /* ポインタ三角形: PC=▼(上), 縦=◀(右から左向き)
     プリレンダ済みスプライト（グロー込み）を状態別に選択して drawImage */
  if (_pointerSprites) {
    const sp = w.locked ? _pointerSprites.locked
             : active   ? _pointerSprites.active[Math.min(3, (bp * 4) | 0)]
             : _pointerSprites.inactive;
    ctx.drawImage(sp.oc, sp.ox, sp.oy, sp.w, sp.h);
  } else {
    /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
    if (active || w.locked) {
      ctx.shadowColor = w.locked ? '#ff4422' : Y;
      ctx.shadowBlur  = 18 + bp * 18;
    }
    if (IS_PORTRAIT) {
      ctx.beginPath(); ctx.moveTo(WR+5,0); ctx.lineTo(WR+26,-12); ctx.lineTo(WR+26,12); ctx.closePath();
    } else {
      ctx.beginPath(); ctx.moveTo(0,-WR-5); ctx.lineTo(-13,-WR-28); ctx.lineTo(13,-WR-28); ctx.closePath();
    }
    ctx.fillStyle = w.locked ? '#cc2200' : (active ? Y : YD);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (w.result) {
    /* 結果文字はロック時に一度だけ OC へ焼き込み（グロー＋グリフラスタライズは1回のみ）
       毎フレームは drawImage 1回。ポップ拡縮は drawImage のスケールで再現する */
    if (!w._resOC) _buildResultOC(w);
    const pop=Math.max(0.01,easeOutBack(Math.min(1,w.resultPop)));
    ctx.save();
    if (IS_PORTRAIT) ctx.translate(WR+58, 0); else ctx.translate(0, WR+58);
    ctx.scale(pop,pop);
    if (w._resOC) {
      ctx.drawImage(w._resOC, -_RESULT_OC_HALF, -_RESULT_OC_HALF, _RESULT_OC_HALF*2, _RESULT_OC_HALF*2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      const [fillC, glowC] = _syncBarColor(w.syncScore);
      ctx.font=`bold 44px ${FONT_MIN}`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=glowC; ctx.shadowBlur=10 + w.syncScore * 20;
      ctx.fillStyle=fillC; ctx.fillText(w.result,0,0);
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ── 矢の3D飛翔エフェクト ──────────────────────────────────
   弓道の映像のように矢を横から見た形(矢先→矢柄→矢羽)で描き、
   手前(大)→的(小)へ遠近スケールで縮小して飛ばす。
   矢先は常に的を向く。                                      ── */
function drawArrow3D() {
  const p = arrowProgress;
  if (p <= 0 || p >= 1) return;

  /* 発射から着弾への角度(固定) */
  const angle = Math.atan2(arrowTY - arrowSY, arrowTX - arrowSX);

  /* 残像3枚 + 本体1枚 */
  for (let trail = 3; trail >= 0; trail--) {
    const tp = Math.max(0, p - trail * 0.05);
    if (tp <= 0) continue;

    /* 位置: わずかにeaseして自然な加速感 */
    const ep = Math.pow(tp, 0.88);
    const sx = arrowSX + (arrowTX - arrowSX) * ep;
    const sy = arrowSY + (arrowTY - arrowSY) * ep;

    /* 遠近スケール: 近=3倍大, 遠=等倍 (縦画面は横移動なので等倍固定) */
    const sc = IS_PORTRAIT ? 1.0 : Math.max(1, (1 - tp) * 2 + 1);

    const al = Math.min(1, tp * 8) * (trail === 0 ? 1.0 : 0.22 - trail * 0.06);
    if (al <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(sx, sy);
    ctx.rotate(angle); // 矢先が的方向(+x)を向くよう回転

    /* ── 矢のサイズ(スケール済み) ── */
    const half = 32 * sc;   // 矢の全長の半分
    const tipL = 13 * sc;   // 矢尻から矢先までの長さ
    const tipW =  5 * sc;   // 矢先の幅(半分)
    const fLen = 20 * sc;   // 矢羽の長さ
    const fW   =  9 * sc;   // 矢羽の最大幅
    const sw   = Math.max(1.5, 2.5 * Math.min(sc, 2)); // 矢柄の太さ

    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(half - tipL, 0);
    ctx.lineTo(-half + fLen, 0);
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth   = sw;
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* 矢先(三角形, +x方向が的) */
    ctx.beginPath();
    ctx.moveTo(half, 0);
    ctx.lineTo(half - tipL, -tipW);
    ctx.lineTo(half - tipL,  tipW);
    ctx.closePath();
    ctx.fillStyle = '#1f2937';
    ctx.fill();

    /* 上羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5, -fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#1e40af';
    ctx.fill();

    /* 下羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5,  fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#b91c1c';
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ── 上部コイン表示（常時・大きく） ── */
function drawCoinHeader() {
  _updateDisplayCaches(); // coins/bet/bestCoins の文字列キャッシュを更新（変化時のみ）
  const cx   = W / 2;
  const lowCoins = coins <= 10;
  const blink    = lowCoins ? (Math.floor(Date.now() / 380) % 2 === 0 ? 1 : 0.35) : 1;
  const mainColor = lowCoins ? '#ff7755' : Y;

  ctx.save();
  ctx.globalAlpha = blink;

  /* 背景パネル */
  const pw = COIN_HEADER_W, ph = COIN_HEADER_H, px = cx - pw / 2, py = BTN_TOP;
  roundRect(px, py, pw, ph, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fill();
  ctx.strokeStyle = lowCoins ? 'rgba(200,60,20,0.5)' : 'rgba(245,208,32,0.28)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* ラベル「所持ギヨウザ」- 左上（BESTスコアの対角） */
  ctx.globalAlpha = blink * 0.7;
  ctx.font = `11px ${FONT_MIN}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = mainColor;
  ctx.fillText('所持ギヨウザ', px + 8, py + 6);

  /* コイン数（大）: プリレンダOC を drawImage（静止時のグリフラスタライズをゼロに） */
  ctx.globalAlpha = blink;
  const _cOC = _ensureCoinsTextOC(mainColor);
  if (_cOC) {
    ctx.drawImage(_cOC, 0, 0, _coinsTextW * _dpr, _COINS_TEXT_H * _dpr,
      cx - _coinsTextW / 2, py + ph / 2 - 1 - _COINS_TEXT_H / 2, _coinsTextW, _COINS_TEXT_H);
  } else {
    ctx.font = _COINS_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = mainColor;
    ctx.fillText(_cachedCoinsStr, cx, py + ph / 2 - 1);
  }

  /* ベストスコア（小・右下） */
  if (bestCoins > coins) {
    ctx.globalAlpha = blink * 0.45;
    ctx.font = `10px monospace`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = Y;
    ctx.fillText(_cachedBestStr, px + pw - 8, py + ph - 6);
  }

  ctx.restore();
}

function drawBottomBar() {
  _updateDisplayCaches(); // coins/bet/bestCoins の文字列キャッシュを更新（変化時のみ）
  ctx.save();
  roundRect(BAR_X,BAR_Y,BAR_W,BAR_H,6);
  ctx.fillStyle='rgba(8,40,15,0.75)'; ctx.fill();
  ctx.strokeStyle=YD; ctx.lineWidth=1.5; ctx.stroke();
  ctx.strokeStyle='rgba(200,168,0,0.22)'; ctx.lineWidth=0.8;
  roundRect(BAR_X+4,BAR_Y+4,BAR_W-8,BAR_H-8,4); ctx.stroke();

  /* ── ベット ◀ BET [数字] ▶ （縦画面版と同仕様） ── */
  const btnH = 50, btnY = BAR_Y + (BAR_H - btnH) / 2;
  const cx = W / 2, cy = btnY + btnH / 2;

  const betOn = _betControlsEnabled();
  const canDec = betOn && _cachedBetIdx > 0;
  const canInc = betOn && _cachedBetIdx < BET_OPTIONS.length - 1 && BET_OPTIONS[_cachedBetIdx + 1] <= coins;
  _drawBetBtn(BET_DEC_BTN, '◀', canDec, 26);
  _drawBetBtn(BET_INC_BTN, '▶', canInc, 26);

  _drawBetCenterLabel(cx, cy, 10, 28);

  /* バージョン表示 */
  ctx.font = '11px monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(245,208,32,0.22)';
  ctx.fillText(VERSION, BAR_X + BAR_W - 8, H - 8);

  ctx.restore();
}

/* ── 縦画面専用: 底部 BET コントロール ──

/* ── 縦画面専用: 弓の描画 ── */
function drawBow() {
  /* 弦が左(射手側)、弓本体が右(的方向)に膨らむ正しい向き
     弦の両端 = (bx, by±38)、弓の腹 = bx + bulge の位置 */
  const bx = 30, by = WYS[curIdx];
  const bulge = 28; // 的方向への膨らみ量
  ctx.save();

  /* ── 矢を番えて引き絞った状態 ──
     弓: bx を中心に右(的方向)へ膨らむ ")" 形
     弦: 上端(bx,by-span)→筈(nockX,by)→下端(bx,by+span) のくの字
     矢: 筈(nockX) から右へ伸び、矢羽は筈の直前(矢先側)に配置
         ※ 羽は絶対に nockX より左(弦より奥)には出ない             */
  const pull     = 17;   // 弦の引き量(px)
  const halfSpan = 42;   // 弓の半張り
  const nockX    = bx - pull;          // 筈X = 弦の最も引かれた点
  const tipX     = nockX + 74;         // 矢先X

  /* 弓本体 */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.quadraticCurveTo(bx + bulge, by, bx, by + halfSpan);
  ctx.strokeStyle = '#7a3a0a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  /* 弓ハイライト */
  ctx.beginPath();
  ctx.moveTo(bx + 1, by - halfSpan + 4);
  ctx.quadraticCurveTo(bx + bulge - 5, by, bx + 1, by + halfSpan - 4);
  ctx.strokeStyle = 'rgba(180,100,30,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  /* 弦 (くの字: 上端→筈→下端) */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.lineTo(nockX, by);
  ctx.lineTo(bx, by + halfSpan);
  ctx.strokeStyle = 'rgba(220,190,80,0.92)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();

  /* ── 矢 ── */
  if (phase === 'idle' || phase === 'reach') {
    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(nockX, by);
    ctx.lineTo(tipX - 12, by);
    ctx.strokeStyle = '#c08840'; ctx.lineWidth = 2.2; ctx.lineCap = 'butt'; ctx.stroke();

    /* 矢先 (鋭い三角形) */
    ctx.beginPath();
    ctx.moveTo(tipX,      by);
    ctx.lineTo(tipX - 13, by - 5);
    ctx.lineTo(tipX - 13, by + 5);
    ctx.closePath();
    ctx.fillStyle = '#2a3040'; ctx.fill();

    /* 矢羽: 平行四辺形
       下辺(軸側): vB → vF (矢柄上)
       上辺(外側): 下辺をそのまま筈方向へ shift ずらした辺
       → 横長の長方形を傾けたような不等辺平行四辺形             */
    const vB    = nockX + 3;  // 下辺・後端X
    const vF    = nockX + 13; // 下辺・前端X
    const vH    = 6;          // 羽の張り出し高さ
    const shift = 5;          // 上辺を筈側(左)へずらす量

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(vB,         by);          // 下辺・後端 (軸上)
      ctx.lineTo(vF,         by);          // 下辺・前端 (軸上)
      ctx.lineTo(vF - shift, by + s*vH);  // 上辺・前端 (外側)
      ctx.lineTo(vB - shift, by + s*vH);  // 上辺・後端 (外側)
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,160,160,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
    }

    /* 筈の印 (小さい暗色リング) */
    ctx.beginPath();
    ctx.arc(nockX + 1, by, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#5a3010'; ctx.fill();
  }
  ctx.restore();
}

/* タッチ座標をキャンバス座標に変換 */
function touchToCanvas(touch) {
  return {
    x: (touch.clientX - _canvasRect.left) * (W / _canvasRect.width),
    y: (touch.clientY - _canvasRect.top)  * (H / _canvasRect.height),
  };
}

/* ── エンド画面: オーバーレイのみ ── */
/* リーチ用フリッカーリングのスプライト（初回リーチ時に1回だけ生成、shadowBlur 排除） */
let _reachRingSprite = null;
function _getReachRingSprite() {
  if (_reachRingSprite || !_CACHE_OK) return _reachRingSprite;
  const r = WR + 8, blur = 20;
  const half = Math.ceil(r + blur * 1.6 + 4);
  const oc = _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr); c.translate(half, half);
  c.strokeStyle = 'rgba(245,208,32,0.7)'; c.lineWidth = 4;
  c.shadowColor = Y; c.shadowBlur = blur;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  _reachRingSprite = { oc, half };
  return _reachRingSprite;
}

/* ── リーチ演出: スポットライトオーバーレイ ── */
function drawReachOverlay() {
  const fadeIn = Math.min(1, reachTimer / 35);
  const wx = WXS[3], wy = WYS[3];

  ctx.save();

  /* 暗幕 */
  ctx.fillStyle = `rgba(0,0,0,${0.58 * fadeIn})`;
  ctx.fillRect(0, 0, W, H);

  /* スポットライト (第4ホイール中心に明るい円) */
  const pulse = 0.65 + 0.35 * Math.abs(Math.sin(reachTimer * 0.13));
  const spot  = ctx.createRadialGradient(wx, wy, 0, wx, wy, WR * 2.6);
  spot.addColorStop(0,   `rgba(245,208,32,${0.22 * pulse * fadeIn})`);
  spot.addColorStop(0.5, `rgba(245,208,32,${0.10 * pulse * fadeIn})`);
  spot.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, H);

  /* 減速が完了したらホイール枠をフリッカー
     グロー付きリングはスプライト転写（毎フレームの shadowBlur を排除） */
  if (reachTimer > REACH_DECEL_FRAMES) {
    const flicker = Math.floor(reachTimer / 8) % 2 === 0 ? 1 : 0.5;
    const rs = _getReachRingSprite();
    if (rs) {
      ctx.globalAlpha = flicker * fadeIn; // 基本アルファ0.7はスプライトに焼き込み済み
      ctx.drawImage(rs.oc, wx - rs.half, wy - rs.half, rs.half * 2, rs.half * 2);
      ctx.globalAlpha = 1;
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.beginPath();
      ctx.arc(wx, wy, WR + 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(245,208,32,${0.7 * flicker * fadeIn})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = Y;
      ctx.shadowBlur  = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();
}

/* ── リーチ演出: テキスト ── */
function drawReachText() {
  const fadeIn = Math.min(1, Math.max(0, (reachTimer - 18) / 28));
  if (fadeIn <= 0) return;

  ctx.save();

  /* 「リーチ！」*/
  const pulse = 1 + 0.055 * Math.sin(reachTimer * 0.2);
  ctx.globalAlpha = fadeIn;
  ctx.save();
  ctx.translate(W / 2, 78);
  ctx.scale(pulse, pulse);
  _outTextCached('reach_t', 'リーチ！', `bold 58px ${FONT_MIN}`,
    Y, 'rgba(0,0,0,0.92)', 10, Y, 45, 0, 0);
  ctx.restore();

  /* 減速完了後: 操作を促すサブテキスト */
  if (reachTimer > REACH_DECEL_FRAMES) {
    const blink = 0.45 + 0.45 * Math.sin(reachTimer * 0.15);
    ctx.globalAlpha = blink * fadeIn;
    ctx.font = `bold 22px ${FONT_MIN}`;
    ctx.textAlign = 'center';
    ctx.shadowColor = Y; ctx.shadowBlur = 18;
    outText('矢を放て！', W / 2, 125, '#fffde7', 'rgba(0,0,0,0.85)', 5);
  }

  ctx.restore();
}

/* ── ハズレポップアップ（複数同時表示対応） ── */
function drawMissPopup() {
  if (missPopups.length === 0) return;
  const TOTAL = 120;
  ctx.save();
  ctx.font = `bold 36px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* shadowBlur除去: 黒アウトライン(lw=6)で視認性は確保済み。GPU負荷削減。 */
  for (const p of missPopups) {
    const elapsed = TOTAL - p.timer;
    const t       = elapsed / TOTAL;            // 0→1
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = p.timer < 70 ? p.timer / 70 : 1; // 後半58%をかけてフェードアウト
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 + (0.5 - t) * 90;    // 移動範囲の中心がH/2になるよう配置
    ctx.globalAlpha = alpha * 0.92;
    outText(`－${fmt(p.amt)} ギヨウザ`, W / 2, popY, '#ff7755', 'rgba(0,0,0,0.85)', 6);
  }
  ctx.restore();
}

function drawPayoutPopup() {
  if (payoutPopups.length === 0) return;
  const TOTAL = 150;
  ctx.save();
  ctx.font = `bold 42px ${FONT_MIN}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 30;
  for (const p of payoutPopups) {
    const pt      = p.timer / TOTAL;
    const elapsed = TOTAL - p.timer;
    const fadeIn  = Math.min(1, elapsed / 15);
    const fadeOut = pt < 0.2 ? pt / 0.2 : 1;
    const alpha   = fadeIn * fadeOut;
    const popY    = H / 2 - 60 - (1 - pt) * 30;
    ctx.globalAlpha = alpha * 0.95;
    outText(`＋${fmt(p.amt)}ギヨウザ！`, W / 2, popY, '#ffee44', 'rgba(0,0,0,0.9)', 8);
    if (p.beatBonus) {
      outText('♪BONUS', W / 2, popY + 44, '#fffde7', 'rgba(0,0,0,0.8)', 4);
    }
  }
  ctx.restore();
}

function drawEndOverlay() {
  const alpha = Math.min(1,(endTimer-45)/35);
  /* 大当たりはギヨウザを見せるため薄め、ウザウザも半透明 */
  const overlayAlpha = hitType==='jackpot'  ? alpha*0.48
                     : hitType==='uzauza'   ? alpha*0.55
                     : hitType==='giugiu'   ? alpha*0.30
                     : hitType==='yoyoyoyo' ? alpha*0.65
                     : hitType==='uuuu'     ? alpha*0.72
                     : hitType==='zazazaza' ? alpha*0.60
                     : alpha*0.78;
  ctx.fillStyle=`rgba(5,25,10,${overlayAlpha})`;
  ctx.fillRect(0,0,W,H);
}

/* ── 固定タイトル文字のプリレンダキャッシュ ──
   エンド画面・リーチ演出のタイトルは固定文字列 × 固定スタイルのため、初回使用時にグロー込みで
   OC へ焼き、毎フレームは drawImage 1回にする（shadowBlur は Canvas 2D 最重量級の GPU 操作。
   このプロジェクトでは shadowBlur を毎フレーム描画から全廃する方針）。
   LRU 上限でメモリを制限。OffscreenCanvas 未対応時はパス描画へフォールバック */
const _titleOCCache = new Map(); // key → { oc, w, h }
const _TITLE_CACHE_MAX = 8;
function _titleCachePrune() {
  while (_titleOCCache.size > _TITLE_CACHE_MAX) {
    _titleOCCache.delete(_titleOCCache.keys().next().value); // 最古（先頭）を削除
  }
}
/* outText + shadowBlur 相当をキャッシュ付きで描く。(x,y) はテキスト中心。
   注意: 呼び出し時に ctx.shadowBlur が 0 であること（drawImage にも影が乗るため） */
/* グロー付きテキストを焼くためのOCを用意する（_outTextCached / _bakeGlowStroke 共通）。
   テキストを実測し、グローと縁取りがはみ出すぶんの余白を四方に足した大きさで確保して、
   中央揃え・_dpr スケール済みのコンテキストを返す。
   余白 glowB*1.6 は shadowBlur の実効的な広がりの目安で、切れると角が四角く落ちる。
   呼び出し側は返された c に色と影を設定して text を w/2, h/2 へ描く */
function _mkTextOC(text, font, lw, glowB) {
  ctx.save(); ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  ctx.restore();
  const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
  const pad = Math.ceil(glowB * 1.6 + lw + 8);
  const w = tw + pad * 2, h = fs + pad * 2;
  const oc = _mkCache(w * _dpr, h * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  return { oc, c, w, h };
}

function _outTextCached(key, text, font, fill, stroke, lw, glowC, glowB, x, y) {
  if (!_CACHE_OK) {
    ctx.font = font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = glowC; ctx.shadowBlur = glowB;
    outText(text, x, y, fill, stroke, lw);
    ctx.shadowBlur = 0;
    return;
  }
  let e = _titleOCCache.get(key);
  if (!e) {
    const { oc, c, w, h } = _mkTextOC(text, font, lw, glowB);
    /* outText と同じ順序: 影付き stroke → 影付き fill（グローの重なりを再現） */
    c.shadowColor = glowC; c.shadowBlur = glowB;
    c.lineWidth = lw; c.strokeStyle = stroke;
    c.strokeText(text, w / 2, h / 2);
    c.fillStyle = fill;
    c.fillText(text, w / 2, h / 2);
    e = { oc, w, h };
  } else {
    _titleOCCache.delete(key); // LRU: 再挿入で最新化
  }
  _titleOCCache.set(key, e);
  _titleCachePrune();
  ctx.drawImage(e.oc, x - e.w / 2, y - e.h / 2, e.w, e.h);
}
/* 超大当たり専用: フィル色がアニメーションするため「グロー+縁取り」だけ焼く。
   shadowOffset トリックで stroke/fill 両方の影のみ抽出し、フィルは毎フレーム上描きする */
function _bakeGlowStroke(key, text, font, stroke, lw, glowC, glowB) {
  const { oc, c, w, h } = _mkTextOC(text, font, lw, glowB);
  const OFF = 4096; // 本体を画面外へ追い出して影だけスプライト内に落とす
  c.shadowColor = glowC; c.shadowBlur = glowB; c.shadowOffsetX = OFF;
  c.lineWidth = lw; c.strokeStyle = stroke;
  c.strokeText(text, w / 2 - OFF, h / 2);
  c.fillStyle = '#fff';
  c.fillText(text, w / 2 - OFF, h / 2);
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0;
  c.strokeText(text, w / 2, h / 2);
  const e = { oc, w, h };
  _titleOCCache.set(key, e);
  _titleCachePrune();
  return e;
}

/* ゲームオーバー演出（暗幕＋タイトル＋点滅する再開案内）。通常モードのコイン枯渇時
   （drawEndScreen）とキングギヨウザ戦の没収で所持ギヨウザが尽きた場合（drawBossDefeat）の
   両方から、同じメッセージ・同じ待ち方で呼ぶ共通実装。所持ギヨウザが0になったときの体験は
   経路によらず同じにする。
   timerは呼び出し元の経過フレーム数（通常はendTimer、ボス戦は_bossDefeatTimer）、
   canProceedは再開案内を出してよいか（通常はcanRestart相当） */
function _drawGameOverTitle(alpha, timer, canProceed) {
  ctx.save();

  /* 赤い暗幕（フェードイン） */
  ctx.globalAlpha = alpha * 0.72;
  ctx.fillStyle = 'rgba(60,0,0,1)';
  ctx.fillRect(0, 0, W, H);

  /* タイトルテキスト（ゆらゆら揺れる） */
  const shake = timer > 10 ? 0 : (10 - timer) * 1.5;
  const sx = (Math.random() - 0.5) * shake;
  const sy = (Math.random() - 0.5) * shake;
  ctx.globalAlpha = alpha;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (IS_PORTRAIT) {
    /* 縦画面は幅420pxのため2行に分割
       行間0.3行分（行高44px × 1.3 = 57px間隔）
       描画順: 下行→上行で「ギヨウザが」を前面に */
    const goFs   = 44;
    const goLine = Math.round(goFs * 1.3); // 行中心間距離 ≈ 57px
    const goY1   = H / 2 - goLine / 2 - 30;    // 「ギヨウザが」中心（30px上げ）
    const goY2   = H / 2 + goLine / 2 - 30;    // 「なくなりました」中心（30px上げ）
    const goFont = `bold ${goFs}px ${FONT_MIN}`;
    _outTextCached('go_t2', 'なくなりました', goFont,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, goY2); // 先に描画
    _outTextCached('go_t1', 'ギヨウザが', goFont,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, goY1); // 後に描画→前面
  } else {
    _outTextCached('go_t', 'ギヨウザがなくなりました', `bold 56px ${FONT_MIN}`,
      '#ff8866', 'rgba(40,0,0,0.95)', 9, '#ff2200', 50, W/2, H/2 - 30);
  }
  ctx.restore();

  /* 再スタート案内（点滅） */
  if (canProceed) {
    const blink = 0.45 + 0.45 * Math.sin(timer * 0.1);
    ctx.globalAlpha = blink * alpha;
    ctx.shadowBlur = 0;
    ctx.font = `bold 22px ${FONT_MIN}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    outText(
      'ギヨウザを10パック買って出直す',
      W/2, H/2 + (IS_PORTRAIT ? Math.round(44 * 1.3 / 2 + 44 - 30 + 20) : 55),
      '#ffe0d0', 'rgba(0,0,0,0.85)', 5
    );
  }
  ctx.restore();
}

/* ── エンド画面: テキスト最前面 ── */
/* ── 中当たり・小当たりの決着表示（drawEndScreen）──
   段位（中当たり／小当たり）とかなの2行を、当たり種ごとの色と動きで見せる。
   構造は9種で共通なので表に持たせ、当たり種を追加するときはここへ1行足すだけにする
   （分岐を書き足す形にすると、行の配置やフォントを変えたときに直し漏れる）。
   key        _outTextCached のキャッシュキー接頭辞（`_t` 見出し / `_s` かな）
   tier/kana  2行の文言
   stroke     見出しの縁取り色（かなは kanaStroke。同系でアルファだけ薄い）
   glow       2行に共通のグロー色。tierGlowB / kanaGlowB がその強さ
   motion     endTimer から求める変形。dx/dy=平行移動、sx/sy=拡縮（省略時は等倍）。
              大当たり・超大当たりは光輪とグラデーションで構造から違うので表には載せない */
const END_HIT_STYLES = {
  gizagiza: { key: 'gz', tier: '小当たり', kana: 'ギ ザ ギ ザ',
    tierFill: '#c0d8f0', kanaFill: '#e8f4ff',
    stroke: 'rgba(0,20,60,0.9)',  kanaStroke: 'rgba(0,20,60,0.85)',
    glow: '#c0d8f0', tierGlowB: 50, kanaGlowB: 20,
    motion: t => { const p = 1 + 0.05 * Math.sin(t * 0.10); return { sx: p, sy: p }; } },
