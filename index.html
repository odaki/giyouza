      if (o.step === 5) {
        /* 収束開始: 画面外から霊ギヨウザが逆流 */
        playSE('boss_flash');
        const R = Math.hypot(W, H) * 0.6;
        for (let i = 0; i < 44; i++) {
          const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2;
          o.items.push(makeItem(W/2 + Math.cos(ang)*R, H/2 + Math.sin(ang)*R, 0, 0));
        }
      }
    }
  } else if (o.step === 5) {
    /* 中央へ収束 */
    const cx = W/2, cy = H/2 - (IS_PORTRAIT ? 60 : 0);
    for (const g of o.items) {
      g.x += (cx - g.x) * 0.06;
      g.y += (cy - g.y) * 0.06;
      g.rot += 0.15;
    }
    if (o.timer > 110) {
      o.step = 6; o.timer = 0; o.flash = 1;
      for (const g of o.items) g._dead = true;
      o.items = [];
      grayRateTarget = 1.0; // 誕生の瞬間、色が世界に戻る（ボスの金色を際立たせる）
      playSE('king_appear'); // バーン+ドラの派手な一撃（ユーザー要望、_playDoraHit参照）
    }
  } else if (o.step === 6) {
    /* 誕生フラッシュ+タイトル */
    if (o.timer > 90) { o.step = 7; o.timer = 0; }
  }
  /* step7: ボス鎮座（handleGameClick がタップで _initBossBattle を呼び戦闘開始） */
}

/* ボス戦闘系フェーズ（bossOmenは含まない: 予兆中はホイール等の通常UIをまだ
   表示するため）。通常UI（ホイール・BETバー・シンクメーター等）の表示ガードは
   必ずこの述語を使うこと。以前は6項目のphase比較チェーンを各ガードにコピー
   していたため、新フェーズ追加時（bossShatter等）の広げ忘れが実バグになった
   （drawSlowHandBadgeのコメント参照）。一元化により全ガードへ同時反映される */
const BOSS_BATTLE_PHASES = new Set(
  ['boss', 'bossShatter', 'bossVictory', 'bossVictoryOutro', 'trueEnding',
   'bossDefeat', 'bossDefeatShrink', 'bossDefeatOutro']);
function _isBossBattlePhase() { return BOSS_BATTLE_PHASES.has(phase); }

/* bgmSourceを完全に破棄したまま維持するフェーズ（togglePause参照）。
   boss/bossShatter/bossDefeat系はstopBGMTapeでソースを極低速のまま生かして
   いるため一時停止からの復帰でそのまま再開できるが、bossVictory（勝利
   ファンファーレ用に_stopBossBGMForVictoryで破棄）とtrueEnding（専用の
   オシレーターテーマのみでbgmSourceを使わない）はソースが存在しない前提の
   フェーズなので、ポーズ解除時に通常/ボスBGMを新規作成してはいけない。
   bossVictoryOutro（飛び去り演出）も同様。ここは意図的に無音を保ち、復帰時の
   テープ加速（tapestart）で世界が動き出す対比を作っている区間なので、
   ポーズ→再開でBGMが鳴り出すと演出が壊れる */
const NO_BGM_SOURCE_PHASES = new Set(['bossVictory', 'bossVictoryOutro', 'trueEnding']);

/* 戦闘終了（勝利後）→ 通常モードへ復帰。ゲームオーバー復帰と同じテープ加速演出を再利用 */
/* キング戦終了時に必ず必要な後片付け（的OC解放・king関連stateの初期化）。
   通常モード復帰（_kingBattleEnd、勝敗問わず・2回目以降の無演出勝利含む）と、
   真エンディング終了後の復帰（_finishTrueEnding、常にstartupへ戻る）の
   両方から呼ぶ共通処理として切り出した */
function _cleanupKingBattleState() {
  if (_king) _releaseKingReelOCs(_king.reels); // 最後の4的のOCをプールへ返却（リーク防止）
  _king = null; _kingLasers = []; _kingCharFlights = [];
  _victorySteam = []; // 湯気（勝利専用の独立配列、共有particlesは使わない）
  _bossBgmPendingTier = null; // 予約中の地鳴り段階切り替えを破棄（次戦は_initBossBattleでtier0から）
  _kingSiftShake = 0;            // 篩い落としの画面揺れ残量（_kingはnull化されるがこれはモジュール変数）
  _kingImpactShake = 0;          // 着弾の画面揺れ残量（同上）
  if (_omen) { for (const g of _omen.items) g._dead = true; }
  _omen = null;
  if (_defeatOutro) { for (const g of _defeatOutro.items) g._dead = true; }
  _defeatOutro = null;
  /* 達成側の退場演出も同様にプールへ返却する（水平展開。返し忘れると
     _itemAllocのプールが枯れてリークになる） */
  if (_victoryOutro) {
    for (const g of _victoryOutro.items) g._dead = true;
    if (_victoryOutro.seedItem) _victoryOutro.seedItem._dead = true;
  }
  _victoryOutro = null;
}

function _kingBattleEnd() {
  _cleanupKingBattleState();
  /* 敗北の没収で所持ギヨウザが尽きた場合は、通常モードでコインが尽きた時と
     同じゲームオーバー画面（「ギヨウザがなくなりました」＋CONTINUEタップで
     gameOverReset）を経由させる（ユーザー要望: 「所持ギヨウザが0になる場合、
     キングギヨウザが戻って飛んでいく演出を優先してください。その後、
     所持ギヨウザ0のゲームオーバー演出に進んでください」）。ここで即座に
     gameOverReset()を呼ぶと画面を見せないまま再スタートしてしまうため、
     通常モードのisGameOver検出と同じ状態（phase='done'、endTimerから
     canRestartが45フレーム後に立ち上がる、drawEndScreen参照）を作って
     引き継ぐ。実際のリセット（gameOverReset）はそのCONTINUEタップ時に
     handleGameClickのphase==='done'分岐から呼ばれる（通常モードと共通）。
     勝利側から呼ばれた場合はcoinsが減ることがないため常にfalseで無関係 */
  if (coins <= 0) {
    isGameOver = true;
    endTimer = 0; canRestart = false; _continueShowDelay = 0;
    grayRateTarget = 0.001; // 通常モードのコイン枯渇と同じグレーアウト
    stopBGMTape(); // 同じくテープストップでBGMをフェードアウト
    phase = 'done';
    return;
  }
  _restartToTapestart();
  /* 実機報告で発覚: _restartToTapestart→init(fromGameOver=true)は通常の
     ゲームオーバー復帰と同じ経路を共有しており、そちらの仕様（"ゲームオーバー
     リカバリー後もBET対応速度へ"）に従って無条件でスローハンドの抽選を行う。
     このためキング戦からの復帰（勝敗問わず）直後に、無関係な抽選で
     スローハンドが発動しバッジが表示されることがあった。キングギヨウザ戦
     という特別な文脈からの復帰直後に、無関係な確率イベントで割り込まれるのは
     不適切なため、キング戦復帰では常に通常速度で始まるよう明示的に抑制する
     （通常のgameOverResetにはこの抑制を入れない＝既存仕様を維持） */
  isSlowSpin = false;
  _slowSpinPending = null;
}

/* こんがりしっぱい（全損には至らない敗北）から通常モードへ戻る前のつなぎ演出。
   誕生演出（ギヨウザが収束してキングになる）の逆再生イメージで、キングの姿が
   ふつうのギヨウザ群へ弾け散り、そのあと誕生演出と同じ台詞スタイルで
   メッセージを出してから復帰する（ユーザー要望） */
/* 誕生演出（_updateBossOmen step5: バラバラのギヨウザが中心へ収束してキングになる）
   の「純粋な逆回し」（ユーザー要望: 重力落下ではなく、渦を巻きながら中心から
   外へ拡散していく、収束演出そのものの巻き戻しにしたい）。
   同じ中心・同じ半径・同じ収束係数・同じフレーム数を使い、1フレームごとの
   更新式を厳密に逆算する:
     収束(forward): pos = c + (pos-c)*(1-K)  ⇔  拡散(reverse): pos = c + (pos-c)/(1-K)
   これを110フレーム続けると、収束後に残るごく小さな半径(startR)から
   出現時の半径R(=Math.hypot(W,H)*0.6、step5と同値)までを寸分違わず逆再生する。 */
const _DEFEAT_OUTRO_K = 0.06;      // _updateBossOmen step5 の収束係数と同値
const _DEFEAT_OUTRO_FRAMES = 110;  // 同 step5 の収束フレーム数と同値
/* 締めのメッセージ（_DEFEAT_OUTRO_LINES）の見せ方。ユーザー要望により
   「ちからが とけて……／かえっていった……」を1行ずつ順に出すのをやめ、
   2行まとめて1つのメッセージとして扱う。フェードイン・フェードアウトも
   行ごとではなく全体で1回ずつ（誕生予告drawBossOmenの「過去行を薄く残して
   積んでいく」見せ方とは意図的に別物にする）。
   HOLDは全文を表示したまま保持する長さ。
   フェードアウトはイン側と同じ長さでは短すぎて余韻が残らないという指摘を
   受け、イン側と分離して3倍の長さでゆっくり消えるようにした。さらに
   easeOutカーブ（_easeF参照）を掛けることで、消え際の薄い状態が長く尾を
   引くようにしている（線形だと最後まで一定速度で消えて余韻が出にくい） */
/* ── 締めメッセージの尺は「目標の表示秒数」を直接持つ ──
   ここは変遷が長いので経緯を残す。もともと失敗側の固定値（保持96フレーム等）を
   達成側がそのまま共有していたため、文章量が1.7倍ある達成側が読み終わらない
   という実機指摘があった（失敗18文字・縦画面2行／達成31文字・縦画面4行）。
   そこで一度は「文字数と行数から読解時間を算出する」モデルに変えたが、その後
   「失敗はおよそ3秒、達成はおよそ6秒」という目標尺の指定を重ねて受けた結果、
   2つの目標を2つの係数で通すために1文字186ms・下駄-125という意味を持たない
   値になり、モデルとして破綻した（文字数比1.72倍に対して時間が2倍という関係を
   直線で通そうとしたため）。
   そこで係数による間接的な調整をやめ、目標の表示秒数そのものを定数として持つ形に
   組み替えた。保持時間は
     保持 = 目標フレーム数 - フェードイン - フェードアウト
   の引き算で求める。利点:
   - 定数がそのまま仕様（「達成は6秒」）を表すので、次に尺を変えたいときは
     この秒数だけ触ればよく、係数を連立で解き直す必要がない。
   - 文言を差し替えても目標秒数は変わらない＝尺が勝手にずれない。
     （文字数に応じて動くのはフェードアウトの長さだけになり、その分だけ保持が
      自動的に詰まって合計は目標どおりに保たれる） */
const _OUTRO_MSG_FADE_IN = 22;          // 登場（両者固定）
/* 目標の表示秒数（フェードイン開始からフェードアウト終了まで）。ユーザー指定。
   ここが仕様の本体なので、尺を変えたいときはこの2つだけを触る */
const _OUTRO_MSG_TARGET_SEC_DEFEAT  = 3.0; // こんがり失敗の締め
const _OUTRO_MSG_TARGET_SEC_VICTORY = 6.0; // こんがり達成（キングクリア）の締め
/* 保持時間の下限。フェードだけで目標秒数を食い潰すほど極端に長い文言に
   差し替えた場合の保険（引き算の結果が0以下になりうる）。その場合だけは
   合計が目標秒数を超える＝読ませることを優先する */
const _OUTRO_MSG_HOLD_MIN      = 40;
/* フェードアウト（余韻）の長さは文章量で伸ばす。長い文なら締めもゆったりする
   のが自然なため。合計は目標秒数に固定されるので、ここが伸びたぶんは保持から
   引かれる（＝余韻と静止表示の配分が文章量で変わる） */
const _OUTRO_MSG_FADE_OUT_BASE     = 40;
const _OUTRO_MSG_FADE_OUT_PER_CHAR = 1.45;

/* 表示行の総文字数（空白は読解負荷に数えないので除く。「……」は意図した
   一拍の間なので1文字ぶんずつ数える） */
function _outroMsgCharCount(lines) {
  return lines.reduce((n, t) => n + t.replace(/[\s　]/g, '').length, 0);
}
/* 折り返し済みの表示行と目標秒数から尺を確定させる。演出開始時に1度だけ呼んで
   状態に持たせる（毎フレーム計算しない。折り返し自体も同じ方針。_wrapOutroLines参照）。
   targetSec は _OUTRO_MSG_TARGET_SEC_DEFEAT / _VICTORY のどちらかを呼び出し側が渡す。
   保持は目標からフェード2つを引いた残りなので、合計は必ず目標秒数に一致する
   （唯一の例外はフェードだけで目標を超えてしまう極端に長い文言で、その場合は
   下限が効いて目標を超える＝読ませることを優先する） */
function _makeOutroMsgTiming(msgLines, targetSec) {
  const chars   = _outroMsgCharCount(msgLines);
  const fadeIn  = _OUTRO_MSG_FADE_IN;
  const fadeOut = Math.round(_OUTRO_MSG_FADE_OUT_BASE + _OUTRO_MSG_FADE_OUT_PER_CHAR * chars);
  const total   = Math.round(targetSec * 60); // 60fps基準のフレーム数へ
  return {
    fadeIn, fadeOut,
    hold: Math.max(_OUTRO_MSG_HOLD_MIN, total - fadeIn - fadeOut),
  };
}
/* 締めメッセージのフェードイン→保持→フェードアウトを1フレーム進め、
   o.msgAlpha を確定させる（update で状態を決めて draw は読むだけ、という
   このプロジェクトの分離方針）。戻り値=消えきったか。
   達成側・失敗側で同一の式だったものを一本化した。以前は同じ式を2箇所へ
   コピーしていたため、達成側が失敗側の尺をそのまま引き継いでいることに
   気づきにくく、実際に今回の「読む時間が足りない」不具合につながった。
   消え際に薄いまま長く尾を引かせるため easeOut を掛ける（線形だと一定速度で
   消えてしまい余韻が出ない） */
function _advanceOutroMsg(o) {
  const T = o.msgTiming;
  const fadeOutStart = T.fadeIn + T.hold;
  if (o.timer < T.fadeIn) {
    o.msgAlpha = o.timer / T.fadeIn;
  } else if (o.timer < fadeOutStart) {
    o.msgAlpha = 1;
  } else {
    const p = Math.min(1, (o.timer - fadeOutStart) / T.fadeOut);
    o.msgAlpha = Math.max(0, 1 - _easeF(p, 'easeOut'));
  }
  return o.timer > fadeOutStart + T.fadeOut;
}

/* 締めメッセージを描く（達成側・失敗側で共通）。色だけが呼び出し側の指定で、
   フォント・行間・中央揃えの基準・透明度の扱いはすべて共通。
   一本化した理由: 以前はdrawBossDefeatOutroとdrawBossVictoryOutroに色以外
   まったく同一のブロックが複製されていた。update側（_advanceOutroMsg）は
   一本化済みだったが描画側が残っており、実際にこの重複が原因の不具合を
   一度出している（達成側の文言が縦画面で横からはみ出た＝片側しか折り返しを
   考慮していなかった）。配置やフォントを変えるときに片側だけ直す事故を
   構造的に防ぐ。
   誕生予告（drawBossOmen）は行を1つずつ積み上げ過去行を薄く残す見せ方だが、
   こちらは全行を1つのメッセージとして同時に出す（ユーザー要望）。
   位置も誕生予告とは別建て: 誕生予告は4行ぶんを見込んでH*0.30から始めるが、
   こちらは行数が少なく同じ開始位置だと画面上寄りに偏って見える（実機指摘）。
   画面に固定のボスが居ないぶん余裕があるため、全行の中心が画面中央(H/2)に
   来るよう配置し、行数が少ない分フォントも大きくする。
   行数は文言と画面幅で変わるので、中央揃えの基準は実際の行数から求める */
function _drawOutroMsg(o, fillColor, shadowColor) {
  if (!(o.msgAlpha > 0)) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lineDy = _outroMsgFontSize() * 2.2;
  const lines  = o.msgLines;
  const lineY0 = H / 2 - lineDy * (lines.length - 1) / 2;
  ctx.font = _outroMsgFont(); // 折り返し計測と同一の書式（_outroMsgFont参照）
  ctx.globalAlpha = o.msgAlpha;
  lines.forEach((line, i) => outText(line, W / 2, lineY0 + i * lineDy, fillColor, shadowColor, 6));
  ctx.globalAlpha = 1;
}

/* キングギヨウザ縮小ブリッジ（_startBossDefeatShrink）用の定数。
   KING_DEFEAT_SHRINK_SCALE: 縮小目標スケール。アイテム1個の見た目サイズ
   （makeItem の size=34〜42px）÷ キング全幅（half*2、縦画面300*0.75*2=450px・
   横画面380*0.75*2=570px）から逆算した約0.075。0.02のような極端な値にすると
   ギヨウザの集合体より先に見えなくなってしまい「小さくなりすぎている」という
   実機指摘の原因になっていた（クロスフェード前提でも、フェード開始時点で
   両者のサイズ感が合っていないと違和感が残る）。
   KING_DEFEAT_XFADE_START_DSCALE: このdscaleまで縮んだらクロスフェード開始。
   KING_DEFEAT_XFADE_FRAMES: クロスフェードの長さ（フレーム数）。 */
const KING_DEFEAT_SHRINK_SCALE = 0.075;
const KING_DEFEAT_XFADE_START_DSCALE = 0.18;
const KING_DEFEAT_XFADE_FRAMES = 20;
let _bossDefeatXfade = 0; // 0=キングのみ表示 〜 1=ギヨウザ群のみ表示

/* 画面全体フェード（汎用）: phase切り替えの継ぎ目を暗転でつなぐ演出。
   ユーザー要望: 「かえっていった……」のあと通常モードへ戻る画面をフェードアウト・
   フェードインでつなぎ、余韻を残したい。暗転が最大になった瞬間にonMidを呼んで
   実際のphase切り替え（_kingBattleEnd等の重い処理）を行い、その後フェードインする
   ことで、切り替えの瞬間を暗闇の中に隠す（どのphaseから呼んでも使える汎用実装） */
const _SCREEN_FADE_FRAMES = 35;
let _screenFade = null; // { stage:'out'|'in', timer, alpha, onMid }
function _startScreenFade(onMid, frames = _SCREEN_FADE_FRAMES) {
  if (_screenFade) return; // 多重起動防止（連打でフェードが再スタートしないように）
  _screenFade = { stage: 'out', timer: 0, frames, alpha: 0, onMid };
}
function _updateScreenFade() {
  const f = _screenFade;
  f.timer++;
  if (f.stage === 'out') {
    f.alpha = Math.min(1, f.timer / f.frames);
    if (f.timer >= f.frames) {
      f.onMid?.();
      f.stage = 'in'; f.timer = 0;
    }
  } else {
    f.alpha = Math.max(0, 1 - f.timer / f.frames);
    if (f.timer >= f.frames) _screenFade = null;
  }
}
function _drawScreenFade() {
  if (!_screenFade || _screenFade.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = _screenFade.alpha;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ギヨウザ群の弾け散りアイテムを生成する（位置のみ確定、まだ動かさない）。
   _startBossDefeatShrinkでのクロスフェード表示・_updateBossDefeatOutroでの
   拡散アニメの両方が同じ_defeatOutro.itemsを参照するため、生成は一箇所に
   まとめる（クロスフェード用に別配列を作って後で捨てると_itemAllocの
   プール返却漏れ＝リークになるため、必ず単一の配列を使い回す） */
function _makeDefeatOutroItems() {
  const cx = W / 2, cy = H / 2 - (IS_PORTRAIT ? 60 : 0); // step5の収束先と同値
  const R = Math.hypot(W, H) * 0.6; // step5の出現半径と同式
  const startR = R * Math.pow(1 - _DEFEAT_OUTRO_K, _DEFEAT_OUTRO_FRAMES); // 収束後に残る半径
  const items = [];
  for (let i = 0; i < 44; i++) {
    const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2; // step5と同じ角度配分
    items.push(makeItem(cx + Math.cos(ang) * startR, cy + Math.sin(ang) * startR, 0, 0));
  }
  /* 締め2行は画面幅に収まるよう折り返しておく（_wrapOutroLines参照）。
     尺は目標秒数（_OUTRO_MSG_TARGET_SEC_DEFEAT）から逆算する。折り返し後の
     文字数はフェードアウト長にだけ効く（_makeOutroMsgTiming参照） */
  const msgLines = _wrapOutroLines(_DEFEAT_OUTRO_LINES);
  return { step: 0, timer: 0, items, cx, cy, msgAlpha: 0,
           msgLines, msgTiming: _makeOutroMsgTiming(msgLines, _OUTRO_MSG_TARGET_SEC_DEFEAT) };
}

/* こんがりしっぱい画面（bossDefeat, CONTINUEタップ後）から、ギヨウザ群への
   弾け散り演出（bossDefeatOutro）へ切り替える前段。当初は縮小しきったところで
   瞬時にphaseを切り替えるだけだったが、「紙芝居のめくりのように感じる」
   「キングギヨウザが小さくなりすぎている」という実機指摘を受けて、
   (1) 縮小目標スケールをアイテム1個ぶんの見た目サイズに合わせ、
   (2) 縮小の終盤でキング（フェードアウト）とギヨウザ群（フェードイン）を
   一定フレームだけ重ねて描く、の2点で滑らかな切り替えに変更した。
   誕生演出・戦闘位置移行・勝利拡大と同じ_easeKingXformの指数収束はそのまま
   再利用し、キングギヨウザを等倍から弾け散り開始位置（中心=_defeatOutroの
   cx,cy）へ縮小・移動させる */
function _startBossDefeatShrink() {
  phase = 'bossDefeatShrink';
  _bossDefeatShrinkTimer = 0;
  _bossDefeatXfade = 0;
  if (_king) {
    _king.bx = W / 2;
    _king.by = H / 2 - (IS_PORTRAIT ? 60 : 0); // _defeatOutroのcx,cyと同値
    _king.scale = KING_DEFEAT_SHRINK_SCALE;
  }
  /* ギヨウザ群はこの時点で生成し、位置を確定させておく（クロスフェード中は
     静止したまま）。拡散運動は_updateBossDefeatOutroに入ってから始まる */
  _defeatOutro = _makeDefeatOutroItems();
}

function _updateBossDefeatShrink() {
  _bossDefeatShrinkTimer++;
  _updateKingCommonFx();
  /* dscaleが目標近くまで縮んだらクロスフェードを開始し、キングとギヨウザ群を
     一定フレームかけて滑らかに入れ替える */
  if (_king && _king.dscale <= KING_DEFEAT_XFADE_START_DSCALE) {
    _bossDefeatXfade = Math.min(1, _bossDefeatXfade + 1 / KING_DEFEAT_XFADE_FRAMES);
  }
  /* クロスフェード完了で本体を消して弾け散り演出へ。収束が遅れた場合の保険として
     上限フレームも設ける（万一到達しなくても同じ画面に留まり続けないように） */
  if (!_king || _bossDefeatXfade >= 1 || _bossDefeatShrinkTimer > 60) {
    if (_king) _releaseKingReelOCs(_king.reels); // 的OCをプールへ返却（リーク防止・水平展開）
    _king = null; _kingLasers = []; _kingCharFlights = []; // 弾けた瞬間に本体は消える
    phase = 'bossDefeatOutro';
    playSE('boss_flash');
  }
}

function drawBossDefeatShrink() {
  if (phase !== 'bossDefeatShrink') return;
  ctx.save();
  ctx.fillStyle = 'rgba(30,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    ctx.save();
    ctx.globalAlpha = 1 - _bossDefeatXfade;
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 1 - _bossDefeatXfade;
    drawKingCharFlights();
    ctx.restore();
  }
  if (_defeatOutro && _bossDefeatXfade > 0) {
    ctx.save();
    ctx.globalAlpha = _bossDefeatXfade;
    for (const g of _defeatOutro.items) drawOneItem(g);
    ctx.restore();
  }
  ctx.restore();
}

function _updateBossDefeatOutro() {
  const o = _defeatOutro;
  if (!o) { phase = 'idle'; return; }
  /* この時点で_kingはnull・飛翔/レーザーも空なので実質no-opだが、キング戦系
     フェーズは例外なく共通FXを呼ぶ形に揃えておく（将来この演出中まで残る
     オブジェクトが増えたときに、ここだけ更新漏れになるのを防ぐ） */
  _updateKingCommonFx();
  o.timer++;
  /* step5の収束式 pos=c+(pos-c)*(1-K) を厳密に逆算した拡散式（重力は使わない） */
  const inv = 1 / (1 - _DEFEAT_OUTRO_K);
  for (const g of o.items) {
    g.x = o.cx + (g.x - o.cx) * inv;
    g.y = o.cy + (g.y - o.cy) * inv;
    g.rot -= 0.15; // step5の回転(+0.15)を逆再生
  }
  if (o.step === 0) {
    /* step0: ギヨウザ群の拡散のみ。拡散しきってからメッセージへ移る */
    if (o.timer > _DEFEAT_OUTRO_FRAMES) { o.step = 1; o.timer = 0; }
  } else {
    /* step1: 2行を1つのメッセージとしてまとめて フェードイン→保持→フェードアウト。
       行ごとの出し分けはしない。尺は目標秒数から逆算済み（_makeOutroMsgTiming参照） */
    const done = _advanceOutroMsg(o);
    /* フェードアウトしきったら、タップ待ちにせず時間経過で自動的に通常モードへ
       戻る（ユーザー要望: CONTINUE待ちは不要、時間で進んで良い）。
       _startScreenFadeは多重起動防止済みなので、フェード開始後も毎フレーム
       この条件を満たし続けて構わない */
    if (done) _startScreenFade(() => _kingBattleEnd());
  }
}

function drawBossOmen() {
  if (phase !== 'bossOmen' || !_omen) return;
  const o = _omen;
  ctx.save();
  /* 暗幕 */
  const dark = (o.step === 0 ? Math.min(1, o.timer / 50) : 1) * 0.88;
  ctx.fillStyle = `rgba(2,4,8,${dark})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 台詞（過去行は薄く残して積む） */
  if (o.step >= 1 && o.step <= 4) {
    const fsL = IS_PORTRAIT ? 22 : 26;
    const lineY0 = H * 0.30, lineDy = fsL * 2.2;
    ctx.font = `bold ${fsL}px 'Hiragino Mincho ProN',serif`;
    for (let i = 0; i < o.step && i < _OMEN_LINES.length; i++) {
      const isCur = (i === o.step - 1);
      ctx.globalAlpha = isCur ? Math.min(1, o.timer / 20) : 0.5;
      const col = i === 3 ? '#ff6655' : '#e8e2d0';
      outText(_OMEN_LINES[i], W/2, lineY0 + i*lineDy, col, 'rgba(0,0,0,0.9)', 6);
    }
    ctx.globalAlpha = 1;
  }
  /* 収束する霊ギヨウザ */
  if (o.step === 5) for (const g of o.items) drawOneItem(g);
  /* 誕生〜鎮座 */
  if (o.step >= 6 && _bossOC) {
    const bx = W/2, by = H/2 - (IS_PORTRAIT ? 60 : 0);
    const appear = o.step === 6 ? Math.min(1, o.timer / 25) : 1;
    const breath = 1 + 0.02 * Math.sin(performance.now() / 300);
    const k = appear * breath;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(k, k);
    ctx.drawImage(_bossOC.oc, -_bossOC.half, -_bossOC.half, _bossOC.half*2, _bossOC.half*2);
    ctx.restore();
    ctx.font = `bold ${IS_PORTRAIT ? 28 : 40}px 'Hiragino Mincho ProN',serif`;
    outText('キングギヨウザ とうじょう！！', W/2, by - _BOSS_S*0.62,
      '#ffdd55', 'rgba(60,0,0,0.9)', 8);
    if (o.step === 7) _drawBottomPillBadge('CONTINUE');
  }
  /* 雷鳴フラッシュ */
  if (o.flash > 0) {
    ctx.globalAlpha = Math.min(1, o.flash);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ════════════════ キングギヨウザ 戦闘（M2） ════════════════
   操作はタイミングのみ（自動照準）。的（文字）1本ずつのタップ精度で
   こんがり%が直接決まる（JUST=+1.0%・GOOD=+0.5%・OK以下=+0%、4本平均ではなく
   個別判定）。「こ・ん・が・り」全一致（当たり）確定時のみ、その4タップぶんの
   焦げ跡候補が正式に登録される。cookPctが100%でこんがり100%＝勝利。
   個々の焼き目は命中直後は局所的な焦げ跡として見え、実時間で少しずつ薄くなりながら
   消える。その代わりに全身の色トーンが焦げ色方向へ寄っていき（pct=cookPct/100
   に連動、ゲージ%と常に同期）、100%到達と同時に全身が焦茶色になる。
   焼き目を liveOC へ永続焼き込みしていた旧実装（source-atop 1回焼き込み）から、
   「焦げ跡フェード＋全身トーン」を毎フレーム _renderKingBody() で合成する方式に変更
   （フェード中の焦げ跡がある間のみ再合成。フェード完了後は再合成をスキップして
   前回の合成結果を使い回す＝焦げ跡が無い期間の毎フレームコストはゼロ）。
   ボスからの攻撃・被弾・敗北は M3 で実装する。 */
const KING_MARK_FADE_SEC = 2.2;   // 個々の焦げ跡が薄くなって消えるまでの実時間（wall-clock）
/* こんがり%はタップごとの精度で直接積算する方式（ユーザー承認済み）:
   JUST=+1.0%・GOOD=+0.5%・OK以下=0%（焦げ跡も作らない）。的は4本1組だが、
   スコアは4本の平均ではなく1本ずつ個別に判定する。焦げ跡は「当たり
   （こ・ん・が・り全一致）」が確定して初めて正式に生成・カウントする
   （不一致なら個々のタップがJUST/GOODでも焦げは残らない） */
const KING_GOOD_PCT = 0.5;
const KING_JUST_PCT = 1.0;
/* ビームが三角から着地先マークまで到達するのにかける時間（フレーム数）。
   距離に関わらず全ビーム共通のこの値で進行度(age/KING_LASER_TRAVEL_FRAMES)を
   計算するため、的とマークの距離が違っても4本とも同時に着弾する
   （ユーザー要望: 「距離によらず、４つ同時にマークにビームが到着するように
   したい。1/60×3フレーム程度の高速なアニメーションで」） */
const KING_LASER_TRAVEL_FRAMES = 3;
/* こんがり攻撃失敗（4文字不一致）のペナルティとルーレット破壊演出（ユーザー要望）:
   失敗のたびにこんがり%を少し後退させ、ルーレットにひびを1本ずつ増やす。
   KING_MAX_FAILS回失敗するとルーレット完全破壊＝敗北（_startBossDefeat） */
const KING_MISS_PCT_PENALTY = 1.0;
const KING_MAX_FAILS = 6;
/* KING_CHAR_JUST_FONT_SCALE: マークされる文字（グリフ）自体の大きさをJUSTで
   拡大する倍率（面積4倍=辺2倍、GOOD基準）。焦げ跡（スコーチブロット）の
   面積とは別物（ユーザー指摘: 焦げのサイズを勝手に変えるな、文字の大きさを
   変えてほしいと言っている、の2点は別々の要素）。焦げ跡側のサイズは常に
   一定（_createKingMark参照） */
const KING_CHAR_JUST_FONT_SCALE = 2;
/* KING_MARK_RESIDUAL_ALPHA: フェード完了後も消え切らず、ごくごく薄く永続的に
   残る焦げ跡の下限アルファ比率（1=フェード開始直後と同じ濃さ）。
   以前は個々の焦げ跡とは無関係な固定7個の「焼き目模様」を別途重ねていたが、
   文字が飛んでいった先（＝実際の焦げ跡）と模様の位置が一致しないという
   実機指摘で廃止し、焦げ跡自身が薄れながら痕を残す方式に統一した */
const KING_MARK_RESIDUAL_ALPHA = 0.14;
const KING_TONE_COLOR = '#8a5225'; // こんがり100%到達時の全身色（トースト状の狐色。焦茶すぎない絶妙な焼き加減）
const KING_TONE_MAX_ALPHA = 0.55;  // 全身トーンの最大重ね掛け強度（下地の陰影を多めに残し、平板な塗り潰しに見せない）
/* KING_RESULT_MIN_WAIT: 4本確定後、結果表示を最小何フレーム保持するか。
   通常モードの的判定（phase==='done'のminWait、2582行目付近）と同じ考え方:
   ハズレは短く、当たりは少し長く。実際の解放はここに onBeatGrid() の
   BGM拍グリッド同期を重ねる（_updateBossBattle）ため、体感の待ち時間は
   通常モードの「ハズレ次弾」と揃う */
const KING_RESULT_MIN_WAIT = { miss: 2, hit: 24 };
/* ボス本体楕円（_drawGyozaBody: 中心=+0.08s、縦半径=0.48s）から見た目の頭頂・裾を
   割り出した比率（中心からの距離、s基準）。_initBossBattleのレイアウト計算と
   drawBossVictoryの勝利文言の位置決めの両方で使う共通値のためモジュール定数にする。 */
const KING_VISUAL_TOP_RATIO = 0.40, KING_VISUAL_BOTTOM_RATIO = 0.56;
/* KING_XFORM_EASE: 誕生演出の鎮座位置→戦闘位置、戦闘位置→勝利拡大、それぞれの
   ジャンプをなくすための指数収束レート（1フレームあたりの残差縮小率）。
   アニメーション進行に紐づく演出のためフレームカウンタ基準（wall-clockにしない）。 */
const KING_XFORM_EASE = 0.12;
/* 決定文字の飛翔演出（矢を射る／リールを確定させる操作とは独立のバックグラウンド
   演出。通常モードの missPopups/payoutPopups と同じ「配列に積んで毎フレーム
   自走・自然消滅」方式）。的が確定するたび(1本ロックごと)にキャラを1体スポーンし、
   ボス付近まで飛ばして待機、4本目の判定が出た時点で未解決分すべてに結果
   （こんがり=吸い込まれて消える／ハズレ=飛んできた的へ戻って衝突・反発・
   落下し、画面外へ消える）を伝える。
   着地先は結果が判明する前（1〜3本目）から、そのタップ自体の精度（JUST/GOOD）で
   位置・サイズを確定した焦げ跡候補（_createKingMark）を最初から使う（OK以下は
   焦げ跡候補なし＝ボス中心へ向かうだけ）。4本目で「こ・ん・が・り」全一致が
   確定した時点で、各文字の焦げ跡候補を正式に _king.marks へ登録して%を加算する。
   不一致（ハズレ）ならどのタップも登録されず、そのまま的へ戻って物理的に
   跳ね返り落下するだけ（ユーザー要望: マークした文字が的に飛んできて
   ぶつかり、物理エミュレーションで衝突・反発・落下を表現し、最終的に画面外へ
   落ちていくようにしたい。的側のひび演出はfailCount連動の既存演出をそのまま
   使うため、この飛翔演出側では何も生成しない） */
const KING_CHAR_FLY_FRAMES = 16;        // 往路（キングへの接近）にかかるフレーム数。復路はKING_CHAR_RETURN_FRAMES
const KING_CHAR_STICK_FADE_FRAMES = 10; // こんがり: 命中後に消えるまで
/* ハズレは的に衝突後、反発して画面外に出るまでフェードせず表示し続ける
   （ユーザー指摘: 途中でフェードアウトするのは違う、画面外に消えるまで
   見えていてほしい）。MAX_FRAMESは万一画面外に出ない角度になった場合の
   保険上限（通常は発火しない） */
const KING_CHAR_FALL_MAX_FRAMES = 180;
const KING_CHAR_OFFSCREEN_MARGIN = 60;
/* 的への衝突反発の物理係数（ユーザー要望: 「運動エネルギーがほぼ全て的を
   割るために使われ、その結果、的にあたった文字はほぼ下に自由落下する動作に
   近くしたい」）。衝突点の法線は常に真上固定（着弾点=的の縁の真上、
   _startKingCharBounce参照）なので、bvyがそのまま法線方向、bvxがそのまま
   接線方向の速度成分になる。RESTITUTION（反発係数）は法線方向の速度保持率、
   FRICTIONは接線方向の速度保持率。ほぼゼロに近い値にして「衝突でほとんど
   静止し、そこから重力だけで落ちる」動きにする（以前は逆に「はね返りが
   弱すぎて単なる自由落下に見える」という指摘で強めていたが、今回はその
   逆方向の要望のため差し替え） */
const KING_CHAR_BOUNCE_RESTITUTION = 0.08;
const KING_CHAR_BOUNCE_FRICTION    = 0.15;
/* 衝突時にキング側から加える能動的な「弾き飛ばし」インパルス。上記と同じ
   要望により、的が払いのけるような強い外力はほぼ無くし、わずかな残り香
   程度に留める（0だと硬直的に見えるため、ごくわずかだけ残す）。回転
   （KNOCK_ROT）も同様にごく小さくし、勢いよく弾かれる見た目にしない */
const KING_CHAR_KNOCK_SPEED_X = 0.6;
const KING_CHAR_KNOCK_SPEED_Y = 0.8;
const KING_CHAR_KNOCK_ROT_SPD = 0.06;
/* ── こんがり不一致時の「篩い落とし」演出（ユーザー要望: 「マークした文字が
   向かい始める時に、キングギヨウザが文字を下に向かって篩い落とすようなアクションを
   追加したい」） ──
   タメ（わずかに上へ引く）→ 振り下ろし（底で文字が離れる）→ 減衰する残振動。
   発動タイミングは「4文字すべてがキングに到着してから」（ユーザー選択の案(b)。
   最速発射でも常に『到着→振り下ろす→落ちる』の順になり見え方が一定になる）。
   キング本体の変位は描画時オフセットとして持ち、dby等の状態は汚さない
   （_easeKingXformが毎フレームdby→byへ収束させるため綱引きになる。呼吸の拡縮
   breathと同じ「描画時だけ掛ける」方式に揃える。_kingSiftOffsetY参照） */
const KING_SIFT_WINDUP_FRAMES = 4;   // タメ
const KING_SIFT_DROP_FRAMES   = 6;   // 振り下ろし
const KING_SIFT_SETTLE_FRAMES = 22;  // 残振動（減衰）
const KING_SIFT_RELEASE_FRAME = KING_SIFT_WINDUP_FRAMES + KING_SIFT_DROP_FRAMES; // 底＝文字が離れる
const KING_SIFT_AMP    = 14;         // 振り下ろしの最大変位(px)
const KING_SIFT_SQUASH = 0.08;       // 底でのスカッシュ量（縦を潰し横を広げる）
const KING_SIFT_GAZE   = -0.6;       // 振り下ろし中の視線（負＝下を見る。_drawKingFace参照）
/* 復路（篩い落とされて的へ向かう）のフレーム数。
   当初は往路KING_CHAR_FLY_FRAMES(16)から振り下ろし待ち(KING_SIFT_RELEASE_FRAME=10)を
   差し引いた6フレームにして、発射タップ〜衝突までの総時間を演出追加前と同じ16
   フレームに保っていた（「帳尻合わせて」）。しかし総時間の一致より、篩い落とされた
   文字が落ちていく過程が見えることのほうが演出として重要だったため、総時間の制約を
   外して10フレームに広げる（総時間は16→20フレーム）。KING_SIFT_RELEASE_FRAMEとの
   差し引き関係は無くなったので、往路・復路それぞれ独立に調整してよい */
const KING_CHAR_RETURN_FRAMES = 10;
/* 振り下ろしに合わせた画面の微揺れ（既存のdraw()冒頭のshake機構に加算する）。
   打撃感の補強なので短く小さく。フレームカウンタで良い（映像の進行に紐づく演出） */
const KING_SIFT_SHAKE_FRAMES = 8;
let _kingSiftShake = 0;
/* 文字が的に当たった衝撃で、その的だけが小さく揺れる（ユーザー要望）。
   減衰する上下振動を主体にし、横はごくわずかに添えるだけ（衝突点は常に的の
   真上なので、縦に叩かれた揺れ方が自然）。的スロット単位で持つのはひび
   （_king.reelCracks）と同じ理由で、再スピンで的オブジェクトが作り直されても
   スロットに紐づけておけば取り違えないため。
   実機指摘「衝撃があまり的に伝わっていないように見える／タイミングが早い気が
   する」を受けて、初版から以下を変更した:
   - 初版は sin(経過フレーム) だったため、セットした瞬間（経過0）の変位が
     sin(0)=0 で、一番鋭いはずの衝突フレームに的が全く動いていなかった。
     cosベースにして衝突フレームで最大変位になるようにする
   - BIASぶん下方向へ偏らせる。衝突は真上からなので「まず沈んで、小さく戻る」
     方が自然（上下等分に揺れると単なる振動に見える）
   - 振幅を3.5→6pxへ。的の直径に対して控えめすぎた（最大変位も設定値の84%
     しか出ていなかった） */
const KING_REEL_SHAKE_FRAMES = 12;
const KING_REEL_SHAKE_AMP    = 6;
const KING_REEL_SHAKE_FREQ   = 1.05; // 約6フレーム周期
const KING_REEL_SHAKE_BIAS   = 0.35; // 下方向への偏り（0=上下等分、1=沈むだけ）
/* 衝突の瞬間だけ入れる短い画面揺れ。振り下ろし時の画面揺れ（_kingSiftShake）は
   衝突より9〜16フレーム早く終わるため、そちらを「当たった衝撃」と誤認して
   「タイミングが早い」と感じられていた。振り下ろし側を弱めるとキングの打撃感が
   死ぬので、本番（衝突）側にも揺れを入れて印象を取り戻す */
const KING_IMPACT_SHAKE_FRAMES = 3;
const KING_IMPACT_SHAKE_AMP    = 2.5;
let _kingImpactShake = 0;
/* ひびの金属音（_playKingCrackKin）の多重発音を間引くための最終発音時刻。
   4文字がほぼ同フレームに着弾するため、この窓の中の呼び出しは1発にまとめる
   （_addKingReelCrackAtCollision参照）。ミリ秒・wall-clock基準 */
const KING_CRACK_KIN_MIN_GAP_MS = 60;
let _kingCrackKinLastMs = -Infinity;
let _king = null;       // { liveOC, half, marks, cookPct, bx, by, dbx, dby, dscale, tx, ty }
let _kingLasers = [];   // { x1,y1,x2,y2, age, life, maxLife, color, glow }
let _kingCharFlights = []; // { char, sx,sy, rtx,rty, state, frames, resolve, bx,by,bvx,bvy }
let _kingShatter = null; // { pieces } 的が砕けて破片が飛び散る演出（6回目の失敗時のみ、_startKingReelShatter参照）
const KING_SHATTER_MAX_FRAMES = 150; // 破片が画面外に出きらない場合の保険上限
/* こんがり達成時の湯気（蒸したての湯気、_spawnVictorySteamWisp参照）専用の
   独立した配列。共有particles配列（花火・命中インパクト用の重力+収縮物理が
   update()冒頭で全phase共通に適用される）には登録しない。実機確認で発覚:
   以前spawnParticleで共有particlesに登録していたところ、update()冒頭の
   汎用物理（重力+0.22・収縮×0.97）と_updateBossVictory独自の物理
   （浮力-0.01）が毎フレーム二重適用され、正味+0.21/frameの下向き加速度に
   なって「上昇する湯気」ではなく「跳ねてすぐ落ちる火の粉」の動きになって
   いた（約13フレームで上昇が失速し落下に転じることを実測で確認）。 */
let _victorySteam = [];
let _steamSprite = null; // 湯気用の柔らかい放射状グラデーションスプライト（初回使用時に生成）
/* 今回のこんがり達成が初回か（_startBossVictoryで確定）。trueを引き継いで
   bossVictoryのCONTINUEタップ時に真エンディングへ進むかどうかを決める
   （_startTrueEnding参照） */
let _pendingTrueEnding = false;
let _bossVictoryTimer = 0;
let _bossVictoryWonCoins = 0; // こんがり達成で返却したギヨウザ数（勝利画面の表示用、_startBossVictory参照）
let _bossDefeatTimer = 0;
let _bossDefeatShrinkTimer = 0;
let _scorchBlotSprite = null;

/* 焼き目スタンプの元絵を初回に1回だけ生成（不定形の焦げ跡×3層） */
function _buildScorchBlotSprite() {
  if (_scorchBlotSprite || !_CACHE_OK) return;
  const sz = 64, half = sz / 2;
  const oc = _mkCache(sz, sz);
  const c = oc.getContext('2d');
  c.translate(half, half);
  /* 色・アルファは以前より濃く（コントラスト不足でGOOD/JUSTのサイズ差が
     ほぼ見えないという実機指摘で強化。フルサイズ書き出しで確認したところ
     位置・サイズ自体は正しかったが、地の色に対して薄すぎて肉眼でほぼ判別
     できなかったのが真因だった） */
  const layers = [
    { r: 26, a: 0.85, col: '75,42,14' },
    { r: 19, a: 0.90, col: '50,25,6'  },
    { r: 11, a: 0.85, col: '25,10,2'  },
  ];
  /* 各点を直線でつなぐと8角形の角が立って見える（実機指摘: 「四角いパッチ
     のように見える、もっと丸に近かったはず」）ため、点数を増やしたうえで
     隣接点の中点同士を二次ベジェで結ぶ標準的な「丸めたブロブ」の手法で
     輪郭を滑らかにする。半径の乱数幅（不定形さ）自体は変更しない */
  const N = 14;
  for (const ly of layers) {
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a  = (i / N) * Math.PI * 2;
      const rr = ly.r * (0.75 + Math.random() * 0.5);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.85]);
    }
    c.beginPath();
    const midStart = [(pts[N-1][0]+pts[0][0])/2, (pts[N-1][1]+pts[0][1])/2];
    c.moveTo(midStart[0], midStart[1]);
    for (let i = 0; i < N; i++) {
      const p = pts[i], pn = pts[(i+1)%N];
      c.quadraticCurveTo(p[0], p[1], (p[0]+pn[0])/2, (p[1]+pn[1])/2);
    }
    c.closePath();
    c.fillStyle = `rgba(${ly.col},${ly.a})`;
    c.fill();
  }
  _scorchBlotSprite = oc;
}

/* 誕生直後（bossOmen step7 のタップ）に呼ばれ、実戦闘フェーズへ移行する */
function _initBossBattle() {
  /* 蓄積メーターは戦闘開始時点でリセット（ボスは蓄積そのものが実体化したもの）。
     ここでリセットしないと勝敗に関わらず次のトライ終了直後に即再発動する
     （リネーム時にリセット処理の移し忘れで実際に発生したバグ・M2検証で発覚）。
     OffscreenCanvas 非対応で即復帰する経路も含め、常にリセットする。
     リセット前の値は_kingMeterAtBattleStartへ退避する。こんがり達成時に
     「このキングに取り込まれていたギヨウザ」として所持数へ返すため
     （ユーザー要望、_startBossVictory参照）。ボスは閾値到達で出現するので
     必ずKING_GYOZA_THRESHOLD以上＝1000+アルファになる */
  _kingMeterAtBattleStart = kingGyozaMeter;
  kingGyozaMeter = 0;
  lsSaveStats();
  if (!_CACHE_OK || !_bossOC) { _kingBattleEnd(); return; } // 非対応環境は戦闘なしで復帰
  _buildScorchBlotSprite();
  /* 縦画面: 的（こんがりミニリール）のサイズを、左右上部のアイコン（トロフィー/
     ポーズ・ミュート/全画面）を除いた横幅いっぱいに広がるよう動的に決め直す
     （実機要望: 「小さすぎる、アイコン部を除いた横幅と同程度に」）。
     直径4個＋隙間3個（KING_REEL_GAP）で埋まる半径を逆算する。
     KING_RESULT_FONT/Hも半径に比例するため合わせて再計算する
     （このタイミングでのみ行う理由: BTN_RIGHT/BTN_SIZEがKING_WRの元の
     宣言より後で定義されるため、モジュールトップレベルでは計算できない） */
  if (IS_PORTRAIT) {
    const iconZone = BTN_RIGHT + BTN_SIZE; // 左右上部アイコンが占める帯
    const availReelW = W - iconZone * 2;
    KING_WR = (availReelW - KING_REEL_GAP * 3) / 8;
    KING_RESULT_FONT = Math.round(KING_WR * 0.55);
    KING_RESULT_H = KING_RESULT_GAP + KING_RESULT_FONT + 4;
  }
  const half = _bossOC.half, s = _BOSS_S;
  /* _bossOC.oc の物理ピクセルサイズは half*2*_dpr（_buildBossOC 参照）。
     liveOC も同じ物理サイズで確保しないと合成時に左上1/4しか転写されない
     （DPR>1 環境で実際に発生したバグ：右・下が切れて見える）。
     内容は _renderKingBody() が命中の都度・素のスプライトから再構成するため、
     ここでは領域確保のみ行う（初期状態は _renderKingBody 側で _bossOC.oc を
     そのまま返す高速経路があるため、初期描画は不要）。
     _bossOCにキャッシュして戦闘をまたいで再利用する（以前は毎戦闘で新規生成し
     旧canvasがGC待ちで滞留していた＝キング的OCと同じリーククラスの水平展開。
     合成状態のキャッシュキー（_toneRenderedPct等）は_king側に持つため、
     canvasを使い回しても前戦闘の内容が誤って再利用されることはない） */
  /* liveOCは_buildBossOC（予兆の入口）で確保済み。ここでの確保は保険
     （OffscreenCanvas未対応環境は上で復帰するので通常は通らない）。
     実機指摘「キング戦開始直後、的の回転に速度ムラがある」の対策: 1140x1140＝
     約130万画素の確保が、まさに的が回り始めるフレームに来ていた。確保回数を
     数えて確認したところ、戦闘開始時の6回のうち1回がこれだった */
  const liveOC = _bossOC.liveOC ||
    (_bossOC.liveOC = _mkCache(half * 2 * _dpr, half * 2 * _dpr));
  /* marks は当たりが確定した焦げ跡だけを積むので、事前生成せず空で始める
     （個々の焦げ跡は _createKingMark がタップの都度その場で生成する） */
  const marks = [];
  /* 縦レイアウトを実寸から動的計算する（マジックナンバーの縦横別ハードコード禁止）。
     コインヘッダー下端〜こんがりゲージ上端の実際の空き高さにボスを収まるよう縮小し、
     ボス下端〜ゲージ上端の間にこんがりミニリール4連（旧: 砲台）の場所を確保する。
     旧実装（by=H/2固定）はボスがキャンバス縦幅をほぼ占領し、砲台がゲージパネルの
     背景（砲台より後に描画される）に埋もれて見えなくなっていた（実機報告で発覚）。 */
  /* ボス上端〜ヘッダー下端の余白: 縦画面は左右の隙間（コインヘッダーの左右マージン）と、
     横画面は外枠〜コインヘッダーの隙間（BTN_M。BTN_TOPは内枠厚み11pxを含む絶対Y座標であり
     「隙間」そのものではないため誤り。BTN_M=10が実際の枠〜コンテンツの余白）と、
     それぞれ同じ量にする（実機要望による） */
  const topGap = IS_PORTRAIT ? (W - COIN_HEADER_W) / 2 : BTN_M;
  const headerBottom = COIN_HEADER_BOTTOM_Y + topGap; // コインヘッダー下端(y座標) + 余白
  /* 横画面: panelTopをゲージ上端そのものにし、リールとの隙間はGAP_REEL_PANEL
     （topGap=BTN_M、統一マージン）1本だけにする。以前は独立した-15pxが
     GAP_REEL_PANELと二重に効いて合計25pxの隙間になっていた（実機指摘:
     「こんがり表示エリアのぎりぎりまで下げられる」「縦横一定の空間」＝
     他の余白と同じ統一マージンだけにしてほしいという要望）。
     縦画面は従来どおり-15pxを維持（今回の要望は横画面限定のため） */
  const panelTop      = IS_PORTRAIT ? P_BAR_Y - 15 : KING_GAUGE_Y; // こんがりゲージ上端 - 余白
  const REEL_D = KING_WR * 2, GAP_BOSS_REEL = 16;
  /* リール下端〜ゲージ枠上端の隙間は、ヘッダー上と対称に「太外枠とのマージン」と
     同じ量にする（topGap を再利用。実機要望による）。この隙間はリールをゲージ枠から
     固定量だけ離す下端基準の値であり、ボス側の空きに余裕があっても膨らまない
     （旧実装はboss基準の積み上げ式で、実際には約24pxまで開いてしまっていた）。 */
  const GAP_REEL_PANEL = topGap;
  /* half(=0.75s)はスタンプ・呼吸アニメ余裕を含む安全バウンディング半径であり、
     実際に見えるボスの輪郭はもっと内側。_drawGyozaBody の本体楕円
     （中心=+0.08s、縦半径=0.48s）から見た目の頭頂は中心から-0.40s、裾は+0.56sと算出できる。
     scale-fit と by の余白計算の両方をこの見た目比率（0.40+0.56=0.96s）基準にする：
     half基準（1.5s相当）のまま fit させると見た目より遥かに大きい余白込みで縮小され、
     ボスが必要以上に小さく表示される（実機報告で発覚: 縦画面で頭頂が100px以上離れる・
     横画面でボスが小さすぎる、の双方が同根）。 */
  /* KING_RESULT_H: 的の下に当たった文字を表示するための縦スペース（drawKingReel参照）。
     ここで確保しないと文字がゲージ枠に重なる */
  const availH = panelTop - headerBottom - GAP_BOSS_REEL - REEL_D - KING_RESULT_H - GAP_REEL_PANEL;
  const scale = Math.min(1, availH / (s * (KING_VISUAL_TOP_RATIO + KING_VISUAL_BOTTOM_RATIO))); // 空き高さに収まる縮小率（拡大はしない）
  const visualTopOffset = s * KING_VISUAL_TOP_RATIO * scale;
  const by = headerBottom + visualTopOffset;
  const reelY = panelTop - GAP_REEL_PANEL - KING_RESULT_H - KING_WR; // ゲージ枠から固定隙間の下端基準（結果文字の分だけ上に確保）
  const reelGapX = KING_WR * 2 + (IS_PORTRAIT ? KING_REEL_GAP : 12);
  /* charWeights: 4的ぶんの文字配分（%）。的ごとに独立管理し、狙って命中させた
     文字の比率を毎回少しずつ増やしていく（_adjustKingCharWeight）。初期値は
     4文字均等の25%（ユーザー要望） */
  const charWeights = [0, 1, 2, 3].map(() => Object.fromEntries(KING_CHARS.map(c => [c, 25])));
  const reels = [0, 1, 2, 3].map(i => _createKingReel(W / 2 + (i - 1.5) * reelGapX, reelY, charWeights[i]));
  /* dbx/dby/dscale は誕生演出（_omen step6-7）での鎮座位置・等倍スケールを初期値にし、
     ここから戦闘位置(bx,by,scale)へ毎フレーム収束させる（_easeKingXform）。
     こうしないと戦闘開始の瞬間に位置とスケールが瞬時にジャンプする（実機報告で発覚）。 */
  const omenBy = H / 2 - (IS_PORTRAIT ? 60 : 0);
  _king = {
    liveOC, half, marks, cookPct: 0, scale,
    bx: W / 2, by,
    dbx: W / 2, dby: omenBy, dscale: 1,
    reels, reelIdx: 0, awaitingFire: false, attemptFired: false, resultTimer: null, resultMatched: false, charWeights,
    failCount: 0, pendingDefeat: false, pendingVictory: false, missAttemptToken: null,
    /* 篩い落とし演出（KING_SIFT_*参照）。siftPending=文字の到着待ち、
       siftTimer=null で非発動・0以上で経過フレーム */
    siftPending: false, siftTimer: null,
    reelCracks: [[], [], [], []], // 的スロット単位のひび割れ蓄積（{poly,angle}の配列。drawKingReel参照。再スピンをまたいで残る）
    reelShake: [0, 0, 0, 0],      // 的スロット単位の被弾揺れ残量（KING_REEL_SHAKE_FRAMES参照）
  };
  _kingLasers = [];
  _kingCharFlights = [];
  phase = 'boss';
  /* BGMの段階をtier0（最も凶暴）にリセットする。startBossBGMTapeが
     bossBgmBuffer（tier0と同一内容）で新規ソースを作るため、ここでの状態
     リセットと実際の再生内容が一致する（_updateBossBgmTier参照） */
  _bossBgmTier = 0;
  _bossBgmPendingTier = null;
  startBossBGMTape(1200); // 世界が動き出す（予告のテープストップから復帰、ボス戦は暗黒版BGM）
}

/* ボス本体の描画元キャンバスを返す（素のスプライト＋全身トーン＋フェード中の焦げ跡）。
   全身トーンの強さは cookPct（タップ精度で直接積算、0〜100）と厳密に連動させる
   （フェード完了を待たず、ゲージが100%になった瞬間に全身も焦茶色100%になっている
   必要があるため）。
   個々の焦げ跡は revealedAt からの経過時間（wall-clock）でアルファを減衰させ、
   フェード仕切りの局所的な焦げ跡だけを別途上描きする。
   フェード中の焦げ跡が1つも無ければ再合成をスキップし、素のスプライト（pct=0）または
   前回合成済みの liveOC（pct>0 かつ全焦げ跡が消え切った定常状態）をそのまま返す。 */
function _renderKingBody() {
  const pct = _king.cookPct / 100;
  const now = performance.now();
  /* 焦げ跡は「フェード中」(t<1、毎フレーム再合成が必要)と「フェード完了後も
     ごくごく薄く残る永続痕」(t>=1、KING_MARK_RESIDUAL_ALPHA固定)の2状態。
     以前は個々の焦げ跡とは無関係な固定7個の「焼き目模様」を別レイヤーで
     重ねていたが、文字が飛んでいった先（＝実際の焦げ跡）と模様の位置が
     一致しないという実機指摘で廃止し、焦げ跡自身が薄れながら痕を残す
     方式に統一した（永続痕＝settledがそのまま「焼き目模様」を兼ねる） */
  let activeCount = 0, settledCount = 0;
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000);
    if (t < 1) activeCount++; else settledCount++;
  }
  if (pct <= 0 && activeCount === 0 && settledCount === 0) return _bossOC.oc; // 未被弾: 素のスプライトをそのまま使う
  /* 再合成スキップの条件は pct 一致だけでは不十分: 前回まだフェード中の焦げ跡が
     残っていた（_toneHadActive）場合、今回activeCountが0になっていても「焦げ跡を
     残痕アルファまで落とし切る」1回の再合成をしないと古い焦げ跡が残ったままキャッシュ
     されてしまう（実機検証で発覚: フェード完了直後の1フレームが欠落しボスが直前
     フレームのまま固まる不具合）。settledCountの増加も同様に再合成トリガーにする
     （新たに永続痕入りした焦げ跡を反映するため）。 */
  /* 視線（gazeUp）も再合成トリガーに含める。含めないと見上げるアニメの間、
     pct/焦げ跡が変化しないため古い顔がキャッシュされたまま瞳が動かない */
  const gazeUp = _king.gazeUp || 0;
  if (activeCount === 0 && _king._toneRenderedPct === pct && !_king._toneHadActive &&
      _king._settledCount === settledCount && _king._gazeRenderedUp === gazeUp) return _king.liveOC;
  const lc = _king.liveOC.getContext('2d');
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, _king.liveOC.width, _king.liveOC.height);
  /* globalCompositeOperation/globalAlpha は setTransform/clearRect では戻らず
     前回呼び出し（source-atop・低アルファで終わっている）の状態を引き継いでしまう。
     source-atop のままだと直後の clearRect 直後（アルファ0）への drawImage が
     「既存アルファ内にのみ合成」の制約で何も描かれない（実機検証で発覚:
     フェード完了直後にボスが透明になる不具合の真因）。明示的にリセットする。 */
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  lc.drawImage(_bossOC.bodyOC, 0, 0); // 顔なし本体レイヤーから再構成（永続焼き込みではない）
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-atop'; // ボス本体のアルファ内にのみ合成
  if (pct > 0) {
    lc.globalAlpha = pct * KING_TONE_MAX_ALPHA;
    lc.fillStyle = KING_TONE_COLOR;
    lc.fillRect(-_king.half, -_king.half, _king.half * 2, _king.half * 2);
  }
  /* 焦げ跡本体: revealedAtがある全マーク（フェード中＋永続痕）を毎回描く。
     alphaはt=0で1.0→t=1でKING_MARK_RESIDUAL_ALPHAへ線形補間し、以降そこで
     下げ止まる（消え切らずごくごく薄く残る） */
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = Math.min(1, (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000));
    const alpha = 1 - (1 - KING_MARK_RESIDUAL_ALPHA) * t;
    lc.save();
    lc.translate(m.lx, m.ly);
    lc.rotate(m.rot);
    const sc = m.r / 26; // スプライト基準半径26に対する倍率
    lc.globalAlpha = alpha; // 0.9掛けは廃止（濃さ不足でサイズ差が見えないという指摘への対応の一環）
    lc.drawImage(_scorchBlotSprite, -26 * sc, -26 * sc, 52 * sc, 52 * sc);
    lc.restore();
  }
  /* 顔（目鼻口眉）はトーン・焦げ跡の影響を受けない常に元の色で最後に上描きする
     （白目の白さと焦げ色とのコントラストを保つユーザー要望）。pctに応じて表情が
     変化する（_drawKingFace参照）ため、静的faceOCのコピーではなく毎回ベクタ描画する。
     論理座標系（scale+translate）に戻してから描く必要がある */
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  _drawKingFace(lc, _BOSS_S, pct, gazeUp);
  _king._toneRenderedPct = pct;
  _king._toneHadActive = activeCount > 0;
  _king._settledCount = settledCount;
  _king._gazeRenderedUp = gazeUp;
  return _king.liveOC;
}

/* 的の下に出た結果文字を1体スポーンし、ボス付近まで飛ばす。的が1本ロックされる
   たびに呼ぶ（1〜3本目はまだこんがり成立/不成立が分からないため、着弾後は
   'wait' 状態でボス付近に留まる。4本目のロックで結果が判明したら resolve を
   全未解決分にまとめて設定＝_kingReelShoot 側）。
   着地先（markRef）はこの時点で確定させる。タップ自体の精度（score）で
   JUST/GOODが決まった瞬間に、位置とサイズ込みの焦げ跡候補を _createKingMark
   で生成して持たせる（OK以下は候補なし＝null、ボス中心へ向かうだけ）。
   まだ _king.marks には登録しない（当たり確定＝「こ・ん・が・り」全一致まで
   正式な焦げ跡にはしない。_kingReelShoot 参照）。結果が判明する前から確定
   位置を使うことで、結果確定時に位置を作り直す必要が一切なくなる（実機指摘:
   待機中は中心寄りの仮位置にして結果確定時に本来の位置へ動かす実装を
   していたが、そもそも最初から本来の位置に配置してほしいという要望だった） */
function _spawnKingCharFlight(w, reelIdx) {
  const tier = w.syncScore >= 0.667 ? 'just' : w.syncScore >= 0.333 ? 'good' : null;
  _kingCharFlights.push({
    char: w.result, score: w.syncScore, // 文字色を通常モードと同じ赤〜黄〜緑にするため保持（drawKingCharFlights参照）
    sx: w.x, sy: w.y + KING_WR + 3 + KING_RESULT_GAP + KING_RESULT_FONT/2,
    /* ハズレ時の復路（_startKingCharBounce）が戻る先＝的の上部、三角ポインタ
       付近（drawKingReelのpx,pyと同じ式）。的の下（sx,sy）へ戻すと文字が
       ボスと反対側から回り込む不自然な軌道になってしまうため、ボス側を
       向いている上側を衝突点にする（ユーザー指摘） */
    rtx: w.x, rty: w.y - (KING_WR + 12),
    reelIdx, // 衝突の瞬間（_startKingCharBounce）にどの的のスロットへひびを追加するか
    tier, markRef: tier ? _createKingMark() : null,
    state: 'fly', frames: 0, resolve: null, attemptToken: null,
    rot: 0, rotSpd: 0, // 弾き飛ばし後の回転演出（衝突時に設定、drawKingCharFlights参照）
  });
}

/* 焦げ跡候補を1個生成する（位置はボス胴体内に一様分布）。サイズはtierに
   依存しない一定範囲（ユーザー指摘: 焦げの面積とマークされる文字の大きさは
   別物。文字側のサイズ差はKING_CHAR_JUST_FONT_SCALE・drawKingCharFlights参照）。
   当たりが確定するまでは _king.marks に登録しない「候補」のまま
   （_spawnKingCharFlight参照） */
function _createKingMark() {
  const ang = Math.random() * Math.PI * 2;
  const rad = Math.sqrt(Math.random()); // 円盤上に一様分布
  return {
    lx:  Math.cos(ang) * _BOSS_S * 0.52 * rad,
    ly:  _BOSS_S * 0.08 + Math.sin(ang) * _BOSS_S * 0.42 * rad,
    r:   _BOSS_S * 0.085 + Math.random() * _BOSS_S * 0.045,
    rot: Math.random() * Math.PI * 2,
    revealedAt: null,
  };
}

/* 文字の着地先（＝焦げ跡markRefの実位置。markRefが無い＝OK以下のタップは
   焦げを残さずボス中心へ向かうだけ）を「今の」ボス表示位置（dbx/dby、呼吸
   アニメ込みのbreath）を基準に毎回ライブ計算する。_renderKingBody内の
   焦げ跡描画と同じ座標変換。凍結せず毎フレーム計算し直すことで、ボスがまだ
   誕生演出から戦闘位置へ収束中でも常に実際の描画位置に追従する */
function _kingFlightTargetPos(f) {
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  if (f.markRef) return { x: _king.dbx + f.markRef.lx * breath, y: _king.dby + f.markRef.ly * breath };
  return { x: _king.dbx, y: _king.dby };
}

/* 文字の「今」の描画位置を状態に応じて算出する（draw側から呼ぶ） */
function _kingCurrentFlightPos(f) {
  const target = _kingFlightTargetPos(f);
  if (f.state === 'fly') {
    const e = 1 - (1 - Math.min(1, f.frames / KING_CHAR_FLY_FRAMES)) ** 2; // ease-out
    return { x: f.sx + (target.x - f.sx) * e, y: f.sy + (target.y - f.sy) * e - Math.sin(e * Math.PI) * 18 };
  }
  if (f.state === 'wait') return { x: target.x, y: target.y + Math.sin(f.frames * 0.12) * 2 };
  if (f.state === 'stick') return target;
  /* bounce（的への接近）・fall（衝突後の反発落下）は物理シミュレーション
     （bx/by/bvx/bvy）で位置を直接持っているので、そのまま返す */
  return { x: f.bx, y: f.by };
}

/* こんがりリールへのタップ入力。1本ずつ hitResult() で位置判定して確定する
   （通常ゲームの onShoot と同じ「タップ時点の回転角で止める」操作感）。
   4本目は的をマークするだけで発射しない（ユーザー要望: 「4つの的を射ると
   マークされるだけにして、その後、一回タップ/クリック/キー押下したタイミングで
   マークした場所にビームを発射するようにしたい」）。実際の判定・発射は
   awaitingFire を立てて _kingFireAttack に委ね、次の入力（handleGameClick の
   phase==='boss'分岐参照）で実行する。
   決定した文字はここで即バックグラウンドの飛翔演出（_spawnKingCharFlight）に渡す。
   演出自体は _updateKingCharFlights が矢を射る操作（リールのロック）とは無関係に
   毎フレーム自走するため、プレイヤーは飛翔の完了を待たず次の的を狙える。
   'wait'状態（着地して結果待ち）にはタイムアウトが無いため、発射までの
   待機がどれだけ延びても安全（_updateKingCharFlights参照） */
function _kingReelShoot(inputPerfMs) {
  if (phase !== 'boss' || !_king || _king.reelIdx >= 4 || _king.awaitingFire) return;
  const w = _king.reels[_king.reelIdx];
  w.result = hitResult(w, -Math.PI/2); // 的の三角ポインタは常に真上（drawKingReel参照）
  w.locked = true;
  w.syncScore = (audioCtx && bgmPhaseRef !== null) ? calcSyncScore(inputPerfMs) : 0.5;
  playSE('kingShoot');
  _adjustKingCharWeight(_king.reelIdx, w.result); // この的で命中した文字の比率を少し上げる（次回respinから反映）
  _spawnKingCharFlight(w, _king.reelIdx);
  _king.reelIdx++;
  if (_king.reelIdx >= 4) _king.awaitingFire = true; // 4本マーク完了。発射は次の入力で_kingFireAttackが行う
}

/* 4本マーク後の発射入力（handleGameClickのphase==='boss'分岐、_king.awaitingFire
   がtrueの間はこちらに委譲される）。こ・ん・が・り全一致なら _kingApplyHit で
   発射、不一致なら何も起きない。いずれの場合も4本の結果文字を表示したまま
   静止させ、その後に再スピンする（_updateBossBattle が resultTimer を監視。
   解放条件は通常モードの的判定＝KING_RESULT_MIN_WAIT + onBeatGrid() と同じ仕様）。
   確定した4文字が読めないまま次に進んでしまうという実機指摘で追加
   （ミス時のペナルティは現状なし。将来M3でここに追加する） */
function _kingFireAttack() {
  if (phase !== 'boss' || !_king || !_king.awaitingFire) return;
  _king.awaitingFire = false;
  _king.attemptFired = true; // 的の帯電演出（drawKingReel参照）を止める
  const matched = _king.reels.every((r, i) => r.result === KING_TARGET[i]);
  if (matched) {
      const avgScore = _king.reels.reduce((a, r) => a + r.syncScore, 0) / 4;
      /* こんがり%はタップごとの精度で直接積算する（JUST=+1.0%・GOOD=+0.5%・
         OK以下=0%）。今回の4タップぶんの候補焦げ跡（スポーン時に
         _createKingMarkで生成済み、_spawnKingCharFlight参照）を、当たりが
         確定したこの時点で初めて _king.marks へ正式登録する（不一致なら
         登録されず消える＝「文字が飛んでいっていない場所に焦げが発生する」
         を避けるための設計を踏襲）。スコア平均（avgScore）はレーザー色・SE・
         JUST/GOOD/OKラベル表示のみに使う（_kingApplyHit参照。%やサイズには
         使わない＝1本ずつ個別判定という要望のため） */
      const thisAttempt = _kingCharFlights.filter(f => f.resolve === null);
      for (const f of thisAttempt) {
        if (!f.markRef) continue; // OK以下のタップは焦げ跡なし
        _king.marks.push(f.markRef);
        _king.cookPct = Math.min(100, _king.cookPct + (f.tier === 'just' ? KING_JUST_PCT : KING_GOOD_PCT));
      }
      _kingApplyHit(avgScore, thisAttempt);
      /* 勝利はここで確定させず予約だけする（この試技のビームを見せきってから
         _updateBossBattle が確定させる。pendingVictory の扱いはそちらのコメント参照） */
      if (_king.cookPct >= 100) _king.pendingVictory = true;
    } else {
      /* 失敗（こ・ん・が・り不一致）: こんがり%を少し後退させる。KING_MAX_FAILS回で
         ルーレット完全破壊＝敗北。ひびを追加するのはここではなく、実際に文字が
         的へ衝突した瞬間（_startKingCharBounce、_updateKingCharFlights参照。
         ユーザー要望: 「クラックが入るタイミングがおかしい。文字が衝突した瞬間
         という話をしたはず」）。
         playSE('miss')（ズコーという下降スライド）は当初「通常モードの外れと
         聞こえ方を統一する」ために流用したものだが、その後ユーザー要望で通常
         モード側は無音化したため（該当箇所のコメント参照）、現在このSEが鳴るのは
         キング戦の失敗時だけになっている。頻度が低く演出上の意味があるので
         ここでは維持する。なお実際にひびが入る瞬間には別途金属音が鳴る
         （_playKingCrackKin参照） */
      _king.cookPct = Math.max(0, _king.cookPct - KING_MISS_PCT_PENALTY);
      _king.failCount = Math.min(KING_MAX_FAILS, _king.failCount + 1);
      /* 6回目の失敗は即座に敗北確定にはせず、今回の4文字が全て的へ衝突（ひびが
         全て入り終える）まで待ってから、的が砕けて破片が消えきった後に敗北を
         確定する（ユーザー要望）。_updateKingCharFlightsのattemptToken.remaining
         が0になった時点でpendingDefeatを見て_startKingReelShatterへ進む */
      if (_king.failCount >= KING_MAX_FAILS) _king.pendingDefeat = true;
      playSE('miss');
      /* 篩い落としを予約する。実際の発動は4文字すべてがキングへ到着してから
         （_updateBossBattleが判定。KING_SIFT_*の定義部参照） */
      _king.siftPending = true;
    }
    _king.resultMatched = matched;
    _king.resultTimer = 0; // 結果表示保持タイマー開始（_updateBossBattle参照）
    /* 今回の試技で飛ばした（が未解決の）4体すべてに結果を伝える。着地先は
       スポーン時から確定済みのためここでの位置変更は不要
       （こんがり=そのまま吸い込まれる／ハズレ=そこから跳ね返る）。
       ハズレの4体には共通のattemptTokenを持たせる。remainingは「衝突（ひび）が
       全て入り終えたか」（シャッター演出のトリガー、_updateKingCharFlights参照）、
       aliveは「4体とも画面外へ消えて配列から取り除かれたか」（次のトライを
       許可する条件、_updateBossBattle参照）を別々に数える。衝突完了と画面外
       退場はタイミングが異なる（衝突後もfall状態でしばらく画面内に残る）ため
       2つのカウンタが必要 */
    const resolveAs = matched ? 'stick' : 'bounce';
    const attemptToken = matched ? null : { remaining: 0, alive: 0 };
    for (const f of _kingCharFlights) {
      if (f.resolve !== null) continue;
      f.resolve = resolveAs;
      if (attemptToken) { f.attemptToken = attemptToken; attemptToken.remaining++; attemptToken.alive++; }
    }
    /* ユーザー要望: 「こんがりが揃わなかった場合、落下してきた文字が的にぶつかって
       全て画面外に消えるまで、次のトライができないようにしてほしい」。
       _king側に保持し、_updateBossBattleの再スピン可否判定で参照する */
    _king.missAttemptToken = attemptToken;
}

/* 4本とも即座に再スピン（ヒット・ミス問わず毎回呼ばれる） */
function _respinKingReels() {
  _releaseKingReelOCs(_king.reels); // 旧的のOCをプールへ返却（リーク防止）
  for (let i = 0; i < 4; i++) {
    const { x, y } = _king.reels[i];
    _king.reels[i] = _createKingReel(x, y, _king.charWeights[i]); // 的ごとの現在の配分を引き継ぐ
  }
  _king.reelIdx = 0;
  _king.attemptFired = false; // 次トライの帯電演出（drawKingReel参照）を解禁
}

/* 的posIdxで文字charが命中した際、その的（他の3的とは独立）の配分を少し
   偏らせる。命中文字をKING_WEIGHT_STEPぶん増やし（上限KING_WEIGHT_MAX）、
   増えた分は他の3文字から比例配分で差し引く（下限KING_WEIGHT_MINを維持。
   下限に達した文字が出た場合は残りをさらに他へ再配分するwhileループ）。
   毎タップ（結果の当たり外れに関わらず）呼ぶ＝「その的で狙って当てた文字」
   だけが基準（ユーザー要望） */
function _adjustKingCharWeight(posIdx, char) {
  const w = _king.charWeights[posIdx];
  const target = Math.min(KING_WEIGHT_MAX, w[char] + KING_WEIGHT_STEP);
  let gain = target - w[char];
  w[char] = target;
  if (gain <= 0) return;
  const others = KING_CHARS.filter(c => c !== char);
  while (gain > 1e-9) {
    const reducible = others.filter(c => w[c] > KING_WEIGHT_MIN + 1e-9);
    if (reducible.length === 0) break; // 他3文字すべて下限＝これ以上削れない
    const pool = reducible.reduce((a, c) => a + (w[c] - KING_WEIGHT_MIN), 0);
    const take = Math.min(gain, pool);
    for (const c of reducible) w[c] -= take * (w[c] - KING_WEIGHT_MIN) / pool;
    gain -= take;
  }
}

/* こんがり一致成立時の焼き攻撃演出（レーザー・SE・JUST/GOOD/OKラベル）。
   こんがり%・焦げ跡サイズはタップ個別の精度で決まる（_spawnKingCharFlight・
   _kingReelShoot参照）。ここでのscore（4タップ平均）はSE・ラベル表示のみに使う。
   レーザーは的ごと・マークごとに個別発射する（ユーザー要望: 「射った的の三角
   からそれぞれ対応するマークに向かってビームを発射したい。ビームの色はマーク
   の色と一致させたい」）。マークが無い（OK以下）タップは対応するビームも無し
   ＝的とマークが1:1で対応する見た目を保つ */
function _kingApplyHit(score, flights) {
  let label = '';
  if      (score >= 0.667) label = 'JUST!';
  else if (score >= 0.333) label = 'GOOD';
  else                     label = 'OK'; // scoreは常に>0（calcSyncScoreの下限は約0.016）
  let fired = 0;
  for (const f of flights) {
    if (!f.markRef) continue; // 焦げ跡が無いタップはビームも発射しない
    const p1 = _kingReelPointerPos(_king.reels[f.reelIdx]);
    const p2 = _kingFlightTargetPos(f);
    /* マークの色＝そのタップの飛翔文字の色（drawKingCharFlightsのf.score基準の
       色付けと同一。_syncBarColor(f.score)）にビーム色を一致させる */
    const [col, glow] = _syncBarColor(f.score);
    _kingLasers.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
      age: 0, life: 14, maxLife: 14, color: col, glow });
    fired++;
  }
  /* こ・ん・が・りが揃っても4タップ全てがOK止まりだとmarkRefが無く、ビームが
     1本も出ず焦げ跡もこんがり%も増えない（JUST/GOODのみ加点という既存の
     バランス仕様どおり）。この時に発射音を鳴らすと「音は撃ったと言っているのに
     画面は無反応」になるため、音の方を実際の見た目に合わせて弱い不発音にする
     （バランスは変えず演出の整合だけを取る方針。タイミング精度が報酬の核という
     設計思想を薄めないため、OKティアへの加点はしない） */
  playSE(fired > 0 ? 'kingBeam' : 'kingBeamDud');
  syncJustLabel = label; syncJustTimer = 50; syncJustScore = score;
}

/* 誕生演出の鎮座位置→戦闘位置、戦闘位置→勝利拡大、それぞれのジャンプをなくすための
   表示トランスフォーム収束。bx/by/scaleは各フェーズが確定させる「目標値」、
   dbx/dby/dscaleは毎フレーム目標へ指数収束する「現在の表示値」。 */
function _easeKingXform() {
  _king.dbx += (_king.bx - _king.dbx) * KING_XFORM_EASE;
  _king.dby += (_king.by - _king.dby) * KING_XFORM_EASE;
  _king.dscale += (_king.scale - _king.dscale) * KING_XFORM_EASE;
}

/* キング戦系フェーズを通して「決着に関係なく背景で自走し続ける」演出をまとめて
   1フレーム進める。boss / bossShatter / bossVictory / bossDefeat /
   bossDefeatShrink / bossDefeatOutro のすべてから呼ぶ。
   以前はこの3つ（姿勢イージング・文字飛翔・レーザー寿命）が各フェーズの
   update関数にバラバラの組み合わせでコピーされており、bossVictory だけ
   レーザーの寿命処理が抜けている等の穴があった（実際、勝利を決めた瞬間の
   ビームが life を消費できず描画もされないまま残る不具合の一因になっていた）。
   フェーズごとの取捨選択をやめて一箇所に集約し、新しい常時演出を追加した際の
   水平展開漏れを構造的に防ぐ。
   個々の中身は対象が空なら何もしない（_king が null、配列が空）ため、
   どのフェーズから呼んでも安全 */
/* 文字飛翔の生存判定と後始末。毎フレーム呼ばれるswapRemoveの引数なので、
   その場のアロー関数ではなくモジュールスコープに置く（クロージャ生成ゼロ。
   通常モードの_pred*と同じ方針で、キング戦側にも水平展開する） */
const _predKingCharAlive = f => {
  if (f.state === 'stick') return f.frames < KING_CHAR_STICK_FADE_FRAMES;
  if (f.state === 'fall')  return !_isKingCharOffscreen(f) && f.frames < KING_CHAR_FALL_MAX_FRAMES;
  return true; // fly/wait/bounce は常に残す（bounceは衝突で必ずfallへ遷移する）
};
/* 画面外へ消えて配列から取り除かれた瞬間にattemptToken.aliveを減らす。
   _updateBossBattleがalive<=0（このattemptの4体が全て消え終えた）を見て
   初めて次のトライ（respin）を許可する（ユーザー要望） */
const _onKingCharRemoved = f => { if (f.attemptToken) f.attemptToken.alive--; };

function _updateKingCommonFx() {
  if (_king) _easeKingXform();
  /* 被弾した的の揺れを減衰させる（_kingReelShakeOffset参照）。衝突は破砕へ
     跨ぐ可能性があるため共通FX側で進める */
  if (_king && _king.reelShake) {
    for (let i = 0; i < _king.reelShake.length; i++) {
      if (_king.reelShake[i] > 0) _king.reelShake[i]--;
    }
  }
  /* 篩い落としの経過。文字の衝突→破砕（bossShatter）へ跨ぐ可能性があるため、
     boss限定ではなく共通FX側で進める */
  if (_king && _king.siftTimer !== null) {
    _king.siftTimer++;
    if (_king.siftTimer === KING_SIFT_RELEASE_FRAME) _king.gazeUp = 0; // 底で視線を戻す
    if (_king.siftTimer > KING_SIFT_RELEASE_FRAME + KING_SIFT_SETTLE_FRAMES) _king.siftTimer = null;
  }
  _updateKingCharFlights();
  for (const l of _kingLasers) { l.age++; l.life--; }
  swapRemove(_kingLasers, _predLife); // 既存の共通predを使う（毎フレームのクロージャ生成を避ける）
}

/* 篩い落としの縦変位（描画時オフセット。KING_SIFT_*の定義部参照）。
   タメで少し上へ→振り下ろしで底へ加速→底から減衰しながら上下に揺れる。
   区間の境目で値が連続するように、残振動の開始値を底の変位(+AMP)に合わせる */
function _kingSiftOffsetY() {
  if (!_king || _king.siftTimer === null) return 0;
  const t = _king.siftTimer;
  if (t < KING_SIFT_WINDUP_FRAMES) {
    return -KING_SIFT_AMP * 0.25 * _easeF(t / KING_SIFT_WINDUP_FRAMES, 'easeOut');
  }
  if (t < KING_SIFT_RELEASE_FRAME) {
    const p = (t - KING_SIFT_WINDUP_FRAMES) / KING_SIFT_DROP_FRAMES;
    return -KING_SIFT_AMP * 0.25 + KING_SIFT_AMP * 1.25 * _easeF(p, 'easeIn');
  }
  const p = Math.min(1, (t - KING_SIFT_RELEASE_FRAME) / KING_SIFT_SETTLE_FRAMES);
  return KING_SIFT_AMP * (1 - p) * Math.cos(p * Math.PI * 3);
}

/* 篩い落としのスカッシュ倍率（描画時のみ。底で最大、離脱後に戻る）。
   等倍のときはnullを返し、呼び出し側で余計なscaleを掛けないようにする */
function _kingSiftSquash() {
  if (!_king || _king.siftTimer === null) return null;
  const t = _king.siftTimer;
  let k = 0;
  if (t >= KING_SIFT_WINDUP_FRAMES && t < KING_SIFT_RELEASE_FRAME) {
    k = _easeF((t - KING_SIFT_WINDUP_FRAMES) / KING_SIFT_DROP_FRAMES, 'easeIn');
  } else if (t >= KING_SIFT_RELEASE_FRAME) {
    k = Math.max(0, 1 - (t - KING_SIFT_RELEASE_FRAME) / 10);
  }
  if (k <= 0) return null;
  return { sx: 1 + KING_SIFT_SQUASH * k, sy: 1 - KING_SIFT_SQUASH * k };
}

/* 被弾した的の揺れオフセット（描画時のみ。KING_REEL_SHAKE_*の定義部参照）。
   残量が無ければnullを返し、呼び出し側で余計なtranslateを掛けないようにする */
function _kingReelShakeOffset(idx) {
  if (!_king || !_king.reelShake || idx == null) return null;
  const r = _king.reelShake[idx];
  if (!r) return null;
  const t = KING_REEL_SHAKE_FRAMES - r;          // 経過フレーム（衝突フレームで0）
  /* 2乗で減衰させる。線形だと減衰後半にもう一度3px級の沈みが出て「2回叩かれた」
     ように見えたため、1発目を保ったまま以降を素早く収束させる */
  const lin   = r / KING_REEL_SHAKE_FRAMES;      // 1→0
  const decay = lin * lin;
  /* cosベースなので t=0（衝突した瞬間）に最大変位＝下向きへ沈む。
     BIASを足して下方向へ偏らせ、戻りの上向きは小さくする（KING_REEL_SHAKE_*参照） */
  const osc = KING_REEL_SHAKE_BIAS
            + (1 - KING_REEL_SHAKE_BIAS) * Math.cos(t * KING_REEL_SHAKE_FREQ);
  return {
    /* 横は衝突フレームで0から始めて後追いで揺れる（真上からの衝突なので、
       まず縦に沈み、横揺れは余韻として付いてくる方が自然） */
    x: Math.sin(t * 1.7) * KING_REEL_SHAKE_AMP * 0.22 * decay,
    y: osc * KING_REEL_SHAKE_AMP * decay,
  };
}

/* 文字を離してよいか（＝振り下ろしが底に達したか）。
   _kingがいない場合はtrueを返す: 待ち続けると文字が永久に降りてこず、
   破砕（attemptToken.remaining依存）まで進めなくなるため、進行不能を作らない側に倒す */
function _kingSiftReleased() {
  if (!_king) return true;
  return _king.siftTimer !== null && _king.siftTimer >= KING_SIFT_RELEASE_FRAME;
}

/* ハズレ確定の文字を、着地点（ボス側）から的の上部（三角ポインタ付近、
   f.rtx/rty＝ボス側を向いている面）へ戻す物理シミュレーションに切り替える
   （ユーザー要望: 的への衝突・反発・落下を物理エミュレーションで表現し、
   最終的に画面外へ落ちていくようにしたい。戻る先は的の下ではなくボス側の
   上にしたい）。ここではまだ「接近（bounce）」フェーズの初速度だけを設定
   する。等速直線運動で的へ向かい、KING_CHAR_RETURN_FRAMES後（＝ちょうど的に
   到達する頃）に_updateKingCharFlights側で衝突判定→反発（fallへ遷移）し、
   その瞬間に的へひびを追加する（_addKingReelCrackAtCollision参照）。
   この関数が呼ばれるのは篩い落としの振り下ろしが底に達した後（_kingSiftReleased） */
function _startKingCharBounce(f) {
  f.state = 'bounce'; f.frames = 0;
  const pos = _kingFlightTargetPos(f);
  f.bx = pos.x; f.by = pos.y;
  const dx = f.rtx - pos.x, dy = f.rty - pos.y;
  const dist = Math.hypot(dx, dy) || 1;
  const spd = dist / KING_CHAR_RETURN_FRAMES; // 復路は往路より短い（KING_CHAR_RETURN_FRAMES参照）
  f.bvx = dx / dist * spd;
  f.bvy = dy / dist * spd;
}

/* 文字が実際に的へ衝突した瞬間（bounce→fall遷移）にひびを1本追加する
   （ユーザー要望: 「クラックが入るタイミングがおかしい。文字が衝突した瞬間
   という話をしたはず」。以前はミス確定と同時に4的まとめて追加していたが、
   衝突は個々の文字の飛翔完了タイミングでバラける現象のため、それぞれの
   衝突の瞬間に合わせて1本ずつ追加するよう変更した）。的は再スピンにより
   衝突時点では別オブジェクトへ差し替わっている場合があるため、f.reelIdx
   （スロット番号、_spawnKingCharFlight参照）で現在の的を引き直す。
   ワールド座標上の衝突角（常に真上＝-PI/2＋ボス位置に応じた傾き）から、
   その的の「現在の」w.rotを差し引いてローカル角度に変換する（_createKingCrackWedge
   参照。衝突時点で的が既に次の的へ切り替わっていても、新しい的の現在の
   回転にひびが正しく追従する） */
function _addKingReelCrackAtCollision(f) {
  if (!_king || f.reelIdx == null) return;
  const rw = _king.reels[f.reelIdx];
  if (!rw) return;
  const biasAngle = Math.max(-0.35, Math.min(0.35, (rw.x - _king.dbx) / 220));
  const worldAngle = -Math.PI / 2 + biasAngle;
  /* 保存する角度は「基準文字エリアの開始角から見た相対角」にする
     （KING_CRACK_ANCHOR_CHAR参照）。w.rotだけを引いた的ローカル角のままだと、
     再スピンで的が新しいrot・新しいセグメント配置に作り直された際に、
     蓄積済みのひびが絵柄に対して回転移動して見えてしまう。
     描画側（drawKingReel）が現在の的の基準角を足し戻すため、着弾直後は
     文字が当たったその場所に、以後も絵柄に対して同じ位置に出続ける */
  const localAngle = worldAngle - rw.rot - _kingReelAnchorAngle(rw);
  /* 角度も一緒に保存する。破砕（_startKingReelShatter）が「ひびの入った位置で
     割る」ために境界角として使うため、ポリゴンから復元せず素直に持たせる */
  _king.reelCracks[f.reelIdx].push({ poly: _createKingCrackWedge(localAngle), angle: localAngle });
  /* 当たった衝撃でその的だけを小さく揺らす（_kingReelShakeOffset参照） */
  if (_king.reelShake) _king.reelShake[f.reelIdx] = KING_REEL_SHAKE_FRAMES;
  /* 衝突の瞬間だけ画面も短く揺らす（KING_IMPACT_SHAKE_*参照）。4文字は同じ
     フレームに着弾するので、加算せず同じ値をセットして暴れないようにする */
  _kingImpactShake = KING_IMPACT_SHAKE_FRAMES;
  /* ひびが入る瞬間の金属音（ユーザー要望。_playKingCrackKin参照）。
     揺れと同じ理由で多重発音を避ける: この関数は文字1体ごとに呼ばれ、4体は
     ほぼ同じフレームに着弾するため、素直に鳴らすと同じ音が4重になって音量が
     跳ね上がり「キン」ではなく潰れた濁音になる。直前の発音からの経過時間で
     間引いて1発にまとめる。
     フレームカウンタではなく wall-clock を使う理由: これは「実時間で失効すべき
     ガード」であり、rAFが止まる状況（タブ非表示など）でフレームが進まないと
     永久に失効せず、復帰後の最初のひびが無音になってしまう（CLAUDE.mdの
     時間条件の実装規約）。
     間隔が空いて着弾がばらけた場合は個別に鳴る（そのほうが自然）ため、
     窓は「同一フレーム群をまとめる」のに足る最小限に留める */
  const nowMs = performance.now();
  if (nowMs - _kingCrackKinLastMs >= KING_CRACK_KIN_MIN_GAP_MS) {
    _kingCrackKinLastMs = nowMs;
    playSE('kingCrack');
  }
}

/* 反発落下中（fall）の文字が画面外まで出たか（余白付き）。出ていれば表示終了してよい */
function _isKingCharOffscreen(f) {
  return f.bx < -KING_CHAR_OFFSCREEN_MARGIN || f.bx > W + KING_CHAR_OFFSCREEN_MARGIN ||
         f.by < -KING_CHAR_OFFSCREEN_MARGIN || f.by > H + KING_CHAR_OFFSCREEN_MARGIN;
}

/* こんがり確定の文字がボスへ実際に到達した瞬間。ここで初めて対応する焦げ跡の
   revealedAt を打つ（_king.marks の該当要素、_kingReelShoot で markRef として
   紐付け済み）＝焦げのフェード表示が文字の到着と同時に始まる。予約だけされて
   revealedAt 未設定の焦げ跡は _renderKingBody 側では「まだ見えない」ため、
   これより前のフレームで焦げが先に見えてしまうことはない */
function _stickKingChar(f) {
  f.state = 'stick'; f.frames = 0;
  if (f.markRef && f.markRef.revealedAt == null) f.markRef.revealedAt = performance.now();
}

/* 決定文字の飛翔演出を1フレーム進める。的のロック（_kingReelShoot）や
   resultTimer による再スピン待ちとは無関係に毎回呼ぶ＝背景処理として自走する。
   着地先（markRef）はスポーン時から確定済みで結果確定時に変わらないため、
   resolveが判明したらそのまま stick/bounce へ進めればよい（位置の作り直しは
   不要） */
function _updateKingCharFlights() {
  for (const f of _kingCharFlights) {
    if (f.state === 'fly') {
      f.frames++;
      if (f.frames >= KING_CHAR_FLY_FRAMES) {
        if (f.resolve === 'stick') _stickKingChar(f);
        /* ハズレ確定でもここで即bounceにはせず、いったん着地先で待機させる。
           篩い落とし（キングが振り下ろす）の底まで待ってから降り始めることで
           「到着→振り下ろす→落ちる」の因果が常に成立する（_kingSiftReleased参照）*/
        else { f.state = 'wait'; f.frames = 0; }
      }
    } else if (f.state === 'wait') {
      f.frames++;
      if (f.resolve === 'stick') _stickKingChar(f);
      else if (f.resolve === 'bounce' && _kingSiftReleased()) _startKingCharBounce(f);
    } else if (f.state === 'stick') {
      f.frames++;
    } else if (f.state === 'bounce') {
      /* 的への接近（等速直線運動）。KING_CHAR_RETURN_FRAMES＝ちょうど的に届く
         フレーム数に達したら衝突とみなし、反発速度を与えてfallへ遷移する */
      f.frames++;
      f.bx += f.bvx; f.by += f.bvy;
      if (f.frames >= KING_CHAR_RETURN_FRAMES) {
        f.state = 'fall'; f.frames = 0;
        /* 反発: 衝突点の法線（常に真上固定）方向＝bvy、接線（水平）方向＝bvxとして
           分解し、それぞれ反発係数・摩擦係数（ともに1未満）を掛けて減衰させる。
           bvyは常に正（ボスから的へ下向きに接近してくるため）なので、
           -RESTITUTION倍で符号反転（上向きに跳ね返る）しつつ確実に減速する。
           わずかな乱数は接線方向にだけ加え、自然さを出しつつ主成分は物理計算に従わせる */
        const jitter = (Math.random() - 0.5) * 0.5;
        f.bvx = f.bvx * KING_CHAR_BOUNCE_FRICTION + jitter;
        f.bvy = -f.bvy * KING_CHAR_BOUNCE_RESTITUTION;
        /* 弾き飛ばしインパルスをわずかに上乗せする（KING_CHAR_KNOCK_SPEED_X/Y
           定義部参照: ユーザー要望で運動エネルギーの大半を的の破壊に使わせ、
           ほぼ自由落下に近づけたため、この上乗せもごく小さい値に変更済み）。
           左右方向はボス中心から見たその的のオフセット方向（ひび演出の
           biasAngleと同じ考え方、_addKingReelCrackAtCollision参照）に払う */
        const reel = _king.reels[f.reelIdx];
        const knockDir = reel ? (Math.sign(reel.x - _king.dbx) || 1) : 1;
        f.bvx += knockDir * KING_CHAR_KNOCK_SPEED_X;
        f.bvy -= KING_CHAR_KNOCK_SPEED_Y;
        f.rotSpd = knockDir * KING_CHAR_KNOCK_ROT_SPD * (0.7 + Math.random() * 0.6);
        /* 衝突の瞬間にひびを追加（ユーザー要望どおりのタイミング） */
        _addKingReelCrackAtCollision(f);
        /* 同じ失敗attemptの4体全てが衝突し終えたら、6回目の失敗（pendingDefeat）
           の場合に限り的の破砕演出へ進む（_kingReelShoot参照）。
           phase==='boss'ガードは防御的措置: _updateKingCharFlightsは
           bossVictory/bossDefeat系の各updateからも呼ばれ続けるため、万一
           別phaseへ遷移済みの状態で衝突が完了してもシャッターで上書きしない
           （pendingDefeat中の再スピン停止で通常は起こり得ないが、二重保険） */
        if (f.attemptToken) {
          f.attemptToken.remaining--;
          if (f.attemptToken.remaining <= 0 && _king && _king.pendingDefeat && phase === 'boss') {
            _startKingReelShatter();
          }
        }
      }
    } else if (f.state === 'fall') {
      /* 弾き飛ばされた後の落下（重力）。水平方向はわずかに減速させ、垂直方向は
         重力加速度で下向きに増していく。画面外に出るまで表示し続ける。
         回転は衝突時に設定したrotSpd（knock方向に応じた符号）で等速回転させ、
         弾かれた勢いを視覚的に強調する（drawKingCharFlights参照） */
      f.frames++;
      f.bx += f.bvx; f.by += f.bvy;
      f.bvy += 0.32;
      f.bvx *= 0.99;
      f.rot += f.rotSpd;
    }
  }
  swapRemove(_kingCharFlights, _predKingCharAlive, _onKingCharRemoved);
}

function _updateBossBattle() {
  for (const w of _king.reels) if (!w.locked) w.rot += w.speed;
  _updateKingCommonFx();
  _updateBossBgmTier(); // こんがり度に応じて地鳴りをマイルド化（_playGroundRumble参照）
  /* 篩い落としの発動判定: 予約済みかつ「降ろす対象の文字が全員キングへ到着済み」
     になったら振り始める（ユーザー選択の案(b)）。到着済みの判定は
     bounce予定の文字が1つも'fly'に残っていないこと。最速発射でも常に
     「到着→振り下ろす→落ちる」の順になり、見え方が一定になる */
  if (_king.siftPending) {
    const pend = _kingCharFlights.filter(f => f.resolve === 'bounce');
    if (pend.length > 0 && pend.every(f => f.state === 'wait')) {
      _king.siftPending = false;
      _king.siftTimer = 0;
      _king.gazeUp = KING_SIFT_GAZE; // 振り下ろす間だけ下を見る（底で0へ戻す）
      _kingSiftShake = KING_SIFT_SHAKE_FRAMES;
      playSE('kingSift');
    } else if (pend.length === 0) {
      _king.siftPending = false; // 降ろす文字が無い（通常起こらないが保険）
    }
  }
  /* こんがり100%到達（pendingVictory）は即座に勝利へ飛ばさず、この試技で撃った
     ビームが消えきるのを待ってから確定させる。_kingFireAttackは入力ハンドラから
     同期的に呼ばれるため、そこで直接_startBossVictory()するとビーム生成と同じ
     フレームでphaseがbossVictoryに変わり、drawBossBattleが早期returnして
     「とどめの一撃のビームだけ一度も描画されない」状態になっていた。
     敗北側（pendingDefeat→文字の衝突完了を待って破砕へ）と同じ「予約してから
     演出の完了を待つ」形に揃える。ビームが1本も出なかった場合
     （全タップOK以下でmarkRefが無い）は_kingLasersが空なので即座に確定する */
  if (_king.pendingVictory) {
    if (_kingLasers.length === 0) { _startBossVictory(); }
    return;
  }
  /* 4本確定後の結果表示保持: 通常モードの的判定（endTimer + onBeatGrid()、2582行目
     付近）と同じ仕様に合わせる。ハズレ待ち時間が長くBGMとも同期していないという
     実機指摘で、wall-clockの固定待ち時間（旧KING_RESULT_HOLD_SEC）から、
     フレームカウンタ+BGM拍グリッド同期の解放条件に変更した。演奏・演出の進行に
     紐づくゲートなのでフレームカウンタが正しい（CLAUDE.md参照） */
  /* 6回目の失敗（pendingDefeat）後は再スピンしない。的は敗北結果を表示した
     ままロックされ続け、文字の衝突（ひび）→破砕へそのまま進む。
     以前はKING_RESULT_MIN_WAIT.miss（2フレーム）＋拍同期ですぐ再スピンして
     いたが、文字の衝突（シャッター発動）は復路込みで32フレーム以上先のため、
     6回目失敗後も的が回り直してタップ受付が再開され、pendingDefeat中に追加
     attemptを撃ててしまうバグがあった（最悪ケース: 追加attemptでこんがり
     100%到達→_startBossVictoryの後に、先行attemptの衝突完了でシャッターが
     発動し、勝利フローと敗北フローが衝突する）。再スピンを止めれば
     reelIdx=4のまま_kingReelShootの既存ガードで入力も塞がれる */
  if (_king.resultTimer !== null && !_king.pendingDefeat) {
    _king.resultTimer++;
    const minWait = _king.resultMatched ? KING_RESULT_MIN_WAIT.hit : KING_RESULT_MIN_WAIT.miss;
    /* ハズレの場合、弾き飛ばされた4体が全て画面外に消え終える
       （missAttemptToken.alive<=0）まで再スピンしない（ユーザー要望:
       「こんがりが揃わなかった場合、落下してきた文字が的にぶつかって全て
       画面外に消えるまで、次のトライができないようにしてほしい」）。
       reelIdx=4のまま再スピンを止めれば_kingReelShootの既存ガードで
       入力（次のトライ）も自動的に塞がれる。的中（stick）はフェードが
       10フレームと短く体感の待ちにならないため、この待ちは課さない */
    const missClear = _king.resultMatched || !_king.missAttemptToken || _king.missAttemptToken.alive <= 0;
    if (_king.resultTimer > minWait && onBeatGrid() && missClear) {
      _king.resultTimer = null;
      _king.missAttemptToken = null;
      _respinKingReels();
    }
  }
}

/* 決定文字の飛翔演出の描画。fly=弧を描いて接近、wait=着地して微妙に揺れながら
   待機、stick=こんがり成立で吸い込まれるようにフェード、bounce=ハズレで的へ
   直線的に接近、fall=的に衝突した反発後の重力落下（画面外に出るまでフェード
   しない。ユーザー指摘: 途中で消えるのではなく画面外に弾け飛ぶまで見えていて
   ほしい）。位置計算は _kingCurrentFlightPos に集約。
   文字色はそのタップのスコア（f.score）で通常モードのSYNCメーターと同じ
   赤〜黄〜緑（_syncBarColor）を使う（ユーザー指摘: OK/GOOD/JUSTの評価に
   合わせて色を変えたい・通常ゲーム時と同じ仕様にしたい）。
   文字自体の大きさもJUSTでKING_CHAR_JUST_FONT_SCALE倍にする（ユーザー指摘:
   マークされる文字の大きさと焦げ跡の面積は別物。焦げ跡側は常に一定サイズ）。
   フォントサイズが1文字ごとに変わるため ctx.font はループ内で設定する */
function drawKingCharFlights() {
  if (_kingCharFlights.length === 0) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.88)';
  for (const f of _kingCharFlights) {
    const { x, y } = _kingCurrentFlightPos(f);
    const alpha = f.state === 'stick' ? 1 - f.frames / KING_CHAR_STICK_FADE_FRAMES : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = _syncBarColor(f.score)[0];
    const fontSize = f.tier === 'just' ? KING_RESULT_FONT * KING_CHAR_JUST_FONT_SCALE : KING_RESULT_FONT;
    ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
    /* fall中（弾き飛ばされた後）はrotで回転させ、勢いよく弾かれた様子を強調する
       （KING_CHAR_KNOCK_ROT_SPD、_updateKingCharFlights参照） */
    if (f.state === 'fall' && f.rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(f.rot);
      ctx.strokeText(f.char, 0, 0);
      ctx.fillText(f.char, 0, 0);
      ctx.restore();
    } else {
      ctx.strokeText(f.char, x, y);
      ctx.fillText(f.char, x, y);
    }
  }
  ctx.restore();
}

function drawBossBattle() {
  /* bossShatter（6回目失敗の的破砕演出）中もボス本体・こんがりゲージは
     表示し続け、的の絵柄だけ_kingShatterの破片描画に差し替える
     （drawKingReelShatter参照） */
  if ((phase !== 'boss' && phase !== 'bossShatter') || !_king) return;
  /* レーザー（層状ストローク・shadowBlur不使用の描画規約に準拠）。
     距離に関わらずKING_LASER_TRAVEL_FRAMES（時間基準の進行度）で先端を
     x1,y1→x2,y2へ進めるため、的とマークの距離が違っても4本が同時に着弾する
     （ユーザー要望参照、KING_LASER_TRAVEL_FRAMES定義部） */
  for (const l of _kingLasers) {
    const t = Math.min(1, l.age / KING_LASER_TRAVEL_FRAMES);
    const tx = l.x1 + (l.x2 - l.x1) * t, ty = l.y1 + (l.y2 - l.y1) * t;
    const a = l.life / l.maxLife;
    ctx.save();
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = l.glow; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = l.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.restore();
  }
  /* ボス本体（焼き目蓄積済みライブOC・呼吸アニメ・戦闘用レイアウト縮小率を適用）。
     位置・スケールは dbx/dby/dscale（誕生演出からの収束中の表示値）を使う */
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  ctx.save();
  /* 篩い落としの縦変位とスカッシュは描画時にのみ掛ける（dby/dscaleは触らない。
     _kingSiftOffsetY / _kingSiftSquash の定義部参照）。文字の離脱位置には
     この変位を反映しない（ユーザー判断: 座標計算への波及を避ける） */
  ctx.translate(_king.dbx, _king.dby + _kingSiftOffsetY());
  const sq = _kingSiftSquash();
  if (sq) ctx.scale(breath * sq.sx, breath * sq.sy);
  else    ctx.scale(breath, breath);
  const bodySrc = _renderKingBody();
  ctx.drawImage(bodySrc, -_king.half, -_king.half, _king.half * 2, _king.half * 2);
  ctx.restore();
  /* 決定文字の飛翔（ボス本体の上に描く＝飛んで/跳ね返って見える） */
  drawKingCharFlights();
  /* こんがりミニリール4連（旧: 砲台）。破砕演出中は的の絵柄の代わりに
     飛び散る破片を描く */
  if (phase === 'boss') {
    for (let i = 0; i < 4; i++) drawKingReel(_king.reels[i], i === _king.reelIdx, i);
  } else {
    drawKingReelShatter();
  }
  drawKingCookGauge();
}

/* こんがりゲージ: BETバーと同じ位置・寸法（戦闘中はBETバーを非表示にして差し替える） */
/* achieved=true でラベルを「こんがり 達成！」に差し替える（退場演出中に使う。
   drawBossVictoryOutro参照。戦闘中は従来どおりパーセント表示） */
function drawKingCookGauge(achieved = false) {
  if (!_king) return;
  const pct = _king.cookPct / 100;
  const mx = IS_PORTRAIT ? 12 : 335, mw = IS_PORTRAIT ? W - 24 : 390;
  const my = IS_PORTRAIT ? P_BAR_Y : KING_GAUGE_Y, mh = IS_PORTRAIT ? P_BAR_H : KING_GAUGE_H;
  ctx.save();
  roundRect(mx, my, mw, mh, 10);
  ctx.fillStyle = 'rgba(40,20,5,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,140,40,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  const bh = 14, by = my + mh - bh - 10, bx = mx + 14, bw = mw - 28;
  roundRect(bx, by, bw, bh, 7);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  if (pct > 0) {
    roundRect(bx, by, bw * pct, bh, 7);
    ctx.fillStyle = pct >= 1 ? '#ffdd55' : '#c87830';
    ctx.fill();
  }
  ctx.font = `bold ${IS_PORTRAIT ? 16 : 18}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = Y;
  /* 四捨五入(Math.round)だと99.5%が「100%」と表示されるのに勝利条件
     （_king.cookPct>=100、_kingReelShoot参照）は満たさず、表示100%なのに
     クリアにならず追加で1本必要になる不整合が起きる（実機指摘）。切り捨て
     （Math.floor）にすることで、表示が100%になった時点で必ず実際にも
     100%（勝利条件成立）であることを保証する */
  ctx.fillText(achieved ? 'こんがり 達成！' : `こんがり ${Math.floor(pct * 100)}%`,
    mx + mw / 2, my + (mh - bh - 10) / 2 + 4);
  ctx.restore();
}

/* 湯気スプライト（柔らかい放射状グラデーションの円）を1回だけ生成する。
   shadowBlurは使わず（プロジェクト規約: GPUブラーパス削減のため全廃済み）、
   グラデーション自体で縁をぼかすことでソリッドな円に見えないようにする */
function _buildSteamSprite() {
  if (_steamSprite || !_CACHE_OK) return;
  const r = 32;
  const oc = _mkCache(r * 2 * _dpr, r * 2 * _dpr);
  const c = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.translate(r, r);
  const grd = c.createRadialGradient(0, 0, 0, 0, 0, r);
  grd.addColorStop(0,    'rgba(255,250,240,0.55)');
  grd.addColorStop(0.55, 'rgba(255,250,240,0.24)');
  grd.addColorStop(1,    'rgba(255,250,240,0)');
  c.fillStyle = grd;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
  _steamSprite = { oc, r };
}

/* 湯気を1本、キング本体の輪郭（上半分の弧）付近から立ち上らせる。
   本体楕円のジオメトリは_buildBossOC/_drawGyozaBodyと同じ比率
   （中心Y=+s*0.08、半径rx=s*0.58・ry=s*0.48、REF=42基準をkk=s/REFで
   拡大）を、キングの現在の表示位置・スケール（dbx/dby/dscale）で
   ワールド座標に変換して使う。輪郭よりわずかに内側（×0.85）から
   スポーンすることで「表面から立ち上る」質感にする。
   速度・半径も dscale に比例させ、キングの見た目のサイズに対して
   常に同じ相対的な大きさ・速さで立ち上るようにする */
function _spawnVictorySteamWisp() {
  if (!_king) return;
  const s = _BOSS_S * _king.dscale;
  const cx = _king.dbx, cy = _king.dby + s * 0.08;
  const rx = s * 0.58, ry = s * 0.48;
  const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * Math.PI * 0.75; // 真上を中心に上半分の弧
  _victorySteam.push({
    x: cx + Math.cos(ang) * rx * 0.85,
    y: cy + Math.sin(ang) * ry * 0.85,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -(0.35 + Math.random() * 0.25) * _king.dscale, // 上昇速度（下向き重力は加えない＝湯気は落ちてこない）
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleSpd: 0.03 + Math.random() * 0.02,
    wobbleAmp: 6 + Math.random() * 6,
    r0: (10 + Math.random() * 6) * _king.dscale,
    age: 0,
    maxAge: 90 + Math.random() * 40,
  });
}

function _updateVictorySteam() {
  for (const p of _victorySteam) {
    p.age++;
    p.wobblePhase += p.wobbleSpd;
    p.x += p.vx + Math.sin(p.wobblePhase) * (p.wobbleAmp * 0.03); // 左右にゆらめきながら上昇
    p.y += p.vy;
    p.vy -= 0.003; // ごくわずかに加速（浮力が強まっていくイメージ、暴走しない程度）
    /* 霧散中は寿命とは別の減衰係数で薄れていく（_disperseVictorySteam参照）。
       maxAgeを縮める方式にすると alpha=sin(age/maxAge*π) が跳ね上がって
       一瞬濃くなってしまうため、独立した係数を掛ける形にしている */
    if (p.disperse !== undefined) p.disperse = Math.max(0, p.disperse - _VICTORY_STEAM_DISPERSE_RATE);
  }
  _victorySteam = _victorySteam.filter(p => p.age < p.maxAge && p.disperse !== 0);
}

/* 溜めた湯気を一斉に霧散させる（ユーザー要望: 「力を貯めた後、飛び去り始めた
   ときに湯気は霧散するのが良い」）。キング中心から外向きに散らしつつ、
   独立した減衰係数で薄れさせる。飛び去り開始（bossVictoryOutro step1）で呼ぶ */
const _VICTORY_STEAM_DISPERSE_RATE = 0.045; // 1フレームあたりの減衰量（約22フレームで消えきる）
function _disperseVictorySteam() {
  const cx = _king ? _king.dbx : W / 2, cy = _king ? _king.dby : H / 2;
  for (const p of _victorySteam) {
    const dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy) || 1;
    p.vx += (dx / d) * 1.7;
    p.vy += (dy / d) * 1.1;
    p.wobbleAmp *= 1.6;   // ゆらめきも大きくして散り際を賑やかにする
    p.disperse = 1;
  }
}

function _drawVictorySteam() {
  if (!_steamSprite || _victorySteam.length === 0) return;
  ctx.save();
  for (const p of _victorySteam) {
    const t = p.age / p.maxAge;
    /* 0→1→0のなだらかな山型（現れて消えていく）。霧散中はさらに独立した
       減衰係数を掛ける（_disperseVictorySteam参照） */
    const alpha = Math.sin(Math.min(1, t) * Math.PI) * (p.disperse ?? 1);
    if (alpha <= 0.01) continue;
    const scale = 0.5 + t * 1.3; // 拡散して徐々に大きくなる
    const rr = p.r0 * scale;
    ctx.globalAlpha = alpha;
    ctx.drawImage(_steamSprite.oc, p.x - rr, p.y - rr, rr * 2, rr * 2);
  }
  ctx.restore();
}

function _startBossVictory() {
  phase = 'bossVictory';
  _bossVictoryTimer = 0;
  if (_king) _king.scale = 1; // 戦闘スケールから等倍への収束目標に切り替える（_easeKingXform）
  /* こんがり達成の報酬（ユーザー要望）: このキングの実体である蓄積メーター分
     （_kingMeterAtBattleStart＝1000+アルファ）と、過去の敗北で没収されて
     プールされていた分（kingLostPool）をまとめて所持ギヨウザへ返す。
     「キングに取り込まれていたギヨウザが、こんがり焼けて解放される」という
     筋立て。プールは返した時点で0に戻す（ユーザー指示）。
     返却額は勝利画面の表示にも使うため_bossVictoryWonCoinsへ控える（_kingは
     復帰時にnullになるので、そちらには持たせない＝真実の源を1つに保つ） */
  const won = _kingMeterAtBattleStart + kingLostPool;
  coins += won;
  kingLostPool = 0;
  _kingMeterAtBattleStart = 0; // 二重取得防止（次戦の_initBossBattleで再設定される）
  /* 蓄積メーターを1にする（ユーザー要望）。_initBossBattleが戦闘開始時に0へ
     リセットしているので実害は無かったが、敗北側が明示的に閾値の50%へ戻して
     いるのと対称に、達成側もここで明示する（暗黙の依存を残さない）。
     0ではなく1にするのは、退場演出で舞い上がらずに1個だけ残るギヨウザ
     （_victoryOutro.seedItem）と数を合わせるため＝「また1個から集まりはじめる」 */
  kingGyozaMeter = 1;
  _bossVictoryWonCoins = won;
  lsSave();
  lsSaveStats();
  checkCoinsAch(); // 返却で所持数が跳ね上がるため実績判定を回す
  launchFireworks();
  /* BGMをここで止め、達成感のある専用ファンファーレを鳴らす。従来は通常モードの
     jackpot（stopBGM+2秒後に自動再開）を流用しており、勝利演出の最中にボスBGM
     が復活してしまっていた。専用のBGM停止＋専用ファンファーレに差し替える
     （_stopBossBGMForVictory・_playKongariCompleteFanfare参照） */
  _stopBossBGMForVictory();
  playSE('kongari_complete');
  /* 実機報告で発覚: 「実績解除が今回初めてか」（!unlockedAch[KONGARI_ACH_ID]）
     で判定していたが、こんがり実績自体は真エンディング実装より前の別セッション
     で既に解除済みのプレイヤーが実在し、その場合は常にfalseになって
     _kingBattleEnd()（通常復帰）へ流れてしまい、真エンディングへ一切
     到達できなかった（スローハンドバナー等、通常モードの演出が一瞬見えて
     すぐ戻る、という報告と一致する）。
     判定すべきは「実績が今回初めて解除されたか」ではなく「真エンディングを
     まだ見ていないか」であり、これは実績の解除タイミングとは独立している
     （実績システムはこの機能より前から存在し得る）。trueEndingSeenは
     まさにこの判定のために用意したフラグなので、そちらを使う */
  _pendingTrueEnding = !trueEndingSeen;
  unlockAch(KONGARI_ACH_ID); // ギヨウザをこんがり焼いた（最後の実績）
  _buildSteamSprite();
  _victorySteam = [];
}

function _updateBossVictory() {
  _bossVictoryTimer++;
  /* 勝利確定の瞬間、直前の試技で飛ばした文字がまだ吸い込まれフェード中の場合が
     あるため、決着後も完了まで動かし続ける（背景処理なので中断させない） */
  _updateKingCommonFx();
  if (_bossVictoryTimer % 5 === 0 && _king) _spawnVictorySteamWisp();
  _updateVictorySteam();
}

function drawBossVictory() {
  if (phase !== 'bossVictory') return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    ctx.save();
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    drawKingCharFlights();
  }
  _drawVictorySteam();
  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 文言はボスの裾（拡大アニメ中は dscale に連動して動く）のすぐ下に置く。
     旧実装は画面上部固定だったため、所持ギヨウザ表示・上部アイコンと重なっていた
     （ユーザー報告で発覚）。dscale基準なので拡大演出中も裾の位置と一緒に滑らかに動く。 */
  const titleY = _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
  outText('こんがり キングギヨウザ！', W / 2, titleY, '#ffdd55', 'rgba(60,20,0,0.9)', 8);
  /* 返却されたギヨウザ数の表示。位置・書式・出るタイミングは敗北画面の没収
     メッセージ（drawBossDefeat）と対になるよう揃えてある。所持数表示自体も
     coinsDispのカウントアップで増えていくが、それだけだと「なぜ増えたのか」が
     分からないため理由を明示する */
  if (_bossVictoryTimer > 40 && _bossVictoryWonCoins > 0) {
    ctx.font = `bold 15px 'Hiragino Mincho ProN',serif`;
    outText(`ギヨウザ ${fmt(_bossVictoryWonCoins)}個が 解放された！`, W / 2, Math.max(H - 80, titleY + 40),
      '#ffe9a8', 'rgba(60,20,0,0.85)', 4);
  }
  if (_bossVictoryTimer > 90) {
    _drawBottomPillBadge('CONTINUE');
  }
  ctx.restore();
}

/* ════════════════ こんがり達成の退場演出（bossVictoryOutro） ════════════════
   実機指摘: 「唐突にキングギヨウザモードが終わる感じになっている」。
   原因は演出の非対称性で、こんがり失敗側は
   bossDefeat →（縮小ブリッジ）→ bossDefeatOutro（拡散＋締め2行）→ 画面フェード
   → tapestart（的スピンアップ＋BGM同期）と段階を踏むのに対し、達成側は
   CONTINUEタップから_kingBattleEnd()を直接呼んでおり、次のフレームでキングが
   消えて的が現れていた（スピンアップとBGM同期自体は_restartToTapestart経由で
   効いていたので、足りないのは「キングが去る」中間演出と画面フェードだけ）。
   ユーザー案「こんがりしたキングギヨウザが少し上を見て、上に飛び去る」を軸に、
   失敗側と対になる4段構成にする:
     step0 見上げ＋沈み込み（飛び立つ前のタメ）
     step1 上へ加速して飛び去る（easeIn＝加速して抜ける）
     step2 解放されたギヨウザが下から舞い上がる（失敗側の「拡散して落ちる」の対）
     step3 締めメッセージ（失敗側と同じ呼吸・同じmsgAlpha方式）
   その後は失敗側と完全に同じ場面転換（_startScreenFade → tapestart）。
   初回（実績コンプリート）の真エンディングへ入る場合も、この飛び去りを見せて
   から暗転して入る（ユーザー要望）。 */
const _VICTORY_OUTRO_LOOKUP_FRAMES = 40; // step0: 見上げ＋タメ
const _VICTORY_OUTRO_FLY_FRAMES    = 70; // step1: 飛び去り
const _VICTORY_OUTRO_ITEMS_FRAMES  = 60; // step2: 解放されたギヨウザの舞い上がり
/* 締め2行。ユーザー選択のC案（周回の示唆）。文言は実際に何度か遊んでから
   確定させる予定のため、ここだけ差し替えれば済むよう配列で持つ */
const _VICTORY_OUTRO_LINES = ['キングは みちたりて さった……', 'ギヨウザは また あつまりはじめる……'];
/* メッセージのフェード式は失敗側と共有する（_advanceOutroMsg）。ただし尺は
   共有せず、こちら専用の目標秒数（_OUTRO_MSG_TARGET_SEC_VICTORY = 6秒）を渡す。
   「締めの呼吸を揃える」ことは大事だが、失敗側と同じフレーム数にすることが
   呼吸を揃えることではなかった（こちらは文字数1.7倍・縦画面では4行になるため
   同じ尺では読み終わらない、という実機指摘があった） */
/* bossVictory の CONTINUE タップから呼ぶ。キングはまだ生きている（_king != null） */
function _startBossVictoryOutro() {
  if (!_king) { _finishBossVictoryOutro(); return; } // 保険: キングが居ない場合は演出を挟まず従来動作
  phase = 'bossVictoryOutro';
  /* 締め2行は画面幅に収まるよう折り返しておく（_wrapOutroLines参照）。
     尺は目標秒数から逆算するので縦横で合計は変わらない（縦画面は折り返しで
     4行になるが、合計6秒は同じ。_makeOutroMsgTiming参照） */
  const msgLines = _wrapOutroLines(_VICTORY_OUTRO_LINES);
  _victoryOutro = {
    step: 0, timer: 0, items: [], seedItem: null,
    msgAlpha: 0, gaugeAlpha: 1,
    baseBy: _king.by, baseScale: _king.scale,
    msgLines, msgTiming: _makeOutroMsgTiming(msgLines, _OUTRO_MSG_TARGET_SEC_VICTORY),
  };
  _king.gazeUp = 0;
  playSE('kingVictoryInhale');
}

/* 演出の終端。初回のみ真エンディングへ、2回目以降は通常モードへ復帰する
   （分岐条件は従来のbossVictory分岐と同一。_pendingTrueEnding参照） */
function _finishBossVictoryOutro() {
  if (_victoryOutro) {
    for (const g of _victoryOutro.items) g._dead = true; // プールへ返却（リーク防止）
    if (_victoryOutro.seedItem) _victoryOutro.seedItem._dead = true;
    _victoryOutro = null;
  }
  if (_pendingTrueEnding) { _pendingTrueEnding = false; _startTrueEnding(false); }
  else _kingBattleEnd();
}

/* 解放されたギヨウザが舞い上がる群れを生成する。個数は解放数に応じて増やし、
   プールを溜めてから勝ったときの見返りが視覚的にも効くようにする
   （上限は描画負荷のため失敗側と同じ44個で打ち止め） */
function _makeVictoryOutroItems() {
  const n = Math.max(12, Math.min(44, 12 + Math.floor(_bossVictoryWonCoins / 100)));
  const items = [];
  for (let i = 0; i < n; i++) {
    const x = W * (0.08 + Math.random() * 0.84);
    const y = H + 40 + Math.random() * H * 0.5;      // 画面下の外から湧き上がる
    const g = makeItem(x, y, (Math.random() - 0.5) * 0.6, -(2.6 + Math.random() * 2.2));
    items.push(g);
  }
  return items;
}

function _updateBossVictoryOutro() {
  const o = _victoryOutro;
  if (!o) { _finishBossVictoryOutro(); return; }
  _updateKingCommonFx();
  /* 湯気の更新はここで明示的に呼ぶ。_updateKingCommonFx（姿勢・飛翔文字・
     レーザー）には含まれておらず、bossVictoryでは_updateBossVictoryが個別に
     呼んでいる。退場演出でこれを呼び忘れていたため、湯気が描画だけされて
     位置も寿命も進まず画面に固定表示で残っていた（実機指摘） */
  _updateVictorySteam();
  o.timer++;

  if (o.step === 0) {
    /* 見上げる: 瞳を上へ寄せつつ、わずかに沈み込んでから戻る（跳ぶ前の予備動作）。
       sin(p*π) なので step0 の終わりにはちょうど元の高さへ戻り、step1 の
       上昇へ滑らかに繋がる */
    const p = Math.min(1, o.timer / _VICTORY_OUTRO_LOOKUP_FRAMES);
    if (_king) {
      _king.gazeUp = Math.min(1, p / 0.6);           // 前半6割で見上げきる
      const sink = 10 * Math.sin(p * Math.PI);
      _king.by = o.baseBy + sink; _king.dby = _king.by; // イージングの遅れを挟まず直接置く
    }
    if (o.timer % 3 === 0 && _king) _spawnVictorySteamWisp(); // 力を溜めるイメージで湯気を増やす
    if (o.timer >= _VICTORY_OUTRO_LOOKUP_FRAMES) {
      o.step = 1; o.timer = 0;
      /* 溜めた湯気は飛び去りと同時に霧散させる（ユーザー要望）。
         step1では新たな湯気を出さない＝「溜めた力を解き放って飛び立つ」
         という筋立てにする（軌跡として出し続けると霧散と矛盾する） */
      _disperseVictorySteam();
      playSE('kingVictoryFly');
    }
  } else if (o.step === 1) {
    /* 飛び去る: easeIn で加速しながら画面上方へ抜ける。同時に縮小して遠ざかる
       遠近感を出す。_easeKingXform の指数収束は「減速して着く」動きなので
       ここでは使わず、by/dby・scale/dscale を直接置いて加速感を保つ */
    const p = Math.min(1, o.timer / _VICTORY_OUTRO_FLY_FRAMES);
    const e = _easeF(p, 'easeIn');
    if (_king) {
      const targetY = -_BOSS_S * 1.3;                 // 画面上端の外
      _king.by = o.baseBy + (targetY - o.baseBy) * e; _king.dby = _king.by;
      _king.scale = o.baseScale * (1 - 0.4 * e);      _king.dscale = _king.scale;
    }
    o.gaugeAlpha = Math.max(0, 1 - p * 1.6);          // ゲージは飛び去りに合わせて消す
    if (o.timer >= _VICTORY_OUTRO_FLY_FRAMES) {
      o.step = 2; o.timer = 0;
      o.gaugeAlpha = 0;
      o.items = _makeVictoryOutroItems();
      /* 周回の示唆: 1個だけ舞い上がらずに残り、画面下でゆっくり漂う。
         「また集まりはじめる」という締め文（_VICTORY_OUTRO_LINES）と対応させる */
      o.seedItem = makeItem(W / 2, H * 0.82, 0, -0.18);
    }
  } else if (o.step === 2 || o.step === 3) {
    /* 解放されたギヨウザの舞い上がり。step3（メッセージ表示中）も動かし続けて
       背景で舞っている状態を保つ */
    for (const g of o.items) {
      g.x += g.vx; g.y += g.vy;
      g.vy -= 0.012;                 // ゆるやかに加速して昇っていく
      g.rot += g.rotSpd * 0.5;
    }
    if (o.seedItem) {
      const s = o.seedItem;
      s.y += s.vy;
      s.rot += 0.004;                // ほとんど止まって見えるゆるい回転
    }
    if (o.step === 2 && o.timer >= _VICTORY_OUTRO_ITEMS_FRAMES) { o.step = 3; o.timer = 0; }
    if (o.step === 3) {
      /* 締めメッセージ。失敗側（_updateBossDefeatOutro）と同じ実装を共有する
         （_advanceOutroMsg）。尺は _startBossVictoryOutro で目標6秒から逆算済み
         （失敗側は3秒。_makeOutroMsgTiming参照） */
      if (_advanceOutroMsg(o)) _startScreenFade(() => _finishBossVictoryOutro());
    }
  }
}

function drawBossVictoryOutro() {
  if (phase !== 'bossVictoryOutro' || !_victoryOutro) return;
  const o = _victoryOutro;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  /* 舞い上がるギヨウザはキングより先に描く（キングの手前に被らせない） */
  for (const g of o.items) drawOneItem(g);
  if (o.seedItem) drawOneItem(o.seedItem);
  if (_king) {
    ctx.save();
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
  }
  _drawVictorySteam();
  /* こんがりゲージの締め: 100%のまま「達成！」を出してから飛び去りに合わせて
     消す（実機指摘: 決着した瞬間にゲージが消えるのも唐突さの一因） */
  if (o.gaugeAlpha > 0) {
    ctx.globalAlpha = o.gaugeAlpha;
    drawKingCookGauge(true);
    ctx.globalAlpha = 1;
  }
  if (o.step >= 3) {
    /* 描画本体は失敗側と共通で、色だけが違う（_drawOutroMsg参照） */
    _drawOutroMsg(o, '#ffe9a8', 'rgba(60,20,0,0.9)');
  }
  ctx.restore();
}

/* ════════════════ 真エンディング ════════════════
   「こんがり」実績は他の全実績を達成しないと解除できない設計（_allAchExceptKongariDone
   参照）のため、実質的に「実績コンプリートの祝賀」演出として位置づける。
   初回のこんがり達成時のみ自動再生し（_pendingTrueEnding、_startBossVictory・
   handleGameClickのbossVictory分岐参照）、2回目以降はタイトル画面のボタン
   （TRUE_ENDING_BTN、トロフィーの右隣）からいつでも見返せるようにする
   （replay=true）。エンディングはゲーム途中で見るものではなくスタートと
   並列の選択肢という位置づけのため、あえて実績パネルの中には置かない。
   3幕構成、いつでもタップでスキップ可（act3の締めくくりのみ
   最短表示後にCONTINUE待ち、既存のバッジ演出と同じ操作感）。 */
/* 開幕セリフ（「荒ぶっていた／野生のギヨウザたちも／おだやかな心を取り戻しました。」）は
   廃止した。こんがり達成の退場演出（bossVictoryOutro: 見上げ→飛び去り→解放→締め2行）を
   追加したことで、その直後に見せる内容としてこのセリフが噛み合わなくなったため
   （尺を詰める目的ではない）。副作用として、開幕セリフに紐づいていたキングの
   再登場（旧_trueEndingKingAlpha）も無くなり、「飛び去ったキングがエンドロールで
   また出てくる」という矛盾も解消している。
   代わりに実績一覧の前に見出しを1行置く（上下を細い罫線で挟むだけの最小構成。
   締めで丸いギヨウザロゴを大きく見せる構成を弱めないよう、冒頭は文字だけに留める） */
