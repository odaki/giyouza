  if (endTimer % 18 === 0 && ghosts.length < MEDIUM_EFFECT_GYOZA_N) spawnGhost();
  for (const g of ghosts) {
    g.y += g.vy;
    g.wobble += g.wobbleSpd;
    g.x += Math.sin(g.wobble) * 0.9;
    const fadeZone = 80;
    if (g.y > H - fadeZone) g.alpha = Math.min(0.80, g.alpha + 0.04);
    else if (g.y < fadeZone) g.alpha = Math.max(0, g.alpha - 0.025);
    if (g.y < -g.r * 3) g.alive = false;
  }
  swapRemove(ghosts, _predAlive, _releaseGhost); // キャンバスをプールへ返却
}

/* outroTimerを渡すと退場中のリストを描く（_drawFxOutro参照）。省略時は現トライのghosts */
function drawUuuu(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'uuuu' || endTimer < 50)) return;
  ctx.save();
  for (const g of (list ?? ghosts)) {
    if (g.alpha <= 0.01) continue;
    ctx.globalAlpha = g.alpha;
    if (g._oc) {
      /* 事前レンダリング済みキャンバスをdrawImageで貼り付け（createRadialGradient不要） */
      ctx.drawImage(g._oc, g.x - g._ocSz / 2, g.y - g._ocCy);
    } else {
      /* フォールバック: 旧パス */
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.beginPath();
      ctx.arc(0, 0, g.r, Math.PI, 0);
      ctx.lineTo(g.r, g.r * 0.6);
      const segs = 5;
      for (let i = segs-1; i >= 0; i--) {
        const x1 = g.r - (2*g.r/segs)*(segs-i-0.5);
        const x2 = g.r - (2*g.r/segs)*(segs-i);
        ctx.quadraticCurveTo(x1, g.r*0.6 + (i%2===0?1:-1)*g.r*0.32, x2, g.r*0.6);
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(180,215,255,0.8)'; ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ザザザザ: 雨 ════════════════ */
function initZazazaza() { rainDrops = _releaseAll(rainDrops); }

function updateZazazaza() {
  const rate = endTimer < 80 ? 4 : endTimer < 180 ? 10 : 20;
  for (let i = 0; i < rate; i++) {
    const d = _poolAlloc(_rainPool);
    d._dead = false; d.ripple = false; d.splashed = false;
    d.x = Math.random() * (W + 80) - 40; d.y = -20;
    d.vx = -1.5 + Math.random()*0.5; d.vy = 9 + Math.random()*9;
    d.len = 12 + Math.random()*18; d.a = 0.35 + Math.random()*0.45;
    rainDrops.push(d);
  }

  const rLen = rainDrops.length;
  for (let ri = 0; ri < rLen; ri++) {
    const r = rainDrops[ri];
    if (r.ripple) { r.life--; continue; }
    r.x += r.vx; r.y += r.vy;
    if (r.y >= H - 16 && !r.splashed) {
      r.splashed = true;
      const rp = _poolAlloc(_rainPool);
      rp._dead = false; rp.ripple = true;
      rp.x = r.x; rp.y = H-16; rp.life = 12; rp.maxLife = 12;
      rainDrops.push(rp);
    }
  }
  swapRemove(rainDrops, _predRainDrop, _deadify);
}

function drawZazazaza() {
  if (hitType !== 'zazazaza' || endTimer < 50) return;
  const intensity = Math.min(1, (endTimer - 50) / 60);
  ctx.save();
  for (const r of rainDrops) {
    ctx.globalAlpha = (r.a ?? 0.5) * intensity;
    if (r.ripple) {
      const t = 1 - r.life / r.maxLife;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, t*14, t*5, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(140,200,255,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x + r.vx*(r.len/r.vy), r.y - r.len);
      ctx.strokeStyle = 'rgba(160,215,255,0.75)';
      ctx.lineWidth = 1;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ════════════════ ギョギョ: びっくり魚 ════════════════ */
function initGyogyo() {
  gyogyoFish = [];
  for (let i = 0; i < MEDIUM_EFFECT_GYOZA_N; i++) {
    const fromLeft = Math.random() < 0.5;
    const size = 28 + Math.random() * 28;
    /* bodyGrd: makeItem()と同様に生成時1回だけ作成（drawFish内での毎フレーム生成を排除）
       グラジェント座標はfillStyle適用時の座標系で評価されるため
       transform前に生成しても translate+rotate後の使用で正しく機能する */
    const bodyGrd = ctx.createRadialGradient(-size*0.15, -size*0.3, 0, 0, size*0.1, size*1.1);
    bodyGrd.addColorStop(0,   'hsl(42,70%,82%)');
    bodyGrd.addColorStop(0.6, 'hsl(38,62%,72%)');
    bodyGrd.addColorStop(1,   'hsl(34,55%,58%)');
    gyogyoFish.push({
      x:     fromLeft ? -70 : W + 70,
      y:     60 + Math.random() * (H - 140),
      vx:    (fromLeft ? 1 : -1) * (2.5 + Math.random() * 3.5),
      vy:    (Math.random() - 0.5) * 2.5,
      size,
      phase: Math.random() * Math.PI * 2,
      col:   ['#f0a030','#e06820','#ff8040','#ffcc44','#dd6644'][Math.floor(Math.random()*5)],
      bodyGrd,
      exclamTimer: 0,
      exclamDur:   0,
    });
  }
}

function drawFish(f, t) {
  const s = f.size;
  const angle = Math.atan2(f.vy, f.vx);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(angle);

  /* 尾ひれ（揺れる）— ギヨウザ後端に取り付け */
  const tailWag = Math.sin(t * 0.18 + f.phase) * 0.35;
  ctx.save();
  ctx.translate(-s * 0.72, s * 0.08); // ギヨウザ楕円の後端付近
  ctx.rotate(tailWag);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-s * 0.55,  s * 0.40);
  ctx.lineTo(-s * 0.55, -s * 0.40);
  ctx.closePath();
  ctx.fillStyle = f.col;
  ctx.globalAlpha = 0.85;
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,50,20,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  /* ── ギヨウザ本体（drawOneItem と同じパス構成） ── */
  /* 本体楕円（焼きギヨウザカラー） */
  ctx.beginPath();
  ctx.ellipse(0, s*0.08, s*0.58, s*0.48, 0, 0, Math.PI*2);
  ctx.fillStyle = f.bodyGrd; // initGyogyo()で事前生成済み
  ctx.globalAlpha = 0.97;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* 蒸し焼き底面の焦げ色 */
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, s*0.32, s*0.46, s*0.18, 0, 0, Math.PI*2);
  ctx.fillStyle = 'hsl(30,60%,52%)';
  ctx.globalAlpha = 0.45;
  ctx.fill();
  ctx.restore();

  /* 頂部の薄皮 */
  ctx.beginPath();
  ctx.ellipse(0, -s*0.12, s*0.40, s*0.14, 0, 0, Math.PI*2);
  ctx.fillStyle = 'hsl(50,55%,88%)';
  ctx.globalAlpha = 1;
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,90,50,0.4)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  /* ひだ */
  ctx.strokeStyle = 'rgba(140,105,55,0.55)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  for (let i = -4; i <= 4; i++) {
    const bx = i * s * 0.095;
    ctx.moveTo(bx, -s*0.04);
    ctx.bezierCurveTo(bx - s*0.04, -s*0.22, bx + s*0.04, -s*0.22, bx + s*0.07, -s*0.04);
  }
  ctx.stroke();

  /* ハイライト */
  ctx.beginPath();
  ctx.ellipse(-s*0.18, -s*0.08, s*0.16, s*0.09, -0.4, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fill();

  /* びっくり目（ひだの右寄りに配置） */
  const ex = s * 0.30, ey = -s * 0.04;
  ctx.beginPath();
  ctx.arc(ex, ey, s * 0.22, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  /* 瞳 */
  ctx.beginPath();
  ctx.arc(ex + s * 0.05, ey, s * 0.11, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  /* ハイライト */
  ctx.beginPath();
  ctx.arc(ex + s * 0.08, ey - s * 0.07, s * 0.04, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  /* 驚き線 */
  for (let k = 0; k < 6; k++) {
    const a2 = (k / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(ex + Math.cos(a2) * s*0.27, ey + Math.sin(a2) * s*0.27);
    ctx.lineTo(ex + Math.cos(a2) * s*0.36, ey + Math.sin(a2) * s*0.36);
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  /* 口（O形、ひだの右端付近） */
  ctx.beginPath();
  ctx.arc(s * 0.60, s * 0.10, s * 0.09, 0, Math.PI * 2);
  ctx.fillStyle = '#cc3300';
  ctx.fill();

  ctx.restore();
}

function updateGyogyo() {
  const t = endTimer;
  for (const f of gyogyoFish) {
    f.x += f.vx;
    f.y += f.vy + Math.sin(t * 0.09 + f.phase) * 0.6;
    f.vx *= 0.998;
    if (Math.abs(f.vx) < 1.2) f.vx = 1.2 * Math.sign(f.vx);
    const margin = f.size * 1.2;
    if (f.x < margin   && f.vx < 0) { f.vx *= -1; f.exclamTimer = 0; f.exclamDur = 25; }
    if (f.x > W-margin && f.vx > 0) { f.vx *= -1; f.exclamTimer = 0; f.exclamDur = 25; }
    if (f.y < margin   && f.vy < 0) f.vy *= -1;
    if (f.y > H-margin && f.vy > 0) f.vy *= -1;
    if (f.exclamTimer < f.exclamDur) f.exclamTimer++;
  }
}

/* outroTimerを渡すと退場中の魚だけを描く（_drawFxOutro参照）。
   時間軸に別のタイマーを使うのは、endTimerが次トライで0に戻るため。
   そのまま使うと尾ひれの揺れや「ギョギョ！」の明滅が止まってしまう。
   「ギョギョ！」テキストは当たり演出そのものなので退場中は出さない */
function drawGyogyo(list, outroTimer) {
  const outro = outroTimer != null;
  if (!outro && (hitType !== 'gyogyo' || endTimer < 45)) return;
  const t = outro ? outroTimer : endTimer;
  const fadeIn = outro ? 1 : Math.min(1, (t - 45) / 40);

  ctx.save();
  ctx.globalAlpha = fadeIn;

  for (const f of (list ?? gyogyoFish)) {
    drawFish(f, t);

    /* ！エクスクラメーション（exclamTimer更新はupdateGyogyo()で実施） */
    if (f.exclamTimer < f.exclamDur) {
      const prog = f.exclamTimer / f.exclamDur;
      const alpha2 = prog < 0.5 ? prog * 2 : (1 - prog) * 2;
      ctx.save();
      ctx.globalAlpha = alpha2 * 0.9 * fadeIn;
      ctx.font = `bold ${f.size * 0.9}px sans-serif`;
      ctx.fillStyle = '#ff3300';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const angle2 = Math.atan2(f.vy, f.vx);
      const px = f.x + Math.cos(angle2 - Math.PI / 2) * f.size * 1.5;
      const py = f.y + Math.sin(angle2 - Math.PI / 2) * f.size * 1.5;
      ctx.strokeText('！', px, py);
      ctx.fillText('！', px, py);
      ctx.restore();
    }
  }

  /* 「ギョギョ！」テキストを散らす（退場中は出さない: 上のコメント参照） */
  const msgs = outro ? [] : ['ギョ！', 'ギョギョ！', 'ギョッ！', '！！！', 'ギョッ'];
  for (let k = 0; k < msgs.length; k++) {
    const beat = Math.sin(t * 0.13 + k * 1.3);
    const scale2 = 0.7 + Math.abs(beat) * 0.5;
    const alpha3 = (0.35 + Math.abs(beat) * 0.55) * fadeIn;
    const tx2 = 110 + (k * 213) % (W - 180);
    const ty2 = 70  + ((k * 97 + Math.floor(t / 80) * 50) % (H - 150));
    ctx.save();
    ctx.globalAlpha = alpha3;
    ctx.translate(tx2, ty2);
    ctx.scale(scale2, scale2);
    ctx.rotate(Math.sin(t * 0.07 + k) * 0.3);
    ctx.font = `bold 26px ${FONT_MIN}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 5;
    ctx.strokeText(msgs[k], 0, 0);
    ctx.fillStyle = '#ffee00';
    ctx.fillText(msgs[k], 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

/* ════════════════ 画面エフェクト ════════════════ */

/* ── ギザギザ ── */
function drawGizagizaEffect() {
  if (hitType !== 'gizagiza' || endTimer < 45) return;
  const intensity = Math.min(1, (endTimer-45)/25);
  const t = endTimer;

  /* ジグザグ線を複数層 */
  for (let l = 0; l < 7; l++) {
    const baseY = ((t*2.8 + l*H/7) % (H+60)) - 30;
    const amp   = 12 + l*4;
    const seg   = 20 + l*5;
    const alpha = (0.18 + l*0.03) * intensity;
    ctx.save();
    ctx.strokeStyle = l%2===0 ? `rgba(192,216,255,${alpha})` : `rgba(255,255,255,${alpha*0.7})`;
    ctx.lineWidth   = 1 + l*0.4;
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    let up = (l%2===0);
    for (let x = 0; x <= W; x += seg) {
      ctx.lineTo(x, baseY + (up ? -amp : amp));
      up = !up;
    }
    ctx.stroke();
    ctx.restore();
  }

  /* 鋭角フラッシュ (ランダムに現れる稲妻的ライン) */
  if (Math.random() < 0.12 * intensity) {
    const lx = Math.random()*W;
    ctx.save();
    ctx.strokeStyle = `rgba(220,240,255,${0.5*intensity})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    let cy2 = 0;
    while (cy2 < H) {
      const step = 20 + Math.random()*40;
      const dx   = (Math.random()-0.5)*60;
      ctx.lineTo(lx+dx, cy2+step);
      cy2 += step;
    }
    ctx.stroke();
    ctx.restore();
  }
}

/* ── ウザウザフラッシュ ── */
function drawUzaFlash() {
  if (hitType !== 'uzauza' || endTimer < 45) return;
  const intensity = Math.min(1, (endTimer-45)/30);
  /* イライラする点滅 */
  if (Math.floor(endTimer/4) % 3 === 0) {
    ctx.fillStyle = `rgba(255,80,0,${0.07*intensity})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ════════════════ キングギヨウザ 出現予告 ════════════════
   蓄積メーター（画面外へ退場した落下ギヨウザ累計）が閾値に達すると、トライの区切りで
   出現予告演出（phase='bossOmen'）が発動する。
   構造は 暗転 → タメ台詞 → バラバラのギヨウザが中心へ収束 → 変身 の4段で、そのまま
   戦闘（phase='boss'）へ入る。敗北時の弾け散り演出（_defeatOutro）はこの収束の
   厳密な逆再生になっているので、片方を変えたらもう片方も合わせること */

const _OMEN_LINES = ['……おや？', 'ギヨウザたちが……', 'ちからを あわせて……', '……くる。'];
const _OMEN_LINE_FRAMES = 80; // 台詞1行あたりの表示フレーム数（タメ）
let _omen = null;      // { step, timer, items, flash } 予告演出の状態（null=非表示）
/* 予兆のギヨウザ [{ g(プール由来のアイテム), age, life, th, swirl, r0, rNear, rOut, spin, alpha, a }] */
let _omenFx = [];
const _predOmenFxAlive = o => o.age < o.life;
const _releaseOmenFx   = o => { o.g._dead = true; }; // アイテムプールへ返す（_deadifyと同じ扱い）
let _bossOC = null, _BOSS_S = 0; // キングギヨウザ本体スプライト（初回出現時に生成）

/* こんがりしっぱい（ルーレット破壊・全損には至らない敗北）後、通常モードへ
   戻る前のつなぎ演出。誕生演出（バラバラのギヨウザが収束してキングギヨウザになる）を
   逆再生するイメージで、キングの姿がふつうのギヨウザ群へ弾け散り、そのあと誕生演出と
   同じ台詞スタイルでメッセージを出してから復帰する */
const _DEFEAT_OUTRO_LINES = ['ちからが とけて……', 'かえっていった……'];
/* 締めメッセージ（達成側・失敗側で共通の書式）のフォント。
   折り返しの計測（_wrapOutroLines）と実描画（_drawOutroMsg）で必ず同じ書式を
   使わないと、計測結果と実際の幅がずれてそのまま横はみ出しになる（実機で一度
   発生済み）。サイズだけでなくフォント文字列そのものを一本化しておく */
function _outroMsgFontSize() { return IS_PORTRAIT ? 26 : 30; }
function _outroMsgFont() { return `bold ${_outroMsgFontSize()}px ${FONT_MIN}`; }
/* 締めメッセージを画面幅に収まるよう折り返す。
   縦画面（W=420）は横画面よりずっと狭いので、固定の行配列をそのまま描くと文字が
   はみ出す。文言は後から調整する前提なので、必ずここを通してどんな文言でも収まる
   ようにする。区切りはエンドロールと同じく空白（半角・全角）位置。
   ctx.measureTextを使うので演出の開始時に1度だけ実行し、結果を状態に持たせる
   （毎フレーム計測しない） */
function _wrapOutroLines(lines) {
  return lines.flatMap(t => _wrapTrueEndingLine(t, _outroMsgFont(), W - 48)); // 左右24pxずつの余白
}
let _defeatOutro = null; // { step, timer, items } つなぎ演出の状態（null=非表示）
/* こんがり達成側の退場演出の状態（null=非表示、drawBossVictoryOutro参照）。
   宣言をここに置くのは_cleanupKingBattleStateが両方を後片付けするため
   （letはホイストされないので、使用箇所より後で宣言するとTDZ risk になる） */
let _victoryOutro = null; // { step, timer, items, seedItem, msgAlpha, gaugeAlpha, baseBy, baseScale }

/* 予兆の進み具合（0=まだ出さない → 1=出現直前）。KING_OMEN_FX_* の補間に使う。

   蓄積と実績の**小さいほう**で測る。出現には両方が要るので、遅れているほうが「あとどれだけ
   残っているか」を決める。蓄積だけで測ると初回の予兆が丸ごと飛ぶ（KING_OMEN_ACH_SPANの
   定義部参照）。
   2回目以降は実績が全解除済みで実績側が常に1.0になり、蓄積側だけが効く。初回と2回目以降で
   式を分けないのは、同じ式で初回も周回も成立しているため。
   蓄積側にだけ指数を掛ける。実績は残り個数という粗い段なので、さらに歪めると段が飛ぶ */
function _kingOmenProgress() {
  const from = KING_GYOZA_THRESHOLD * KING_OMEN_RATIO;
  const meterT = Math.max(0, Math.min(1, (kingGyozaMeter - from) / (KING_GYOZA_THRESHOLD - from)));
  const left = ACHIEVEMENTS.reduce((a, x) => a + (x.id !== KONGARI_ACH_ID && !unlockedAch[x.id] ? 1 : 0), 0);
  const achU = Math.max(0, Math.min(1, 1 - left / KING_OMEN_ACH_SPAN));
  return Math.min(meterT ** KING_OMEN_EXP, achU);
}

/* 予兆のギヨウザを1組ぶん出す（KING_OMEN_FX_*の定義部参照）。
   外周半径と中心は本番の収束と同じ値を使う。同じ場所から同じように現れることが、
   これから起きることの予告になる。
   g.size を書き換えてよいのは、スプライトモード（_itemVariantSprites）では drawOneItem が
   基準サイズとの比で拡縮するだけだから。パス描画側はボディグラジェントを生成時のサイズで
   焼いているので書き換えると崩れるが、_CACHE_OK が false のときはキング戦自体が起きない
   （_initBossBattle が即 _kingBattleEnd する）ため、呼び出し側で _CACHE_OK を条件にしている */
function _spawnOmenFx() {
  const t = _kingOmenProgress();
  const n = Math.min(KING_OMEN_FX_N_MAX, 1 + Math.floor(t * KING_OMEN_FX_N_MAX));
  const R = Math.hypot(W, H) * 0.6;   // 出入りする外周（本番の収束と同値）。画面外
  const rIn = Math.min(W, H) / 2;     // 最接近の基準（KING_OMEN_FX_NEARの定義部参照）。画面内
  const base = Math.random() * Math.PI * 2;
  const size = _ITEM_SPRITE_REF * _kingOmenLerp(KING_OMEN_FX_SIZE, t);
  const sign = () => (Math.random() < 0.5 ? 1 : -1);
  for (let i = 0; i < n; i++) {
    const g = makeItem(0, 0, 0, 0);
    g.size = size;
    _omenFx.push({
      g, age: 0,
      life:  Math.round(_kingOmenLerp(KING_OMEN_FX_LIFE, t)),
      th:    base + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.4,
      swirl: _kingOmenLerp(KING_OMEN_FX_SWIRL, t) * sign(),
      spin:  _kingOmenLerp(KING_OMEN_FX_SPIN, t) * sign(),
      alpha: _kingOmenLerp(KING_OMEN_FX_ALPHA, t),
      r0: R, rNear: rIn * _kingOmenLerp(KING_OMEN_FX_NEAR, t), rOut: R * 1.15,
      a: 0,
    });
  }
}

/* 予兆を1フレーム進める。位置は物理ではなく径と角の関数で直接与える
   （最接近距離を確実に決めるため。KING_OMEN_FX_*の定義部参照）。
   径は「寄る→離れる」のV字で、前半は easeOut で失速しながら最接近し、後半は easeIn で
   加速して散る。折り返しでは両側とも速度が0になるので、中心の手前で一拍止まって見える */
function _updateOmenFx() {
  if (_omenFx.length === 0) return;
  const cx = W / 2, cy = H / 2 - (IS_PORTRAIT ? 60 : 0); // 本番の収束と同じ中心
  for (const o of _omenFx) {
    o.age++;
    const p = Math.min(1, o.age / o.life);
    const rr = p < 0.5
      ? o.r0    + (o.rNear - o.r0)    * _easeF(p / 0.5, 'easeOut')
      : o.rNear + (o.rOut  - o.rNear) * _easeF((p - 0.5) / 0.5, 'easeIn');
    const ang = o.th + o.swirl * p;
    o.g.x = cx + Math.cos(ang) * rr;
    o.g.y = cy + Math.sin(ang) * rr;
    o.g.rot += o.spin;
    o.a = o.alpha * Math.min(1, p / 0.12) * Math.min(1, (1 - p) / 0.25); // 入りで現れ、出で消える
  }
  swapRemove(_omenFx, _predOmenFxAlive, _releaseOmenFx);
}

/* 口の形を決める比率（本体サイズsに対する比）。表情の知覚的な要はこの口の
   反転で、制御点Yが端点Yを下回れば「への字（怒り）」・上回れば「U字（笑顔）」。
   地鳴りのマイルド化もこの同じ値から導くため（_kingGentleness参照）、
   マジックナンバーで散らさず定数として一箇所に置く */
const KING_MOUTH_END_Y   = 0.26; // 口の両端のY
const KING_MOUTH_CTRL_Y0 = 0.19; // pct=0（怒り）の制御点Y
const KING_MOUTH_CTRL_Y1 = 0.33; // pct=1（満面の笑み）の制御点Y

/* キングの表情の「優しさ」0〜1。口の制御点が端点をどれだけ上回ったかで表す。
   上式より pct=0.5 でちょうど平ら（怒り→笑顔の反転点）＝0、pct=1 で 1。
   地鳴りのマイルド化（_bgmTierForCookPct）もこの値に従わせ、表情と音を同じ基準で
   動かす。口の定数から導いているので、口の形を変えれば地鳴りも自動で追従する
   （別々のしきい値を持たせると表情と音が食い違う） */
function _kingGentleness(pct01) {
  const ctrl = KING_MOUTH_CTRL_Y0 + (KING_MOUTH_CTRL_Y1 - KING_MOUTH_CTRL_Y0) * pct01;
  return Math.max(0, Math.min(1, (ctrl - KING_MOUTH_END_Y) / (KING_MOUTH_CTRL_Y1 - KING_MOUTH_END_Y)));
}

/* キングギヨウザ本体を初回に1枚のOCへ焼き込み（怒り顔付き・毎フレームはdrawImageのみ） */
/* 表情（白目+黒瞳+眉+口）。呼び出し側で scale(_dpr)+translate(half,half)
   適用済みの論理座標系であること前提（_buildBossOC から分離。理由は _buildBossOC
   のコメント参照: こんがりトーンの対象から顔だけ除外するため独立レイヤーで作る）。
   pct（こんがり進行度 0〜1）で吊り眉+へ字口（怒り）から、やや下がった眉+U字口
   （穏やかな笑顔）へ徐々に変化する。pct省略時（初期表情の焼き込み用）は0扱い。
   gazeUp（0〜1）は瞳を白目の中で上へ寄せる量。こんがり達成後に空を見上げてから
   飛び去る演出（_updateBossVictoryOutro）で使う。瞳だけを動かし、白目・眉・口は
   動かさない（顔全体を傾けるのではなく「視線を上げた」に見せるため）。
   ※ この値を変えたら _renderKingBody のキャッシュ判定にも反映が必要
   （_gazeRenderedUp参照。忘れると顔が更新されない） */
function _drawKingFace(c, s, pct = 0, gazeUp = 0) {
  const ex = s*0.16, ey = s*0.06, er = s*0.055;
  /* 瞳の上寄せ量。白目の縦半径(er)からはみ出さないよう0.5erまでに留める */
  const pupilDy = -er * 0.5 * gazeUp;
  /* 眉: 元の眉ライン（眉頭=ex-1.2er,ey-1.2er 〜 眉尻=ex+1.2er,ey-2.4er）を、
     黒目とほぼ同じX座標（瞳=ex-0.25er）にあるピボットを中心に回転させる。
     ピボットYは元の眉ライン上（そのX位置での直線上の点）に置くため、pct=0では
     回転量0＝素の見た目と完全に一致する。pct→1でangle1（ほぼ水平・少し眉尻が
     下がる程度）まで回転し、眉頭・眉尻の両方が滑らかに動く。
     眉頭を固定して眉尻だけ動かす形にはしない: 上下移動に見えて回転に見えない */
  const innerX0 = ex - er*1.2, innerY0 = ey - er*1.2;
  const outerX0 = ex + er*1.2, outerY0 = ey - er*2.4;
  const pivotX = ex - er*0.25;
  const pivotT = (pivotX - innerX0) / (outerX0 - innerX0);
  const pivotY = innerY0 + pivotT * (outerY0 - innerY0);
  const angle0 = Math.atan2(outerY0 - innerY0, outerX0 - innerX0);
  const angle1 = 3 * Math.PI/180;
  const dTheta = (angle1 - angle0) * pct;
  const cosT = Math.cos(dTheta), sinT = Math.sin(dTheta);
  const rot = (px, py) => {
    const vx = px - pivotX, vy = py - pivotY;
    return [pivotX + vx*cosT - vy*sinT, pivotY + vx*sinT + vy*cosT];
  };
  const [innerX, innerY] = rot(innerX0, innerY0);
  const [outerX, outerY] = rot(outerX0, outerY0);
  for (const sx of [-1, 1]) {
    c.beginPath(); c.ellipse(sx*ex, ey, er*1.15, er, 0, 0, Math.PI*2);
    c.fillStyle = '#fff'; c.fill();
    c.strokeStyle = 'hsl(30,45%,25%)'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.arc(sx*ex - sx*er*0.25, ey + er*0.15 + pupilDy, er*0.45, 0, Math.PI*2);
    c.fillStyle = '#1a1a1a'; c.fill();
    c.beginPath();
    c.moveTo(sx*outerX, outerY);
    c.lineTo(sx*innerX, innerY);
    c.strokeStyle = 'hsl(30,50%,30%)'; c.lineWidth = s*0.02; c.lineCap = 'round'; c.stroke();
  }
  /* 口: 制御点Yが端点Y(KING_MOUTH_END_Y)を下回れば「への字」(不満げ)、
     上回れば「U字」(笑顔)。pct=0で0.19s(への字)→pct=1で0.33s(端点を0.07s
     上回るU字＝への字と対称の笑顔)。ちょうどpct=0.5で平ら＝怒りと笑顔の反転点 */
  const mouthCtrlY = s * (KING_MOUTH_CTRL_Y0
    + (KING_MOUTH_CTRL_Y1 - KING_MOUTH_CTRL_Y0) * pct);
  c.beginPath();
  c.moveTo(-s*0.09, s*KING_MOUTH_END_Y);
  c.quadraticCurveTo(0, mouthCtrlY, s*0.09, s*KING_MOUTH_END_Y);
  c.strokeStyle = 'hsl(30,45%,25%)'; c.lineWidth = s*0.018; c.lineCap = 'round'; c.stroke();
}

function _buildBossOC() {
  if (_bossOC || !_CACHE_OK) return;
  const s = _BOSS_S = IS_PORTRAIT ? 300 : 380;
  const half = Math.ceil(s * 0.75);
  const REF = 42, kk = s / REF;
  const mkOC = () => _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  /* 本体レイヤー（顔なし）: こんがりトーン合成はこのレイヤーにのみ適用する。
     目鼻口眉はトーンの影響を受けさせず、白目の白さで焦げ色とのコントラストを出す
     （_renderKingBody 参照）。
     本体は通常サイズ(42)で組んで scale 変換で拡大する。_drawGyozaBody の線幅は
     小サイズ用の絶対値なので、直接 s=300 で描くとひだ・輪郭が細すぎて「白い卵」に
     見える（scale なら線幅も比例して太る） */
  const bodyOC = mkOC();
  const bc = bodyOC.getContext('2d');
  bc.scale(_dpr, _dpr);
  bc.translate(half, half);
  /* 焼き色はアイテムのようなランダムではなく固定（キングは1体しかいない） */
  const grd = _gyozaBodyGradient(bc, REF, 'hsl(46,50%,80%)', 'hsl(40,52%,64%)', 'hsl(35,45%,48%)');
  bc.save();
  bc.scale(kk, kk);
  _drawGyozaBody(bc, REF, 0, 0, grd);
  bc.restore();
  /* 顔レイヤー（透明地に目鼻口眉のみ）: トーン合成の後に毎回このレイヤーだけ
     上描きし、常に元の色を保証する */
  const faceOC = mkOC();
  const fc = faceOC.getContext('2d');
  fc.scale(_dpr, _dpr);
  fc.translate(half, half);
  _drawKingFace(fc, s);
  /* 通常表示（予告演出など）用に body+face を1枚に合成したもの */
  const oc = mkOC();
  const c = oc.getContext('2d');
  c.drawImage(bodyOC, 0, 0);
  c.drawImage(faceOC, 0, 0);
  /* 合成用のliveOCもここで確保しておく。1140x1140＝約130万画素の確保を戦闘開始時に
     行うと、的が回り始めるフレームにぶつかって回転の速度ムラになる。予兆は演出だけの
     区間なので、ここで確保しておけば戦闘開始時の確保は0になる。戦闘をまたいで使い回す */
  const liveOC = _mkCache(half * 2 * _dpr, half * 2 * _dpr);
  _bossOC = { oc, bodyOC, faceOC, half, liveOC };
}

/* 「こんがり」実績以外の全実績を達成済みか（キングギヨウザモード出現条件の一部）。
   king値の蓄積だけでなく他の実績を全て達成していることも条件にすることで、
   「こんがり」は必然的に最後に解除される実績になる */
function _allAchExceptKongariDone() {
  return ACHIEVEMENTS.every(a => a.id === KONGARI_ACH_ID || unlockedAch[a.id]);
}

/* トライの区切りで呼ぶ。発動したら true（呼び出し側はリセット処理を中断する） */
function _maybeStartBossOmen() {
  if (kingGyozaMeter < KING_GYOZA_THRESHOLD) return false;
  if (!_allAchExceptKongariDone()) return false;
  if (isFever || feverPending || isGameOver) return false;
  _startBossOmen();
  return true;
}

function _startBossOmen() {
  pendingShoot = false;
  /* 事前構築の作り置きはプールへ返す。事前構築は入力を基準に進める作りで
     （_pendingWheels の定義部参照）タイマーを持たないので、打ち切り処理は要らない */
  _releaseWheelOCs(_pendingWheels); _pendingWheels = null;
  _omenFx = _releaseAll(_omenFx, _releaseOmenFx);
  items = _releaseAll(items);
  /* トライ横断で見せている表示物（ポップアップ・フィーバーバナー・JUST!ラベル）は
     phaseを見ずに描かれるため、暗転下に透けたりキング画面に重なったりする。
     寿命の分類は_clearCrossTrialOverlaysのコメント参照 */
  _clearCrossTrialOverlays();
  /* 直前の通常モードのエフェクト状態（hitType別の演出、particles等）を init()と同じ
     後始末で完全にクリアする（_clearTrialFxState参照）。ここが手薄だと、当たり演出の
     途中でキングギヨウザが発動したときにその演出がキングギヨウザ画面の下に透けて残る */
  _clearTrialFxState();
  /* 退場中のエフェクトも同じ理由で消す（トライを越えて生き残る仕組みなので、
     クリアし忘れるとキングギヨウザ画面の上をギヨウザが飛んでいくことになる） */
  _clearFxOutro();
  /* isSlowSpin等のトライ限定の演出状態も落とす。残すと、スローハンド中にキング戦へ
     突入した場合に発動状態・ランプ終了時刻が戦闘中ずっと残留する
     （他のトライ限定演出と同じ扱いにすること） */
  isSlowSpin = false;
  slowRampEndTime = 0;
  slowHandLockUntil = 0;
  _buildBossOC();
  /* 暗黒BGMが未完のまま突入しうるので、ここで待たずに焼く（_scheduleBossBgmRenders参照） */
  _scheduleBossBgmRenders(true);
  _omen = { step: 0, timer: 0, items: [], flash: 0 };
  phase = 'bossOmen';
  stopBGMTape(1600);      // 世界が止まる（テープストップ+グレースケール）
  grayRateTarget = 0.001; // 無音起動（bgmSourceなし）でもグレースケールは進める
  playSE('bossRumble');
}

function _updateBossOmen() {
  const o = _omen;
  if (!o) { phase = 'idle'; return; }
  o.timer++;
  if (o.flash > 0) o.flash -= 0.05;
  if (o.step === 0) {
    /* 暗転 */
    if (o.timer > 50) { o.step = 1; o.timer = 0; o.flash = 0.25; playSE('bossRumble'); }
  } else if (o.step >= 1 && o.step <= 4) {
    /* 台詞1〜4を1行ずつ */
    if (o.timer > _OMEN_LINE_FRAMES) {
      o.step++; o.timer = 0;
      if (o.step <= 4) { o.flash = 0.25; playSE('bossRumble'); }
      if (o.step === 5) {
        /* 収束開始: 画面外から霊ギヨウザが逆流 */
        playSE('bossFlash');
        const R = Math.hypot(W, H) * 0.6;
        for (let i = 0; i < 44; i++) {
          const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2;
          o.items.push(makeItem(W/2 + Math.cos(ang)*R, H/2 + Math.sin(ang)*R, 0, 0));
        }
      }
    }
  } else if (o.step === 5) {
    /* 中央へ収束 */
    const cx = W/2, cy = H/2 - (IS_PORTRAIT ? 60 : 0);
    for (const g of o.items) {
      g.x += (cx - g.x) * 0.06;
      g.y += (cy - g.y) * 0.06;
      g.rot += 0.15;
    }
    if (o.timer > 110) {
      o.step = 6; o.timer = 0; o.flash = 1;
      o.items = _releaseAll(o.items);
      grayRateTarget = 1.0; // 誕生の瞬間、色が世界に戻る（ボスの金色を際立たせる）
      playSE('kingAppear'); // バーン+ドラの派手な一撃（_playDoraHit参照）
    }
  } else if (o.step === 6) {
    /* 誕生フラッシュ+タイトル */
    if (o.timer > 90) { o.step = 7; o.timer = 0; }
  }
  /* step7: ボス鎮座（handleGameClick がタップで _initBossBattle を呼び戦闘開始） */
}

/* ボス戦闘系フェーズ（bossOmenは含まない: 予兆中はホイール等の通常UIをまだ表示する）。
   通常UI（ホイール・BETバー・シンクメーター等）の表示ガードは必ずこの述語を使うこと。
   phase比較のチェーンを各ガードにコピーすると、フェーズを追加したとき（bossShatter等）に
   広げ忘れが実バグになる。一元化により全ガードへ同時反映される */
const BOSS_BATTLE_PHASES = new Set(
  ['boss', 'bossShatter', 'bossVictory', 'bossVictoryOutro', 'trueEnding',
   'bossDefeat', 'bossDefeatShrink', 'bossDefeatOutro']);
function _isBossBattlePhase() { return BOSS_BATTLE_PHASES.has(phase); }
/* 敗北が確定してテープが止まっている（stopBGMTapeでレートが0.001まで落ちている）
   フェーズ。コイン表示の追従に下限レートを与えるために使う（update内のcoinsDisp参照）。
   bossShatterは含めない: 没収（_startBossDefeat）はその後なので表示は動いていない */
const KING_DEFEAT_PHASES = new Set(['bossDefeat', 'bossDefeatShrink', 'bossDefeatOutro']);

/* bgmSourceを完全に破棄したまま維持するフェーズ（togglePause参照）。
   boss/bossShatter/bossDefeat系はstopBGMTapeでソースを極低速のまま生かして
   いるため一時停止からの復帰でそのまま再開できるが、bossVictory（勝利
   ファンファーレ用に_stopBossBGMForVictoryで破棄）とtrueEnding（専用の
   オシレーターテーマのみでbgmSourceを使わない）はソースが存在しない前提の
   フェーズなので、ポーズ解除時に通常/ボスBGMを新規作成してはいけない。
   bossVictoryOutro（飛び去り演出）も同様。ここは意図的に無音を保ち、復帰時の
   テープ加速（tapestart）で世界が動き出す対比を作っている区間なので、
   ポーズ→再開でBGMが鳴り出すと演出が壊れる */
const NO_BGM_SOURCE_PHASES = new Set(['bossVictory', 'bossVictoryOutro', 'trueEnding']);

/* 「ゲームのBGMを自動で鳴らしてはいけない」フェーズ。ミュート解除やPAUSE解除の補償経路
   （bgmSourceが無ければ起動する、という善意の処理）から通常BGMが割り込むのを止めるための述語。
   内訳:
     startup            まだ始まっていない
     bossOmen           予告中（startBGMがグレースケールを即時解除してしまう）
     soundTest/drumPad  鳴らす音をモード側が完全に握っている
     NO_BGM_SOURCE_PHASES  bgmSourceを持たない前提の演出フェーズ
     キング戦系         テンポ・段階差し替え・テープ停止を戦闘側が一括で持つ
   判定は必ずこの述語に集約すること。除外条件を各ガードにコピーすると、新しいモードを足す
   たびに片方だけ直す事故が起き、そのモードでミュート解除すると通常BGMが鳴り出す */
function _noAutoBgmPhase() {
  return _noBgmResumePhase() || _isBossBattlePhase();
}

/* 「止まる前の続きから鳴らし直してはいけない」フェーズ。_noAutoBgmPhase より狭い。
   **キング戦系は含めない。** 位置とレートを保って作り直す復帰（_resumeBgmFromPause）は
   ボス用バッファ・ボスのテンポをそのまま引き継ぐので、キング戦でも正しい復帰になる。
   ここにキング戦を入れると、戦闘中にソースを失う経路（PAUSE解除・AudioContext再作成）の
   すべてで二度とBGMが戻らなくなる。
   除外するのは「そもそも鳴らすものが無い」フェーズだけ:
     startup            まだ始まっていない
     bossOmen           テープストップでBGMを畳んでいる最中。次は_initBossBattleが起こす
     soundTest/drumPad  鳴らす音をモード側が完全に握っている
     NO_BGM_SOURCE_PHASES  bgmSourceを持たない前提の演出フェーズ */
function _noBgmResumePhase() {
  return phase === 'startup' || phase === 'bossOmen' ||
         phase === 'soundTest' || phase === 'drumPad' ||
         NO_BGM_SOURCE_PHASES.has(phase);
}

/* 戦闘終了（勝利後）→ 通常モードへ復帰。ゲームオーバー復帰と同じテープ加速演出を再利用 */
/* キング戦終了時に必ず必要な後片付け（的OC解放・king関連stateの初期化）。
   通常モード復帰（_kingBattleEnd、勝敗問わず・2回目以降の無演出勝利含む）と、
   真エンディング終了後の復帰（_finishTrueEnding、常にstartupへ戻る）の
   両方から呼ぶ共通処理 */
function _cleanupKingBattleState() {
  if (_king) _releaseKingReelOCs(_king.reels); // 最後の4的のOCをプールへ返却（リーク防止）
  _king = null; _kingLasers = []; _kingCharFlights = [];
  _victorySteam = []; // 湯気（勝利専用の独立配列、共有particlesは使わない）
  _bossBgmPendingTier = null; // 予約中の地鳴り段階切り替えを破棄（次戦は_initBossBattleでtier0から）
  _kingSiftShake = 0;            // 篩い落としの画面揺れ残量（_kingはnull化されるがこれはモジュール変数）
  _kingImpactShake = 0;          // 着弾の画面揺れ残量（同上）
  _kingFireFlash = 0;            // 発射の放電残量（同上）
  _kingAccentFlash = 0;          // 5音目アクセントの全身リアクション残量（同上）
  _kingAccentRecoil = 0;
  _kingAccentMarks = [];         // 発光対象の焦げ跡参照を残さない（_king破棄後の保持を避ける）
  _kingHits = [];                // 進行中の被弾リアクションを次戦へ持ち越さない
  _kingChargedMarks = [];        // 帯電中の焦げ跡も同様（焼き込み前に戦闘が終わった場合）
  /* 3つの演出はいずれもプール由来のギヨウザを抱えている。破棄する前に必ず返す */
  if (_omen)        _omen.items        = _releaseAll(_omen.items);
  if (_defeatOutro) _defeatOutro.items = _releaseAll(_defeatOutro.items);
  if (_victoryOutro) {
    _victoryOutro.items = _releaseAll(_victoryOutro.items);
    if (_victoryOutro.seedItem) _deadify(_victoryOutro.seedItem); // 舞い上がらずに残る1個
  }
  _omen = null; _defeatOutro = null; _victoryOutro = null;
}

function _kingBattleEnd() {
  _cleanupKingBattleState();
  /* 敗北の没収で所持ギヨウザが尽きた場合は、通常モードでコインが尽きた時と同じ
     ゲームオーバー画面（「ギヨウザがなくなりました」＋CONTINUEタップでgameOverReset）を
     経由させる。所持ギヨウザが0になる場合でも、まずキングが戻って飛んでいく演出を
     見せてから、そのゲームオーバー演出へ進む。
     ここで即座にgameOverReset()を呼ぶと画面を見せないまま再スタートしてしまうため、
     通常モードのisGameOver検出と同じ状態（phase='done'、endTimerからcanRestartが
     45フレーム後に立ち上がる、drawEndScreen参照）を作って引き継ぐ。実際のリセットは
     そのCONTINUEタップ時にhandleGameClickのphase==='done'分岐から呼ばれる（通常モードと共通）。
     勝利側から呼ばれた場合はcoinsが減ることがないため常にfalseで無関係 */
  if (coins <= 0) {
    isGameOver = true;
    endTimer = 0; canRestart = false; _continueShowDelay = 0;
    grayRateTarget = 0.001; // 通常モードのコイン枯渇と同じグレーアウト
    stopBGMTape(); // 同じくテープストップでBGMをフェードアウト
    phase = 'done';
    return;
  }
  _restartToTapestart();
  /* _restartToTapestart→init(fromGameOver=true)は通常のゲームオーバー復帰と同じ経路を
     共有しており、そちらの仕様（ゲームオーバー復帰後もBET対応速度へ）に従って無条件で
     スローハンドの抽選を行う。キング戦という特別な文脈からの復帰直後に無関係な確率
     イベントで割り込まれるのは不適切なので、キング戦復帰（勝敗問わず）では常に通常速度で
     始まるよう明示的に抑制する。通常のgameOverResetにはこの抑制を入れない */
  isSlowSpin = false;
  _slowSpinPending = null;
}

/* こんがりしっぱい（全損には至らない敗北）から通常モードへ戻る前のつなぎ演出。
   誕生演出（ギヨウザが収束してキングになる）の逆再生イメージで、キングの姿が
   ふつうのギヨウザ群へ弾け散り、そのあと誕生演出と同じ台詞スタイルで
   メッセージを出してから復帰する */
/* 誕生演出（_updateBossOmen step5: バラバラのギヨウザが中心へ収束してキングになる）の
   純粋な逆回し。重力落下ではなく、渦を巻きながら中心から外へ拡散する＝収束演出そのものの
   巻き戻しとして見せる。
   同じ中心・同じ半径・同じ収束係数・同じフレーム数を使い、1フレームごとの更新式を
   厳密に逆算する:
     収束(forward): pos = c + (pos-c)*(1-K)  ⇔  拡散(reverse): pos = c + (pos-c)/(1-K)
   これを110フレーム続けると、収束後に残るごく小さな半径(startR)から出現時の半径
   R(=Math.hypot(W,H)*0.6、step5と同値)までを寸分違わず逆再生する */
const _DEFEAT_OUTRO_K = 0.06;      // _updateBossOmen step5 の収束係数と同値
const _DEFEAT_OUTRO_FRAMES = 110;  // 同 step5 の収束フレーム数と同値
/* 締めメッセージ（_DEFEAT_OUTRO_LINES）の見せ方。全行を1つのメッセージとして
   同時に出し、フェードイン・フェードアウトも全体で1回ずつ行う（誕生予告drawBossOmenの
   「過去行を薄く残して積んでいく」見せ方とは意図的に別物）。
   HOLDは全文を表示したまま保持する長さ。
   フェードアウトはイン側と分離して3倍の長さを取る（同じ長さでは消えるのが速すぎて
   余韻が残らない）。さらに easeOut カーブ（_easeF参照）を掛け、消え際の薄い状態が
   長く尾を引くようにする。線形だと最後まで一定速度で消えて余韻が出ない */
/* ── 締めメッセージの尺は「目標の表示秒数」を直接持つ ──
   失敗側はおよそ3秒、達成側はおよそ6秒を目標とする。文章量が違う（失敗18文字・
   縦画面2行／達成31文字・縦画面4行）ので、両者で同じ固定フレーム数を共有させると
   達成側が読み終わらない。
   一方で「1文字あたり◯ms」のような係数モデルにもしない: 文字数比1.72倍に対して
   目標時間比が2倍なので、2つの目標を1本の直線で通そうとすると意味を持たない
   係数と下駄になり、モデルとして破綻する。
   よって目標の表示秒数そのものを定数として持ち、保持時間は
     保持 = 目標フレーム数 - フェードイン - フェードアウト
   の引き算で求める。利点:
   - 定数がそのまま仕様（達成は6秒）を表すので、尺を変えたいときはこの秒数だけ触ればよい。
   - 文言を差し替えても目標秒数は変わらない＝尺が勝手にずれない。
     文字数に応じて動くのはフェードアウトの長さだけで、その分だけ保持が自動的に詰まり
     合計は目標どおりに保たれる */
const _OUTRO_MSG_FADE_IN = 22;          // 登場（両者固定）
/* 目標の表示秒数（フェードイン開始からフェードアウト終了まで）。ユーザー指定。
   ここが仕様の本体なので、尺を変えたいときはこの2つだけを触る */
const _OUTRO_MSG_TARGET_SEC_DEFEAT  = 3.0; // こんがり失敗の締め
const _OUTRO_MSG_TARGET_SEC_VICTORY = 6.0; // こんがり達成（キングクリア）の締め
/* 保持時間の下限。フェードだけで目標秒数を食い潰すほど長い文言になった場合の保険
   （引き算の結果が0以下になりうる）。その場合だけは合計が目標秒数を超える＝読ませることを
   優先する */
const _OUTRO_MSG_HOLD_MIN      = 40;
/* フェードアウト（余韻）の長さは文章量で伸ばす。長い文なら締めもゆったりする
   のが自然なため。合計は目標秒数に固定されるので、ここが伸びたぶんは保持から
   引かれる（＝余韻と静止表示の配分が文章量で変わる） */
const _OUTRO_MSG_FADE_OUT_BASE     = 40;
const _OUTRO_MSG_FADE_OUT_PER_CHAR = 1.45;

/* 表示行の総文字数（空白は読解負荷に数えないので除く。「……」は意図した
   一拍の間なので1文字ぶんずつ数える） */
function _outroMsgCharCount(lines) {
  return lines.reduce((n, t) => n + t.replace(/[\s　]/g, '').length, 0);
}
/* 折り返し済みの表示行と目標秒数から尺を確定させる。演出開始時に1度だけ呼んで
   状態に持たせる（毎フレーム計算しない。折り返し自体も同じ方針。_wrapOutroLines参照）。
   targetSec は _OUTRO_MSG_TARGET_SEC_DEFEAT / _VICTORY のどちらかを呼び出し側が渡す。
   保持は目標からフェード2つを引いた残りなので、合計は必ず目標秒数に一致する
   （唯一の例外はフェードだけで目標を超えてしまう極端に長い文言で、その場合は
   下限が効いて目標を超える＝読ませることを優先する） */
function _makeOutroMsgTiming(msgLines, targetSec) {
  const chars   = _outroMsgCharCount(msgLines);
  const fadeIn  = _OUTRO_MSG_FADE_IN;
  const fadeOut = Math.round(_OUTRO_MSG_FADE_OUT_BASE + _OUTRO_MSG_FADE_OUT_PER_CHAR * chars);
  const total   = Math.round(targetSec * 60); // 60fps基準のフレーム数へ
  return {
    fadeIn, fadeOut,
    hold: Math.max(_OUTRO_MSG_HOLD_MIN, total - fadeIn - fadeOut),
  };
}
/* 締めメッセージのフェードイン→保持→フェードアウトを1フレーム進め、o.msgAlpha を
   確定させる（update で状態を決めて draw は読むだけ、というこのプロジェクトの分離方針）。
   戻り値=消えきったか。
   達成側・失敗側で式は同一なので必ずここに集約する。同じ式を2箇所へコピーすると、
   片側だけ尺を変えたときにもう片側が古い尺のまま取り残される。
   消え際に薄いまま長く尾を引かせるため easeOut を掛ける（線形だと一定速度で消えて
   余韻が出ない） */
function _advanceOutroMsg(o) {
  const T = o.msgTiming;
  const fadeOutStart = T.fadeIn + T.hold;
  if (o.timer < T.fadeIn) {
    o.msgAlpha = o.timer / T.fadeIn;
  } else if (o.timer < fadeOutStart) {
    o.msgAlpha = 1;
  } else {
    const p = Math.min(1, (o.timer - fadeOutStart) / T.fadeOut);
    o.msgAlpha = Math.max(0, 1 - _easeF(p, 'easeOut'));
  }
  return o.timer > fadeOutStart + T.fadeOut;
}

/* 締めメッセージを描く（達成側・失敗側で共通）。色だけが呼び出し側の指定で、
   フォント・行間・中央揃えの基準・透明度の扱いはすべて共通。
   描画側もupdate側（_advanceOutroMsg）と同様に必ず一本化する: 色以外が同一のブロックを
   複製すると、折り返しや配置を変えたときに片側だけ直す事故が起きる。
   誕生予告（drawBossOmen）は行を1つずつ積み上げ過去行を薄く残す見せ方だが、こちらは
   全行を1つのメッセージとして同時に出す。
   位置も誕生予告とは別建て: 誕生予告は4行ぶんを見込んでH*0.30から始めるが、こちらは
   行数が少なく同じ開始位置だと画面上寄りに偏って見える。画面に固定のボスが居ないぶん
   余裕があるため、全行の中心が画面中央(H/2)に来るよう配置し、行数が少ない分フォントも
   大きくする。行数は文言と画面幅で変わるので、中央揃えの基準は実際の行数から求める */
function _drawOutroMsg(o, fillColor, shadowColor) {
  if (!(o.msgAlpha > 0)) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lineDy = _outroMsgFontSize() * 2.2;
  const lines  = o.msgLines;
  const lineY0 = H / 2 - lineDy * (lines.length - 1) / 2;
  ctx.font = _outroMsgFont(); // 折り返し計測と同一の書式（_outroMsgFont参照）
  ctx.globalAlpha = o.msgAlpha;
  lines.forEach((line, i) => outText(line, W / 2, lineY0 + i * lineDy, fillColor, shadowColor, 6));
  ctx.globalAlpha = 1;
}

/* キングギヨウザ縮小ブリッジ（_startBossDefeatShrink）用の定数。
   KING_DEFEAT_SHRINK_SCALE: 縮小目標スケール。アイテム1個の見た目サイズ
   （makeItem の size=34〜42px）÷ キング全幅（half*2、縦画面300*0.75*2=450px・
   横画面380*0.75*2=570px）から逆算した約0.075。これより極端に小さくすると、続けて
   出るギヨウザの集合体より先に見えなくなり、クロスフェードしてもサイズ感の食い違いが
   違和感として残る。
   KING_DEFEAT_XFADE_START_DSCALE: このdscaleまで縮んだらクロスフェード開始。
   KING_DEFEAT_XFADE_FRAMES: クロスフェードの長さ（フレーム数）。 */
const KING_DEFEAT_SHRINK_SCALE = 0.075;
const KING_DEFEAT_XFADE_START_DSCALE = 0.18;
const KING_DEFEAT_XFADE_FRAMES = 20;
let _bossDefeatXfade = 0; // 0=キングのみ表示 〜 1=ギヨウザ群のみ表示

/* 画面全体フェード（汎用）: phase切り替えの継ぎ目を暗転でつなぐ演出。
   暗転が最大になった瞬間にonMidを呼んで実際のphase切り替え（_kingBattleEnd等の重い処理）
   を行い、その後フェードインすることで、切り替えの瞬間を暗闇の中に隠す。
   どのphaseから呼んでも使える汎用実装 */
const _SCREEN_FADE_FRAMES = 35;
let _screenFade = null; // { stage:'out'|'in', timer, alpha, onMid }
function _startScreenFade(onMid, frames = _SCREEN_FADE_FRAMES) {
  if (_screenFade) return; // 多重起動防止（連打でフェードが再スタートしないように）
  _screenFade = { stage: 'out', timer: 0, frames, alpha: 0, onMid };
}
function _updateScreenFade() {
  const f = _screenFade;
  f.timer++;
  if (f.stage === 'out') {
    f.alpha = Math.min(1, f.timer / f.frames);
    if (f.timer >= f.frames) {
      f.onMid?.();
      f.stage = 'in'; f.timer = 0;
    }
  } else {
    f.alpha = Math.max(0, 1 - f.timer / f.frames);
    if (f.timer >= f.frames) _screenFade = null;
  }
}
function _drawScreenFade() {
  if (!_screenFade || _screenFade.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = _screenFade.alpha;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ギヨウザ群の弾け散りアイテムを生成する（位置のみ確定、まだ動かさない）。
   _startBossDefeatShrinkでのクロスフェード表示・_updateBossDefeatOutroでの
   拡散アニメの両方が同じ_defeatOutro.itemsを参照するため、生成は一箇所に
   まとめる（クロスフェード用に別配列を作って後で捨てると_itemAllocの
   プール返却漏れ＝リークになるため、必ず単一の配列を使い回す） */
function _makeDefeatOutroItems() {
  const cx = W / 2, cy = H / 2 - (IS_PORTRAIT ? 60 : 0); // step5の収束先と同値
  const R = Math.hypot(W, H) * 0.6; // step5の出現半径と同式
  const startR = R * Math.pow(1 - _DEFEAT_OUTRO_K, _DEFEAT_OUTRO_FRAMES); // 収束後に残る半径
  const items = [];
  for (let i = 0; i < 44; i++) {
    const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2; // step5と同じ角度配分
    items.push(makeItem(cx + Math.cos(ang) * startR, cy + Math.sin(ang) * startR, 0, 0));
  }
  /* 締め2行は画面幅に収まるよう折り返しておく（_wrapOutroLines参照）。
     尺は目標秒数（_OUTRO_MSG_TARGET_SEC_DEFEAT）から逆算する。折り返し後の
     文字数はフェードアウト長にだけ効く（_makeOutroMsgTiming参照） */
  const msgLines = _wrapOutroLines(_DEFEAT_OUTRO_LINES);
  return { step: 0, timer: 0, items, cx, cy, msgAlpha: 0,
           msgLines, msgTiming: _makeOutroMsgTiming(msgLines, _OUTRO_MSG_TARGET_SEC_DEFEAT) };
}

/* こんがりしっぱい画面（bossDefeat, CONTINUEタップ後）から、ギヨウザ群への弾け散り演出
   （bossDefeatOutro）へ切り替える前段。
   縮みきった瞬間にphaseを差し替えるだけだと紙芝居のめくりのように見えるため、
   (1) 縮小目標スケールをアイテム1個ぶんの見た目サイズに合わせ、
   (2) 縮小の終盤でキング（フェードアウト）とギヨウザ群（フェードイン）を一定フレームだけ
       重ねて描く、
   の2点で滑らかにつなぐ。
   誕生演出・戦闘位置移行・勝利拡大と同じ_easeKingXformの指数収束をそのまま再利用し、
   キングギヨウザを等倍から弾け散り開始位置（中心=_defeatOutroのcx,cy）へ縮小・移動させる */
function _startBossDefeatShrink() {
  phase = 'bossDefeatShrink';
  _bossDefeatShrinkTimer = 0;
  _bossDefeatXfade = 0;
  if (_king) {
    _king.bx = W / 2;
    _king.by = H / 2 - (IS_PORTRAIT ? 60 : 0); // _defeatOutroのcx,cyと同値
    _king.scale = KING_DEFEAT_SHRINK_SCALE;
  }
  /* ギヨウザ群はこの時点で生成し、位置を確定させておく（クロスフェード中は
     静止したまま）。拡散運動は_updateBossDefeatOutroに入ってから始まる */
  _defeatOutro = _makeDefeatOutroItems();
}

function _updateBossDefeatShrink() {
  _bossDefeatShrinkTimer++;
  _updateKingCommonFx();
  /* dscaleが目標近くまで縮んだらクロスフェードを開始し、キングとギヨウザ群を
     一定フレームかけて滑らかに入れ替える */
  if (_king && _king.dscale <= KING_DEFEAT_XFADE_START_DSCALE) {
    _bossDefeatXfade = Math.min(1, _bossDefeatXfade + 1 / KING_DEFEAT_XFADE_FRAMES);
  }
  /* クロスフェード完了で本体を消して弾け散り演出へ。収束が遅れた場合の保険として
     上限フレームも設ける（万一到達しなくても同じ画面に留まり続けないように） */
  if (!_king || _bossDefeatXfade >= 1 || _bossDefeatShrinkTimer > 60) {
    if (_king) _releaseKingReelOCs(_king.reels); // 的OCをプールへ返却（リーク防止・水平展開）
    _king = null; _kingLasers = []; _kingCharFlights = []; // 弾けた瞬間に本体は消える
    phase = 'bossDefeatOutro';
    playSE('bossFlash');
  }
}

function drawBossDefeatShrink() {
  if (phase !== 'bossDefeatShrink') return;
  ctx.save();
  ctx.fillStyle = 'rgba(30,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    _drawKingBody(1 - _bossDefeatXfade);
    ctx.save();
    ctx.globalAlpha = 1 - _bossDefeatXfade;
    drawKingCharFlights();
    ctx.restore();
  }
  if (_defeatOutro && _bossDefeatXfade > 0) {
    ctx.save();
    ctx.globalAlpha = _bossDefeatXfade;
    for (const g of _defeatOutro.items) drawOneItem(g);
    ctx.restore();
  }
  ctx.restore();
}

function _updateBossDefeatOutro() {
  const o = _defeatOutro;
  if (!o) { phase = 'idle'; return; }
  /* この時点で_kingはnull・飛翔/レーザーも空なので実質no-opだが、キング戦系
     フェーズは例外なく共通FXを呼ぶ形に揃えておく（将来この演出中まで残る
     オブジェクトが増えたときに、ここだけ更新漏れになるのを防ぐ） */
  _updateKingCommonFx();
  o.timer++;
  /* step5の収束式 pos=c+(pos-c)*(1-K) を厳密に逆算した拡散式（重力は使わない） */
  const inv = 1 / (1 - _DEFEAT_OUTRO_K);
  for (const g of o.items) {
    g.x = o.cx + (g.x - o.cx) * inv;
    g.y = o.cy + (g.y - o.cy) * inv;
    g.rot -= 0.15; // step5の回転(+0.15)を逆再生
  }
  if (o.step === 0) {
    /* step0: ギヨウザ群の拡散のみ。拡散しきってからメッセージへ移る */
    if (o.timer > _DEFEAT_OUTRO_FRAMES) { o.step = 1; o.timer = 0; }
  } else {
    /* step1: 2行を1つのメッセージとしてまとめて フェードイン→保持→フェードアウト。
       行ごとの出し分けはしない。尺は目標秒数から逆算済み（_makeOutroMsgTiming参照） */
    const done = _advanceOutroMsg(o);
    /* フェードアウトしきったら、タップ待ちにせず時間経過で自動的に通常モードへ戻る。
       _startScreenFadeは多重起動防止済みなので、フェード開始後も毎フレームこの条件を
       満たし続けて構わない */
    if (done) _startScreenFade(() => _kingBattleEnd());
  }
}

function drawBossOmen() {
  if (phase !== 'bossOmen' || !_omen) return;
  const o = _omen;
  ctx.save();
  /* 暗幕 */
  const dark = (o.step === 0 ? Math.min(1, o.timer / 50) : 1) * 0.88;
  ctx.fillStyle = `rgba(2,4,8,${dark})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 台詞（過去行は薄く残して積む） */
  if (o.step >= 1 && o.step <= 4) {
    const fsL = IS_PORTRAIT ? 22 : 26;
    const lineY0 = H * 0.30, lineDy = fsL * 2.2;
    ctx.font = `bold ${fsL}px ${FONT_MIN}`;
    for (let i = 0; i < o.step && i < _OMEN_LINES.length; i++) {
      const isCur = (i === o.step - 1);
      ctx.globalAlpha = isCur ? Math.min(1, o.timer / 20) : 0.5;
      const col = i === 3 ? '#ff6655' : '#e8e2d0';
      outText(_OMEN_LINES[i], W/2, lineY0 + i*lineDy, col, 'rgba(0,0,0,0.9)', 6);
    }
    ctx.globalAlpha = 1;
  }
  /* 収束する霊ギヨウザ */
  if (o.step === 5) for (const g of o.items) drawOneItem(g);
  /* 誕生〜鎮座 */
  if (o.step >= 6 && _bossOC) {
    const bx = W/2, by = H/2 - (IS_PORTRAIT ? 60 : 0);
    const appear = o.step === 6 ? Math.min(1, o.timer / 25) : 1;
    const breath = 1 + 0.02 * Math.sin(performance.now() / 300);
    const k = appear * breath;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(k, k);
    ctx.drawImage(_bossOC.oc, -_bossOC.half, -_bossOC.half, _bossOC.half*2, _bossOC.half*2);
    ctx.restore();
    ctx.font = `bold ${IS_PORTRAIT ? 28 : 40}px ${FONT_MIN}`;
    outText('キングギヨウザ とうじょう！！', W/2, by - _BOSS_S*0.62,
      '#ffdd55', 'rgba(60,0,0,0.9)', 8);
    if (o.step === 7) _drawBottomPillBadge('CONTINUE');
  }
  /* 雷鳴フラッシュ */
  if (o.flash > 0) {
    ctx.globalAlpha = Math.min(1, o.flash);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

   普通に出る。上限を1拍にするとそれが全部1拍へ潰れ、叩いたキックのパターンが均等な
   4分打ちに化ける＝「打った通りに再生されない」。
   4拍あれば、キックを1つ〜3つ見送ったパターンまでそのまま表現できる。長い待ちを詰める
   役目は残り、4拍を超える放置だけが頭打ちになる。
   4拍子なのでこの4拍はちょうど1小節と一致する（KING_SEQ_BAR_SLOTS）。同様に

   整数のまま完全に保たれる（例: 3:2:4:2拍 → 1.5:1:2:1拍。長さは半分、形はそのまま）。
   終盤のキックに乗せた打ち込み（1〜3拍の間隔）はこの範囲に収まるので影響しない。
   下の scale による比率圧縮は、倍率を1まで下げても収まらない病的なケースだけの保険 */
const KING_SEQ_SPAN_SLOTS = KING_SEQ_GAP_MAX * 2;
/* 「正解文字が回ってくるのを待っていた回」の判定閾値＝コール全長（1打目〜4打目）3小節。

   的の回転周期（0.81〜1.16秒）は拍と無関係なので、拍の瞬間が窓の内側に気持ちよく入る
   回転が来るまで見送ることになり、タップ間隔は5〜10拍まで伸びる。この間隔はリズムの
   意図ではなく待ち時間なので、比として読むと 5:9:4 のような大きい整数になり、全長の上限

   命中させた文字のエリアが広がると（_adjustKingCharWeight）窓が1拍より広くなり、どの拍でも
   狙えるようになる＝間隔が1〜3拍になってコール全長は3小節に収まる。つまりこの閾値は
   「文字を待っていたか、リズムに乗って叩けていたか」を構造的に分ける線になる。
   フィット誤差から「意図の有無」を推定する形にしてはいけない（上限クランプされた間隔は
   ちょうど格子上の値になるので、意図なしのほうが誤差が小さく出て指標が逆に働く） */

/* 長コールの回だけ掛けるレスポンス先頭の待ちの上限＝1拍。

   レスポンスが必ず詰められていて2音目以降の小節内位置はコールと一致しないので、1音目の
   位置だけのためにこの長さを払う意味が無い。
   0にしないのは、切り替えの合図（_playKingCue）と1音目が同じスロットに重なって合図が
   聴き分けられなくなるため。1拍空けると「パン → タンタンタンタン」の形が保たれる */
const KING_SEQ_LEAD_IN_MAX = KING_SEQ_DIV;
/* 打ち込みハイハットの音量（_playKingHat）。

   TRのACCENTと同じくレベルだけを動かし、音色（フィルタ・長さ）は変えない */
const KING_HAT_VOL    = 0.44;
const KING_HAT_ACCENT = 1.3;
/* コール→レスポンスの切り替えを知らせるクラップ。

   境界）とはちょうど枠1つ離れる。つまり
     タタタタ [パン] タンタンタンタン [ドン] タタタタ …
   と、枠の切れ目が必ず手拍子で示される。切り上げの待ち（最大1小節）が無音のまま放置される

   同じ族だが、ハットが素のハイパスで最上域まで抜けるのに対し、クラップは下を切って中高域の
   塊にするので聴き分けられる。
   値が他の *_VOL と桁が違うのはフィルタの損失を補う後段ゲインだから。他の音量定数と直接
   比較できる数値ではない点に注意（実測ピークは約1.2〜1.5で着弾スネア1.38・爆発1.43と同水準。

const KING_CUE_VOL = 2.8;
/* 再生開始までの最低リード（秒）。コールを閉じた瞬間が小節境界の直前だった場合、

const KING_SEQ_RESPONSE_MIN_LEAD = 0.12;
/* スネアのチョーク（_playKingBeamHit の decay 引数）。
   減衰倍率 = 次の音までの間隔 ÷ KING_BEAM_CHOKE_REF（上限1）。
   この値は「鳴っている実長」ではなく効き具合を決める基準値であることに注意。
   OfflineAudioContextで実測した可聴の尾（ピークの3%まで）は次のとおり:
     decay 1.0 → 180ms / 0.78 → 125ms / 0.59 → 95ms / 0.39 → 65ms / 0.25 → 40ms
   0.42 だと尾は間隔のおよそ0.4倍に収まる（8分間隔なら125ms）。1:1で当てたければ
   0.18程度まで下げるが、それだと8分より粗い間隔でほぼ効かなくなる。

const KING_BEAM_CHOKE_REF  = 0.42;
/* 再生時のベロシティ。飛翔する文字の大きさ（drawKingCharFlights: JUSTだけ
   KING_CHAR_JUST_FONT_SCALE=2倍）と対応させる。見た目の大きさと音の強さが揃うので、
   タイミング精度の差が目でも耳でも同じ形で返る。
   文字は面積比で4倍になるが、音量をその比にするとGOODが埋もれるので差は穏やかに取る。
   また5音目のアクセント（1.35倍）は超えないようにして、フレーズの終止が常に一番強い状態を
   保つ。
   OK以下（グレー）は加点も焦げ跡も無い扱いのまま、叩いた拍が無音で抜けないための音だけを
   ごく小さく残す */
/* JUSTの上限は1.15。1.25まで上げるとサンプルピークが1.47となり、5音目のアクセント
   （1.38）を超えて常時リミッターに当たる。アクセントを最大に保つ意味でもここで頭打ち */
/* 5音目のアクセントの配合。_playKingBlast が音色の主張、スネアは着弾の打点。
   実測で決めた（通常のJUST着弾を0dB基準、括弧内はカウベル単体の相対量）:
     スネア0.85 + カウベル0.34 → +0.3dB（-11.1）… 終止として弱く、音色も変わって聞こえない
     スネア1.00 + カウベル0.34 → +1.7dB（-11.1）… 音量は足りるがカウベルが埋もれる
     スネア1.00 + カウベル0.60 → +1.9dB（ -6.2）… 採用
     スネア1.00 + カウベル0.85 → +2.7dB（ -3.2）… ピークが2.04まで上がる
   狙いは「アクセントがフレーズ中で常に一番強い」かつ「カウベルが音色として聴こえる」。
   最初 スネア0.62 で組んだところ合成が通常の着弾より2.4dB小さくなり、終止が一番強いと
   いう関係が壊れていた（スネア側にはaccent=trueの1.35倍が掛かる前提を二重に見ていた） */
const KING_ACCENT_SNARE_VOL = 0.42;
const KING_ACCENT_BLAST_VOL = 1.0;
const KING_BEAM_VOL_JUST   = 1.15;
const KING_BEAM_VOL_GOOD   = 0.85;
const KING_BEAM_QUIET_VOL  = 0.3;
/* 飛翔体の判定ティアから再生ベロシティを引く（tier: 'just' | 'good' | null=OK以下） */
function _kingBeamVol(tier) {
  return tier === 'just' ? KING_BEAM_VOL_JUST
       : tier === 'good' ? KING_BEAM_VOL_GOOD
       : KING_BEAM_QUIET_VOL;
}
const KING_BEAM_MIN_DECAY  = 0.25;
/* 再生タイミングの倍率＝1（打ち込んだ間隔をそのまま鳴らす）。

   ため、同じ形でも別のリズムに聞こえる。
   長さを詰めたい場合も、隙間クランプ（KING_SEQ_GAP_MAX）側で行うこと。クランプは上限
   未満の隙間をそのまま通すので形を壊さないが、全体倍率は打ったものすべてを別の音価へ
   移してしまう */
const KING_SEQ_PLAY_SCALE = 1;
/* 次トライ開始までの最低リード（秒）。ハズレ後など再生シーケンスが無い経路で

const KING_SEQ_MIN_LEAD = 0.18;

   合うよう発射側を前へずらす（飛翔時間が距離によらず一定という性質は不変） */
const KING_SEQ_BEAM_LEAD = KING_LASER_TRAVEL_FRAMES / 60;

const KING_ACCENT_FLASH_FRAMES  = 10;  // 全身フラッシュ＋焦げ跡の発光
const KING_ACCENT_RECOIL_FRAMES = 14;  // のけぞり
const KING_ACCENT_RECOIL_PX     = 10;
/* 発射（5打目）の放電。撃った瞬間に4つの三角から放電が弾ける。

const KING_FIRE_FLASH_FRAMES = 12;
/* 発射から5音目までを「充電 → 焼き込み」として繋ぐ演出。
   ・発射直後: 4つの三角マークとそれぞれの結果文字が稲妻で接続される
   ・各文字が撃ち込まれた瞬間: その接続が切れ、スパークが文字側へ移る＝その位置が
     帯電したまま待つ
   ・5音目の爆発: 帯電していた4箇所が一斉に焦げへ変わる
   焦げの出現タイミングを着弾からアクセントへ遅らせるのがこの演出の本体で、ダメージ確定
   （こんがり%・全身の焼き色）が5音目へ集約されているのと辻褄が合う＝「4回撃ち込んで溜め、
   5発目で焼く」が画面上で一本に繋がる。
   接続の有無は的の帯電と同じ _king.reelBeamed で判定するので、三角の帯電が消える瞬間と
   線が切れる瞬間は構造的に一致する */
const KING_TETHER_SEG   = 7;    // 稲妻の折れ数
const KING_TETHER_AMP   = 0.13; // 横揺れ幅（両端間の距離に対する比・中央で最大）
const KING_CHARGE_BOLTS = 7;    // 文字側の帯電の本数（的側 _drawKingReelCharge と同数）
let _kingFireFlash = 0;
let _kingAccentFlash  = 0;
let _kingAccentRecoil = 0;
let _kingAccentMarks  = []; // アクセントで一斉に発光させる焦げ跡（その試技で焼いた分）
/* 1文字ごとの被弾リアクション（KING_ACCENT_* の縮小版）。
   撃ち込まれた瞬間に、キング本体をビームの進行方向（的の三角 → 着弾した焦げ跡）へ短く押す。

   狙いは「4文字ぶんのダメージが溜まって5音目で確定する」を目で追えるようにすること。
   アクセントと同じカーブ（sin(pπ)(1-0.4p)）の小型版にして語彙を揃え、大きさと長さで
   はっきり格を下げる。別種の動きを足すと2つの演出が競合して主役が消える。

   方向を上固定にせずビームの向きにするのは、4発とも同じ動きだと4回目には情報量が

   水平変位にして-1.8〜+2.6pxの幅がある＝どの的からどこへ入ったかが動きで分かる。

   揃える（markRef を持たないので _stickKingChar の入口で弾かれる）。
   精度で大きさを変えるのは、文字の大きさ・再生の音量が既に精度に対応しているのと同じ考え方 */
const KING_HIT_KNOCK_FRAMES = 7;
const KING_HIT_KNOCK_JUST   = 3.5;
const KING_HIT_KNOCK_GOOD   = 2.2;
/* 同時着弾（音声の時計が引けずシーケンスを組めない経路では4文字が同じフレームで着弾する）で

const KING_HIT_KNOCK_MAX    = KING_ACCENT_RECOIL_PX * 0.5;
/* 着弾点を光らせる案（_kingFlashSprite を半径0.55倍・アルファ0.35・5フレームで重ねる）は

   前後関係と明度差を解決すること */
/* 進行中の被弾リアクション [{ux,uy,amp,life}]。1試技で最大4個・7フレームで消える */
let _kingHits = [];
const _predKingHitAlive = h => h.life > 0;
let _kingChargedMarks = []; // 撃ち込み済みだがまだ焼き込まれていない焦げ跡（帯電中）
let _kingFlashSprite  = null; // 焦げ跡の発光用スプライト（初回使用時に生成）
let _king = null;       // { liveOC, half, marks, cookPct, bx, by, dbx, dby, dscale, tx, ty }
let _kingLasers = [];   // { x1,y1,x2,y2, age, life, maxLife, color, glow }
let _kingCharFlights = []; // { char, sx,sy, rtx,rty, state, frames, resolve, bx,by,bvx,bvy }
let _kingShatter = null; // { pieces } 的が砕けて破片が飛び散る演出（6回目の失敗時のみ、_startKingReelShatter参照）
const KING_SHATTER_MAX_FRAMES = 150; // 破片が画面外に出きらない場合の保険上限
/* こんがり達成時の湯気（蒸したての湯気、_spawnVictorySteamWisp参照）専用の独立した配列。

   二重適用されて正味+0.21/frameの下向き加速度になる。結果、約13フレームで上昇が失速し、
   「上昇する湯気」ではなく「跳ねてすぐ落ちる火の粉」の動きになる */
let _victorySteam = [];
let _steamSprite = null; // 湯気用の柔らかい放射状グラデーションスプライト（初回使用時に生成）
/* このこんがり達成が初回か（_startBossVictoryで確定）。trueを引き継いでbossVictoryの
   CONTINUEタップ時に真エンディングへ進むかどうかを決める（_startTrueEnding参照） */
let _pendingTrueEnding = false;
let _bossVictoryTimer = 0;
let _bossVictoryWonCoins = 0; // こんがり達成で返却したギヨウザ数（勝利画面の表示用、_startBossVictory参照）
let _bossDefeatTimer = 0;
let _bossDefeatShrinkTimer = 0;
let _scorchBlotSprite = null;

/* 焼き目スタンプの元絵を初回に1回だけ生成（不定形の焦げ跡×3層） */
function _buildScorchBlotSprite() {
  if (_scorchBlotSprite || !_CACHE_OK) return;
  const sz = 64, half = sz / 2;
  const oc = _mkCache(sz, sz);
  const c = oc.getContext('2d');
  c.translate(half, half);
  /* 色・アルファは地の色に対して十分濃く取る。位置・サイズが正しくても、薄いと
     GOOD/JUSTのサイズ差が肉眼でほぼ判別できない */
  const layers = [
    { r: 26, a: 0.85, col: '75,42,14' },
    { r: 19, a: 0.90, col: '50,25,6'  },
    { r: 11, a: 0.85, col: '25,10,2'  },
  ];
  /* 各点を直線でつなぐと8角形の角が立ち、四角いパッチのように見える。点数を増やした
     うえで隣接点の中点同士を二次ベジェで結ぶ「丸めたブロブ」の手法で輪郭を滑らかにする。
     半径の乱数幅（不定形さ）自体は変えない */
  const N = 14;
  for (const ly of layers) {
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a  = (i / N) * Math.PI * 2;
      const rr = ly.r * (0.75 + Math.random() * 0.5);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr * 0.85]);
    }
    c.beginPath();
    const midStart = [(pts[N-1][0]+pts[0][0])/2, (pts[N-1][1]+pts[0][1])/2];
    c.moveTo(midStart[0], midStart[1]);
    for (let i = 0; i < N; i++) {
      const p = pts[i], pn = pts[(i+1)%N];
      c.quadraticCurveTo(p[0], p[1], (p[0]+pn[0])/2, (p[1]+pn[1])/2);
    }
    c.closePath();
    c.fillStyle = `rgba(${ly.col},${ly.a})`;
    c.fill();
  }
  _scorchBlotSprite = oc;
}

/* 誕生直後（bossOmen step7 のタップ）に呼ばれ、実戦闘フェーズへ移行する */
function _initBossBattle() {
  /* 蓄積メーターは戦闘開始時点でリセット（ボスは蓄積そのものが実体化したもの）。
     ここでリセットしないと勝敗に関わらず次のトライ終了直後に即再発動する。
     OffscreenCanvas 非対応で即復帰する経路も含め、常にリセットすること。
     リセット前の値は_kingMeterAtBattleStartへ退避する。こんがり達成時に「このキングに
     取り込まれていたギヨウザ」として所持数へ返すため（_startBossVictory参照）。
     ボスは閾値到達で出現するので必ずKING_GYOZA_THRESHOLD以上＝1000+アルファになる */
  _kingMeterAtBattleStart = kingGyozaMeter;
  kingGyozaMeter = 0;
  lsSaveStats();
  if (!_CACHE_OK || !_bossOC) { _kingBattleEnd(); return; } // 非対応環境は戦闘なしで復帰
  _buildScorchBlotSprite();
  _buildKingFlashSprite(); // 5音目アクセントの焦げ跡発光（戦闘中に初回生成しないよう先に確保）
  /* 縦画面: 的（こんがりミニリール）のサイズを、左右上部のアイコン（トロフィー/ポーズ・
     ミュート/全画面）を除いた横幅いっぱいに広がるよう動的に決め直す。
     直径4個＋隙間3個（KING_REEL_GAP）で埋まる半径を逆算する。KING_RESULT_FONT/Hも半径に
     比例するため合わせて再計算する。
     ここで行う理由: BTN_RIGHT/BTN_SIZEがKING_WRの宣言より後で定義されるため、モジュール
     トップレベルでは計算できない */
  if (IS_PORTRAIT) {
    const iconZone = BTN_RIGHT + BTN_SIZE; // 左右上部アイコンが占める帯
    const availReelW = W - iconZone * 2;
    KING_WR = (availReelW - KING_REEL_GAP * 3) / 8;
    KING_RESULT_FONT = Math.round(KING_WR * 0.55);
    KING_RESULT_H = KING_RESULT_GAP + KING_RESULT_FONT + 4;
  }
  const half = _bossOC.half, s = _BOSS_S;
  /* _bossOC.oc の物理ピクセルサイズは half*2*_dpr（_buildBossOC 参照）。
     liveOC も同じ物理サイズで確保しないと合成時に左上1/4しか転写されない
     （DPR>1 環境で右・下が切れる）。
     内容は _renderKingBody() が命中の都度・素のスプライトから再構成するため、ここでは
     領域確保のみ行う（初期状態は _renderKingBody 側で _bossOC.oc をそのまま返す高速経路が
     あるため、初期描画は不要）。
     _bossOCにキャッシュして戦闘をまたいで再利用する。戦闘ごとに新規生成すると、旧canvasが
     GC待ちで滞留する（キング的OCと同じリーククラス）。合成状態のキャッシュキー
     （_toneRenderedPct等）は_king側に持つため、canvasを使い回しても過去の戦闘の内容が
     誤って再利用されることはない */
  /* liveOCは_buildBossOC（予兆の入口）で確保済み。ここでの確保は保険
     （OffscreenCanvas未対応環境は上で復帰するので通常は通らない）。
     1140x1140＝約130万画素の確保を戦闘開始のフレームで行うと、的が回り始める瞬間に
     ぶつかって回転の速度ムラになる。確保は必ず予兆側で済ませておくこと */
  const liveOC = _bossOC.liveOC ||
    (_bossOC.liveOC = _mkCache(half * 2 * _dpr, half * 2 * _dpr));
  /* marks は当たりが確定した焦げ跡だけを積むので、事前生成せず空で始める
     （個々の焦げ跡は _createKingMark がタップの都度その場で生成する） */
  const marks = [];
  /* 縦レイアウトを実寸から動的計算する（マジックナンバーの縦横別ハードコード禁止）。
     コインヘッダー下端〜こんがりゲージ上端の実際の空き高さにボスを収まるよう縮小し、
     ボス下端〜ゲージ上端の間にこんがりミニリール4連の場所を確保する。
     by=H/2のような固定値にすると、ボスがキャンバス縦幅をほぼ占領し、ミニリールが
     ゲージパネルの背景（リールより後に描画される）に埋もれて見えなくなる */
  /* ボス上端〜ヘッダー下端の余白: 縦画面は左右の隙間（コインヘッダーの左右マージン）と、
     横画面は外枠〜コインヘッダーの隙間（BTN_M）と、それぞれ同じ量にする。
     横画面でBTN_TOPを使ってはいけない: 内枠厚み11pxを含む絶対Y座標であって「隙間」そのもの
     ではない。枠〜コンテンツの余白はBTN_M=10 */
  const topGap = IS_PORTRAIT ? (W - COIN_HEADER_W) / 2 : BTN_M;
  const headerBottom = COIN_HEADER_BOTTOM_Y + topGap; // コインヘッダー下端(y座標) + 余白
  /* 横画面: panelTopをゲージ上端そのものにし、リールとの隙間はGAP_REEL_PANEL
     （topGap=BTN_M、統一マージン）1本だけにする。ここに独立した固定オフセットを足すと
     GAP_REEL_PANELと二重に効いて隙間が倍近くになる。横画面ではリールをこんがり表示エリアの
     ぎりぎりまで下げ、他の余白と同じ統一マージンだけを残すのが正しい。
     縦画面は縦方向に余裕がないため -15px のオフセットを別途持つ */
  const panelTop      = IS_PORTRAIT ? P_BAR_Y - 15 : KING_GAUGE_Y; // こんがりゲージ上端 - 余白
  const REEL_D = KING_WR * 2, GAP_BOSS_REEL = 16;
  /* リール下端〜ゲージ枠上端の隙間は、ヘッダー上と対称に「太外枠とのマージン」と
     同じ量にする（topGap を再利用）。この隙間はリールをゲージ枠から固定量だけ離す
     下端基準の値であり、ボス側の空きに余裕があっても膨らませない。ボス基準の積み上げ式に
     すると空きに応じて隙間が伸び、対称性が崩れる */
  const GAP_REEL_PANEL = topGap;
  /* half(=0.75s)はスタンプ・呼吸アニメ余裕を含む安全バウンディング半径であり、
     実際に見えるボスの輪郭はもっと内側。_drawGyozaBody の本体楕円
     （中心=+0.08s、縦半径=0.48s）から見た目の頭頂は中心から-0.40s、裾は+0.56sと算出できる。
     scale-fit と by の余白計算の両方をこの見た目比率（0.40+0.56=0.96s）基準にすること。
     half基準（1.5s相当）のまま fit させると見た目より遥かに大きい余白込みで縮小され、
     縦画面では頭頂が100px以上離れ、横画面ではボスが小さすぎる（どちらも同根） */
  /* KING_RESULT_H: 的の下に当たった文字を表示するための縦スペース（drawKingReel参照）。
     ここで確保しないと文字がゲージ枠に重なる */
  const availH = panelTop - headerBottom - GAP_BOSS_REEL - REEL_D - KING_RESULT_H - GAP_REEL_PANEL;
  const scale = Math.min(1, availH / (s * (KING_VISUAL_TOP_RATIO + KING_VISUAL_BOTTOM_RATIO))); // 空き高さに収まる縮小率（拡大はしない）
  const visualTopOffset = s * KING_VISUAL_TOP_RATIO * scale;
  const by = headerBottom + visualTopOffset;
  const reelY = panelTop - GAP_REEL_PANEL - KING_RESULT_H - KING_WR; // ゲージ枠から固定隙間の下端基準（結果文字の分だけ上に確保）
  const reelGapX = KING_WR * 2 + (IS_PORTRAIT ? KING_REEL_GAP : 12);
  /* charWeights: 4的ぶんの文字配分（%）。的ごとに独立管理し、狙って命中させた文字の
     比率を毎回少しずつ増やしていく（_adjustKingCharWeight）。初期値は4文字均等の25% */
  const charWeights = [0, 1, 2, 3].map(() => Object.fromEntries(KING_CHARS.map(c => [c, 25])));
  const reels = [0, 1, 2, 3].map(i => _createKingReel(W / 2 + (i - 1.5) * reelGapX, reelY, charWeights[i]));
  /* dbx/dby/dscale は誕生演出（_omen step6-7）での鎮座位置・等倍スケールを初期値にし、
     ここから戦闘位置(bx,by,scale)へ毎フレーム収束させる（_easeKingXform）。
     こうしないと戦闘開始の瞬間に位置とスケールが瞬時にジャンプする */
  const omenBy = H / 2 - (IS_PORTRAIT ? 60 : 0);
  _king = {
    liveOC, half, marks, cookPct: 0, scale,
    bx: W / 2, by,
    dbx: W / 2, dby: omenBy, dscale: 1,
    reels, reelIdx: 0, attemptFired: false, resultTimer: null, resultMatched: false, charWeights,
    failCount: 0, pendingDefeat: false, pendingVictory: false, missAttemptToken: null,
    /* 篩い落とし演出（KING_SIFT_*参照）。siftPending=文字の到着待ち、
       siftTimer=null で非発動・0以上で経過フレーム */
    siftPending: false, siftTimer: null,
    reelCracks: [[], [], [], []], // 的スロット単位のひび割れ蓄積（{poly,angle}の配列。drawKingReel参照。再スピンをまたいで残る）
    reelShake: [0, 0, 0, 0],      // 的スロット単位の被弾揺れ残量（KING_REEL_SHAKE_FRAMES参照）
    /* リズムシーケンサ（KING_SEQ_*の定義部参照）。
       rec         : 打ち込み記録 [{pos, flight}]（pos=生のバッファ位置。強制発射分はnull）
       recStartPos : コール開始のバッファ位置（必ず小節境界）。バッテリー残量の起点であり、
                     コール＆レスポンスの枠の原点でもある（_kingBuildSequence参照）。
                     nullの間はバッテリー無効＝時間制限なし（音声が使えるまでの保険）
       seqEvents   : 再生の予約イベント [{at(ctx時刻), kind, ...}]。時刻昇順
       nextTrialPos: 次トライを開始するバッファ位置（小節境界）。nullなら未予約
       seqAccentAt : 5音目（焼き込み）のctx時刻。帯電の充電進捗を出すのに使う
                     （KING_TETHER_*の定義部・_drawKingMarkCharges参照）*/
    rec: [], recStartPos: null, seqEvents: [], nextTrialPos: null, seqAccentAt: null,
    /* 的スロット単位「その的のビームがもう飛んだか」。帯電スパークをいつ消すかに使う
       （drawKingReel参照）。再生では的ごとに時刻がずれて撃たれるので、発射タップで
       一斉に消すのではなく、実際にビームが出た的から順に消す */
    reelBeamed: [false, false, false, false],
  };
  _kingLasers = [];
  _kingCharFlights = [];
  phase = 'boss';
  /* BGMの段階をtier0（最も凶暴）にリセットする。startBossBGMTapeが
     bossBgmBuffer（tier0と同一内容）で新規ソースを作るため、ここでの状態
     リセットと実際の再生内容が一致する（_updateBossBgmTier参照） */
  _bossBgmTier = 0;
  _bossBgmPendingTier = null;
  startBossBGMTape(1200); // 世界が動き出す（予告のテープストップから復帰、ボス戦は暗黒版BGM）
}

/* ボス本体の描画元キャンバスを返す（素のスプライト＋全身トーン＋フェード中の焦げ跡）。
   全身トーンの強さは cookPct（タップ精度で直接積算、0〜100）と厳密に連動させる
   （フェード完了を待たず、ゲージが100%になった瞬間に全身も焦茶色100%になっている
   必要があるため）。
   個々の焦げ跡は revealedAt からの経過時間（wall-clock）でアルファを減衰させ、
   フェード仕切りの局所的な焦げ跡だけを別途上描きする。
   フェード中の焦げ跡が1つも無ければ再合成をスキップし、素のスプライト（pct=0）または
   合成済みの liveOC（pct>0 かつ全焦げ跡が消え切った定常状態）をそのまま返す */
function _renderKingBody() {
  const pct = _king.cookPct / 100;
  const now = performance.now();
  /* 焦げ跡は「フェード中」(t<1、毎フレーム再合成が必要)と「フェード完了後もごくごく薄く
     残る永続痕」(t>=1、KING_MARK_RESIDUAL_ALPHA固定)の2状態。
     永続痕（settled）がそのまま全身の「焼き目模様」を兼ねる。着弾位置と無関係な固定の
     焼き目模様を別レイヤーで重ねてはいけない。文字が飛んでいった先＝実際の焦げ跡と
     模様の位置が食い違い、当てた場所が焦げていないように見える */
  let activeCount = 0, settledCount = 0;
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000);
    if (t < 1) activeCount++; else settledCount++;
  }
  if (pct <= 0 && activeCount === 0 && settledCount === 0) return _bossOC.oc; // 未被弾: 素のスプライトをそのまま使う
  /* 再合成スキップの条件は pct 一致だけでは不十分: 直前のフレームでまだフェード中の
     焦げ跡が残っていた（_toneHadActive）場合、このフレームでactiveCountが0でも「焦げ跡を
     残痕アルファまで落とし切る」1回の再合成をしないと、消える途中の焦げ跡が残ったまま
     キャッシュされ、ボスが直前フレームの絵で固まる。settledCountの増加も同様に再合成
     トリガーにする（新たに永続痕入りした焦げ跡を反映するため） */
  /* 視線（gazeUp）も再合成トリガーに含める。含めないと見上げるアニメの間、
     pct/焦げ跡が変化しないため古い顔がキャッシュされたまま瞳が動かない */
  const gazeUp = _king.gazeUp || 0;
  if (activeCount === 0 && _king._toneRenderedPct === pct && !_king._toneHadActive &&
      _king._settledCount === settledCount && _king._gazeRenderedUp === gazeUp) return _king.liveOC;
  const lc = _king.liveOC.getContext('2d');
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, _king.liveOC.width, _king.liveOC.height);
  /* globalCompositeOperation/globalAlpha は setTransform/clearRect では戻らず、
     直前の呼び出し（source-atop・低アルファで終わっている）の状態を引き継ぐ。
     source-atop のままだと clearRect 直後（アルファ0）への drawImage が「既存アルファ内に
     のみ合成」の制約で何も描かれず、ボスが透明になる。明示的にリセットすること */
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  lc.drawImage(_bossOC.bodyOC, 0, 0); // 顔なし本体レイヤーから再構成（永続焼き込みではない）
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-atop'; // ボス本体のアルファ内にのみ合成
  if (pct > 0) {
    lc.globalAlpha = pct * KING_TONE_MAX_ALPHA;
    lc.fillStyle = KING_TONE_COLOR;
    lc.fillRect(-_king.half, -_king.half, _king.half * 2, _king.half * 2);
  }
  /* 焦げ跡本体: revealedAtがある全マーク（フェード中＋永続痕）を毎回描く。
     alphaはt=0で1.0→t=1でKING_MARK_RESIDUAL_ALPHAへ線形補間し、以降そこで
     下げ止まる（消え切らずごくごく薄く残る） */
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = Math.min(1, (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000));
    const alpha = 1 - (1 - KING_MARK_RESIDUAL_ALPHA) * t;
    lc.save();
    lc.translate(m.lx, m.ly);
    lc.rotate(m.rot);
    const sc = m.r / 26; // スプライト基準半径26に対する倍率
    lc.globalAlpha = alpha; // ここで減衰を掛けない（薄いとJUST/GOODのサイズ差が見えなくなる）
    lc.drawImage(_scorchBlotSprite, -26 * sc, -26 * sc, 52 * sc, 52 * sc);
    lc.restore();
  }
  /* 顔（目鼻口眉）はトーン・焦げ跡の影響を受けず、常に元の色で最後に上描きする
     （白目の白さと焦げ色とのコントラストを保つ）。pctに応じて表情が変化する
     （_drawKingFace参照）ため、静的faceOCのコピーではなく毎回ベクタ描画する。
     論理座標系（scale+translate）に戻してから描く必要がある */
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  _drawKingFace(lc, _BOSS_S, pct, gazeUp);
  _king._toneRenderedPct = pct;
  _king._toneHadActive = activeCount > 0;
  _king._settledCount = settledCount;
  _king._gazeRenderedUp = gazeUp;
  return _king.liveOC;
}

/* 的の下に出た結果文字を1体スポーンし、ボス付近まで飛ばす。的が1本ロックされるたびに呼ぶ
   （1〜3本目はまだこんがり成立/不成立が分からないため、着弾後は 'wait' 状態でボス付近に
   留まる。4本目のロックで結果が判明したら resolve を全未解決分にまとめて設定＝
   _kingReelShoot 側）。
   着地先（markRef）はこの時点で確定させる。タップ自体の精度（score）でJUST/GOODが決まった
   瞬間に、位置とサイズ込みの焦げ跡候補を _createKingMark で生成して持たせる
   （OK以下は候補なし＝null、ボス中心へ向かうだけ）。
   まだ _king.marks には登録しない（当たり確定＝「こ・ん・が・り」全一致まで正式な焦げ跡には
   しない。_kingReelShoot 参照）。
   待機中を中心寄りの仮位置にして結果確定時に動かす、という作りにはしないこと。最初から
   本来の位置に配置すれば、結果確定時に位置を作り直す処理そのものが不要になる */
/* 生成した飛翔体を返す（リズムシーケンサが打ち込み記録と紐付けるため。
   _kingReelShoot 参照） */
function _spawnKingCharFlight(w, reelIdx) {
  const tier = w.syncScore >= 0.667 ? 'just' : w.syncScore >= 0.333 ? 'good' : null;
  const f = {
    char: w.result, score: w.syncScore, // 文字色を通常モードと同じ赤〜黄〜緑にするため保持（drawKingCharFlights参照）
    sx: w.x, sy: w.y + KING_WR + 3 + KING_RESULT_GAP + KING_RESULT_FONT/2,
    /* ハズレ時の復路（_startKingCharBounce）が戻る先＝的の上部、三角ポインタ付近
       （drawKingReelのpx,pyと同じ式）。的の下（sx,sy）へ戻すと文字がボスと反対側から
       回り込む不自然な軌道になるため、ボス側を向いている上側を衝突点にする */
    rtx: w.x, rty: w.y - (KING_WR + 12),
    reelIdx, // 衝突の瞬間（_startKingCharBounce）にどの的のスロットへひびを追加するか
    tier, markRef: tier ? _createKingMark() : null,
    state: 'fly', frames: 0, resolve: null, attemptToken: null,
    deferBurn: false, // 焦げを5音目まで遅らせるか（_kingBuildSequenceが立てる）
    rot: 0, rotSpd: 0, // 弾き飛ばし後の回転演出（衝突時に設定、drawKingCharFlights参照）
  };
  _kingCharFlights.push(f);
  return f;
}

/* 焦げ跡候補を1個生成する（位置はボス胴体内に一様分布）。サイズはtierに依存しない一定範囲。
   焦げの面積とマークされる文字の大きさは別物として扱う（文字側のサイズ差は
   KING_CHAR_JUST_FONT_SCALE・drawKingCharFlights参照）。
   当たりが確定するまでは _king.marks に登録しない「候補」のまま（_spawnKingCharFlight参照） */
function _createKingMark() {
  const ang = Math.random() * Math.PI * 2;
  const rad = Math.sqrt(Math.random()); // 円盤上に一様分布
  return {
    lx:  Math.cos(ang) * _BOSS_S * 0.52 * rad,
    ly:  _BOSS_S * 0.08 + Math.sin(ang) * _BOSS_S * 0.42 * rad,
    r:   _BOSS_S * 0.085 + Math.random() * _BOSS_S * 0.045,
    rot: Math.random() * Math.PI * 2,
    revealedAt: null,
    /* 撃ち込み済み・焼き込み待ち（帯電中）かどうかと、その開始ctx時刻
       （KING_TETHER_*の定義部・_stickKingChar参照） */
    charging: false, chargedAt: null, chargeR: 0,
  };
}

/* 文字の着地先（＝焦げ跡markRefの実位置。markRefが無い＝OK以下のタップは
   焦げを残さずボス中心へ向かうだけ）を「今の」ボス表示位置（dbx/dby、呼吸
   アニメ込みのbreath）を基準に毎回ライブ計算する。_renderKingBody内の
   焦げ跡描画と同じ座標変換。凍結せず毎フレーム計算し直すことで、ボスがまだ
   誕生演出から戦闘位置へ収束中でも常に実際の描画位置に追従する */
function _kingFlightTargetPos(f) {
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  if (f.markRef) return { x: _king.dbx + f.markRef.lx * breath, y: _king.dby + f.markRef.ly * breath };
  return { x: _king.dbx, y: _king.dby };
}

/* 文字の「今」の描画位置を状態に応じて算出する（draw側から呼ぶ） */
function _kingCurrentFlightPos(f) {
  const target = _kingFlightTargetPos(f);
  if (f.state === 'fly') {
    const e = 1 - (1 - Math.min(1, f.frames / KING_CHAR_FLY_FRAMES)) ** 2; // ease-out
    return { x: f.sx + (target.x - f.sx) * e, y: f.sy + (target.y - f.sy) * e - Math.sin(e * Math.PI) * 18 };
  }
  if (f.state === 'wait') return { x: target.x, y: target.y + Math.sin(f.frames * 0.12) * 2 };
  if (f.state === 'stick') return target;
  /* bounce（的への接近）・fall（衝突後の反発落下）は物理シミュレーション
     （bx/by/bvx/bvy）で位置を直接持っているので、そのまま返す */
  return { x: f.bx, y: f.by };
}

/* こんがりリールへのタップ入力＝コールの1打。1本ずつ hitResult() で位置判定して確定する
   （通常ゲームの onShoot と同じ「タップ時点の回転角で止める」操作感）。
   **4本目でコールが閉じ、そのまま _kingFireAttack へ進む**。独立した発射トリガーは持たない:
   ・コール＆レスポンスとして見ると、コールは4打ちょうどであるべき
   ・5打目の位置がプレイヤー任せだと「4連射→間→爆発」の形が打ち方次第で崩れる
   ・「もう一手必要」がプレイヤーに伝わらず、バッテリー切れの自動発射が標準トリガーだと
     誤解される
   締めのアクセントは小節境界に置かれる（_kingBuildSequence参照）。
   決定した文字はここで即バックグラウンドの飛翔演出（_spawnKingCharFlight）に渡す。
   演出自体は _updateKingCharFlights が矢を射る操作（リールのロック）とは無関係に毎フレーム
   自走するため、プレイヤーは飛翔の完了を待たず次の的を狙える。
   'wait'状態（着地して結果待ち）にはタイムアウトが無いため、レスポンスまでの待機がどれだけ
   延びても安全（_updateKingCharFlights参照） */
function _kingReelShoot(inputPerfMs, forced = false) {
  if (phase !== 'boss' || !_king || _king.reelIdx >= 4 || _king.attemptFired) return;
  const w = _king.reels[_king.reelIdx];
  w.result = hitResult(w, -Math.PI/2); // 的の三角ポインタは常に真上（drawKingReel参照）
  w.locked = true;
  /* forced=バッテリー切れの強制発射で自動確定した的。プレイヤーが狙っていないので
     精度を与えない（syncScore=0 → tier=null → 焦げ跡もビームも音も無し）。
     配分の学習（_adjustKingCharWeight）も行わない: あれは「その的で狙って当てた
     文字」だけを基準にする仕組みなので、自動確定を混ぜると意味が壊れる。
     打ち込み記録にも積まない（鳴らす対象が無いスロットになるため） */
  w.syncScore = forced ? 0 : ((audioCtx && bgmPhaseRef !== null) ? calcSyncScore(inputPerfMs) : 0.5);
  const last = _king.reelIdx === 3; // この打でコールが閉じる
  if (!forced) {
    /* 4打目だけオープンハット（kingFire）にして「コールを閉じた」ことを音で示す。
       発射トリガーがあった頃の5打目と同じ音・同じ役割で、位置が1つ前に移った */
    playSE(last ? 'kingFire' : 'kingMark');
    if (last) _kingFireFlash = KING_FIRE_FLASH_FRAMES;
    _adjustKingCharWeight(_king.reelIdx, w.result); // この的で命中した文字の比率を少し上げる（次回respinから反映）
  }
  const f = _spawnKingCharFlight(w, _king.reelIdx);
  /* 量子化はここでは行わず、生の位置（バッファ秒）のまま積む。タップ単位で絶対
     グリッドへ丸めると、タップ同士の相対間隔が壊れる（_kingBuildSequence参照） */
  _king.rec.push({ pos: forced ? null : _bgmJudgePos(inputPerfMs), flight: f });
  _king.reelIdx++;
  if (last) _kingFireAttack(inputPerfMs, forced); // コールが閉じた＝そのままレスポンスを組む
}

/* コールが閉じた瞬間の処理（4打目の _kingReelShoot から直接呼ばれる）。
   こ・ん・が・り全一致なら打ち込んだリズムを再生シーケンスへ組んで（_kingBuildSequence）
   レスポンスを鳴らし、不一致なら篩い落とし→衝突→ひびへ進む。
   いずれの場合も4本の結果文字を表示したまま静止させ、次のトライは _kingTrialGate が
   小節境界で解放する。
   forced=true はバッテリー切れで最後の的が自動確定した場合（_kingBatteryCheck 経由） */
function _kingFireAttack(inputPerfMs, forced = false) {
  if (phase !== 'boss' || !_king || _king.reelIdx < 4 || _king.attemptFired) return;
  _king.attemptFired = true; // 的の帯電演出（drawKingReel参照）を止める
  /* コールを閉じる音（オープンハット）と放電は4打目の _kingReelShoot 側で鳴らす。
     打ち込みはハイハット・レスポンスはスネアという音色の役割分担は不変 */
  const matched = _king.reels.every((r, i) => r.result === KING_TARGET[i]);
  if (matched) {
      const avgScore = _king.reels.reduce((a, r) => a + r.syncScore, 0) / 4;
      /* こんがり%はタップごとの精度で直接積算する（JUST=+1.0%・GOOD=+0.5%・OK以下=0%）。
         この4タップぶんの候補焦げ跡（スポーン時に_createKingMarkで生成済み、
         _spawnKingCharFlight参照）を、当たりが確定したこの時点で初めて _king.marks へ
         正式登録する。不一致なら登録されず消える＝「文字が飛んでいっていない場所に焦げが
         発生する」ことを避ける。ただし実際に見えるのは revealedAt が打たれてから
         （_stickKingChar）＝再生で各文字が撃ち込まれた瞬間。
         %の加算自体は5音目のアクセントへ集約する（_kingSeqAccent参照。1発ごとに+0.5〜1.0%を
         4回刻むより、まとめて伸ばすほうが目に見える）。
         スコア平均（avgScore）はビーム色・JUST/GOOD/OKラベル表示のみに使う（%やサイズには
         使わない＝1本ずつ個別に判定する） */
      const thisAttempt = _kingCharFlights.filter(f => f.resolve === null);
      let gain = 0;
      for (const f of thisAttempt) {
        if (!f.markRef) continue; // OK以下のタップは焦げ跡なし
        _king.marks.push(f.markRef);
        gain += (f.tier === 'just' ? KING_JUST_PCT : KING_GOOD_PCT);
      }
      _kingSetSyncLabel(avgScore);
      _king.resultMatched = true;
      _king.resultTimer = 0;
      _king.missAttemptToken = null;
      if (_kingBuildSequence(forced, gain, thisAttempt)) return; // 以降は_kingSeqStepが進める
      /* 音声の時計が引けない場合（BGM未開始・テープ演出のレートランプ中など）は即時に適用する。
         シーケンサは音楽が鳴っていて初めて意味を持つので、鳴っていない状況では
         「4本同時着弾」へ退避するのが正しい */
      _kingApplyGain(gain);
      _kingApplyBeams(thisAttempt);
      for (const f of thisAttempt) f.resolve = 'stick';
      _king.reelBeamed = [true, true, true, true]; // 再生が無いので帯電はここで止める
      return;
    } else {
      /* 失敗（こ・ん・が・り不一致）: こんがり%を少し後退させる。KING_MAX_FAILS回で
         ルーレット完全破壊＝敗北。ひびを追加するのはここではなく、実際に文字が的へ
         衝突した瞬間（_startKingCharBounce、_updateKingCharFlights参照）。
         playSE('miss')（ズコーという下降スライド）が鳴るのはゲーム中でここだけ
         （通常モードの外れは無音）。頻度が低く演出上の意味があるので鳴らす。
         実際にひびが入る瞬間には別途金属音が鳴る（_playKingCrackKin参照） */
      _king.cookPct = Math.max(0, _king.cookPct - KING_MISS_PCT_PENALTY);
      _king.failCount = Math.min(KING_MAX_FAILS, _king.failCount + 1);
      /* 6回目の失敗は即座に敗北確定にはせず、この4文字が全て的へ衝突（ひびが全て入り終える）
         まで待ってから、的が砕けて破片が消えきった後に敗北を確定する。
         _updateKingCharFlightsのattemptToken.remainingが0になった時点でpendingDefeatを見て
         _startKingReelShatterへ進む */
      if (_king.failCount >= KING_MAX_FAILS) _king.pendingDefeat = true;
      playSE('miss');
      /* 篩い落としを予約する。実際の発動は4文字すべてがキングへ到着してから
         （_updateBossBattleが判定。KING_SIFT_*の定義部参照） */
      _king.siftPending = true;
    }
    /* ここから下はハズレ経路だけ（当たりは上のブランチで return 済み）。
       ハズレは再生シーケンスを作らず、即座に4体へ結果を伝える */
    _king.resultMatched = false;
    _king.resultTimer = 0; // 結果表示保持タイマー開始（音声が無い場合のフォールバック用）
    _king.reelBeamed = [true, true, true, true]; // ハズレはビームが飛ばないので帯電はここで止める
    /* この試技で飛ばした（が未解決の）4体すべてに結果を伝える。着地先はスポーン時から
       確定済みのためここでの位置変更は不要（そこから跳ね返る）。
       ハズレの4体には共通のattemptTokenを持たせ、remainingで「衝突（ひび）が全て入り
       終えたか」を数える。6回目の失敗の破砕演出のトリガー（_updateKingCharFlights参照）と、
       次のトライの解放（_kingTrialGate参照）の両方がこの1つのカウンタで決まる */
    const attemptToken = { remaining: 0 };
    for (const f of _kingCharFlights) {
      if (f.resolve !== null) continue;
      f.resolve = 'bounce';
      f.attemptToken = attemptToken; attemptToken.remaining++;
    }
    /* ハズレのトライが終わるのは「失敗が的に刻まれた瞬間」＝4体とも衝突してひびが入り
       終えたとき。弾き飛ばされた文字が画面外へ消えるのは待たない。
       消えるまで待つと、落下（0.8〜0.9秒）が終わってから次の小節境界を選ぶことになり、
       待ちが落下の後ろに直列でぶら下がって、文字が消えたあと平均0.7秒・最大1.3秒だけ
       的が回り出さない時間が空く。
       落下は再スピンのあとも続くが、文字は的より先に描かれる（drawBossBattleの
       drawKingCharFlights → drawKingReel の順）ので、回り始めた的の後ろを落ちていくだけで
       絵は乱れない */
    _king.missAttemptToken = attemptToken;
}

/* ── 打ち込んだリズムの再生（KING_SEQ_*の定義部参照） ── */

/* 打ち込んだ5タップを再生シーケンスへ組み、音を先行スケジュールする。
   組めた場合のみ true（false なら呼び出し側が即時適用へ退避する）。
   スロットは絶対インデックスで記録されているので、最初のマークからの相対オフセットを取れば
   アンカーを好きな位置に置ける＝小節に固定せず、発射の直後の拍境界から鳴らし始められる
   （速く打ち終われば速く再生も終わる） */
function _kingBuildSequence(forced, gain, flights) {
  if (!audioCtx || _bgmRateRamping()) return false; // レートランプ中は将来位置を外挿できない
  /* 打ち込みの起点が定まらないまま進んだトライ（戦闘開始直後のテープ演出中に
     叩き切った場合）は、記録した位置がレート変動下の値で相対間隔が歪んでいる。
     そのまま再生すると打ったリズムと違うものが鳴るので組まない */
  if (_king.recStartPos === null) return false;
  const nowPos = _bgmJudgePos();
  if (nowPos === null) return false;
  const rec = _king.rec.filter(r => r.pos !== null);
  if (rec.length === 0) return false;
  /* ── コール＆レスポンス: 打ち込みが占めた小節の、次の同じ枠へ返す ──
     撃ったタイミングがレスポンスとして再現されて返ってくる、という体験が目的。

     間隔が合っているだけでは「返ってきた」と感じられない。耳が2つを照合できるのは
     **キック/和太鼓に対して同じ場所に鳴った**ときなので、レスポンスの各音がコールの
     対応する音と小節内で同じ位置に落ちる必要がある。そこで:
       コール開始（recStartPos、必ず小節境界）
         → コールが占めた小節数 callBars ぶん後ろの小節境界がレスポンス開始
         → 各音は「コール1打目の小節内位置(leadIn) + 打ち込みの相対オフセット」
         → レスポンスが終わった次の小節境界がアクセント（＝次のコールの1拍目）
     leadIn は1打目の絶対位置ではなく**小節内の位置**だけを引き継ぐ。正解文字を待って
     何小節も空けた回で絶対位置ごと持ってくると、先頭に死んだ間が入る。小節内位置さえ
     揃えば照合には十分。
     その小節内位置も、レスポンスを詰める回（longCall）では1拍で頭打ちにする
     （KING_SEQ_LEAD_IN_MAX参照） */
  const callStart = _king.recStartPos;
  const barSlots = KING_SEQ_BAR_SLOTS;
  const firstSlot = Math.round((rec[0].pos - callStart) / KING_SEQ_QUANT);
  const callSlots = Math.max(0, Math.round((rec[rec.length - 1].pos - callStart) / KING_SEQ_QUANT));
  const callBars = Math.max(1, Math.ceil(callSlots / barSlots));
  /* 正解文字を待っていた回か（KING_SEQ_LONG_CALL_BEATS参照）。当てはめ方（_kingSeqFitBeats）
     とレスポンス先頭の待ち（KING_SEQ_LEAD_IN_MAX）が、この1つの判定で一緒に切り替わる */
  const longCall = callSlots - firstSlot > KING_SEQ_LONG_CALL_BEATS * KING_SEQ_DIV;
  const leadInRaw = ((firstSlot % barSlots) + barSlots) % barSlots;
  const leadIn = longCall ? Math.min(leadInRaw, KING_SEQ_LEAD_IN_MAX) : leadInRaw;
  /* ── 打ち込んだ「相対的な間隔」から意図したビートシーケンスを読み取る ──

     各タップを記録時に絶対16分グリッドへ独立にスナップしてはいけない。タップ同士の
     相対関係が壊れる。実測（BGM 182BPM相当・16分=82.2ms）:
       均等な150ms×4    → 164.5, 164.5, 82.2, 164.5  （均等に叩いたのに3発目だけ半分）
       300,150,150,300  → 328.9, 82.2, 164.5, 328.9  （等しい2つの150msが分裂）
     しかも結果が「最初のタップがグリッドのどこに落ちたか」に依存するため、同じ叩き方でも
     毎回違うリズムになる。隣り合うタップが同じスロットへ丸まれば1発に潰れる。

     そこで絶対位置は使わず、隣接タップの間隔だけを見る:
       1. 各間隔を上限（KING_SEQ_GAP_MAX）でクランプ … 待ち時間の除去。ここで先に
          潰しておかないと、後段で読み取った比を長い待ちが壊す
       2. 候補となる単位（16分の1〜KING_SEQ_GAP_MAX倍）を総当りし、全間隔の量子化誤差の
          合計が最小になる単位を選ぶ … プレイヤーが刻んでいた拍節を推定する
       3. 各間隔 = round(間隔 / 単位) × 単位 … 比を整数で保つ
     これで「均等に叩いたら均等に鳴る」「等しい間隔は等しく鳴る」が保証され、位相にも
     依存しなくなる。出力は必ず16分の整数倍なので、絶対グリッドの上に乗る点は不変。

     各間隔は最低1スロット空ける（Math.max(1, ...)）。これで異なるタップが同じ時刻へ
     集約されることが構造的に起きなくなる。
     並べるのは4打のみ。締めのアクセントはプレイヤーのタップではなく小節境界に置かれる。
     OK以下のタップ（ビームも焦げ跡も出ない）も時間としては間隔を持つので、markRef の
     有無に関わらず全タップを並べる。

     再生はプレイヤーの絶対位置ではなくパターンの内部構造の再構成なので、「JUSTを取った
     タップが絶対グリッドの境界に乗る」という性質は持たない。採点（こんがり%）とベロシティは
     生のタイミングで決まるので、報酬構造には影響しない */
  const taps = rec.map(r => r.pos);
  const raw = [];
  for (let i = 1; i < taps.length; i++) raw.push(Math.max(0, taps[i] - taps[i - 1]));
  const off = [0];
  if (raw.length > 0) {
    /* 上限クランプは _kingSeqFitGaps の中で「倍率を下げる」形で掛かるので、ここでは生の
       間隔を渡す。先にクランプすると比を読む前に長い音が潰れる（例: タ=200msで1:2 を叩くと
       400ms が上限329msへ落ちて 1:1.64 に見え、2:3 と誤読される）。

       当てはめは2本あり、分岐はコール全長という構造的な条件だけで決める（longCall）。
       リズムに乗って叩けている回は _kingSeqFitGaps が打ったものをそのまま等倍で返し、
       文字を待っていた回だけ _kingSeqFitBeats が拍を単位に読み直す。
       分岐の条件をこれ以上増やさないこと。長短を対数で段階化する、的の配分で混ぜる、
       フィット誤差から意図の有無を推定する、といった作り方はいずれも「打った通りに
       再生されない」の主因になる */
    const fit = longCall ? _kingSeqFitBeats(raw) : _kingSeqFitGaps(raw);
    for (const g of fit) off.push(off[off.length - 1] + g);
  }
  /* レスポンスの長さは上限（KING_SEQ_SPAN_SLOTS＝2小節）で頭打ちにする。上限内なら
     scale=1＝等倍でそのまま返る。当てはめ側（_kingSeqFitGaps は倍率を1段下げる形で、
     _kingSeqFitBeats は合計を1小節に収める形で）すでに上限を満たしているので、ここは
     倍率を1まで下げても収まらない病的なケースだけの保険になる */
  const noteSpan = off[off.length - 1];
  const scale = noteSpan > KING_SEQ_SPAN_SLOTS ? KING_SEQ_SPAN_SLOTS / noteSpan : 1;
  const mapOff = o => o * scale * KING_SEQ_PLAY_SCALE;
  /* レスポンス開始＝コールが占めた小節数ぶん後ろの小節境界 */
  let respStartSlot = Math.round(callStart / KING_SEQ_QUANT) + callBars * barSlots;
  /* 予約が間に合うかは**1音目**（境界＋leadIn）で見る。境界そのものを基準にすると、
     コールを閉じた瞬間がたまたま境界の直前だっただけでレスポンスが丸ごと1小節（1.3秒）
     後ろへ飛び、待ちが倍になる。
     間に合わないのが境界だけなら、枠は動かさずに切り替えの合図（_playKingCue）を落とす。
     合図には待ちの無音を埋める役目もあるが、この回は待ちがほぼ無い＝埋めるものが無い */
  const minSlot = (nowPos + KING_SEQ_RESPONSE_MIN_LEAD * _bgmRateTo) / KING_SEQ_QUANT;
  while (respStartSlot + leadIn < minSlot) respStartSlot += barSlots;
  const cueOk = respStartSlot >= minSlot;
  const slotAt = o => (respStartSlot + leadIn + mapOff(o)) * KING_SEQ_QUANT;
  const events = [];
  /* コールを閉じる合図。レスポンス開始の小節境界に置く（爆発と対になる） */
  if (cueOk) {
    const cueAt = _bgmBufPosToCtxTime(respStartSlot * KING_SEQ_QUANT);
    if (cueAt === null) return false;
    events.push({ at: cueAt, kind: 'cue' });
  }
  for (let i = 0; i < rec.length; i++) {
    const at = _bgmBufPosToCtxTime(slotAt(off[i]));
    if (at === null) return false;
    /* OK以下（グレー）のタップは焦げ跡もビームも出ない（加点しないというバランス仕様）が、
       音だけは小さく鳴らす。そのスロットを完全に無音にすると叩いた拍にそのまま穴が空き、
       打ち込んだビート通りに返ってこない。
       加点しない・焦げ跡も付かないという扱いは変えないので、バランスはそのままにリズムの
       形だけが完全になる */
    const quiet = !rec[i].flight.markRef;
    const vol = _kingBeamVol(rec[i].flight.tier);
    if (!quiet) {
      /* ビームは着弾（＝焦げ跡が焼き付く瞬間＝音）がスロットに来るよう前倒しで撃つ */
      events.push({ at: at - KING_SEQ_BEAM_LEAD, kind: 'shot', f: rec[i].flight });
    }
    events.push({ at, kind: 'impact', f: rec[i].flight, quiet, vol });
  }
  /* アクセント（爆発）＝レスポンスが終わった次の小節境界。ここが次のコールの1拍目にも
     なるので、コールとレスポンスが途切れずに回り続ける。プレイヤーのタップ位置に置いては
     いけない（詰めて押すと爆発が4打目に張り付き、「4連射 → 間 → 爆発」の形が打ち方次第で
     崩れる）。小節境界に置けば毎回同じ形になる。
     次トライのバッテリー起点（recStartPos）もこの位置＝必ず小節境界になる。
     焦げ跡が1つも無ければダメージ自体が無いので、アクセントではなく不発音にして
     「音は撃ったと言っているのに画面は無反応」を避ける */
  const respSlots = leadIn + mapOff(noteSpan);
  const respBars = Math.max(1, Math.ceil(respSlots / barSlots));
  const accentPos = (respStartSlot + respBars * barSlots) * KING_SEQ_QUANT;
  const accentAt = _bgmBufPosToCtxTime(accentPos);
  if (accentAt === null) return false;
  /* forced（バッテリー切れで最後の的が自動確定した試技）はアクセントを鳴らさない。
     こんがり%は据え置く（バランスは変えない）。差は「フレーズが締まるかどうか」＝
     自分でコールを閉じたか、時間切れで閉じられたかの違いとして出す */
  /* dud=この試技のダメージがゼロ（＝焦げ跡を1つも作れない＝4タップ全てOK止まり）。
     events.length で判定してはいけない: OK以下のタップにも小音量の着弾イベントが置かれる
     ので常に false になる。焦げ跡の有無は gain と同値（gain は markRef を持つタップだけで
     積算される、_kingFireAttack参照） */
  events.push({ at: accentAt, kind: 'accent', gain, flights,
                dud: gain <= 0, forced, nextPos: accentPos });
  /* 同一スロットの重なりは間引かずそのまま重ねる（プレイヤーの入力を補正しない
     という原則を全イベントに一様に適用する）。同時発音は振幅が重なるが、
     masterGain出力のセーフティリミッターが歪みを防ぐ */
  events.sort((a, b) => a.at - b.at);
  if (_SEQ_DEBUG) {
    const beat = BGM_BEAT / _bgmRateTo * 1000;
    const outSlots = []; for (let i = 1; i < off.length; i++) outSlots.push(off[i] - off[i - 1]);
    console.log('[seq] 打ち込み(ms)', raw.map(x => Math.round(x / _bgmRateTo * 1000)).join(','),
                '= 拍', raw.map(x => (x / _bgmRateTo * 1000 / beat).toFixed(2)).join(','),
                '→ 再生(スロット)', outSlots.join(','),
                '= 拍', outSlots.map(v => (v / KING_SEQ_DIV).toFixed(2)).join(','),
                '| コール', callBars + '小節(先頭' + leadIn + 'スロット目'
                  + (leadIn !== leadInRaw ? '/元' + leadInRaw : '') + ')',
                longCall ? '[長コール→拍グリッド]' : '[比を保存]', cueOk ? '' : '[合図なし]',
                '→ レスポンス', respBars + '小節', scale < 1 ? '(×' + scale.toFixed(2) + '圧縮)' : '(等倍)',
                '/ 音数', events.filter(e => e.kind === 'impact').length,
                '/ うち小音量', events.filter(e => e.quiet).length);
  }
  /* 焼き込みを5音目まで遅らせる印（_stickKingChar参照）。シーケンスを組めた場合にだけ
     立てる＝音声の時計が無くて即時適用へ退避する経路（_kingFireAttack）はアクセント自体が
     発火しないので、着弾と同時に焦げが付く */
  for (const f of flights) f.deferBurn = true;
  _king.seqAccentAt = accentAt; // 帯電の充電進捗の分母（_drawKingMarkCharges）
  _king.seqEvents = events;
  _kingSeqScheduleAudio(events);
  return true;
}

/* 再生シーケンスの音を audioCtx の時刻で先行スケジュールする。update() から毎フレーム
   発火させると16.7msのジッタが乗り、16分=82msに対して約20%のヨレとして聴こえるため。
   1発ごとに「次の音までの間隔」からチョーク量を決めて渡す（_playKingBeamHit 参照）。
   playSE を経由せず直接鳴らすのはこの引数を渡すためで、ミュート判定は playSE と
   同じ条件を使う（ミュート中は音だけ出ず、視覚イベントは通常どおり進む）。 */
function _kingSeqScheduleAudio(events) {
  if (audioMuted || !audioCtx || audioCtx.state !== 'running') return;
  /* 切り替えの合図は打点ではないので、チョーク量の計算（次の音までの間隔）には
     混ぜない。混ぜると直後のスネアの減衰が合図との距離で決まってしまう */
  for (const e of events) if (e.kind === 'cue') _playKingCue(audioCtx, e.at, null);
  const hits = events.filter(e => e.kind === 'impact' || e.kind === 'accent');
  for (let i = 0; i < hits.length; i++) {
    const e = hits[i];
    if (e.kind === 'accent') {
      /* アクセントは後ろが空いているので常にフル。焦げ跡ゼロなら不発音に差し替える */
      /* dud=焦げ跡ゼロ（ダメージ無し）／forced=自動発射（叩かれていない）。
         どちらも締めのアクセントは鳴らさず、弱い不発音だけを置く */
      if (e.dud || e.forced) { playSE('kingBeamDud', e.at); continue; }
      /* 5音目は「撃った衝撃＋余韻」（_playKingBlast）を主役にし、スネアを下に敷いて
         着弾の打点を保つ */
      _playKingBeamHit(audioCtx, e.at, null, true, 1, KING_ACCENT_SNARE_VOL);
      _playKingBlast(audioCtx, e.at, null, KING_ACCENT_BLAST_VOL);
      continue;
    }
    /* 次の音（次の着弾かアクセント）までの間隔でチョーク量を決める。
       音量は打ち込み時の判定ティア＝飛翔する文字の大きさに対応させる（_kingBeamVol） */
    const gap = i + 1 < hits.length ? hits[i + 1].at - e.at : Infinity;
    _playKingBeamHit(audioCtx, e.at, null, false, gap / KING_BEAM_CHOKE_REF, e.vol);
  }
}

/* 正解文字を待っていた回（longCall。KING_SEQ_LONG_CALL_BEATS参照）の当てはめ。
   dは生の間隔（秒）で、16分スロット数の配列を返す。

   この回の間隔は「リズムとして刻んだもの」ではなく「文字が回ってくるのを待った時間」
   なので、比をそのまま保存しても伝わるものが無い。むしろ比を保存しようとすると 5:9:4 の
   ような大きい整数になり、全長の上限に収めるために倍率が1〜2まで落ちて、再生間隔が
   1.25拍・2.25拍という拍節に存在しない値になる＝拍から浮いて聴こえる。
   そこで16分ではなく**拍**を単位に読み直し、全長を1小節へ収める:
     1. 各間隔を最寄りの拍数へ丸める（1拍〜1小節）
     2. 合計が1小節を超える間、半分にして丸め直す
   間隔の下限が1拍・合計が1小節なので、4打の再生はほぼ4分音符×4になる。オンビートで
   1小節に収まる形が返るので、これから乗るべき拍の手本としても働く。
   打った長短の形はほとんど残らないが、待ち時間から形を復元しても意味が無いので割り切る。
   命中させた文字のエリアが広がればコールは3小節に収まり、この経路自体を通らなくなる */
function _kingSeqFitBeats(d) {
  let r = d.map(v => Math.max(1, Math.min(KING_BAR_BEATS, Math.round(v / BGM_BEAT))));
  /* 全部1拍まで詰めても合計が1小節を超える場合（打数が増えたとき）に止まらなくなるので、
     まだ削れる要素が残っているかも条件に入れる */
  while (r.reduce((a, v) => a + v, 0) > KING_BAR_BEATS && r.some(v => v > 1)) {
    r = r.map(v => Math.max(1, Math.round(v / 2)));
  }
  return r.map(v => v * KING_SEQ_DIV);
}

/* リズムに乗って叩けている回（longCallでない）の当てはめ。dは生の間隔（秒・クランプ前）で、
   16分スロット数の配列を返す。上限は倍率の選び方で担保する（下記2)）。

   「最小間隔を基準にする」方式は採らない。基準そのものが1回のブレや偶然の短い間隔に
   引きずられ、他の間隔がまとめて狂う。意図した比を復元できた割合（6000試行のシミュレーション、
   人の打鍵ジッタは20〜30msが現実的な範囲）:
     ジッタ10ms  最小間隔基準 81.8% → この方式 100%
           20ms              58.7% →          100%
           30ms              41.1% →           94.3%
           45ms              21.9% →           63.8% */
function _kingSeqFitGaps(d) {
  /* 1) 打鍵から拍節単位 b を推定する。BGMのグリッドとは無関係に、各間隔が b の整数倍
        へ素直に収まるような b を探す。候補は「各間隔 ÷ 1〜KING_SEQ_GAP_MAX」から作る
        （プレイヤーが刻んだ単位は、必ずどれかの間隔の整数分の1になっているはず）。 */
  let best = null;
  for (const x of d) {
    for (let k = 1; k <= KING_SEQ_GAP_MAX; k++) {
      const b = x / k;
      /* 単位を細かく取るほど誤差は下がる（極端には b→0 で誤差0）ので、そのまま最小化すると
         必ず最も細かい解が勝ち、比が無意味に大きくなる。実測でも1拍×4を30msのブレ込みで
         叩くと b≈27ms・11スロット刻みが選ばれ、再生が2.75拍×4へ膨張する。2つで抑える:
         ・16分より細かい単位は候補にしない（人がそれ以下を刻み分けることはない）
         ・誤差は b で正規化する＝「推定した拍に対して何割ずれているか」で比べる */
      if (b < KING_SEQ_QUANT * 0.9) continue;
      const r = d.map(v => Math.max(1, Math.min(KING_SEQ_GAP_MAX, Math.round(v / b))));
      const err = d.reduce((a, v, i) => a + Math.abs(v - r[i] * b), 0) / b;
      if (best === null || err < best.err - 1e-9) best = { err, b, r };
    }
  }
  if (best === null) return d.map(() => 1);
