  if (kingGyozaMeter < KING_GYOZA_THRESHOLD) return false;
  if (!_allAchExceptKongariDone()) return false;
  if (isFever || feverPending || isGameOver) return false;
  _startBossOmen();
  return true;
}

function _startBossOmen() {
  pendingShoot = false;
  _releaseWheelOCs(_pendingWheels); _pendingWheels = null; _pendingWheelScheduled = false;
  if (_omenGhost) { _freeGhostCanvases.push(_omenGhost.oc); _omenGhost = null; }
  for (const g of items) g._dead = true; items = [];
  missPopups = []; payoutPopups = []; // 暗転下に残ポップアップが透けないようクリア
  _buildBossOC();
  _omen = { step: 0, timer: 0, items: [], flash: 0 };
  phase = 'bossOmen';
  stopBGMTape(1600);      // 世界が止まる（テープストップ+グレースケール）
  grayRateTarget = 0.001; // 無音起動（bgmSourceなし）でもグレースケールは進める
  playSE('boss_rumble');
}

function _updateBossOmen() {
  const o = _omen;
  if (!o) { phase = 'idle'; return; }
  o.timer++;
  if (o.flash > 0) o.flash -= 0.05;
  if (o.step === 0) {
    /* 暗転 */
    if (o.timer > 50) { o.step = 1; o.timer = 0; o.flash = 0.25; playSE('boss_rumble'); }
  } else if (o.step >= 1 && o.step <= 4) {
    /* 台詞1〜4を1行ずつ */
    if (o.timer > _OMEN_LINE_FRAMES) {
      o.step++; o.timer = 0;
      if (o.step <= 4) { o.flash = 0.25; playSE('boss_rumble'); }
      if (o.step === 5) {
        /* 収束開始: 画面外から霊ギヨウザが逆流 */
        playSE('boss_flash');
        const R = Math.hypot(W, H) * 0.6;
        for (let i = 0; i < 44; i++) {
          const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2;
          o.items.push(makeItem(W/2 + Math.cos(ang)*R, H/2 + Math.sin(ang)*R, 0, 0));
        }
      }
    }
  } else if (o.step === 5) {
    /* 中央へ収束 */
    const cx = W/2, cy = H/2 - (IS_PORTRAIT ? 60 : 0);
    for (const g of o.items) {
      g.x += (cx - g.x) * 0.06;
      g.y += (cy - g.y) * 0.06;
      g.rot += 0.15;
    }
    if (o.timer > 110) {
      o.step = 6; o.timer = 0; o.flash = 1;
      for (const g of o.items) g._dead = true;
      o.items = [];
      grayRateTarget = 1.0; // 誕生の瞬間、色が世界に戻る（ボスの金色を際立たせる）
      playSE('boss_flash');
    }
  } else if (o.step === 6) {
    /* 誕生フラッシュ+タイトル */
    if (o.timer > 90) { o.step = 7; o.timer = 0; }
  }
  /* step7: ボス鎮座（handleGameClick がタップで _initBossBattle を呼び戦闘開始） */
}

/* 戦闘終了（勝利後）→ 通常モードへ復帰。ゲームオーバー復帰と同じテープ加速演出を再利用 */
function _kingBattleEnd() {
  _king = null; _kingLasers = []; _kingCharFlights = [];
  if (_omen) { for (const g of _omen.items) g._dead = true; }
  _omen = null;
  if (_defeatOutro) { for (const g of _defeatOutro.items) g._dead = true; }
  _defeatOutro = null;
  /* 敗北の没収で所持ギヨウザが尽きた場合は、通常モードでコインが尽きた時と
     同じゲームオーバー復帰（フレッシュな60枚での再スタート）にする。
     勝利側から呼ばれた場合はcoinsが減ることがないため常にfalseで無関係 */
  if (coins <= 0) { gameOverReset(); return; }
  if (audioCtx) audioCtx.resume().catch(() => {});
  startBGMTape();
  grayRateTarget = 1.0;
  init(false, true);
  phase = 'tapestart';
}

/* こんがりしっぱい（全損には至らない敗北）から通常モードへ戻る前のつなぎ演出。
   誕生演出（ギヨウザが収束してキングになる）の逆再生イメージで、キングの姿が
   ふつうのギヨウザ群へ弾け散り、そのあと誕生演出と同じ台詞スタイルで
   メッセージを出してから復帰する（ユーザー要望） */
/* 誕生演出（_updateBossOmen step5: バラバラのギヨウザが中心へ収束してキングになる）
   の「純粋な逆回し」（ユーザー要望: 重力落下ではなく、渦を巻きながら中心から
   外へ拡散していく、収束演出そのものの巻き戻しにしたい）。
   同じ中心・同じ半径・同じ収束係数・同じフレーム数を使い、1フレームごとの
   更新式を厳密に逆算する:
     収束(forward): pos = c + (pos-c)*(1-K)  ⇔  拡散(reverse): pos = c + (pos-c)/(1-K)
   これを110フレーム続けると、収束後に残るごく小さな半径(startR)から
   出現時の半径R(=Math.hypot(W,H)*0.6、step5と同値)までを寸分違わず逆再生する。 */
const _DEFEAT_OUTRO_K = 0.06;      // _updateBossOmen step5 の収束係数と同値
const _DEFEAT_OUTRO_FRAMES = 110;  // 同 step5 の収束フレーム数と同値

/* 画面全体フェード（汎用）: phase切り替えの継ぎ目を暗転でつなぐ演出。
   ユーザー要望: 「かえっていった……」のあと通常モードへ戻る画面をフェードアウト・
   フェードインでつなぎ、余韻を残したい。暗転が最大になった瞬間にonMidを呼んで
   実際のphase切り替え（_kingBattleEnd等の重い処理）を行い、その後フェードインする
   ことで、切り替えの瞬間を暗闇の中に隠す（どのphaseから呼んでも使える汎用実装） */
const _SCREEN_FADE_FRAMES = 35;
let _screenFade = null; // { stage:'out'|'in', timer, alpha, onMid }
function _startScreenFade(onMid, frames = _SCREEN_FADE_FRAMES) {
  if (_screenFade) return; // 多重起動防止（連打でフェードが再スタートしないように）
  _screenFade = { stage: 'out', timer: 0, frames, alpha: 0, onMid };
}
function _updateScreenFade() {
  const f = _screenFade;
  f.timer++;
  if (f.stage === 'out') {
    f.alpha = Math.min(1, f.timer / f.frames);
    if (f.timer >= f.frames) {
      f.onMid?.();
      f.stage = 'in'; f.timer = 0;
    }
  } else {
    f.alpha = Math.max(0, 1 - f.timer / f.frames);
    if (f.timer >= f.frames) _screenFade = null;
  }
}
function _drawScreenFade() {
  if (!_screenFade || _screenFade.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = _screenFade.alpha;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function _startBossDefeatOutro() {
  const cx = W / 2, cy = H / 2 - (IS_PORTRAIT ? 60 : 0); // step5の収束先と同値
  const R = Math.hypot(W, H) * 0.6; // step5の出現半径と同式
  const startR = R * Math.pow(1 - _DEFEAT_OUTRO_K, _DEFEAT_OUTRO_FRAMES); // 収束後に残る半径
  const items = [];
  for (let i = 0; i < 44; i++) {
    const ang = (i / 44) * Math.PI * 2 + Math.random() * 0.2; // step5と同じ角度配分
    items.push(makeItem(cx + Math.cos(ang) * startR, cy + Math.sin(ang) * startR, 0, 0));
  }
  _defeatOutro = { step: 0, timer: 0, items, cx, cy };
  _king = null; _kingLasers = []; _kingCharFlights = []; // 弾けた瞬間に本体は消える
  phase = 'bossDefeatOutro';
  playSE('boss_flash');
}

function _updateBossDefeatOutro() {
  const o = _defeatOutro;
  if (!o) { phase = 'idle'; return; }
  o.timer++;
  /* step5の収束式 pos=c+(pos-c)*(1-K) を厳密に逆算した拡散式（重力は使わない） */
  const inv = 1 / (1 - _DEFEAT_OUTRO_K);
  for (const g of o.items) {
    g.x = o.cx + (g.x - o.cx) * inv;
    g.y = o.cy + (g.y - o.cy) * inv;
    g.rot -= 0.15; // step5の回転(+0.15)を逆再生
  }
  if (o.step === 0) {
    if (o.timer > _DEFEAT_OUTRO_FRAMES) { o.step = 1; o.timer = 0; }
  } else if (o.step < _DEFEAT_OUTRO_LINES.length) {
    if (o.timer > _OMEN_LINE_FRAMES) { o.step++; o.timer = 0; }
  } else if (o.timer > _OMEN_LINE_FRAMES) {
    /* 最終行まで表示しきったら、タップ待ちにせず時間経過で自動的に通常モードへ
       戻る（ユーザー要望: CONTINUE待ちは不要、時間で進んで良い）。
       _startScreenFadeは多重起動防止済みなので、フェード開始後も毎フレーム
       この条件を満たし続けて構わない */
    _startScreenFade(() => _kingBattleEnd());
  }
}

function drawBossOmen() {
  if (phase !== 'bossOmen' || !_omen) return;
  const o = _omen;
  ctx.save();
  /* 暗幕 */
  const dark = (o.step === 0 ? Math.min(1, o.timer / 50) : 1) * 0.88;
  ctx.fillStyle = `rgba(2,4,8,${dark})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 台詞（過去行は薄く残して積む） */
  if (o.step >= 1 && o.step <= 4) {
    const fsL = IS_PORTRAIT ? 22 : 26;
    const lineY0 = H * 0.30, lineDy = fsL * 2.2;
    ctx.font = `bold ${fsL}px 'Hiragino Mincho ProN',serif`;
    for (let i = 0; i < o.step && i < _OMEN_LINES.length; i++) {
      const isCur = (i === o.step - 1);
      ctx.globalAlpha = isCur ? Math.min(1, o.timer / 20) : 0.5;
      const col = i === 3 ? '#ff6655' : '#e8e2d0';
      outText(_OMEN_LINES[i], W/2, lineY0 + i*lineDy, col, 'rgba(0,0,0,0.9)', 6);
    }
    ctx.globalAlpha = 1;
  }
  /* 収束する霊ギヨウザ */
  if (o.step === 5) for (const g of o.items) drawOneItem(g);
  /* 誕生〜鎮座 */
  if (o.step >= 6 && _bossOC) {
    const bx = W/2, by = H/2 - (IS_PORTRAIT ? 60 : 0);
    const appear = o.step === 6 ? Math.min(1, o.timer / 25) : 1;
    const breath = 1 + 0.02 * Math.sin(performance.now() / 300);
    const k = appear * breath;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(k, k);
    ctx.drawImage(_bossOC.oc, -_bossOC.half, -_bossOC.half, _bossOC.half*2, _bossOC.half*2);
    ctx.restore();
    ctx.font = `bold ${IS_PORTRAIT ? 28 : 40}px 'Hiragino Mincho ProN',serif`;
    outText('キングギヨウザ たんじょう！！', W/2, by - _BOSS_S*0.62,
      '#ffdd55', 'rgba(60,0,0,0.9)', 8);
    if (o.step === 7) _drawBottomPillBadge('CONTINUE');
  }
  /* 雷鳴フラッシュ */
  if (o.flash > 0) {
    ctx.globalAlpha = Math.min(1, o.flash);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ════════════════ キングギヨウザ 戦闘（M2） ════════════════
   操作はタイミングのみ（自動照準）。的（文字）1本ずつのタップ精度で
   こんがり%が直接決まる（JUST=+1.0%・GOOD=+0.5%・OK以下=+0%、4本平均ではなく
   個別判定）。「こ・ん・が・り」全一致（当たり）確定時のみ、その4タップぶんの
   焦げ跡候補が正式に登録される。cookPctが100%でこんがり100%＝勝利。
   個々の焼き目は命中直後は局所的な焦げ跡として見え、実時間で少しずつ薄くなりながら
   消える。その代わりに全身の色トーンが焦げ色方向へ寄っていき（pct=cookPct/100
   に連動、ゲージ%と常に同期）、100%到達と同時に全身が焦茶色になる。
   焼き目を liveOC へ永続焼き込みしていた旧実装（source-atop 1回焼き込み）から、
   「焦げ跡フェード＋全身トーン」を毎フレーム _renderKingBody() で合成する方式に変更
   （フェード中の焦げ跡がある間のみ再合成。フェード完了後は再合成をスキップして
   前回の合成結果を使い回す＝焦げ跡が無い期間の毎フレームコストはゼロ）。
   ボスからの攻撃・被弾・敗北は M3 で実装する。 */
const KING_MARK_FADE_SEC = 2.2;   // 個々の焦げ跡が薄くなって消えるまでの実時間（wall-clock）
/* こんがり%はタップごとの精度で直接積算する方式（ユーザー承認済み）:
   JUST=+1.0%・GOOD=+0.5%・OK以下=0%（焦げ跡も作らない）。的は4本1組だが、
   スコアは4本の平均ではなく1本ずつ個別に判定する。焦げ跡は「当たり
   （こ・ん・が・り全一致）」が確定して初めて正式に生成・カウントする
   （不一致なら個々のタップがJUST/GOODでも焦げは残らない） */
const KING_GOOD_PCT = 0.5;
const KING_JUST_PCT = 1.0;
/* こんがり攻撃失敗（4文字不一致）のペナルティとルーレット破壊演出（ユーザー要望）:
   失敗のたびにこんがり%を少し後退させ、ルーレットにひびを1本ずつ増やす。
   KING_MAX_FAILS回失敗するとルーレット完全破壊＝敗北（_startBossDefeat） */
const KING_MISS_PCT_PENALTY = 1.0;
const KING_MAX_FAILS = 6;
/* KING_CHAR_JUST_FONT_SCALE: マークされる文字（グリフ）自体の大きさをJUSTで
   拡大する倍率（面積4倍=辺2倍、GOOD基準）。焦げ跡（スコーチブロット）の
   面積とは別物（ユーザー指摘: 焦げのサイズを勝手に変えるな、文字の大きさを
   変えてほしいと言っている、の2点は別々の要素）。焦げ跡側のサイズは常に
   一定（_createKingMark参照） */
const KING_CHAR_JUST_FONT_SCALE = 2;
/* KING_MARK_RESIDUAL_ALPHA: フェード完了後も消え切らず、ごくごく薄く永続的に
   残る焦げ跡の下限アルファ比率（1=フェード開始直後と同じ濃さ）。
   以前は個々の焦げ跡とは無関係な固定7個の「焼き目模様」を別途重ねていたが、
   文字が飛んでいった先（＝実際の焦げ跡）と模様の位置が一致しないという
   実機指摘で廃止し、焦げ跡自身が薄れながら痕を残す方式に統一した */
const KING_MARK_RESIDUAL_ALPHA = 0.14;
const KING_TONE_COLOR = '#8a5225'; // こんがり100%到達時の全身色（トースト状の狐色。焦茶すぎない絶妙な焼き加減）
const KING_TONE_MAX_ALPHA = 0.55;  // 全身トーンの最大重ね掛け強度（下地の陰影を多めに残し、平板な塗り潰しに見せない）
/* KING_RESULT_MIN_WAIT: 4本確定後、結果表示を最小何フレーム保持するか。
   通常モードの的判定（phase==='done'のminWait、2582行目付近）と同じ考え方:
   ハズレは短く、当たりは少し長く。実際の解放はここに onBeatGrid() の
   BGM拍グリッド同期を重ねる（_updateBossBattle）ため、体感の待ち時間は
   通常モードの「ハズレ次弾」と揃う */
const KING_RESULT_MIN_WAIT = { miss: 2, hit: 24 };
/* ボス本体楕円（_drawGyozaBody: 中心=+0.08s、縦半径=0.48s）から見た目の頭頂・裾を
   割り出した比率（中心からの距離、s基準）。_initBossBattleのレイアウト計算と
   drawBossVictoryの勝利文言の位置決めの両方で使う共通値のためモジュール定数にする。 */
const KING_VISUAL_TOP_RATIO = 0.40, KING_VISUAL_BOTTOM_RATIO = 0.56;
/* KING_XFORM_EASE: 誕生演出の鎮座位置→戦闘位置、戦闘位置→勝利拡大、それぞれの
   ジャンプをなくすための指数収束レート（1フレームあたりの残差縮小率）。
   アニメーション進行に紐づく演出のためフレームカウンタ基準（wall-clockにしない）。 */
const KING_XFORM_EASE = 0.12;
/* 決定文字の飛翔演出（矢を射る／リールを確定させる操作とは独立のバックグラウンド
   演出。通常モードの missPopups/payoutPopups と同じ「配列に積んで毎フレーム
   自走・自然消滅」方式）。的が確定するたび(1本ロックごと)にキャラを1体スポーンし、
   ボス付近まで飛ばして待機、4本目の判定が出た時点で未解決分すべてに結果
   （こんがり=吸い込まれて消える／ハズレ=跳ね返って落ちる）を伝える。
   着地先は結果が判明する前（1〜3本目）から、そのタップ自体の精度（JUST/GOOD）で
   位置・サイズを確定した焦げ跡候補（_createKingMark）を最初から使う（OK以下は
   焦げ跡候補なし＝ボス中心へ向かうだけ）。4本目で「こ・ん・が・り」全一致が
   確定した時点で、各文字の焦げ跡候補を正式に _king.marks へ登録して%を加算する。
   不一致（ハズレ）ならどのタップも登録されず、そのまま跳ね返るだけ */
const KING_CHAR_FLY_FRAMES = 16;        // 飛行（接近）にかかるフレーム数
const KING_CHAR_STICK_FADE_FRAMES = 10; // こんがり: 命中後に消えるまで
/* ハズレは弾け飛んで画面外に出るまでフェードせず表示し続ける（ユーザー指摘:
   途中でフェードアウトするのは違う、画面外に消えるまで見えていてほしい）。
   MAX_FRAMESは万一画面外に出ない角度になった場合の保険上限（通常は発火しない） */
const KING_CHAR_BOUNCE_MAX_FRAMES = 180;
const KING_CHAR_OFFSCREEN_MARGIN = 60;
let _king = null;       // { liveOC, half, marks, cookPct, bx, by, dbx, dby, dscale, tx, ty }
let _kingLasers = [];   // { x1,y1,x2,y2, life, maxLife, color, glow, hit }
let _kingCharFlights = []; // { char, sx,sy, tx,ty, state, frames, resolve, bx,by,bvx,bvy }
let _bossVictoryTimer = 0;
let _bossDefeatTimer = 0;
let _scorchBlotSprite = null;

/* 焼き目スタンプの元絵を初回に1回だけ生成（不定形の焦げ跡×3層） */
function _buildScorchBlotSprite() {
  if (_scorchBlotSprite || typeof OffscreenCanvas === 'undefined') return;
  const sz = 64, half = sz / 2;
  const oc = new OffscreenCanvas(sz, sz);
  const c = oc.getContext('2d');
  c.translate(half, half);
  /* 色・アルファは以前より濃く（コントラスト不足でGOOD/JUSTのサイズ差が
     ほぼ見えないという実機指摘で強化。フルサイズ書き出しで確認したところ
     位置・サイズ自体は正しかったが、地の色に対して薄すぎて肉眼でほぼ判別
     できなかったのが真因だった） */
  const layers = [
    { r: 26, a: 0.85, col: '75,42,14' },
    { r: 19, a: 0.90, col: '50,25,6'  },
    { r: 11, a: 0.85, col: '25,10,2'  },
  ];
  for (const ly of layers) {
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a  = (i / 8) * Math.PI * 2;
      const rr = ly.r * (0.75 + Math.random() * 0.5);
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.85;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
    c.fillStyle = `rgba(${ly.col},${ly.a})`;
    c.fill();
  }
  _scorchBlotSprite = oc;
}

/* 誕生直後（bossOmen step7 のタップ）に呼ばれ、実戦闘フェーズへ移行する */
function _initBossBattle() {
  /* 蓄積メーターは戦闘開始時点でリセット（ボスは蓄積そのものが実体化したもの）。
     ここでリセットしないと勝敗に関わらず次のトライ終了直後に即再発動する
     （リネーム時にリセット処理の移し忘れで実際に発生したバグ・M2検証で発覚）。
     OffscreenCanvas 非対応で即復帰する経路も含め、常にリセットする。 */
  kingGyozaMeter = 0;
  lsSaveStats();
  if (typeof OffscreenCanvas === 'undefined' || !_bossOC) { _kingBattleEnd(); return; } // 非対応環境は戦闘なしで復帰
  _buildScorchBlotSprite();
  /* 縦画面: 的（こんがりミニリール）のサイズを、左右上部のアイコン（トロフィー/
     ポーズ・ミュート/全画面）を除いた横幅いっぱいに広がるよう動的に決め直す
     （実機要望: 「小さすぎる、アイコン部を除いた横幅と同程度に」）。
     直径4個＋隙間3個（KING_REEL_GAP）で埋まる半径を逆算する。
     KING_RESULT_FONT/Hも半径に比例するため合わせて再計算する
     （このタイミングでのみ行う理由: BTN_RIGHT/BTN_SIZEがKING_WRの元の
     宣言より後で定義されるため、モジュールトップレベルでは計算できない） */
  if (IS_PORTRAIT) {
    const iconZone = BTN_RIGHT + BTN_SIZE; // 左右上部アイコンが占める帯
    const availReelW = W - iconZone * 2;
    KING_WR = (availReelW - KING_REEL_GAP * 3) / 8;
    KING_RESULT_FONT = Math.round(KING_WR * 0.55);
    KING_RESULT_H = KING_RESULT_GAP + KING_RESULT_FONT + 4;
  }
  const half = _bossOC.half, s = _BOSS_S;
  /* _bossOC.oc の物理ピクセルサイズは half*2*_dpr（_buildBossOC 参照）。
     liveOC も同じ物理サイズで確保しないと合成時に左上1/4しか転写されない
     （DPR>1 環境で実際に発生したバグ：右・下が切れて見える）。
     内容は _renderKingBody() が命中の都度・素のスプライトから再構成するため、
     ここでは領域確保のみ行う（初期状態は _renderKingBody 側で _bossOC.oc を
     そのまま返す高速経路があるため、初期描画は不要）。 */
  const liveOC = new OffscreenCanvas(half * 2 * _dpr, half * 2 * _dpr);
  /* marks は当たりが確定した焦げ跡だけを積むので、事前生成せず空で始める
     （個々の焦げ跡は _createKingMark がタップの都度その場で生成する） */
  const marks = [];
  /* 縦レイアウトを実寸から動的計算する（マジックナンバーの縦横別ハードコード禁止）。
     コインヘッダー下端〜こんがりゲージ上端の実際の空き高さにボスを収まるよう縮小し、
     ボス下端〜ゲージ上端の間にこんがりミニリール4連（旧: 砲台）の場所を確保する。
     旧実装（by=H/2固定）はボスがキャンバス縦幅をほぼ占領し、砲台がゲージパネルの
     背景（砲台より後に描画される）に埋もれて見えなくなっていた（実機報告で発覚）。 */
  /* ボス上端〜ヘッダー下端の余白: 縦画面は左右の隙間（コインヘッダーの左右マージン）と、
     横画面は外枠〜コインヘッダーの隙間（BTN_M。BTN_TOPは内枠厚み11pxを含む絶対Y座標であり
     「隙間」そのものではないため誤り。BTN_M=10が実際の枠〜コンテンツの余白）と、
     それぞれ同じ量にする（実機要望による） */
  const topGap = IS_PORTRAIT ? (W - COIN_HEADER_W) / 2 : BTN_M;
  const headerBottom = COIN_HEADER_BOTTOM_Y + topGap; // コインヘッダー下端(y座標) + 余白
  /* 横画面: panelTopをゲージ上端そのものにし、リールとの隙間はGAP_REEL_PANEL
     （topGap=BTN_M、統一マージン）1本だけにする。以前は独立した-15pxが
     GAP_REEL_PANELと二重に効いて合計25pxの隙間になっていた（実機指摘:
     「こんがり表示エリアのぎりぎりまで下げられる」「縦横一定の空間」＝
     他の余白と同じ統一マージンだけにしてほしいという要望）。
     縦画面は従来どおり-15pxを維持（今回の要望は横画面限定のため） */
  const panelTop      = IS_PORTRAIT ? P_BAR_Y - 15 : KING_GAUGE_Y; // こんがりゲージ上端 - 余白
  const REEL_D = KING_WR * 2, GAP_BOSS_REEL = 16;
  /* リール下端〜ゲージ枠上端の隙間は、ヘッダー上と対称に「太外枠とのマージン」と
     同じ量にする（topGap を再利用。実機要望による）。この隙間はリールをゲージ枠から
     固定量だけ離す下端基準の値であり、ボス側の空きに余裕があっても膨らまない
     （旧実装はboss基準の積み上げ式で、実際には約24pxまで開いてしまっていた）。 */
  const GAP_REEL_PANEL = topGap;
  /* half(=0.75s)はスタンプ・呼吸アニメ余裕を含む安全バウンディング半径であり、
     実際に見えるボスの輪郭はもっと内側。_drawGyozaBody の本体楕円
     （中心=+0.08s、縦半径=0.48s）から見た目の頭頂は中心から-0.40s、裾は+0.56sと算出できる。
     scale-fit と by の余白計算の両方をこの見た目比率（0.40+0.56=0.96s）基準にする：
     half基準（1.5s相当）のまま fit させると見た目より遥かに大きい余白込みで縮小され、
     ボスが必要以上に小さく表示される（実機報告で発覚: 縦画面で頭頂が100px以上離れる・
     横画面でボスが小さすぎる、の双方が同根）。 */
  /* KING_RESULT_H: 的の下に当たった文字を表示するための縦スペース（drawKingReel参照）。
     ここで確保しないと文字がゲージ枠に重なる */
  const availH = panelTop - headerBottom - GAP_BOSS_REEL - REEL_D - KING_RESULT_H - GAP_REEL_PANEL;
  const scale = Math.min(1, availH / (s * (KING_VISUAL_TOP_RATIO + KING_VISUAL_BOTTOM_RATIO))); // 空き高さに収まる縮小率（拡大はしない）
  const visualTopOffset = s * KING_VISUAL_TOP_RATIO * scale;
  const by = headerBottom + visualTopOffset;
  const reelY = panelTop - GAP_REEL_PANEL - KING_RESULT_H - KING_WR; // ゲージ枠から固定隙間の下端基準（結果文字の分だけ上に確保）
  const reelGapX = KING_WR * 2 + (IS_PORTRAIT ? KING_REEL_GAP : 12);
  /* charWeights: 4的ぶんの文字配分（%）。的ごとに独立管理し、狙って命中させた
     文字の比率を毎回少しずつ増やしていく（_adjustKingCharWeight）。初期値は
     4文字均等の25%（ユーザー要望） */
  const charWeights = [0, 1, 2, 3].map(() => Object.fromEntries(KING_CHARS.map(c => [c, 25])));
  const reels = [0, 1, 2, 3].map(i => _createKingReel(W / 2 + (i - 1.5) * reelGapX, reelY, charWeights[i]));
  /* dbx/dby/dscale は誕生演出（_omen step6-7）での鎮座位置・等倍スケールを初期値にし、
     ここから戦闘位置(bx,by,scale)へ毎フレーム収束させる（_easeKingXform）。
     こうしないと戦闘開始の瞬間に位置とスケールが瞬時にジャンプする（実機報告で発覚）。 */
  const omenBy = H / 2 - (IS_PORTRAIT ? 60 : 0);
  _king = {
    liveOC, half, marks, cookPct: 0, scale,
    bx: W / 2, by,
    dbx: W / 2, dby: omenBy, dscale: 1,
    tx: W / 2, ty: reelY,
    reels, reelIdx: 0, resultTimer: null, resultMatched: false, charWeights,
    failCount: 0,
  };
  _kingLasers = [];
  _kingCharFlights = [];
  phase = 'boss';
  startBGMTape(1200); // 世界が動き出す（予告のテープストップから復帰）
}

/* ボス本体の描画元キャンバスを返す（素のスプライト＋全身トーン＋フェード中の焦げ跡）。
   全身トーンの強さは cookPct（タップ精度で直接積算、0〜100）と厳密に連動させる
   （フェード完了を待たず、ゲージが100%になった瞬間に全身も焦茶色100%になっている
   必要があるため）。
   個々の焦げ跡は revealedAt からの経過時間（wall-clock）でアルファを減衰させ、
   フェード仕切りの局所的な焦げ跡だけを別途上描きする。
   フェード中の焦げ跡が1つも無ければ再合成をスキップし、素のスプライト（pct=0）または
   前回合成済みの liveOC（pct>0 かつ全焦げ跡が消え切った定常状態）をそのまま返す。 */
function _renderKingBody() {
  const pct = _king.cookPct / 100;
  const now = performance.now();
  /* 焦げ跡は「フェード中」(t<1、毎フレーム再合成が必要)と「フェード完了後も
     ごくごく薄く残る永続痕」(t>=1、KING_MARK_RESIDUAL_ALPHA固定)の2状態。
     以前は個々の焦げ跡とは無関係な固定7個の「焼き目模様」を別レイヤーで
     重ねていたが、文字が飛んでいった先（＝実際の焦げ跡）と模様の位置が
     一致しないという実機指摘で廃止し、焦げ跡自身が薄れながら痕を残す
     方式に統一した（永続痕＝settledがそのまま「焼き目模様」を兼ねる） */
  let activeCount = 0, settledCount = 0;
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000);
    if (t < 1) activeCount++; else settledCount++;
  }
  if (pct <= 0 && activeCount === 0 && settledCount === 0) return _bossOC.oc; // 未被弾: 素のスプライトをそのまま使う
  /* 再合成スキップの条件は pct 一致だけでは不十分: 前回まだフェード中の焦げ跡が
     残っていた（_toneHadActive）場合、今回activeCountが0になっていても「焦げ跡を
     残痕アルファまで落とし切る」1回の再合成をしないと古い焦げ跡が残ったままキャッシュ
     されてしまう（実機検証で発覚: フェード完了直後の1フレームが欠落しボスが直前
     フレームのまま固まる不具合）。settledCountの増加も同様に再合成トリガーにする
     （新たに永続痕入りした焦げ跡を反映するため）。 */
  if (activeCount === 0 && _king._toneRenderedPct === pct && !_king._toneHadActive &&
      _king._settledCount === settledCount) return _king.liveOC;
  const lc = _king.liveOC.getContext('2d');
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.clearRect(0, 0, _king.liveOC.width, _king.liveOC.height);
  /* globalCompositeOperation/globalAlpha は setTransform/clearRect では戻らず
     前回呼び出し（source-atop・低アルファで終わっている）の状態を引き継いでしまう。
     source-atop のままだと直後の clearRect 直後（アルファ0）への drawImage が
     「既存アルファ内にのみ合成」の制約で何も描かれない（実機検証で発覚:
     フェード完了直後にボスが透明になる不具合の真因）。明示的にリセットする。 */
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  lc.drawImage(_bossOC.bodyOC, 0, 0); // 顔なし本体レイヤーから再構成（永続焼き込みではない）
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-atop'; // ボス本体のアルファ内にのみ合成
  if (pct > 0) {
    lc.globalAlpha = pct * KING_TONE_MAX_ALPHA;
    lc.fillStyle = KING_TONE_COLOR;
    lc.fillRect(-_king.half, -_king.half, _king.half * 2, _king.half * 2);
  }
  /* 焦げ跡本体: revealedAtがある全マーク（フェード中＋永続痕）を毎回描く。
     alphaはt=0で1.0→t=1でKING_MARK_RESIDUAL_ALPHAへ線形補間し、以降そこで
     下げ止まる（消え切らずごくごく薄く残る） */
  for (const m of _king.marks) {
    if (m.revealedAt == null) continue;
    const t = Math.min(1, (now - m.revealedAt) / (KING_MARK_FADE_SEC * 1000));
    const alpha = 1 - (1 - KING_MARK_RESIDUAL_ALPHA) * t;
    lc.save();
    lc.translate(m.lx, m.ly);
    lc.rotate(m.rot);
    const sc = m.r / 26; // スプライト基準半径26に対する倍率
    lc.globalAlpha = alpha; // 0.9掛けは廃止（濃さ不足でサイズ差が見えないという指摘への対応の一環）
    lc.drawImage(_scorchBlotSprite, -26 * sc, -26 * sc, 52 * sc, 52 * sc);
    lc.restore();
  }
  /* 顔（目鼻口眉）はトーン・焦げ跡の影響を受けない常に元の色で最後に上描きする
     （白目の白さと焦げ色とのコントラストを保つユーザー要望）。pctに応じて表情が
     変化する（_drawKingFace参照）ため、静的faceOCのコピーではなく毎回ベクタ描画する。
     論理座標系（scale+translate）に戻してから描く必要がある */
  lc.setTransform(1, 0, 0, 1, 0, 0);
  lc.scale(_dpr, _dpr);
  lc.translate(_king.half, _king.half);
  lc.globalCompositeOperation = 'source-over';
  lc.globalAlpha = 1;
  _drawKingFace(lc, _BOSS_S, pct);
  _king._toneRenderedPct = pct;
  _king._toneHadActive = activeCount > 0;
  _king._settledCount = settledCount;
  return _king.liveOC;
}

/* 的の下に出た結果文字を1体スポーンし、ボス付近まで飛ばす。的が1本ロックされる
   たびに呼ぶ（1〜3本目はまだこんがり成立/不成立が分からないため、着弾後は
   'wait' 状態でボス付近に留まる。4本目のロックで結果が判明したら resolve を
   全未解決分にまとめて設定＝_kingReelShoot 側）。
   着地先（markRef）はこの時点で確定させる。タップ自体の精度（score）で
   JUST/GOODが決まった瞬間に、位置とサイズ込みの焦げ跡候補を _createKingMark
   で生成して持たせる（OK以下は候補なし＝null、ボス中心へ向かうだけ）。
   まだ _king.marks には登録しない（当たり確定＝「こ・ん・が・り」全一致まで
   正式な焦げ跡にはしない。_kingReelShoot 参照）。結果が判明する前から確定
   位置を使うことで、結果確定時に位置を作り直す必要が一切なくなる（実機指摘:
   待機中は中心寄りの仮位置にして結果確定時に本来の位置へ動かす実装を
   していたが、そもそも最初から本来の位置に配置してほしいという要望だった） */
function _spawnKingCharFlight(w) {
  const tier = w.syncScore >= 0.667 ? 'just' : w.syncScore >= 0.333 ? 'good' : null;
  _kingCharFlights.push({
    char: w.result, score: w.syncScore, // 文字色を通常モードと同じ赤〜黄〜緑にするため保持（drawKingCharFlights参照）
    sx: w.x, sy: w.y + KING_WR + 3 + KING_RESULT_GAP + KING_RESULT_FONT/2,
    tier, markRef: tier ? _createKingMark() : null,
    state: 'fly', frames: 0, resolve: null,
  });
}

/* 焦げ跡候補を1個生成する（位置はボス胴体内に一様分布）。サイズはtierに
   依存しない一定範囲（ユーザー指摘: 焦げの面積とマークされる文字の大きさは
   別物。文字側のサイズ差はKING_CHAR_JUST_FONT_SCALE・drawKingCharFlights参照）。
   当たりが確定するまでは _king.marks に登録しない「候補」のまま
   （_spawnKingCharFlight参照） */
function _createKingMark() {
  const ang = Math.random() * Math.PI * 2;
  const rad = Math.sqrt(Math.random()); // 円盤上に一様分布
  return {
    lx:  Math.cos(ang) * _BOSS_S * 0.52 * rad,
    ly:  _BOSS_S * 0.08 + Math.sin(ang) * _BOSS_S * 0.42 * rad,
    r:   _BOSS_S * 0.085 + Math.random() * _BOSS_S * 0.045,
    rot: Math.random() * Math.PI * 2,
    revealedAt: null,
  };
}

/* 文字の着地先（＝焦げ跡markRefの実位置。markRefが無い＝OK以下のタップは
   焦げを残さずボス中心へ向かうだけ）を「今の」ボス表示位置（dbx/dby、呼吸
   アニメ込みのbreath）を基準に毎回ライブ計算する。_renderKingBody内の
   焦げ跡描画と同じ座標変換。凍結せず毎フレーム計算し直すことで、ボスがまだ
   誕生演出から戦闘位置へ収束中でも常に実際の描画位置に追従する */
function _kingFlightTargetPos(f) {
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  if (f.markRef) return { x: _king.dbx + f.markRef.lx * breath, y: _king.dby + f.markRef.ly * breath };
  return { x: _king.dbx, y: _king.dby };
}

/* 文字の「今」の描画位置を状態に応じて算出する（draw側から呼ぶ） */
function _kingCurrentFlightPos(f) {
  const target = _kingFlightTargetPos(f);
  if (f.state === 'fly') {
    const e = 1 - (1 - Math.min(1, f.frames / KING_CHAR_FLY_FRAMES)) ** 2; // ease-out
    return { x: f.sx + (target.x - f.sx) * e, y: f.sy + (target.y - f.sy) * e - Math.sin(e * Math.PI) * 18 };
  }
  if (f.state === 'wait') return { x: target.x, y: target.y + Math.sin(f.frames * 0.12) * 2 };
  if (f.state === 'stick') return target;
  return { x: f.bx, y: f.by }; // bounce
}

/* こんがりリールへのタップ入力。1本ずつ hitResult() で位置判定して確定する
   （通常ゲームの onShoot と同じ「タップ時点の回転角で止める」操作感）。
   4本目が確定した時点で判定: こ・ん・が・り全一致なら _kingApplyHit で自動発射、
   不一致なら何も起きない。いずれの場合も4本の結果文字を表示したまま静止させ、
   その後に再スピンする（_updateBossBattle が resultTimer を監視。解放条件は
   通常モードの的判定＝KING_RESULT_MIN_WAIT + onBeatGrid() と同じ仕様）。
   確定した4文字が読めないまま次に進んでしまうという実機指摘で追加
   （ミス時のペナルティは現状なし。将来M3でここに追加する）。
   決定した文字はここで即バックグラウンドの飛翔演出（_spawnKingCharFlight）に渡す。
   演出自体は _updateKingCharFlights が矢を射る操作（リールのロック）とは無関係に
   毎フレーム自走するため、プレイヤーは飛翔の完了を待たず次の的を狙える */
function _kingReelShoot(inputPerfMs) {
  if (phase !== 'boss' || !_king || _king.reelIdx >= 4) return;
  const w = _king.reels[_king.reelIdx];
  w.result = hitResult(w, -Math.PI/2); // 的の三角ポインタは常に真上（drawKingReel参照）
  w.locked = true;
  w.syncScore = (audioCtx && bgmPhaseRef !== null) ? calcSyncScore(inputPerfMs) : 0.5;
  playSE('lock');
  _adjustKingCharWeight(_king.reelIdx, w.result); // この的で命中した文字の比率を少し上げる（次回respinから反映）
  _spawnKingCharFlight(w);
  _king.reelIdx++;
  if (_king.reelIdx >= 4) {
    const matched = _king.reels.every((r, i) => r.result === KING_TARGET[i]);
    if (matched) {
      const avgScore = _king.reels.reduce((a, r) => a + r.syncScore, 0) / 4;
      /* こんがり%はタップごとの精度で直接積算する（JUST=+1.0%・GOOD=+0.5%・
         OK以下=0%）。今回の4タップぶんの候補焦げ跡（スポーン時に
         _createKingMarkで生成済み、_spawnKingCharFlight参照）を、当たりが
         確定したこの時点で初めて _king.marks へ正式登録する（不一致なら
         登録されず消える＝「文字が飛んでいっていない場所に焦げが発生する」
         を避けるための設計を踏襲）。スコア平均（avgScore）はレーザー色・SE・
         JUST/GOOD/OKラベル表示のみに使う（_kingApplyHit参照。%やサイズには
         使わない＝1本ずつ個別判定という要望のため） */
      const thisAttempt = _kingCharFlights.filter(f => f.resolve === null);
      for (const f of thisAttempt) {
        if (!f.markRef) continue; // OK以下のタップは焦げ跡なし
        _king.marks.push(f.markRef);
        _king.cookPct = Math.min(100, _king.cookPct + (f.tier === 'just' ? KING_JUST_PCT : KING_GOOD_PCT));
      }
      _kingApplyHit(avgScore);
      if (_king.cookPct >= 100) _startBossVictory();
    } else {
      /* 失敗（こ・ん・が・り不一致）: こんがり%を少し後退させ、ルーレットへ
         ひびを1本増やす（ユーザー要望）。KING_MAX_FAILS回でルーレット完全破壊＝敗北。
         playSE('miss')は_kingApplyHit内の外れ演出と同じSEを流用（既存の「外れ」の
         聞こえ方と統一するため新規SEは追加しない） */
      _king.cookPct = Math.max(0, _king.cookPct - KING_MISS_PCT_PENALTY);
      _king.failCount = Math.min(KING_MAX_FAILS, _king.failCount + 1);
      playSE('miss');
      if (_king.failCount >= KING_MAX_FAILS) _startBossDefeat();
    }
    _king.resultMatched = matched;
    _king.resultTimer = 0; // 結果表示保持タイマー開始（_updateBossBattle参照）
    /* 今回の試技で飛ばした（が未解決の）4体すべてに結果を伝える。着地先は
       スポーン時から確定済みのためここでの位置変更は不要
       （こんがり=そのまま吸い込まれる／ハズレ=そこから跳ね返る） */
    const resolveAs = matched ? 'stick' : 'bounce';
    for (const f of _kingCharFlights) if (f.resolve === null) f.resolve = resolveAs;
  }
}

/* 4本とも即座に再スピン（ヒット・ミス問わず毎回呼ばれる） */
function _respinKingReels() {
  for (let i = 0; i < 4; i++) {
    const { x, y } = _king.reels[i];
    _king.reels[i] = _createKingReel(x, y, _king.charWeights[i]); // 的ごとの現在の配分を引き継ぐ
  }
  _king.reelIdx = 0;
}

/* 的posIdxで文字charが命中した際、その的（他の3的とは独立）の配分を少し
   偏らせる。命中文字をKING_WEIGHT_STEPぶん増やし（上限KING_WEIGHT_MAX）、
   増えた分は他の3文字から比例配分で差し引く（下限KING_WEIGHT_MINを維持。
   下限に達した文字が出た場合は残りをさらに他へ再配分するwhileループ）。
   毎タップ（結果の当たり外れに関わらず）呼ぶ＝「その的で狙って当てた文字」
   だけが基準（ユーザー要望） */
function _adjustKingCharWeight(posIdx, char) {
  const w = _king.charWeights[posIdx];
  const target = Math.min(KING_WEIGHT_MAX, w[char] + KING_WEIGHT_STEP);
  let gain = target - w[char];
  w[char] = target;
  if (gain <= 0) return;
  const others = KING_CHARS.filter(c => c !== char);
  while (gain > 1e-9) {
    const reducible = others.filter(c => w[c] > KING_WEIGHT_MIN + 1e-9);
    if (reducible.length === 0) break; // 他3文字すべて下限＝これ以上削れない
    const pool = reducible.reduce((a, c) => a + (w[c] - KING_WEIGHT_MIN), 0);
    const take = Math.min(gain, pool);
    for (const c of reducible) w[c] -= take * (w[c] - KING_WEIGHT_MIN) / pool;
    gain -= take;
  }
}

/* こんがり一致成立時の焼き攻撃演出（レーザー・SE・JUST/GOOD/OKラベル）。
   こんがり%・焦げ跡サイズはタップ個別の精度で決まる（_spawnKingCharFlight・
   _kingReelShoot参照）。ここでのscore（4タップ平均）は見た目のフィードバック
   （レーザー色・SE・ラベル）にのみ使う */
function _kingApplyHit(score) {
  let label = '';
  if      (score >= 0.667) label = 'JUST!';
  else if (score >= 0.333) label = 'GOOD';
  else if (score > 0)      label = 'OK';
  const [col, glow] = _syncBarColor(score);
  _kingLasers.push({ x1: _king.tx, y1: _king.ty, x2: _king.bx, y2: _king.by,
    life: 14, maxLife: 14, color: col, glow, hit: score > 0 });
  playSE(score > 0 ? 'lock' : 'miss');
  if (label) { syncJustLabel = label; syncJustTimer = 50; syncJustScore = score; }
}

/* 誕生演出の鎮座位置→戦闘位置、戦闘位置→勝利拡大、それぞれのジャンプをなくすための
   表示トランスフォーム収束。bx/by/scaleは各フェーズが確定させる「目標値」、
   dbx/dby/dscaleは毎フレーム目標へ指数収束する「現在の表示値」。 */
function _easeKingXform() {
  _king.dbx += (_king.bx - _king.dbx) * KING_XFORM_EASE;
  _king.dby += (_king.by - _king.dby) * KING_XFORM_EASE;
  _king.dscale += (_king.scale - _king.dscale) * KING_XFORM_EASE;
}

/* ハズレ確定の文字を、着地点から跳ね返り軌道へ切り替える（重力落下、水平方向は
   減速させない＝画面外まで確実に弾け飛ばすため。速度もstickの吸い込みより
   勢いをつけている） */
function _startKingCharBounce(f) {
  f.state = 'bounce'; f.frames = 0;
  const pos = _kingFlightTargetPos(f);
  f.bx = pos.x; f.by = pos.y;
  const ang = Math.atan2(f.sy - pos.y, f.sx - pos.x) + (Math.random() - 0.5) * 0.7;
  const spd = 6 + Math.random() * 3;
  f.bvx = Math.cos(ang) * spd; f.bvy = Math.sin(ang) * spd - 3;
}

/* 跳ね返り中の文字が画面外まで出たか（余白付き）。出ていれば表示終了してよい */
function _isKingCharOffscreen(f) {
  return f.bx < -KING_CHAR_OFFSCREEN_MARGIN || f.bx > W + KING_CHAR_OFFSCREEN_MARGIN ||
         f.by < -KING_CHAR_OFFSCREEN_MARGIN || f.by > H + KING_CHAR_OFFSCREEN_MARGIN;
}

/* こんがり確定の文字がボスへ実際に到達した瞬間。ここで初めて対応する焦げ跡の
   revealedAt を打つ（_king.marks の該当要素、_kingReelShoot で markRef として
   紐付け済み）＝焦げのフェード表示が文字の到着と同時に始まる。予約だけされて
   revealedAt 未設定の焦げ跡は _renderKingBody 側では「まだ見えない」ため、
   これより前のフレームで焦げが先に見えてしまうことはない */
function _stickKingChar(f) {
  f.state = 'stick'; f.frames = 0;
  if (f.markRef && f.markRef.revealedAt == null) f.markRef.revealedAt = performance.now();
}

/* 決定文字の飛翔演出を1フレーム進める。的のロック（_kingReelShoot）や
   resultTimer による再スピン待ちとは無関係に毎回呼ぶ＝背景処理として自走する。
   着地先（markRef）はスポーン時から確定済みで結果確定時に変わらないため、
   resolveが判明したらそのまま stick/bounce へ進めればよい（位置の作り直しは
   不要） */
function _updateKingCharFlights() {
  for (const f of _kingCharFlights) {
    if (f.state === 'fly') {
      f.frames++;
      if (f.frames >= KING_CHAR_FLY_FRAMES) {
        if (f.resolve === 'bounce') _startKingCharBounce(f);
        else if (f.resolve === 'stick') _stickKingChar(f);
        else { f.state = 'wait'; f.frames = 0; } // 結果未確定: 着地先で待機
      }
    } else if (f.state === 'wait') {
      f.frames++;
      if (f.resolve === 'bounce') _startKingCharBounce(f);
      else if (f.resolve === 'stick') _stickKingChar(f);
    } else if (f.state === 'stick') {
      f.frames++;
    } else if (f.state === 'bounce') {
      f.frames++;
      f.bx += f.bvx; f.by += f.bvy; f.bvy += 0.2;
    }
  }
  swapRemove(_kingCharFlights, f => {
    if (f.state === 'stick')  return f.frames < KING_CHAR_STICK_FADE_FRAMES;
    if (f.state === 'bounce') return !_isKingCharOffscreen(f) && f.frames < KING_CHAR_BOUNCE_MAX_FRAMES;
    return true; // fly/wait は常に残す
  });
}

function _updateBossBattle() {
  for (const w of _king.reels) if (!w.locked) w.rot += w.speed;
  _easeKingXform();
  _updateKingCharFlights();
  /* 4本確定後の結果表示保持: 通常モードの的判定（endTimer + onBeatGrid()、2582行目
     付近）と同じ仕様に合わせる。ハズレ待ち時間が長くBGMとも同期していないという
     実機指摘で、wall-clockの固定待ち時間（旧KING_RESULT_HOLD_SEC）から、
     フレームカウンタ+BGM拍グリッド同期の解放条件に変更した。演奏・演出の進行に
     紐づくゲートなのでフレームカウンタが正しい（CLAUDE.md参照） */
  if (_king.resultTimer !== null) {
    _king.resultTimer++;
    const minWait = _king.resultMatched ? KING_RESULT_MIN_WAIT.hit : KING_RESULT_MIN_WAIT.miss;
    if (_king.resultTimer > minWait && onBeatGrid()) {
      _king.resultTimer = null;
      _respinKingReels();
    }
  }
  for (const l of _kingLasers) l.life--;
  swapRemove(_kingLasers, p => p.life > 0);
}

/* 決定文字の飛翔演出の描画。fly=弧を描いて接近、wait=着地して微妙に揺れながら
   待機、stick=こんがり成立で吸い込まれるようにフェード、bounce=ハズレで跳ね返って
   落下（画面外に出るまでフェードしない。ユーザー指摘: 途中で消えるのではなく
   画面外に弾け飛ぶまで見えていてほしい）。位置計算は _kingCurrentFlightPos に集約。
   文字色はそのタップのスコア（f.score）で通常モードのSYNCメーターと同じ
   赤〜黄〜緑（_syncBarColor）を使う（ユーザー指摘: OK/GOOD/JUSTの評価に
   合わせて色を変えたい・通常ゲーム時と同じ仕様にしたい）。
   文字自体の大きさもJUSTでKING_CHAR_JUST_FONT_SCALE倍にする（ユーザー指摘:
   マークされる文字の大きさと焦げ跡の面積は別物。焦げ跡側は常に一定サイズ）。
   フォントサイズが1文字ごとに変わるため ctx.font はループ内で設定する */
function drawKingCharFlights() {
  if (_kingCharFlights.length === 0) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.88)';
  for (const f of _kingCharFlights) {
    const { x, y } = _kingCurrentFlightPos(f);
    const alpha = f.state === 'stick' ? 1 - f.frames / KING_CHAR_STICK_FADE_FRAMES : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = _syncBarColor(f.score)[0];
    const fontSize = f.tier === 'just' ? KING_RESULT_FONT * KING_CHAR_JUST_FONT_SCALE : KING_RESULT_FONT;
    ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
    ctx.strokeText(f.char, x, y);
    ctx.fillText(f.char, x, y);
  }
  ctx.restore();
}

function drawBossBattle() {
  if (phase !== 'boss' || !_king) return;
  /* レーザー（層状ストローク・shadowBlur不使用の描画規約に準拠） */
  for (const l of _kingLasers) {
    const a = l.life / l.maxLife;
    ctx.save();
    ctx.globalAlpha = a * 0.5;
    ctx.strokeStyle = l.glow; ctx.lineWidth = l.hit ? 10 : 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.strokeStyle = l.color; ctx.lineWidth = l.hit ? 4 : 2;
    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    ctx.restore();
  }
  /* ボス本体（焼き目蓄積済みライブOC・呼吸アニメ・戦闘用レイアウト縮小率を適用）。
     位置・スケールは dbx/dby/dscale（誕生演出からの収束中の表示値）を使う */
  const breath = _king.dscale * (1 + 0.02 * Math.sin(performance.now() / 300));
  ctx.save();
  ctx.translate(_king.dbx, _king.dby); ctx.scale(breath, breath);
  const bodySrc = _renderKingBody();
  ctx.drawImage(bodySrc, -_king.half, -_king.half, _king.half * 2, _king.half * 2);
  ctx.restore();
  /* 決定文字の飛翔（ボス本体の上に描く＝飛んで/跳ね返って見える） */
  drawKingCharFlights();
  /* こんがりミニリール4連（旧: 砲台） */
  for (let i = 0; i < 4; i++) drawKingReel(_king.reels[i], i === _king.reelIdx);
  drawKingCookGauge();
}

/* こんがりゲージ: BETバーと同じ位置・寸法（戦闘中はBETバーを非表示にして差し替える） */
function drawKingCookGauge() {
  if (!_king) return;
  const pct = _king.cookPct / 100;
  const mx = IS_PORTRAIT ? 12 : 335, mw = IS_PORTRAIT ? W - 24 : 390;
  const my = IS_PORTRAIT ? P_BAR_Y : KING_GAUGE_Y, mh = IS_PORTRAIT ? P_BAR_H : KING_GAUGE_H;
  ctx.save();
  roundRect(mx, my, mw, mh, 10);
  ctx.fillStyle = 'rgba(40,20,5,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,140,40,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  const bh = 14, by = my + mh - bh - 10, bx = mx + 14, bw = mw - 28;
  roundRect(bx, by, bw, bh, 7);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  if (pct > 0) {
    roundRect(bx, by, bw * pct, bh, 7);
    ctx.fillStyle = pct >= 1 ? '#ffdd55' : '#c87830';
    ctx.fill();
  }
  ctx.font = `bold ${IS_PORTRAIT ? 16 : 18}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = Y;
  /* 四捨五入(Math.round)だと99.5%が「100%」と表示されるのに勝利条件
     （_king.cookPct>=100、_kingReelShoot参照）は満たさず、表示100%なのに
     クリアにならず追加で1本必要になる不整合が起きる（実機指摘）。切り捨て
     （Math.floor）にすることで、表示が100%になった時点で必ず実際にも
     100%（勝利条件成立）であることを保証する */
  ctx.fillText(`こんがり ${Math.floor(pct * 100)}%`, mx + mw / 2, my + (mh - bh - 10) / 2 + 4);
  ctx.restore();
}

function _startBossVictory() {
  phase = 'bossVictory';
  _bossVictoryTimer = 0;
  if (_king) _king.scale = 1; // 戦闘スケールから等倍への収束目標に切り替える（_easeKingXform）
  launchFireworks();
  playSE('jackpot');
  unlockAch(KONGARI_ACH_ID); // ギヨウザをこんがり焼いた（最後の実績。ユーザー要望）
}

function _updateBossVictory() {
  _bossVictoryTimer++;
  if (_king) _easeKingXform();
  /* 勝利確定の瞬間、直前の試技で飛ばした文字がまだ吸い込まれフェード中の場合が
     あるため、決着後も完了まで動かし続ける（背景処理なので中断させない） */
  _updateKingCharFlights();
  if (_bossVictoryTimer % 6 === 0 && _king) {
    spawnParticle(
      _king.bx + (Math.random() - 0.5) * _BOSS_S * 0.7, _king.by - _BOSS_S * 0.3,
      (Math.random() - 0.5) * 0.6, -1.2 - Math.random() * 0.8,
      'rgba(255,240,220,0.6)', 60 + Math.random() * 30, 4 + Math.random() * 4);
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy -= 0.01; p.life--; }
  swapRemove(particles, _predParticle, _deadify);
}

function drawBossVictory() {
  if (phase !== 'bossVictory') return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    ctx.save();
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    drawKingCharFlights();
  }
  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* 文言はボスの裾（拡大アニメ中は dscale に連動して動く）のすぐ下に置く。
     旧実装は画面上部固定だったため、所持ギヨウザ表示・上部アイコンと重なっていた
     （ユーザー報告で発覚）。dscale基準なので拡大演出中も裾の位置と一緒に滑らかに動く。 */
  const titleY = _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
  outText('こんがり キングギヨウザ！', W / 2, titleY, '#ffdd55', 'rgba(60,20,0,0.9)', 8);
  if (_bossVictoryTimer > 90) {
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(_bossVictoryTimer * 0.08);
    ctx.font = `bold 15px 'Hiragino Mincho ProN',serif`;
    outText('（真エンディングは開発中）', W / 2, H - 60,
      '#d8d8ff', 'rgba(0,0,0,0.85)', 4);
    ctx.globalAlpha = 1;
    _drawBottomPillBadge('CONTINUE');
  }
  ctx.restore();
}

/* こんがり攻撃失敗がKING_MAX_FAILS回に達し、ルーレットが完全破壊された＝敗北。
   所持ギヨウザの半分がキングギヨウザに吸収され、通常ゲームへ戻る（ユーザー要望）。
   演出はdrawBossVictoryと対になる構成（暗幕・ボス・タイトル・CONTINUEバッジ）に
   揃え、既存の「勝利」との対称性を保つ */
function _startBossDefeat() {
  phase = 'bossDefeat';
  _bossDefeatTimer = 0;
  /* 敗北時のking値: 0（振り出しに戻す）ではなく、出現閾値の50%からやり直し
     にする（ユーザー要望）。戦闘開始時点で_initBossBattleが0にリセット済み
     のため、ここで上書きする */
  kingGyozaMeter = KING_GYOZA_THRESHOLD * 0.5;
  lsSaveStats();
  if (_king) {
    _king.scale = 1;
    /* 没収額は端数を切り上げる（半分を残すのではなく半分を取る側を優先）。
       これにより所持1の場合はceil(1/2)=1で残数ゼロまで没収され、
       「1だったら全部没収されてゲームオーバー」という直感的な期待に一致する
       （floorだと1所持時に没収0で何も没収されないまま復帰してしまっていた） */
    const lost = Math.ceil(coins / 2);
    coins -= lost;
    _king.lostCoins = lost; // 敗北画面での表示用（_kingBattleEndでのちに_kingがnullになるため先に記録）
    lsSave();
  }
  playSE('gameover');
}

function _updateBossDefeat() {
  _bossDefeatTimer++;
  if (_king) _easeKingXform();
  /* 勝利側と同様、直前に飛ばした文字の演出（跳ね返り等）を決着後も止めない */
  _updateKingCharFlights();
}

function drawBossDefeat() {
  if (phase !== 'bossDefeat') return;
  ctx.save();
  ctx.fillStyle = 'rgba(30,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
  if (_king) {
    ctx.save();
    ctx.translate(_king.dbx, _king.dby); ctx.scale(_king.dscale, _king.dscale);
    ctx.drawImage(_renderKingBody(), -_king.half, -_king.half, _king.half * 2, _king.half * 2);
    ctx.restore();
    drawKingCharFlights();
  }

  /* 没収で所持ギヨウザが尽きた場合は、通常モードのコイン枯渇時と全く同じ
     画面・同じ待ち方にする（ユーザー要望）。_drawGameOverTitleを共用し、
     こんがり失敗の見出しや没収個数の表示は出さない（通常のゲームオーバーの
     文言だけに揃える） */
  if (coins <= 0) {
    const alpha = Math.min(1, _bossDefeatTimer / 35);
    _drawGameOverTitle(alpha, _bossDefeatTimer, _bossDefeatTimer > 45);
    ctx.restore();
    return;
  }

  ctx.font = `bold ${IS_PORTRAIT ? 30 : 42}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const titleY = _king
    ? _king.dby + _BOSS_S * KING_VISUAL_BOTTOM_RATIO * _king.dscale + (IS_PORTRAIT ? 40 : 34)
    : (IS_PORTRAIT ? 90 : 70);
  outText('こんがり しっぱい……', W / 2, titleY, '#ff6655', 'rgba(40,0,0,0.9)', 8);
  /* 没収個数メッセージは画面下端からの固定オフセットを基本にしつつ、ボスの拡大
     アニメ（dscale→1）でtitleYが下がってきた場合はtitleYの下側に一定間隔を
     保つ側を優先する（Math.max）。固定オフセットだけだとボスが十分に育った
     状態でtitleYがそのオフセットを超え、見出しと重なってしまうため
     （実機指摘: 「下に表示される文字列が重なっている」） */
  if (_bossDefeatTimer > 40) {
    ctx.font = `bold 15px 'Hiragino Mincho ProN',serif`;
    const lost = _king ? _king.lostCoins : 0;
    outText(`ギヨウザ ${lost}個が 吸収された……`, W / 2, Math.max(H - 80, titleY + 40),
      '#d8d8ff', 'rgba(0,0,0,0.85)', 4);
  }
  if (_bossDefeatTimer > 90) {
    _drawBottomPillBadge('CONTINUE');
  }
  ctx.restore();
}

function drawBossDefeatOutro() {
  if (phase !== 'bossDefeatOutro' || !_defeatOutro) return;
  const o = _defeatOutro;
  ctx.save();
  ctx.fillStyle = 'rgba(2,4,8,0.7)';
  ctx.fillRect(0, 0, W, H);
  for (const g of o.items) drawOneItem(g);
  if (o.step >= 1) {
    /* 台詞演出は誕生予告（drawBossOmen）と同じ見せ方（過去行は薄く残して積む）だが、
       位置・サイズは別建てにする。誕生予告は4行ぶんの表示領域を見込んで
       H*0.30始まりにしているが（4行目=キングの登場位置の少し上で終わる想定）、
       こちらは2行しかなく同じ開始位置だと画面上寄りに偏って見える
       （実機指摘）。ここでは画面に固定のボスが存在しないぶん表示领域に余裕が
       あるため、2行の中心が画面中央(H/2)に来るよう配置し、行数が少ない分
       フォントもひとまわり大きくする */
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const fsL = IS_PORTRAIT ? 26 : 30;
    const lineDy = fsL * 2.2;
    const lineY0 = H / 2 - lineDy / 2; // 2行の中心を画面中央に揃える
    ctx.font = `bold ${fsL}px 'Hiragino Mincho ProN',serif`;
    for (let i = 0; i < o.step && i < _DEFEAT_OUTRO_LINES.length; i++) {
      const isCur = (i === o.step - 1);
      ctx.globalAlpha = isCur ? Math.min(1, o.timer / 20) : 0.5;
      outText(_DEFEAT_OUTRO_LINES[i], W/2, lineY0 + i*lineDy, '#e8e2d0', 'rgba(0,0,0,0.9)', 6);
    }
    ctx.globalAlpha = 1;
  }
  /* タップ待ちにせず時間経過で自動的に戻るため、CONTINUEバッジは出さない
     （ユーザー要望） */
  ctx.restore();
}

/* ════════════════ 吉祥雲 ════════════════ */
/* _drawCloudTo: 任意のコンテキストに雲を描く（OffscreenCanvas 事前描画用）
   drawCloud: メインcanvasへの呼び出し（_staticLayerCanvas が利用可能なら使わない） */
function _drawCloudTo(c2, cx, cy, sc, alpha, rot) {
  c2.save();
  c2.translate(cx, cy);
  c2.rotate(rot||0);
  c2.scale(sc, sc);
  c2.globalAlpha = alpha;
  c2.fillStyle   = Y;
  c2.beginPath();
  c2.moveTo(-50, 5);
  c2.bezierCurveTo(-60,6,-65,-4,-57,-10);
  c2.bezierCurveTo(-49,-16,-40,-8,-45,3);
  c2.bezierCurveTo(-46,9,-40,13,-34,8);
  c2.bezierCurveTo(-34,1,-26,-14,-16,-12);
  c2.bezierCurveTo(-13,-11,-11,-9,-10,-8);
  c2.bezierCurveTo(-12,-24,12,-24,10,-8);
  c2.bezierCurveTo(11,-9,13,-11,16,-12);
  c2.bezierCurveTo(26,-14,34,1,34,8);
  c2.bezierCurveTo(40,13,46,9,45,3);
  c2.bezierCurveTo(40,-8,49,-16,57,-10);
  c2.bezierCurveTo(65,-4,60,6,50,5);
  c2.bezierCurveTo(42,15,-42,15,-50,5);
  c2.closePath();
  c2.fill();
  c2.restore();
}
function drawCloud(cx, cy, sc, alpha, rot) { _drawCloudTo(ctx, cx, cy, sc, alpha, rot); }

/* ════════════════ 獅子 ════════════════ */
/* _drawShishiTo: 任意のコンテキストに獅子を描く（OffscreenCanvas 事前描画用）
   drawShishi: メインcanvasへのラッパー */
function _drawShishiTo(c2, cx, cy, sc, mirX) {
  c2.save();
  c2.translate(cx, cy);
  c2.scale(mirX ? -sc : sc, sc);

  /* 胴体・脚（最背面に描画 → たてがみ・顔の下に隠れる） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.ellipse(-23,20,13,16,0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 23,20,13,16,-0.15,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,12,29,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-32,44,11,18,0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 32,44,11,18,-0.1,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(0,28,22,20,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,36,11,18,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 38,62,16,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse(-16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.ellipse( 16,54,14,9,0,0,Math.PI*2); c2.fill();
  c2.fillStyle=GN;
  for (const [x,y,r] of [[-10,8,5],[10,8,5],[0,18,5],[-22,20,4],[22,20,4]]) {
    c2.beginPath(); c2.arc(x,y,r,0,Math.PI*2); c2.fill();
  }
  /* 尻尾: 根元は体の側面、先端が横外側（+やや上）を向く
     rotate(-1.2)で先端がx負方向=外側へ。mirXで右獅子は右外側に自動反転 */
  c2.save();
  c2.translate(-44, 40);
  c2.rotate(-1.2);
  c2.beginPath();
  c2.moveTo(0,-24);
  c2.bezierCurveTo( 9,-14, 11, 3, 0, 15);
  c2.bezierCurveTo(-11,  3, -9,-14, 0,-24);
  c2.closePath();
  c2.fillStyle=Y; c2.fill();
  c2.restore();

  /* たてがみ: 全周に巻き貝・渦巻きカール（狛犬スタイル）
     上部3個(i=8,9,10)・下部3個(i=2,3,4)は顔より前面に描画 */
  const _hx = 0, _hy = -28, _ringR = 45, _cR = 17, _N = 12, _WR = 1.22;
  const _drawCurl = i => {
    const a = (i / _N) * Math.PI * 2;
    const cx = _hx + Math.cos(a) * _ringR, cy = _hy + Math.sin(a) * _ringR;
    c2.fillStyle = Y;
    c2.beginPath(); c2.ellipse(cx, cy, _cR*_WR, _cR, 0, 0, Math.PI*2); c2.fill();
    c2.save();
    c2.translate(cx, cy); c2.scale(_WR, 1);
    /* C字弧の開口を顔中心方向に向ける。
       現開口方向≈5.751rad、顔中心方向=a+π。差分を回転として加算。 */
    const _rot = (a + Math.PI) - 5.751;
    c2.globalAlpha = 0.6; // C字弧の濃さ
    c2.beginPath();
    c2.arc(-_cR*0.18, _cR*0.08, _cR*0.52, 0.35 + _rot, Math.PI*1.55 + _rot);
    c2.strokeStyle = GN; c2.lineWidth = _cR*0.3; c2.lineCap = 'round'; c2.stroke();
    c2.globalAlpha = 1;
    c2.restore();
  };
  /* 背面カール（顔の後ろ）: 左右の6個 */
  for (const i of [0,1,5,6,7,11]) _drawCurl(i);
  /* 顔の輪郭: 少し大きな緑の楕円を先に描いてボーダーを作る */
  c2.globalAlpha = 0.65;
  c2.fillStyle = GN;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR+4, 39, 0, 0, Math.PI*2); c2.fill();
  c2.globalAlpha = 1;
  /* 頭部楕円（横長）を上から描画 */
  c2.fillStyle = Y;
  c2.beginPath(); c2.ellipse(0,-28, 35*_WR, 35, 0, 0, Math.PI*2); c2.fill();
  /* 目: 緑塗りつぶし */
  c2.fillStyle=GN;
  c2.beginPath(); c2.arc(-17,-34,3.5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc(17,-34,3.5,0,Math.PI*2); c2.fill();
  /* 瞼: 顔色の大きな円で目の上部・外側寄りを覆う（左右対称） */
  c2.fillStyle=Y;
  c2.beginPath(); c2.arc(-17-2,-34-7,5,0,Math.PI*2); c2.fill();
  c2.beginPath(); c2.arc( 17+2,-34-7,5,0,Math.PI*2); c2.fill();
  /* 眉毛: 尻尾と同形状（ティアドロップ）、半透明で微妙な濃さ
     内側（鼻寄り）が高くなるよう傾ける（凛々しい表情） */
  c2.save();
  c2.globalAlpha = 0.30;
  for (const [ex, rot] of [[-17, 1.3], [17, -1.3]]) {
    c2.save();
    c2.translate(ex, -44);
    c2.rotate(rot);
    c2.beginPath();
    c2.moveTo(0,-10);
    c2.bezierCurveTo( 4,-5.5, 4.5, 1, 0, 6);
    c2.bezierCurveTo(-4.5, 1, -4,-5.5, 0,-10);
    c2.closePath();
    c2.fillStyle=GN; c2.fill();
    c2.restore();
  }
  c2.restore();
  /* 鼻（小さめ・少し上に） */
  c2.fillStyle=GN;
  c2.beginPath(); c2.ellipse(0,-21,5,3,0,0,Math.PI*2); c2.fill();
  /* 口: 人字型（犬っぽい口） */
  c2.strokeStyle=GN; c2.lineWidth=1.8; c2.lineCap='round'; c2.lineJoin='round';
  /* 人中（鼻下〜口中央）: 口にピッタリ接続 */
  c2.beginPath();
  c2.moveTo(0,-17); c2.lineTo(0,-13);
  c2.stroke();
  /* 口: Wの下二つのアーチを丸くした形（ω口）
     左右の口角(高め)→下方へアーチ→中央で合わさる */
  c2.beginPath();
  c2.moveTo(-7,-13);
  c2.quadraticCurveTo(-4,-10, 0,-13);
  c2.quadraticCurveTo(4,-10, 7,-13);
  c2.stroke();
  /* 前面カール: 下部中央(i=3)を最背面→左右(i=2,4)→上部(i=8,9,10) */
  _drawCurl(3);          // 下部中央: 最背面
  for (const i of [2,4,8,9,10]) _drawCurl(i);
  c2.restore();
}
function drawShishi(cx, cy, sc, mirX) { _drawShishiTo(ctx, cx, cy, sc, mirX); }

/* ════════════════ Draw helpers ════════════════ */

/* 縁取りテキスト: stroke を先に描いてから fill を重ねる */
function outText(text, x, y, fillStyle, strokeStyle, lw) {
  ctx.lineJoin    = 'round';
  ctx.lineWidth   = lw ?? 9;
  ctx.strokeStyle = strokeStyle ?? 'rgba(0,0,0,0.88)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(text, x, y);
}

function easeOutBack(t) {
  const c1=1.70158, c3=c1+1;
  return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
/* 右上/左上ボタン群共通の背景描画（roundRect + fill + gold border）
   active=true: トロフィーON時のゴールド強調背景 */
function _drawBtnBg(rect, active) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 6);
  ctx.fillStyle = active ? 'rgba(180,140,0,0.75)' : 'rgba(0,0,0,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(245,208,32,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

/* ピルバッジの外形パスを設定（beginPath〜closePath）。fill()/stroke()は呼び出し側で行う */
function _drawPillPath(bx, by, bw, bh) {
  const r = bh / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by,      bx + bw, by + bh, r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r,  by + bh);
  ctx.arcTo(bx,       by + bh, bx, by + bh - r, r);
  ctx.lineTo(bx,      by + r);
  ctx.arcTo(bx,       by,      bx + r, by, r);
  ctx.closePath();
}

/* ════════════════ Main draw ════════════════ */
function draw() {
  /* 画面シェイク */
  let shakeX = 0, shakeY = 0;
  if (hitType === 'gizagiza' && endTimer > 45) {
    const k = Math.min(1, (endTimer-45)/20);
    shakeX = Math.sin(endTimer*4.7)*5*k;
    shakeY = Math.cos(endTimer*3.3)*4*k;
  }
  if (hitType === 'gigigigi' && endTimer > 45) { // ギギギギ: もっと激しい振動
    const k = Math.min(1, (endTimer-45)/15);
    shakeX += (Math.random()-0.5)*14*k;
    shakeY += (Math.random()-0.5)*10*k;
  }
  if (phase === 'reach' && reachTimer > REACH_DECEL_FRAMES) { // リーチ減速後: 微振動
    shakeX += (Math.random()-0.5)*2;
    shakeY += (Math.random()-0.5)*1.5;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* グレースケールフィルター（CSSをcanvas要素に適用）
     ctx.filterはiOS Safari<18未サポートのため、canvas.style.filterを使用
     AudioParam.value は setValueCurveAtTime 中に intrinsic 値を返すブラウザがあるため
     JS 側で管理した grayRateCur を使用 */
  {
    const rate = Math.max(0.001, Math.min(1, grayRateCur));
    const f = rate < 0.995 ? `grayscale(${Math.round((1 - rate) * 90)}%)` : '';
    if (f !== _lastFilter) { canvas.style.filter = _lastFilter = f; }
  }

  /* 背景 + 吉祥雲 + 獅子 + 上下帯: すべて焼き込み済みの静的レイヤー1枚を drawImage
     キャッシュ未構築（OffscreenCanvas 未対応の古いブラウザ）はフォールバックで通常描画 */
  if (_staticLayerCanvas) {
    ctx.drawImage(_staticLayerCanvas, 0, 0, W, H);
  } else {
    ctx.fillStyle = bgGradient || '#0f5020'; ctx.fillRect(0,0,W,H);
    for (const c of CLOUDS) drawCloud(c.x,c.y,c.s,c.a,c.r);
    if (!IS_PORTRAIT) {
      ctx.globalAlpha = 0.6;
      drawShishi(78, 360, 0.82, false);
      drawShishi(983, 360, 0.82, true);
      ctx.globalAlpha = 1;
    }
    /* 上下帯 */
    ctx.fillStyle=Y; ctx.fillRect(0,0,W,6); ctx.fillRect(0,H-6,W,6);
    ctx.globalAlpha=0.4; ctx.fillRect(0,8,W,3); ctx.fillRect(0,H-11,W,3); ctx.globalAlpha=1;
  }

  /* 弓 (縦画面のみ) */
  if (IS_PORTRAIT && (phase==='idle'||phase==='reach')) drawBow();

  ctx.textBaseline='alphabetic'; // リセット

  /* ホイール（ボス戦闘中は非表示） */
  if (phase !== 'boss' && phase !== 'bossVictory' && phase !== 'bossDefeat' && phase !== 'bossDefeatOutro') {
    for (let i=0;i<4;i++) drawWheel(i);
  }

  /* キングギヨウザ予兆の霊（半透明で画面を横切る） */
  if (_omenGhost) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.drawImage(_omenGhost.oc, _omenGhost.x - _omenGhost.sz / 2, _omenGhost.y - _omenGhost.cy);
    ctx.restore();
  }

  /* 飛ぶ矢 (3D遠近法) */
  if (phase==='shooting') drawArrow3D();

  /* particles: 色×アルファ4段階でバッチ化して1色1fill（GPUフラッシュ最大512→数十回に削減）
     アルファは4段階量子化（フェード25フレームで十分滑らか） */
  if (particles.length > 0) {
    ctx.save();
    for (const p of particles) {
      const a = Math.min(0.999, p.life / 25);
      p._ab = (a * 4) | 0; // 0-3
    }
    const nc = _partColorList.length;
    for (let ab = 3; ab >= 0; ab--) {
      ctx.globalAlpha = (ab + 1) / 4;
      for (let ci = 0; ci < nc; ci++) {
        let started = false;
        for (let k = 0; k < particles.length; k++) {
          const p = particles[k];
          if (p._ab !== ab || p.ci !== ci) continue;
          if (!started) { ctx.beginPath(); started = true; }
          const r = Math.max(0.1, p.r);
          ctx.moveTo(p.x + r, p.y);
          ctx.arc(p.x, p.y, r, 0, Math.PI*2);
        }
        if (started) { ctx.fillStyle = _partColorList[ci]; ctx.fill(); }
      }
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  /* BETバー: ボス戦闘中はこんがりゲージに差し替え（同じ位置・寸法を共有） */
  if (phase !== 'boss' && phase !== 'bossVictory' && phase !== 'bossDefeat' && phase !== 'bossDefeatOutro') {
    if (IS_PORTRAIT) drawPortraitBottomBar(); else drawBottomBar();
  }
  drawCoinHeader();

  /* ── レイヤー構成(全当たり共通) ──────────────────
     1. オーバーレイ (暗幕)
     2. エフェクト面  (各当たりの演出)
     3. テキスト最前面
     ─────────────────────────────────────────────── */

  /* 1. オーバーレイ（ハズレは暗幕なし） */
  if (phase==='done'&&endTimer>45&&!isMissResult&&!isGameOver&&hitType!=='none') drawEndOverlay();
  if (phase==='reach')              drawReachOverlay();

  /* 2. エフェクト面 */
  if (_activeEffect?.draw && endTimer >= (_activeEffect.drawDelay ?? 0)) _activeEffect.draw();
  /* フィーバー堆積アイテム: _activeEffectがdrawItemsを担う場合を除いて常時描画 */
  if (items.length > 0 && _activeEffect?.draw !== drawItems) drawItems();
  drawUzaFlash(); // ウザウザフラッシュ（内部で hitType チェック済み）

  /* 白フラッシュ (リーチ大当たり確定の瞬間) */
  if (reachFlash > 0) {
    ctx.save();
    ctx.globalAlpha = reachFlash;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }


  /* 3. テキスト最前面 */
  if (phase==='done'&&endTimer>45&&(!isMissResult||isGameOver)&&!_jackpotAutoReset) drawEndScreen();
  /* ポップアップ: phaseを問わず常時描画（トライ横断フェードアウト） */
  if (missPopups.length > 0)   drawMissPopup();
  if (payoutPopups.length > 0) drawPayoutPopup();
  /* フィーバーバナー（開始/終了とも drawFeverBanner で統合） */
  if (feverStartBannerTimer > 0) drawFeverBanner(feverStartBannerTimer, null);
  if (feverEndBannerTimer > 0 && feverEndBannerReason) drawFeverBanner(feverEndBannerTimer, feverEndBannerReason);
  if (phase==='reach')              drawReachText();

  /* スタートアップ画面 */
  drawStartup();

  /* キングギヨウザ出現予告・戦闘・勝利演出（全画面演出・ボタン類より下、バッジ類より上） */
  drawBossOmen();
  drawBossBattle();
  drawBossVictory();
  drawBossDefeat();
  drawBossDefeatOutro();

  /* ビートシンクメーター＋JUST演出（通常のシンク統計はボス戦では無関係のため非表示） */
  if (phase !== 'boss' && phase !== 'bossVictory' && phase !== 'bossDefeat' && phase !== 'bossDefeatOutro') drawSyncMeter();
  drawSyncJust();

  /* スローハンドバッジ・フィーバーバッジ（最前面・上部中央） */
  drawSlowHandBadge();
  drawFeverBadge();
  drawBeatBonusBadge();
  drawContinueBadge();

  /* ── ポーズオーバーレイ ── */
  if (isPaused) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    /* 実績パネルが開いている間は "PAUSED" テキストを非表示（パネルが全面を覆うため） */
    if (!showAchievements) {
      ctx.fillStyle = 'rgba(245,208,32,0.95)';
      ctx.font = `bold 36px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PAUSED', W/2, H/2);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(245,208,32,0.4)';
      ctx.fillText('© 2026 Michiyasu ODAKI', W/2, H - 24);
    }
    ctx.restore();
  }

  /* 実績バナー・オーバーレイ（ポーズ暗幕の上に表示） */
  drawAchBanner();
  drawAchOverlay();

  /* ── 右上ボタン群（トロフィー・ミュート）常時最前面 ── */
  /* トロフィーボタン */
  ctx.save();
  _drawBtnBg(ACH_TROPHY, showAchievements);
  /* トロフィーアイコン: 完全再設計 - カップ→ネック→台座の正しいシルエット */
  ctx.translate(ACH_TROPHY.x + ACH_TROPHY.w / 2, ACH_TROPHY.y + ACH_TROPHY.h / 2);
  ctx.strokeStyle = '#f5d020';
  ctx.fillStyle   = '#f5d020';
  ctx.lineWidth   = 1.4;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  /* カップ本体 + ネック + 台座（一体の塗りつぶしパス）
     🏆絵文字シルエットをトレース:
     上辺 ±5.5, カップ壁がy=-5付近で最大幅x≈8, y=-2付近でx≈6, ネックy=0.5でx≈2.5
     台座 ±7, y=3〜7.5 */
  ctx.beginPath();
  ctx.moveTo(-5.5, -8.5);                                      // 上辺 左
  ctx.lineTo( 5.5, -8.5);                                      // 上辺 右
  ctx.bezierCurveTo( 8.25, -4.75,  7.25, -1.75,  2.5,  0.5); // 右壁（膨らみ→絞り込み）
  ctx.lineTo( 2,  0.5);  ctx.lineTo( 2,  3);                  // ネック右
  ctx.lineTo( 6,  3);    ctx.lineTo( 6,  7.5);                // 台座右
  ctx.lineTo(-6,  7.5);  ctx.lineTo(-6,  3);                  // 台座底・左
  ctx.lineTo(-2,  3);    ctx.lineTo(-2,  0.5);                // ネック左
  ctx.lineTo(-2.5, 0.5);                                       // カップ底 左
  ctx.bezierCurveTo(-7.25, -1.75, -8.25, -4.75, -5.5, -8.5); // 左壁（右の鏡）
  ctx.closePath();
  ctx.fill();

  /* 持ち手：カップ中段外側に付くD字アーク
     右壁: y=-5でx≈8, y=-2でx≈7 に合わせた外側カーブ */
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo( 7, -6.5);
  ctx.quadraticCurveTo(12.5, -5,  6, -3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-7, -6.5);
  ctx.quadraticCurveTo(-12.5, -5, -6, -3);
  ctx.stroke();
  ctx.restore();

  /* ── 全画面ボタン（Fullscreen API 対応環境のみ・常時最前面） ── */
  if (FS_SUPPORTED) {
    ctx.save();
    _drawBtnBg(FS_BTN_RECT, false);
    ctx.fillStyle = '#f5d020';
    ctx.translate(FS_BTN_RECT.x + FS_BTN_RECT.w / 2, FS_BTN_RECT.y + FS_BTN_RECT.h / 2);
    ctx.scale(_FS_ICON_SCALE, _FS_ICON_SCALE);
    ctx.translate(-12, -12); // 24×24 viewBox の中心揃え
    ctx.fill(_isFullscreen ? _FS_PATH_EXIT : _FS_PATH_ENTER);
    ctx.restore();
  }

  /* ── ミュートボタン（右上・常時最前面） ── */
  ctx.save();
  _drawBtnBg(MUTE_BTN, false);
  /* アイコンを中心座標基準で描く */
  ctx.translate(MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + MUTE_BTN.h / 2);
  const ic = '#f5d020'; // 全画面ボタンと同じ金色
  ctx.strokeStyle = ic; ctx.fillStyle = ic;
  ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* ミュート時: 右へ3px移動 + 1.2倍スケールで斜線の中央に揃える
     通常:   体 x=-9〜-4, コーン x=-4〜3（中心 x≈-3）
     ミュート: translate(3,0)+scale(1.2) → 体 x≈-7.8〜-2.2, コーン x≈-2.2〜6.6（中心 x≈-0.8） */
  const spkShift = audioMuted ? 2 : 0;
  ctx.save();
  ctx.translate(spkShift, 0);
  if (audioMuted) ctx.scale(0.95, 1.1); // ミュート時: 縦1.1倍・横0.95倍（横圧縮）
  /* スピーカー本体（台形＋四角） */
  ctx.fillRect(-9, -4, 5, 8);
  /* 台形コーン */
  ctx.beginPath();
  ctx.moveTo(-4, -4);
  ctx.lineTo( 3, -8);
  ctx.lineTo( 3,  8);
  ctx.lineTo(-4,  4);
  ctx.closePath();
  ctx.fill();
  if (!audioMuted) {
    /* 音波 小 */
    ctx.beginPath();
    ctx.arc(3, 0, 5, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
    /* 音波 大 */
    ctx.beginPath();
    ctx.arc(3, 0, 9, -Math.PI * 0.45, Math.PI * 0.45);
    ctx.stroke();
  }
  ctx.restore();
  if (audioMuted) {
    /* ミュート: 左上→右下の斜線（macOS スタイル）
       完全不透明の黒ボーダーでスピーカーをシャープに切り、上からゴールドを重ねる */
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
    ctx.strokeStyle = ic;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.stroke();
  }
  ctx.restore();

  /* ── ポーズボタン（左上・トロフィー下、startup以外・常時最前面） ── */
  if (phase !== 'startup') {
    ctx.save();
    _drawBtnBg(PAUSE_BTN, false);
    ctx.translate(PAUSE_BTN.x + PAUSE_BTN.w / 2, PAUSE_BTN.y + PAUSE_BTN.h / 2);
    ctx.fillStyle = '#f5d020';
    if (isPaused) {
      ctx.beginPath();
      ctx.moveTo(-5, -8); ctx.lineTo(-5, 8); ctx.lineTo(9, 0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(-6, -8, 4, 16);
      ctx.fillRect( 2, -8, 4, 16);
    }
    ctx.restore();
  }

  /* ── フィーバー内枠エフェクト: HSL色サイクル＋呼吸パルス ── */
  if (isFever && phase !== 'startup') {
    const t   = performance.now();
    const hue = (t / 20) % 360;                        // 色相サイクル（約7秒で一周）
    const pulse = 0.7 + 0.3 * Math.sin(t / 260);     // 呼吸（約1.6秒周期、min0.4〜max1.0）
    const lw  = IS_PORTRAIT ? 5 : 7;
    ctx.save();
    ctx.strokeStyle = `hsla(${hue}, 100%, 62%, ${pulse})`;
    ctx.lineWidth   = lw;
    ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
    ctx.restore();
  }

  /* ── ミュート時ビートパルス: 外枠の太さ変化 ── */
  if (audioMuted && phase !== 'startup') {
    const pulse = getBeatPulse();
    if (pulse > 0) {
      const lw = pulse * 6; // 最大6px
      ctx.save();
      ctx.strokeStyle = _BEAT_BORDER_COLORS[Math.min(31,pulse*31|0)];
      ctx.lineWidth = lw;
      ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  /* 画面全体フェード: 最前面・シェイク変形の外で描く（余韻を大切にした暗転つなぎ） */
  _drawScreenFade();
}

/* ════════════════ 描画関数群 ════════════════ */

/* ── BETボタン描画ヘルパー ── */
function _drawBetBtn(rect, label, canChange, fontSize) {
  roundRect(rect.x, rect.y, rect.w, rect.h, 8);
  ctx.fillStyle = canChange ? 'rgba(245,208,32,0.18)' : 'rgba(120,120,120,0.10)'; ctx.fill();
  ctx.strokeStyle = canChange ? 'rgba(245,208,32,0.55)' : 'rgba(120,120,120,0.25)';
  ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = `bold ${fontSize}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = canChange ? Y : 'rgba(180,180,180,0.35)';
  ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2);
}

function drawWheel(i) {
  const w=wheels[i], active=i===curIdx&&(phase==='idle'||phase==='reach');
  /* ビート拍動: アクティブホイールの強調度をキックに合わせてパルス */
  const bp = active ? getBeatPulse() : 0; // 0-1、ビート直後=1
  ctx.save(); ctx.translate(w.x,w.y);
  /* グロー光輪: セグメント描画前に1回だけ shadowBlur を使用し GPUブラーパスを集約
     旧: 各セグメントのfill/stroke/strokeText/fillText すべてに shadowBlur が効いて
         8〜12セグ × 4操作 = 32〜48 GPU ブラーパス/フレーム → Input Delay 17〜27ms の原因
     新: 外周リングを1ストロークするだけ = 1 GPU ブラーパス/フレーム */
  if (active) {
    if (_wheelGlowSprites) {
      /* プリレンダ済みグロー（bp 8段階量子化）+ クリスプなリング本体 */
      const g = _wheelGlowSprites[Math.min(_GLOW_LEVELS - 1, (bp * _GLOW_LEVELS) | 0)];
      ctx.drawImage(g.oc, -g.half, -g.half);
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
    } else {
      /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
      ctx.beginPath(); ctx.arc(0,0,WR+2,0,Math.PI*2);
      ctx.shadowColor=Y; ctx.shadowBlur=50+bp*40;
      ctx.strokeStyle=Y; ctx.lineWidth=3; ctx.stroke();
      ctx.shadowBlur=0; // セグメント描画前にリセット
    }
  }

  /* セグメント・文字・ハブ: 事前描画済み OffscreenCanvas を回転して貼る
     文字はホイール中心が下方になるよう _buildWheelOC で固定済み */
  if (w._oc) {
    ctx.save();
    ctx.rotate(w.rot);
    ctx.drawImage(w._oc, -_WHEEL_OC_R, -_WHEEL_OC_R, _WHEEL_OC_R*2, _WHEEL_OC_R*2);
    ctx.restore();
  } else {
    /* フォールバック: OffscreenCanvas 未対応時は従来描画（文字は回転なし） */
    for (const s of w.segs) {
      const a1=s.start+w.rot, a2=a1+s.span, mid=a1+s.span/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,WR,a1,a2); ctx.closePath();
      ctx.fillStyle=s.gradient; ctx.fill();
      ctx.strokeStyle='rgba(245,208,32,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
      const tx=Math.cos(mid)*WR*0.62, ty=Math.sin(mid)*WR*0.62;
      ctx.save(); ctx.translate(tx,ty);
      ctx.font=s.font; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.88)'; ctx.strokeText(s.char,0,0);
      ctx.fillStyle='#fffde7'; ctx.fillText(s.char,0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle=w.hubGrd; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+4,0,Math.PI*2);
  ctx.strokeStyle=active?Y:YD; ctx.lineWidth=active?4.5+bp*2.5:2; ctx.stroke();
  /* ビート拍動: 外側に広がる拍動リング（テーブルで文字列生成ゼロ） */
  if (bp > 0.01) {
    ctx.beginPath(); ctx.arc(0,0,WR+12+bp*14,0,Math.PI*2);
    ctx.strokeStyle=_BEAT_RING_COLORS[Math.min(31,bp*31|0)]; ctx.lineWidth=2+bp*2; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,WR+8,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,0,0.35)'; ctx.lineWidth=1.5; ctx.stroke();


  /* ポインタ三角形: PC=▼(上), 縦=◀(右から左向き)
     プリレンダ済みスプライト（グロー込み）を状態別に選択して drawImage */
  if (_pointerSprites) {
    const sp = w.locked ? _pointerSprites.locked
             : active   ? _pointerSprites.active[Math.min(3, (bp * 4) | 0)]
             : _pointerSprites.inactive;
    ctx.drawImage(sp.oc, sp.ox, sp.oy, sp.w, sp.h);
  } else {
    /* フォールバック: OffscreenCanvas 未対応時のみ shadowBlur を使用 */
    if (active || w.locked) {
      ctx.shadowColor = w.locked ? '#ff4422' : Y;
      ctx.shadowBlur  = 18 + bp * 18;
    }
    if (IS_PORTRAIT) {
      ctx.beginPath(); ctx.moveTo(WR+5,0); ctx.lineTo(WR+26,-12); ctx.lineTo(WR+26,12); ctx.closePath();
    } else {
      ctx.beginPath(); ctx.moveTo(0,-WR-5); ctx.lineTo(-13,-WR-28); ctx.lineTo(13,-WR-28); ctx.closePath();
    }
    ctx.fillStyle = w.locked ? '#cc2200' : (active ? Y : YD);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (w.result) {
    /* 結果文字はロック時に一度だけ OC へ焼き込み（グロー＋グリフラスタライズは1回のみ）
       毎フレームは drawImage 1回。ポップ拡縮は drawImage のスケールで再現する */
    if (!w._resOC) _buildResultOC(w);
    const pop=Math.max(0.01,easeOutBack(Math.min(1,w.resultPop)));
    ctx.save();
    if (IS_PORTRAIT) ctx.translate(WR+58, 0); else ctx.translate(0, WR+58);
    ctx.scale(pop,pop);
    if (w._resOC) {
      ctx.drawImage(w._resOC, -_RESULT_OC_HALF, -_RESULT_OC_HALF, _RESULT_OC_HALF*2, _RESULT_OC_HALF*2);
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      const [fillC, glowC] = _syncBarColor(w.syncScore);
      ctx.font=`bold 44px 'Hiragino Mincho ProN',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=glowC; ctx.shadowBlur=10 + w.syncScore * 20;
      ctx.fillStyle=fillC; ctx.fillText(w.result,0,0);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawArrow(x,y,embedded,angle=0) {
  ctx.save(); ctx.translate(x,y); if(angle) ctx.rotate(angle);
  const shaft=embedded?68:58;
  ctx.beginPath(); ctx.moveTo(0,embedded?0:4); ctx.lineTo(0,-shaft);
  ctx.strokeStyle='#7a4a10'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke();
  if (!embedded){
    ctx.beginPath(); ctx.moveTo(0,9); ctx.lineTo(-6,-5); ctx.lineTo(6,-5);
    ctx.closePath(); ctx.fillStyle='#555'; ctx.fill();
  }
  const fy=-shaft+12;
  ctx.strokeStyle=GN2; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(-13,fy-22); ctx.moveTo(0,fy); ctx.lineTo(13,fy-22); ctx.stroke();
  ctx.strokeStyle=YD; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,fy+10); ctx.lineTo(-9,fy-8); ctx.moveTo(0,fy+10); ctx.lineTo(9,fy-8); ctx.stroke();
  ctx.restore();
}

/* ── 矢の3D飛翔エフェクト ──────────────────────────────────
   弓道の映像のように矢を横から見た形(矢先→矢柄→矢羽)で描き、
   手前(大)→的(小)へ遠近スケールで縮小して飛ばす。
   矢先は常に的を向く。                                      ── */
function drawArrow3D() {
  const p = arrowProgress;
  if (p <= 0 || p >= 1) return;

  /* 発射から着弾への角度(固定) */
  const angle = Math.atan2(arrowTY - arrowSY, arrowTX - arrowSX);

  /* 残像3枚 + 本体1枚 */
  for (let trail = 3; trail >= 0; trail--) {
    const tp = Math.max(0, p - trail * 0.05);
    if (tp <= 0) continue;

    /* 位置: わずかにeaseして自然な加速感 */
    const ep = Math.pow(tp, 0.88);
    const sx = arrowSX + (arrowTX - arrowSX) * ep;
    const sy = arrowSY + (arrowTY - arrowSY) * ep;

    /* 遠近スケール: 近=3倍大, 遠=等倍 (縦画面は横移動なので等倍固定) */
    const sc = IS_PORTRAIT ? 1.0 : Math.max(1, (1 - tp) * 2 + 1);

    const al = Math.min(1, tp * 8) * (trail === 0 ? 1.0 : 0.22 - trail * 0.06);
    if (al <= 0.01) continue;

    ctx.save();
    ctx.globalAlpha = al;
    ctx.translate(sx, sy);
    ctx.rotate(angle); // 矢先が的方向(+x)を向くよう回転

    /* ── 矢のサイズ(スケール済み) ── */
    const half = 32 * sc;   // 矢の全長の半分
    const tipL = 13 * sc;   // 矢尻から矢先までの長さ
    const tipW =  5 * sc;   // 矢先の幅(半分)
    const fLen = 20 * sc;   // 矢羽の長さ
    const fW   =  9 * sc;   // 矢羽の最大幅
    const sw   = Math.max(1.5, 2.5 * Math.min(sc, 2)); // 矢柄の太さ

    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(half - tipL, 0);
    ctx.lineTo(-half + fLen, 0);
    ctx.strokeStyle = '#92400e';
    ctx.lineWidth   = sw;
    ctx.lineCap     = 'round';
    ctx.stroke();

    /* 矢先(三角形, +x方向が的) */
    ctx.beginPath();
    ctx.moveTo(half, 0);
    ctx.lineTo(half - tipL, -tipW);
    ctx.lineTo(half - tipL,  tipW);
    ctx.closePath();
    ctx.fillStyle = '#1f2937';
    ctx.fill();

    /* 上羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5, -fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#1e40af';
    ctx.fill();

    /* 下羽根 */
    ctx.beginPath();
    ctx.moveTo(-half + fLen, 0);
    ctx.lineTo(-half + fLen * 0.5,  fW);
    ctx.lineTo(-half, 0);
    ctx.closePath();
    ctx.fillStyle = '#b91c1c';
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ── 縦画面専用: 弓の描画 ── */
function drawBow() {
  /* 弦が左(射手側)、弓本体が右(的方向)に膨らむ正しい向き
     弦の両端 = (bx, by±38)、弓の腹 = bx + bulge の位置 */
  const bx = 30, by = WYS[curIdx];
  const bulge = 28; // 的方向への膨らみ量
  ctx.save();

  /* ── 矢を番えて引き絞った状態 ──
     弓: bx を中心に右(的方向)へ膨らむ ")" 形
     弦: 上端(bx,by-span)→筈(nockX,by)→下端(bx,by+span) のくの字
     矢: 筈(nockX) から右へ伸び、矢羽は筈の直前(矢先側)に配置
         ※ 羽は絶対に nockX より左(弦より奥)には出ない             */
  const pull     = 17;   // 弦の引き量(px)
  const halfSpan = 42;   // 弓の半張り
  const nockX    = bx - pull;          // 筈X = 弦の最も引かれた点
  const tipX     = nockX + 74;         // 矢先X

  /* 弓本体 */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.quadraticCurveTo(bx + bulge, by, bx, by + halfSpan);
  ctx.strokeStyle = '#7a3a0a'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  /* 弓ハイライト */
  ctx.beginPath();
  ctx.moveTo(bx + 1, by - halfSpan + 4);
  ctx.quadraticCurveTo(bx + bulge - 5, by, bx + 1, by + halfSpan - 4);
  ctx.strokeStyle = 'rgba(180,100,30,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  /* 弦 (くの字: 上端→筈→下端) */
  ctx.beginPath();
  ctx.moveTo(bx, by - halfSpan);
  ctx.lineTo(nockX, by);
  ctx.lineTo(bx, by + halfSpan);
  ctx.strokeStyle = 'rgba(220,190,80,0.92)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();

  /* ── 矢 ── */
  if (phase === 'idle' || phase === 'reach') {
    /* 矢柄 */
    ctx.beginPath();
    ctx.moveTo(nockX, by);
    ctx.lineTo(tipX - 12, by);
    ctx.strokeStyle = '#c08840'; ctx.lineWidth = 2.2; ctx.lineCap = 'butt'; ctx.stroke();

    /* 矢先 (鋭い三角形) */
    ctx.beginPath();
    ctx.moveTo(tipX,      by);
    ctx.lineTo(tipX - 13, by - 5);
    ctx.lineTo(tipX - 13, by + 5);
    ctx.closePath();
    ctx.fillStyle = '#2a3040'; ctx.fill();

    /* 矢羽: 平行四辺形
       下辺(軸側): vB → vF (矢柄上)
       上辺(外側): 下辺をそのまま筈方向へ shift ずらした辺
       → 横長の長方形を傾けたような不等辺平行四辺形             */
    const vB    = nockX + 3;  // 下辺・後端X
    const vF    = nockX + 13; // 下辺・前端X
    const vH    = 6;          // 羽の張り出し高さ
    const shift = 5;          // 上辺を筈側(左)へずらす量

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(vB,         by);          // 下辺・後端 (軸上)
      ctx.lineTo(vF,         by);          // 下辺・前端 (軸上)
      ctx.lineTo(vF - shift, by + s*vH);  // 上辺・前端 (外側)
      ctx.lineTo(vB - shift, by + s*vH);  // 上辺・後端 (外側)
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,0.93)'; ctx.fill();
      ctx.strokeStyle = 'rgba(160,160,160,0.5)'; ctx.lineWidth = 0.8; ctx.stroke();
    }

    /* 筈の印 (小さい暗色リング) */
    ctx.beginPath();
    ctx.arc(nockX + 1, by, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#5a3010'; ctx.fill();
  }
  ctx.restore();
}

/* タッチ座標をキャンバス座標に変換 */

  return {
    x: (touch.clientX - _canvasRect.left) * (W / _canvasRect.width),
    y: (touch.clientY - _canvasRect.top)  * (H / _canvasRect.height),
  };
}

/* ── エンド画面: オーバーレイのみ ── */
/* リーチ用フリッカーリングのスプライト（初回リーチ時に1回だけ生成、shadowBlur 排除） */
let _reachRingSprite = null;
function _getReachRingSprite() {
  if (_reachRingSprite || typeof OffscreenCanvas === 'undefined') return _reachRingSprite;
  const r = WR + 8, blur = 20;
  const half = Math.ceil(r + blur * 1.6 + 4);
  const oc = new OffscreenCanvas(half * 2 * _dpr, half * 2 * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr); c.translate(half, half);
  c.strokeStyle = 'rgba(245,208,32,0.7)'; c.lineWidth = 4;
  c.shadowColor = Y; c.shadowBlur = blur;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  _reachRingSprite = { oc, half };
  return _reachRingSprite;
}

/* ── リーチ演出: スポットライトオーバーレイ ── */
function drawReachOverlay() {
  const fadeIn = Math.min(1, reachTimer / 35);
  const wx = WXS[3], wy = WYS[3];

  ctx.save();

  /* 暗幕 */
  ctx.fillStyle = `rgba(0,0,0,${0.58 * fadeIn})`;
  ctx.fillRect(0, 0, W, H);

  /* スポットライト (第4ホイール中心に明るい円) */
  const pulse = 0.65 + 0.35 * Math.abs(Math.sin(reachTimer * 0.13));
  const spot  = ctx.createRadialGradient(wx, wy, 0, wx, wy, WR * 2.6);
  spot.addColorStop(0,   `rgba(245,208,32,${0.22 * pulse * fadeIn})`);
  spot.addColorStop(0.5, `rgba(245,208,32,${0.10 * pulse * fadeIn})`);
  spot.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, W, H);

  /* 減速が完了したらホイール枠をフリッカー
     グロー付きリングはスプライト転写（毎フレームの shadowBlur を排除） */
  if (reachTimer > REACH_DECEL_FRAMES) {
    const flicker = Math.floor(reachTimer / 8) % 2 === 0 ? 1 : 0.5;
    const rs = _getReachRingSprite();
    if (rs) {
      ctx.globalAlpha = flicker * fadeIn; // 基本アルファ0.7はスプライトに焼き込み済み
      ctx.drawImage(rs.oc, wx - rs.half, wy - rs.half, rs.half * 2, rs.half * 2);
      ctx.globalAlpha = 1;
    } else {
      /* フォールバック: OffscreenCanvas 未対応時 */
      ctx.beginPath();
      ctx.arc(wx, wy, WR + 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(245,208,32,${0.7 * flicker * fadeIn})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = Y;
      ctx.shadowBlur  = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  ctx.restore();
}

/* ── ハズレポップアップ（複数同時表示対応） ── */

  if (missPopups.length === 0) return;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  /* shadowBlur除去: 黒アウトライン(lw=6)で視認性は確保済み。GPU負荷削減。 */

    ctx.globalAlpha = alpha * 0.92;

function drawPayoutPopup() {

  ctx.font = `bold 42px 'Hiragino Mincho ProN',serif`;

  for (const p of payoutPopups) {

  ctx.restore();

function drawEndOverlay() {

  /* 大当たりはギヨウザを見せるため薄め、ウザウザも半透明 */
  const overlayAlpha = hitType==='jackpot'  ? alpha*0.48
                     : hitType==='uzauza'   ? alpha*0.55

/* ── 固定タイトル文字のプリレンダキャッシュ（shadowBlur 排除 第2弾） ──
   エンド画面・リーチ演出のタイトルは固定文字列 × 固定スタイルのため、
   初回使用時にグロー込みで OC へ焼き、毎フレームは drawImage 1回にする
   （shadowBlur は Canvas 2D 最重量級の GPU 操作。v3.72 と同じ手法の水平展開）。
   LRU 上限でメモリを制限。OffscreenCanvas 未対応時は従来描画へフォールバック。 */
const _titleOCCache = new Map(); // key → { oc, w, h }
const _TITLE_CACHE_MAX = 8;
function _titleCachePrune() {
  while (_titleOCCache.size > _TITLE_CACHE_MAX) {
    _titleOCCache.delete(_titleOCCache.keys().next().value); // 最古（先頭）を削除
  }
}
/* outText + shadowBlur 相当をキャッシュ付きで描く。(x,y) はテキスト中心。
   注意: 呼び出し時に ctx.shadowBlur が 0 であること（drawImage にも影が乗るため） */
function _outTextCached(key, text, font, fill, stroke, lw, glowC, glowB, x, y) {
  if (typeof OffscreenCanvas === 'undefined') {
    ctx.font = font;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = glowC; ctx.shadowBlur = glowB;
    outText(text, x, y, fill, stroke, lw);
    ctx.shadowBlur = 0;
    return;
  }
  let e = _titleOCCache.get(key);
  if (!e) {
    ctx.save(); ctx.font = font;
    const tw = Math.ceil(ctx.measureText(text).width);
    ctx.restore();
    const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
    const pad = Math.ceil(glowB * 1.6 + lw + 8);
    const w = tw + pad * 2, h = fs + pad * 2;
    const oc = new OffscreenCanvas(w * _dpr, h * _dpr);
    const c  = oc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    /* outText と同じ順序: 影付き stroke → 影付き fill（グローの重なりを再現） */
    c.shadowColor = glowC; c.shadowBlur = glowB;
    c.lineWidth = lw; c.strokeStyle = stroke;
    c.strokeText(text, w / 2, h / 2);
    c.fillStyle = fill;
    c.fillText(text, w / 2, h / 2);
    e = { oc, w, h };
  } else {
    _titleOCCache.delete(key); // LRU: 再挿入で最新化
  }
  _titleOCCache.set(key, e);
  _titleCachePrune();
  ctx.drawImage(e.oc, x - e.w / 2, y - e.h / 2, e.w, e.h);
}
/* 超大当たり専用: フィル色がアニメーションするため「グロー+縁取り」だけ焼く。
   shadowOffset トリックで stroke/fill 両方の影のみ抽出し、フィルは毎フレーム上描きする */
function _bakeGlowStroke(key, text, font, stroke, lw, glowC, glowB) {
  ctx.save(); ctx.font = font;
  const tw = Math.ceil(ctx.measureText(text).width);
  ctx.restore();
  const fs  = parseInt(font.match(/(\d+)px/)[1], 10);
  const pad = Math.ceil(glowB * 1.6 + lw + 8);
  const w = tw + pad * 2, h = fs + pad * 2;
  const OFF = 4096; // 本体を画面外へ追い出して影だけスプライト内に落とす
  const oc = new OffscreenCanvas(w * _dpr, h * _dpr);
  const c  = oc.getContext('2d');
  c.scale(_dpr, _dpr);
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.shadowColor = glowC; c.shadowBlur = glowB; c.shadowOffsetX = OFF;
  c.lineWidth = lw; c.strokeStyle = stroke;
  c.strokeText(text, w / 2 - OFF, h / 2);
  c.fillStyle = '#fff';
  c.fillText(text, w / 2 - OFF, h / 2);
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0;
  c.strokeText(text, w / 2, h / 2);
  const e = { oc, w, h };
  _titleOCCache.set(key, e);
  _titleCachePrune();
  return e;
}

/* ゲームオーバー演出（暗幕＋タイトル＋点滅する再開案内）。通常モードのコイン枯渇時

  } else {

  const by = my + (mh - bh) / 2;
  roundRect(mx, by, mw, bh, bh / 2);
  ctx.fillStyle = 'rgba(40,40,40,0.7)'; ctx.fill();
  if (pct > 0) {
    roundRect(mx, by, mw * pct, bh, bh / 2);
    ctx.fillStyle = fillC;
    if (pct >= 0.9) { ctx.shadowColor = glowC; ctx.shadowBlur = 8; }
    ctx.fill(); ctx.shadowBlur = 0;
  }

  /* 目盛り線（25% / 50% / 75%） */
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let _ti = 0; _ti < 3; _ti++) {
    const lx = mx + mw * (_ti === 0 ? 0.25 : _ti === 1 ? 0.5 : 0.75);
    ctx.beginPath(); ctx.moveTo(lx, by); ctx.lineTo(lx, by + bh); ctx.stroke();
  }

  /* テキスト（ゲージ上に重ねる） */
  ctx.font = `bold 9px monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(220,220,220,0.7)';
  ctx.fillText(pctText, mx + 6, my + mh / 2);
  if (chainText) {
    ctx.textAlign = 'right';
    ctx.fillStyle = syncChain >= BEAT_BONUS_CHAIN
      ? _RAINBOW_COLORS[_rainbowIdx()]
      : '#f5d020';
    ctx.fillText(chainText, mx + mw - 6, my + mh / 2);
  }

  ctx.restore();
}

/* ── JUST/GOOD/OK ポップアップ ── */
function drawSyncJust() {
  if (syncJustTimer <= 0 || !syncJustLabel) return;
  const t = syncJustTimer / 50; // 1→0
  /* 最初の10fでフェードイン、残りでフェードアウト */
  const fadeIn  = Math.min(1, (1 - t) * 5);
  const fadeOut = t;
  const alpha   = fadeIn * fadeOut;
  if (alpha < 0.01) return;

  /* スケール: 発動直後に1.4倍→1.0に縮む */
  const scale = 1 + 0.4 * Math.pow(t, 0.5);

  /* 色: シンクメーターと同じ _syncBarColor を使用 */
  const [col, glw] = _syncBarColor(syncJustScore);

  /* 表示位置
     横: BETバー上端(H-106=414)の少し上 → y≈394、x=中央
     縦: 結果文字と同じx中心(WXS[0]=210)、第4的下・BETバー上 → y=712 */
  const px = IS_PORTRAIT ? WXS[0] : W / 2;
  const py = IS_PORTRAIT ? P_BAR_Y - 20 : BAR_Y - 20;
  const fs = IS_PORTRAIT ? 20  : 22;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.scale(scale, scale);
  ctx.font = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = glw; ctx.shadowBlur = 14;
  ctx.fillStyle = col;
  ctx.fillText(syncJustLabel, 0, 0);
  ctx.restore();
}

/* ── スローハンド発動中バッジ（上部中央、BGMレートに連動してフェード） ── */
function drawSlowHandBadge() {
  if (phase === 'startup') return;
  if (phase === 'tapestart') return; // ゲームオーバー復帰アニメーション中は非表示
  if (phase === 'bossOmen') return; // 予告のテープストップでグレー化してもバッジは出さない
  if (isGameOver) return;
  /* grayRateCur: 1.0=通常→alpha0, 0.5=スロー→alpha1 に線形マッピング */
  const alpha = Math.max(0, Math.min(1, (1.0 - grayRateCur) * 2));
  if (alpha < 0.01) return;

  /* ポップスケール: 発動直後に大きく出てeaseOutで縮む (25f→1.0x) */
  const POP_FRAMES = 25;
  const popScale = slowHandPopTimer > 0
    ? 1 + 1.4 * Math.pow(slowHandPopTimer / POP_FRAMES, 2)
    : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  const text  = '🐌  ス ロ ー ハ ン ド  発 動 中';
  const fs    = IS_PORTRAIT ? 13 : 14;
  ctx.font    = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw    = ctx.measureText(text).width;
  const padX  = 18, padY = 7;
  const bw    = tw + padX * 2;
  const bh    = fs + padY * 2;
  const bx    = (W - bw) / 2;
  const by    = IS_PORTRAIT ? 10 : 8;

  /* スケール変形: バッジ中心を基準に拡縮 */
  if (popScale !== 1) {
    ctx.translate(W / 2, by + bh / 2);
    ctx.scale(popScale, popScale);
    ctx.translate(-W / 2, -(by + bh / 2));
  }

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(20,10,60,0.82)';
  ctx.fill();
  ctx.strokeStyle = `rgba(160,130,255,${0.7 * alpha})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  /* テキスト */
  ctx.fillStyle = '#e8d8ff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, by + bh / 2);

  ctx.restore();
}

function drawBeatBonusBadge() {
  if (phase === 'startup' || phase === 'tapestart' || isGameOver) return;
  if (syncChain < BEAT_BONUS_CHAIN) return;

  /* BETバー直下・同期メーターと同じ高さに配置（B案: 下部エリア） */
  const by = IS_PORTRAIT ? P_BAR_Y + P_BAR_H + 2 : BAR_Y + BAR_H + 2;
  const text = '♪BONUS READY';
  const fs   = 9; // 2/3サイズ（キャンバス内に収める）
  ctx.save();
  ctx.font = `bold ${fs}px 'Hiragino Mincho ProN',serif`;
  const tw = ctx.measureText(text).width;
  const padX = 12, padY = 4;
  const bw = tw + padX * 2;
  const bh = fs + padY * 2;
  const bx = (W - bw) / 2;

  /* 背景ピル */
  _drawPillPath(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(10,20,10,0.85)'; ctx.fill();
